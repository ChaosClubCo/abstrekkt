async function callClaude(system, userMsg) {
  if (!(window.cowork && typeof window.cowork.askClaude === "function")) {
    throw new Error("window.cowork.askClaude unavailable — open this artifact inside Cowork.");
  }
  const res = await window.cowork.askClaude(system + "\n\n────────────\n\n" + userMsg, []);
  if (typeof res === "string") return res;
  if (res && typeof res.text === "string") return res.text;
  if (res && Array.isArray(res.content)) {
    const t = res.content.find(b => b.type === "text");
    if (t && t.text) return t.text;
  }
  if (res && typeof res.result === "string") return res.result;
  throw new Error("Unexpected askClaude response shape: " + JSON.stringify(res).slice(0, 200));
}

    const p0 = items.filter(i => i.p === "P0").length;
    const p1 = items.filter(i => i.p === "P1").length;
    const ordered = ["P0", "P1", "P2", "P3"].flatMap(p => items.filter(i => i.p === p));
    return '<div class="ws-block"><div class="ws-hd">' +
      '<span class="dot" style="background:' + w.color + ';margin-top:0"></span>' +
      '<span class="ws-name">' + esc(w.label) + "</span>" +
      '<span class="ws-status" style="color:' + w.color + ';background:' + w.color + "22;border:1px solid " + w.color + '44">' + esc(w.status) + "</span>" +
      '<div class="ws-right">' +
      (p0 > 0 ? '<span class="hot" style="color:#EF4444;background:#7F1D1D44;border:1px solid #EF444433">P0 ×' + p0 + "</span>" : "") +
      (p1 > 0 ? '<span class="hot" style="color:#F59E0B;background:#78350F44;border:1px solid #F59E0B33">P1 ×' + p1 + "</span>" : "") +
      '<span class="ws-count">' + items.length + " items</span></div></div>" +
      '<div class="ws-bd">' + ordered.map(i => cardHTML(i, false)).join("") + "</div></div>";
  }).join("");
  return html;
}
function promptsViewHTML() {
  const done = Object.keys(state.prompts).length;
  const total = ITEMS.length;
  const pct = Math.round(done / total * 100);
  const rem = total - done;
  let html = '<div class="pv-top"><div class="pv-prog">' +
    '<div class="pv-lbl">' + done + " of " + total + " prompts generated" + (state.genAllRunning ? " — generating " + state.genAllDone + "/" + state.genAllTotal + "…" : "") + "</div>" +
    '<div class="pv-bar"><div class="pv-fill" style="width:' + pct + '%"></div></div></div>' +
    '<button class="gen-btn" style="padding:7px 14px;font-size:12px" data-action="genall"' + (state.genAllRunning ? " disabled" : "") + ">" +
    (state.genAllRunning ? "⏳ " + state.genAllDone + "/" + state.genAllTotal + "…" : rem > 0 ? "✦ Generate remaining " + rem : "↺ Regenerate all") +
    "</button></div>";
  html += ["P0", "P1", "P2", "P3"].map(p => {
    const pm = PM[p];
    const items = ITEMS.filter(i => i.p === p);
    const pdone = items.filter(i => state.prompts[i.id]).length;
    let grp = '<div style="margin-bottom:16px"><div class="pv-grp" style="color:' + pm.tx + ";background:" + pm.bg + '">' + pm.label + ' <span style="opacity:.65">' + pdone + "/" + items.length + "</span></div>";
    grp += items.map(item => {
      const pt = state.prompts[item.id], er = state.errors[item.id], g = state.generating[item.id];
      const bd = pt ? "#2A2A3A" : er ? "#EF444433" : "#1E1E2E";
      let row = '<div class="pv-row" style="border:1px solid ' + bd + '"><div class="pv-row-hd"' + (pt || er || g ? ' style="margin-bottom:8px"' : "") + ">" +
        '<span class="dot" style="background:' + pm.dot + ';margin-top:0"></span>' +
        '<span class="pv-cap">' + esc(item.cap) + "</span>" +
        '<span style="font-size:10px;color:' + WS[item.ws].color + '">' + esc(WS[item.ws].label) + "</span>" +
        '<button class="gen-btn" style="font-size:10px;padding:3px 8px" data-action="gen" data-id="' + item.id + '"' + (g ? " disabled" : "") + ">" +
        (g ? "⏳ Generating…" : pt ? "↺ Regen" : "✦ Generate") + "</button>" +
        (pt ? '<button class="copy-btn" style="font-size:10px" data-action="copy" data-id="' + item.id + '">⎘ Copy</button>' : "") +
        "</div>";
      if (g) row += '<div class="hint2">Generating…</div>';
      else if (er) row += '<div class="err-box">' + esc(er) + "</div>";
      else if (pt) row += '<div class="prompt-box">' + esc(pt) + "</div>";
      row += "</div>";
      return row;
    }).join("");
    return grp + "</div>";
  }).join("");
  return html;
}
const SUGS = [
  "What do I actually do this week?",
  "Fastest path to unblock Fusion AI?",
  "How do I get The Prompt live today?",
  "chaosclub.co — what's the highest-risk gap?",
  "Is Growth Detector worth automating yet?",
  "Which AI provider is costing us the most right now?",
  "Should chaosclub.co stay on Gemini or switch to Claude?",
  "What's in skills-pipeline and does it replace the agent teams build?",
  "Should I populate the monorepo or go cloneless with GitHub MCP?",
];
function askViewHTML() {
  let msgsHtml;
  if (state.msgs.length === 0) {
    msgsHtml = '<div class="empty"><div style="font-size:28px;margin-bottom:10px">✦</div>' +
      '<div style="font-size:13px;color:#9CA3AF;margin-bottom:18px">Ask anything about FlashFusion workstreams, blockers, or next steps</div>' +
      '<div class="sugs">' + SUGS.map(sg => '<button class="sug" data-action="sug" data-q="' + esc(sg) + '">' + esc(sg) + "</button>").join("") + "</div></div>";
  } else {
    msgsHtml = state.msgs.map(m =>
      '<div class="msg-row" style="justify-content:' + (m.role === "user" ? "flex-end" : "flex-start") + '"><div class="msg ' + (m.role === "user" ? "user" : "asst") + '">' + esc(m.content) + "</div></div>"
    ).join("");
  }
  if (state.loading) msgsHtml += '<div class="msg-row"><div class="msg asst" style="color:#9CA3AF">Thinking…</div></div>';
  return '<div class="ask-wrap"><div class="msgs" id="msgs">' + msgsHtml + "</div>" +
    '<div class="ask-bar">' +
    '<input class="ask-input" id="askInput" aria-label="Ask about FlashFusion workstreams, blockers, next steps" placeholder="Ask about FlashFusion workstreams, blockers, next steps…" value="' + esc(state.inputVal) + '">' +
    '<button class="send-btn" id="sendBtn" data-action="send"' + ((!state.inputVal.trim() || state.loading) ? " disabled" : "") + ">Send</button></div></div>";
}
// ─── RENDER: SHELL ───────────────────────────────────────────────────────
function render() {
  const wasFocused = document.activeElement && document.activeElement.id === "askInput";
  const y = window.scrollY;
  const pdone = Object.keys(state.prompts).length;
  const counts = { P0: 0, P1: 0, P2: 0, P3: 0 };
  ITEMS.forEach(i => counts[i.p]++);
  const navBtn = (v, lbl) => '<button class="nav-btn' + (state.view === v ? " active" : "") + '" data-action="nav" data-id="' + v + '">' + lbl + "</button>";
  let html = '<div class="hdr"><div><div class="hdr-title">FlashFusion Workstream Mapper</div>' +
    '<div class="hdr-sub">June 2026 · ' + ITEMS.length + " items · " + Object.keys(WS).length + " workstreams" + (pdone > 0 ? " · " + pdone + " prompts" : "") + "</div></div>" +
    '<div class="nav">' + navBtn("board", "Priority board") + navBtn("ws", "Workstreams") +
    navBtn("prompts", pdone > 0 ? "Prompts (" + pdone + ")" : "Prompts") + navBtn("ask", "Ask Claude ✦") + "</div></div>";
  html += '<div class="stats">' + ["P0", "P1", "P2", "P3"].map(p =>
    '<div class="stat"><span class="stat-n" style="color:' + PM[p].dot + '">' + counts[p] + '</span><span class="stat-l">' + p + "</span></div>"
  ).join("") +
    '<div class="stats-ws">' + Object.entries(WS).map(([id, w]) => {
      const hot = ITEMS.filter(i => i.ws === id && (i.p === "P0" || i.p === "P1")).length;
      return '<span><span style="color:' + w.color + '">●</span> ' + esc(w.label.split(" ")[0]) + ' <span style="color:' + (hot > 0 ? "#F59E0B" : "#6B7280") + (hot > 0 ? ";font-weight:600" : "") + '">' + hot + "</span></span>";
    }).join("") + "</div></div>";
  html += '<div class="body">';
  if (state.view === "board") html += boardHTML();
  else if (state.view === "ws") html += wsViewHTML();
  else if (state.view === "prompts") html += promptsViewHTML();
  else html += askViewHTML();
  html += "</div>";
  document.getElementById("app").innerHTML = html;
  if (state.view === "ask") {
    const m = document.getElementById("msgs");
    if (m) m.scrollTop = m.scrollHeight;
    const inp = document.getElementById("askInput");
    if (inp) {
      inp.addEventListener("input", e => {
        state.inputVal = e.target.value;
        const btn = document.getElementById("sendBtn");
        if (btn) btn.disabled = !state.inputVal.trim() || state.loading;
      });
      inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
      if (wasFocused || state.msgs.length === 0) inp.focus();
    }
  } else {
    window.scrollTo(0, y);
    if (state.focusCard) {
      const fc = document.querySelector('.card[data-action="toggle"][data-id="' + state.focusCard + '"]');
      if (fc) fc.focus();
      state.focusCard = null;
    }
  }
}
// ─── ACTIONS ─────────────────────────────────────────────────────────────
async function genPrompt(id) {
  if (state.generating[id]) return;
  const item = ITEMS.find(i => i.id === id);
  if (!item) return;
  state.generating[id] = true;
  delete state.errors[id];
  render();
  try {
    const text = await callClaude(PROMPT_SYS,
      "Capability: " + item.cap + "\nWorkstream: " + WS[item.ws].label + " (" + item.p + ")\nTag: " + item.tag +
      "\nEffort: " + item.ef + "\nBlocked: " + item.bk + "\nUnblocked: " + item.ub + "\nNext step: " + item.ns);
    state.prompts[id] = text;
    lsSet("ffwm_prompts", state.prompts);
  } catch (err) {
    state.errors[id] = err && err.message ? err.message : String(err);
  }
  delete state.generating[id];
  render();
}
async function genAll() {
  if (state.genAllRunning) return;
  const targets = ITEMS.filter(i => !state.prompts[i.id]);
  if (!targets.length) { state.prompts = {}; lsSet("ffwm_prompts", state.prompts); render(); return; }
  state.genAllRunning = true; state.genAllDone = 0; state.genAllTotal = targets.length;
  render();
  for (let i = 0; i < targets.length; i++) {
    await genPrompt(targets[i].id);
    state.genAllDone = i + 1;
    render();
  }
  state.genAllRunning = false;
  render();
}
async function sendMsg() {
  if (!state.inputVal.trim() || state.loading) return;
  const txt = state.inputVal.trim();
  state.inputVal = "";
  state.msgs.push({ role: "user", content: txt });
  state.loading = true;
  render();
  try {
    const convo = state.msgs.map(m => m.role + ": " + m.content).join("\n\n");
    const text = await callClaude(ASSISTANT_SYS, convo);
    state.msgs.push({ role: "assistant", content: text });
  } catch (err) {
    state.msgs.push({ role: "assistant", content: "Error: " + (err && err.message ? err.message : String(err)) });
  }
  state.loading = false;
  lsSet("ffwm_msgs", state.msgs);
  render();
}
// ─── EVENT DELEGATION ────────────────────────────────────────────────────
document.addEventListener("click", e => {
  const stopEl = e.target.closest("[data-stop]");
  const actEl = e.target.closest("[data-action]");
  if (!actEl) return;
  const action = actEl.getAttribute("data-action");
  const id = actEl.getAttribute("data-id");
  if (action === "toggle") {
    if (stopEl && actEl.contains(stopEl)) return; // click inside expanded body — ignore unless inner action
    state.open[id] = !state.open[id];
    render();
  } else if (action === "nav") {
    state.view = id; lsSet("ffwm_view", state.view); render();
  } else if (action === "wsfilter") {
    state.wsFilter = id; render();
  } else if (action === "gen") {
    e.stopPropagation(); genPrompt(id);
  } else if (action === "copy") {
    e.stopPropagation();
    if (state.prompts[id]) copyText(state.prompts[id]);
    actEl.textContent = "✓ Copied"; setTimeout(() => { actEl.textContent = "⎘ Copy"; }, 1200);
  } else if (action === "genall") {
    genAll();
  } else if (action === "sug") {
    state.inputVal = actEl.getAttribute("data-q") || "";
    render();
  } else if (action === "send") {
    sendMsg();
  }
}, true);
// ─── KEYBOARD: Enter/Space toggles a focused card (a11y) ───────────────────
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target && e.target.classList && e.target.classList.contains("card") && e.target.getAttribute("data-action") === "toggle" ? e.target : null;
  if (!card) return;
  if (document.activeElement !== card) return;
  e.preventDefault();
  const id = card.getAttribute("data-id");
  state.open[id] = !state.open[id];
  state.focusCard = id;
  render();
});
render();
</script>
