<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 · Prompt Package Builder — FlashFusion</title>
<link rel="stylesheet" href="../assets/design-system.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../assets/suite.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const USECASES={
  "Writing & Communication":["Draft professional emails from bullet points","Rewrite for conciseness","Summarize long threads","Draft announcements","Write meeting agendas"],
  "Documents & Reports":["Convert notes to structured reports","Draft executive summaries","Create status updates","Generate templates","Proofread and improve"],
  "Research & Analysis":["Research and summarize","Compare with pros/cons","Extract data from docs","Synthesize multiple sources","Fact-check claims"],
  "Planning & Organization":["Break down projects","Build meeting agendas","Create weekly plans","Prioritize a backlog","Draft OKRs from strategy"],
  "Technical":["Write or debug code","Generate test cases","Document a codebase","Draft runbook steps","Explain tech to non-tech"]
};

function buildPrompt(role, useCase){
  const r = role && role.trim() ? role.trim() : "a professional";
  return `You are an expert assistant helping ${r}.\n\nTask: ${useCase}.\n\nInstructions:\n- Ask one clarifying question if anything essential is missing, then proceed.\n- Match a clear, professional tone unless I say otherwise.\n- Return the result in a clean, ready-to-use format.\n- If you are uncertain about a fact, say so rather than guessing.\n\nContext I'll provide: [paste the source material, notes, or details here]`;
}

function App(){
  const [intakes]=useState(()=>RR.load("intake-records-v1",[]));
  const [selId,setSelId]=useState(intakes[0]?.id||"");
  const [role,setRole]=useState(intakes[0]?.role||"");
  const [picked,setPicked]=useState([]);
  const [packages,setPackages]=useState(()=>RR.load("prompt-packages-v1",[]));
  const [copied,setCopied]=useState("");
  useEffect(()=>RR.save("prompt-packages-v1",packages),[packages]);

  const onPick=(id)=>{ setSelId(id); const i=intakes.find(x=>x.id===id); if(i) setRole(i.role||""); };
  const toggle=(uc)=>setPicked(p=>p.includes(uc)?p.filter(x=>x!==uc):[...p,uc]);
  const pkg = picked.map(uc=>({useCase:uc,prompt:buildPrompt(role,uc)}));

  const copyAll=()=>{
    const text = pkg.map((p,i)=>`### ${i+1}. ${p.useCase}\n\n${p.prompt}`).join("\n\n---\n\n");
    navigator.clipboard.writeText(text); setCopied("all"); setTimeout(()=>setCopied(""),1800);
  };
  const savePkg=()=>{
    if(!pkg.length)return;
    const name = intakes.find(x=>x.id===selId)?.name || "Unassigned";
    setPackages(p=>[{id:RR.uid(),name,role,count:pkg.length,created:RR.today(),items:pkg},...p]);
  };

  return (
    <div style={{maxWidth:880,margin:"0 auto",padding:"40px 24px 80px"}}>
      <a href="../index.html" className="rr-mono" style={{fontSize:11}}>&larr; Suite</a>
      <div style={{margin:"14px 0 28px",borderBottom:"1px solid var(--border)",paddingBottom:20}}>
        <div className="rr-eyebrow">02 · Prompt Package Builder</div>
        <h1 className="rr-head" style={{fontSize:30,margin:"8px 0 6px"}}>Build the package</h1>
        <p style={{color:"var(--text2)",fontSize:14}}>Pick use cases, get copy-ready prompts tuned to the champion's role.</p>
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div>
            <label className="rr-label">Champion (from intake)</label>
            <select className="rr-select" value={selId} onChange={e=>onPick(e.target.value)}>
              <option value="">— none / manual —</option>
              {intakes.map(i=><option key={i.id} value={i.id}>{i.name} ({i.role||"role n/a"})</option>)}
            </select>
            {intakes.length===0 && <p className="rr-mono" style={{fontSize:10,color:"var(--accent)",marginTop:6}}>No intakes yet — fill Tool 01 first, or set role manually.</p>}
          </div>
          <div><label className="rr-label">Role used in prompts</label><input className="rr-input" value={role} onChange={e=>setRole(e.target.value)} placeholder="e.g. a real estate agent" /></div>
        </div>
      </div>

      {Object.entries(USECASES).map(([cat,list])=>(
        <div className="rr-card" style={{marginBottom:12}} key={cat}>
          <div className="rr-eyebrow" style={{color:"var(--text2)"}}>{cat}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:10}}>
            {list.map(uc=><span key={uc} className={"rr-chip"+(picked.includes(uc)?" on":"")} onClick={()=>toggle(uc)}>{uc}</span>)}
          </div>
        </div>
      ))}

      {pkg.length>0 && <div style={{marginTop:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div className="rr-eyebrow">Generated package · {pkg.length}</div>
          <div style={{display:"flex",gap:8}}>
            <button className="rr-btn" onClick={copyAll}>{copied==="all"?"✓ Copied":"Copy all"}</button>
            <button className="rr-btn accent" onClick={savePkg}>Save package</button>
          </div>
        </div>
        {pkg.map((p,i)=><div key={i} className="rr-card" style={{marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:14,color:"var(--text)"}}>{p.useCase}</div>
            <button className="rr-btn" onClick={()=>{navigator.clipboard.writeText(p.prompt);setCopied(i);setTimeout(()=>setCopied(""),1500);}} style={{padding:"4px 10px"}}>{copied===i?"✓":"Copy"}</button>
          </div>
          <pre style={{whiteSpace:"pre-wrap",fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:"var(--text2)",marginTop:10,lineHeight:1.6,background:"var(--bg)",padding:"12px 14px",borderRadius:2,border:"1px solid var(--border)"}}>{p.prompt}</pre>
        </div>)}
      </div>}

      {packages.length>0 && <div style={{marginTop:36}}>
        <div className="rr-eyebrow" style={{color:"var(--text3)"}}>Saved packages · {packages.length}</div>
        <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:8}}>
          {packages.map(p=><div key={p.id} className="rr-card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 18px"}}>
            <div><div style={{fontSize:14}}>{p.name} <span style={{color:"var(--text3)",fontSize:12}}>· {p.count} prompts</span></div><div className="rr-mono" style={{fontSize:10,marginTop:3}}>{p.created}</div></div>
            <button className="rr-btn" onClick={()=>setPackages(x=>x.filter(z=>z.id!==p.id))} style={{borderColor:"var(--border)"}}>Delete</button>
          </div>)}
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
