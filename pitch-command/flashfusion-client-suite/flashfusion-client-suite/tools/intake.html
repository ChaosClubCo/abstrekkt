<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 · Pre-Session Intake — FlashFusion</title>
<link rel="stylesheet" href="../assets/design-system.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../assets/suite.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const TOOLS=["Microsoft 365","Google Workspace","Slack","Microsoft Teams","Notion","Jira / Confluence","GitHub / GitLab","Salesforce / HubSpot","Asana / Linear / Monday","Zapier / Make / n8n","Figma / Canva","Power BI / Tableau","VS Code / IDE","Terminal / CLI","Python / JavaScript"];
const LITERACY=[{v:"none",l:"None",d:"Never used an AI tool"},{v:"casual",l:"Casual",d:"Used ChatGPT or similar a few times"},{v:"regular",l:"Regular",d:"Uses AI tools weekly"},{v:"power",l:"Power",d:"Builds prompts, uses Projects/memory"},{v:"advanced",l:"Advanced",d:"API, Claude Code, agents, MCP"}];
const GOALS=["Save time on repetitive writing","Improve document quality","Speed up research","Automate manual processes","Learn prompting","Use AI for coding/technical","Integrate into existing workflows","Understand AI capabilities","Train/enable team members","Build internal tools"];
const PAINS=["Email and comms drafting","Meeting prep and follow-up","Report/document writing","Data analysis","Research and competitive intel","Code writing or debugging","Process documentation","Customer/stakeholder comms","Learning new tools","Managing and organizing info"];
const EMPTY=()=>({id:RR.uid(),name:"",role:"",department:"",manager:"",email:"",plan:"pro",firstSession:true,literacy:"",tools:[],goals:[],painPoints:[],notes:"",sessionDate:RR.today(),created:RR.today()});

function Chip({label,on,onClick}){return <span className={"rr-chip"+(on?" on":"")} onClick={onClick}>{label}</span>;}

function App(){
  const [records,setRecords]=useState(()=>RR.load("intake-records-v1",[]));
  const [form,setForm]=useState(EMPTY);
  const [saved,setSaved]=useState(false);
  useEffect(()=>{RR.save("intake-records-v1",records);},[records]);

  const toggle=(field,val)=>setForm(f=>({...f,[field]:f[field].includes(val)?f[field].filter(x=>x!==val):[...f[field],val]}));
  const set=(field,val)=>setForm(f=>({...f,[field]:val}));
  const submit=()=>{
    if(!form.name.trim())return alert("Name is required.");
    setRecords(r=>[{...form},...r]);
    setForm(EMPTY());
    setSaved(true); setTimeout(()=>setSaved(false),2200);
  };
  const remove=(id)=>{ if(confirm("Delete this intake record?")) setRecords(r=>r.filter(x=>x.id!==id)); };

  return (
    <div style={{maxWidth:840,margin:"0 auto",padding:"40px 24px 80px"}}>
      <a href="../index.html" className="rr-mono" style={{fontSize:11}}>&larr; Suite</a>
      <div style={{margin:"14px 0 28px",borderBottom:"1px solid var(--border)",paddingBottom:20}}>
        <div className="rr-eyebrow">01 · Pre-Session Intake</div>
        <h1 className="rr-head" style={{fontSize:30,margin:"8px 0 6px"}}>Capture the champion</h1>
        <p style={{color:"var(--text2)",fontSize:14}}>Fill this before session one. It feeds the Prompt Package Builder and Outcome Tracker.</p>
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div><label className="rr-label">Name *</label><input className="rr-input" value={form.name} onChange={e=>set("name",e.target.value)} /></div>
          <div><label className="rr-label">Role / Title</label><input className="rr-input" value={form.role} onChange={e=>set("role",e.target.value)} /></div>
          <div><label className="rr-label">Department</label><input className="rr-input" value={form.department} onChange={e=>set("department",e.target.value)} /></div>
          <div><label className="rr-label">Manager</label><input className="rr-input" value={form.manager} onChange={e=>set("manager",e.target.value)} /></div>
          <div><label className="rr-label">Email</label><input className="rr-input" value={form.email} onChange={e=>set("email",e.target.value)} /></div>
          <div><label className="rr-label">Claude Plan</label>
            <select className="rr-select" value={form.plan} onChange={e=>set("plan",e.target.value)}>
              <option value="free">Free</option><option value="pro">Pro</option><option value="max">Max</option><option value="team">Team</option><option value="enterprise">Enterprise</option>
            </select>
          </div>
        </div>
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <label className="rr-label">AI Literacy</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:6}}>
          {LITERACY.map(l=><Chip key={l.v} label={l.l} on={form.literacy===l.v} onClick={()=>set("literacy",l.v)} />)}
        </div>
        {form.literacy && <p style={{color:"var(--text3)",fontSize:12,marginTop:8,fontFamily:"'IBM Plex Mono',monospace"}}>{LITERACY.find(l=>l.v===form.literacy).d}</p>}
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <label className="rr-label">Tools they use daily</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:6}}>
          {TOOLS.map(t=><Chip key={t} label={t} on={form.tools.includes(t)} onClick={()=>toggle("tools",t)} />)}
        </div>
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <label className="rr-label">Goals</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:6}}>
          {GOALS.map(g=><Chip key={g} label={g} on={form.goals.includes(g)} onClick={()=>toggle("goals",g)} />)}
        </div>
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <label className="rr-label">Pain points</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:6}}>
          {PAINS.map(p=><Chip key={p} label={p} on={form.painPoints.includes(p)} onClick={()=>toggle("painPoints",p)} />)}
        </div>
      </div>

      <div className="rr-card" style={{marginBottom:20}}>
        <label className="rr-label">Notes</label>
        <textarea className="rr-textarea" rows="3" value={form.notes} onChange={e=>set("notes",e.target.value)} />
      </div>

      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <button className="rr-btn accent" onClick={submit}>Save Intake</button>
        {saved && <span className="rr-mono" style={{color:"var(--green)",fontSize:11}}>✓ Saved — feeds tools 02 &amp; 04</span>}
      </div>

      {records.length>0 && <div style={{marginTop:40}}>
        <div className="rr-eyebrow" style={{color:"var(--text3)"}}>Saved intakes · {records.length}</div>
        <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
          {records.map(r=><div key={r.id} className="rr-card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 18px"}}>
            <div>
              <div style={{fontSize:14,color:"var(--text)"}}>{r.name} <span style={{color:"var(--text3)",fontSize:12}}>· {r.role||"—"}</span></div>
              <div className="rr-mono" style={{fontSize:10,marginTop:3}}>{r.plan} · {r.literacy||"literacy n/a"} · {r.tools.length} tools · {r.goals.length} goals</div>
            </div>
            <button className="rr-btn" onClick={()=>remove(r.id)} style={{borderColor:"var(--border)"}}>Delete</button>
          </div>)}
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
