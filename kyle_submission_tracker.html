let state={
  data:INITIAL.map(d=>({...d})),
  loaded:false,
  catF:'all',
  statF:'all',
  q:'',
  exp:null,
  editN:{id:null,val:''}
};

async function loadStorage(){
  try{
    const r=await window.storage.get(STORAGE_KEY);
    if(r&&r.value){state.data=JSON.parse(r.value);}
  }catch(e){}
  state.loaded=true;
  render();
}

async function saveStorage(){
  if(!state.loaded)return;
  try{await window.storage.set(STORAGE_KEY,JSON.stringify(state.data));}catch(e){}
}

function updateStatus(id,status){
  state.data=state.data.map(t=>t.id!==id?t:{
    ...t,status,
    submittedDate:status==='submitted'&&!t.submittedDate?new Date().toISOString().split('T')[0]:t.submittedDate
  });
  saveStorage();render();
}

function saveNotes(){
  if(!state.editN.id)return;
  state.data=state.data.map(t=>t.id===state.editN.id?{...t,notes:state.editN.val}:t);
  state.editN={id:null,val:''};
  saveStorage();render();
}

function getFiltered(){
  return state.data.filter(t=>{
    if(state.catF!=='all'&&t.category!==state.catF)return false;
    if(state.statF!=='all'&&t.status!==state.statF)return false;
    if(state.q){
      const s=state.q.toLowerCase();
      return t.name.toLowerCase().includes(s)||(t.contact||'').toLowerCase().includes(s)||(t.pitchAngle||'').toLowerCase().includes(s)||(t.notes||'').toLowerCase().includes(s);
    }
    return true;
  });
}

function badge(cfg,text){
  return `<span class="badge" style="background:${cfg.bg};color:${cfg.color};border:.5px solid ${cfg.border}">${text}</span>`;
}

function statusSelect(t){
  const st=STATUSES[t.status]||STATUSES.not_submitted;
  let opts=Object.entries(STATUSES).map(([k,v])=>`<option value="${k}"${k===t.status?' selected':''}>${v.label}</option>`).join('');
  return `<select data-id="${t.id}" class="stat-sel" style="background:${st.bg};color:${st.color};border:.5px solid ${st.border};font-size:11px;font-weight:500;padding:3px 7px;border-radius:6px;width:138px;outline:none" onclick="event.stopPropagation()">${opts}</select>`;
}

function expandedRow(t){
  const editing=state.editN.id===t.id;
  const notesHtml=editing
    ?`<textarea id="notes-ta" style="width:100%;box-sizing:border-box;font-size:13px;resize:vertical;font-family:var(--font-sans);padding:8px 10px;border-radius:var(--border-radius-md)" rows="3">${state.editN.val.replace(/</g,'&lt;')}</textarea><div style="display:flex;gap:8px;margin-top:8px"><button onclick="saveNotes()">Save</button><button onclick="cancelNotes()">Cancel</button></div>`
    :`<div class="notes-view ${t.notes?'':'notes-empty'}" onclick="startEdit('${t.id}')" title="Click to edit">${t.notes?t.notes.replace(/</g,'&lt;'):'Click to add notes...'}</div>`;
  
  const payHtml=(t.payment&&t.payment!=='N/A')
    ?`<div><div class="detail-label">Payment</div><div class="detail-val" style="font-weight:500">${t.payment}</div></div>`:'';

  return `<tr class="exp-detail"><td colspan="7" style="padding:14px 18px 16px 22px">
    <div style="display:grid;grid-template-columns:1fr 1fr ${t.payment&&t.payment!=='N/A'?'1fr':''};gap:14px;margin-bottom:12px">
      <div><div class="detail-label">Contact</div><div class="detail-val">${t.contact}</div></div>
      <div><div class="detail-label">Submission route</div><div class="detail-sub">${t.route}</div></div>
      ${payHtml}
    </div>
    <div><div class="detail-label">Notes</div>${notesHtml}</div>
  </td></tr>`;
}

function render(){
  const rows=getFiltered();
  const counts={
    total:state.data.length,
    active:state.data.filter(t=>['in_progress','submitted','following_up','response_received'].includes(t.status)).length,
    accepted:state.data.filter(t=>t.status==='accepted').length,
    published:state.data.filter(t=>t.status==='published').length
  };

  const catOpts=Object.entries(CATS).map(([k,v])=>`<option value="${k}"${state.catF===k?' selected':''}>${v.label}s</option>`).join('');
  const statOpts=Object.entries(STATUSES).map(([k,v])=>`<option value="${k}"${state.statF===k?' selected':''}>${v.label}</option>`).join('');

  const tableRows=rows.map((t,i)=>{
    const st=STATUSES[t.status]||STATUSES.not_submitted;
    const ct=CATS[t.category]||{label:t.category,bg:'transparent',color:'var(--color-text-secondary)',border:'var(--color-border-tertiary)'};
    const isExp=state.exp===t.id;
    const starHtml=t.tier===1?`<span style="font-size:9px;color:#854F0B;margin-left:3px">★</span>`:'';
    const rowBg=isExp?'var(--color-background-secondary)':(i%2===0?'var(--color-background-primary)':'var(--color-background-secondary)')
    const main=`<tr class="main" data-id="${t.id}" style="background:${rowBg}">
      <td style="color:var(--color-text-primary);font-weight:500;max-width:180px" title="${t.name}">${t.name}${starHtml}</td>
      <td>${badge(ct,ct.label)}</td>
      <td style="color:var(--color-text-tertiary);font-size:12px">${t.tier?'T'+t.tier:'—'}</td>
      <td style="color:var(--color-text-secondary);max-width:160px" title="${t.contact}">${t.contact}</td>
      <td style="color:var(--color-text-secondary);max-width:120px" title="${t.pitchAngle}">${t.pitchAngle}</td>
      <td onclick="event.stopPropagation()">${statusSelect(t)}</td>
      <td style="color:var(--color-text-tertiary);font-size:12px">${t.submittedDate||'—'}</td>
    </tr>`;
    return main+(isExp?expandedRow(t):'');
  }).join('');

  const emptyHtml=rows.length===0?`<tr><td colspan="7" style="padding:48px;text-align:center;color:var(--color-text-tertiary)">No results match the current filters.</td></tr>`:'';

  document.getElementById('root').innerHTML=`
    <div style="margin-bottom:1.25rem">
      <p style="font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.07em;margin:0 0 12px">Construction, Not Recovery — Submission Tracker</p>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
        <div class="stat-card"><div class="num">${counts.total}</div><div class="lbl">Total targets</div></div>
        <div class="stat-card"><div class="num">${counts.active}</div><div class="lbl">Active</div></div>
        <div class="stat-card"><div class="num">${counts.accepted}</div><div class="lbl">Accepted</div></div>
        <div class="stat-card"><div class="num">${counts.published}</div><div class="lbl">Published</div></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <input type="text" placeholder="Search..." value="${state.q.replace(/"/g,'&quot;')}" id="search-in" style="flex:1 1 150px;min-width:130px">
      <select id="cat-sel"><option value="all"${state.catF==='all'?' selected':''}>All types</option>${catOpts}</select>
      <select id="stat-sel"><option value="all"${state.statF==='all'?' selected':''}>All statuses</option>${statOpts}</select>
      <span style="font-size:12px;color:var(--color-text-tertiary);margin-left:auto;white-space:nowrap">${rows.length} / ${state.data.length}</span>
    </div>
    <div style="border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden">
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>Target</th><th>Type</th><th>Tier</th><th>Contact</th><th>Angle</th><th>Status</th><th>Submitted</th>
          </tr></thead>
          <tbody>${tableRows}${emptyHtml}</tbody>
        </table>
      </div>
    </div>
    <p style="margin:8px 0 0;font-size:11px;color:var(--color-text-tertiary);text-align:right">Persists across sessions · click any row to expand</p>
  `;

  document.getElementById('search-in').addEventListener('input',e=>{state.q=e.target.value;render();});
  document.getElementById('cat-sel').addEventListener('change',e=>{state.catF=e.target.value;render();});
  document.getElementById('stat-sel').addEventListener('change',e=>{state.statF=e.target.value;render();});
  document.querySelectorAll('.main').forEach(row=>{
    row.addEventListener('click',()=>{
      const id=row.dataset.id;
      state.exp=state.exp===id?null:id;
      state.editN={id:null,val:''};
      render();
    });
  });
  document.querySelectorAll('.stat-sel').forEach(sel=>{
    sel.addEventListener('change',e=>{updateStatus(sel.dataset.id,e.target.value);});
  });
  if(state.editN.id){
    const ta=document.getElementById('notes-ta');
    if(ta){
      ta.addEventListener('input',e=>{state.editN.val=e.target.value;});
      ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
    }
  }
}

window.saveNotes=saveNotes;
window.cancelNotes=()=>{state.editN={id:null,val:''};render();};
window.startEdit=(id)=>{
  const t=state.data.find(x=>x.id===id);
  state.editN={id,val:t?t.notes||'':''};
  render();
};

loadStorage();
</script>
