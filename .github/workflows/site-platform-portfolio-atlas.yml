name: Site Platform Portfolio Atlas

on:
  pull_request:
    paths:
      - "docs/site-platform/portfolio-atlas/**"
      - ".github/workflows/site-platform-portfolio-atlas.yml"
  push:
    branches:
      - main
    paths:
      - "docs/site-platform/portfolio-atlas/**"
      - ".github/workflows/site-platform-portfolio-atlas.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source registry
        run: node docs/site-platform/portfolio-atlas/validate.mjs

      - name: Verify generated public projection
        run: node docs/site-platform/portfolio-atlas/build-public.mjs --check

      - name: Run fail-closed contract tests
        run: node docs/site-platform/portfolio-atlas/test.mjs
