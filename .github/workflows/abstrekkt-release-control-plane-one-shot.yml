name: Abstrekkt Release Control Plane One-Shot

on:
  push:
    branches:
      - infra/abstrekkt-release-control-plane-20260827
    paths:
      - .github/workflows/abstrekkt-release-control-plane-one-shot.yml

permissions:
  contents: read

env:
  PROJECT_NAME: abstrekkt
  WORKER_NAME: abstrekkt
  CUSTOM_DOMAIN: abstrekkt.com
  CANDIDATE_SHA: e1d3355fd00dce8d739f2dbacbd3398e8cdefe11
  DEPLOYMENT_ID: ee78ba2a-7f8f-49c4-9dbd-fddc20ca57a8
  DEPLOYMENT_URL: https://ee78ba2a.abstrekkt.pages.dev
  NONEXISTENT_PATH: /__release-probe-nonexistent-20260827

jobs:
  verify:
    name: Verify Pages and reconcile Workers Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify Cloudflare deployment metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments/$DEPLOYMENT_ID"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" > deployment.json
          python <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path('deployment.json').read_text())
          if not payload.get('success'): raise SystemExit(payload.get('errors'))
          row=payload.get('result') or {}
          meta=((row.get('deployment_trigger') or {}).get('metadata') or {})
          expected={'id':os.environ['DEPLOYMENT_ID'],'url':os.environ['DEPLOYMENT_URL'],'commit_hash':os.environ['CANDIDATE_SHA']}
          observed={'id':row.get('id'),'url':row.get('url'),'commit_hash':meta.get('commit_hash')}
          if observed != expected: raise SystemExit(f'Deployment metadata mismatch: {observed!r} != {expected!r}')
          out={'id':row.get('id'),'url':row.get('url'),'environment':row.get('environment'),'created_on':row.get('created_on'),'latest_stage':row.get('latest_stage'),'deployment_trigger':row.get('deployment_trigger')}
          Path('pages-deployment-evidence.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(observed, indent=2))
          PY

      - name: Probe preview routes and configured headers
        run: |
          set -euo pipefail
          python <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base=os.environ['DEPLOYMENT_URL'].rstrip('/')
          routes=[('/',200),('/founder/',200),('/pillars/',200),('/contact/',200),(os.environ['NONEXISTENT_PATH'],404)]
          security={'x-content-type-options':'nosniff','x-frame-options':'DENY','referrer-policy':'strict-origin-when-cross-origin','permissions-policy':'camera=(), microphone=(), geolocation=()'}
          configured_cache='public, max-age=0, must-revalidate'
          evidence=[]
          for i,(path,expected) in enumerate(routes):
              h=f'/tmp/h{i}.txt'; b=f'/tmp/b{i}.bin'
              p=subprocess.run(['curl','-sS','-L','--connect-timeout','10','--max-time','30','-D',h,'-o',b,'-w','%{http_code}|%{url_effective}',base+path],capture_output=True,text=True,check=True)
              status_s,final_url=p.stdout.strip().split('|',1); status=int(status_s)
              headers={}
              for line in Path(h).read_text(errors='replace').splitlines():
                  if ':' in line:
                      k,v=line.split(':',1); headers[k.strip().lower()]=v.strip()
              if status != expected: raise SystemExit(f'{path}: HTTP {status}, expected {expected}')
              missing={k:v for k,v in security.items() if headers.get(k,'').lower()!=v.lower()}
              if missing: raise SystemExit(f'{path}: security headers mismatch: {missing}')
              cache=headers.get('cache-control','')
              if not (cache.lower()==configured_cache or (status==404 and cache.lower()=='no-store')):
                  raise SystemExit(f'{path}: unacceptable cache-control {cache!r}')
              evidence.append({'path':path,'status':status,'final_url':final_url,'headers':{**{k:headers.get(k) for k in security},'cache-control':cache},'cache_policy':'cloudflare_404_no_store_override' if status==404 and cache.lower()=='no-store' else 'configured'})
          Path('preview-http-evidence.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Read Pages custom-domain status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains/$CUSTOM_DOMAIN"
          CODE="$(curl -sS -o /tmp/domain.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL" || true)"
          python - "$CODE" <<'PY'
          import json, sys
          from pathlib import Path
          code=int(sys.argv[1]); payload=json.loads(Path('/tmp/domain.json').read_text() or '{}'); row=payload.get('result') or {}
          out={'http_status':code,'success':payload.get('success'),'domain':{k:row.get(k) for k in ('id','name','status','zone_tag','created_on','certificate_authority')}}
          Path('pages-domain-evidence.json').write_text(json.dumps(out, indent=2)); print(json.dumps(out, indent=2))
          PY

      - name: Reconcile external Workers Build safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          worker_name=os.environ['WORKER_NAME']
          api_root=f'https://api.cloudflare.com/client/v4/accounts/{account}'

          def call(method, path, data=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(api_root+path, data=body, method=method, headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw=r.read().decode() or '{}'; return r.status, json.loads(raw)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode() or '{}'
                  try: payload=json.loads(raw)
                  except Exception: payload={'raw':raw}
                  return e.code, payload

          def require_success(status, payload, label):
              if status < 200 or status >= 300 or payload.get('success') is False:
                  raise SystemExit(f'{label} failed: HTTP {status} {payload.get("errors") or payload}')

          status,scripts_payload=call('GET','/workers/scripts')
          require_success(status,scripts_payload,'list workers')
          scripts=scripts_payload.get('result') or []
          target=[s for s in scripts if s.get('id')==worker_name]
          if len(target)!=1: raise SystemExit(f'Expected exactly one {worker_name} Worker, found {len(target)}')
          tag=target[0].get('tag')
          if not tag: raise SystemExit('Target Worker tag missing')

          def target_triggers():
              s,p=call('GET',f'/builds/workers/{tag}/triggers')
              require_success(s,p,'list target triggers')
              return p.get('result') or []

          before=target_triggers()
          dangerous=[t for t in before if (t.get('deploy_command') or '').strip()=='npx wrangler deploy']
          actions=[]

          for trigger in dangerous:
              uuid=trigger['trigger_uuid']
              s,p=call('DELETE',f'/builds/triggers/{uuid}')
              require_success(s,p,'delete bare wrangler trigger')
              actions.append({'action':'delete_trigger','trigger_uuid':uuid,'http_status':s})

          time.sleep(3)
          remaining=[t for t in target_triggers() if (t.get('deploy_command') or '').strip()=='npx wrangler deploy']

          for trigger in remaining:
              uuid=trigger['trigger_uuid']
              s,p=call('PATCH',f'/builds/triggers/{uuid}',{'deploy_command':'npx wrangler versions upload'})
              require_success(s,p,'correct deploy command')
              actions.append({'action':'patch_to_versions_upload','trigger_uuid':uuid,'http_status':s})

          time.sleep(3)
          remaining=[t for t in target_triggers() if (t.get('deploy_command') or '').strip()=='npx wrangler deploy']

          if remaining:
              connection_ids={((t.get('repo_connection') or {}).get('repo_connection_uuid')) for t in remaining}
              connection_ids.discard(None)
              if len(connection_ids)!=1: raise SystemExit(f'Cannot safely disconnect ambiguous repository connections: {connection_ids}')
              connection_id=next(iter(connection_ids))
              consumers=[]
              for script in scripts:
                  sid=script.get('id'); stag=script.get('tag')
                  if not sid or not stag: continue
                  s,p=call('GET',f'/builds/workers/{stag}/triggers')
                  if s==404: continue
                  require_success(s,p,f'list triggers for {sid}')
                  for t in p.get('result') or []:
                      if ((t.get('repo_connection') or {}).get('repo_connection_uuid'))==connection_id and not t.get('deleted_on'):
                          consumers.append({'worker':sid,'trigger_uuid':t.get('trigger_uuid'),'deploy_command':t.get('deploy_command')})
              foreign=[c for c in consumers if c['worker']!=worker_name]
              if foreign: raise SystemExit(f'Repository connection is shared; refusing disconnect: {foreign}')
              s,p=call('DELETE',f'/builds/repos/connections/{connection_id}')
              require_success(s,p,'disconnect repository connection')
              actions.append({'action':'delete_repository_connection','repo_connection_uuid':connection_id,'http_status':s,'verified_consumers':consumers})
              time.sleep(4)

          after=target_triggers()
          dangerous_after=[t for t in after if (t.get('deploy_command') or '').strip()=='npx wrangler deploy' and not t.get('deleted_on')]
          if dangerous_after: raise SystemExit(f'Bare wrangler deploy remains after bounded remediation: {dangerous_after}')
          summary=lambda rows:[{'trigger_uuid':t.get('trigger_uuid'),'trigger_name':t.get('trigger_name'),'deploy_command':t.get('deploy_command'),'branch_includes':t.get('branch_includes'),'deleted_on':t.get('deleted_on'),'repo_connection_uuid':((t.get('repo_connection') or {}).get('repo_connection_uuid'))} for t in rows]
          evidence={'status':'PASS','worker':worker_name,'worker_tag':tag,'before':summary(before),'actions':actions,'after':summary(after),'bare_wrangler_deploy_remaining':0}
          Path('workers-build-evidence.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY

      - name: Probe apex without mutating DNS
        if: always()
        run: |
          set -euo pipefail
          CODE="$(curl -sS -L --connect-timeout 10 --max-time 30 -D apex.headers -o apex.body -w '%{http_code}|%{url_effective}' "https://$CUSTOM_DOMAIN/" || true)"
          printf '%s\n' "$CODE" > apex-status.txt
          echo "Apex read-back: $CODE"

      - name: Upload control-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abstrekkt-e1d3355-control-plane-evidence
          path: |
            pages-deployment-evidence.json
            preview-http-evidence.json
            pages-domain-evidence.json
            workers-build-evidence.json
            apex.headers
            apex.body
            apex-status.txt
          if-no-files-found: warn
          retention-days: 90
