name: KR Mentor Proxy Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/kr-mentor-proxy
    paths:
      - '.github/workflows/kr-mentor-proxy-deploy.yml'
      - 'project/proxy-deploy/**'

permissions:
  contents: read

concurrency:
  group: kr-mentor-proxy-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.126.0'
  WORKER_NAME: kr-mentor-proxy

jobs:
  deploy:
    name: Deploy traced mentor proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require Cloudflare and proxy credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_TOKEN: ${{ secrets.KR_MENTOR_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'STOP: CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'STOP: CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }
          test -n "${PROXY_TOKEN:-}" || { echo 'STOP: KR_MENTOR_PROXY_TOKEN is not configured'; exit 1; }

      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify config and dry-run
        working-directory: project/proxy-deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').devDependencies.wrangler")" = "$WRANGLER_VERSION"
          grep -q '^\[observability\.traces\]$' wrangler.toml
          grep -q '^enabled = true$' wrangler.toml
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --config wrangler.toml

      - name: Deploy Worker shell
        working-directory: project/proxy-deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.toml

      - name: Install proxy bearer secret
        working-directory: project/proxy-deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_TOKEN: ${{ secrets.KR_MENTOR_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$PROXY_TOKEN" | npx --yes wrangler@${WRANGLER_VERSION} secret put PROXY_TOKEN --config wrangler.toml

      - name: Deploy final version and capture structured evidence
        working-directory: project/proxy-deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/kr-mentor-proxy-deploy.ndjson
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.toml

      - name: Verify unauthenticated denial and write receipt
        working-directory: project/proxy-deploy
        shell: bash
        env:
          DEPLOY_LOG: ${{ runner.temp }}/kr-mentor-proxy-deploy.ndjson
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync(process.env.DEPLOY_LOG, 'utf8').split(/\r?\n/).filter(Boolean).map(line => JSON.parse(line));
          const deploy = [...lines].reverse().find(row => row.type === 'deploy');
          if (!deploy) throw new Error('No structured Wrangler deploy record found');
          const target = (deploy.targets || []).find(x => /^https:\/\//.test(x));
          if (!target) throw new Error('No HTTPS deployment target found');
          const receipt = {
            schema: 'KrMentorProxyDeploymentReceipt/v1',
            repository: process.env.GITHUB_REPOSITORY,
            source_sha: process.env.GITHUB_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            provider: 'Cloudflare Workers',
            worker_name: deploy.worker_name || process.env.WORKER_NAME,
            worker_tag: deploy.worker_tag || null,
            worker_version_id: deploy.version_id || null,
            deployed_at: deploy.timestamp || new Date().toISOString(),
            deployment_target: target,
            tracing_enabled: true,
            payload_recording_enabled: false
          };
          fs.writeFileSync('deployment-receipt.json', JSON.stringify(receipt, null, 2));
          NODE

          TARGET="$(node -e "const r=require('./deployment-receipt.json');process.stdout.write(r.deployment_target)")"
          STATUS="$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{}' --output /tmp/kr-mentor-proxy-readback.txt --write-out '%{http_code}' "$TARGET")"
          test "$STATUS" = '401' || { echo "STOP: unauthenticated POST returned HTTP $STATUS, expected 401"; cat /tmp/kr-mentor-proxy-readback.txt; exit 1; }

          node <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('deployment-receipt.json','utf8'));
          r.verified_at = new Date().toISOString();
          r.readback = { method: 'POST', authenticated: false, status: 401, expectation: 'missing bearer token rejected' };
          fs.writeFileSync('deployment-receipt.json', JSON.stringify(r, null, 2));
          NODE

          echo "Deployment target: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo 'Unauthenticated POST → HTTP 401 PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tracing config → enabled PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kr-mentor-proxy-deployment-receipt
          path: project/proxy-deploy/deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
