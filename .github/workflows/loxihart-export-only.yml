name: Loxihart Export Only

on:
  push:
    branches:
      - loxihart/export-only-2026-08-22

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact export revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build exact source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d loxihart
          mkdir -p export-meta
          printf '%s\n' "$GITHUB_SHA" > export-meta/source-commit.txt
          git ls-files -s loxihart > export-meta/source-git-index.txt
          find loxihart -type f -print0 | sort -z | xargs -0 sha256sum > export-meta/source-sha256.txt
          tar --sort=name --mtime='UTC 2026-08-22' --owner=0 --group=0 --numeric-owner -czf loxihart-source.tgz loxihart export-meta
          sha256sum loxihart-source.tgz > loxihart-source.tgz.sha256

      - name: Upload exact extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: loxihart-exact-source-export
          path: |
            loxihart-source.tgz
            loxihart-source.tgz.sha256
            export-meta/
          if-no-files-found: error
          retention-days: 30
