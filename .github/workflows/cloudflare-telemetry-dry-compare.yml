name: Cloudflare Telemetry Dry Compare

on:
  push:
    branches:
      - diagnose/cloudflare-telemetry-dry-20260829
    paths:
      - '.github/workflows/cloudflare-telemetry-dry-compare.yml'
      - 'tooling/cloudflare/compare-telemetry-dry-mode.mjs'

permissions:
  contents: read

jobs:
  compare:
    name: Compare Cloudflare telemetry query dry modes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Query identical frozen window in three dry modes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FROM_MS: '1788022320000'
          TO_MS: '1788022530000'
          RAY_ID: 'a32d11047aecfa96'
          OUTPUT_PATH: ${{ github.workspace }}/cloudflare-telemetry-dry-mode-diagnostic.json
        run: |
          set -euo pipefail
          node --check tooling/cloudflare/compare-telemetry-dry-mode.mjs
          node tooling/cloudflare/compare-telemetry-dry-mode.mjs

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-telemetry-dry-mode-diagnostic
          path: cloudflare-telemetry-dry-mode-diagnostic.json
          if-no-files-found: error
          retention-days: 90
