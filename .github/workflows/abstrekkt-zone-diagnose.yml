name: Abstrekkt Zone Diagnose (read-only)

# Answers: what serves abstrekkt.com, and what challenges it? GET requests only.
# Uses a dedicated read-only token so the Pages deploy token is never widened.
# Required repo/environment secrets:
#   CLOUDFLARE_ZONE_READ_TOKEN  Zone:Read, Zone Settings:Read, DNS:Read, Workers Routes:Read,
#                               Workers Scripts:Read, Zone WAF/Rulesets:Read, Bot Management:Read,
#                               Snippets:Read, Cloudflare Pages:Read
#   CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abstrekkt-zone-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose abstrekkt.com routing and challenge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ZONE_ID: 418c205318b9d95b1758c23d19bf6195
      PAGES_PROJECT: abstrekkt
      APEX_HOSTNAME: abstrekkt.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read Cloudflare configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_READ_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}" || { echo "STOP: CLOUDFLARE_ZONE_READ_TOKEN is not configured"; exit 1; }
          python scripts/release/cf_zone_diagnose.py --json-out "$RUNNER_TEMP/zone-diagnosis.json" > /dev/null

      - name: Probe apex from CI
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/release/pages_probe.py apex --phase preflight --base https://abstrekkt.com \
            --root project/deploy/abstrekkt-com --json-out "$RUNNER_TEMP/apex-probe.json" > /dev/null
          echo "apex probe exit code: $?"

      - name: Summarize
        shell: bash
        run: |
          python - "$RUNNER_TEMP/zone-diagnosis.json" "$RUNNER_TEMP/apex-probe.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          zone = json.load(open(sys.argv[1]))
          apex = json.load(open(sys.argv[2]))
          print("## abstrekkt.com zone diagnosis\n")
          print(f"- Apex from CI: **{apex['classification']}** (HTTP {apex['httpStatus']}, cf-mitigated={apex['cfMitigated']})")
          print(f"- Apex claims: `{json.dumps(zone['apexClaims'])}`")
          print(f"- Challenge sources: `{json.dumps(zone['challengeSources'])}`")
          print(f"- Pages production deployment: `{zone['pagesProductionDeployment']}`")
          print(f"- Endpoints lacking token scope: `{zone['insufficientScope']}`")
          PY

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abstrekkt-zone-diagnosis-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zone-diagnosis.json
            ${{ runner.temp }}/apex-probe.json
          retention-days: 30
          if-no-files-found: warn
