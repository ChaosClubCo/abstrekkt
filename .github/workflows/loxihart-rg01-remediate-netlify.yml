name: Loxihart RG-01 Remediate Netlify Dependency

on:
  push:
    branches:
      - loxihart/production-gates-2026-08-21
    paths:
      - .github/workflows/loxihart-rg01-remediate-netlify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loxihart/production-gates-2026-08-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade Netlify Functions in working tree
        working-directory: loxihart/pilot-console
        run: npm install --save-exact @netlify/functions@6.0.0

      - name: Reproducible install from regenerated lockfile
        working-directory: loxihart/pilot-console
        run: npm ci

      - name: Enforce zero HIGH/CRITICAL vulnerabilities
        working-directory: loxihart/pilot-console
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const v = a.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(v, null, 2));
          if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) process.exit(2);
          NODE

      - name: Tests
        working-directory: loxihart/pilot-console
        run: npm test

      - name: Production build
        working-directory: loxihart/pilot-console
        run: npm run build

      - name: Commit verified dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loxihart/pilot-console/package.json loxihart/pilot-console/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency change required.'
            exit 0
          fi
          git commit -m 'fix(loxihart): upgrade Netlify Functions for RG-01'
          git push origin HEAD:loxihart/production-gates-2026-08-21
