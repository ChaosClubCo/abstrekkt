name: Abstrekkt Cloudflare Pages Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA to deploy
        required: true
      project_name:
        description: Existing Cloudflare Pages project name
        required: true
        default: abstrekkt

permissions:
  contents: read
  deployments: write

concurrency:
  group: abstrekkt-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact SHA to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "STOP: CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "STOP: CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Checkout trusted automation revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: automation

      - name: Checkout exact release candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C candidate rev-parse HEAD)"
          test "$ACTUAL" = "${{ inputs.candidate_sha }}" || {
            echo "STOP: checked out $ACTUAL, expected ${{ inputs.candidate_sha }}"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate trusted automation configuration
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/scripts/repo_integrity.py
          python -m json.tool automation/.github/mcp.json >/dev/null
          test -s automation/.github/copilot-instructions.md
          test -s automation/.github/workflows/repository-webhooks.yml

      - name: Re-run repository authority checks on candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git -C candidate rev-parse HEAD^ 2>/dev/null || true)"
          mkdir -p candidate/.release-tools
          cp automation/scripts/repo_integrity.py candidate/.release-tools/repo_integrity.py
          python candidate/.release-tools/repo_integrity.py --base "$BASE_SHA"

      - name: Validate static release package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="candidate/project/deploy/abstrekkt-com"
          test -s "$ROOT/index.html" || { echo "STOP: missing root index.html"; exit 1; }
          test -s "$ROOT/founder/index.html" || { echo "STOP: missing /founder"; exit 1; }
          test -s "$ROOT/pillars/index.html" || { echo "STOP: missing /pillars"; exit 1; }
          test -s "$ROOT/contact/index.html" || { echo "STOP: missing /contact"; exit 1; }
          test -s "$ROOT/404.html" || { echo "STOP: missing 404.html"; exit 1; }
          if find "$ROOT" -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa*' \) -print -quit | grep -q .; then
            echo "STOP: credential-like file present in static release package"
            exit 1
          fi

      - name: Add Cloudflare Pages response headers to release workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > candidate/project/deploy/abstrekkt-com/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()

          /*.html
            Cache-Control: public, max-age=0, must-revalidate
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy candidate/project/deploy/abstrekkt-com --project-name=${{ inputs.project_name }} --branch=main --commit-hash=${{ inputs.candidate_sha }}

      - name: Record release summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Abstrekkt Cloudflare Pages release"
            echo
            echo "- Candidate SHA: `${{ inputs.candidate_sha }}`"
            echo "- Trusted automation SHA: `${{ github.sha }}`"
            echo "- Pages project: `${{ inputs.project_name }}`"
            echo "- Static package: `project/deploy/abstrekkt-com`"
            echo "- Repository authority checks: trusted checker applied to exact candidate"
            echo "- Custom-domain binding and independent public read-back remain separate release evidence."
          } >> "$GITHUB_STEP_SUMMARY"
