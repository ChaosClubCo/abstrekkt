name: Loxihart Production Release RG01-RG04

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen candidate commit SHA
        required: true
        default: a237db22e7159df2327d0b92ca624079ac124ff8
      candidate_ref:
        description: Human-readable frozen ref
        required: true
        default: release/loxihart-pilot-console-rc-2026-08-16

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  EVIDENCE_ROOT: evidence/production-readiness

jobs:
  freeze:
    name: Freeze / Same-SHA preflight
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
      - id: sha
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$CANDIDATE_SHA" || { echo "STOP: checkout SHA $ACTUAL != frozen SHA $CANDIDATE_SHA"; exit 1; }
          mkdir -p "$EVIDENCE_ROOT/$CANDIDATE_SHA/freeze"
          printf '{"schemaVersion":"loxihart.production-gate.v1","gateId":"FREEZE","candidateSha":"%s","candidateRef":"%s","status":"PASS","observedSha":"%s"}\n' "$CANDIDATE_SHA" "${{ inputs.candidate_ref }}" "$ACTUAL" > "$EVIDENCE_ROOT/$CANDIDATE_SHA/freeze/gate-result.json"
          echo "sha=$ACTUAL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: loxihart-freeze-${{ inputs.candidate_sha }}
          path: evidence/production-readiness/${{ inputs.candidate_sha }}/freeze/

  rg01:
    name: RG-01 Dependency Safety
    needs: freeze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loxihart/pilot-console
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.candidate_sha }}
          fetch-depth: 1
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require reproducible lockfile
        run: test -f package-lock.json || { echo 'STOP RG-01: package-lock.json missing'; exit 1; }
      - name: Reproducible install
        run: npm ci
      - name: Dependency audit
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-01"
          npm audit --json > "$GITHUB_WORKSPACE/$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-01/dependency-audit.json" || true
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.GITHUB_WORKSPACE+'/'+process.env.EVIDENCE_ROOT+'/'+process.env.CANDIDATE_SHA+'/rg-01/dependency-audit.json';
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          const v=a.metadata?.vulnerabilities ?? {};
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+process.env.EVIDENCE_ROOT+'/'+process.env.CANDIDATE_SHA+'/rg-01/vulnerability-summary.json', JSON.stringify(v,null,2));
          if ((v.critical||0)>0 || (v.high||0)>0) process.exit(2);
          NODE
      - name: Existing tests
        run: npm test | tee "$GITHUB_WORKSPACE/$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-01/test-results.txt"
      - name: Production build
        run: npm run build | tee "$GITHUB_WORKSPACE/$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-01/build-result.txt"
      - name: Record PASS
        if: success()
        run: printf '{"schemaVersion":"loxihart.production-gate.v1","gateId":"RG-01","candidateSha":"%s","status":"PASS"}\n' "$CANDIDATE_SHA" > "$GITHUB_WORKSPACE/$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-01/gate-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loxihart-rg01-${{ inputs.candidate_sha }}
          path: evidence/production-readiness/${{ inputs.candidate_sha }}/rg-01/

  rg02:
    name: RG-02 Authentication + Tenant Isolation
    needs: [freeze, rg01]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.candidate_sha }}
          fetch-depth: 1
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require RG-02 production test entrypoint
        run: test -f loxihart/pilot-console/tests/release/rg02-tenant-isolation.test.mjs || { echo 'STOP RG-02: tenant-isolation release test missing on candidate SHA'; exit 1; }
      - name: Require test identities
        env:
          LOXIHART_PROD_CANDIDATE_URL: ${{ secrets.LOXIHART_PROD_CANDIDATE_URL }}
          LOXIHART_TENANT_A_TOKEN: ${{ secrets.LOXIHART_TENANT_A_TOKEN }}
          LOXIHART_TENANT_B_TOKEN: ${{ secrets.LOXIHART_TENANT_B_TOKEN }}
        run: |
          test -n "$LOXIHART_PROD_CANDIDATE_URL" || { echo 'STOP RG-02: missing LOXIHART_PROD_CANDIDATE_URL'; exit 1; }
          test -n "$LOXIHART_TENANT_A_TOKEN" || { echo 'STOP RG-02: missing tenant A test credential'; exit 1; }
          test -n "$LOXIHART_TENANT_B_TOKEN" || { echo 'STOP RG-02: missing tenant B test credential'; exit 1; }
      - name: Run tenant-isolation black-box suite
        env:
          LOXIHART_PROD_CANDIDATE_URL: ${{ secrets.LOXIHART_PROD_CANDIDATE_URL }}
          LOXIHART_TENANT_A_TOKEN: ${{ secrets.LOXIHART_TENANT_A_TOKEN }}
          LOXIHART_TENANT_B_TOKEN: ${{ secrets.LOXIHART_TENANT_B_TOKEN }}
          EVIDENCE_OUT: ${{ github.workspace }}/evidence/production-readiness/${{ inputs.candidate_sha }}/rg-02
        run: node --test loxihart/pilot-console/tests/release/rg02-tenant-isolation.test.mjs
      - name: Record PASS
        if: success()
        run: |
          mkdir -p "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-02"
          printf '{"schemaVersion":"loxihart.production-gate.v1","gateId":"RG-02","candidateSha":"%s","status":"PASS"}\n' "$CANDIDATE_SHA" > "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-02/gate-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loxihart-rg02-${{ inputs.candidate_sha }}
          path: evidence/production-readiness/${{ inputs.candidate_sha }}/rg-02/

  rg03:
    name: RG-03 Managed Signing-Key Custody
    needs: [freeze, rg02]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.candidate_sha }}
          fetch-depth: 1
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static private-key rejection
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-03"
          set +e
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|privateKeyJwk|private_key' loxihart > "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-03/private-key-scan.txt"
          FOUND=$?
          set -e
          test "$FOUND" -eq 1 || { echo 'STOP RG-03: private key material/reference pattern found in candidate'; cat "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-03/private-key-scan.txt"; exit 1; }
      - name: Require managed-signing release test
        run: test -f loxihart/pilot-console/tests/release/rg03-managed-signing.test.mjs || { echo 'STOP RG-03: managed signing release test missing on candidate SHA'; exit 1; }
      - name: Run managed-signing / rotation suite
        env:
          LOXIHART_PROD_CANDIDATE_URL: ${{ secrets.LOXIHART_PROD_CANDIDATE_URL }}
          LOXIHART_SIGNING_TEST_TOKEN: ${{ secrets.LOXIHART_SIGNING_TEST_TOKEN }}
          EVIDENCE_OUT: ${{ github.workspace }}/evidence/production-readiness/${{ inputs.candidate_sha }}/rg-03
        run: node --test loxihart/pilot-console/tests/release/rg03-managed-signing.test.mjs
      - name: Record PASS
        if: success()
        run: printf '{"schemaVersion":"loxihart.production-gate.v1","gateId":"RG-03","candidateSha":"%s","status":"PASS"}\n' "$CANDIDATE_SHA" > "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-03/gate-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loxihart-rg03-${{ inputs.candidate_sha }}
          path: evidence/production-readiness/${{ inputs.candidate_sha }}/rg-03/

  rg04:
    name: RG-04 Demo-Fallback Elimination
    needs: [freeze, rg03]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.candidate_sha }}
          fetch-depth: 1
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject executable staging/demo identities
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-04"
          set +e
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules 'lakeview-public-demo-v1|STAGING_DEMO_TOKEN|operator:kyle-demo|org-lakeview-hvac|demo-ed25519-v1' loxihart/pilot-console/src loxihart/pilot-console/netlify > "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-04/demo-reference-scan.txt"
          FOUND=$?
          set -e
          test "$FOUND" -eq 1 || { echo 'STOP RG-04: executable demo/staging identity remains in production candidate'; cat "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-04/demo-reference-scan.txt"; exit 1; }
      - name: Require demo-elimination runtime test
        run: test -f loxihart/pilot-console/tests/release/rg04-demo-fallback.test.mjs || { echo 'STOP RG-04: demo-fallback release test missing on candidate SHA'; exit 1; }
      - name: Run fail-closed production-auth suite
        env:
          LOXIHART_PROD_CANDIDATE_URL: ${{ secrets.LOXIHART_PROD_CANDIDATE_URL }}
          LOXIHART_PROD_TEST_TOKEN: ${{ secrets.LOXIHART_PROD_TEST_TOKEN }}
          EVIDENCE_OUT: ${{ github.workspace }}/evidence/production-readiness/${{ inputs.candidate_sha }}/rg-04
        run: node --test loxihart/pilot-console/tests/release/rg04-demo-fallback.test.mjs
      - name: Record PASS
        if: success()
        run: printf '{"schemaVersion":"loxihart.production-gate.v1","gateId":"RG-04","candidateSha":"%s","status":"PASS"}\n' "$CANDIDATE_SHA" > "$EVIDENCE_ROOT/$CANDIDATE_SHA/rg-04/gate-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loxihart-rg04-${{ inputs.candidate_sha }}
          path: evidence/production-readiness/${{ inputs.candidate_sha }}/rg-04/

  production-data-eligible:
    name: Production Data Eligible
    needs: [freeze, rg01, rg02, rg03, rg04]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce same-SHA dependency chain
        env:
          FROZEN_SHA: ${{ needs.freeze.outputs.candidate_sha }}
        run: |
          test "$FROZEN_SHA" = "$CANDIDATE_SHA" || { echo 'STOP: gate chain SHA drift'; exit 1; }
          echo "PRODUCTION-DATA-ELIGIBLE: $CANDIDATE_SHA"
