name: Create Abstrekkt Pages Project One-Shot

on:
  push:
    branches:
      - infra/create-abstrekkt-pages-project-20260827

permissions:
  contents: read

concurrency:
  group: create-abstrekkt-pages-project
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.126.0'
  PROJECT_NAME: abstrekkt

jobs:
  create:
    name: Ensure Pages project exists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'STOP: CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'STOP: CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Resolve or create Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@${WRANGLER_VERSION} pages project list --json)"
          export LIST
          EXISTS="$(node - <<'NODE'
          const parsed = JSON.parse(process.env.LIST);
          const rows = Array.isArray(parsed) ? parsed : (parsed.result || []);
          process.stdout.write(rows.some(row => row.name === process.env.PROJECT_NAME) ? 'yes' : 'no');
          NODE
          )"

          if [[ "$EXISTS" = 'no' ]]; then
            npx --yes wrangler@${WRANGLER_VERSION} pages project create "$PROJECT_NAME" \
              --production-branch=main
          else
            echo "Pages project $PROJECT_NAME already exists; no mutation needed."
          fi

      - name: Verify project read-back
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            > /tmp/project.json

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/project.json', 'utf8'));
          if (!payload.success) throw new Error(JSON.stringify(payload.errors || []));
          const project = payload.result || {};
          if (project.name !== process.env.PROJECT_NAME) throw new Error('Project name mismatch');
          if (project.production_branch !== 'main') throw new Error('Production branch mismatch');
          console.log(JSON.stringify({
            name: project.name,
            subdomain: project.subdomain,
            production_branch: project.production_branch,
            created_on: project.created_on,
          }, null, 2));
          NODE
