name: Package Netlify MCP

on:
  push:
    branches: [loxihart-pilot-console-build]
    paths:
      - '.github/workflows/package-netlify-mcp.yml'

# Least privilege: read-only repository token. Grant extra scopes per job only if a step needs them.
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p netlify-mcp-runtime && npm install --prefix netlify-mcp-runtime @netlify/mcp@1.15.1
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runtime
          path: netlify-mcp-runtime
