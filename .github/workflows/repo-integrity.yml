name: Repository Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile integrity checker
        run: python -m py_compile scripts/repo_integrity.py

      - name: Test repository authority contract
        run: python -m unittest discover -s tests -p 'test_repository_authority.py'

      - name: Validate extraction boundary and credential ignore rules
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/extract-subtree.sh
          python -m py_compile scripts/extract_subtree.py
          python -m unittest discover -s tests -p 'test_extraction_boundary.py'
          git check-ignore --quiet tooling/mcp-clients/codex/.codex/config.toml
          git check-ignore --quiet tooling/mcp-clients/codex/.codex/config.toml.tmp

      - name: Run integrity checks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-${PUSH_BASE_SHA:-}}"
          python scripts/repo_integrity.py --base "$BASE_SHA"
