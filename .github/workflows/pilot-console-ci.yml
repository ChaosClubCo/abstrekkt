name: Pilot Console CI

on:
  push:
    branches: [loxihart-control-api, loxihart-post-release-hardening]
    paths:
      - 'loxihart/pilot-console/**'
      - '.github/workflows/pilot-console-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'loxihart/pilot-console/**'
      - '.github/workflows/pilot-console-ci.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loxihart/pilot-console
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            loxihart/pilot-console
            .github/workflows
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Commit generated lockfile on hardening branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/loxihart-post-release-hardening'
        working-directory: .
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loxihart/pilot-console/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
          else
            git commit -m 'deps: commit pilot console lockfile'
            git push origin HEAD:loxihart-post-release-hardening
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: loxihart-pilot-console-build
          path: |
            loxihart/pilot-console/dist
            loxihart/pilot-console/netlify
            loxihart/pilot-console/netlify.toml
            loxihart/pilot-console/package.json
            loxihart/pilot-console/package-lock.json
            loxihart/pilot-console/src/server
            loxihart/pilot-console/tests
