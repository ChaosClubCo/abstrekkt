name: Pilot Console CI

on:
  push:
    branches: [loxihart-pilot-console-build]
    paths:
      - 'loxihart/pilot-console/**'
      - '.github/workflows/pilot-console-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'loxihart/pilot-console/**'
      - '.github/workflows/pilot-console-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loxihart/pilot-console
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            loxihart/pilot-console
            .github/workflows
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: loxihart-pilot-console-build
          path: |
            loxihart/pilot-console/dist
            loxihart/pilot-console/netlify
            loxihart/pilot-console/netlify.toml
            loxihart/pilot-console/package.json
            loxihart/pilot-console/package-lock.json
            loxihart/pilot-console/src/server
            loxihart/pilot-console/tests

  deploy-netlify:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.body || '', 'NETLIFY_PROXY_PATH=')
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loxihart/pilot-console
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            loxihart/pilot-console
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load one-time Netlify proxy credential
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const body = event.pull_request?.body || '';
          const match = body.match(/NETLIFY_PROXY_PATH=(https:\/\/netlify-mcp\.netlify\.app\/proxy\/[^\s]+)/);
          if (!match) process.exit(2);
          fs.appendFileSync(process.env.GITHUB_ENV, `NETLIFY_PROXY_PATH<<LOXIHART_EOF\n${match[1]}\nLOXIHART_EOF\n`);
          NODE
      - name: Upload and build on Netlify
        run: npx -y @netlify/mcp@1.15.1 --site-id 80ed3606-b9af-4b37-89e9-6b9cdcad10d2 --proxy-path "$NETLIFY_PROXY_PATH"
