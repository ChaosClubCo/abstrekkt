name: Pilot Console Live Probe

on:
  push:
    branches: [loxihart-pilot-console-build]
    paths:
      - '.github/workflows/pilot-console-live-probe.yml'

# Least privilege: read-only repository token. Grant extra scopes per job only if a step needs them.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live control-plane probe disabled
        run: |
          echo "Live GET/POST against the public Pilot Console Control API is disabled."
          echo "CI must not probe, mutate, or log live control-plane bodies."
