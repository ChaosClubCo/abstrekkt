name: Abstrekkt Remaining Control Plane Repair

on:
  push:
    branches:
      - fix/abstrekkt-apex-workers-build-20260827
    paths:
      - .github/workflows/abstrekkt-cloudflare-control-plane-diagnostic.yml

permissions:
  contents: read

env:
  CF_WORKER_TAG: 0de39fcd153c4e0abb62195038e55158
  CF_DANGEROUS_TRIGGER: 603761b6-b260-487a-b5bb-0e87c7c8b498
  CF_REPO_CONNECTION: 525212f4-4156-4ab0-9a5b-be72951d69c4

jobs:
  workers-build:
    runs-on: ubuntu-latest
    steps:
      - name: Remove legacy main Workers Build if an authorized user token already exists
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_WORKERS_CI: ${{ secrets.CLOUDFLARE_WORKERS_CI_TOKEN }}
          CF_USER: ${{ secrets.CLOUDFLARE_USER_API_TOKEN }}
          CF_ADMIN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CF_ALT: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          python <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          tag=os.environ['CF_WORKER_TAG']; expected_uuid=os.environ['CF_DANGEROUS_TRIGGER']; expected_conn=os.environ['CF_REPO_CONNECTION']
          root='https://api.cloudflare.com/client/v4'
          candidates=[('CLOUDFLARE_WORKERS_CI_TOKEN',os.environ.get('CF_WORKERS_CI','')),('CLOUDFLARE_USER_API_TOKEN',os.environ.get('CF_USER','')),('CLOUDFLARE_ADMIN_API_TOKEN',os.environ.get('CF_ADMIN','')),('CF_API_TOKEN',os.environ.get('CF_ALT','')),('CLOUDFLARE_API_TOKEN',os.environ.get('CF_PRIMARY',''))]
          evidence={'schema':'AbstrekktWorkersBuildRepairReceipt/v1','candidate_secret_presence':{k:bool(v) for k,v in candidates},'attempts':[],'status':'BLOCKED_NO_AUTHORIZED_USER_TOKEN'}
          def call(token,method,path):
              req=urllib.request.Request(root+path,method=method,headers={'Authorization':f'Bearer {token}'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode() or '{}'; return r.status,json.loads(raw)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode() or '{}'
                  try:p=json.loads(raw)
                  except Exception:p={'raw':raw[:300]}
                  return e.code,p
          for label,token in candidates:
              if not token: continue
              verify_s,verify_p=call(token,'GET','/user/tokens/verify')
              attempt={'secret':label,'verify_http':verify_s,'verify_status':(verify_p.get('result') or {}).get('status')}
              trig_s,trig_p=call(token,'GET',f'/accounts/{account}/builds/workers/{tag}/triggers')
              attempt['triggers_http']=trig_s
              if trig_s!=200 or trig_p.get('success') is False:
                  attempt['errors']=trig_p.get('errors'); evidence['attempts'].append(attempt); continue
              rows=trig_p.get('result') or []
              exact=[r for r in rows if r.get('trigger_uuid')==expected_uuid and (r.get('deploy_command') or '').strip()=='npx wrangler deploy' and 'main' in (r.get('branch_includes') or []) and ((r.get('repo_connection') or {}).get('repo_connection_uuid'))==expected_conn]
              if not exact:
                  dangerous=[r for r in rows if (r.get('deploy_command') or '').strip()=='npx wrangler deploy' and 'main' in (r.get('branch_includes') or [])]
                  if not dangerous:
                      evidence['status']='PASS_ALREADY_ABSENT'; attempt['result']='no dangerous main trigger'; evidence['attempts'].append(attempt); break
                  attempt['result']='dangerous trigger differs from frozen identity; fail closed'; evidence['attempts'].append(attempt); continue
              del_s,del_p=call(token,'DELETE',f'/accounts/{account}/builds/triggers/{expected_uuid}')
              attempt['delete_http']=del_s; attempt['delete_success']=del_p.get('success'); attempt['delete_errors']=del_p.get('errors')
              if del_s<200 or del_s>=300 or del_p.get('success') is False:
                  evidence['attempts'].append(attempt); continue
              time.sleep(4)
              after_s,after_p=call(token,'GET',f'/accounts/{account}/builds/workers/{tag}/triggers')
              remaining=[r for r in (after_p.get('result') or []) if (r.get('deploy_command') or '').strip()=='npx wrangler deploy' and 'main' in (r.get('branch_includes') or []) and not r.get('deleted_on')]
              attempt['readback_http']=after_s; attempt['dangerous_remaining']=len(remaining); evidence['attempts'].append(attempt)
              if after_s==200 and not remaining:
                  evidence['status']='PASS_REMOVED'; evidence['authorized_secret']=label; break
          Path('workers-build-repair.json').write_text(json.dumps(evidence,indent=2)); print(json.dumps(evidence,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abstrekkt-workers-build-repair
          path: workers-build-repair.json
          if-no-files-found: error
          retention-days: 90

  github-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR and required checks if an admin PAT already exists
        env:
          GH_ADMIN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
          GH_PAT: ${{ secrets.GITHUB_PAT }}
          GH_ALT: ${{ secrets.GH_PAT }}
          GH_PERSONAL: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          api='https://api.github.com'; repo='Krosebrook/abstrekkt'; ruleset_name='Abstrekkt main release guard'
          candidates=[('GITHUB_ADMIN_TOKEN',os.environ.get('GH_ADMIN','')),('GITHUB_PAT',os.environ.get('GH_PAT','')),('GH_PAT',os.environ.get('GH_ALT','')),('PERSONAL_ACCESS_TOKEN',os.environ.get('GH_PERSONAL',''))]
          evidence={'schema':'AbstrekktGitHubProtectionRepairReceipt/v1','candidate_secret_presence':{k:bool(v) for k,v in candidates},'attempts':[],'status':'BLOCKED_NO_ADMIN_TOKEN'}
          def call(token,method,path,data=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(api+path,data=body,method=method,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode() or '{}'; return r.status,json.loads(raw)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode() or '{}'
                  try:p=json.loads(raw)
                  except Exception:p={'raw':raw[:300]}
                  return e.code,p
          payload={
            'name':ruleset_name,'target':'branch','enforcement':'active',
            'conditions':{'ref_name':{'include':['~DEFAULT_BRANCH'],'exclude':[]}},
            'rules':[
              {'type':'deletion'}, {'type':'non_fast_forward'},
              {'type':'pull_request','parameters':{'required_approving_review_count':0,'dismiss_stale_reviews_on_push':False,'require_code_owner_review':False,'require_last_push_approval':False,'required_review_thread_resolution':False,'allowed_merge_methods':['merge','squash','rebase']}},
              {'type':'required_status_checks','parameters':{'required_status_checks':[{'context':'Repository integrity'},{'context':'integrity'}],'strict_required_status_checks_policy':True,'do_not_enforce_on_create':False}}
            ]
          }
          for label,token in candidates:
              if not token: continue
              repo_s,repo_p=call(token,'GET',f'/repos/{repo}')
              attempt={'secret':label,'repo_http':repo_s,'admin':(repo_p.get('permissions') or {}).get('admin')}
              if repo_s!=200 or not (repo_p.get('permissions') or {}).get('admin'):
                  evidence['attempts'].append(attempt); continue
              rs_s,rs_p=call(token,'GET',f'/repos/{repo}/rulesets')
              attempt['rulesets_http']=rs_s
              if rs_s!=200:
                  attempt['errors']=rs_p; evidence['attempts'].append(attempt); continue
              existing=[r for r in rs_p if r.get('name')==ruleset_name]
              if existing:
                  rule_id=existing[0]['id']; put_s,put_p=call(token,'PUT',f'/repos/{repo}/rulesets/{rule_id}',payload); attempt['mutation']='update'; attempt['mutation_http']=put_s; result=put_p
              else:
                  post_s,post_p=call(token,'POST',f'/repos/{repo}/rulesets',payload); attempt['mutation']='create'; attempt['mutation_http']=post_s; result=post_p
              if attempt['mutation_http'] not in (200,201):
                  attempt['errors']=result; evidence['attempts'].append(attempt); continue
              read_s,read_p=call(token,'GET',f'/repos/{repo}/rulesets/{result.get("id")}')
              types=[r.get('type') for r in (read_p.get('rules') or [])]
              attempt['readback_http']=read_s; attempt['rule_types']=types; evidence['attempts'].append(attempt)
              if read_s==200 and 'pull_request' in types and 'required_status_checks' in types and 'non_fast_forward' in types and 'deletion' in types:
                  evidence['status']='PASS_ENFORCED'; evidence['ruleset_id']=result.get('id'); evidence['authorized_secret']=label; break
          Path('github-protection-repair.json').write_text(json.dumps(evidence,indent=2)); print(json.dumps(evidence,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abstrekkt-github-protection-repair
          path: github-protection-repair.json
          if-no-files-found: error
          retention-days: 90
