name: Abstrekkt Cloudflare Access Repair

on:
  push:
    branches:
      - fix/abstrekkt-apex-workers-build-20260827
    paths:
      - .github/workflows/abstrekkt-cloudflare-control-plane-diagnostic.yml

permissions:
  contents: read

env:
  HOSTNAME: abstrekkt.com
  CF_PROJECT: abstrekkt
  EXPECTED_TITLE: Abstrekkt, Progress. Not pretending.

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove exact Access application with ephemeral account token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python <<'PY'
          import datetime, json, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          parent=os.environ['CLOUDFLARE_API_TOKEN']
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          hostname=os.environ['HOSTNAME'].lower()
          root='https://api.cloudflare.com/client/v4'
          evidence={'schema':'AbstrekktCloudflareAccessRepairReceipt/v1','hostname':hostname,'actions':[]}
          ephemeral_id=None

          def call(token, method, path, data=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(root+path,data=body,method=method,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode() or '{}'; return r.status,json.loads(raw)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode() or '{}'
                  try: payload=json.loads(raw)
                  except Exception: payload={'raw':raw}
                  return e.code,payload

          def app_host(domain):
              raw=(domain or '').strip()
              if not raw: return ''
              probe=raw if '://' in raw else 'https://'+raw
              try: return (urllib.parse.urlparse(probe).hostname or '').lower()
              except Exception: return ''

          try:
              s,p=call(parent,'GET',f'/accounts/{account}/tokens/permission_groups')
              if s!=200 or p.get('success') is False:
                  raise SystemExit(f'Cannot list account token permission groups: HTTP {s} {p.get("errors")}')
              groups=p.get('result') or []
              candidates=[g for g in groups if (g.get('name') or '').lower() in ('access: apps and policies write','access: apps and policies edit') and 'com.cloudflare.api.account' in (g.get('scopes') or [])]
              if len(candidates)!=1:
                  raise SystemExit(f'Expected one Access Apps/Policies write group, found {[(g.get("name"),g.get("scopes")) for g in candidates]}')
              group=candidates[0]
              evidence['access_permission_group']={'id':group.get('id'),'name':group.get('name')}

              expires=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=15)).replace(microsecond=0).isoformat().replace('+00:00','Z')
              s,p=call(parent,'POST',f'/accounts/{account}/tokens',{
                  'name':f'ephemeral-abstrekkt-access-repair-{os.environ.get("GITHUB_RUN_ID","manual")}',
                  'policies':[{'effect':'allow','resources':{f'com.cloudflare.api.account.{account}':'*'},'permission_groups':[{'id':group['id']}]}],
                  'expires_on':expires
              })
              evidence['ephemeral_token_create']={'http_status':s,'success':p.get('success'),'errors':p.get('errors')}
              if s<200 or s>=300 or p.get('success') is False:
                  raise SystemExit(f'Access token creation failed: HTTP {s} {p.get("errors")}')
              created=p.get('result') or {}; ephemeral_id=created.get('id'); token=created.get('value')
              if not ephemeral_id or not token: raise SystemExit('Created Access token missing id/value')

              apps=[]; page=1
              while True:
                  s,p=call(token,'GET',f'/accounts/{account}/access/apps?per_page=100&page={page}')
                  if s!=200 or p.get('success') is False:
                      raise SystemExit(f'Access app inventory failed: HTTP {s} {p.get("errors")}')
                  rows=p.get('result') or []; apps.extend(rows)
                  info=p.get('result_info') or {}
                  if page >= int(info.get('total_pages') or 1): break
                  page+=1
              compact=lambda a:{k:a.get(k) for k in ('id','name','domain','type','created_at','updated_at','app_launcher_visible','skip_interstitial')}
              evidence['apps_before']=[compact(a) for a in apps]
              matching=[a for a in apps if app_host(a.get('domain'))==hostname]
              if len(matching)!=1:
                  raise SystemExit(f'Expected exactly one Access app protecting {hostname}; found {[compact(a) for a in matching]}')
              app=matching[0]; app_id=app.get('id')
              evidence['matched_app']=compact(app)

              s,p=call(token,'GET',f'/accounts/{account}/access/apps/{app_id}/policies?per_page=100')
              if s!=200 or p.get('success') is False:
                  raise SystemExit(f'Access policy read failed: HTTP {s} {p.get("errors")}')
              evidence['matched_app_policies']=p.get('result') or []

              s,p=call(token,'DELETE',f'/accounts/{account}/access/apps/{app_id}')
              evidence['actions'].append({'action':'delete_exact_access_app','app_id':app_id,'http_status':s,'success':p.get('success'),'errors':p.get('errors')})
              if s<200 or s>=300 or p.get('success') is False:
                  raise SystemExit(f'Access application deletion failed: HTTP {s} {p.get("errors")}')

              time.sleep(3)
              s,p=call(token,'GET',f'/accounts/{account}/access/apps?per_page=100&page=1')
              if s!=200 or p.get('success') is False:
                  raise SystemExit(f'Post-delete Access inventory failed: HTTP {s} {p.get("errors")}')
              after=p.get('result') or []
              still=[a for a in after if app_host(a.get('domain'))==hostname]
              evidence['matching_apps_after']=[compact(a) for a in still]
              if still: raise SystemExit(f'Access application still protects {hostname}: {evidence["matching_apps_after"]}')
              evidence['status']='ACCESS_GATE_REMOVED'
          finally:
              if ephemeral_id:
                  s,p=call(parent,'DELETE',f'/accounts/{account}/tokens/{ephemeral_id}')
                  evidence['ephemeral_token_revoke']={'http_status':s,'success':p.get('success'),'errors':p.get('errors')}
              Path('access-repair-receipt.json').write_text(json.dumps(evidence,indent=2))
              print(json.dumps(evidence,indent=2))
          PY

      - name: Verify public Pages content and routes
        run: |
          set -euo pipefail
          python <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          host='https://'+os.environ['HOSTNAME']
          routes=[('/',200),('/founder/',200),('/pillars/',200),('/contact/',200),('/__public-release-probe-20260827',404)]
          security={'x-content-type-options':'nosniff','x-frame-options':'DENY','referrer-policy':'strict-origin-when-cross-origin','permissions-policy':'camera=(), microphone=(), geolocation=()'}
          results=[]
          for path,expected in routes:
              observed=None
              for attempt in range(1,13):
                  h='/tmp/h'; b='/tmp/b'
                  p=subprocess.run(['curl','-sS','--connect-timeout','10','--max-time','30','-D',h,'-o',b,'-w','%{http_code}|%{url_effective}',host+path],capture_output=True,text=True,check=True)
                  status_s,url=p.stdout.strip().split('|',1); status=int(status_s)
                  headers={}
                  for line in Path(h).read_text(errors='replace').splitlines():
                      if ':' in line:
                          k,v=line.split(':',1); headers[k.strip().lower()]=v.strip()
                  body=Path(b).read_text(errors='replace')
                  observed=(status,url,headers,body)
                  if status==expected and 'cloudflareaccess.com' not in headers.get('location','').lower() and 'Sign in - Cloudflare Access' not in body and 'Sign in  Cloudflare Access' not in body:
                      break
                  time.sleep(5)
              status,url,headers,body=observed
              if status!=expected: raise SystemExit(f'{path}: HTTP {status}, expected {expected}; headers={headers}')
              if 'cloudflareaccess.com' in headers.get('location','').lower() or 'Cloudflare Access' in body[:2000]:
                  raise SystemExit(f'{path}: Cloudflare Access gate still present')
              missing={k:v for k,v in security.items() if headers.get(k,'').lower()!=v.lower()}
              if missing: raise SystemExit(f'{path}: security headers mismatch {missing}; observed={headers}')
              if path=='/':
                  title=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
                  actual=(title.group(1).strip() if title else None)
                  if actual!=os.environ['EXPECTED_TITLE']:
                      raise SystemExit(f'Root title mismatch: {actual!r}')
              results.append({'path':path,'status':status,'url':url,'headers':{k:headers.get(k) for k in security}})
          Path('public-site-verification.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY

      - name: Read Pages custom-domain status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains/$HOSTNAME" > pages-domain-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('pages-domain-after.json').read_text()); r=p.get('result') or {}
          print(json.dumps({k:r.get(k) for k in ('id','name','status','verification_data','validation_data')},indent=2))
          PY

      - name: Upload Access repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abstrekkt-cloudflare-access-repair
          path: |
            access-repair-receipt.json
            public-site-verification.json
            pages-domain-after.json
          if-no-files-found: warn
          retention-days: 90
