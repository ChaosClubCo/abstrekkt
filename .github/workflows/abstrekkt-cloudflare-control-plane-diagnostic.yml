name: Abstrekkt Cloudflare Control Plane Diagnostic

on:
  push:
    branches:
      - fix/abstrekkt-apex-workers-build-20260827
    paths:
      - .github/workflows/abstrekkt-cloudflare-control-plane-diagnostic.yml

permissions:
  contents: read

env:
  CF_ZONE_ID: 418c205318b9d95b1758c23d19bf6195
  CF_PROJECT: abstrekkt
  CF_WORKER: abstrekkt
  HOSTNAME: abstrekkt.com

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Cloudflare token authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python <<'PY'
          import json, os, urllib.error, urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          root='https://api.cloudflare.com/client/v4'
          def get(path):
              req=urllib.request.Request(root+path, headers={'Authorization':f'Bearer {token}'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads((r.read().decode() or '{}'))
              except urllib.error.HTTPError as e:
                  raw=e.read().decode() or '{}'
                  try: payload=json.loads(raw)
                  except Exception: payload={'raw':raw}
                  return e.code,payload
          checks={}
          for key,path in {
              'verify':'/user/tokens/verify',
              'user_tokens':'/user/tokens?per_page=50&include_expired=true',
              'permission_groups':'/user/tokens/permission_groups',
              'account_tokens':f'/accounts/{account}/tokens?per_page=50&include_expired=true',
          }.items():
              status,payload=get(path)
              checks[key]={'http_status':status,'success':payload.get('success'),'errors':payload.get('errors')}
              if key=='verify': checks[key]['result']=payload.get('result')
              if key=='permission_groups' and status==200:
                  wanted=('API Tokens','DNS','Workers CI','Workers Routes','Workers Scripts','Account API Tokens')
                  checks[key]['matching_permission_groups']=[{'id':r.get('id'),'name':r.get('name'),'scopes':r.get('scopes')} for r in (payload.get('result') or []) if any(w.lower() in (r.get('name') or '').lower() for w in wanted)]
              if key in ('user_tokens','account_tokens') and status==200:
                  verify_id=(checks.get('verify',{}).get('result') or {}).get('id')
                  rows=payload.get('result') or []
                  checks[key]['token_count']=len(rows)
                  checks[key]['current_token']=[{'id':r.get('id'),'name':r.get('name'),'status':r.get('status'),'policies':r.get('policies')} for r in rows if r.get('id')==verify_id]
          print(json.dumps(checks, indent=2))
          with open('cloudflare-token-authority.json','w') as f: json.dump(checks,f,indent=2)
          PY

      - name: Upload token authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: abstrekkt-cloudflare-token-authority
          path: cloudflare-token-authority.json
          if-no-files-found: error
          retention-days: 30
