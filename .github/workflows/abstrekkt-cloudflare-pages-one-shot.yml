name: Abstrekkt Cloudflare Pages One-Shot

on:
  push:
    branches:
      - release/abstrekkt-1a7da25-pages-final-20260827

permissions:
  contents: read

concurrency:
  group: abstrekkt-cloudflare-pages-one-shot
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 1a7da25a5de89489c9d0e82c42bcce06c3f64034
  PROJECT_NAME: abstrekkt
  WRANGLER_VERSION: '4.126.0'

jobs:
  deploy:
    name: Deploy frozen exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'STOP: CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'STOP: CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Checkout trusted automation revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: automation

      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C candidate rev-parse HEAD)"
          test "$ACTUAL" = "$CANDIDATE_SHA" || {
            echo "STOP: checked out $ACTUAL, expected $CANDIDATE_SHA"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate trusted automation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/scripts/repo_integrity.py
          python -m json.tool automation/.github/mcp.json >/dev/null
          test -s automation/.github/copilot-instructions.md
          test -s automation/.github/workflows/repository-webhooks.yml

      - name: Re-run repository authority checks on candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git -C candidate rev-parse HEAD^ 2>/dev/null || true)"
          mkdir -p candidate/.release-tools
          cp automation/scripts/repo_integrity.py candidate/.release-tools/repo_integrity.py
          python candidate/.release-tools/repo_integrity.py --base "$BASE_SHA"

      - name: Validate static release package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='candidate/project/deploy/abstrekkt-com'
          test -s "$ROOT/index.html"
          test -s "$ROOT/founder/index.html"
          test -s "$ROOT/pillars/index.html"
          test -s "$ROOT/contact/index.html"
          test -s "$ROOT/404.html"
          if find "$ROOT" -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa*' \) -print -quit | grep -q .; then
            echo 'STOP: credential-like file present in static release package'
            exit 1
          fi

      - name: Add production response headers in release workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > candidate/project/deploy/abstrekkt-com/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            Cache-Control: public, max-age=0, must-revalidate
          EOF

      - name: Hash final release workspace
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os

          root = Path('candidate/project/deploy/abstrekkt-com')
          digest = sha256()
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix().encode()
              digest.update(len(rel).to_bytes(8, 'big'))
              digest.update(rel)
              data = path.read_bytes()
              digest.update(len(data).to_bytes(8, 'big'))
              digest.update(data)
          value = digest.hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'PACKAGE_MANIFEST_SHA256={value}\n')
          print(f'Final release workspace SHA-256: {value}')
          PY

      - name: Verify Pages project via Cloudflare API
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            > /tmp/pages-project.json

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/pages-project.json', 'utf8'));
          if (!payload.success) throw new Error(JSON.stringify(payload.errors || []));
          const project = payload.result || {};
          if (project.name !== process.env.PROJECT_NAME) throw new Error('Project name mismatch');
          if (project.production_branch !== 'main') throw new Error('Production branch mismatch');
          console.log(JSON.stringify({
            name: project.name,
            subdomain: project.subdomain,
            production_branch: project.production_branch,
          }, null, 2));
          NODE

      - name: Deploy exact candidate to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy \
            candidate/project/deploy/abstrekkt-com \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="$CANDIDATE_SHA" \
            2>&1 | tee /tmp/pages-deploy.log

      - name: Resolve deployment from Cloudflare API
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments" \
            > /tmp/pages-deployments.json

          python <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(Path('/tmp/pages-deployments.json').read_text())
          if not payload.get('success'):
              raise SystemExit(f"Cloudflare API did not return success: {payload.get('errors')}")
          candidate = os.environ['CANDIDATE_SHA']
          matches = []
          for row in payload.get('result') or []:
              meta = ((row.get('deployment_trigger') or {}).get('metadata') or {})
              if meta.get('commit_hash') == candidate:
                  matches.append(row)
          if not matches:
              raise SystemExit(f'No Pages deployment found for exact commit {candidate}')
          row = sorted(matches, key=lambda x: x.get('created_on') or '', reverse=True)[0]
          values = {
              'PAGES_DEPLOYMENT_ID': row.get('id') or '',
              'PAGES_DEPLOYMENT_URL': row.get('url') or '',
              'PAGES_DEPLOYED_AT': row.get('created_on') or '',
          }
          if not all(values.values()):
              raise SystemExit(f'Incomplete deployment evidence: {values}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          print(json.dumps(values, indent=2))
          PY

      - name: Verify deployed URL and create receipt
        shell: bash
        run: |
          set -euo pipefail
          STATUS='000'
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            STATUS="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --output /tmp/pages-index.html \
              --write-out '%{http_code}' \
              "$PAGES_DEPLOYMENT_URL" || true)"
            if [[ "$STATUS" = '200' ]]; then break; fi
            echo "Read-back attempt $ATTEMPT returned HTTP $STATUS"
            sleep 2
          done
          test "$STATUS" = '200' || { echo "STOP: deployment read-back returned HTTP $STATUS"; exit 1; }
          READBACK_SHA256="$(sha256sum /tmp/pages-index.html | awk '{print $1}')"
          export READBACK_SHA256

          python <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              'schema': 'AbstrekktCloudflarePagesReleaseReceipt/v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'trusted_automation_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'provider': 'Cloudflare Pages',
              'project_name': os.environ['PROJECT_NAME'],
              'deployment_id': os.environ['PAGES_DEPLOYMENT_ID'],
              'public_url': os.environ['PAGES_DEPLOYMENT_URL'],
              'deployed_at': os.environ['PAGES_DEPLOYED_AT'],
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'readback': {
                  'method': 'GET',
                  'status': 200,
                  'sha256': os.environ['READBACK_SHA256'],
              },
              'package_manifest_sha256': os.environ['PACKAGE_MANIFEST_SHA256'],
          }
          Path('abstrekkt-pages-release-receipt.json').write_text(
              json.dumps(receipt, indent=2), encoding='utf-8'
          )
          PY

          echo "Deployment ID: $PAGES_DEPLOYMENT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment URL: $PAGES_DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-back: HTTP 200 PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-SHA release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abstrekkt-cloudflare-pages-release-receipt
          path: abstrekkt-pages-release-receipt.json
          if-no-files-found: error
          retention-days: 90
