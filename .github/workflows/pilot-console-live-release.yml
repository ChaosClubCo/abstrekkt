name: Pilot Console Live Release Gate

on:
  push:
    branches: [loxihart-pilot-console-build]
    paths:
      - '.github/workflows/pilot-console-live-release.yml'
  workflow_dispatch:

# Least privilege: read-only repository token. Grant extra scopes per job only if a step needs them.
permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Live control-plane release gate disabled
        run: |
          echo "Live workflow/sop/baseline/change/evidence/verification mutations are disabled."
          echo "CI must not POST to the public Pilot Console Control API or log response bodies."
          exit 1
