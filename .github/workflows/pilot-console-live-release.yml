name: Pilot Console Live Release Gate

on:
  push:
    branches: [loxihart-pilot-console-build]
    paths:
      - '.github/workflows/pilot-console-live-release.yml'
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute live canonical release gate
        env:
          BASE_URL: https://loxihart-pilot-console.netlify.app/api/loxihart
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL;
          const uuid = () => crypto.randomUUID();

          async function get(operation) {
            const r = await fetch(`${base}?operation=${encodeURIComponent(operation)}`, {
              headers: { Accept: 'application/json' },
            });
            const text = await r.text();
            let body;
            try { body = text ? JSON.parse(text) : null; } catch { body = text; }
            console.log(`GET ${operation} -> ${r.status}`, JSON.stringify(body));
            return { status: r.status, body };
          }

          async function post(operation, payload) {
            const r = await fetch(base, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({ operation, ...payload }),
            });
            const text = await r.text();
            let body;
            try { body = text ? JSON.parse(text) : null; } catch { body = text; }
            console.log(`POST ${operation} -> ${r.status}`, JSON.stringify(body));
            return { status: r.status, body };
          }

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          const initial = await get('pilot.read');
          assert(initial.status === 200, `initial pilot.read expected 200, got ${initial.status}`);
          assert(initial.body?.pilot?.stage === 'DISCOVERY_ACTIVE', `expected DISCOVERY_ACTIVE, got ${initial.body?.pilot?.stage}`);
          assert(initial.body?.pilot?.version === 0, `expected control version 0, got ${initial.body?.pilot?.version}`);

          // 1. Deliberate stale mutation must preserve 409 and leave state unchanged.
          const stale = await post('workflow.approve', {
            expectedVersion: 999,
            mutationId: `stale-smoke:${uuid()}`,
          });
          assert(stale.status === 409, `expected stale status 409, got ${stale.status}`);
          assert(stale.body?.error?.code === 'STALE_VERSION', `expected STALE_VERSION, got ${stale.body?.error?.code}`);
          assert(stale.body?.error?.currentVersion === 0, `expected currentVersion 0, got ${stale.body?.error?.currentVersion}`);

          const afterStale = await get('pilot.read');
          assert(afterStale.status === 200, 'pilot.read after stale failed');
          assert(afterStale.body?.pilot?.stage === 'DISCOVERY_ACTIVE', 'stale mutation changed stage');
          assert(afterStale.body?.pilot?.version === 0, 'stale mutation changed version');

          // 2. Valid lifecycle.
          let version = 0;

          let r = await post('workflow.approve', {
            expectedVersion: version,
            mutationId: `workflow-approve:${uuid()}`,
          });
          assert(r.status === 200, `workflow.approve failed ${r.status}`);
          version = r.body?.pilot?.version;
          assert(version === 1, `workflow version expected 1, got ${version}`);

          r = await post('sop.approve', {
            expectedVersion: version,
            mutationId: `sop-approve:${uuid()}`,
          });
          assert(r.status === 200, `sop.approve failed ${r.status}`);
          version = r.body?.pilot?.version;
          assert(version === 2, `sop version expected 2, got ${version}`);

          r = await post('baseline.lock', {
            expectedVersion: version,
            mutationId: `baseline-lock:${uuid()}`,
            acceptance: {
              criteriaVersion: 'lakeview-intake-v1',
              frozenAt: '2026-08-21T12:00:00.000Z',
              baselineMinSamples: 20,
              postChangeMinSamples: 20,
              primary: {
                id: 'complete-at-handoff',
                metric: 'complete_at_handoff_rate',
                operator: 'gte',
                absoluteTarget: 0.9,
                minRelativeImprovementPct: 25,
              },
              guardrails: [{
                id: 'assignment-time',
                metric: 'median_assignment_time_minutes',
                betterDirection: 'lower',
                maxRegressionPct: 10,
              }],
            },
            baseline: {
              metric: 'complete_at_handoff_rate',
              value: 0.6,
              sampleSize: 20,
              observedFrom: '2026-08-19T12:00:00.000Z',
              observedTo: '2026-08-20T12:00:00.000Z',
              evidenceRefs: ['ev-baseline'],
            },
          });
          assert(r.status === 200, `baseline.lock failed ${r.status}`);
          version = r.body?.pilot?.version;
          assert(version === 3, `baseline version expected 3, got ${version}`);

          const occurredAt = '2026-08-22T14:00:00.000Z';
          r = await post('change.approve', {
            expectedVersion: version,
            mutationId: `change-approve:${uuid()}`,
            occurredAt,
            change: {
              changeId: 'chg-required-dispatch-fields-v1',
              problem: 'Requests reach dispatch without all dispatch-critical information.',
              description: 'Require customer ID, service location, issue category, and equipment identifier before READY_FOR_ASSIGNMENT.',
              expectedResult: 'Increase complete-at-handoff rate to at least 90%.',
              rollback: 'Disable required-field validation and restore the prior intake behavior.',
              approvedAt: occurredAt,
              activatedAt: occurredAt,
              implementationEvidenceRefs: ['ev-implementation'],
              materialDeveloperIntervention: false,
            },
          });
          assert(r.status === 200, `change.approve failed ${r.status}`);
          version = r.body?.pilot?.version;
          assert(version === 4, `change version expected 4, got ${version}`);

          r = await post('evidence.append', {
            expectedVersion: version,
            mutationId: `evidence:${uuid()}`,
            evidence: {
              id: 'ev-postchange-primary',
              evidenceClass: 'DATASET',
              source: 'lakeview://post-change/requests-001',
              observedAt: '2026-08-30T18:00:00.000Z',
              sha256: 'bca89024a9cb09c6b8a00a8a44e15d1864ceee820b9def0ecb826dd0d3878abe',
              trustworthy: true,
            },
            observationComplete: false,
          });
          assert(r.status === 200, `primary evidence failed ${r.status}`);
          version = r.body?.pilot?.version;
          assert(version === 5, `primary evidence version expected 5, got ${version}`);

          r = await post('evidence.append', {
            expectedVersion: version,
            mutationId: `evidence:${uuid()}`,
            evidence: {
              id: 'ev-postchange-guardrail',
              evidenceClass: 'DATASET',
              source: 'lakeview://post-change/assignment-time-001',
              observedAt: '2026-08-30T18:00:00.000Z',
              sha256: '9a0a28d2245ba6f00eb9a6f8a754e1d8277eaf9be323454de58a47be6bb0be2a',
              trustworthy: true,
            },
            observationComplete: true,
          });
          assert(r.status === 200, `guardrail evidence failed ${r.status}`);
          version = r.body?.pilot?.version;
          assert(version === 6, `guardrail evidence version expected 6, got ${version}`);
          assert(r.body?.pilot?.stage === 'OBSERVATION_COMPLETE', `expected OBSERVATION_COMPLETE, got ${r.body?.pilot?.stage}`);

          r = await post('verification.commit', {
            expectedVersion: version,
            mutationId: `verification:${uuid()}`,
            verificationAt: '2026-08-31T18:00:00.000Z',
            receiptAt: '2026-08-31T18:00:01.000Z',
            requestedAt: '2026-08-31T18:00:02.000Z',
            postChange: {
              metric: 'complete_at_handoff_rate',
              value: 0.95,
              sampleSize: 20,
              evidenceRefs: ['ev-postchange-primary'],
            },
            guardrails: [{
              metric: 'median_assignment_time_minutes',
              baselineValue: 25,
              postChangeValue: 26,
              evidenceRefs: ['ev-postchange-guardrail'],
            }],
          });
          assert(r.status === 200, `verification.commit failed ${r.status}`);
          const signedReceipt = r.body?.signedReceipt;
          const receiptId = signedReceipt?.receipt?.receiptId;
          assert(receiptId, 'verification did not return receiptId');
          assert(signedReceipt?.receipt?.verdict === 'PASS', `expected PASS, got ${signedReceipt?.receipt?.verdict}`);
          assert(r.body?.signatureVerification?.valid === true, 'server did not validate signature at commit');

          // 3. Cryptographic receipt verification through live receipt.verify.
          const verify = await post('receipt.verify', { receiptId });
          assert(verify.status === 200, `receipt.verify failed ${verify.status}`);
          assert(verify.body?.valid === true, `receipt invalid: ${JSON.stringify(verify.body)}`);
          assert(Array.isArray(verify.body?.errors) && verify.body.errors.length === 0, 'receipt verify returned errors');

          // 4. Fresh reloads must retain RECEIPT_ISSUED and same receipt identity.
          const reloadPilot = await get('pilot.read');
          const reloadHead = await get('stream.head');
          const reloadStream = await get('stream.read');
          assert(reloadPilot.status === 200, 'reload pilot.read failed');
          assert(reloadHead.status === 200, 'reload stream.head failed');
          assert(reloadStream.status === 200, 'reload stream.read failed');
          assert(reloadPilot.body?.pilot?.stage === 'RECEIPT_ISSUED', `expected RECEIPT_ISSUED, got ${reloadPilot.body?.pilot?.stage}`);
          assert(reloadPilot.body?.canonical?.latestReceiptId === receiptId, 'pilot.read receipt changed after reload');
          assert(reloadHead.body?.latestReceiptId === receiptId, 'stream.head receipt changed after reload');
          assert(reloadHead.body?.latestVerdict === 'PASS', `expected latest PASS, got ${reloadHead.body?.latestVerdict}`);
          assert(Array.isArray(reloadStream.body?.records) && reloadStream.body.records.length >= 1, 'stream history missing receipt');

          console.log('RELEASE_GATE_PASS', JSON.stringify({
            staleStatus: stale.status,
            staleCode: stale.body?.error?.code,
            staleCurrentVersion: stale.body?.error?.currentVersion,
            receiptId,
            verdict: signedReceipt.receipt.verdict,
            signatureValid: verify.body.valid,
            stageAfterReload: reloadPilot.body.pilot.stage,
            canonicalVersion: reloadHead.body.currentVersion,
            recordCount: reloadStream.body.records.length,
          }));
          NODE
