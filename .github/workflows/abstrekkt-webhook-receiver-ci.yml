name: Abstrekkt Webhook Receiver CI

on:
  pull_request:
    paths:
      - 'tooling/webhook-receiver/**'
      - '.github/workflows/abstrekkt-webhook-receiver-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Webhook receiver tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run receiver tests
        working-directory: tooling/webhook-receiver
        run: npm test
