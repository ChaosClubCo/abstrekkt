name: Bind Abstrekkt Custom Domain One-Shot

on:
  push:
    branches:
      - infra/bind-abstrekkt-custom-domain-20260827

permissions:
  contents: read

concurrency:
  group: abstrekkt-custom-domain-binding
  cancel-in-progress: false

env:
  PROJECT_NAME: abstrekkt
  CUSTOM_DOMAIN: abstrekkt.com
  ZONE_ID: 418c205318b9d95b1758c23d19bf6195
  DNS_TARGET: abstrekkt.pages.dev
  CANDIDATE_SHA: 1a7da25a5de89489c9d0e82c42bcce06c3f64034
  DEPLOYMENT_ID: e037b4c4-be20-4457-a341-ade84220df5f
  DEPLOYMENT_URL: https://e037b4c4.abstrekkt.pages.dev
  EXPECTED_READBACK_SHA256: d41ce7d9cb355e1a37e88d003b1f680bdb2fbd28de05492ef86e85c64b246a71

jobs:
  bind:
    name: Bind and verify abstrekkt.com
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'STOP: CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'STOP: CLOUDFLARE_ACCOUNT_ID is not configured'; exit 1; }

      - name: Verify certified deployment still exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments/$DEPLOYMENT_ID" \
            > /tmp/deployment.json

          python <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/deployment.json').read_text())
          if not payload.get('success'):
              raise SystemExit(f"Cloudflare deployment lookup failed: {payload.get('errors')}")
          row = payload.get('result') or {}
          if row.get('id') != os.environ['DEPLOYMENT_ID']:
              raise SystemExit('Deployment ID mismatch')
          meta = ((row.get('deployment_trigger') or {}).get('metadata') or {})
          if meta.get('commit_hash') != os.environ['CANDIDATE_SHA']:
              raise SystemExit(f"Candidate SHA mismatch: {meta.get('commit_hash')}")
          if row.get('url') != os.environ['DEPLOYMENT_URL']:
              raise SystemExit(f"Deployment URL mismatch: {row.get('url')}")
          PY

      - name: Add custom domain when absent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DOMAIN_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains/$CUSTOM_DOMAIN"
          STATUS="$(curl --silent --show-error \
            --output /tmp/domain-before.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$DOMAIN_URL" || true)"

          if [[ "$STATUS" = '200' ]]; then
            echo "Custom domain already exists; no create mutation needed."
          elif [[ "$STATUS" = '404' ]]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "{\"name\":\"$CUSTOM_DOMAIN\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains" \
              > /tmp/domain-created.json
          else
            echo "STOP: domain preflight returned HTTP $STATUS"
            cat /tmp/domain-before.json || true
            exit 1
          fi

      - name: Reconcile apex DNS to certified Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          DNS_API="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          LIST_STATUS="$(curl --silent --show-error \
            --output /tmp/dns-before.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$DNS_API?name=$CUSTOM_DOMAIN")"
          test "$LIST_STATUS" = '200' || { echo "STOP: DNS list returned HTTP $LIST_STATUS"; cat /tmp/dns-before.json; exit 1; }

          python <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/dns-before.json').read_text())
          if not payload.get('success'):
              raise SystemExit(payload.get('errors'))
          rows = payload.get('result') or []
          relevant = [r for r in rows if r.get('name') == os.environ['CUSTOM_DOMAIN'] and r.get('type') in {'A','AAAA','CNAME'}]
          Path('/tmp/dns-relevant.json').write_text(json.dumps(relevant, indent=2))
          cnames = [r for r in relevant if r.get('type') == 'CNAME']
          if cnames:
              Path('/tmp/cname-id').write_text(cnames[0]['id'])
          conflicts = [r['id'] for r in relevant if r.get('type') in {'A','AAAA'}]
          Path('/tmp/conflict-ids').write_text('\n'.join(conflicts))
          PY

          if [[ -s /tmp/conflict-ids ]]; then
            while IFS= read -r RECORD_ID; do
              [[ -n "$RECORD_ID" ]] || continue
              curl --fail-with-body --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$DNS_API/$RECORD_ID" > /tmp/dns-delete.json
            done < /tmp/conflict-ids
          fi

          if [[ -s /tmp/cname-id ]]; then
            RECORD_ID="$(cat /tmp/cname-id)"
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "{\"content\":\"$DNS_TARGET\",\"proxied\":true,\"ttl\":1}" \
              "$DNS_API/$RECORD_ID" > /tmp/dns-write.json
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "{\"type\":\"CNAME\",\"name\":\"$CUSTOM_DOMAIN\",\"content\":\"$DNS_TARGET\",\"proxied\":true,\"ttl\":1,\"comment\":\"Abstrekkt Cloudflare Pages production\"}" \
              "$DNS_API" > /tmp/dns-write.json
          fi

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$DNS_API?name=$CUSTOM_DOMAIN&type=CNAME" > /tmp/dns-after.json
          python <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/dns-after.json').read_text())
          rows = payload.get('result') or []
          matches = [r for r in rows if r.get('name') == os.environ['CUSTOM_DOMAIN'] and r.get('type') == 'CNAME']
          if len(matches) != 1:
              raise SystemExit(f'Expected one apex CNAME, found {len(matches)}')
          row = matches[0]
          if row.get('content') != os.environ['DNS_TARGET']:
              raise SystemExit(f"Unexpected CNAME target: {row.get('content')}")
          if row.get('proxied') is not True:
              raise SystemExit('Apex CNAME is not proxied')
          print(json.dumps({'id': row.get('id'), 'name': row.get('name'), 'content': row.get('content'), 'proxied': row.get('proxied')}, indent=2))
          PY

      - name: Retry Pages domain validation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains/$CUSTOM_DOMAIN" \
            > /tmp/domain-retry.json

      - name: Wait for active custom domain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DOMAIN_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains/$CUSTOM_DOMAIN"
          DOMAIN_STATUS='unknown'
          for ATTEMPT in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$DOMAIN_URL" > /tmp/domain.json
            DOMAIN_STATUS="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/domain.json').read_text())
          if not payload.get('success'):
              raise SystemExit(1)
          print((payload.get('result') or {}).get('status') or 'unknown')
          PY
            )"
            echo "Domain status attempt $ATTEMPT: $DOMAIN_STATUS"
            if [[ "$DOMAIN_STATUS" = 'active' ]]; then break; fi
            if [[ "$DOMAIN_STATUS" = 'blocked' || "$DOMAIN_STATUS" = 'error' || "$DOMAIN_STATUS" = 'deactivated' ]]; then
              cat /tmp/domain.json
              exit 1
            fi
            sleep 5
          done
          test "$DOMAIN_STATUS" = 'active' || { echo "STOP: custom domain did not become active"; cat /tmp/domain.json; exit 1; }

      - name: Verify custom-domain content and security headers
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_STATUS='000'
          for ATTEMPT in $(seq 1 30); do
            CUSTOM_META="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --dump-header /tmp/custom.headers \
              --output /tmp/custom.body \
              --write-out '%{http_code}|%{url_effective}' \
              "https://$CUSTOM_DOMAIN/" || true)"
            CUSTOM_STATUS="${CUSTOM_META%%|*}"
            CUSTOM_FINAL_URL="${CUSTOM_META#*|}"
            if [[ "$CUSTOM_STATUS" = '200' ]]; then break; fi
            echo "Custom-domain read-back attempt $ATTEMPT returned $CUSTOM_STATUS"
            sleep 4
          done
          test "$CUSTOM_STATUS" = '200' || { echo "STOP: custom-domain read-back returned $CUSTOM_STATUS"; exit 1; }
          [[ "$CUSTOM_FINAL_URL" = "https://$CUSTOM_DOMAIN/" ]] || { echo "STOP: unexpected redirect to $CUSTOM_FINAL_URL"; exit 1; }

          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/deployment.body \
            "$DEPLOYMENT_URL/"

          CUSTOM_SHA256="$(sha256sum /tmp/custom.body | awk '{print $1}')"
          DEPLOYMENT_SHA256="$(sha256sum /tmp/deployment.body | awk '{print $1}')"
          test "$CUSTOM_SHA256" = "$DEPLOYMENT_SHA256" || { echo 'STOP: custom domain body differs from certified deployment'; exit 1; }
          test "$CUSTOM_SHA256" = "$EXPECTED_READBACK_SHA256" || { echo 'STOP: custom domain body differs from certified read-back hash'; exit 1; }
          grep -qi '^x-frame-options: *DENY\r\{0,1\}$' /tmp/custom.headers || { echo 'STOP: X-Frame-Options DENY missing'; exit 1; }
          grep -qi '^x-content-type-options: *nosniff\r\{0,1\}$' /tmp/custom.headers || { echo 'STOP: X-Content-Type-Options nosniff missing'; exit 1; }

          echo "CUSTOM_STATUS=$CUSTOM_STATUS" >> "$GITHUB_ENV"
          echo "CUSTOM_FINAL_URL=$CUSTOM_FINAL_URL" >> "$GITHUB_ENV"
          echo "CUSTOM_SHA256=$CUSTOM_SHA256" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_SHA256=$DEPLOYMENT_SHA256" >> "$GITHUB_ENV"

      - name: Create custom-domain binding receipt
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          domain = (json.loads(Path('/tmp/domain.json').read_text()).get('result') or {})
          dns = (json.loads(Path('/tmp/dns-after.json').read_text()).get('result') or [None])[0] or {}
          receipt = {
              'schema': 'AbstrekktCustomDomainBindingReceipt/v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'project_name': os.environ['PROJECT_NAME'],
              'domain': os.environ['CUSTOM_DOMAIN'],
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'deployment_id': os.environ['DEPLOYMENT_ID'],
              'deployment_url': os.environ['DEPLOYMENT_URL'],
              'domain_status': domain.get('status'),
              'domain_id': domain.get('id') or domain.get('domain_id'),
              'zone_tag': domain.get('zone_tag'),
              'created_on': domain.get('created_on'),
              'certificate_authority': domain.get('certificate_authority'),
              'dns': {
                  'record_id': dns.get('id'),
                  'type': dns.get('type'),
                  'name': dns.get('name'),
                  'content': dns.get('content'),
                  'proxied': dns.get('proxied'),
              },
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'custom_readback': {
                  'url': os.environ['CUSTOM_FINAL_URL'],
                  'status': int(os.environ['CUSTOM_STATUS']),
                  'sha256': os.environ['CUSTOM_SHA256'],
              },
              'deployment_readback': {
                  'url': os.environ['DEPLOYMENT_URL'],
                  'status': 200,
                  'sha256': os.environ['DEPLOYMENT_SHA256'],
              },
              'content_match': os.environ['CUSTOM_SHA256'] == os.environ['DEPLOYMENT_SHA256'],
              'security_headers': {
                  'x_frame_options': 'DENY',
                  'x_content_type_options': 'nosniff',
              },
          }
          Path('abstrekkt-custom-domain-binding-receipt.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          PY

      - name: Upload custom-domain receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abstrekkt-custom-domain-binding-receipt
          path: abstrekkt-custom-domain-binding-receipt.json
          if-no-files-found: error
          retention-days: 90
