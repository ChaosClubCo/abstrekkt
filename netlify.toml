# Abstrekkt public-site deployment configuration
# Source package: project/deploy/abstrekkt-com
# This repository is currently not linked to a Netlify project.

[build]
  publish = "project/deploy/abstrekkt-com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
