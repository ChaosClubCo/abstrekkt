  {id:'D1',label:'Lee Chong Ming pitch',status:'hold',desc:'Final copy ready. Hold until kylerosebrook.com is live.',detail:`<div class="section"><div class="section-label">Pre-send checklist</div><ul class="checklist"><li><span class="check" onclick="toggle(this)"></span>kylerosebrook.com live and indexable</li><li><span class="check" onclick="toggle(this)"></span>AI Maturity Score has a live URL to include</li><li><span class="check" onclick="toggle(this)"></span>Delete old Gmail draft (subject: "Vibe engineering")</li></ul></div><div class="section" style="margin-top:12px"><div class="section-label">Final copy</div><div class="pitch-box">Hi Chong Ming,

Your workshop piece and the Amazon tech lead profile are both on my mind. You cover the people actually building things — not the tools. That's the right lens.

Kyle Rosebrook
kylerosebrook.com</div></div>`},

xcavator</td><td class="keep">keep</td><td>memoir tooling</td></tr><tr><td>TeamSync</td><td class="keep">keep</td><td>most-used, real data</td></tr><tr><td>TESSA / Tessa / Tessa — App</td><td class="merge">merge</td><td>pick one, kill other two</td></tr><tr><td>AI Maturity Score + AI Adoption Strategist</td><td class="merge">merge</td><td>AI Maturity Score wins</td></tr><tr><td>Ascend.AI + SparkAcademy</td><td class="merge">merge</td><td>pick one education lane</td></tr><tr><td>Sole Customizer / SoleIgnite</td><td class="merge">merge</td><td>pick one, kill the other</td></tr></table></div><div id="d2-top3" style="display:none"><div class="rank-card"><div class="card-header"><span class="card-id">Rank 1</span><span class="badge badge-urgent">days to first dollar</span></div><div class="card-title">AI Maturity Score</div><div class="card-desc">Built, functional, zero traffic. Wire kylerosebrook.com → tool → email → discovery call.</div></div><div class="rank-card"><div class="card-header"><span class="card-id">Rank 2</span><span class="badge badge-info">hours after publish</span></div><div class="card-title">Gumroad — Creator AI Workflow Kit v3.0</div><div class="card-desc">Listing drafted in Notion. Digital product, zero fulfillment. Publish + one LinkedIn post.</div></div><div class="rank-card"><div class="card-header"><span class="card-id">Rank 3</span><span class="badge badge-hold">2–4 weeks</span></div><div class="card-title">FlashFusion Discovery Call → Paid Audit</div><div class="card-desc">Workshop people are warm leads. 3 calls → 1 paid audit at $500–$1,500.</div></div></div><div id="d2-plan" style="display:none"><ul class="checklist"><li><span class="check" onclick="toggle(this)"></span><strong>Week 1 (Apr 16–22):</strong> Test AI Maturity Score, get live URL, wire to homepage</li><li><span class="check" onclick="toggle(this)"></span><strong>Week 2 (Apr 23–29):</strong> Send to workshop people, Ryan, Corey. One LinkedIn post.</li><li><span class="check" onclick="toggle(this)"></span><strong>Week 3 (Apr 30–May 6):</strong> Follow up completions, book 2–3 discovery calls, publish Gumroad</li><li><span class="check" onclick="toggle(this)"></span><strong>Week 4 (May 7–13):</strong> Run first paid call, propose audit at $500 / $1,500 / $4,500</li></ul></div>`},
  {id:'D6',label:'Workshop people list',status:'active',desc:"No list exists. Build it this week — it's your first pipeline.",detail:`<div class="section"><div class="section-label">Action</div><p style="font-size:13px;color:#555;line-height:1.6">Write down every name you can remember who said yes to the Claude workshop — even informally. Before Demo Day.</p></div><div class="section" style="margin-top:12px"><table><tr><th>Name</th><th>How</th><th>Contact</th><th>Sent?</th></tr><tr><td style="color:#aaa">[Add name]</td><td>Workshop confirmed</td><td>—</td><td>No</td></tr><tr><td style="color:#aaa">[Add name]</td><td>Workshop confirmed</td><td>—</td><td>No</td></tr><tr><td>Ryan Anderskow</td><td>First free audit target</td><td>—</td><td>No</td></tr><tr><td>Corey</td><td>Friend, consulting interest</td><td>—</td><td>No</td></tr></table></div>`},
  {id:'D7',label:'FlashFusion POC scope',status:'active',desc:'What "HUGE" actually looks like before the Intinc conversation.',detail:`<div class="section"><div class="section-label">Minimum viable HUGE — pick one</div><ul class="checklist"><li><span class="check" onclick="toggle(this)"></span>Case study: one external client, results documented, numbers attached</li><li><span class="check" onclick="toggle(this)"></span>Published credibility: Lee story exists, external validation</li><li><span class="check" onclick="toggle(this)"></span>One receipt: someone paid you for an AI audit</li></ul></div><div class="section" style="margin-top:12px"><div class="section-label">Fastest path</div><p style="font-size:13px;color:#555;line-height:1.6">AI Maturity Score → workshop people → one paid audit → case study exists. Timeline: 6–8 weeks from now.</p></div><div class="section" style="margin-top:12px"><div class="section-label">MSM pilot spec (ready when triggered)</div><p style="font-size:13px;color:#555;line-height:1.6">Automate one sales rep's outreach for 30 days. AI Maturity Score qualifies leads → n8n sends sequence → FlashFusion shows pipeline. Cost to them: $0. Ask: revenue share if it works.</p></div>`},
  {id:'D3',label:'Intinc/MSP strategy',status:'active',desc:'Captured privately. Do not act. Read the trigger conditions.',detail:`<div class="section"><div class="section-label">Do not act until one of these triggers</div><ul class="checklist"><li><span class="check" onclick="toggle(this)"></span>You leave Intinc voluntarily or otherwise</li><li><span class="check" onclick="toggle(this)"></span>Outsourced AI project visibly fails and someone asks you</li><li><span class="check" onclick="toggle(this)"></span>You have one paying external client as proof</li><li><span class="check" onclick="toggle(this)"></span>Leadership approaches you — not the other way around</li></ul></div><div class="section" style="margin-top:12px"><div class="section-label">The opportunity (ready when triggered)</div><p style="font-size:13px;color:#555;line-height:1.6">MSM is a sales company. Pain points confirmed from real calls: lead automation, email campaigns, outreach. You have insider knowledge, the tool already built (AI Maturity Score), and a 30-day pilot spec ready to propose.</p></div>`},
  {id:'D5',label:'Memoir: the permission trap',status:'active',desc:'Raw material from this session. Scene to excavate: the conference.',detail:`<div class="section"><div class="section-label">Raw material (verbatim)</div><div class="pitch-box">"I was hoping that somehow I could spin my life's story to her, just fucking impress and amaze and then once I get that recognition maybe I'll believe I can do this... or it'll prove I'm a fraud."

"Who's going to pay a non-accredited non-body to do this."</div></div><div class="section" style="margin-top:12px"><div class="section-label">Structural significance</div><p style="font-size:13px;color:#555;line-height:1.6">Kyle built 40+ real things. Caught real vulnerabilities. Built a lead tool in two days for a conference. None of it produced internal permission to believe the work was real. The one scaffold that never got built was self-belief. The diagnostic instinct works on systems. It breaks down when pointed inward.</p></div><div class="section" style="margin-top:12px"><div class="section-label">Scene to excavate — the conference</div><ul class="checklist"><li><span class="check" onclick="toggle(this)"></span>What was the conference? Who was the audience?</li><li><span class="check" onclick="toggle(this)"></span>Who specifically didn't look — one person, a room, leadership?</li><li><span class="check" onclick="toggle(this)"></span>What did you do after? Did you say anything? Close the laptop?</li><li><span class="check" onclick="toggle(this)"></span>Is the tool still on the same URL? Did you look at it after?</li><li><span class="check" onclick="toggle(this)"></span>When your boss told you in writing you were the AI SME — did you believe it?</li></ul></div>`}

function toggle(el){el.classList.toggle('done')}

function switchTab(tab,show){
  const tabs=tab.parentElement.querySelectorAll('.tab');
  tabs.forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  const detail=tab.closest('.detail');
  ['d2-kill','d2-keep','d2-top3','d2-plan'].forEach(id=>{
    const el=detail.querySelector('#'+id);
    if(el)el.style.display='none';
  });
  const target=document.getElementById(show);
  if(target)target.style.display='';
}

const statusColor={urgent:'badge-urgent',hold:'badge-hold',active:'badge-info'};
const statusLabel={urgent:'Urgent',hold:'On hold',active:'Active'};

let activeId=null;
const cardsEl=document.getElementById('cards');
const detailEl=document.getElementById('detail');

DELIVERABLES.forEach(d=>{
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="card-header"><span class="card-id">${d.id}</span><span class="badge ${statusColor[d.status]}">${statusLabel[d.status]}</span></div><div class="card-title">${d.label}</div><div class="card-desc">${d.desc}</div>`;
  card.onclick=()=>{
    if(activeId===d.id){
      activeId=null;
      detailEl.style.display='none';
      card.classList.remove('active');
    } else {
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
      activeId=d.id;
      detailEl.style.display='block';
      detailEl.innerHTML=`<h2>${d.id} — ${d.label}</h2>${d.detail}`;
      detailEl.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  };
  cardsEl.appendChild(card);
});

const demoDay=new Date('2026-04-18T09:00:00');
function updateCountdown(){
  const now=new Date();
  const diff=demoDay-now;
  if(diff<=0){document.getElementById('countdown').textContent='Demo Day is today';return}
  const h=Math.floor(diff/3600000);
  const d=Math.floor(h/24);
  const hrs=h%24;
  document.getElementById('countdown').textContent=`Demo Day: ${d}d ${hrs}h`;
}
updateCountdown();
setInterval(updateCountdown,60000);
</script>
