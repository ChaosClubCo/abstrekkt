experiment: LXH-E001
workflow: employee-equipment-request
requirements:
  - id: AUTH-001
    severity: critical
    mandatory: true
    statement: Anonymous users cannot access workflow data or actions.
    control_type: dynamic_negative
  - id: AUTH-002
    severity: critical
    mandatory: true
    statement: Employees can read and mutate only their own requests except fields reserved to later-stage approvers.
    control_type: dynamic_authorization
  - id: AUTH-003
    severity: critical
    mandatory: true
    statement: Managers can approve or reject only requests belonging to authorized subordinates.
    control_type: dynamic_authorization
  - id: AUTH-004
    severity: critical
    mandatory: true
    statement: IT actions are restricted to authenticated IT-role principals.
    control_type: dynamic_authorization
  - id: API-001
    severity: high
    mandatory: true
    statement: API authorization semantics match UI authorization semantics.
    control_type: dynamic_api
  - id: STATE-001
    severity: high
    mandatory: true
    statement: Only legal state transitions are accepted.
    control_type: dynamic_state_machine
  - id: STATE-002
    severity: high
    mandatory: true
    statement: Illegal backward, skipped, or duplicate transitions are rejected without corrupting state.
    control_type: dynamic_state_machine
  - id: APPROVAL-001
    severity: high
    mandatory: true
    statement: Manager approval is required before IT approval.
    control_type: dynamic_business_rule
  - id: INPUT-001
    severity: high
    mandatory: true
    statement: Untrusted input is validated and bounded before persistence or rendering.
    control_type: dynamic_security
  - id: AUDIT-001
    severity: high
    mandatory: true
    statement: Every material workflow mutation emits an immutable audit event with actor, action, target, timestamp, and outcome.
    control_type: dynamic_audit
  - id: SECRET-001
    severity: critical
    mandatory: true
    statement: No deployable artifact or client-visible surface exposes credentials or secret values.
    control_type: static_and_runtime_security
  - id: DEP-001
    severity: high
    mandatory: true
    statement: Dependencies contain no known unmitigated critical vulnerabilities at verification time.
    control_type: sca
  - id: DATA-001
    severity: high
    mandatory: true
    statement: Duplicate requests or repeated transition submissions cannot silently corrupt canonical workflow state.
    control_type: dynamic_integrity
  - id: FAIL-001
    severity: medium
    mandatory: true
    statement: Notification failure does not roll forward or corrupt business state incorrectly.
    control_type: fault_injection
  - id: OBS-001
    severity: medium
    mandatory: true
    statement: Verification evidence identifies exact application artifact, environment, test, expectation, observation, and result.
    control_type: evidence_integrity
  - id: TRACE-001
    severity: high
    mandatory: true
    statement: Every mandatory requirement maps bidirectionally to at least one executed control and preserved evidence item.
    control_type: traceability
