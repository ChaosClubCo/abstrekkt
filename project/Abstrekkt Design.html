<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Abstrekkt, AI Assessment Design System</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Literata:opsz,wght@7..72,300..600&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0A0C;
    --surface:#131315;
    --surface-2:#1C1B1D;
    --border:#2A2A2C;
    --border-strong:#353437;
    --violet:#FFBF00;
    --pink:#FBBC00;
    --cyan:#A9C7FF;
    --text:#E5E1E4;
    --muted:#9C8F78;
    --danger:#EF4444;
    --warning:#F59E0B;
    --success:#10B981;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Literata', Georgia, serif;
    --display:'EB Garamond', Georgia, serif;
  }
  html,body{margin:0;background:#08080A;color:var(--text);font-family:var(--sans);}
  *{box-sizing:border-box;}
  /* Canvas background, give the dark surfaces some breathing room from pure black */
  body{background:
    radial-gradient(1200px 600px at 20% 0%, rgba(255,191,0,.08), transparent 60%),
    radial-gradient(900px 500px at 80% 100%, rgba(251,188,0,.06), transparent 60%),
    #08080A;
  }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--violet); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens/primitives.jsx"></script>
<script type="text/babel" src="screens/foundations.jsx"></script>
<script type="text/babel" src="screens/login.jsx"></script>
<script type="text/babel" src="screens/dashboard.jsx"></script>
<script type="text/babel" src="screens/projects.jsx"></script>
<script type="text/babel" src="screens/assessment.jsx"></script>
<script type="text/babel" src="screens/rules.jsx"></script>
<script type="text/babel" src="screens/reports.jsx"></script>
<script type="text/babel" src="screens/admin.jsx"></script>
<script type="text/babel" src="screens/audit.jsx"></script>
<script type="text/babel" src="screens/app.jsx"></script>

</body>
</html>
