name = "kr-mentor-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

[observability.traces]
enabled = true

# Secrets are NOT stored here. Set them with:
#   wrangler secret put PROXY_TOKEN
#   wrangler secret put NOTION_TOKEN
#   wrangler secret put GITHUB_TOKEN
#   (one per upstream you use)
#
# Optional non-secret config can go under [vars]:
# [vars]
# MCP_URL = "https://your-mcp-server.example.com"
