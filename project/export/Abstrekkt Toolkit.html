document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\">SELL<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">ROI Calculator<\u002Fdiv>\n        <div class=\"card-desc\">Sliders for team size, hours saved, and engagement cost. Spits out weekly value, annual projection, year-1 ROI, and a payback week. Run it before the first call so you arrive with the math already done.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /roi<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/02-discovery-scorecard.html\" data-track=\"sell\" data-tags=\"discovery qualify scorecard fit lead\">\n        <div class=\"card-head\"><span class=\"card-num\">02<\u002Fspan><span class=\"card-tag t-sell\">SELL<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Discovery Scorecard<\u002Fdiv>\n        <div class=\"card-desc\">Score a prospect across pain, urgency, budget, and authority. Tells you go / nurture / pass before you write the proposal.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /discovery<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/05-proposal-builder.html\" data-track=\"sell\" data-tags=\"proposal scope quote sow contract\">\n        <div class=\"card-head\"><span class=\"card-num\">05<\u002Fspan><span class=\"card-tag t-sell\">SELL<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Proposal Builder<\u002Fdiv>\n        <div class=\"card-desc\">Pick a track, drop in scope blocks, calibrate price. Outputs a shareable one-pager that doesn't read like a Mad Lib.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /proposal<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/07-pipeline-dashboard.html\" data-track=\"sell\" data-tags=\"pipeline crm deals stage forecast\">\n        <div class=\"card-head\"><span class=\"card-num\">07<\u002Fspan><span class=\"card-tag t-sell\">SELL<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Pipeline Dashboard<\u002Fdiv>\n        <div class=\"card-desc\">Stage-by-stage view of deals, weighted value, conversion math. The honest version, not the manifestation board.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /pipeline<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/09-outreach-tracker.html\" data-track=\"sell\" data-tags=\"outreach sequence cadence email cold\">\n        <div class=\"card-head\"><span class=\"card-num\">09<\u002Fspan><span class=\"card-tag t-sell\">SELL<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Outreach Tracker<\u002Fdiv>\n        <div class=\"card-desc\">Log sequences, opens, replies, no-replies. Surfaces the messages that actually pulled and the ones that quietly died.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /outreach<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/10-battle-card-browser.html\" data-track=\"sell\" data-tags=\"battle cards competitor objection\">\n        <div class=\"card-head\"><span class=\"card-num\">10<\u002Fspan><span class=\"card-tag t-sell\">SELL<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Battle Card Browser<\u002Fdiv>\n        <div class=\"card-desc\">Searchable rolodex of competitor angles, objection responses, and the lines that have closed before.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /cards<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── SHIP ─────────────────────────────────────── -->\n  <section data-track=\"ship\">\n    <div class=\"section-head\">\n      <div class=\"section-title\">\n        <span class=\"num\">02 / SHIP<\u002Fspan>\n        <span>Delivery, ops, the actual work<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"section-meta\">05 tools<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <a class=\"card feature\" href=\"tools/06-audit-report-generator.html\" data-track=\"ship\" data-tags=\"audit report deliverable assessment\">\n        <div class=\"card-head\"><span class=\"card-num\">06<\u002Fspan><span class=\"card-tag t-ship\">SHIP<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Audit Report Generator<\u002Fdiv>\n        <div class=\"card-desc\">The flagship. Takes raw findings, structures them by domain, ranks impact, and renders a client-ready PDF — without making you write the same paragraph thirty times. The report you actually want to deliver.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /audit<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/04-sprint-tracker.html\" data-track=\"ship\" data-tags=\"sprint task project standup ship\">\n        <div class=\"card-head\"><span class=\"card-num\">04<\u002Fspan><span class=\"card-tag t-ship\">SHIP<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Sprint Tracker<\u002Fdiv>\n        <div class=\"card-desc\">Two-week scoreboard. Plan, in-flight, shipped, slipped. Built for one operator running ten threads, not a Scrum cult.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /sprint<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/08-revenue-tracker.html\" data-track=\"ship\" data-tags=\"revenue mrr cash money invoice\">\n        <div class=\"card-head\"><span class=\"card-num\">08<\u002Fspan><span class=\"card-tag t-ship\">SHIP<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Revenue Tracker<\u002Fdiv>\n        <div class=\"card-desc\">MRR, one-shots, invoices outstanding, runway. The number you check before you pretend not to check the number.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /revenue<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/11-client-dashboard.html\" data-track=\"ship\" data-tags=\"client account health portfolio\">\n        <div class=\"card-head\"><span class=\"card-num\">11<\u002Fspan><span class=\"card-tag t-ship\">SHIP<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Client Dashboard<\u002Fdiv>\n        <div class=\"card-desc\">Per-client health: scope, spend, last-touch, sentiment flags. Catches the slow drift before it becomes a churn email.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /clients<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/14-onboarding-hub.html\" data-track=\"ship\" data-tags=\"onboarding kickoff intake new client\">\n        <div class=\"card-head\"><span class=\"card-num\">14<\u002Fspan><span class=\"card-tag t-ship\">SHIP<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Onboarding Hub<\u002Fdiv>\n        <div class=\"card-desc\">The first 14 days, choreographed. Intake, kickoff, access, expectations. So week-three doesn't start with a panic email.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /onboarding<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── BUILD ────────────────────────────────────── -->\n  <section data-track=\"build\">\n    <div class=\"section-head\">\n      <div class=\"section-title\">\n        <span class=\"num\">03 / BUILD<\u002Fspan>\n        <span>Skills, agents, capability<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"section-meta\">03 tools<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <a class=\"card feature\" href=\"tools/15-agent-builder-ui.html\" data-track=\"build\" data-tags=\"agent llm prompt builder workflow\">\n        <div class=\"card-head\"><span class=\"card-num\">15<\u002Fspan><span class=\"card-tag t-build\">BUILD<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Agent Builder UI<\u002Fdiv>\n        <div class=\"card-desc\">Compose multi-step agents from blocks: input → prompt → tool → output. Test runs inline, version on save. The kit we use to ship the agents inside other tools in this toolkit.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /agents<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/03-skills-browser.html\" data-track=\"build\" data-tags=\"skills capability library learning\">\n        <div class=\"card-head\"><span class=\"card-num\">03<\u002Fspan><span class=\"card-tag t-build\">BUILD<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Skills Browser<\u002Fdiv>\n        <div class=\"card-desc\">Tag-filterable library of operator skills — what they are, who uses them, where they pay off. Less LinkedIn, more atlas.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /skills<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/13-skills-gap-detector.html\" data-track=\"build\" data-tags=\"gap analysis capability map missing\">\n        <div class=\"card-head\"><span class=\"card-num\">13<\u002Fspan><span class=\"card-tag t-build\">BUILD<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Skills Gap Detector<\u002Fdiv>\n        <div class=\"card-desc\">Compare a role's required skills against an operator's actual ones. Heatmap of where to invest training next quarter.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /gap<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── CARE ─────────────────────────────────────── -->\n  <section data-track=\"care\">\n    <div class=\"section-head\">\n      <div class=\"section-title\">\n        <span class=\"num\">04 / CARE<\u002Fspan>\n        <span>Voice, community, the people side<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"section-meta\">02 tools<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <a class=\"card feature\" href=\"tools/16-abstrekkt-daily-dispatch.html\" data-track=\"care\" data-tags=\"dispatch daily community newsletter abstrekkt\">\n        <div class=\"card-head\"><span class=\"card-num\">16<\u002Fspan><span class=\"card-tag t-care\">CARE<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Abstrekkt Daily Dispatch<\u002Fdiv>\n        <div class=\"card-desc\">Generates the day's peer-support note for the Club. Theme + tone + community signal in. Honest, no-toxic-positivity message out. The voice we don't break, automated only at the surface.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /dispatch<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n      <a class=\"card\" href=\"tools/12-newsletter-generator.html\" data-track=\"care\" data-tags=\"newsletter email content writing\">\n        <div class=\"card-head\"><span class=\"card-num\">12<\u002Fspan><span class=\"card-tag t-care\">CARE<\u002Fspan><\u002Fdiv>\n        <div class=\"card-title\">Newsletter Generator<\u002Fdiv>\n        <div class=\"card-desc\">Outline → draft → subject lines, in the voice you've already calibrated. For the issues you owe but haven't written.<\u002Fdiv>\n        <div class=\"card-foot\"><span>↳ /newsletter<\u002Fspan><span class=\"arrow\">→<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div id=\"empty\" class=\"empty hide\">No tools match — try a different keyword.<\u002Fdiv>\n\n  <footer>\n    <div><span class=\"mark\">●<\u002Fspan>&nbsp;&nbsp;ABSTREKKT.CO &nbsp;·&nbsp; OPERATOR TOOLKIT v1.0<\u002Fdiv>\n    <div>NO MASKS &nbsp;·&nbsp; NO PRETENDING &nbsp;·&nbsp; EVERYONE BELONGS<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<script>\n  (function () {\n    const q = document.getElementById('q');\n    const chips = document.querySelectorAll('.chip');\n    const cards = document.querySelectorAll('.card');\n    const sections = document.querySelectorAll('section[data-track]');\n    const empty = document.getElementById('empty');\n    let activeFilter = 'all';\n\n    function applyFilters() {\n      const term = q.value.trim().toLowerCase();\n      let visible = 0;\n\n      cards.forEach(card => {\n        const track = card.getAttribute('data-track');\n        const tags = (card.getAttribute('data-tags') || '').toLowerCase();\n        const text = card.textContent.toLowerCase();\n\n        const trackOk = activeFilter === 'all' || track === activeFilter;\n        const termOk = !term || text.includes(term) || tags.includes(term);\n\n        const show = trackOk && termOk;\n        card.classList.toggle('hide', !show);\n        if (show) visible++;\n      });\n\n      // hide whole sections if no visible cards inside\n      sections.forEach(sec => {\n        const any = sec.querySelectorAll('.card:not(.hide)').length;\n        sec.classList.toggle('hide', any === 0);\n      });\n\n      empty.classList.toggle('hide', visible !== 0);\n    }\n\n    chips.forEach(chip => {\n      chip.addEventListener('click', () => {\n        chips.forEach(c => c.classList.remove('active'));\n        chip.classList.add('active');\n        activeFilter = chip.getAttribute('data-filter');\n        applyFilters();\n      });\n    });\n\n    q.addEventListener('input', applyFilters);\n    // keyboard \"/\" focuses search\n    document.addEventListener('keydown', (e) => {\n      if (e.key === '/' && document.activeElement !== q) {\n        e.preventDefault();\n        q.focus();\n      }\n    });\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
