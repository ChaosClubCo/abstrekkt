<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Load-Bearing Catalog, 83 Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,300..600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101216; --s-low:#0c0e12; --c-low:#181b20; --c:#1e2024; --c-hi:#282a2e; --c-top:#333539;
    --ink:#f2efe7; --ink-2:#c9cdd3; --ink-3:#8b949e; --ink-4:#5a626b;
    --rule:rgba(139,148,158,.16); --rule-2:rgba(139,148,158,.32);
    --ember:#cf5a32; --ember-text:#de7449; --ember-dim:rgba(207,90,50,.1);
    --gold:#c4935a; --blue:#70d3f5;
    --r:4px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Literata',Georgia,serif;font-size:16px;line-height:1.6;min-height:100dvh;overflow-x:hidden}
  :focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:var(--r)}
  ::selection{background:var(--ember-dim);color:var(--ember-text)}

  header{position:sticky;top:0;z-index:50;background:rgba(16,18,22,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
  .bar{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:18px 32px 6px;max-width:1520px;margin:0 auto}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ember)}
  .eyebrow a{color:var(--ember);text-decoration:none}.eyebrow a:hover{color:var(--ember-text)}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:30px;letter-spacing:-.02em;color:var(--ink);line-height:1}
  .gen{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--ink-4);text-transform:uppercase;display:flex;gap:14px;align-items:center}
  .gen a{color:var(--ink-3);text-decoration:none}.gen a:hover{color:var(--ember-text)}

  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 32px 14px;max-width:1520px;margin:0 auto}
  .search{flex:1 1 220px;min-width:180px;background:var(--c-low);border:1px solid var(--rule);border-radius:var(--r);
    color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;padding:9px 13px;height:38px;transition:border-color .15s}
  .search::placeholder{color:var(--ink-4)}
  .search:focus{outline:none;border-color:var(--ember)}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
    background:transparent;border:1px solid var(--rule);border-radius:var(--r);padding:0 12px;height:32px;cursor:pointer;
    transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .chip:hover{border-color:var(--rule-2);color:var(--ink)}
  .chip[aria-pressed=true]{background:var(--ember);border-color:var(--ember);color:#101216;font-weight:600}
  .chip .ct{opacity:.6;font-weight:400}
  .chip[data-token=load_bearing] .sw{background:var(--ember)}
  .chip[data-token=midnight_ember] .sw{background:var(--gold)}
  .chip[data-token=pitch_console] .sw{background:#ff8a5c}
  .chip .sw{width:7px;height:7px;border-radius:1px;display:inline-block}
  .toggle{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
    background:transparent;border:1px dashed var(--rule-2);border-radius:var(--r);padding:0 12px;height:32px;cursor:pointer;
    transition:all .15s;display:inline-flex;align-items:center;gap:7px}
  .toggle:hover{color:var(--ink)}
  .toggle .sw{width:7px;height:7px;background:var(--ink-4);transition:background .15s}
  .toggle[aria-pressed=true]{color:var(--ink);border-color:var(--ember)}
  .toggle[aria-pressed=true] .sw{background:var(--ember)}

  .summary{max-width:1520px;margin:0 auto;padding:0 32px 14px;display:flex;gap:22px;flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
  .summary b{color:var(--ember-text);font-weight:600}
  .summary .vis{color:var(--ink)}

  main{max-width:1520px;margin:0 auto;padding:8px 32px 80px}
  section{margin-top:34px;scroll-margin-top:120px}
  .sec-head{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--rule);position:relative}
  .sec-head::before,.sec-head::after{content:"+";position:absolute;bottom:-7px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-4)}
  .sec-head::before{left:-14px}.sec-head::after{right:-14px}
  .sec-head h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;color:var(--ink);letter-spacing:-.01em}
  .sec-head .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ember);letter-spacing:.1em}
  .sec-head .blurb{margin-left:auto;font-size:13px;color:var(--ink-3);max-width:48ch;text-align:right;line-height:1.4}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--c-low);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;transition:border-color .18s,transform .18s,background .18s}
  .card:hover{border-color:var(--ember);transform:translateY(-2px);background:var(--c)}
  .thumb{position:relative;aspect-ratio:16/10;background:var(--s-low);overflow:hidden;border-bottom:1px solid var(--rule)}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
  .tok-edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ember)}
  .tok-edge.midnight_ember{background:var(--gold)}
  .tok-edge.pitch_console{background:#ff8a5c}
  .dupflag{position:absolute;top:8px;right:8px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);background:rgba(16,18,22,.82);border:1px solid var(--rule-2);border-radius:var(--r);padding:3px 8px}

  .body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
  .ct-title{font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:600;line-height:1.2;color:var(--ink)}
  .meta{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;color:var(--ink-4);text-transform:uppercase}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
  .b{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid;border-radius:2px;line-height:1.4}
  .b-tok{color:var(--ember-text);border-color:rgba(207,90,50,.4);background:var(--ember-dim)}
  .b-tok.midnight_ember{color:var(--gold);border-color:rgba(196,147,90,.4);background:rgba(196,147,90,.08)}
  .b-tok.pitch_console{color:#ff8a5c;border-color:rgba(255,138,92,.4);background:rgba(255,138,92,.08)}
  .b-dup{color:var(--ink-3);border-color:var(--rule-2);border-style:dashed}

  .empty{padding:60px 0;text-align:center;color:var(--ink-4);font-style:italic;font-size:14px}

  .lb{position:fixed;inset:0;z-index:200;background:rgba(8,9,12,.88);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:32px}
  .lb.open{display:flex}
  .lb-inner{max-width:1180px;width:100%;max-height:90dvh;background:var(--c-low);border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:1fr 320px}
  .lb-img{background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center}
  .lb-img img{width:100%;height:auto;display:block}
  .lb-side{padding:24px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--rule);overflow-y:auto}
  .lb-side h3{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:23px;line-height:1.15;color:var(--ink)}
  .kv{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;color:var(--ink-2)}
  .kv .k{color:var(--ink-4);text-transform:uppercase;letter-spacing:.1em;font-size:9px;display:block;margin-top:9px}
  .kv .src{color:var(--ember-text);word-break:break-all}
  .lb-close{position:absolute;top:20px;right:24px;z-index:1;width:40px;height:40px;border-radius:var(--r);background:rgba(16,18,22,.7);border:1px solid var(--rule-2);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .lb-close:hover{background:var(--c-hi)}
  @media (max-width:760px){.lb-inner{grid-template-columns:1fr;max-height:94dvh}.lb-img{max-height:50dvh}}

  footer{max-width:1520px;margin:0 auto;padding:30px 32px 60px;border-top:1px solid var(--rule);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-4);line-height:1.8}
  footer b{color:var(--ink-3)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div>
      <div class="eyebrow"><a href="Load-Bearing Home.html">Abstrekkt · Load-Bearing</a> · Design Index</div>
      <h1>Load-Bearing Catalog</h1>
    </div>
    <div class="gen"><a href="Load-Bearing Home.html">← Site</a><span id="gen"></span></div>
  </div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="search title, family, id…" aria-label="Search">
    <div class="chips" id="famChips"></div>
    <div class="chips" id="tokChips"></div>
    <button class="toggle" id="tDup" aria-pressed="false"><span class="sw"></span>Show second-takes</button>
  </div>
  <div class="summary" id="summary"></div>
</header>

<main id="main"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <div class="lb-inner">
    <div class="lb-img"><img id="lbImg" alt=""></div>
    <div class="lb-side" id="lbSide"></div>
  </div>
</div>

<footer id="footer"></footer>

<script>
const state={q:"",family:"all",token:"all",dup:false};
let M=null;
fetch("loadbearing/manifest.json").then(r=>r.json()).then(m=>{M=m;init();})
  .catch(()=>{document.getElementById("main").innerHTML='<div class="empty">Could not load loadbearing/manifest.json</div>';});

function init(){
  document.getElementById("gen").textContent="GEN "+M.generated+" · "+M.count+" SCREENS";
  const fc=document.getElementById("famChips");
  const mk=(key,label,n)=>`<button class="chip" data-fam="${key}" aria-pressed="${key==='all'}">${label}${n!=null?` <span class="ct">${n}</span>`:''}</button>`;
  fc.innerHTML=mk("all","All",M.count)+M.familyOrder.map(k=>mk(k,M.families[k].label,M.records.filter(r=>r.family===k).length)).join("");
  fc.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.family=b.dataset.fam;fc.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
  const tc=document.getElementById("tokChips");
  const mkt=(key,label)=>`<button class="chip" data-token="${key}" aria-pressed="${key==='all'}">${key==='all'?'':'<span class=\"sw\"></span>'}${label}</button>`;
  tc.innerHTML=mkt("all","All tokens")+Object.keys(M.tokens).map(k=>mkt(k,M.tokens[k].label)).join("");
  tc.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.token=b.dataset.token;tc.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
  const td=document.getElementById("tDup");
  td.onclick=()=>{state.dup=!state.dup;td.setAttribute("aria-pressed",state.dup);render();};
  document.getElementById("q").oninput=e=>{state.q=e.target.value.toLowerCase().trim();render();};
  document.getElementById("lbClose").onclick=closeLb;
  document.getElementById("lb").onclick=e=>{if(e.target.id==="lb")closeLb();};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb();});
  render();
  const p=new URLSearchParams(location.search);
  const ff=p.get("family"); if(ff&&M.families[ff]){state.family=ff;fc.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.fam===ff));render();}
  const fo=p.get("focus"); if(fo){const r=M.records.find(x=>x.id===fo); if(r){if(r.status==="variant"){state.dup=true;td.setAttribute("aria-pressed","true");}render();openLb(fo);}}
}
function visible(){
  return M.records.filter(r=>{
    if(!state.dup && r.status==="variant") return false;
    if(state.family!=="all" && r.family!==state.family) return false;
    if(state.token!=="all" && r.token!==state.token) return false;
    if(state.q){const hay=(r.title+" "+r.family+" "+r.id).toLowerCase(); if(!hay.includes(state.q)) return false;}
    return true;
  });
}
function badges(r){
  let b=`<span class="b b-tok ${r.token}">${M.tokens[r.token].label}</span>`;
  if(r.status==="variant") b+='<span class="b b-dup">2nd take</span>';
  return b;
}
function render(){
  const main=document.getElementById("main"); const vis=visible();
  document.getElementById("summary").innerHTML=
    `<span>Showing <span class="vis">${vis.length}</span> / ${M.count}</span>`+
    `<span>Canonical token <b>${M.records.filter(r=>r.token==='load_bearing').length}</b></span>`+
    `<span>Second-takes <b>${M.records.filter(r=>r.status==='variant').length}</b>${state.dup?' shown':' hidden'}</span>`+
    `<span>Parent <b>${M.parentBrand}</b></span>`;
  const fams=state.family==="all"?M.familyOrder:[state.family];
  let html="";
  for(const fn of fams){
    const rows=vis.filter(r=>r.family===fn); if(!rows.length) continue;
    const F=M.families[fn];
    html+=`<section><div class="sec-head"><h2>${F.label}</h2><span class="n">${rows.length}</span><span class="blurb">${F.blurb}</span></div><div class="grid">`;
    for(const r of rows){
      html+=`<article class="card" data-id="${r.id}" tabindex="0">
        <div class="thumb"><span class="tok-edge ${r.token}"></span>
          <img loading="lazy" src="${r.thumb}" alt="">
          ${r.status==="variant"?'<span class="dupflag">2nd take</span>':""}
        </div>
        <div class="body"><div class="ct-title">${r.title}</div>
          <div class="meta">${F.label}</div>
          <div class="badges">${badges(r)}</div></div></article>`;
    }
    html+=`</div></section>`;
  }
  main.innerHTML=html||'<div class="empty">No screens match these filters.</div>';
  main.querySelectorAll(".card").forEach(c=>{
    const open=()=>openLb(c.dataset.id);
    c.onclick=open; c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}};
  });
}
function openLb(id){
  const r=M.records.find(x=>x.id===id); if(!r) return;
  document.getElementById("lbImg").src=r.thumb;
  document.getElementById("lbSide").innerHTML=
    `<h3>${r.title}</h3><div class="badges">${badges(r)}</div>
     <div class="kv">
       <span class="k">Family</span>${M.families[r.family].label}
       <span class="k">Token variant</span>${M.tokens[r.token].label}
       <span class="k">Status</span>${r.status}
       <span class="k">Source</span><span class="src">${r.source}</span>
       <span class="k">ID</span>${r.id}
     </div>`;
  document.getElementById("lb").classList.add("open");
}
function closeLb(){document.getElementById("lb").classList.remove("open");}
document.getElementById("footer").innerHTML=
  'LOAD-BEARING CATALOG · 83 SCREENS &nbsp;|&nbsp; source: <b>stitch_load_bearing_design_system</b> &nbsp;|&nbsp; '+
  'canonical token: <b>Load-Bearing</b> (charcoal + ember) &nbsp;|&nbsp; tokens: <b>loadbearing/tokens.css</b> &nbsp;|&nbsp; an Abstrekkt property';
</script>
</body>
</html>
