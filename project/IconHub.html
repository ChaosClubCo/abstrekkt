<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IconHub — Icon Browser</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0f; min-height: 100vh; }
  #root { min-height: 100vh; }
  #ih-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6366f1; font-family: ui-monospace, monospace; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"><div id="ih-loading">Loading IconHub…</div></div>
<script>
(async () => {
  try {
    const src = await (await fetch("iconhub/iconhub.jsx")).text();
    const out = Babel.transform(src, {
      presets: [["react", { runtime: "automatic" }]],
      sourceType: "module",
      filename: "iconhub.jsx"
    }).code;
    const url = URL.createObjectURL(new Blob([out], { type: "text/javascript" }));
    await import(url);
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<pre style="color:#fca5a5;font-family:ui-monospace,monospace;padding:24px;white-space:pre-wrap">'
      + (e && e.stack || e) + '</pre>';
    console.error(e);
  }
})();
</script>
</body>
</html>
