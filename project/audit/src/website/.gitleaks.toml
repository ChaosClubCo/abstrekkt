title = "FlashFusion Gitleaks Configuration"

[allowlist]
description = "Allow common false positives and test data"
regexes = [
  "(?i)example",
  "(?i)dummy",
  "(?i)changeme",
  "(?i)test_key",
  "(?i)demo_token",
  "(?i)sample_secret"
]
paths = [
  "node_modules/**",
  "dist/**",
  "build/**",
  ".next/**",
  ".turbo/**",
  "coverage/**",
  "**/*.md",
  "**/*.mdx"
]

# Generic API Key Detection
[[rules]]
id = "generic-api-key"
description = "Generic API Key Pattern"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)[\s:="'`]{0,5}([0-9a-zA-Z_\-]{24,})'''
entropy = 3.5
secretGroup = 2

# Generic Secret Token
[[rules]]
id = "generic-secret-token"
description = "Generic Secret or Token"
regex = '''(?i)(secret|token|password)[\s:="'`]{0,5}([0-9a-zA-Z_\-]{16,})'''
entropy = 3.8
secretGroup = 2

# AWS Keys
[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws(.{0,20})?['\"][0-9a-zA-Z\/+]{40}['\"]'''

# Supabase Keys (anon key is public, but service role should never be committed)
[[rules]]
id = "supabase-service-role-key"
description = "Supabase Service Role Key (CRITICAL)"
regex = '''(?i)supabase[_-]?service[_-]?role[_-]?key[\s:="'`]{0,5}eyJ[0-9a-zA-Z_\-\.]{100,}'''

# Stripe Keys
[[rules]]
id = "stripe-secret-key"
description = "Stripe Secret Key"
regex = '''sk_(test|live)_[0-9a-zA-Z]{24,}'''

# GitHub Token
[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''gh[pousr]_[0-9a-zA-Z]{36,}'''

# OpenAI API Key
[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[0-9a-zA-Z]{48}'''

# Generic High Entropy Strings
[[rules]]
id = "high-entropy-string"
description = "High Entropy String (Potential Secret)"
regex = '''[0-9a-zA-Z_\-]{32,}'''
entropy = 4.5

# Private Keys
[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'''

# Database Connection Strings
[[rules]]
id = "database-connection-string"
description = "Database Connection String"
regex = '''(?i)(postgres|mysql|mongodb):\/\/[^:\s]+:[^@\s]+@'''
