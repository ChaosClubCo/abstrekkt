WHO KYLE IS:
Around 40, north of Chicago, Illinois. Single dad to Kinsley — currently has roughly 2.5 days a week, heading into a custody/placement court fight he may lose, with the possibility of reduced time or a challenge to his daughter carrying his last name. History: was homeless, was an addict for 16 years, got clean, rebuilt. Managed bars and restaurants 10+ years — managed the operation, not just bartended. Pivoted to self-taught IT, hired at an MSP outside the standard process for hybrid tech and people skills. Service desk tech who also runs an AI-enablement consultancy and Abstrekkt LLC (parent company, registered June 2026, Illinois). Operating philosophy: "Construction over Recovery" — building what never existed rather than restoring what was lost. TBI history; brain-scan data: 99th percentile processing speed, 12th percentile recall. Writing a literary memoir called Tax the Damage, framed as a letter to Kinsley to read when she's grown.

CONTENT INTEGRITY — non-negotiable:
- NEVER introduce specific facts that aren't in the input fields: no invented numbers, dollar amounts, dates, names, places, metrics, tool counts, or events.
- If a specific detail would strengthen the piece but isn't in the input, stay general or leave it out. Do not fabricate plausible-sounding specifics.
- You are shaping the material he gives you into his voice. You are not adding facts to it.

VOICE PATTERNS (from interview) — enforce these:
- He doesn't separate work from personal from builds. A phone-call complaint flows into a legal battle flows into building at midnight. Don't clean up the lanes. Let them bleed together.
- He self-corrects mid-sentence on himself. "She fucked up, I fucked up" in the same breath. Don't let him stay comfortable in a grievance.
- Heavy things get dropped quietly in small phrases then moved past. "And poor Kinsley." Don't expand it. Don't give it a paragraph.
- He closes doors with short phrases: "Short, thank you." "And here we are." Done. Moving.
- Interior states are precise and physical — organic or mechanical failure. "My insides are decaying from this." Never the emotional category word.
- Specific nouns every time. O'Tool's, not "a bar." Jack and Coke, not "a drink." The detail nobody asked for.
- He shows up somewhere to decompress, it doesn't work, he leaves — and doesn't narrate it as failure. The gap belongs to the reader.
- He builds while things are on fire. Through the chaos, not despite it. The building is the response to the hard thing.

DAD-VOICE & PAST-MATERIAL PATTERNS (human-side series only):
- Defensive comedy as armor. He beats the world to the punch: "oh life's fucking great as a single dad, the world really looks kindly on a 40-year-old ex-homeless druggie." That sneer is a real register; use it where it fits.
- Apology and fury coexist. Sorry AND furious that sorry isn't enough. Never resolve one into the other. Hold both at once.
- The unbearable specific detail, stated flat: Kinsley sobbing at drop-off. Don't dramatize. State it and let it sit.
- He absorbs the world's judgment and voices it for them, then keeps standing. Self-deprecation is real but it is not surrender.
- Showing up IS the construction. Going to court instead of disappearing — that's the thesis applied to fatherhood. Never redemption. Building.
- Past material (homelessness, addiction, getting clean): field reports, not a redemption arc. Written for the reader standing inside the exact thing right now who needs proof survival is possible while still inside it.
- Tenderness is allowed here in a way it is not in the technical series. The letters to Kinsley can be slow, can be soft. Still specific. Still no clichés. Grief is precise, not generic.

HARD VOICE RULES:
- First person. Specific nouns.
- Construction over Recovery: NEVER use recovery, healing, return to baseline, transformation, breakthrough, redemption. Build forward.
- No epiphanies. No "and that's when I realized." Incremental recalibrations only.
- NEVER: "looking back," "in retrospect," "transformative," "journey," "healing," "brave," "it hit me," "game-changer," "level up," "it changed everything," "rock bottom became," "my why," "blessed," "grateful for the struggle"
- Short sentences to land. Long sentences to build complexity. Short to close.
- Building in public = say the actual thing, the actual number, the actual embarrassing version.
- Zero LinkedIn inspiration energy. Zero thought-leader cadence. If a sentence could be screenshotted by a hustle account, rewrite it.
- If something cost something — say what. Don't editorialize it.

FORMAT RULES:
- Blog Post: Open with a specific scene, moment, or action. Not a question. Not a thesis. Build outward. Close with one sentence. No summary. No "what I learned."
- LinkedIn Thread: Line 1 is a specific fact or situation that stops the scroll — never inspiration, always fact. Number each item. One concrete thing per item. Last item is what you'd normally cut.
- Short Form: One thing. 200–300 words. No wind-up. Strong open, hard close. Present tense preferred.
- Letter: Addressed to Kinsley, second person ("you"). Slow is allowed. Tender is allowed. Still specific, still no clichés, still no epiphanies. Open on something concrete. Close on something true, not something resolved.

Write only the content. No preamble, no "here's your post," no meta-commentary.`;

/* ============================================================
   API
   ============================================================ */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function friendlyStatus(status){
  if(status===401||status===403) return "Can't reach the model from here. If you've self-hosted this file, point API_ENDPOINT at your proxy (server-side key).";
  if(status===429) return "Rate limited — wait a few seconds and try again.";
  if(status>=500) return "The model service hiccuped. Give it a moment and try again.";
  return `Request failed (${status}).`;
}
async function callAnthropic(system, content, maxTokens){
  const body = JSON.stringify({ model:MODEL, max_tokens:maxTokens, system, messages:[{role:"user",content}] });
  const retryable = new Set([429,500,502,503,529]);
  const delays = [1000, 2500];
  let lastErr;
  for(let attempt=0; attempt<=delays.length; attempt++){
    try{
      const res = await fetch(API_ENDPOINT,{ method:"POST", headers:{"Content-Type":"application/json"}, body });
      if(!res.ok){
        if(retryable.has(res.status) && attempt<delays.length){ await sleep(delays[attempt]); continue; }
        throw new Error(friendlyStatus(res.status));
      }
      const data = await res.json();
      const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
      if(!text) throw new Error("The model returned an empty response. Try again.");
      return { text, truncated: data.stop_reason==="max_tokens" };
    }catch(e){
      lastErr = e;
      if(attempt<delays.length && e.name==="TypeError"){ await sleep(delays[attempt]); continue; } // network blip
      throw lastErr;
    }
  }
  throw lastErr;
}

async function parseAndRoute(raw, group){
  const shape = group==="human"
    ? `{
  "event": "the specific scene or moment — where, what, who, flat not dramatized, first person",
  "cost": "what it took or is taking — time, sleep, money, a piece of self, first person",
  "need": "what he needs Kinsley or the reader to know, first person",
  "under": "the part he'd normally keep — rage, fear, apology underneath, first person"
}`
    : group==="editorial"
    ? `{
  "subject": "the tool, pattern, moment, or system — named specifically, first person",
  "lived": "what he actually did or saw with it — the first-hand, real-work part, first person",
  "tension": "where it breaks, the counter-pattern, or what the hype gets wrong, first person",
  "angle": "the construction-lens angle or the thing only he'd notice, first person"
}`
    : `{
  "event": "the specific scene or thing that happened — names, places, numbers, first person",
  "built": "what was built, tried, fixed, or worked on, first person",
  "detail": "one specific sensory, technical, or embarrassing detail, first person",
  "under": "the subtext — what's not being said directly, first person"
}`;
  const { text } = await callAnthropic(
    "You route raw writing material into structured fields. Return only valid JSON. No markdown fences. No explanation.",
    `Route this raw content into writing material fields. Return ONLY a JSON object — no markdown, no explanation.\n\nRaw content:\n${raw}\n\nReturn exactly this shape:\n${shape}\n\nRules: first person throughout, preserve raw voice and specific details, empty string "" if a category has no content. Never invent content not present in the raw input. JSON only.`,
    MAX_TOKENS.parse
  );
  const cleaned = text.replace(/^```json\s*/i,"").replace(/^```\s*/,"").replace(/```$/,"").trim();
  return JSON.parse(cleaned);
}

async function generate(post, seriesTitle, f, fmt, group, voiceNote){
  const careerFields = `${f.event?`RAW EVENT:\n${f.event}\n`:""}${f.built?`\nWHAT THEY BUILT:\n${f.built}\n`:""}${f.detail?`\nTHE DETAIL THAT STICKS:\n${f.detail}\n`:""}${f.under?`\nSUBTEXT (tone only, don't quote directly):\n${f.under}\n`:""}`;
  const humanFields = `${f.event?`THE MOMENT:\n${f.event}\n`:""}${f.cost?`\nWHAT IT COST:\n${f.cost}\n`:""}${f.need?`\nWHAT HE NEEDS THEM TO KNOW:\n${f.need}\n`:""}${f.under?`\nTHE PART HE'D NORMALLY KEEP (tone only, handle with care, don't sensationalize):\n${f.under}\n`:""}`;
  const editorialFields = `${f.subject?`SUBJECT:\n${f.subject}\n`:""}${f.lived?`\nFIRST-HAND / WHAT HE ACTUALLY DID:\n${f.lived}\n`:""}${f.tension?`\nWHERE IT BREAKS / THE COUNTER-PATTERN:\n${f.tension}\n`:""}${f.angle?`\nCONSTRUCTION-LENS ANGLE:\n${f.angle}\n`:""}`;
  const fields = group==="human" ? humanFields : group==="editorial" ? editorialFields : careerFields;
  const voiceBlock = voiceNote ? `VOICE FOR THIS SERIES (layer on top of the base voice, do not override the hard rules):\n${voiceNote}\n\n` : "";
  const content = `${voiceBlock}Series: "${seriesTitle}"\nPost: "${post.title}"\nAngle: ${post.angle}\n\n${fields}\nFORMAT: ${FMT_INSTR[fmt]}\n\nWrite it now. No preamble.`;
  return callAnthropic(VP, content, MAX_TOKENS[fmt]||1500);
}

  const [shown,setShown] = useState({});         // pKey -> index into outputs[pKey]
  const [loads,setLoads] = useState({});
  const [errs,setErrs] = useState({});
  const [pLoads,setPLoads] = useState({});
  const [pErrs,setPErrs] = useState({});
  const [copied,setCopied] = useState(null);
  const [showVoice,setShowVoice] = useState(false);
  const [ack,setAck] = useState({});
  const [status,setStatus] = useState("");
  const fileRef = useRef(null);

  const accent = tab==="human" ? "var(--brass)" : "var(--build)";
  const pk = (s,p)=>`${s}~${p}`;
  const fm = (s,p)=>forms[pk(s,p)]||{};
  const upd = (s,p,k,v)=>setForms(f=>({...f,[pk(s,p)]:{...(f[pk(s,p)]||{}),[k]:v}}));
  const updMany = (s,p,obj)=>setForms(f=>({...f,[pk(s,p)]:{...(f[pk(s,p)]||{}),...obj}}));

  const doParse = async (series,pi)=>{
    const k=pk(series.id,pi), f=fm(series.id,pi), raw=f.rawPaste?.trim();
    if(!raw){ setPErrs(e=>({...e,[k]:"Paste something first."})); return; }
    setPErrs(e=>({...e,[k]:null})); setPLoads(l=>({...l,[k]:true})); setStatus("Routing your raw material…");
    try{
      const routed = await parseAndRoute(raw, series.group);
      const merge = series.group==="human"
        ? {event:routed.event||f.event||"",cost:routed.cost||f.cost||"",need:routed.need||f.need||"",under:routed.under||f.under||"",mode:"fields"}
        : {event:routed.event||f.event||"",built:routed.built||f.built||"",detail:routed.detail||f.detail||"",under:routed.under||f.under||"",mode:"fields"};
      updMany(series.id,pi,merge);
      setStatus("Routed. Review the fields, then generate.");
    }catch(e){ setPErrs(er=>({...er,[k]:`Couldn't route that: ${e.message}`})); setStatus("Routing failed."); }
    finally{ setPLoads(l=>({...l,[k]:false})); }
  };

  const run = async (series,pi)=>{
    const k=pk(series.id,pi), f=fm(series.id,pi), fmt=f.format||series.defaultFormat||"blog";
    const any = f.event?.trim()||f.built?.trim()||f.cost?.trim()||f.need?.trim()||f.detail?.trim();
    if(!any){ setErrs(e=>({...e,[k]:"Fill in at least one field, or paste raw material and route it first."})); return; }
    setErrs(e=>({...e,[k]:null})); setLoads(l=>({...l,[k]:true})); setStatus("Generating in your voice…");
    try{
      const out = await generate(series.posts[pi], series.title, f, fmt, series.group, series.voiceNote);
      setOutputs(o=>{
        const prev = o[k]||[];
        const next = [...prev, {text:out.text, fmt, truncated:out.truncated, ts:Date.now()}].slice(-HISTORY_CAP);
        setShown(s=>({...s,[k]:next.length-1}));
        return {...o,[k]:next};
      });
      setStatus(out.truncated ? "Done — but the response hit the length cap and may be cut off." : "Done.");
    }catch(e){ setErrs(er=>({...er,[k]:e.message})); setStatus("Generation failed."); }
    finally{ setLoads(l=>({...l,[k]:false})); }
  };

  const doCopy = (k,txt)=>{ navigator.clipboard?.writeText(txt).catch(()=>{}); setCopied(k); setStatus("Copied to clipboard."); setTimeout(()=>setCopied(null),2200); };

  const exportState = ()=>{
    try{
      const blob = new Blob([JSON.stringify({version:4, savedAt:new Date().toISOString(), forms, outputs}, null, 2)],{type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);

  };

  return h(Fragment,null,

              const isLoad=loads[k], err=errs[k], fmt=f.format||s.defaultFormat||"blog", mode=f.mode||"fields";
              const isParse=pLoads[k], pErr=pErrs[k];
              const filled=f.event?.trim()||f.built?.trim()||f.cost?.trim()||f.need?.trim()||f.detail?.trim();
              const needAck=s.cooldown&&!ack[k];
              return h("div",{key:pi,style:{borderBottom:pi<s.posts.length-1?"1px solid var(--line-soft)":"none"}},
                h("button",{onClick:()=>setOpenP(p=>p===k?null:k),"aria-expanded":open,
                  style:{width:"100%",padding:"10px 16px 10px 30px",background:open?s.color+"0E":"transparent",border:"none",display:"flex",alignItems:"center",gap:11,textAlign:"left"}},
                  h("span",{style:{width:19,height:19,borderRadius:5,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9.5,fontWeight:500,
                    border:`1px solid ${hist.length?s.color+"99":"var(--line)"}`,background:hist.length?s.color+"1A":"transparent",color:hist.length?s.color:"var(--text-3)"}},
                    hist.length?h(Icon,{d:"check",sz:11}):pi+1),
                  h("span",{style:{flex:1,minWidth:0}},
                    h("span",{style:{display:"block",fontSize:13.5,color:open?"var(--text)":"var(--text-2)"}},post.title),
                    h("span",{style:{display:"block",fontSize:11,color:"var(--text-3)",marginTop:1}},post.angle)
                  ),
                  filled&&!hist.length&&h("span",{className:"mono",style:{fontSize:9,color:s.color,background:s.color+"14",padding:"2px 6px",borderRadius:10,flexShrink:0}},"filled"),
                  hist.length>1&&h("span",{className:"mono",style:{fontSize:9,color:"var(--text-3)",flexShrink:0}},`${hist.length} versions`),
                  h(Icon,{d:open?"chevronUp":"chevron",sz:13,style:{color:"var(--text-3)",flexShrink:0}})
                ),
                open&&h("div",{style:{padding:"8px 16px 18px 30px"}},

                  // mode + format row
                  h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:13,flexWrap:"wrap"}},
                    h("div",{style:{display:"flex",gap:5}},
                      modeTab(mode==="fields","Fields",()=>upd(s.id,pi,"mode","fields"),s.color),
                      modeTab(mode==="paste","Smart paste",()=>upd(s.id,pi,"mode","paste"),s.color)
                    ),
                    h("div",{style:{display:"flex",gap:5,flexWrap:"wrap"}},
                      FORMATS.map(fo=>h("span",{key:fo.id,title:fo.desc},fmtTab(fmt===fo.id,fo.label,()=>upd(s.id,pi,"format",fo.id),s.color)))
                    )
                  ),

                  // smart paste
                  mode==="paste"&&h("div",null,
                    h("label",{style:{display:"block",fontSize:12.5,color:"var(--text-2)",marginBottom:4,fontWeight:500}},"Paste anything"),
                    h("p",{style:{margin:"0 0 8px",fontSize:12,color:"var(--text-3)",lineHeight:1.5}},
                      s.group==="human"
                        ? "A voice memo, a journal entry, a 2am rant, something you wrote to nobody. Don't organize it — it routes into the moment / what it cost / what you need them to know."
                        : s.group==="editorial"
                        ? "Raw notes on a tool, a session transcript, a Slack rant about what broke, a half-formed observation. Don't organize it — it routes into subject / what you did / where it breaks."
                        : "Voice memo transcript, brain dump, chat logs, raw notes. Don't organize it — it routes into the fields."),
                    h("textarea",{value:f.rawPaste||"",onChange:e=>upd(s.id,pi,"rawPaste",e.target.value),placeholder:"Paste raw material here…",rows:6,className:"scroll",
                      style:{width:"100%",background:"var(--ink-2)",border:"1px solid var(--line)",borderRadius:"var(--r-sm)",padding:"9px 11px",color:"var(--text)",fontSize:13.5,lineHeight:1.6,resize:"vertical",marginBottom:8}}),
                    pErr&&h("p",{style:{margin:"0 0 8px",fontSize:12,color:"var(--danger)"}},h(Icon,{d:"alert",sz:13,style:{marginRight:4,verticalAlign:"-2px"}}),pErr),
                    h("button",{onClick:()=>doParse(s,pi),disabled:isParse,
                      style:{padding:"8px 16px",borderRadius:"var(--r-sm)",border:"1px solid transparent",fontSize:13,fontWeight:500,
                        background:isParse?"var(--ink-2)":s.color,color:isParse?"var(--text-3)":"#1a1410",cursor:isParse?"default":"pointer"}},
                      isParse?h(Fragment,null,h("span",{className:"spin",style:{display:"inline-flex",marginRight:6,verticalAlign:"-2px"}},h(Icon,{d:"spinner",sz:13})),"Routing…")
                            :h(Fragment,null,"Parse & route ",h(Icon,{d:"arrow",sz:13,style:{marginLeft:4,verticalAlign:"-2px"}}))),
                    filled&&h("p",{style:{margin:"8px 0 0",fontSize:11,color:s.color}},h(Icon,{d:"check",sz:12,style:{marginRight:4,verticalAlign:"-2px"}}),"Fields populated — switch to Fields to review before generating.")
                  ),

                  // fields
                  mode==="fields"&&h("div",null,
                    FIELDS.map(fl=>h("div",{key:fl.key,style:{marginBottom:11}},
                      h("label",{style:{display:"block",fontSize:12.5,color:"var(--text-2)",marginBottom:4,fontWeight:500}},
                        fl.label,fl.opt&&h("span",{style:{fontWeight:400,color:"var(--text-3)",marginLeft:4}},"— optional")),
                      h("textarea",{value:f[fl.key]||"",onChange:e=>upd(s.id,pi,fl.key,e.target.value),placeholder:fl.ph,rows:fl.rows,className:"scroll",
                        style:{width:"100%",background:"var(--ink-2)",border:`1px solid ${f[fl.key]?.trim()?"var(--line)":"var(--line-soft)"}`,borderRadius:"var(--r-sm)",padding:"9px 11px",color:"var(--text)",fontSize:13.5,lineHeight:1.6,resize:"vertical"}})
                    ))
                  ),

                  // cooldown gate
                  needAck&&h("div",{style:{marginTop:8,background:"rgba(200,168,106,0.05)",border:"1px solid rgba(200,168,106,0.22)",borderRadius:"var(--r-sm)",padding:"11px 13px"}},
                    h("p",{style:{margin:"0 0 8px",fontSize:12.5,color:"var(--text-2)",lineHeight:1.55}},
                      h(Icon,{d:"shield",sz:13,style:{marginRight:6,verticalAlign:"-2px",color:"var(--brass)"}}),
                      "Cooldown rule for this series: generate freely, but don't publish today. Read it cold tomorrow, not in the middle of a court week."),
                    h("button",{onClick:()=>setAck(a=>({...a,[k]:true})),
                      style:{padding:"6px 12px",fontSize:12,borderRadius:"var(--r-xs)",border:"1px solid rgba(200,168,106,0.4)",background:"transparent",color:"var(--brass)",fontWeight:500}},
                      "I'll hold it for a day — unlock generate")
                  ),

                  err&&h("p",{style:{margin:"10px 0 0",fontSize:12,color:"var(--danger)"}},h(Icon,{d:"alert",sz:13,style:{marginRight:4,verticalAlign:"-2px"}}),err),

                  // generate
                  h("div",{style:{marginTop:12}},
                    h("button",{onClick:()=>run(s,pi),disabled:isLoad||needAck,
                      style:{padding:"8px 16px",borderRadius:"var(--r-sm)",fontSize:13,fontWeight:500,
                        border:`1px solid ${(isLoad||needAck)?"var(--line)":"transparent"}`,
                        background:(isLoad||needAck)?"var(--ink-2)":s.color,color:(isLoad||needAck)?"var(--text-3)":"#1a1410",
                        cursor:(isLoad||needAck)?"default":"pointer"}},
                      isLoad?h(Fragment,null,h("span",{className:"spin",style:{display:"inline-flex",marginRight:6,verticalAlign:"-2px"}},h(Icon,{d:"spinner",sz:13})),"Generating…")
                      :needAck?h(Fragment,null,h(Icon,{d:"lock",sz:13,style:{marginRight:6,verticalAlign:"-2px"}}),"Acknowledge cooldown above")
                      :hist.length?h(Fragment,null,h(Icon,{d:"refresh",sz:13,style:{marginRight:6,verticalAlign:"-2px"}}),"Generate another")
                      :h(Fragment,null,"Generate ",h(Icon,{d:"arrow",sz:13,style:{marginLeft:4,verticalAlign:"-2px"}}))
                    )
                  ),

                  // output
                  out&&h("div",{className:"fade",style:{marginTop:14,border:"1px solid var(--line)",borderRadius:"var(--r)",overflow:"hidden"}},
                    h("div",{style:{padding:"8px 12px",borderBottom:"1px solid var(--line)",display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--ink-2)",gap:8,flexWrap:"wrap"}},
                      h("div",{style:{display:"flex",alignItems:"center",gap:8}},
                        h("span",{className:"mono",style:{fontSize:10,color:"var(--text-3)"}},(FORMATS.find(fo=>fo.id===out.fmt)||{}).label||out.fmt),
                        hist.length>1&&h("span",{style:{display:"inline-flex",alignItems:"center",gap:4}},
                          h("button",{onClick:()=>setShown(sm=>({...sm,[k]:Math.max(0,idx-1)})),disabled:idx<=0,
                            style:{padding:"1px 6px",fontSize:11,borderRadius:4,border:"1px solid var(--line)",background:"transparent",color:idx<=0?"var(--text-3)":"var(--text-2)",cursor:idx<=0?"default":"pointer"}},"‹"),
                          h("span",{className:"mono",style:{fontSize:10,color:"var(--text-3)"}},`${idx+1}/${hist.length}`),
                          h("button",{onClick:()=>setShown(sm=>({...sm,[k]:Math.min(hist.length-1,idx+1)})),disabled:idx>=hist.length-1,
                            style:{padding:"1px 6px",fontSize:11,borderRadius:4,border:"1px solid var(--line)",background:"transparent",color:idx>=hist.length-1?"var(--text-3)":"var(--text-2)",cursor:idx>=hist.length-1?"default":"pointer"}},"›")
                        )
                      ),
                      h("button",{onClick:()=>doCopy(k,out.text),
                        style:{padding:"4px 9px",fontSize:11,borderRadius:"var(--r-xs)",border:`1px solid ${copied===k?s.color+"99":"var(--line)"}`,background:"transparent",color:copied===k?s.color:"var(--text-2)"}},
                        copied===k?h(Fragment,null,h(Icon,{d:"check",sz:12,style:{marginRight:4,verticalAlign:"-2px"}}),"Copied")
                                 :h(Fragment,null,h(Icon,{d:"copy",sz:12,style:{marginRight:4,verticalAlign:"-2px"}}),"Copy"))
                    ),
                    out.truncated&&h("div",{style:{padding:"7px 12px",borderBottom:"1px solid var(--line)",background:"rgba(224,137,122,0.07)",fontSize:11.5,color:"var(--danger)"}},
                      h(Icon,{d:"alert",sz:12,style:{marginRight:5,verticalAlign:"-2px"}}),"This hit the length cap and may be cut off mid-thought. Generate another, or shorten the format."),
                    h("div",{className:"post-scroll scroll",style:{padding:"15px",color:"var(--text)",fontSize:14,lineHeight:1.85,whiteSpace:"pre-wrap",maxHeight:460,overflowY:"auto"}},out.text)
                  )
                )
              );
            })
          )
        );
      })
    ),

    h("p",{className:"mono",style:{marginTop:26,textAlign:"center",color:"var(--text-3)",fontSize:10}},
      `${careerCount+humanCount+editorialCount} prompts across ${SERIES.length} series · showing ${tab==="career"?"the build":tab==="human"?"the human side":"publishing"}`)
  );
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
