<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude — Getting Started</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/tabler-icons.min.css">
<style>
:root{
  --color-background-primary:#1e1e1e;--color-background-secondary:#2a2a2a;
  --color-background-info:#0f2035;--color-background-warning:#231a08;
  --color-background-danger:#2a1010;--color-background-success:#0f2310;
  --color-text-primary:#e5e5e5;--color-text-secondary:#a0a0a0;
  --color-text-tertiary:#5a5a5a;--color-text-info:#60a5fa;
  --color-text-warning:#f59e0b;--color-text-danger:#f87171;--color-text-success:#4ade80;
  --color-border-tertiary:rgba(255,255,255,0.08);--color-border-secondary:rgba(255,255,255,0.15);
  --color-border-primary:rgba(255,255,255,0.25);--color-border-info:rgba(96,165,250,0.35);
  --color-border-warning:rgba(245,158,11,0.35);--color-border-danger:rgba(248,113,113,0.35);
  --color-border-success:rgba(74,222,128,0.35);
  --border-radius-md:8px;--border-radius-lg:12px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --font-mono:"SF Mono","Fira Code","Consolas",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;color:var(--color-text-primary);font-family:var(--font-sans)}
#root{max-width:900px;margin:0 auto}
#tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary)}
.tb{background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;font-size:13px;color:var(--color-text-tertiary);font-family:var(--font-sans);margin-bottom:-1px;transition:color .15s}
.tb.on{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
#shell{display:grid;grid-template-columns:172px 1fr;min-height:520px}
#sl{border-right:0.5px solid var(--color-border-tertiary);padding:12px 0}
.sb2{width:100%;background:none;border:none;border-left:2px solid transparent;padding:7px 14px;cursor:pointer;font-size:11px;color:var(--color-text-tertiary);font-family:var(--font-sans);text-align:left;display:flex;gap:8px;line-height:1.4;align-items:flex-start}
.sb2.on{color:var(--color-text-primary);background:var(--color-background-secondary);border-left-color:var(--color-text-primary)}
.sn{font-size:10px;opacity:.35;flex-shrink:0;padding-top:1px;font-family:var(--font-mono)}
#ca{padding:22px 26px;max-width:560px}
.mtag{font-size:11px;color:var(--color-text-tertiary);margin:0 0 16px}
.shd{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.pip{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:100px;padding:2px 9px;font-size:10px;color:var(--color-text-secondary);font-family:var(--font-mono)}
.st{font-size:18px;font-weight:500;margin:0;color:var(--color-text-primary)}
.sbdy{font-size:14px;color:var(--color-text-secondary);line-height:1.7;margin:0 0 16px}
.gui{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;margin:0 0 16px}
.glb{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px}
.sk-bar{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-tertiary)}
.sk-p{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:100px;padding:2px 9px;font-size:11px;color:var(--color-text-secondary);flex-shrink:0}
.sk-send{background:var(--color-text-primary);color:var(--color-background-primary);border:none;border-radius:var(--border-radius-md);padding:5px 10px;font-size:13px;flex-shrink:0}
.sk-stop{background:var(--color-background-danger);border:0.5px solid var(--color-border-danger);border-radius:var(--border-radius-md);padding:5px 10px;font-size:13px;color:var(--color-text-danger);flex-shrink:0}
.sk-ic{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:4px 8px;font-size:14px;color:var(--color-text-secondary);flex-shrink:0}
.sk-msg{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;font-size:12px;color:var(--color-text-secondary)}
.sk-umsg{background:var(--color-background-info);border:0.5px solid var(--color-border-info);border-radius:var(--border-radius-md);padding:12px;font-size:12px;color:var(--color-text-info);position:relative}
.cs{border-top:0.5px solid var(--color-border-tertiary);padding-top:8px;margin-top:8px;display:flex;gap:6px}
.ci{background:var(--color-background-secondary);border:0.5px solid transparent;border-radius:var(--border-radius-md);padding:4px 8px;font-size:13px;color:var(--color-text-secondary)}
.ci.hi{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}
.lbl{display:inline-flex;align-items:center;gap:4px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:100px;padding:2px 9px;font-size:11px;color:var(--color-text-secondary);margin:2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.fk{border-left:1.5px solid var(--color-border-secondary);padding-left:10px;margin-left:4px}
.fk.a{border-color:var(--color-border-info)}.fk.b{border-color:var(--color-border-warning)}
.tips{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px;margin:0 0 16px}
.tph{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.tip{display:flex;gap:8px;font-size:12px;color:var(--color-text-secondary);line-height:1.55;margin-bottom:5px}
.td2{color:var(--color-text-tertiary);flex-shrink:0;margin-top:1px}
.nav{display:flex;align-items:center;gap:12px;margin-top:14px}
.nbtn{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px 16px;cursor:pointer;font-size:12px;color:var(--color-text-secondary);font-family:var(--font-sans);display:flex;align-items:center;gap:6px}
.nbtn:hover{background:var(--color-background-secondary)}.nbtn:disabled{opacity:.3;cursor:default}
.prog{flex:1;height:2px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden}
.pf{height:100%;background:var(--color-text-primary);transition:width .2s}
.dk-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.dk-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;font-size:11px;color:var(--color-text-secondary);display:flex;flex-direction:column;gap:4px}
.dk-head{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ri{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.ri:last-child{border-bottom:none}
.ri-ic{width:30px;height:30px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.ri-lbl{font-size:12px;font-weight:500;color:var(--color-text-primary);margin-bottom:1px}
.ri-sub{font-size:11px;color:var(--color-text-tertiary);line-height:1.4}
.sk-pencil{position:absolute;right:-12px;top:50%;transform:translateY(-50%);background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);padding:5px 9px;font-size:14px;color:var(--color-text-warning)}
.fl{margin-bottom:10px}
.fl-label{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.fl-input{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 10px;font-size:12px;color:var(--color-text-secondary);width:100%;line-height:1.5}
.mem-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;color:var(--color-text-secondary)}
.mem-row:last-child{border-bottom:none}
.mem-dot{width:6px;height:6px;border-radius:50%;background:var(--color-text-success);flex-shrink:0}
.toggle{width:34px;height:20px;background:var(--color-text-success);border-radius:100px;position:relative;flex-shrink:0}
.toggle::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;right:2px}
.proj-box{background:var(--color-background-primary);border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);padding:10px;margin-bottom:8px}
.art-split{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;top:-100%;left:0;padding:8px 16px;background:var(--color-text-primary);color:var(--color-background-primary);font-size:13px;font-weight:500;border-radius:0 0 8px 0;z-index:100;text-decoration:none}
.skip-link:focus{top:0}
*:focus-visible{outline:2px solid var(--color-text-info);outline-offset:2px}
.tb:focus-visible,.sb2:focus-visible,.nbtn:focus-visible{outline:2px solid var(--color-text-info);outline-offset:2px}
@media(max-width:767px){
  #shell{grid-template-columns:1fr}
  #sl{display:flex;flex-wrap:wrap;padding:8px 12px;border-right:none;border-bottom:0.5px solid var(--color-border-tertiary);gap:4px;min-height:0}
  .sb2{width:auto;flex:0 0 auto;padding:6px 10px;border-left:none;border-bottom:2px solid transparent;min-height:44px;align-items:center;font-size:10px}
  .sb2.on{border-left:none;border-bottom-color:var(--color-text-primary);background:transparent}
  #ca{padding:16px 14px;max-width:none}
  .art-split{grid-template-columns:1fr}
  .dk-row{grid-template-columns:1fr}
  .nbtn{min-height:44px}
  .fk.b{margin-top:8px}
}
@media(max-width:479px){
  .tb{padding:8px 10px;font-size:12px}
  .shd .st{font-size:15px}
}
</style>
</head>
<body>
<a href="#ca" class="skip-link">Skip to main content</a>
<div id="sr-announce" aria-live="polite" aria-atomic="true" class="sr-only"></div>
<div id="root">
<h1 class="pg-title">Claude — Getting Started</h1>
<div id="tabs" role="tablist" aria-label="Course modules"></div>
<div id="shell"><aside id="sl"></aside><main id="ca"></main></div>
</div>
<script>
function d(t){
const g=(c,h)=>`<div class="gui"><div class="glb">gui \u00b7 ${c}</div>${h}</div>`;
if(t==='settings-nav') return g('where settings live',`<div style="display:flex;gap:8px;align-items:stretch;height:130px"><div style="width:120px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px;display:flex;flex-direction:column;flex-shrink:0"><div style="background:var(--color-background-secondary);border-radius:100px;padding:3px 8px;font-size:10px;color:var(--color-text-primary);margin-bottom:6px"><i class="ti ti-plus" aria-hidden="true" style="font-size:10px"></i> New chat</div><div style="font-size:10px;color:var(--color-text-tertiary);padding:2px 4px">Today</div><div style="font-size:10px;color:var(--color-text-tertiary);padding:2px 6px">Conversation 1</div><div style="font-size:10px;color:var(--color-text-tertiary);padding:2px 6px">Conversation 2</div><div style="margin-top:auto;border-top:0.5px solid var(--color-border-tertiary);padding-top:6px"><div style="background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);padding:4px 6px;font-size:10px;color:var(--color-text-warning);display:flex;align-items:center;gap:5px"><i class="ti ti-settings" aria-hidden="true" style="font-size:11px"></i> Settings <i class="ti ti-arrow-narrow-left" aria-hidden="true" style="font-size:10px;margin-left:auto"></i></div></div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center">${[['ti-user','Profile','Your name, role, standing instructions'],['ti-brain','Memory','Stored facts \u2014 view, edit, delete'],['ti-palette','Style','Your writing voice profile'],['ti-credit-card','Account','Plan, usage, billing']].map(([ic,l,s])=>`<div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:13px"><i class="ti ${ic}" aria-hidden="true"></i></div><div><div style="font-size:11px;font-weight:500;color:var(--color-text-primary)">${l}</div><div style="font-size:10px;color:var(--color-text-tertiary)">${s}</div></div></div>`).join('')}</div></div>`);
if(t==='profile-form') return g('settings \u2192 profile',`<div class="fl"><div class="fl-label">What would you like Claude to know about you?</div><div class="fl-input" style="min-height:52px">I'm an IT support lead at an MSP, comfortable with enterprise Windows, Active Directory, Cisco networking, and ITIL change management. I manage a team of 4 and handle tier-2/tier-3 escalations...</div></div><div class="fl"><div class="fl-label">How would you like Claude to respond?</div><div class="fl-input" style="min-height:42px">Prefer prose over bullet lists. Skip filler phrases. Be direct. No emojis unless asked. Don't add caveats unless they're material...</div></div><div style="font-size:11px;color:var(--color-text-tertiary);margin-top:4px">Both fields inject at the start of every new conversation automatically.</div>`);
if(t==='memory-panel') return g('settings \u2192 memory',`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div style="font-size:12px;color:var(--color-text-primary);font-weight:500">Memory</div><div class="toggle"></div></div><div class="col" style="gap:0">${['User is an IT support lead at an MSP','User prefers prose responses over bullet lists','User is running an AI enablement program at their company','User environment is Windows-only endpoints with on-prem AD'].map(e=>`<div class="mem-row"><div class="mem-dot"></div><span>${e}</span><i class="ti ti-trash" aria-hidden="true" style="margin-left:auto;font-size:12px;color:var(--color-text-tertiary)"></i></div>`).join('')}</div><div style="font-size:11px;color:var(--color-text-tertiary);margin-top:10px">Click any entry to edit it. Trash deletes it. Toggle disables memory globally.</div>`);
if(t==='projects-diagram') return g('projects \u2014 structure',`<div class="proj-box"><div style="font-size:11px;color:var(--color-text-warning);font-weight:500;margin-bottom:6px"><i class="ti ti-folder" aria-hidden="true" style="font-size:11px"></i> Project: Client A \u2014 Network Refresh</div><div style="font-size:10px;color:var(--color-text-tertiary);margin-bottom:8px;background:var(--color-background-secondary);padding:6px 8px;border-radius:var(--border-radius-md);line-height:1.5">System prompt: You are assisting a network engineer at an MSP. Client runs Cisco on-prem with Windows Server 2022 AD. Follow ITIL change management. Refer to uploaded network diagram and SOP docs...</div><div style="display:flex;gap:6px">${['Kickoff notes','Firewall config review','Change request #44'].map(c=>`<div style="flex:1;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:6px 8px;font-size:10px;color:var(--color-text-secondary)"><i class="ti ti-message" aria-hidden="true" style="font-size:10px"></i> ${c}</div>`).join('')}</div></div><div style="font-size:11px;color:var(--color-text-tertiary)">Each conversation gets the system prompt. Conversations don't share each other's history. Knowledge files are available to all.</div>`);
if(t==='layout') return g('interface layout',`<div class="row" style="align-items:stretch;gap:8px;height:110px"><div style="width:110px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px;display:flex;flex-direction:column;gap:4px;flex-shrink:0"><div style="font-size:9px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Sidebar</div><div style="background:var(--color-background-secondary);border-radius:100px;padding:3px 8px;font-size:10px;color:var(--color-text-primary)"><i class="ti ti-plus" aria-hidden="true" style="font-size:10px"></i> New chat</div><div style="font-size:10px;color:var(--color-text-tertiary);padding:2px 4px">Conversation...</div><div style="font-size:10px;color:var(--color-text-tertiary);padding:2px 4px">Conversation...</div><div style="margin-top:auto;font-size:10px;color:var(--color-text-tertiary);padding:2px 4px"><i class="ti ti-settings" aria-hidden="true" style="font-size:10px"></i> Settings</div></div><div style="flex:1;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px;display:flex;flex-direction:column;justify-content:space-between"><div style="font-size:9px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em">Chat area \u2014 message thread</div><div class="sk-bar"><span style="flex:1;font-size:11px">Message...</span><span class="sk-send" style="font-size:11px"><i class="ti ti-arrow-up" aria-hidden="true"></i></span></div></div></div><div class="row" style="margin-top:8px"><span class="lbl"><i class="ti ti-arrow-narrow-left" aria-hidden="true"></i> ~260px fixed</span><span class="lbl">fills remaining width <i class="ti ti-arrow-narrow-right" aria-hidden="true"></i></span></div>`);
if(t==='sidebar') return g('sidebar elements',`<div class="col" style="gap:0">${[['ti-plus','New chat','Primary action \u2014 always at top. Cmd/Ctrl+Shift+O shortcut.'],['ti-search','Search conversations','Cmd/Ctrl+K. Searches titles AND content across your full history.'],['ti-message','Conversation history','Grouped by recency. Hover any item for rename / archive / share / delete options.'],['ti-folder','Projects','Your project workspaces with persistent system prompts and knowledge files.'],['ti-settings','Settings','Account, profile, memory, style, billing.']].map(([ic,lbl,sub])=>`<div class="ri"><div class="ri-ic"><i class="ti ${ic}" aria-hidden="true"></i></div><div><div class="ri-lbl">${lbl}</div><div class="ri-sub">${sub}</div></div></div>`).join('')}</div>`);
if(t==='input-pre') return g('input area \u2014 all controls',`<div class="sk-bar"><span class="sk-p"><i class="ti ti-circle-dot" aria-hidden="true" style="font-size:10px"></i> Sonnet 4.6 <i class="ti ti-chevron-down" aria-hidden="true" style="font-size:10px"></i></span><span class="sk-ic"><i class="ti ti-paperclip" aria-hidden="true"></i></span><span style="flex:1;font-size:12px;color:var(--color-text-tertiary)">Message...</span><span class="sk-ic"><i class="ti ti-world-search" aria-hidden="true"></i></span><span class="sk-send"><i class="ti ti-arrow-up" aria-hidden="true"></i></span></div><div class="col" style="margin-top:10px;gap:5px">${[['ti-circle-dot','Model selector','Click to switch between Sonnet, Opus, Haiku. Set before your first message.'],['ti-paperclip','Attach file / image','PDFs, images, code files, CSVs. Multiple files per message supported.'],['ti-world-search','Web search toggle','Enables live web queries for that message. Persists until toggled off.'],['ti-arrow-up','Send (Enter)','Shift+Enter adds a line break. Paste images from clipboard directly.']].map(([ic,lbl,note])=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="lbl" style="flex-shrink:0"><i class="ti ${ic}" aria-hidden="true" style="font-size:10px"></i> ${lbl}</span><span style="font-size:11px;color:var(--color-text-tertiary);line-height:1.4">${note}</span></div>`).join('')}</div>`);
if(t==='send') return g('composing and sending',`<div class="sk-bar"><span style="flex:1;font-size:12px">Your message (Shift+Enter for line breaks)</span><span class="sk-send"><i class="ti ti-arrow-up" aria-hidden="true"></i></span></div><div class="row" style="margin-top:8px"><span class="lbl">Enter = send</span><span class="lbl">Shift+Enter = new line</span><span class="lbl">Paste image = attaches inline</span></div>`);
if(t==='stop') return g('stop generation',`<div class="sk-bar"><span style="flex:1;font-size:12px;color:var(--color-text-tertiary);font-style:italic">Claude is generating a response...</span><span class="sk-stop"><i class="ti ti-player-stop" aria-hidden="true"></i> Stop</span></div><div style="font-size:11px;color:var(--color-text-secondary);margin-top:10px;line-height:1.5">Square stop replaces the send arrow during generation. Click to halt. Whatever was already generated stays in the thread \u2014 nothing is lost. After stopping: send a follow-up, edit your message to branch, or just read what was generated.</div>`);
if(t==='controls') return g("claude's message \u2014 hover to reveal controls",`<div class="sk-msg">Claude's response text here. This can be any length. Code blocks inside have their own copy buttons.<div class="cs"><span class="ci hi"><i class="ti ti-refresh" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-copy" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-thumb-up" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-thumb-down" aria-hidden="true"></i></span></div></div><div class="col" style="margin-top:10px;gap:5px">${[['ti-refresh','Regenerate','Replaces the last response permanently. Original is gone. Not a branch. Last message only.'],['ti-copy','Copy response','Full response as plain text. Code blocks have their own copy button in their header.'],['ti-thumb-up','Thumbs up','Positive feedback to Anthropic. Does not affect your conversation.'],['ti-thumb-down','Thumbs down','Opens a feedback form \u2014 describe what was wrong. Far more useful than just the vote.']].map(([ic,lbl,note])=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="lbl" style="flex-shrink:0"><i class="ti ${ic}" aria-hidden="true" style="font-size:10px"></i> ${lbl}</span><span style="font-size:11px;color:var(--color-text-tertiary);line-height:1.4">${note}</span></div>`).join('')}</div>`);
if(t==='edit') return g('your message \u2014 hover to reveal edit pencil',`<div style="display:flex;gap:12px;align-items:flex-start"><div class="sk-umsg" style="flex:1">Your message text here...<span class="sk-pencil"><i class="ti ti-edit" aria-hidden="true"></i></span></div></div><div class="row" style="margin-top:12px"><span class="lbl" style="background:var(--color-background-warning);border-color:var(--color-border-warning);color:var(--color-text-warning)"><i class="ti ti-edit" aria-hidden="true" style="font-size:10px"></i> Pencil \u2014 hover to reveal</span><span class="lbl">Only on YOUR messages</span><span class="lbl">Any depth in thread</span></div><div style="font-size:11px;color:var(--color-text-tertiary);margin-top:8px;line-height:1.5">This is the ONLY branching mechanism. Clicking the pencil and re-sending \u2014 with or without editing the text \u2014 creates a fork. Both paths are preserved. Nothing is deleted.</div>`);
if(t==='artifacts-panel') return g('artifact panel \u2014 appears for code, html, docs',`<div class="art-split"><div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:10px"><div style="font-size:9px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Chat</div><div class="sk-msg" style="font-size:11px;margin-bottom:6px">Here's the component you asked for:</div><div style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-info);border-radius:var(--border-radius-md);padding:6px 8px;font-size:10px;color:var(--color-text-info)"><i class="ti ti-code" aria-hidden="true" style="font-size:10px"></i> React component \u2192</div></div><div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:10px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-size:9px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em">Artifact</div><div style="display:flex;gap:4px"><span style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:2px 6px;font-size:10px;color:var(--color-text-secondary)"><i class="ti ti-copy" aria-hidden="true" style="font-size:10px"></i></span><span style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:2px 6px;font-size:10px;color:var(--color-text-secondary)"><i class="ti ti-download" aria-hidden="true" style="font-size:10px"></i></span></div></div><div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px;font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono);margin-bottom:6px">Preview / Code tabs</div><div style="font-size:10px;color:var(--color-text-tertiary)">Rendered preview or source. Tell Claude to modify it in your next message.</div></div></div>`);
if(t==='branch-concept') return g('branch concept \u2014 nothing is deleted',`<div style="font-size:12px;color:var(--color-text-secondary);line-height:1.9;font-family:var(--font-mono)"><div style="color:var(--color-text-tertiary)">msg 1 \u2014 your message</div><div style="color:var(--color-text-tertiary)">msg 2 \u2014 claude responds</div><div style="color:var(--color-text-warning)">msg 3 \u2014 your message&nbsp;<span style="background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:100px;padding:1px 8px;font-size:10px;color:var(--color-text-warning)"><i class="ti ti-edit" aria-hidden="true" style="font-size:10px"></i> edit here = fork</span></div><div style="display:flex;gap:24px;margin:8px 0 0 14px"><div class="fk a"><div style="font-size:11px;color:var(--color-text-info);font-weight:500">Branch A \u2014 original</div><div style="font-size:11px;color:var(--color-text-tertiary)">original response</div><div style="font-size:11px;color:var(--color-text-tertiary)">msg 4, 5, 6...</div></div><div class="fk b"><div style="font-size:11px;color:var(--color-text-warning);font-weight:500">Branch B \u2014 new</div><div style="font-size:11px;color:var(--color-text-tertiary)">fresh response</div><div style="font-size:11px;color:var(--color-text-tertiary)">different path...</div></div></div></div><div style="font-size:11px;color:var(--color-text-tertiary);margin-top:10px">Both paths fully preserved. Both independently continuable. Think: git branching for conversations.</div>`);
if(t==='branch-how') return g('how to branch \u2014 step by step',`<div class="col" style="gap:7px">${[['1','Scroll to the message where things went wrong','Any of your messages \u2014 any depth in the thread'],['2','Hover over your message','The pencil icon appears on the right side'],['3','Click the pencil icon','The message text becomes editable in place'],['4','Edit your text \u2014 or re-send unchanged','Re-sending unchanged gives a fresh response without changing the prompt'],['5','Hit send','Claude responds fresh from that point forward'],['&#x21AA;','Navigation arrows appear on Claude\'s response','Use them to switch between the original and new paths at this fork']].map(([n,txt,note])=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="width:22px;height:22px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--color-text-secondary);flex-shrink:0;font-family:var(--font-mono)">${n}</div><div><div style="font-size:12px;color:var(--color-text-primary)">${txt}</div><div style="font-size:11px;color:var(--color-text-tertiary)">${note}</div></div></div>`).join('')}</div>`);
if(t==='branch-nav') return g('navigating between branches',`<div class="sk-msg"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:3px 9px;font-size:13px;color:var(--color-text-secondary)"><i class="ti ti-chevron-left" aria-hidden="true"></i></span><span style="font-size:11px;color:var(--color-text-tertiary);font-family:var(--font-mono)">2 / 2</span><span style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:3px 9px;font-size:13px;color:var(--color-text-tertiary)"><i class="ti ti-chevron-right" aria-hidden="true"></i></span><span style="font-size:11px;color:var(--color-text-tertiary)">\u2190 appears at the fork point</span></div>Claude's response on the currently active branch...</div><div class="col" style="margin-top:10px;gap:5px"><div style="font-size:12px;color:var(--color-text-secondary)">Arrows flip between branches at the fork. Everything below changes to that branch's history.</div><div style="font-size:11px;color:var(--color-text-tertiary)">2/2 = you are on branch 2 of 2 at this fork point.</div><div style="font-size:11px;color:var(--color-text-tertiary)">Any branch is fully continuable \u2014 send a message while viewing it to continue it.</div><div style="font-size:11px;color:var(--color-text-tertiary)">Branches can have sub-branches \u2014 each fork point has its own counter.</div></div>`);
if(t==='decision') return g('which action to use',`<div class="dk-row">${[{ic:'ti-refresh',lbl:'Regenerate',col:'info',when:"Last response was wrong and I don't need to keep it",scope:'Last response only',keeps:'Nothing \u2014 replaces it permanently',avoid:'Using when you might want the original back later'},{ic:'ti-git-branch',lbl:'Branch',col:'warning',when:'Went wrong at an earlier point, want to try different direction',scope:'Any prior message in thread',keeps:'Both paths fully preserved',avoid:'Trying to fix context drift \u2014 branch inherits the same noise'},{ic:'ti-square-plus',lbl:'New chat',col:'success',when:'Context drifted badly, topic changed, fresh frame needed',scope:'Completely fresh \u2014 no shared history',keeps:'Nothing unless you paste it in',avoid:'Losing useful context \u2014 paste a summary as your first message'}].map(({ic,lbl,col,when,scope,keeps,avoid})=>`<div class="dk-card" style="border-color:var(--color-border-${col})"><div class="dk-head"><i class="ti ${ic}" aria-hidden="true" style="color:var(--color-text-${col})"></i><span style="color:var(--color-text-${col})">${lbl}</span></div><div style="color:var(--color-text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.05em">Use when</div><div style="margin-bottom:5px">${when}</div><div style="color:var(--color-text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.05em">Scope</div><div style="margin-bottom:5px">${scope}</div><div style="color:var(--color-text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.05em">Keeps</div><div style="margin-bottom:5px">${keeps}</div><div style="color:var(--color-text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.05em">Watch out for</div><div>${avoid}</div></div>`).join('')}</div>`);
return '';
}
</script>
<script>
const M=[
{lbl:'01 \u00b7 Your setup',tagline:'Account, settings, and profile \u2014 do this before your first real conversation',steps:[
{short:'Settings',title:'Accessing your settings',gui:'settings-nav',
body:"Settings live at the very bottom of the left sidebar \u2014 click your account name or the gear icon. Inside you'll find separate sections for Profile, Memory, Style, Appearance, and billing information. Most new users skip settings entirely and spend every subsequent conversation re-explaining who they are and how they want responses formatted. Taking ten minutes here before your first real conversation eliminates that repetition permanently. Every field you fill out applies automatically to all new conversations going forward.",
tips:['Settings are account-wide, not per-conversation \u2014 changes take effect on the next new conversation you start','On mobile, settings are behind the hamburger menu at the top-left of the screen','Your settings do not automatically sync between the web app and the mobile app in real time']},

{short:'Profile',title:'Profile instructions \u2014 your two most powerful fields',gui:'profile-form',
body:"The Profile tab contains two text fields that act as a persistent system prompt injected at the start of every conversation. The first \u2014 'What would you like Claude to know about you?' \u2014 is where you put your role, expertise level, industry, tools, and standing context. A useful entry: 'I'm an IT support lead at an MSP, comfortable with enterprise Windows environments, Active Directory, Cisco networking, and ITIL-aligned change management. I handle tier-2 and tier-3 escalations.' The second \u2014 'How would you like Claude to respond?' \u2014 is where you set output defaults: format preferences, length, tone, whether to skip caveats, whether to cite sources. These two fields together are the highest-leverage settings in the product \u2014 they save you from re-establishing context at the start of every conversation.",
tips:["Be specific about your expertise level so Claude calibrates depth: 'comfortable with CLI, no need to explain basic shell concepts'","Use the second field to ban filler phrases: 'never start with Great question!, skip the preamble, just answer'","You can always override these mid-conversation with an explicit instruction \u2014 they're defaults, not hard rules","Revisit and update these fields as your role or preferences evolve \u2014 they're worth refining over time"]},

{short:'Memory',title:"Memory \u2014 what it stores and how to manage it",gui:'memory-panel',
body:"Memory is separate from the Profile fields \u2014 it stores facts, preferences, and context extracted from your actual conversations and re-injects them into future ones automatically. After a conversation where you mention a project you're working on, a preference, or a piece of context about your environment, Claude may extract and store that as a discrete memory entry. You can see everything stored under Settings \u2192 Memory \u2014 it appears as a plain-text list. You can edit individual entries by clicking on them, delete ones that are wrong or outdated, and toggle the entire feature on or off globally. Memory is disabled inside Projects (the system prompt replaces it) and in Incognito mode.",
tips:["Check your stored memories now \u2014 if you've had previous conversations, facts may already be stored from them","You can manually instruct Claude to remember something: 'remember that I always want code examples in TypeScript'","You can tell Claude to forget something specific: 'forget that I work at [company]' and it will remove that entry","Memory stores extracted facts only \u2014 NOT full conversation transcripts","If Claude references something oddly specific from a past conversation, it's almost certainly from a stored memory entry"]},

{short:'Style',title:"Style \u2014 teaching Claude your writing voice",gui:null,
body:"The Style feature lets you create a persistent writing voice profile that Claude references when you ask it to write something you'll publish, send, or use externally. You either upload 3\u20135 samples of your actual writing \u2014 emails, posts, documentation \u2014 or describe your style in text ('concise, active voice, no jargon, direct'). Claude extracts a profile from those inputs and applies it to content creation requests. This is distinct from Profile instructions, which are about context and response preferences \u2014 Style is specifically about matching your rhetorical patterns and voice. If you consistently find yourself heavily rewriting AI-generated drafts because they don't sound like you, setting up a style profile will reduce that editing significantly.",
tips:['Upload representative day-to-day writing, not polished showcase pieces \u2014 Claude needs to learn your normal voice','You can have multiple style profiles and switch between them per-conversation','Style applies to content creation requests only \u2014 it does not change how Claude talks to you conversationally','Test it immediately after setup: ask Claude to write something you commonly produce and compare the output to your actual writing']},

{short:'Plans',title:'Plans \u2014 what each tier actually unlocks',gui:null,
body:"Free gives you access to Claude Sonnet with daily message limits, no persistent memory, no Projects, and limited file handling. Pro removes hard message caps (subject to a rolling per-5-hour window), unlocks all models including Claude Opus, adds full memory, Projects, deep research mode, complete file and image analysis, and artifact creation. Team adds shared Projects with admin controls, higher per-seat throughput, and organization-level management. The difference between Sonnet and Opus is genuinely meaningful for complex reasoning tasks \u2014 if Sonnet keeps giving shallow or inconsistent answers on a difficult problem, switching to Opus is the right call, not reprompting Sonnet. When you hit a rate limit, Claude tells you exactly how long to wait.",
tips:['Pro rate limits reset approximately every 5 hours \u2014 not at midnight, not daily','Opus 4 is significantly more capable for multi-step reasoning, nuanced writing, and ambiguous problems \u2014 do not default to Sonnet for everything','The Claude API is a completely separate product from claude.ai with its own billing \u2014 aimed at developers, not for direct conversation use','Usage dashboard is under Settings \u2192 Account \u2014 shows remaining quota and next reset time']},

{short:'Projects',title:'Projects \u2014 persistent context for ongoing work',gui:'projects-diagram',
body:"A Project is a workspace that attaches a persistent system prompt and optional knowledge files to every conversation inside it, so you never re-establish context for recurring work. You write a system prompt once \u2014 describing the role, environment, client, constraints \u2014 and every conversation in that Project starts with that context already loaded. Projects also support knowledge files: PDFs, SOPs, reference documents, specs that Claude can retrieve across all conversations in the Project. This is the right tool for recurring work tied to a specific client, codebase, project, or role. Memory is automatically disabled inside Projects because the system prompt takes its place. Project conversations are grouped separately in the sidebar.",
tips:['Write the system prompt as if briefing a new contractor \u2014 role, constraints, environment, tools, expectations, tone','Upload reference documents as knowledge files for Claude to cite from \u2014 SOPs, runbooks, architecture docs, client briefs','You can have multiple Projects \u2014 one per client, one per internal tool, one per writing lane','Conversations inside a Project share the system prompt but NOT each other\'s conversation history','Project knowledge files have a combined size limit \u2014 prioritize the highest-reference documents']}
]},

{lbl:'02 \u00b7 Your interface',tagline:'Every control in the conversation UI, explained fully',steps:[
{short:'Layout',title:'The interface layout',gui:'layout',
body:"The claude.ai interface is split into two persistent zones: a narrow sidebar on the left (roughly 260px) and a full-height chat area filling the remaining screen. The sidebar handles all navigation \u2014 new conversations, history, search, projects, settings. The chat area is scoped entirely to the current conversation: message thread in the middle, input bar pinned to the bottom. On mobile the sidebar collapses behind a hamburger icon at the top-left. Switching conversations in the sidebar instantly replaces the entire chat area with that conversation's history. Refreshing the page or closing the tab does not lose anything \u2014 all conversations persist in the sidebar history indefinitely.",
tips:['The sidebar can be collapsed on desktop via a toggle at the top-left \u2014 gives more horizontal reading space on long responses','You can open multiple conversations in different browser tabs simultaneously \u2014 they are independent','Switching conversations is instant \u2014 no loading spinner, no save step required']},

{short:'Sidebar',title:'Sidebar in depth \u2014 all elements and controls',gui:'sidebar',
body:"The sidebar contains from top to bottom: a New Chat button (Cmd/Ctrl+Shift+O), a search icon for finding past conversations by title or content (Cmd/Ctrl+K), your conversation history grouped by recency (Today, Yesterday, Last 7 days, Last 30 days, then by month), any Projects you've created, and your account plus settings at the very bottom. Clicking any conversation resumes it with full context exactly as you left it. Hovering over any conversation reveals an ellipsis (\u2026) menu with options to rename it, archive it, share it, star it, or delete it. Archived conversations disappear from the main list but remain searchable. Starred conversations pin to the top of the history.",
tips:['The search function searches conversation content, not just titles \u2014 search a phrase you remember from a past conversation','Renaming conversations is worth doing for any you will want to find again \u2014 auto-generated names are often generic','Sharing a conversation generates a read-only public snapshot link \u2014 the recipient cannot continue the conversation','Deleting is permanent \u2014 use archive if you are not certain']},

{short:'Input area',title:'Input area controls \u2014 all of them',gui:'input-pre',
body:"The input area at the bottom of the chat contains more than just the text field. Left side: a model selector pill showing your current model (click to switch between Sonnet, Opus, Haiku) and a paperclip icon for attaching files and images. Center: the text field, which expands vertically as you type with no practical length limit. Right side: a web search toggle and the send button. These controls apply to the message you're currently composing. Set the model and web search state before you hit send. The model selector and web search toggle persist across messages until you manually change them.",
tips:["It's better to pick the right model before your first message than to switch mid-conversation","Web search stays toggled on or off until you manually change it \u2014 it is not a one-message toggle","You can attach multiple files to a single message; all are available throughout the rest of the conversation","The input field supports paste of images directly from clipboard (Cmd/Ctrl+V) without using the paperclip"]},

{short:'Sending',title:'Composing and sending messages',gui:'send',
body:"Enter sends your message immediately. Shift+Enter adds a line break within the message without sending \u2014 use this to compose multi-paragraph prompts, structured requests with numbered lists, or messages containing pasted code before sending them as a single complete block. You can paste formatted text, raw code, URLs, and images directly into the input field. Pasting a URL while web search is enabled lets Claude fetch and read that page as part of its response. Pasting an image from clipboard adds it as a thumbnail attachment. On mobile there is no keyboard shortcut \u2014 only the send button.",
tips:['Build complex prompts using Shift+Enter before sending \u2014 a well-structured single message consistently outperforms a sequence of short follow-ups','Paste code directly into the message field; Claude detects and formats it automatically','You can paste a URL into the message without the paperclip \u2014 Claude reads the page when web search is on']},

{short:'Stop',title:'Stop generation \u2014 halting mid-stream',gui:'stop',
body:"While Claude is generating, the send button is replaced by a solid square stop icon. Clicking it halts generation immediately \u2014 whatever Claude had already generated stays in the thread fully preserved. Stop is most useful when you can see from the first few sentences that Claude has misread the prompt, is heading in the wrong direction, is being far more verbose than you need, or has made a wrong assumption early. It is always faster to stop early and redirect than to let Claude finish generating an off-track response and then ask for a correction. After stopping, the conversation is in a fully valid state.",
tips:['After stopping you have three options: send a follow-up to redirect, edit your message to branch, or use what was already generated','If Claude stops mid-sentence, say "continue from where you left off" and it will resume','Stopping does not trigger a full rate-limit charge the same way as a complete generation']},

{short:"Claude's controls",title:"Controls on Claude's messages",gui:'controls',
body:"Hovering over any of Claude's responses reveals a control strip below the message. Controls: a circular arrow (Regenerate \u2014 discards the current response and generates a new one from the same prompt; the original is permanently gone; this is NOT a branch and only works on the last response), a copy icon (copies the full response as plain text), a thumbs up, and a thumbs down. Thumbs down opens a structured feedback form where you describe exactly what was wrong \u2014 factually incorrect, too long, wrong format, missed the point \u2014 and sends it directly to Anthropic. Every code block inside a response also has its own copy button in the top-right corner of that block, which copies only that block's content without any surrounding text or backticks.",
tips:['Regenerate only works on the last response in the thread \u2014 you cannot regenerate earlier messages','Thumbs down feedback form is far more valuable than just the vote alone \u2014 always fill it out when you use it','Code block copy buttons are the right tool for pasting code into editors \u2014 no cleanup of backticks or surrounding text needed','There is a share conversation option accessible via the ellipsis menu at the top-right of the conversation header']},

{short:'Your controls',title:"Controls on your own messages \u2014 the edit pencil",gui:'edit',
body:"Hovering over any message you have sent reveals a pencil (edit) icon on the right side of that message. Clicking it opens the message text in an editable field. Change the text or leave it exactly as is, then send. Claude generates a new response from that point forward. This creates a branch: your original message and Claude's original response are preserved in a separate path that remains accessible via navigation arrows. The pencil works on any of your messages at any depth in the thread, not just the most recent one \u2014 meaning you can fork the conversation from any point. There is no dedicated branch button; the edit pencil is the only mechanism for creating branches, and it is only available on your own messages.",
tips:["Re-sending a message unchanged creates a branch with a fresh response \u2014 useful for getting variation without changing the prompt","Pressing Escape after clicking the pencil cancels without creating a branch","Editing an earlier message forks everything below it \u2014 be intentional about which message you edit in a long thread","You can edit any message, even from 15+ messages back \u2014 scroll up in the thread to find it"]},

{short:'Artifacts',title:'Artifacts \u2014 the side panel for interactive output',gui:'artifacts-panel',
body:"When Claude generates code, HTML pages, React components, SVG graphics, Markdown documents, or Mermaid diagrams, it renders these in an Artifact panel \u2014 a split view that opens to the right of the conversation. The artifact panel has two tabs: a preview (rendered HTML, live React component, formatted markdown) and a code/source view. Controls in the panel let you copy the full content, download the file, and open a fullscreen preview. To modify an artifact, tell Claude what to change in your next message and it updates the same artifact in place rather than generating a new one inline. Artifacts persist throughout the conversation and remain fully interactive \u2014 buttons, forms, and JavaScript all run inside the preview. If an artifact stops rendering correctly, ask Claude to fix it.",
tips:['Ask Claude to put any output in an artifact explicitly: "put this in an artifact" or "create a downloadable HTML file"','Downloaded artifacts land in your Downloads folder with an appropriate file extension','You can reference artifact content in follow-ups: "in the code you just wrote, explain the useEffect hook"','Multiple iterations on the same artifact stay in one panel \u2014 Claude updates it in place each time','Artifacts remain accessible if you close and reopen the conversation']},

{short:'Files, search, research',title:'File input, web search, and deep research',gui:'input-pre',
body:"Claude supports several input types beyond plain text. Via the paperclip: PDFs (full text extracted and read), images (JPEG, PNG, GIF, WebP \u2014 read natively via vision, no OCR needed), text and code files (read directly), CSV files (analyzed as structured data). Multiple files can be attached to one message. Web search (toggle in input area): Claude queries the web when formulating responses and cites sources inline with numbered footnotes \u2014 useful for current information, recent events, live documentation, or any topic where your knowledge cutoff matters. Deep Research (accessible from the input area on Pro): a separate extended research mode that runs across multiple sources over 5\u201310 minutes and produces a long-form sourced report. Deep Research is not just web search with more results \u2014 it is a structured investigation workflow for substantive research questions.",
tips:['For large PDFs (100+ pages), ask specific targeted questions rather than "summarize everything" \u2014 targeted queries produce better results','Scanned PDF quality directly affects reading accuracy \u2014 digitally-created PDFs work best','Multiple images can be attached to one message \u2014 Claude reads all of them and can compare or cross-reference','Deep Research is overkill for quick lookups; reserve it for questions that warrant a multi-page sourced report','Web search cites sources inline with footnote numbers \u2014 follow citations to verify specific claims']}
]},

{lbl:'03 \u00b7 Your conversations',tagline:'Context, branching, and managing long-form work',steps:[
{short:'Context window',title:"The context window \u2014 Claude's working memory per session",gui:null,
body:"Every Claude conversation has a context window \u2014 a fixed size of text that Claude actively processes on every turn. The window contains everything: your messages, Claude's responses, file content, your profile instructions, memory injections, and the Project system prompt if you're in one. As a conversation grows longer, older content is either compressed or deprioritized to make room for newer turns. There is no visible indicator of how full the context is \u2014 Claude will not warn you as you approach limits. The practical implication: content at the beginning of a conversation has disproportionate influence because it's always present. Instructions added deep in a long conversation compete with all earlier content and are less reliably followed than instructions in the first message.",
tips:['Files you upload count against the context window \u2014 a 50-page PDF consumes significant context space','Project system prompts are always present in context, which is why they are more reliable than in-conversation instructions for persistent rules','Shorter, focused conversations produce more consistent results than long meandering ones','If you suspect context is exhausted, starting a fresh conversation with a summary is more reliable than trying to fix things in the degraded thread']},

{short:'First message',title:'First message strategy \u2014 the most important prompt you send',gui:null,
body:"Your first message is the single most important message in any conversation because it establishes the frame through which Claude interprets everything that follows. A first message that does its job includes: your role and relevant context (if not already in Profile), the explicit task and any constraints, the desired output format and level of detail, the audience or use case, and any examples or anti-examples of what good output looks like. Writing this first message takes 30\u201345 extra seconds and consistently eliminates 3\u20135 correction rounds. Do not plan to add context as needed as the conversation progresses \u2014 late-added constraints compete with the already-established frame and are less reliably followed than upfront instructions.",
tips:["If you frequently send a second message starting with 'actually, I meant...' \u2014 that information belongs in the first message","Include explicit format instructions: 'respond in a numbered list,' 'give me a two-paragraph summary,' 'respond as if addressing a non-technical executive'","For complex reasoning tasks, include 'think step by step' in the first message \u2014 this reliably produces more thorough output","When starting a session continuing work from a previous conversation, paste a summary of where you left off as your first message"]},

{short:'Context drift',title:'Context drift \u2014 signs and how to recover',gui:null,
body:"Context drift is when Claude starts diverging from the expectations you established at the start \u2014 giving shallower answers, contradicting earlier instructions, reverting to generic responses, or ignoring constraints you clearly specified. It happens because: the conversation has grown long enough that early instructions are being deprioritized, back-and-forth exchanges have introduced conflicting signals, or Claude has been layering instructions until the original framing is no longer dominant. Signs of drift: Claude adds back caveats you told it to omit, responses get more verbose or generic over time, it contradicts something it stated 10 messages ago, or it stops following a format you explicitly requested. Branching does not fix context drift \u2014 the branch inherits all the accumulated noise from the same thread. The only real fix is a new conversation with a clean, complete, well-structured first message.",
tips:["When drift hits, open a new chat and start with: 'Here is where I've landed: [paste key decisions or output]. Continue from here with: [restate your actual requirements clearly]'","Drift often appears subtle at first \u2014 watch for gradual tone shift, format degrading, or responses losing precision across consecutive messages","Very long conversations (30+ exchanges) are almost always better split into focused separate conversations","For iterative creative work, save the best version of the output before the conversation gets too long to trust"]},

{short:'Branching',title:'Branching \u2014 what it is and when it matters',gui:'branch-concept',
body:"Branching creates a fork in your conversation at any point where you edit one of your own messages. When you edit a message and re-send it, Claude generates a new response from that point \u2014 and both the original path (original message, original response, and everything after) and the new path (edited message, new response, and any follow-ups) are fully preserved in the same thread. Nothing is deleted. You navigate between branches using arrow controls that appear on Claude's response at the fork point. Both branches are independently continuable \u2014 you can keep working in either, fork again within a branch, or flip back and forth. The mental model is git branching: both histories exist in parallel, nothing is lost, you can work on any of them at any time.",
tips:['You can branch off a branch \u2014 deeper fork trees are supported, though they can become harder to navigate','Branches do not merge \u2014 once you fork, both paths remain independent indefinitely','Branching does NOT fix context drift from a long conversation \u2014 the branch inherits the accumulated noise from all messages before the fork','Use branching when you are invested in the conversation so far and want to explore a different direction without losing what you have']},

{short:'How to branch',title:'How to branch \u2014 step by step',gui:'branch-how',
body:"The mechanism is the edit pencil on your own messages \u2014 there is no separate branch button. Find the message in the thread where you want the fork to begin; this can be any message you've sent at any depth, not just the most recent one. Hover over that message until the pencil icon appears on the right side. Click the pencil. The message text becomes editable in place \u2014 change it, or leave it exactly as is if you just want a fresh response to the same prompt. Hit send. Claude generates a new response from that point forward and navigation arrows appear on the response at that position, indicating a fork now exists. The original response is still accessible via those arrows.",
tips:["Re-sending the same message unchanged is a valid branching technique \u2014 you get variation without changing the prompt, useful when you want a different take rather than a different question","Pressing Escape after clicking the pencil cancels without creating a branch","The pencil appears ONLY on your messages \u2014 you cannot branch from Claude's side of the conversation","If you want to branch from a message far back in the thread, scroll up, hover on your message, and the pencil will appear regardless of depth"]},

{short:'Branch navigation',title:'Navigating between branches',gui:'branch-nav',
body:"After creating a branch, left and right chevron arrow controls appear on Claude's response at the fork point, with a counter between them (e.g., '2\u2009/\u20092' means you're on branch 2 of 2). Clicking the right arrow advances to the next branch; the left arrow goes to the previous. Switching branches changes everything in the thread below the fork point \u2014 all subsequent messages are replaced by that branch's history. This is a view switch, not a delete \u2014 both paths remain intact. You can continue working in any branch by simply sending a new message while you're viewing it. Any branch can have its own sub-branches, and those have their own counters at their respective fork points.",
tips:["After switching to a branch, your position in the thread jumps to the fork point \u2014 scroll down to see the full branch content","When continuing work on a specific branch, check the counter before sending to confirm which branch you're on","Sharing a conversation shares a snapshot of whichever branch was active at the time you generated the share link","Deep fork trees can become confusing to navigate \u2014 for complex exploratory work, use separate conversations with clear naming instead"]},

{short:'Regen / Branch / New',title:'Regenerate vs. Branch vs. New chat \u2014 full decision guide',gui:'decision',
body:"These three actions address similar problems but have fundamentally different outcomes. Regenerate (circular arrow on Claude's last message): discards the current response and generates a fresh one from the same prompt \u2014 the original is permanently deleted, no fork is created, only works on the last response in the thread. Branch (edit pencil on your message): creates a fork from any point in the thread, both paths permanently preserved and independently continuable, works on any of your messages at any depth. New chat (New chat button): completely blank slate, nothing from the previous conversation is available unless you explicitly paste it in. Decision rule: Regenerate when you need a quick retry on the last response and have no interest in keeping the original. Branch when you're invested in the conversation and want to explore a different direction without losing what you have. New chat when the context is fundamentally too drifted, too long, or the topic has genuinely changed.",
tips:["When in doubt between Branch and New chat, choose Branch \u2014 you can always ignore the old path, but you can't recover it if you chose New chat instead","Regenerate is situational and low-stakes; Branch and New chat are strategic decisions","After creating a branch, say what you're trying in your next message \u2014 it makes navigation easier when branches grow","New chat is not a failure mode \u2014 for long projects, starting fresh sessions with summarized context is good practice, not a workaround"]},

{short:'Exiting cleanly',title:"Exiting a conversation cleanly \u2014 protecting your output",gui:null,
body:"Claude has no automatic cross-session memory of conversation content \u2014 when you start a new conversation tomorrow, it has no access to what happened today unless you explicitly paste context in or it's been extracted to Memory. Any output that matters \u2014 a plan, a draft, a codebase review, a decision, structured research \u2014 needs to be extracted before you consider the conversation closed. Practical exit protocol: copy key outputs to a document or clipboard before closing. If you're continuing the work in a future session, write a closing message asking Claude to summarize what was decided and what the next steps are, then use that summary as the opening message of the next conversation. Artifacts can be downloaded from the artifact panel. For long research conversations, generate a final summary before closing.",
tips:['There is no automatic save for conversation outputs \u2014 you are responsible for extracting anything that matters','The summary-as-opening-message technique is the most reliable way to maintain productive continuity across sessions','Conversations stay accessible in the sidebar history indefinitely \u2014 if you forget to extract something, you can always go back','Projects with knowledge files let you persist structured reference material, but not individual conversation history','Memory captures discrete facts automatically, but structured output (documents, code, plans) must be copied manually']}
]}
];

let mi=0,si=0;
function announce(msg){var el=document.getElementById('sr-announce');if(el){el.textContent='';setTimeout(()=>{el.textContent=msg;},50);}}
function render(){
  const mod=M[mi],step=mod.steps[si],tot=mod.steps.length;
  document.getElementById('tabs').innerHTML=M.map((m,i)=>`<button class="tb${i===mi?' on':''}" onclick="go(${i})" role="tab" id="mod-tab-${i}" aria-selected="${i===mi}" aria-controls="mod-panel-${i}" tabindex="${i===mi?'0':'-1'}">${m.lbl}</button>`).join('');
  document.getElementById('sl').innerHTML='<nav aria-label="Steps">'+mod.steps.map((s,i)=>`<button class="sb2${i===si?' on':''}" onclick="gs(${i})" aria-current="${i===si?'step':'false'}" aria-label="Step ${i+1} of ${tot}: ${s.short}"><span class="sn" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><span>${s.short}</span></button>`).join('')+'</nav>';
  const guiH=step.gui?d(step.gui):'';
  const tipsH=step.tips.length?`<div class="tips"><div class="tph">Notes</div>${step.tips.map(t=>`<div class="tip"><span class="td2">\u00b7</span><span>${t}</span></div>`).join('')}</div>`:'';
  document.getElementById('ca').innerHTML=`<div id="mod-panel-${mi}" role="tabpanel" aria-busy="true" aria-labelledby="mod-tab-${mi}" tabindex="-1"><div class="mtag" aria-hidden="true">${mod.lbl} \u2014 ${mod.tagline}</div><div class="shd"><span class="pip" aria-hidden="true">${si+1}\u2009/\u2009${tot}</span><h2 class="st">${step.title}</h2></div><p class="sbdy">${step.body}</p>${guiH}${tipsH}<div class="nav"><button class="nbtn" onclick="prev()" ${si===0?'disabled':''} aria-label="${si>0?'Previous step: '+mod.steps[si-1].short:'Previous (first step)'}"><i class="ti ti-arrow-left" aria-hidden="true"></i> Prev</button><div class="prog" role="progressbar" aria-valuenow="${si+1}" aria-valuemin="1" aria-valuemax="${tot}" aria-label="Step ${si+1} of ${tot}"><div class="pf" style="width:${Math.round(((si+1)/tot)*100)}%"></div></div><button class="nbtn" onclick="next()" ${si===tot-1?'disabled':''} aria-label="${si<tot-1?'Next step: '+mod.steps[si+1].short:'Next (last step)'}">Next <i class="ti ti-arrow-right" aria-hidden="true"></i></button></div></div>`;
  setTimeout(()=>{const p=document.getElementById('mod-panel-'+mi);if(p)p.setAttribute('aria-busy','false');},0);
}
function go(i){mi=i;si=0;render();setTimeout(()=>{const p=document.getElementById('mod-panel-'+i);if(p)p.focus();},50);announce(M[i].lbl+' \u2014 step 1 of '+M[i].steps.length);}
function gs(i){si=i;render();announce('Step '+(si+1)+' of '+M[mi].steps.length+': '+M[mi].steps[si].title);}
function prev(){if(si>0){si--;render();announce('Step '+(si+1)+' of '+M[mi].steps.length+': '+M[mi].steps[si].title);}}
function next(){if(si<M[mi].steps.length-1){si++;render();announce('Step '+(si+1)+' of '+M[mi].steps.length+': '+M[mi].steps[si].title);}}
render();

// ── TABLIST ARROW KEY NAVIGATION (WCAG APG pattern) ─────────────────────────
// Arrow keys navigate within the tablist. Tab moves from tablist to panel.
document.getElementById('tabs').addEventListener('keydown',function(e){
  if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key)) return;
  e.preventDefault();
  const tbs=[...this.querySelectorAll('[role="tab"]')];
  const cur=tbs.findIndex(t=>t.getAttribute('aria-selected')==='true');
  let nxt=cur;
  if(e.key==='ArrowRight') nxt=(cur+1)%tbs.length;
  if(e.key==='ArrowLeft')  nxt=(cur-1+tbs.length)%tbs.length;
  if(e.key==='Home')       nxt=0;
  if(e.key==='End')        nxt=tbs.length-1;
  if(nxt!==cur){go(nxt);document.getElementById('mod-tab-'+nxt).focus();}
});
</script>
