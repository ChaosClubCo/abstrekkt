<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HOVAV — Halls of Villains and Virtues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Crimson+Pro:ital,wght@0,400;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── READING ROOM AT MIDNIGHT ── */
  :root {
    --ink:     #1c1917;
    --brass:   #c8a86a;
    --virtue:  #c8a86a;
    --villain: #9a5244;
    --paper:   #e9e4da;
    --paper-2: #a09890;
    --border:  rgba(200,168,106,.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--ink);
    font-family: 'Crimson Pro', Georgia, serif;
  }

  /* ── SCENE CANVAS ── */
  #scene {
    position: fixed; inset: 0;
    background: var(--ink);
  }

  /* ── WINDOW FRAME ── */
  #frame {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  #frame svg { width: 100%; height: 100%; }

  /* ── GLASS OVERLAY ── */
  #glass {
    position: fixed; inset: 0;
    z-index: 10; pointer-events: none;
    mix-blend-mode: screen;
    opacity: .06;
    background: radial-gradient(ellipse 60% 45% at 50% 40%, rgba(255,240,200,.8), transparent);
  }

  /* ── CAPTION ── */
  #caption {
    position: fixed;
    bottom: 90px; left: 50%; transform: translateX(-50%);
    z-index: 30;
    max-width: min(540px, 80vw);
    text-align: center;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  #cap-side {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    padding: 3px 12px; margin-bottom: 8px; border-radius: 100px;
    border: 1px solid var(--border);
  }
  .cap-virtue { color: var(--virtue); background: rgba(200,168,106,.08); border-color: rgba(200,168,106,.3); }
  .cap-villain { color: #bf8070; background: rgba(154,82,68,.08); border-color: rgba(154,82,68,.3); }
  #cap-text {
    font-family: 'Crimson Pro', serif;
    font-size: clamp(15px, 2.5vw, 19px);
    font-style: italic;
    color: var(--paper);
    line-height: 1.5;
    text-shadow: 0 1px 12px rgba(28,25,23,.8);
  }

  /* ── MOMENT LABEL ── */
  #m-label {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    z-index: 30; text-align: center; pointer-events: none;
    transition: opacity .3s;
  }
  #m-name {
    font-family: 'Fraunces', serif; font-weight: 300; font-size: 13px;
    color: var(--brass); letter-spacing: .04em;
  }
  #m-date {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: .12em; color: var(--paper-2); margin-top: 2px;
  }

  /* ── CONTROLS ── */
  #controls {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; align-items: center; gap: 12px;
  }

  .ctrl-btn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px;
    background: rgba(28,25,23,.72); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 50%;
    color: var(--paper-2); font-size: 16px; cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
    font-family: 'JetBrains Mono', monospace;
  }
  .ctrl-btn:hover { border-color: rgba(200,168,106,.5); color: var(--brass); }

  #flip-btn {
    width: 52px; height: 52px;
    border-color: rgba(200,168,106,.35);
    color: var(--brass); font-size: 18px;
  }
  #flip-btn.inward { background: rgba(154,82,68,.15); border-color: rgba(154,82,68,.4); color: #bf8070; }

  /* ── STYLE PILLS ── */
  #style-bar {
    position: fixed; top: 18px; right: 18px; z-index: 30;
    display: flex; flex-direction: column; gap: 5px; align-items: flex-end;
  }
  .style-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px; letter-spacing: .1em; text-transform: uppercase;
    padding: 4px 10px; border: 1px solid rgba(200,168,106,.18);
    border-radius: 100px; color: var(--paper-2); background: rgba(28,25,23,.72);
    cursor: pointer; transition: all .15s;
  }
  .style-pill.active { border-color: var(--brass); color: var(--brass); background: rgba(200,168,106,.1); }
  .style-pill:hover:not(.active) { border-color: rgba(200,168,106,.35); color: var(--paper); }

  /* ── PROGRESS ── */
  #progress {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; gap: 6px;
  }
  .pdot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(200,168,106,.25);
    transition: background .25s, transform .25s;
  }
  .pdot.active { background: var(--brass); transform: scale(1.3); }

  /* ── HINT ── */
  #hint {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    letter-spacing: .1em; color: var(--paper-2); opacity: .5;
    z-index: 30; pointer-events: none; white-space: nowrap;
  }

  /* ── FLIP ANIMATION ── */
  #scene { transition: filter .6s ease; }
  #scene.flipping { filter: blur(4px) brightness(.8); }

  /* ── GRAIN ── */
  #grain {
    position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: .04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="glass" aria-hidden="true"></div>

<!-- WINDOW FRAME SVG -->
<div id="frame" aria-hidden="true">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer vignette -->
    <radialGradient id="vgn" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity=".85"/>
    </radialGradient>
    <rect width="100" height="100" fill="url(#vgn)"/>
    <!-- Frame edges — warm dark wood -->
    <rect x="0" y="0" width="100" height="5" fill="#1a1008"/>
    <rect x="0" y="95" width="100" height="5" fill="#1a1008"/>
    <rect x="0" y="0" width="6" height="100" fill="#1a1008"/>
    <rect x="94" y="0" width="6" height="100" fill="#1a1008"/>
    <!-- Frame inner highlight (brass trim) -->
    <rect x="6" y="5" width="88" height="90" fill="none" stroke="#c8a86a" stroke-width=".35" opacity=".3"/>
    <!-- Mullion cross -->
    <rect x="49.7" y="5" width=".6" height="90" fill="#1a1008"/>
    <rect x="6" y="50" width="88" height=".5" fill="#1a1008"/>
  </svg>
</div>

<!-- MOMENT LABEL -->
<div id="m-label" role="status" aria-live="polite">
  <div id="m-name"></div>
  <div id="m-date"></div>
</div>

<!-- CAPTION -->
<div id="caption">
  <div id="cap-side" class="cap-virtue"></div>
  <div id="cap-text"></div>
</div>

<!-- STYLE PILLS (outward only) -->
<div id="style-bar" role="group" aria-label="Visual style">
  <button class="style-pill active" data-s="natural">Natural</button>
  <button class="style-pill" data-s="golden">Golden Hour</button>
  <button class="style-pill" data-s="imax">IMAX</button>
  <button class="style-pill" data-s="brutal">Brutal</button>
  <button class="style-pill" data-s="blueprint">Blueprint</button>
  <button class="style-pill" data-s="midnight">Midnight</button>
</div>

<!-- PROGRESS DOTS -->
<div id="progress" role="tablist" aria-label="Moments"></div>

<!-- CONTROLS -->
<div id="controls">
  <button class="ctrl-btn" id="prev-btn" aria-label="Previous moment">←</button>
  <button class="ctrl-btn" id="flip-btn" aria-label="Flip perspective (F)" aria-pressed="false">⟳</button>
  <button class="ctrl-btn" id="next-btn" aria-label="Next moment">→</button>
</div>

<!-- KEYBOARD HINT -->
<p id="hint">← → pan &nbsp;·&nbsp; F flip &nbsp;·&nbsp; drag to pan</p>

<script>
"use strict";

// ── MOMENTS ──────────────────────────────────────────────────────────────────
const MOMENTS = [
  {
    id:'parking-lot-2009', label:'The Parking Lot', date:'2009', pos:-80,
    virtue:{
      cap:'First real job. Chain link. Fluorescent loading dock. Cigarette I didn\'t want.',
      sky:['#2c2018','#1c1410'],   // sodium yellow-orange
      mid:['#403828','#282018'],
      fg: '#1c1410',
      accent:'#c08040',            // sodium light
    },
    villain:{
      cap:'Performing belonging. Watching everyone else like I was studying for a test.',
      room:'#120e0a',
      light:'#3a2a18',
      objects:'#1c1612',
    }
  },
  {
    id:'shelter-2010', label:'The Shelter', date:'2010', pos:-60,
    virtue:{
      cap:'4am. Less than an inch of snow. Mandatory.',
      sky:['#1a2030','#0c1420'],
      mid:['#b0a090','#808070'],
      fg:'#1a1c20',
      accent:'#c0a040',
    },
    villain:{
      cap:'Counting days. Not approximately. Exactly. Some men around me had stopped.',
      room:'#161814',
      light:'#d8d4c0',
      objects:'#282820',
    }
  },
  {
    id:'back-bar-2014', label:'The Back Bar', date:'2014', pos:-30,
    virtue:{
      cap:'Six deep, both rails. I knew every face before they ordered.',
      sky:['#401408','#200808'],
      mid:['#c06820','#803010'],
      fg:'#100806',
      accent:'#e08820',
    },
    villain:{
      cap:'Most alive I\'d felt in years. Completely hollow underneath it.',
      room:'#0a0604',
      light:'#402010',
      objects:'#160c06',
    }
  },
  {
    id:'card-table-2015', label:'The Card Table', date:'2015', pos:-20,
    virtue:{
      cap:'Built Bear\'s website on a folding table. Googled everything. Finished it.',
      sky:['#0c1824','#060e18'],
      mid:['#182840','#0c1828'],
      fg:'#080c10',
      accent:'#4080c0',
    },
    villain:{
      cap:'I didn\'t know that was how it started. I just knew I had to finish it.',
      room:'#0e0a06',
      light:'#c08020',
      objects:'#181008',
    }
  },
  {
    id:'sedona-2016', label:'Sedona', date:'2016', pos:-10,
    virtue:{
      cap:'Red rock. Bear\'s assignments through a ticket system I built. The desert does something to the noise.',
      sky:['#c04820','#e06828'],
      mid:['#803020','#582010'],
      fg:'#201008',
      accent:'#e89040',
    },
    villain:{
      cap:'First time in years something quieted. Didn\'t trust it. Stayed in it anyway.',
      room:'#0e0a06',
      light:'#d09040',
      objects:'#1a1008',
    }
  },
  {
    id:'right-now', label:'Right Now', date:'2026', pos:0,
    virtue:{
      cap:'Same window. Different everything.',
      sky:['#708090','#405060'],
      mid:['#90a8b8','#607080'],
      fg:'#202830',
      accent:'#90c0e0',
    },
    villain:{
      cap:'Building something. Not sure what yet. That\'s fine.',
      room:'#100e0c',
      light:'#c8a86a',
      objects:'#1c1814',
    }
  },
  {
    id:'office-2023', label:'The Office', date:'2023', pos:20,
    virtue:{
      cap:'Learning a language nobody taught me.',
      sky:['#c8d0d8','#9098a0'],
      mid:['#b0b8c0','#808890'],
      fg:'#404850',
      accent:'#d8e0e8',
    },
    villain:{
      cap:'Quietly building a second floor nobody could see yet.',
      room:'#0c0e14',
      light:'#2040a0',
      objects:'#141620',
    }
  },
  {
    id:'drive-home', label:'The Drive Home', date:'ongoing', pos:40,
    virtue:{
      cap:'Empty highway. The only thinking time I had.',
      sky:['#080c14','#040810'],
      mid:['#182840','#101c30'],
      fg:'#040608',
      accent:'#c0b040',
    },
    villain:{
      cap:'Every plan I ever made happened in this car.',
      room:'#080604',
      light:'#c09020',
      objects:'#100c06',
    }
  },
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let cur = 5;           // start at Right Now
let inward = false;
let style = 'natural';
let panOffset = 0;     // pixel pan being animated
let panTarget = 0;
let transitioning = false;
let dragStart = null;
let dragX = 0;

// ── CANVAS SETUP ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);

// ── STYLE FILTERS ─────────────────────────────────────────────────────────────
const STYLES = {
  natural:    '',
  golden:     'sepia(.5) saturate(1.4) brightness(1.05)',
  imax:       'contrast(1.15) saturate(1.3) brightness(.95)',
  brutal:     'grayscale(.8) contrast(1.3)',
  blueprint:  'sepia(.9) hue-rotate(180deg) saturate(1.5)',
  midnight:   'brightness(.6) saturate(.7) hue-rotate(220deg)',
};

function applyStyle() {
  canvas.style.filter = inward ? 'saturate(.26) brightness(.72)' : (STYLES[style] || '');
}

// ── DRAW SCENE ────────────────────────────────────────────────────────────────
function drawVirtue(m, x, w, h) {
  const v = m.virtue;
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(x, 0, x, h * .65);
  skyGrad.addColorStop(0, v.sky[0]);
  skyGrad.addColorStop(1, v.sky[1]);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(x, 0, w, h * .65);

  // Ground
  const gGrad = ctx.createLinearGradient(x, h * .55, x, h);
  gGrad.addColorStop(0, v.mid[0]);
  gGrad.addColorStop(1, v.fg);
  ctx.fillStyle = gGrad;
  ctx.fillRect(x, h * .55, w, h * .45);

  // Horizon glow
  const hGlow = ctx.createRadialGradient(x + w/2, h * .5, 0, x + w/2, h * .5, w * .7);
  hGlow.addColorStop(0, v.accent + '44');
  hGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = hGlow;
  ctx.fillRect(x, h * .3, w, h * .4);

  // Parallax — distant layer silhouette
  ctx.fillStyle = v.fg + 'cc';
  ctx.fillRect(x, h * .58, w, h * .42);
}

function drawVillain(m, x, w, h) {
  const r = m.villain;
  // Dark room fill
  ctx.fillStyle = r.room;
  ctx.fillRect(x, 0, w, h);

  // Ceiling light pool
  const cGrad = ctx.createRadialGradient(x + w * .35, 0, 0, x + w * .35, h * .3, w * .8);
  cGrad.addColorStop(0, r.light + '50');
  cGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = cGrad;
  ctx.fillRect(x, 0, w, h * .8);

  // Floor warmth
  const fGrad = ctx.createLinearGradient(x, h * .7, x, h);
  fGrad.addColorStop(0, 'transparent');
  fGrad.addColorStop(1, r.objects + '80');
  ctx.fillStyle = fGrad;
  ctx.fillRect(x, h * .7, w, h * .3);

  // Objects shadow masses
  ctx.fillStyle = r.objects;
  ctx.fillRect(x + w * .12, h * .62, w * .15, h * .38);
  ctx.fillRect(x + w * .65, h * .55, w * .22, h * .45);
}

function draw() {
  const W = canvas.width;
  const H = canvas.height;
  const slotW = W;
  ctx.clearRect(0, 0, W, H);

  const m = MOMENTS[cur];
  const x = 0;

  if (inward) {
    drawVillain(m, x, W, H);
  } else {
    drawVirtue(m, x, W, H);
  }

  applyStyle();
}

// ── PROGRESS DOTS ─────────────────────────────────────────────────────────────
function buildDots() {
  const p = document.getElementById('progress');
  p.innerHTML = MOMENTS.map((_, i) =>
    `<div class="pdot${i===cur?' active':''}" role="tab" tabindex="${i===cur?0:-1}" aria-selected="${i===cur}" onclick="go(${i})" aria-label="${MOMENTS[i].label}"></div>`
  ).join('');
}

function updateDots() {
  document.querySelectorAll('.pdot').forEach((d, i) => {
    d.classList.toggle('active', i === cur);
    d.setAttribute('aria-selected', i === cur);
    d.tabIndex = i === cur ? 0 : -1;
  });
}

// ── UI UPDATE ─────────────────────────────────────────────────────────────────
function updateUI() {
  const m = MOMENTS[cur];
  document.getElementById('m-name').textContent = m.label;
  document.getElementById('m-date').textContent = m.date;

  const side = document.getElementById('cap-side');
  const text = document.getElementById('cap-text');
  if (inward) {
    side.textContent = '↙ inward';
    side.className = 'cap-villain';
    text.textContent = m.villain.cap;
  } else {
    side.textContent = '↗ outward';
    side.className = 'cap-virtue';
    text.textContent = m.virtue.cap;
  }

  const flipBtn = document.getElementById('flip-btn');
  flipBtn.setAttribute('aria-pressed', inward);
  flipBtn.classList.toggle('inward', inward);

  // Style bar: only show for outward
  document.getElementById('style-bar').style.opacity = inward ? '.3' : '1';
  document.getElementById('style-bar').style.pointerEvents = inward ? 'none' : 'auto';

  updateDots();
  draw();
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function go(i, skipAnim) {
  if (i < 0 || i >= MOMENTS.length || transitioning) return;
  cur = i;
  updateUI();
}

function next() { if (cur < MOMENTS.length - 1) go(cur + 1); }
function prev() { if (cur > 0) go(cur - 1); }

document.getElementById('next-btn').addEventListener('click', next);
document.getElementById('prev-btn').addEventListener('click', prev);

// ── FLIP ──────────────────────────────────────────────────────────────────────
function flip() {
  if (transitioning) return;
  transitioning = true;
  canvas.classList.add('flipping');
  setTimeout(() => {
    inward = !inward;
    updateUI();
    canvas.classList.remove('flipping');
    transitioning = false;
  }, 320);
}

document.getElementById('flip-btn').addEventListener('click', flip);

// ── KEYBOARD ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.key) {
    case 'ArrowLeft': case 'a': e.preventDefault(); prev(); break;
    case 'ArrowRight': case 'd': e.preventDefault(); next(); break;
    case 'f': case 'F': case ' ': e.preventDefault(); flip(); break;
  }
});

// ── TOUCH / DRAG ──────────────────────────────────────────────────────────────
let touchStartX = 0;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
}, {passive:true});

canvas.addEventListener('mousedown', e => { dragStart = e.clientX; });
window.addEventListener('mouseup', e => {
  if (dragStart !== null) {
    const dx = e.clientX - dragStart;
    if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); }
    dragStart = null;
  }
});

// ── STYLE PILLS ───────────────────────────────────────────────────────────────
document.querySelectorAll('.style-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    style = btn.dataset.s;
    document.querySelectorAll('.style-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyStyle();
  });
});

// ── CONDENSATION (subtle glass moisture) ──────────────────────────────────────
(function condensation() {
  const drops = Array.from({length:18}, () => ({
    x: Math.random(), y: Math.random() * .3, vy: .0001 + Math.random() * .00015,
    r: 1 + Math.random() * 3, a: .03 + Math.random() * .06
  }));
  const gl = document.getElementById('grain');
  let last = 0;
  function tick(t) {
    if (t - last > 80) {
      drops.forEach(d => {
        d.y += d.vy;
        if (d.y > .95) { d.y = Math.random() * .15; d.x = Math.random(); }
      });
      last = t;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// ── INIT ──────────────────────────────────────────────────────────────────────
buildDots();
updateUI();
resize();

// Hide hint after 4s
setTimeout(() => {
  const h = document.getElementById('hint');
  if (h) h.style.opacity = '0';
  h.style.transition = 'opacity .8s';
}, 4000);
</script>
</body>
</html>
