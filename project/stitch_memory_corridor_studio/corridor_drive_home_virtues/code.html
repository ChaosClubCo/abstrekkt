<style>
        .material-symbols-outlined {

        /* Atmospheric UI Frame */
        .ui-frame {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 100;
            border: theme('spacing.window-frame-thickness') solid theme('colors.surface-container-lowest');
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), inset 0 0 40px rgba(0,0,0,0.8);
            transition: border-width 0.3s ease;
        }
        @media (max-width: 768px) {
            .ui-frame { border-width: 4px; }
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(19, 19, 21, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        
        /* 3D Flip Container */
        .perspective-container {
            perspective: 1000px;
            transform-style: preserve-3d;
        }
        .flip-card {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .flip-front, .flip-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .flip-back {
            transform: rotateY(180deg);
        }
        .is-flipped .flip-card {
            transform: rotateY(180deg);
        }

        /* Ambient glow for interactions */
        .glow-hover:hover {
            box-shadow: 0 0 15px rgba(255, 191, 0, 0.2);
            border-color: rgba(255, 191, 0, 0.4);

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const flipBtn = document.getElementById('flip-trigger');
            const mainContainer = document.getElementById('main-perspective');
            let isFlipped = false;

            flipBtn.addEventListener('click', () => {
                isFlipped = !isFlipped;
                if(isFlipped) {
                    mainContainer.classList.add('is-flipped');
                    // Add subtle haptic feedback feeling via CSS class toggle if needed
                } else {
                    mainContainer.classList.remove('is-flipped');
                }
            });
        });
