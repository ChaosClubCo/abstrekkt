baseline_mapping_gap_policy:
  classification: BASELINE_MAPPING_GAP
  trigger: "A production path observed during structural audit cannot yet be mapped or proven irrelevant."
  effect: "Blocks GO but is not a change-time invalidation event."

unknown_change_impact_policy:
  classification: UNKNOWN_IMPACT
  trigger: "A changed production path is unmatched by NON_FUNCTIONAL, SCOPED_FUNCTIONAL, or RELEASE_WIDE rules."
  effect: "Invalidate potentially affected evidence, transition VERIFYING/RELEASE_CANDIDATE/RELEASED products to HOLD, and require impact review before GO."

release_wide_policy:
  rule: "When classification=RELEASE_WIDE or invalidate_all_required_checks=true, invalidate every required check for every listed affected product, regardless of any narrower component subset."
