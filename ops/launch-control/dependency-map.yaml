  derivation:
    - "Any required FAIL => STOP_SHIP."
    - "Otherwise any required MISSING, NOT_RUN, INVALIDATED, or BLOCKED => HOLD."
    - "Otherwise any pending or blocked rerun, BASELINE_MAPPING_GAP, UNKNOWN_IMPACT, or missing release SHA => HOLD."
    - "GO requires every required check PASS for the current release SHA/build and zero unresolved blockers."
    - "NOT_STARTED is valid only when lifecycle_state=PLANNED and no current evidence/rerun queue has been created."
  invalidation_transition:
    VERIFYING: HOLD
    RELEASE_CANDIDATE: HOLD
    RELEASED: HOLD
    PLANNED: NOT_STARTED

