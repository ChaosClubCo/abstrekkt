<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--s:#0d1117;--s2:#161b22;--s3:#21262d;
  --b:#21262d;--b2:#30363d;--t:#e6edf3;--t2:#8b949e;--t3:#484f58;
  --a:#7c3aed;--a2:#a855f7;--ag:rgba(124,58,237,0.15);
  --green:#3fb950;--yellow:#d29922;--orange:#f0883e;--red:#da3633;--blue:#388bfd;
}
body{background:var(--bg);color:var(--t);font-family:'IBM Plex Sans',sans-serif;font-size:13px;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{cursor:pointer;border:0.5px solid var(--b2);border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;padding:5px 12px;background:var(--s2);color:var(--t);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:background 0.12s}
.btn:hover{background:var(--s3)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--a);color:#fff;border-color:var(--a)}
.btn-primary:hover{background:#6d28d9}
.btn-sm{padding:3px 9px;font-size:11px}
.inp{background:var(--s);border:0.5px solid var(--b2);border-radius:6px;color:var(--t);font-family:inherit;font-size:12px;padding:6px 9px;outline:none;width:100%}
.inp:focus{border-color:var(--a)}
select.inp{cursor:pointer}
.card{background:var(--s2);border:0.5px solid var(--b);border-radius:10px;padding:14px 16px}
.sl{font-size:10px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:5px;font-family:'IBM Plex Mono',monospace}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;text-transform:uppercase;letter-spacing:0.4px}
.pbar{height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width 0.5s}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50}
.modal{background:var(--s2);border:0.5px solid var(--b2);border-radius:12px;padding:22px;width:480px;max-width:100%;max-height:90vh;overflow-y:auto}
.spin{display:inline-block;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fd 0.2s ease}
@keyframes fd{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
#app{min-height:100vh}
</style>
</head>
<body>
<div id="app"></div>
<script>
const WEBHOOK = "https://krosebrook.app.n8n.cloud/webhook/portfolio-sync";
const GH_TOKEN = "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";
const PLATFORMS = ["Vercel","Firebase","Base44","GitHub","Replit","Supabase","Lovable","Cloudflare","Other"];
const STATUSES = ["Active","Planning","Blocked","Archived","Sunset"];

let state = {
  projects: JSON.parse(localStorage.getItem("pcc_p")||"null") || [
    {id:"continuum-001",name:"Continuum",status:"Active",platform:"Vercel",techDebt:2,businessValue:5,monthlyCost:20,lastActivity:"2026-03-23",repo:"https://github.com/Krosebrook/continuum",auditChecks:{hasTests:true,hasCI:true,hasDocs:false}},
    {id:"chaos-club-001",name:"Chaos Club Co.",status:"Active",platform:"Firebase",techDebt:2,businessValue:5,monthlyCost:25,lastActivity:"2026-03-20",repo:"https://github.com/ChaosClubCo/chaos-club",auditChecks:{hasTests:false,hasCI:false,hasDocs:true}},
    {id:"flashfusion-001",name:"FlashFusion",status:"Blocked",platform:"Vercel",techDebt:4,businessValue:4,monthlyCost:20,lastActivity:"2025-09-01",repo:"https://github.com/Krosebrook/FlashFusion",auditChecks:{hasTests:false,hasCI:false,hasDocs:false}},
    {id:"kidcreator-001",name:"KidCreator",status:"Active",platform:"GitHub",techDebt:2,businessValue:4,monthlyCost:0,lastActivity:"2025-11-01",repo:"https://github.com/ChaosClubCo/kidcreator",auditChecks:{hasTests:false,hasCI:false,hasDocs:false}},
    {id:"kylerosebrook-001",name:"kylerosebrook.com",status:"Planning",platform:"Vercel",techDebt:1,businessValue:5,monthlyCost:0,lastActivity:"2026-03-25",repo:"",auditChecks:{hasTests:false,hasCI:false,hasDocs:false}},
    {id:"flashfusion-co",name:"flashfusion.co",status:"Active",platform:"Base44",techDebt:2,businessValue:4,monthlyCost:0,lastActivity:"2026-03-20",repo:"",auditChecks:{hasTests:false,hasCI:false,hasDocs:false}},
  ],
  webhookUrl: localStorage.getItem("pcc_wh")||WEBHOOK,
  githubToken: localStorage.getItem("pcc_gt")||GH_TOKEN,
  syncing: false,
  syncError: "",
  lastSync: null,
  syncSummary: null,
  tab: "pipeline",
  filter: "All",
  modal: null,
  editingProject: null,
};

function health(p){
  const days=p.lastActivity?Math.floor((Date.now()-new Date(p.lastActivity))/86400000):999;
  let s=100;
  if(days>180)s-=40;else if(days>90)s-=25;else if(days>30)s-=10;
  s-=((p.techDebt||3)-1)*8;
  if(p.status==="Blocked")s-=20;
  if(p.status==="Archived"||p.status==="Sunset")s-=30;
  s+=((p.businessValue||3)-3)*5;
  s+=Object.values(p.auditChecks||{}).filter(Boolean).length*2;
  return Math.max(0,Math.min(100,Math.round(s)));
}
const hc=h=>h>=75?"#3fb950":h>=50?"#d29922":h>=30?"#f0883e":"#da3633";
const hl=h=>h>=75?"Healthy":h>=50?"Fair":h>=30?"At Risk":"Critical";
const statusColor={Active:"#3fb950",Planning:"#388bfd",Blocked:"#da3633",Archived:"#888",Sunset:"#666"};

function save(){localStorage.setItem("pcc_p",JSON.stringify(state.projects));}

async function doSync(){
  if(state.syncing)return;
  state.syncing=true;state.syncError="";render();
  try{
    const res=await fetch(state.webhookUrl,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        projects:state.projects.map(p=>({id:p.id,name:p.name,status:p.status,platform:p.platform,techDebt:p.techDebt,businessValue:p.businessValue,monthlyCost:p.monthlyCost,lastActivity:p.lastActivity,repo:p.repo||"",auditChecks:p.auditChecks||{}})),
        githubToken:state.githubToken||"",
        meta:{requestedAt:new Date().toISOString(),source:"pcc-standalone"}
      })
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(data.success){
      state.syncSummary=data.summary;
      state.lastSync=new Date();
      if(data.enrichedProjects?.length){
        const em=Object.fromEntries(data.enrichedProjects.map(e=>[e.id,e]));
        state.projects=state.projects.map(p=>{const e=em[p.id];if(!e)return p;return{...p,githubData:e.githubData||p.githubData,lastActivity:e.lastActivity||p.lastActivity};});
        save();
      }
    }else{state.syncError=data.error||"Sync failed";}
  }catch(e){state.syncError=e.message||"Network error";}
  state.syncing=false;render();
}

function openEdit(id){const p=state.projects.find(x=>x.id===id);if(!p)return;state.editingProject={...p,auditChecks:{...p.auditChecks}};state.modal="edit";render();}
function openNew(){state.editingProject={id:"",name:"",status:"Active",platform:"Vercel",techDebt:3,businessValue:3,monthlyCost:0,lastActivity:new Date().toISOString().split("T")[0],repo:"",auditChecks:{hasTests:false,hasCI:false,hasDocs:false}};state.modal="edit";render();}
function openSettings(){state.modal="settings";render();}
function closeModal(){state.modal=null;state.editingProject=null;render();}

function saveProject(){
  const p=state.editingProject;
  if(!p.name.trim())return;
  if(!p.id)p.id="proj-"+Date.now();
  const idx=state.projects.findIndex(x=>x.id===p.id);
  if(idx>=0){state.projects[idx]=p;}else{state.projects.push(p);}
  save();closeModal();
}

function deleteProject(id){
  if(!confirm("Delete this project?"))return;
  state.projects=state.projects.filter(p=>p.id!==id);
  save();render();
}

function editField(k,v){
  if(!state.editingProject)return;
  if(k==="techDebt"||k==="businessValue"||k==="monthlyCost")v=parseFloat(v)||0;
  state.editingProject={...state.editingProject,[k]:v};
  render();
}
function editAudit(k,v){state.editingProject={...state.editingProject,auditChecks:{...state.editingProject.auditChecks,[k]:v}};render();}

function saveSettings(){
  const url=document.getElementById("s-url")?.value||WEBHOOK;
  const token=document.getElementById("s-token")?.value||"";
  state.webhookUrl=url;state.githubToken=token;
  localStorage.setItem("pcc_wh",url);localStorage.setItem("pcc_gt",token);
  closeModal();
}

function render(){
  const app=document.getElementById("app");
  if(!app)return;

  const wh=state.projects.map(p=>({...p,health:health(p)}));
  const filtered=state.filter==="All"?wh:wh.filter(p=>p.status===state.filter);
  const sum=state.syncSummary||{
    total:state.projects.length,
    avgHealth:Math.round(wh.reduce((s,p)=>s+p.health,0)/(wh.length||1)),
    totalMonthlyCost:state.projects.reduce((s,p)=>s+(p.monthlyCost||0),0),
    needsMigration:state.projects.filter(p=>p.platform==="Base44"||p.platform==="Bolt").length,
    activeCount:state.projects.filter(p=>p.status==="Active").length,
    blockedCount:state.projects.filter(p=>p.status==="Blocked").length,
    unhealthyCount:wh.filter(p=>p.health<40).length,
  };
  const criticals=wh.filter(p=>p.health<40||p.status==="Blocked").sort((a,b)=>a.health-b.health);
  const tokenSet=!!state.githubToken;

  let html=`
  <div style="background:var(--s);border-bottom:1px solid var(--b);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px">⬡</div>
      <div>
        <div class="mono" style="font-weight:600;font-size:12px">Portfolio Command Center</div>
        <div class="mono" style="font-size:9px;color:var(--t3)">${state.lastSync?"synced "+state.lastSync.toLocaleTimeString():"not synced · click Sync Now"} · GitHub ${tokenSet?"✓ wired":"✗ no token"}</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      ${state.syncError?`<span style="font-size:11px;color:var(--red);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">⚠ ${state.syncError}</span>`:""}
      <button class="btn btn-sm" onclick="openSettings()">⚙</button>
      <button class="btn btn-primary btn-sm" onclick="doSync()" ${state.syncing?"disabled":""} style="min-width:96px">
        ${state.syncing?`<span class="spin">↻</span> Syncing…`:"↻ Sync Now"}
      </button>
    </div>
  </div>

  <div style="padding:16px;max-width:1200px;margin:0 auto">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px">
      <div class="card"><div class="sl">Avg Health</div><div class="mono" style="font-size:22px;font-weight:600;color:${hc(sum.avgHealth)}">${sum.avgHealth}</div><div style="font-size:11px;color:var(--t2)">${hl(sum.avgHealth)}</div></div>
      <div class="card"><div class="sl">Projects</div><div class="mono" style="font-size:22px;font-weight:600">${sum.total}</div><div style="font-size:11px;color:var(--t2)">${sum.activeCount} active</div></div>
      <div class="card"><div class="sl">Monthly Cost</div><div class="mono" style="font-size:22px;font-weight:600;color:${sum.needsMigration>0?"var(--yellow)":"var(--t)"}">$${sum.totalMonthlyCost}</div><div style="font-size:11px;color:var(--t2)">${sum.needsMigration>0?sum.needsMigration+" need migration":"no migrations needed"}</div></div>
      <div class="card"><div class="sl">Issues</div><div class="mono" style="font-size:22px;font-weight:600;color:${(sum.blockedCount+sum.unhealthyCount)>0?"var(--red)":"var(--green)"}">${sum.blockedCount+sum.unhealthyCount}</div><div style="font-size:11px;color:var(--t2)">${sum.blockedCount} blocked · ${sum.unhealthyCount} unhealthy</div></div>
    </div>

    <div style="display:flex;gap:4px;margin-bottom:12px;align-items:center">
      ${["pipeline","health","alerts"].map(t=>`<button onclick="state.tab='${t}';render()" style="padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-family:'IBM Plex Mono';font-size:11px;font-weight:500;background:${state.tab===t?"var(--a)":"transparent"};color:${state.tab===t?"#fff":"var(--t2)"}">${t}</button>`).join("")}
      <div style="flex:1"></div>
      <button class="btn btn-sm" onclick="openNew()">+ Add</button>
    </div>`;

  if(state.tab==="pipeline"){
    html+=`<div class="fade">
      <div style="display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap">
        ${["All",...STATUSES].map(s=>`<button onclick="state.filter='${s}';render()" style="padding:2px 10px;border-radius:100px;border:0.5px solid;cursor:pointer;font-family:inherit;font-size:11px;border-color:${state.filter===s?"var(--a)":"var(--b2)"};background:${state.filter===s?"var(--ag)":"transparent"};color:${state.filter===s?"var(--a2)":"var(--t2)"}">${s}</button>`).join("")}
        <span style="font-size:11px;color:var(--t3);align-self:center;margin-left:4px">${filtered.length}</span>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;table-layout:fixed">
          <colgroup><col style="width:22%"><col style="width:13%"><col style="width:13%"><col style="width:20%"><col style="width:14%"><col style="width:9%"><col style="width:9%"></colgroup>
          <thead><tr style="border-bottom:1px solid var(--b)">
            ${["Project","Status","Platform","Health","Activity","Cost",""].map(h=>`<th style="padding:8px 12px;text-align:left;font-size:10px;font-weight:500;color:var(--t3);font-family:'IBM Plex Mono';text-transform:uppercase;letter-spacing:0.5px">${h}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${filtered.map((p,i)=>`<tr style="border-bottom:${i<filtered.length-1?"1px solid var(--b)":"none"}">
              <td style="padding:9px 12px;overflow:hidden">
                <div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div>
                ${p.githubData?.language?`<div style="font-size:10px;color:var(--t3);font-family:'IBM Plex Mono'">${p.githubData.language}</div>`:""}
              </td>
              <td style="padding:9px 12px"><span class="badge" style="background:${(statusColor[p.status]||"#888")}22;color:${statusColor[p.status]||"#888"};border:0.5px solid ${(statusColor[p.status]||"#888")}44">${p.status}</span></td>
              <td style="padding:9px 12px;font-size:11px;color:var(--t2);font-family:'IBM Plex Mono';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.platform}</td>
              <td style="padding:9px 12px"><div style="display:flex;align-items:center;gap:6px"><div class="pbar" style="flex:1"><div class="pfill" style="width:${p.health}%;background:${hc(p.health)}"></div></div><span class="mono" style="font-size:11px;color:${hc(p.health)};min-width:22px;text-align:right">${p.health}</span></div></td>
              <td style="padding:9px 12px;font-size:11px;color:var(--t2);font-family:'IBM Plex Mono';white-space:nowrap">${p.lastActivity||"—"}</td>
              <td style="padding:9px 12px;font-size:11px;color:${p.monthlyCost>0?"var(--t)":"var(--t3)"};font-family:'IBM Plex Mono'">${p.monthlyCost>0?"$"+p.monthlyCost:"free"}</td>
              <td style="padding:9px 12px"><div style="display:flex;gap:3px">
                <button class="btn btn-sm" onclick="openEdit('${p.id}')">Edit</button>
                <button class="btn btn-sm" style="color:var(--red)" onclick="deleteProject('${p.id}')">✕</button>
              </div></td>
            </tr>`).join("")}
            ${filtered.length===0?`<tr><td colspan="7" style="padding:28px;text-align:center;color:var(--t3)">No projects match filter</td></tr>`:""}
          </tbody>
        </table>
      </div></div>`;
  }

  if(state.tab==="health"){
    html+=`<div class="fade" style="display:flex;flex-direction:column;gap:8px">
      ${[...wh].sort((a,b)=>a.health-b.health).map(p=>`
      <div class="card" style="border-left:3px solid ${hc(p.health)};border-radius:0 10px 10px 0">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
              <span style="font-weight:500">${p.name}</span>
              <span class="badge" style="background:${(statusColor[p.status]||"#888")}22;color:${statusColor[p.status]||"#888"};border:0.5px solid ${(statusColor[p.status]||"#888")}44">${p.status}</span>
              <span style="font-size:10px;color:var(--t3);font-family:'IBM Plex Mono'">${p.platform}</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px"><div class="pbar" style="flex:1"><div class="pfill" style="width:${p.health}%;background:${hc(p.health)}"></div></div><span class="mono" style="font-size:11px;color:${hc(p.health)}">${p.health}</span></div>
          </div>
          <div style="text-align:right;min-width:64px">
            <div class="mono" style="font-size:20px;font-weight:600;color:${hc(p.health)};line-height:1">${p.health}</div>
            <div style="font-size:10px;color:var(--t3)">${hl(p.health)}</div>
          </div>
          ${p.githubData?`<div style="display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--t2);font-family:'IBM Plex Mono'"><span>★ ${p.githubData.stars}</span>${p.githubData.openIssues>0?`<span style="color:var(--orange)">⚠ ${p.githubData.openIssues}</span>`:""}</div>`:""}
        </div>
      </div>`).join("")}
    </div>`;
  }

  if(state.tab==="alerts"){
    html+=`<div class="fade" style="display:flex;flex-direction:column;gap:8px">
      ${criticals.length===0?`<div class="card" style="padding:28px;text-align:center"><div style="font-size:20px;margin-bottom:6px">✓</div><div style="color:var(--green);font-weight:500">All clear</div><div style="font-size:11px;color:var(--t3);margin-top:3px">Sync to refresh scores</div></div>`:
      criticals.map(p=>`<div class="card" style="border-color:var(--red);background:rgba(218,54,51,0.05)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
              <span style="font-weight:600;color:var(--red)">⚠ ${p.name}</span>
              <span class="badge" style="background:${(statusColor[p.status]||"#888")}22;color:${statusColor[p.status]||"#888"};border:0.5px solid ${(statusColor[p.status]||"#888")}44">${p.status}</span>
            </div>
            <div style="font-size:11px;color:var(--t2)">${p.status==="Blocked"?"Blocked — needs unblocking. ":""}Health ${p.health}/100${p.lastActivity?" · Last active "+p.lastActivity:""}</div>
          </div>
          <div class="mono" style="font-size:24px;font-weight:600;color:var(--red)">${p.health}</div>
        </div>
      </div>`).join("")}
      ${sum.needsMigration>0?`<div class="card" style="border-color:var(--yellow);background:rgba(210,153,34,0.05)">
        <span style="color:var(--yellow);font-weight:600">⚡ </span>
        <span style="font-size:12px;color:var(--t2)">${sum.needsMigration} project${sum.needsMigration>1?"s":""} on Base44/Bolt need migration</span>
      </div>`:""}
    </div>`;
  }

  html+=`</div>`;

  if(state.modal==="edit"&&state.editingProject){
    const ep=state.editingProject;
    html+=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()">
    <div class="modal fade">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <b style="font-size:14px">${ep.id?"Edit Project":"New Project"}</b>
        <button class="btn btn-sm" onclick="closeModal()">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div><div class="sl">Name</div><input class="inp" value="${ep.name}" oninput="editField('name',this.value)" placeholder="Project name"/></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><div class="sl">Status</div><select class="inp" onchange="editField('status',this.value)">${STATUSES.map(s=>`<option${ep.status===s?" selected":""}>${s}</option>`).join("")}</select></div>
          <div><div class="sl">Platform</div><select class="inp" onchange="editField('platform',this.value)">${PLATFORMS.map(s=>`<option${ep.platform===s?" selected":""}>${s}</option>`).join("")}</select></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><div class="sl">Tech Debt (1–5)</div><input class="inp" type="number" min="1" max="5" value="${ep.techDebt}" oninput="editField('techDebt',this.value)"/></div>
          <div><div class="sl">Business Value (1–5)</div><input class="inp" type="number" min="1" max="5" value="${ep.businessValue}" oninput="editField('businessValue',this.value)"/></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><div class="sl">Monthly Cost ($)</div><input class="inp" type="number" min="0" value="${ep.monthlyCost}" oninput="editField('monthlyCost',this.value)"/></div>
          <div><div class="sl">Last Activity</div><input class="inp" type="date" value="${ep.lastActivity}" oninput="editField('lastActivity',this.value)"/></div>
        </div>
        <div><div class="sl">GitHub Repo URL</div><input class="inp" value="${ep.repo||""}" oninput="editField('repo',this.value)" placeholder="https://github.com/..."/></div>
        <div>
          <div class="sl" style="margin-bottom:7px">Audit Checks</div>
          <div style="display:flex;gap:14px">
            ${["hasTests","hasCI","hasDocs"].map(k=>`<label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--t2)"><input type="checkbox" ${ep.auditChecks?.[k]?"checked":""} onchange="editAudit('${k}',this.checked)" style="accent-color:var(--a)"/>${k.replace("has","")}</label>`).join("")}
          </div>
        </div>
        <div style="display:flex;gap:7px;justify-content:flex-end;padding-top:4px">
          <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="saveProject()">Save</button>
        </div>
      </div>
    </div></div>`;
  }

  if(state.modal==="settings"){
    html+=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()">
    <div class="modal fade" style="width:440px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <b style="font-size:14px">Settings</b>
        <button class="btn btn-sm" onclick="closeModal()">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:13px">
        <div><div class="sl">n8n Webhook URL</div><input class="inp mono" id="s-url" value="${state.webhookUrl}" style="font-size:11px"/></div>
        <div>
          <div class="sl">GitHub Token</div>
          <input class="inp mono" id="s-token" type="password" value="${state.githubToken}" placeholder="ghp_..." style="font-size:11px"/>
          <div style="font-size:10px;color:var(--t3);margin-top:4px">Rotate at github.com/settings/tokens if this token was exposed</div>
        </div>
        <div style="display:flex;gap:7px;justify-content:flex-end">
          <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="saveSettings()">Save</button>
        </div>
      </div>
    </div></div>`;
  }

  app.innerHTML=html;
}

render();
</script>
</body>
</html>
