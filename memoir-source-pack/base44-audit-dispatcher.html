<html lang="en">
<head>
<meta charset="UTF-8">
<title>Base44 Portfolio Audit</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #14141a;
    --panel-hover: #1a1a22;
    --border: #26262f;
    --text: #e8e8ec;
    --text-dim: #8b8b98;
    --accent: #6ee7b7;
    --warn: #f5b942;
    --danger: #f5716c;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: -apple-system, 'Inter', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    padding: 20px;
  }
  .header { margin-bottom: 20px; }
  .header h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .header .sub { color: var(--text-dim); font-size: 13px; }
  .stats { display: flex; gap: 16px; margin: 14px 0; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; }
  .stat .num { font-size: 18px; font-weight: 600; font-family: var(--mono); }
  .stat .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font-size: 13px; width: 220px; font-family: var(--sans);
  }
  select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font-size: 13px; font-family: var(--sans);
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; transition: border-color 0.15s;
  }
  .card:hover { border-color: #38383f; }
  .card.scanned { border-left: 3px solid var(--accent); }
  .card.unscanned { border-left: 3px solid #3a3a44; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .app-name { font-weight: 600; font-size: 14px; }
  .app-id { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 10px; font-family: var(--mono);
    white-space: nowrap;
  }
  .badge.scanned { background: rgba(110,231,183,0.12); color: var(--accent); }
  .badge.unscanned { background: rgba(139,139,152,0.12); color: var(--text-dim); }
  .badge.diff { background: rgba(245,185,66,0.15); color: var(--warn); }
  .metrics { display: flex; gap: 12px; margin: 10px 0; font-family: var(--mono); font-size: 12px; }
  .metric .n { font-weight: 600; }
  .metric .l { color: var(--text-dim); font-size: 10px; text-transform: uppercase; }
  .flags { margin: 8px 0; }
  .flag {
    font-size: 11.5px; color: var(--text-dim); padding: 4px 0; border-top: 1px solid var(--border);
    display: flex; gap: 6px;
  }
  .flag:first-child { border-top: none; }
  .flag .dot { color: var(--warn); flex-shrink: 0; }
  .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  button {
    background: #1e1e26; border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 11.5px; cursor: pointer;
    font-family: var(--sans); transition: background 0.15s;
  }
  button:hover { background: #26262f; }
  button.primary { background: rgba(110,231,183,0.1); border-color: rgba(110,231,183,0.3); color: var(--accent); }
  button.primary:hover { background: rgba(110,231,183,0.18); }
  button.copied { background: var(--accent); color: #0b0b0f; border-color: var(--accent); }
  .empty-note { color: var(--text-dim); font-size: 12px; font-style: italic; margin: 8px 0; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--accent); color: var(--text);
    padding: 8px 16px; border-radius: 6px; font-size: 12px; opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
</style>

let storageOK = true;
let storageWarning = null;

async function loadDiffs() {
  for (const app of APPS) {
    if (!app.scanned) continue;
    const key = `scan:${app.id}`;
    let getResult;
    try {
      getResult = await window.storage.get(key);
    } catch (e) {
      // Key genuinely doesn't exist yet (or transient read failure) — treat as first scan.
      getResult = null;
    }

    if (getResult && getResult.value) {
      let stored;
      try {
        stored = JSON.parse(getResult.value);
      } catch (parseErr) {
        // Corrupted stored value — do NOT overwrite it silently. Surface and skip.
        storageOK = false;
        storageWarning = `Stored scan data for ${app.name} is corrupted and was left untouched — investigate before it's overwritten.`;
        continue;
      }
      const prevData = stored.data || stored; // tolerate old un-timestamped records
      app.lastScanned = stored.scannedAt || null;
      app.diff = diffData(prevData, app.data);
      if (app.diff.changed) app.diffMsg = app.diff.summary;
    } else {
      try {
        await window.storage.set(key, JSON.stringify({ data: app.data, scannedAt: new Date().toISOString() }));
        app.lastScanned = new Date().toISOString();
      } catch (setErr) {
        storageOK = false;
        storageWarning = `Could not persist scan data for ${app.name} — storage may be unavailable in this context. Results won't survive reload.`;
      }
    }
  }
}

function diffData(prev, curr) {
  const deltas = [];
  ['entities','functions','agents'].forEach(k => {
    const p = prev[k], c = curr[k];
    if (p == null && c != null) {
      deltas.push(`${k} unknown→${c}`);
    } else if (p != null && c != null && p !== c) {
      const d = c - p;
      deltas.push(`${k} ${d > 0 ? '+' : ''}${d}`);
    }
  });
  return { changed: deltas.length > 0, summary: deltas.join(', ') };
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  }).catch(() => toast('Copy failed — select manually'));
}

function deepScanPrompt(app) {
  return `Run the calibrated Base44 audit pass for "${app.name}" (appId: ${app.id}). Use list_directory on the app root (max_depth=2, recursive) and on the base44/ subfolder (max_depth=2, recursive) to get entity/function/agent counts and top-level anomalies. Report findings in the same format as the other 7 apps already profiled, then update the artifact's stored scan data for this appId.`;
}

function securityPrompt(app) {
  return `Security audit request for Base44 app "${app.name}" (id: ${app.id}).\n\nCheck for: hardcoded secrets or API keys in base44/functions/*/entry.ts, missing auth checks on entity read/write rules, functions that accept unvalidated user input, and any client-side code (src/) that references service_role or admin-level credentials. Report findings as Critical/High/Medium/Low with file paths and one-line fixes.`;
}

function cleanupPrompt(app) {
  return `Dead-code and dependency audit for Base44 app "${app.name}" (id: ${app.id}).\n\nList: unused entities (defined in base44/entities/ but never referenced in src/), oversized page files (>15KB) that may be duplicated logic, unused npm dependencies in package.json vs actual imports, and any backend functions with no corresponding UI call site. Output as a prioritized cleanup list.`;
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  const sortBy = document.getElementById('sortBy').value;

  let list = APPS.filter(a => a.name.toLowerCase().includes(search));
  if (statusFilter === 'scanned') list = list.filter(a => a.scanned);
  if (statusFilter === 'unscanned') list = list.filter(a => !a.scanned && !a.error);
  if (statusFilter === 'error') list = list.filter(a => a.error);
  if (statusFilter === 'flagged') list = list.filter(a => a.data && a.data.flags && a.data.flags.length);

  list = [...list].sort((a, b) => {
    if (sortBy === 'entities') return (b.data?.entities ?? -1) - (a.data?.entities ?? -1);
    if (sortBy === 'functions') return (b.data?.functions ?? -1) - (a.data?.functions ?? -1);
    if (sortBy === 'status') return (b.scanned - a.scanned) || a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name);
  });

  const scannedCount = APPS.filter(a => a.scanned).length;
  const errorCount = APPS.filter(a => a.error).length;
  const totalEntities = APPS.reduce((s,a) => s + (a.data?.entities || 0), 0);
  const totalFunctions = APPS.reduce((s,a) => s + (a.data?.functions || 0), 0);
  const totalFlags = APPS.reduce((s,a) => s + (a.data?.flags?.length || 0), 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${APPS.length}</div><div class="lbl">Total apps</div></div>
    <div class="stat"><div class="num">${scannedCount}</div><div class="lbl">Scanned</div></div>
    <div class="stat"><div class="num">${errorCount}</div><div class="lbl">Inaccessible</div></div>
    <div class="stat"><div class="num">${totalEntities}</div><div class="lbl">Entities (scanned)</div></div>
    <div class="stat"><div class="num">${totalFunctions}</div><div class="lbl">Functions (scanned)</div></div>
    <div class="stat"><div class="num">${totalFlags}</div><div class="lbl">Flags raised</div></div>
  `;

  const warningEl = document.getElementById('storageWarning');
  if (!storageOK && storageWarning) {
    warningEl.textContent = '⚠ ' + storageWarning;
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }

  const grid = document.getElementById('grid');
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty-note">No apps match the current filter/search — clear one to see results.</div>`;
    return;
  }
  grid.innerHTML = list.map(app => {
    const idShort = app.id.slice(0,8) + '…';
    if (app.error) {
      const reason = app.error === 'nonstandard'
        ? 'Sandbox-bridge tools unavailable for this app type — not a code-sandbox-backed app; cannot be structurally audited via this MCP connector.'
        : 'Generic MCP error on both root and base44/ listing — app exists in list_user_apps but its sandbox may be unprovisioned or hibernated.';
      return `
      <div class="card unscanned">
        <div class="card-top">
          <div><div class="app-name">${escapeHtml(app.name)}</div><div class="app-id">${idShort}</div></div>
          <span class="badge" style="background:rgba(245,113,108,0.12);color:var(--danger);">inaccessible</span>
        </div>
        <div class="empty-note">${escapeHtml(reason)}</div>
        <div class="actions">
          <button class="primary" onclick="fireDeepScan('${app.id}')">Retry Scan</button>
        </div>
      </div>`;
    }
    if (!app.scanned) {
      return `
      <div class="card unscanned">
        <div class="card-top">
          <div><div class="app-name">${escapeHtml(app.name)}</div><div class="app-id">${idShort}</div></div>
          <span class="badge unscanned">not scanned</span>
        </div>
        <div class="empty-note">No structural data yet — Pass 1 hasn't reached this app.</div>
        <div class="actions">
          <button class="primary" onclick="fireDeepScan('${app.id}')">Deep Scan</button>
        </div>
      </div>`;
    }
    const d = app.data;
    const diffBadge = app.diffMsg ? `<span class="badge diff">Δ ${escapeHtml(app.diffMsg)}</span>` : '';
    const statusBadge = app.partial
      ? `<span class="badge diff">partial scan</span>`
      : `<span class="badge scanned">scanned</span>`;
    const lastScanned = app.lastScanned
      ? `<div class="app-id" style="margin-top:1px;">last scanned ${new Date(app.lastScanned).toLocaleDateString()}</div>` : '';
    return `
    <div class="card ${app.partial ? 'unscanned' : 'scanned'}">
      <div class="card-top">
        <div><div class="app-name">${escapeHtml(app.name)}</div><div class="app-id">${idShort}</div>${lastScanned}</div>
        <div style="display:flex;gap:6px;">${diffBadge}${statusBadge}</div>
      </div>
      <div class="metrics">
        ${d.entities != null ? `<div class="metric"><div class="n">${d.entities}</div><div class="l">Entities</div></div>` : ''}
        ${d.functions != null ? `<div class="metric"><div class="n">${d.functions}</div><div class="l">Functions</div></div>` : ''}
        ${d.agents != null ? `<div class="metric"><div class="n">${d.agents}</div><div class="l">Agents</div></div>` : ''}
        ${d.pages != null ? `<div class="metric"><div class="n">${d.pages}</div><div class="l">Pages</div></div>` : ''}
      </div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">${escapeHtml(d.stack || '')}</div>
      <div class="flags">
        ${(d.flags||[]).map(f => `<div class="flag"><span class="dot">!</span>${escapeHtml(f)}</div>`).join('')}
      </div>
      <div class="actions">
        <button class="primary" onclick="fireDeepScan('${app.id}')">Re-Scan</button>
        <button onclick="fireSecurity('${app.id}', this)">Security Prompt</button>
        <button onclick="fireCleanup('${app.id}', this)">Cleanup Prompt</button>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function findApp(id) { return APPS.find(a => a.id === id); }

function fireDeepScan(id) {
  const app = findApp(id);
  if (typeof sendPrompt !== 'function') {
    toast('sendPrompt unavailable in this context');
    return;
  }
  try {
    sendPrompt(deepScanPrompt(app));
    toast(`Dispatched deep scan for ${app.name}`);
  } catch (e) {
    toast(`Dispatch failed for ${app.name} — try again`);
  }
}
function fireSecurity(id, btn) {
  const app = findApp(id);
  copyText(securityPrompt(app), btn);
}
function fireCleanup(id, btn) {
  const app = findApp(id);
  copyText(cleanupPrompt(app), btn);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterStatus').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);

(async () => {
  await loadDiffs();
  render();
})();
</script>
</body>
</html>
