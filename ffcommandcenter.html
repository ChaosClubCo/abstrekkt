    // Source: this Claude Project's own `reconstruction/` audit package (dated 2026-07-11),
    // specifically OPEN_LOOP_REGISTER.md and the workstream packages. These are known,
    // unresolved facts about the project — not this artifact's opinion — surfaced here so
    // they don't sit silently contradicted by the "Claude Managed Agents" panels above.
    // None of these are resolved by this artifact; each requires Kyle's direct decision or
    // live-system access this session doesn't have.
    var PROJECT_CONTRADICTIONS = [
      '<b>No canonical Agent Ops Dashboard.</b> 5+ competing builds exist in this project (app-ops-center-v2.jsx, flashfusion-app-ops.jsx, FlashFusionAgentDashboard.jsx, flashfusion-agent-factory.jsx, WorkstreamMapper.jsx, others) with no declared canonical version. [SOURCED: reconstruction/07-decisions-and-risks/OPEN_LOOP_REGISTER.md, OL-1]',
      '<b>Canonical agent backend is disputed.</b> Project docs disagree whether "Orchestrator AI" (Base44 app 694c7561...) or "Fusion AI" (Base44 app 68dd8e79... — the same ID Kyle\'s original CLAUDE.md cited) is the real backend. One newer doc claims Fusion AI supersedes Orchestrator AI; this is not confirmed against the live Base44 apps. [SOURCED: flashfusion-phase3-audit-and-actions.md vs flashfusion-growth-os.jsx]',
      '<b>Two flagged-critical items are still open.</b> A documented GCP-internal-URL exposure via debate.flashfusion.co (fix drafted, never executed — OL-4) and an overdue claude-sonnet-4-20250514 deprecation (deadline was Jun 15, 2026, still hardcoded in ≥4 files). [SOURCED: reconstruction package, R-1 / gap register]'
    ];

    // ---- Session-connected MCP snapshot (added 2026-07-14) ----
    // This is a point-in-time list of which MCP servers were connected to Kyle's session
    // at the moment this artifact was last patched — read directly off the session's own
    // tool manifest, not guessed or inferred. It is NOT live-polled: this artifact's sandbox
    // has no tool to ask "what's connected right now," so treat this block the same way as
    // the CMA plan/cost panels above — refresh it by hand next time you patch.
    // IMPORTANT: none of these are wired into a live call in this artifact yet. Wiring one
    // (e.g. PostHog, which is a real FlashFusion-org project — id 249176 — and directly
    // relevant here) requires two things this session couldn't do: (1) Kyle granting that
    // connector to the ff-command-center artifact in the desktop Cowork UI, since remote
    // artifacts start with zero connector grants, and (2) confirming the exact bridge tool
    // ID window.cowork.callMcpTool expects — the working base44 call below uses the literal
    // string 'base44:base44-sdk', which does NOT match any raw MCP tool name, meaning the
    // bridge uses its own naming scheme this artifact has no way to introspect. Guessing that
    // string for PostHog and shipping it as if verified would fail silently or wrongly claim
    // "live" data — so it's deliberately left unwired rather than faked.
    var MCP_SNAPSHOT = [
      { category: 'Analytics', items: [
        { name: 'PostHog', status: 'connected', note: 'Real FlashFusion-org project (id 249176). Highest-value live-wire candidate — not yet wired (see comment above).' }
      ]},
      { category: 'Email & Messaging', items: [
        { name: 'Gmail', status: 'connected' },
        { name: 'AgentMail', status: 'connected' },
        { name: 'Resend', status: 'connected', note: 'Viable alternative lead tool for the blocked Marketing/Mailchimp row above.' },
        { name: 'MailerLite', status: 'connected', note: 'Viable alternative lead tool for the blocked Marketing/Mailchimp row above.' },
        { name: 'Twilio', status: 'connected' }
      ]},
      { category: 'Productivity & Data', items: [
        { name: 'Todoist', status: 'connected' },
        { name: 'Google Calendar', status: 'connected' },
        { name: 'Airtable', status: 'connected' }
      ]},
      { category: 'Design & Content', items: [
        { name: 'Canva', status: 'connected' },
        { name: 'Higgsfield', status: 'connected' },
        { name: 'Magic Patterns', status: 'connected' },
        { name: 'tldraw', status: 'connected' }
      ]},
      { category: 'Dev / Build', items: [
        { name: 'Caffeine', status: 'connected' },
        { name: 'Make', status: 'connected', note: 'Automation platform alongside n8n.' }
      ]},
      { category: 'Dropped this session', items: [
        { name: 'Stripe', status: 'disconnected', note: 'The Finance domain row above still lists Stripe as its lead tool — re-verify once it reconnects.' },
        { name: 'HubSpot', status: 'disconnected', note: 'Was one of Kyle\'s original candidate data sources for this artifact.' },
        { name: 'Sentry', status: 'disconnected' },
        { name: 'Wix', status: 'disconnected' },
        { name: 'PlanetScale', status: 'disconnected' },
        { name: 'Desktop bridge (remote-devices)', status: 'disconnected', note: 'If this update reached you late or not at all, this is why — it was retried once it reconnected.' }
      ]}
    ];

    function renderMcpSnapshot() {
      var body = el('mcp-status-body');
      if (!body) return;
      body.innerHTML = MCP_SNAPSHOT.map(function (cat) {
        var rows = cat.items.map(function (i) {
          return '<div class="mcp-status-row"><div><div class="mcp-status-name">' + esc(i.name) + '</div>' +
            (i.note ? '<div class="mcp-status-note">' + esc(i.note) + '</div>' : '') + '</div>' +
            '<span class="mcp-status-tag ' + (i.status === 'connected' ? 'connected' : 'disconnected') + '">' +
            esc(i.status) + '</span></div>';
        }).join('');
        return '<div class="mcp-cat"><div class="mcp-cat-title">' + esc(cat.category) + '</div>' + rows + '</div>';
      }).join('');
    }

    function renderContradictions() {
      var b = el('contradiction-banner');
      if (!b) return;
      b.innerHTML = '<b>⚠ Known project contradictions (not resolved by this artifact)</b><br>' +
        PROJECT_CONTRADICTIONS.map(function (c) { return '&bull; ' + c; }).join('<br>');
    }

    function renderCMABanner() {
      el('cma-banner').innerHTML =
        'Agent-orchestration audit trail (hitl_queue / agent_runs, keyed by agent_id) is <strong>not provisioned</strong> in the flashnframe-app Supabase project — ' +
        'that project currently backs a different, unrelated product. Domain, blocker, and cost figures below are your documented plan (' +
        (function () { var n = new Date(); return 'checked live ' + n.toLocaleDateString(); })() +
        '), not live telemetry. 0 of the 40 agents have run yet.';
    }

    function renderDomains() {
      var statusLabel = { ok: 'ready', partial: 'partial', unverified: 'unverified' };
      el('domains-body').innerHTML = CMA_DOMAINS.map(function (d) {
        return '<div class="domain-row">' +
          '<div><div class="domain-name">' + esc(d.name) + '</div>' +
          '<div class="domain-meta">' + d.agents + ' agents · lead tool: ' + esc(d.leadTool) + '</div></div>' +
          '<span class="domain-status ' + esc(d.status) + '">' + esc(statusLabel[d.status] || d.status) + '</span></div>';
      }).join('') +
      '<div class="domain-meta" style="margin-top:8px;text-align:center;">40 agents planned total. Source doc: ~30 MCP-ready + 6 blocked = 36 accounted for — the remaining 4 aren\'t classified anywhere in kyle_todo_v8.html. Not guessed at here.</div>';
    }

    function renderBlocked() {
      el('blocked-body').innerHTML = CMA_BLOCKED.map(function (b) {
        return '<div class="blocked-item"><div class="blocked-tool">' + esc(b.tool) + '</div>' +
          '<div class="blocked-reason">' + esc(b.reason) + '</div></div>';
      }).join('') + '<div class="domain-meta" style="margin-top:8px;">' + esc(CMA_BLOCKED_TOTAL_NOTE) + '</div>';
    }

    function renderCost() {
      var rows = CMA_COST.map(function (c) {
        return '<div class="cost-row"><span>' + esc(c.label) + '</span><span class="val">' + esc(c.value) + '</span></div>';
      }).join('');
      el('cost-body').innerHTML = rows +
        '<div class="cost-total"><span>Target monthly budget</span><span>' + esc(CMA_BUDGET_TOTAL) + '</span></div>' +
        '<div class="domain-meta" style="margin-top:6px;">Circuit breaker: ' + esc(CMA_CIRCUIT_BREAKER) + ' · actual spend: no data (0 runs recorded)</div>';
    }

    // Checked live at call time — the Cowork bridge may inject window.cowork after load.
    function hasBridge() { return !!(window.cowork && typeof window.cowork.callMcpTool === 'function'); }
    function hasAI() { return !!(window.cowork && typeof window.cowork.askClaude === 'function'); }

    // ---- Helpers ----
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
    function showErr(msg) { var b = el('err-banner'); if (!msg) { b.style.display = 'none'; return; } b.textContent = msg; b.style.display = 'block'; }

    function unwrap(r) {
      if (!r) return null;
      if (r.structuredContent != null) return r.structuredContent;
      try {
        if (r.content && r.content[0] && r.content[0].text) return JSON.parse(r.content[0].text);
      } catch (e) { /* not JSON */ }
      return r;
    }

    // ---- Renderers ----
    function renderMcps() {
      var html = AVAILABLE_MCPS.map(function (m) {
        var on = state.activeMcps.indexOf(m.id) !== -1;
        return '<div class="mcp-item ' + (on ? 'active' : '') + '" data-mcp="' + m.id + '">' +
          '<div class="mcp-toggle ' + (on ? 'on' : '') + '"><div class="mcp-knob"></div></div>' +
          '<div class="mcp-dot" style="background:' + m.color + '"></div>' +
          '<span class="mcp-label">' + esc(m.label) + '</span></div>';
      }).join('');
      el('mcp-grid').innerHTML = html;
      Array.prototype.forEach.call(document.querySelectorAll('[data-mcp]'), function (node) {
        node.onclick = function () { toggleMcp(node.getAttribute('data-mcp')); };
      });
    }

    function renderMetrics() {
      var m = state.metrics;
      var cards = [
        { label: 'Throughput', value: m.throughput === '—' ? '—' : m.throughput + '/min' },
        { label: 'Success Rate', value: m.successRate === '—' ? '—' : m.successRate + '%' },
        { label: 'Active Agents', value: m.activeAgents }
      ];
      el('metrics-row').innerHTML = cards.map(function (c) {
        return '<div class="panel metric-card"><div class="metric-label">' + esc(c.label) + '</div>' +
          '<div class="metric-value">' + esc(c.value) + '</div></div>';
      }).join('');
    }

    function renderWorkflows() {
      el('wf-source').textContent = state.wfSource;
      var body = el('workflow-body');
      if (!state.workflows.length) { body.innerHTML = '<div class="empty-state">No workflows in queue</div>'; return; }
      body.innerHTML = state.workflows.map(function (wf) {
        var status = (wf.status || 'pending').toLowerCase();
        var prog = wf.progress != null ? wf.progress : 0;
        return '<div class="workflow-item">' +
          '<div class="workflow-header"><div>' +
            '<div class="workflow-name">' + esc(wf.name || wf.id || 'workflow') + '</div>' +
            '<div class="workflow-owner">Agent: ' + esc(wf.agentOwner || '—') + '</div>' +
          '</div><span class="status-badge status-' + esc(status) + '">' + esc(status) + '</span></div>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + prog + '%"></div></div>' +
          '<div class="wf-actions">' +
            '<button data-wf-act="rerun" data-wf-id="' + esc(wf.id) + '">Re-run</button>' +
            '<button data-wf-act="pause" data-wf-id="' + esc(wf.id) + '">Pause</button>' +
            '<button data-wf-act="logs" data-wf-id="' + esc(wf.id) + '">Logs</button>' +
          '</div></div>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('[data-wf-act]'), function (node) {
        node.onclick = function () { workflowAction(node.getAttribute('data-wf-act'), node.getAttribute('data-wf-id')); };
      });
    }

    function renderAgents() {
      var cls = { ready: '', blocked: 'blocked', 'needs-config': 'needsconfig' };
      var label = { ready: 'ready', blocked: 'blocked', 'needs-config': 'needs config' };
      el('agent-body').innerHTML = AGENT_ROSTER.map(function (a) {
        return '<button class="agent-button" data-agent="' + esc(a.name) + '" style="flex-direction:column;align-items:stretch;gap:2px;">' +
          '<div style="display:flex;align-items:center;gap:8px;width:100%;">' +
            '<span class="agent-arrow">▶</span><span style="flex:1;">' + esc(a.name) + '</span>' +
            '<span class="agent-status ' + esc(cls[a.status] || '') + '">' + esc(label[a.status] || a.status) + '</span>' +
          '</div>' +
          '<div class="agent-meta">' + esc(a.domain) + ' · ' + esc(a.mcp) + ' · batch ' + a.batch + '</div>' +
        '</button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('[data-agent]'), function (node) {
        node.onclick = function () { showAgentInfo(node.getAttribute('data-agent')); };
      });
    }

    function renderChat() {
      var c = el('chat-messages');
      if (!state.chat.length) { c.innerHTML = '<div class="empty-state">Ready for commands. Try a quick action below.</div>'; }
      else {
        c.innerHTML = state.chat.map(function (m) {
          return '<div class="chat-message ' + m.role + '"><span class="chat-bubble">' + esc(m.content) + '</span></div>';
        }).join('');
      }
      c.scrollTop = c.scrollHeight;
    }

    function renderQuick() {
      el('quick-cmds').innerHTML = QUICK.map(function (q) {
        return '<span class="quick-cmd" data-q="' + esc(q) + '">' + esc(q) + '</span>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function (node) {
        node.onclick = function () { el('chat-input').value = node.getAttribute('data-q'); submitChat(); };
      });
    }

    // ---- Actions ----
    function toggleMcp(id) {
      var i = state.activeMcps.indexOf(id);
      if (i === -1) state.activeMcps.push(id); else state.activeMcps.splice(i, 1);
      renderMcps();
    }

    function setBusy(b) {
      state.busy = b;
      el('btn-refresh').disabled = b;
      el('send-btn').disabled = b;
      el('btn-refresh').innerHTML = b ? '<span class="spinner"></span> Sync' : '↻ Refresh';
    }

    function refreshWorkflows() {
      if (!hasBridge()) {
        state.wfSource = 'bridge offline — open as Cowork artifact for live data';
        showErr('Live MCP bridge not detected. This view must run as a Cowork artifact (window.cowork) to pull live workflow data.');
        renderWorkflows();
        return;
      }
      if (state.activeMcps.indexOf('base44') === -1) {
        state.wfSource = 'Base44 MCP disabled';
        state.workflows = [];
        renderWorkflows();
        return;
      }
      setBusy(true);
      showErr('');
      window.cowork.callMcpTool('base44:base44-sdk', {
        action: 'list_workflows',
        filters: { status: ['running', 'pending', 'completed', 'failed'] }
      }).then(function (r) {
        var data = unwrap(r);
        var list = Array.isArray(data) ? data : (data && data.workflows) ? data.workflows : [];
        state.workflows = list.slice(0, 12);
        state.wfSource = 'live · base44 · ' + new Date().toLocaleTimeString();
        var running = state.workflows.filter(function (w) { return (w.status || '').toLowerCase() === 'running'; }).length;
        state.metrics = {
          throughput: data && data.throughput != null ? data.throughput : state.workflows.length,
          successRate: data && data.successRate != null ? data.successRate : '—',
          activeAgents: running
        };
        renderWorkflows(); renderMetrics(); setBusy(false);
      }).catch(function (e) {
        state.wfSource = 'live query failed';
        showErr('Base44 query failed: ' + (e && e.message ? e.message : e));
        setBusy(false);
      });
    }

    function workflowAction(act, id) {
      if (!hasBridge()) { showErr('Bridge offline — cannot ' + act + ' workflow.'); return; }
      pushChat('user', act + ' workflow ' + id);
      setBusy(true);
      window.cowork.callMcpTool('base44:base44-sdk', { action: act + '_workflow', workflowId: id })
        .then(function (r) { pushChat('assistant', '✓ ' + act + ' issued for ' + id); refreshWorkflows(); setBusy(false); })
        .catch(function (e) { pushChat('assistant', '✗ ' + act + ' failed: ' + (e && e.message ? e.message : e)); setBusy(false); });
    }

    // Deliberately NOT a live dispatch. These are Claude Managed Agents —
    // they run on platform.claude.com's own infrastructure, not through this
    // artifact's Base44 bridge. A previous version of this button called
    // base44:base44-sdk to "run" every agent regardless of what it actually
    // was, which would have silently lied about agents that have nothing to
    // do with Base44 (e.g. the Gmail/Calendar digest agent). This shows the
    // real, honest status instead.
    function showAgentInfo(name) {
      var a = AGENT_ROSTER.filter(function (x) { return x.name === name; })[0];
      if (!a) return;
      pushChat('user', name);
      var msg;
      if (a.status === 'ready') {
        msg = '✓ Full config in managed-agents-batch.yaml (batch ' + a.batch + '). Deploy via platform.claude.com — MCP: ' + a.mcp + '. This button does not deploy for you; Managed Agents run on Anthropic\'s platform, not through this artifact.';
      } else if (a.status === 'needs-config') {
        msg = '⚠ MCP endpoint for ' + a.mcp + ' isn\'t confirmed yet — see the comment in managed-agents-batch.yaml for this agent before deploying.';
      } else {
        msg = '✗ Blocked — ' + a.mcp + ' needs credentials connected first. See the Blocked Integrations panel above.';
      }
      pushChat('assistant', msg);
    }

    function pushChat(role, content) { state.chat.push({ role: role, content: content }); renderChat(); }

    function submitChat() {
      var input = el('chat-input');
      var text = input.value.trim();
      if (!text || state.busy) return;
      pushChat('user', text);
      input.value = '';
      if (!hasAI()) { pushChat('assistant', 'AI bridge not detected yet. If this view just opened, wait a moment and retry — window.cowork may still be initializing.'); return; }
      setBusy(true);
      var prompt = 'You are the command interpreter for a solo operator\'s FlashFusion ops dashboard. ' +
        'User said: "' + text + '". Active MCPs: ' + state.activeMcps.join(', ') + '. ' +
        'Current workflows: ' + state.workflows.map(function (w) { return w.name + ' (' + w.status + ')'; }).join('; ') + '. ' +
        'Reply concisely (under 90 words): (1) interpreted intent, (2) which MCP(s) to act through, (3) concrete next step. Plain text.';
      window.cowork.askClaude(prompt, []).then(function (resp) {
        pushChat('assistant', resp || 'Command interpreted. Standing by.');
        setBusy(false);
      }).catch(function (e) {
        pushChat('assistant', 'AI processing error: ' + (e && e.message ? e.message : e));
        setBusy(false);
      });
    }

    // ---- Wire up ----
    el('btn-mcp').onclick = function () {
      var p = el('mcp-panel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    };
    el('btn-refresh').onclick = refreshWorkflows;
    el('chat-form').onsubmit = function (e) { e.preventDefault(); submitChat(); };

    // ---- Initial paint (always renders, bridge or not) ----
    renderMcps(); renderMetrics(); renderWorkflows(); renderAgents(); renderChat(); renderQuick();
    renderCMABanner(); renderDomains(); renderBlocked(); renderCost(); renderContradictions(); renderMcpSnapshot();

    // The Cowork bridge (window.cowork) may be injected asynchronously after the
    // document loads. Poll for it before declaring the bridge offline, then start
    // the live refresh loop the moment it appears.
    var bridgeWaitMs = 0;
    (function waitForBridge() {
      if (hasBridge()) {
        showErr('');
        refreshWorkflows();
        setInterval(refreshWorkflows, 10000);
        return;
      }
      bridgeWaitMs += 500;
      if (bridgeWaitMs >= 12000) {
        refreshWorkflows(); // grace period elapsed -> shows the offline banner
        return;
      }
      state.wfSource = 'connecting to live bridge… ' + (bridgeWaitMs / 1000).toFixed(1) + 's';
      renderWorkflows();
      setTimeout(waitForBridge, 500);
    })();
  })();
  </script>
</body>
