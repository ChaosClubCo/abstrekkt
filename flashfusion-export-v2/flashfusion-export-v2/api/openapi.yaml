openapi: 3.1.0
info:
  title: FlashFusion AI Adoption OS API
  version: 0.1.0-reconstructed
  description: "Provenance: [INFERRED]. Target API contract reconstructed from FlashFusion requirements."
servers:
  - url: https://app.flashfusion.co/api
paths:
  /auth/session:
    get:
      summary: Current session
      responses: {"200": {description: "Session"}}
  /assessments:
    get:
      summary: List assessments
      responses: {"200": {description: "Assessment list"}}
    post:
      summary: Create assessment
      responses: {"201": {description: "Assessment created"}}
  /assessments/{id}/answers:
    put:
      summary: Upsert answer
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: "Answer saved"}}
  /assessments/{id}/submit:
    post:
      summary: Submit assessment and calculate score
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: "Assessment submitted"}}
  /reports/{assessmentId}:
    get:
      summary: Get report
      parameters: [{name: assessmentId, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: "Report"}}
  /clients:
    post:
      summary: Create client
      responses: {"201": {description: "Client created"}}
  /engagements:
    get:
      summary: List engagements
      responses: {"200": {description: "Engagements"}}
    post:
      summary: Create engagement
      responses: {"201": {description: "Engagement created"}}
  /agents/runs:
    post:
      summary: Start governed agent run
      responses: {"202": {description: "Agent run queued"}}
  /stripe/webhook:
    post:
      summary: Stripe webhook with signature verification
      security: []
      responses: {"200": {description: "Processed"}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
security:
  - bearerAuth: []
