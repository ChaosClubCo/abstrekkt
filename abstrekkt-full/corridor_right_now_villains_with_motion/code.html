<script>
    // Inactivity Timer for AI Avatar Trigger
    let inactivityTimer;
    const avatarTrigger = document.getElementById('ai-avatar-trigger');
    const INACTIVITY_DELAY = 3000; // 3 seconds

    function resetInactivityTimer() {
        if (avatarTrigger) {
            avatarTrigger.classList.remove('opacity-100');
            avatarTrigger.classList.add('opacity-0');
            clearTimeout(inactivityTimer);
            
            inactivityTimer = setTimeout(() => {
                avatarTrigger.classList.remove('opacity-0');
                avatarTrigger.classList.add('opacity-100');
            }, INACTIVITY_DELAY);
        }
    }

    // Set up listeners for user activity
    ['mousemove', 'mousedown', 'keypress', 'touchstart', 'scroll'].forEach(evt => 
        document.addEventListener(evt, resetInactivityTimer, { passive: true })
    );
    
    // Initialize timer on load
    resetInactivityTimer();

    // Dust Motes Particle System
    const canvas = document.getElementById('dust-motes');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let particles = [];
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (canvas && ctx && !prefersReducedMotion) {
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // Initial random y
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 1.5 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.speedY = -Math.random() * 0.2 - 0.05; // Drift upwards slowly
                this.baseOpacity = Math.random() * 0.4 + 0.1;
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
                this.pulseVal = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.pulseVal += this.pulseSpeed;
                
                // Add a tiny bit of horizontal wandering
                this.x += Math.sin(this.pulseVal * 0.5) * 0.1;

                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                }
            }

            draw() {
                const currentOpacity = this.baseOpacity + Math.sin(this.pulseVal) * 0.1;
                ctx.fillStyle = `rgba(255, 226, 171, ${Math.max(0, currentOpacity)})`; // primary color
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize particles
        const particleCount = Math.min(window.innerWidth / 10, 150); // Scale by screen width
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();
    }
</script>
