<!-- Parallax Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.body;
            const bgLayer = document.getElementById('layer-bg');
            const midLayer = document.getElementById('layer-mid');

            // Mouse move parallax
            container.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth - 0.5;
                const y = e.clientY / window.innerHeight - 0.5;

                // Background moves slightly (30% logic translated to small pixel shift)
                const bgX = x * 15;
                const bgY = y * 15;
                
                // Middle layer moves more (60% logic translated to larger pixel shift)
                const midX = x * 40;
                const midY = y * 40;

                requestAnimationFrame(() => {
                    bgLayer.style.transform = `translate(${bgX}px, ${bgY}px) scale(1.05)`;
                    midLayer.style.transform = `translate(${midX}px, ${midY}px) scale(1.05)`;
                });
            });

            // Reset on mouse leave
            container.addEventListener('mouseleave', () => {
                requestAnimationFrame(() => {
                    bgLayer.style.transform = `translate(0px, 0px) scale(1.05)`;
                    midLayer.style.transform = `translate(0px, 0px) scale(1.05)`;
                });
            });
        });
    </script>
