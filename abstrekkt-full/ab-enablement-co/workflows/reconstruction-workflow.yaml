name: reconstruction_workflow
version: 0.1.0
steps:
  - { id: ingest_sources, type: job, retries: 3, emits: source.ingested }
  - { id: extract_knowledge_graph, type: job, retries: 2, requires: [ingest_sources], emits: graph.extracted }
  - { id: consolidate_decisions, type: job, requires: [extract_knowledge_graph], emits: decision.detected }
  - { id: resolve_conflicts, type: job, requires: [consolidate_decisions], emits: conflict.detected }
  - { id: discover_gaps, type: job, requires: [resolve_conflicts], emits: gap.detected }
  - { id: generate_artifacts, type: job, requires: [discover_gaps], emits: artifact.generated }
  - { id: validate_export, type: job, requires: [generate_artifacts], emits: validation.completed }
  - { id: assemble_zip, type: job, requires: [validate_export], emits: export.created }
