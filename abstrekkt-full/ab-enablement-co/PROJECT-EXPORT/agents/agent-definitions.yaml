agents:
  - id: knowledge_extractor
    purpose: Extract entities, requirements, decisions, assumptions, systems, workflows, integrations.
    guardrails: [schema_validation, provenance_required, confidence_tags]
  - id: decision_consolidator
    purpose: Deduplicate decisions and publish register entries.
    guardrails: [source_required, rationale_required]
  - id: conflict_resolver
    purpose: Generate ADRs for conflicts.
    guardrails: [alternatives_required, migration_required, confidence_score]
  - id: gap_eliminator
    purpose: Generate concrete artifacts for missing deliverables.
    guardrails: [no_empty_artifacts, validation_required]
  - id: risk_scanner
    purpose: Scan strategic, architecture, product, business, security, operations, scalability, AI governance, compliance, organizational risks.
    guardrails: [owner_required, mitigation_required]
  - id: validation_auditor
    purpose: Run completeness and quality audits.
    guardrails: [critical_failure_blocking]
