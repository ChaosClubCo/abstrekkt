apiVersion: apps/v1
kind: Deployment
metadata: { name: memoir-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: memoir-api } }
  template:
    metadata: { labels: { app: memoir-api } }
    spec:
      containers:
        - name: api
          image: memoir/api:0.1.0
          ports: [{ containerPort: 3001 }]
          readinessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 5, periodSeconds: 10 }
