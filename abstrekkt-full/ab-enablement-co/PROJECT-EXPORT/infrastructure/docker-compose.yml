services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: memoir, POSTGRES_USER: memoir, POSTGRES_PASSWORD: memoir }
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: { context: .., dockerfile: infrastructure/docker/backend.Dockerfile }
    ports: ["3001:3001"]
    depends_on: [postgres, redis]
  frontend:
    build: { context: .., dockerfile: infrastructure/docker/frontend.Dockerfile }
    ports: ["3000:3000"]
    depends_on: [backend]
