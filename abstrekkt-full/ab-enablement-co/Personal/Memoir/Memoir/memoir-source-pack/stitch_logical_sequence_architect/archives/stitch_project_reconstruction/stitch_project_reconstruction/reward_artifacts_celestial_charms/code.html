<style>
        body {
            background-color: #08122d;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(157, 92, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 225, 109, 0.1), transparent 25%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0% { opacity: var(--opacity); transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.5); }
        }

        .float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .glow-secondary {
            box-shadow: 0 0 20px rgba(225, 197, 84, 0.4), inset 0 0 10px rgba(225, 197, 84, 0.2);
        }

        .glass-panel {
            background: rgba(21, 30, 58, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Hide scrollbar for carousel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {

<script>
        // Simple starfield generation
        document.addEventListener('DOMContentLoaded', () => {
            const starfield = document.getElementById('starfield');
            const numStars = 150;

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random position
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                // Random size (mostly small, few large)
                const size = Math.random() > 0.9 ? Math.random() * 3 + 2 : Math.random() * 1.5 + 0.5;
                
                // Random animation properties
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;
                const opacity = Math.random() * 0.8 + 0.2;

                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--opacity', opacity);
                star.style.animationDelay = `${delay}s`;

                // Occasional golden star
                if (Math.random() > 0.8) {
                    star.style.background = '#ffe16d';
                    star.style.boxShadow = '0 0 4px #ffe16d';
                }

                starfield.appendChild(star);
            }
        });
    </script>
