<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(157, 92, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255, 225, 109, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            background: theme('colors.surface-glass');
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .scroll-container {
            background: linear-gradient(to bottom, theme('colors.scroll-gradient-start'), theme('colors.scroll-gradient-end'));
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-glow {
            box-shadow: 0 0 60px rgba(225, 197, 84, 0.3), inset 0 0 20px rgba(225, 197, 84, 0.2);
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 40px rgba(225, 197, 84, 0.2), inset 0 0 10px rgba(225, 197, 84, 0.1); }
            to { box-shadow: 0 0 80px rgba(225, 197, 84, 0.4), inset 0 0 30px rgba(225, 197, 84, 0.3); }
        }

        .star-particle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: var(--base-opacity);
        }

        @keyframes twinkle {
            from { opacity: 0.1; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.8); }
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>

<script>
        // Simple starfield generation
        document.addEventListener('DOMContentLoaded', () => {
            const starfield = document.getElementById('starfield');
            const numStars = 100;
            
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star-particle');
                
                // Random position
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                // Random size (mostly small)
                const size = Math.random() < 0.9 ? Math.random() * 2 + 1 : Math.random() * 4 + 2;
                
                // Random animation duration and opacity
                const duration = Math.random() * 3 + 2; // 2s to 5s
                const baseOpacity = Math.random() * 0.5 + 0.1;
                
                star.style.left = `${x}vw`;
                star.style.top = `${y}vh`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--base-opacity', baseOpacity);
                
                starfield.appendChild(star);
            }
        });
    </script>
