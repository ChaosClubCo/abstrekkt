<style>
        @keyframes pulseGlow {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 0 60px rgba(225, 197, 84, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.3);
            }
            50% { 
                transform: scale(1.05); 
                box-shadow: 0 0 120px rgba(225, 197, 84, 0.9), inset 0 0 40px rgba(255, 255, 255, 0.6);
            }
        }
        .animate-pulse-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: slowSpin 30s linear infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        /* Hide scrollbar for immersive feel */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>

<div class="absolute w-[200px] h-[200px] md:w-[350px] md:h-[350px] border-2 border-secondary/20 rounded-full border-dashed animate-spin-slow" style="animation-direction: reverse;"></div>
