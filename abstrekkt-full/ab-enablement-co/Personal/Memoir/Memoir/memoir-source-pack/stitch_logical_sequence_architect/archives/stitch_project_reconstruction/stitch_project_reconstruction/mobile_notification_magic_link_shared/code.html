<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #08122d;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-morphism {
            background: rgba(21, 30, 58, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .star-glow {
            box-shadow: 0 0 15px rgba(225, 197, 84, 0.4);
        }

        @keyframes drift {
            from { transform: translateY(0px) translateX(0px); }
            to { transform: translateY(-50px) translateX(20px); }
        }

        .star-field {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .nebula-bg {
            background: radial-gradient(circle at 20% 30%, rgba(157, 92, 255, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(219, 225, 255, 0.1) 0%, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col items-center justify-center relative bg-background">
<!-- Ethereal Nebula Background Animation -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none nebula-bg">
<!-- Floating Stars Simulation -->
<script>
            const starCount = 60;
            const container = document.body;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star-field absolute bg-star-yellow';
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${2 + Math.random() * 4}s`);
                container.appendChild(star);
            }
        </script>
<!-- Background Image Representation of Nocturne Dreamscape -->
<div class="absolute inset-0 opacity-40 bg-cover bg-center" data-alt="An ethereal and atmospheric cosmic dreamscape featuring soft, swirling purple and indigo nebulae. Gentle clusters of glowing golden stars drift across the vast darkness of space. The lighting is diffused and magical, evoking a sense of calm, nighttime wonder, and a high-end digital art aesthetic typical of a premium meditation or storytelling app." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCBkC5vdyVL4Ycs15ZNjt8PNpbU1Q_m05xMLN88-9_KR-ezuEvlTuiW4INOFuPT7Tb_LRW8wcjgCRTaHkD6Dy5jaRGa-nkVUY6C3yvAKTyY5D0kv6Jpf83EwC3ZmFOIwhgpqeBUgp_8qiF8r33vBC_ta0iVevawogN-sQ9GfXdQwBq64zmrImTGkkbt-OExqzN-UiHYGjaHLn28ExQzMtR3J7SQsT67OgU1k8M8m09fatSyAS6JHN0r2VQl0PV28T5lay8ScDsEYcw')">
</div>
</div>
<!-- Phone Lock Screen Content -->
<main class="relative z-10 w-full max-w-[360px] h-full flex flex-col items-center px-gutter pt-24 pb-12">
<!-- Clock / Time -->
<div class="text-center mb-12">
<h1 class="font-headline-xl text-headline-xl text-primary opacity-90 drop-shadow-lg">10:45</h1>
<p class="font-ui-main text-primary/80 tracking-widest uppercase text-xs mt-2">Monday, October 14</p>
</div>
<!-- Notification Center Space -->
<div class="w-full space-y-4">
<!-- Bedtime Chronicles Notification -->
<div class="glass-morphism rounded-3xl p-5 shadow-2xl transition-all duration-500 hover:scale-[1.02] active:scale-[0.98] cursor-pointer group">
<div class="flex items-start gap-4">
<!-- Magic Link Icon -->
<div class="w-12 h-12 rounded-2xl bg-secondary-container flex items-center justify-center star-glow shrink-0 border border-secondary/30 relative">
<span class="material-symbols-outlined text-on-secondary-container text-2xl" style="font-variation-settings: 'FILL' 1;">magic_button</span>
<div class="absolute -inset-1 bg-secondary/20 blur-md rounded-full animate-pulse"></div>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-center mb-1">
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">Bedtime Chronicles</span>
<span class="font-label-sm text-label-sm text-on-surface-variant/60">now</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-star-yellow truncate">A Gift of Starlight</h2>
<p class="font-ui-main text-on-surface-variant/90 text-sm mt-1 leading-relaxed">
                            Mom has shared her voice with you. Tap to listen and add to your library.
                        </p>
</div>
</div>

<div class="h-1 w-12 bg-white/20 rounded-full"></div>
</div>
</div>

<div class="flex gap-3">
<div class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-primary/40">bedtime</span>

<div class="flex-1">

</div>

<div class="mt-auto w-full flex justify-between items-center px-4">
<button class="w-12 h-12 rounded-full bg-surface-glass border border-white/10 flex items-center justify-center text-primary hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">flashlight_on</span>
</button>
<div class="flex flex-col items-center">
<div class="w-32 h-1.5 bg-white/30 rounded-full mb-4"></div>
<p class="font-label-sm text-label-sm text-white/40">Swipe up to unlock</p>
</div>
<button class="w-12 h-12 rounded-full bg-surface-glass border border-white/10 flex items-center justify-center text-primary hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">photo_camera</span>
</button>
</div>
</main>
<!-- Optional subtle interactive overlay for 'Starlight' touch effect -->
<div class="fixed pointer-events-none w-32 h-32 bg-secondary/10 blur-[60px] rounded-full z-50 transition-opacity opacity-0" id="touch-glow"></div>
<script>
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('touch-glow');
            glow.style.opacity = '1';
            glow.style.left = `${e.clientX - 64}px`;
            glow.style.top = `${e.clientY - 64}px`;
        });

        document.addEventListener('mouseleave', () => {
            document.getElementById('touch-glow').style.opacity = '0';
        });

        // Simple scale effect for the whole lock screen on interaction
        document.querySelector('.glass-morphism').addEventListener('touchstart', function() {
            this.style.transform = 'scale(0.98)';
        });
        document.querySelector('.glass-morphism').addEventListener('touchend', function() {
            this.style.transform = 'scale(1)';
        });
    </script>
</body></html>
