<style>
        body {
            background-color: #08122d;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .celestial-scroll {
            background: linear-gradient(180deg, rgba(21, 30, 58, 0.8) 0%, rgba(11, 19, 43, 0.9) 100%);

            filter: blur(80px);
            opacity: 0.4;
            background: radial-gradient(circle, #9d5cff 0%, transparent 70%);

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;

<body class="font-ui-main text-on-surface selection:bg-secondary/30">

<div class="w-full h-2 rounded-full bg-surface-container-high overflow-hidden mt-2">
<div class="h-full bg-secondary w-1/3 rounded-full star-glow animate-[shimmer_2s_infinite]"></div>

<!-- Interactive Micro-Interactions -->
<script>
        // Generate random background stars
        const starContainer = document.getElementById('star-container');
        const starCount = 60;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            const size = Math.random() * 2 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            
            const duration = Math.random() * 3 + 2 + 's';
            star.style.setProperty('--duration', duration);
            star.style.opacity = Math.random();
            
            starContainer.appendChild(star);
        }

        // Add magnetic effect to primary button
        const btn = document.querySelector('button');
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            btn.style.transform = `translate(${x * 0.1}px, ${y * 0.1}px) scale(1.03)`;
        });

        btn.addEventListener('mouseleave', () => {
            btn.style.transform = '';
        });
    </script>
