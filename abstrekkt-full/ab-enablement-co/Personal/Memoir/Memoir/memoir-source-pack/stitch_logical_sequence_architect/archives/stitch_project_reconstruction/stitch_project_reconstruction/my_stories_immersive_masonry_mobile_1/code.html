<!-- Interactions Script -->
<script>
        function toggleOverlay(el) {
            const overlay = el.querySelector('.action-overlay');
            const isActive = overlay.classList.contains('opacity-100');
            
            // Close all other overlays first
            document.querySelectorAll('.action-overlay').forEach(o => {
                o.classList.remove('opacity-100');
                o.classList.add('opacity-0');
                o.classList.add('pointer-events-none');
            });

            if (!isActive) {
                overlay.classList.remove('opacity-0');
                overlay.classList.add('opacity-100');
                overlay.classList.remove('pointer-events-none');
            }
        }

        // Close overlay when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.masonry-item-tall') && 
                !e.target.closest('.masonry-item-short') && 
                !e.target.closest('.masonry-item-med')) {
                document.querySelectorAll('.action-overlay').forEach(o => {
                    o.classList.remove('opacity-100');
                    o.classList.add('opacity-0');
                    o.classList.add('pointer-events-none');
                });
            }
        }, true);
    </script>
