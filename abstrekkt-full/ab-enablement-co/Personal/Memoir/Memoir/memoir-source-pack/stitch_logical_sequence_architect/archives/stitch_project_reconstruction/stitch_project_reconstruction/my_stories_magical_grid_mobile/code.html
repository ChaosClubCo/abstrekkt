<script>
        // Subtle floating animation for FAB
        const fab = document.querySelector('button.bg-secondary-container');
        let floatY = 0;
        let direction = 1;
        
        function animateFab() {
            floatY += 0.05 * direction;
            if (floatY > 3 || floatY < -3) direction *= -1;
            fab.style.transform = `translateY(${floatY}px)`;
            requestAnimationFrame(animateFab);
        }
        animateFab();
    </script>
