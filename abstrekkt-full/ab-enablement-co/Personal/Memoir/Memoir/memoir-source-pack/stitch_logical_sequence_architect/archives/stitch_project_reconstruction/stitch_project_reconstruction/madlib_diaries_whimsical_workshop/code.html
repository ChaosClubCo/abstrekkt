<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bedtime Chronicles | Whimsical Workshop</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;family=Literata:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@100..900&amp;family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">

            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#151e3a",
                        "inverse-on-surface": "#262f4c",

                        "secondary-fixed-dim": "#e9c400",

                        "tertiary-container": "#1e0e24",
                        "inverse-primary": "#565d79",
                        "error-container": "#93000a",
                        "on-secondary-fixed": "#221b00",
                        "on-error-container": "#ffdad6",
                        "on-surface": "#dbe1ff",
                        "surface-tint": "#bec5e5",
                        "primary": "#bec5e5",
                        "on-tertiary-container": "#8e7793",
                        "surface-variant": "#2b3450",
                        "on-primary-fixed": "#131a33",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#544059",
                        "surface-container-lowest": "#030c28",
                        "on-primary-container": "#767e9b",
                        "on-error": "#690005",
                        "on-primary": "#282f49",
                        "secondary-fixed": "#ffe16d",
                        "surface-container-high": "#202945",
                        "on-primary-fixed-variant": "#3e4660",
                        "tertiary-fixed-dim": "#d9bedd",
                        "surface-dim": "#08122d",
                        "surface-container-low": "#111a36",
                        "surface-container-highest": "#2b3450",
                        "primary-fixed-dim": "#bec5e5",
                        "on-secondary-fixed-variant": "#544600",
                        "background": "#08122d",
                        "secondary-container": "#ffdb3c",
                        "on-surface-variant": "#c6c6ce",
                        "on-background": "#dbe1ff",
                        "surface": "#08122d",
                        "inverse-surface": "#dbe1ff",
                        "tertiary-fixed": "#f6d9fa",
                        "secondary": "#fff9ef",
                        "outline-variant": "#45464d",
                        "on-secondary-container": "#725f00",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "stack-md": "16px",
                        "story-padding": "40px",
                        "stack-sm": "8px",
                        "unit": "8px",
                        "container-margin": "24px",
                        "stack-lg": "32px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Playfair Display"],
                        "story-body": ["Literata"],
                        "label-sm": ["Plus Jakarta Sans"],

                        "headline-xl": ["Playfair Display"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                        "story-body": ["20px", {"lineHeight": "32px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

<style>
        body {
            background-color: #08122d;
            color: #dbe1ff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .glass-surface {
            background: rgba(21, 30, 58, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(190, 197, 229, 0.1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .play-button-glow {
            box-shadow: 0 0 20px rgba(255, 225, 109, 0.3);
        }
        
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .delay-1 { animation-delay: 0s; }
        .delay-2 { animation-delay: 1.5s; }
        .delay-3 { animation-delay: 3s; }
        .delay-4 { animation-delay: 4.5s; }
    </style>
</head>
<body class="bg-background">
<!-- Nebula Background Shader -->

<div class="relative z-10 pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-container-margin py-4 max-w-7xl mx-auto z-50 bg-gradient-to-b from-background/80 to-transparent sticky top-0 backdrop-blur-sm">
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold tracking-tight flex items-center gap-2">
<span class="material-symbols-outlined">auto_awesome</span>
                Bedtime Chronicles
            </div>
<div class="flex items-center gap-stack-md">
<button class="material-symbols-outlined text-primary text-2xl hover:text-secondary-fixed transition-colors active:scale-95 duration-300">
                    close
                </button>
</div>
</header>
<main class="relative z-10 px-container-margin max-w-7xl mx-auto pt-8">
<!-- Header Section -->
<div class="text-center mb-12">
<h1 class="font-headline-xl text-[40px] md:text-headline-xl text-on-background leading-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r from-secondary-fixed to-tertiary">
                    The Workshop of Wonders
                </h1>
<p class="text-on-surface-variant font-story-body text-story-body max-w-2xl mx-auto">
                    Build a silly story to settle your mind.
                </p>
</div>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
<!-- Madlib Inputs Section -->
<div class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Input Card 1 -->
<div class="glass-surface p-6 rounded-3xl floating-card delay-1 border-l-4 border-l-secondary-fixed">
<label class="block text-secondary-fixed font-label-sm text-label-sm uppercase tracking-widest mb-2">An Adjective</label>
<input class="w-full bg-surface-container/50 border border-outline/30 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-secondary-fixed transition-colors font-ui-main text-ui-main placeholder:text-on-surface-variant/50" placeholder="e.g. sleepy, sparkly..." type="text"/>
</div>
<!-- Input Card 2 -->
<div class="glass-surface p-6 rounded-3xl floating-card delay-2 border-l-4 border-l-tertiary">
<label class="block text-tertiary font-label-sm text-label-sm uppercase tracking-widest mb-2">An Animal</label>
<input class="w-full bg-surface-container/50 border border-outline/30 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-tertiary transition-colors font-ui-main text-ui-main placeholder:text-on-surface-variant/50" placeholder="e.g. badger, owl..." type="text"/>
</div>
<!-- Input Card 3 -->
<div class="glass-surface p-6 rounded-3xl floating-card delay-3 border-l-4 border-l-primary">
<label class="block text-primary font-label-sm text-label-sm uppercase tracking-widest mb-2">A Place</label>
<input class="w-full bg-surface-container/50 border border-outline/30 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary transition-colors font-ui-main text-ui-main placeholder:text-on-surface-variant/50" placeholder="e.g. marshmallow mountain..." type="text"/>
</div>
<!-- Input Card 4 -->
<div class="glass-surface p-6 rounded-3xl floating-card delay-4 border-l-4 border-l-error">
<label class="block text-error font-label-sm text-label-sm uppercase tracking-widest mb-2">A silly sound</label>
<input class="w-full bg-surface-container/50 border border-outline/30 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-error transition-colors font-ui-main text-ui-main placeholder:text-on-surface-variant/50" placeholder="e.g. boop, squish..." type="text"/>
</div>
</div>
<!-- Right Sidebar / AI Cover Generation -->
<div class="lg:col-span-4 flex flex-col gap-6">
<div class="glass-surface rounded-3xl overflow-hidden flex flex-col border border-tertiary/20">
<div class="p-4 bg-tertiary-container/30 border-b border-tertiary/10 flex justify-between items-center">
<span class="font-label-sm text-tertiary uppercase tracking-widest">Generating Cover Art...</span>
<span class="material-symbols-outlined text-tertiary animate-spin">refresh</span>
</div>
<div class="relative aspect-square w-full bg-surface-container-high flex items-center justify-center p-6">
<!-- Placeholder image fallback if missing -->
<img alt="Generating..." class="object-cover rounded-2xl w-full h-full opacity-50 blur-sm mix-blend-screen" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmVfksDi8iHYFkdMvz2kFqHsVKIYNhSF8gFOhw0DoaP0bLyG8aZAA46113qcnfMK2Hi1n9VZzrLIP-lbG9rApRpG5JzinoPPyltXXpjQgVxjRVsV1_1ftlgDTzaHcD3IRCoHI3q1bfDjjQCoiJQ98tmgRjnQYe6bxwTHOJkLW51q-ZkkI8x2cUSSHliFT2KpDuqtid836fuoff09N8xPQJpPwZ02HX2-i7Iy_gOulG3XdtpJCa7n940-jLT22J13p53sUxVuEL6HQ"/>
<div class="absolute inset-0 flex flex-col items-center justify-center text-on-surface-variant gap-2">
<span class="material-symbols-outlined text-4xl text-tertiary animate-pulse">auto_awesome_mosaic</span>
<p class="font-ui-main text-sm text-center px-4">Brewing up something magical based on your words...</p>
</div>
</div>
</div>
<!-- Voice Selection -->
<div class="glass-surface p-6 rounded-3xl">
<h3 class="font-ui-main text-on-background mb-4 font-semibold">Choose Narrator</h3>
<div class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
<button class="flex flex-col items-center gap-2 min-w-[70px] group">
<div class="w-14 h-14 rounded-full bg-secondary-container/20 border-2 border-secondary-fixed flex items-center justify-center transition-transform group-hover:scale-110">
<span class="text-2xl">🦉</span>
</div>
<span class="font-label-sm text-on-surface-variant group-hover:text-on-surface">Wise Owl</span>
</button>
<button class="flex flex-col items-center gap-2 min-w-[70px] group opacity-70 hover:opacity-100">
<div class="w-14 h-14 rounded-full bg-surface-variant flex items-center justify-center transition-transform group-hover:scale-110">
<span class="text-2xl">☁️</span>
</div>
<span class="font-label-sm text-on-surface-variant group-hover:text-on-surface">Sleepy Cloud</span>
</button>
<button class="flex flex-col items-center gap-2 min-w-[70px] group opacity-70 hover:opacity-100">
<div class="w-14 h-14 rounded-full bg-surface-variant flex items-center justify-center transition-transform group-hover:scale-110">
<span class="text-2xl">🐻</span>
</div>
<span class="font-label-sm text-on-surface-variant group-hover:text-on-surface">Cozy Bear</span>
</button>
</div>
</div>
</div>
</div>
</main>
</div>
<!-- Bottom Docked Player Bar -->
<div class="fixed bottom-0 left-0 w-full z-50 px-4 py-4 md:px-container-margin md:py-6 pointer-events-none flex justify-center">
<div class="bg-surface-container-high/90 backdrop-blur-xl border border-primary/20 rounded-full px-6 py-4 shadow-2xl flex items-center gap-6 max-w-3xl w-full pointer-events-auto">
<!-- Audio Toggle -->
<button class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-primary hover:bg-surface-variant/80 transition-colors">
<span class="material-symbols-outlined">music_note</span>
</button>
<div class="flex-grow flex flex-col items-center">
<span class="font-label-sm text-on-surface-variant tracking-wider uppercase mb-1">Ready to Read</span>
<div class="h-1 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed w-1/3 rounded-full"></div>
</div>
</div>
<!-- Play Toggle -->
<button class="bg-secondary-fixed text-on-secondary-fixed w-14 h-14 rounded-full flex items-center justify-center play-button-glow hover:scale-105 transition-transform active:scale-95 shadow-lg">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Settings Toggle -->
<button class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-primary hover:bg-surface-variant/80 transition-colors">
<span class="material-symbols-outlined">tune</span>
</button>
</div>
</div>
</body></html>
