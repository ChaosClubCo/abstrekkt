<!-- Background Image and Shader -->
<div class="fixed inset-0 w-full h-full -z-20 bg-cover bg-center bg-soft-focus" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg');"></div>
<div class="fixed inset-0 w-full h-full -z-10 mix-blend-screen" style="display:block;">
<canvas id="shader-canvas" style="display:block;width:100%;height:100%"></canvas>
<script>
    (function() {
      const canvas = document.getElementById('shader-canvas');
      function syncSize() {
        const w = canvas.clientWidth  || 1280;
        const h = canvas.clientHeight || 720;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width  = w;
          canvas.height = h;
        }
      }
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(syncSize).observe(canvas);
      }
      syncSize();
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return;
      
      let typingIntensity = 0.0;
      
      const inputs = document.querySelectorAll('.madlib-input');
      inputs.forEach(input => {
          input.addEventListener('input', () => {
              typingIntensity = 1.0;
          });
      });

      const vs = `attribute vec2 a_position;varying vec2 v_texCoord;void main() {v_texCoord = a_position * 0.5 + 0.5;gl_Position = vec4(a_position, 0.0, 1.0);}`;
      const fs = `
        precision highp float;
        uniform float u_time;
        uniform vec2 u_resolution;
        uniform float u_intensity;
        varying vec2 v_texCoord;
        
        float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }
        
        float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                       mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        
        float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            vec2 shift = vec2(100.0);
            for (int i = 0; i < 5; ++i) {
                v += a * noise(p);
                p = p * 2.0 + shift;
                a *= 0.5;
            }
            return v;
        }
        
        void main() {
            vec2 uv = v_texCoord;
            vec2 pos = uv * u_resolution.xy;
            vec3 color = vec3(0.0, 0.0, 0.0); // Transparent base
            
            vec2 nebulaPos = uv * 3.0;
            nebulaPos.x += u_time * (0.05 + u_intensity * 0.1); // Speed up on typing
            nebulaPos.y += sin(u_time * 0.1) * 0.1;
            
            float n = fbm(nebulaPos);
            float n2 = fbm(nebulaPos + vec2(1.5, 2.3) + u_time * 0.02);
            
            vec3 nebulaColor1 = vec3(0.6, 0.2, 0.8) * (1.0 + u_intensity); // Brighten on typing
            vec3 nebulaColor2 = vec3(0.3, 0.1, 0.5);
            vec3 nebula = mix(nebulaColor2, nebulaColor1, n);
            nebula *= n2 * 0.5;
            color += nebula;
            
            for (float i = 1.0; i < 4.0; i++) {
                vec2 grid = floor(pos / (40.0 * i));
                vec2 local = fract(pos / (40.0 * i)) - 0.5;
                float h = hash(grid);
                if (h > 0.98) {
                    float size = 0.03 + 0.05 * h;
                    float dist = length(local);
                    float pulse = 0.5 + 0.5 * sin(u_time * (h * 5.0) + h * 10.0 + u_intensity * 10.0);
                    float brightness = smoothstep(size, 0.0, dist) * pulse;
                    vec3 starColor = vec3(1.0, 0.9, 0.5) * brightness * (1.0 + u_intensity * 0.5);
                    color += starColor;
                }
            }
            gl_FragColor = vec4(color, 1.0);
        }`;
      
      function cs(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      
      const prog = gl.createProgram();
      gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      
      const pos = gl.getAttribLocation(prog, 'a_position');
      gl.enableVertexAttribArray(pos);
      gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
      
      const uTime = gl.getUniformLocation(prog, 'u_time');
      const uRes = gl.getUniformLocation(prog, 'u_resolution');
      const uIntensity = gl.getUniformLocation(prog, 'u_intensity');
      
      function render(t) {
        if (typeof ResizeObserver === 'undefined') syncSize();
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (uTime) gl.uniform1f(uTime, t * 0.001);
        if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
        
        // Decay typing intensity
        typingIntensity = Math.max(0.0, typingIntensity - 0.05);
        if (uIntensity) gl.uniform1f(uIntensity, typingIntensity);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render(0);
    })();
    </script>
