<style>
        /* Card Holofoil Effect */
        .card-container {
            perspective: 1000px;
        }
        .relic-card {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }
        .holofoil-overlay {
            background: linear-gradient(
                105deg,
                transparent 20%,
                rgba(255, 225, 109, 0.3) 25%,
                rgba(157, 92, 255, 0.3) 50%,
                transparent 55%
            );
            background-size: 200% 200%;
            mix-blend-mode: color-dodge;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .relic-card:hover .holofoil-overlay {
            opacity: 1;
            animation: holo-shimmer 3s infinite linear;
        }
        @keyframes holo-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Starfield Background */
        body {
            background-color: #08122d;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(157, 92, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 225, 109, 0.1) 0%, transparent 50%);
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        
        .glowing-btn {

<script>
        // Starfield Generation
        const starfield = document.getElementById('starfield');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starfield.appendChild(star);
        }

        // 3D Card Tilt Effect
        const cardContainer = document.getElementById('cardContainer');
        const relicCard = document.getElementById('relicCard');

        cardContainer.addEventListener('mousemove', (e) => {
            const rect = cardContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -15; // Max 15 deg tilt
            const rotateY = ((x - centerX) / centerX) * 15;
            
            relicCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
        });

        cardContainer.addEventListener('mouseleave', () => {
            relicCard.style.transform = 'rotateX(0) rotateY(0) scale3d(1, 1, 1)';
            relicCard.style.transition = 'transform 0.5s ease-out';
        });

        cardContainer.addEventListener('mouseenter', () => {
            relicCard.style.transition = 'transform 0.1s ease-out';
        });
    </script>
