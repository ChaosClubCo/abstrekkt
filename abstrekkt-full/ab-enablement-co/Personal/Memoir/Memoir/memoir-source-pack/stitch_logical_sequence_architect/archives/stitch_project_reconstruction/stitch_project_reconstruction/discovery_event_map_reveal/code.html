<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .mist-reveal {
            animation: clearMist 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes clearMist {
            0% { opacity: 1; transform: scale(1); filter: blur(0px); }
            50% { opacity: 0.8; transform: scale(1.1); filter: blur(10px); }
            100% { opacity: 0; transform: scale(1.2); filter: blur(20px); pointer-events: none; }
        }

        .golden-aura {
            box-shadow: 0 0 40px 10px rgba(225, 197, 84, 0.4);
            animation: pulseAura 3s infinite alternate;
        }

        @keyframes pulseAura {
            from { box-shadow: 0 0 30px 5px rgba(225, 197, 84, 0.3); }
            to { box-shadow: 0 0 60px 15px rgba(225, 197, 84, 0.6); }
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            animation: slideUp 1s ease-out 2.5s forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .twinkle {
            animation: twinkleAnim 4s infinite ease-in-out;
        }
        
        @keyframes twinkleAnim {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>

<script>
        // Simple script to add more random stars for ambient twinkle
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('main');
            for(let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'twinkle absolute rounded-full -z-10 pointer-events-none';
                
                // Random properties
                const size = Math.random() * 3 + 1 + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = (Math.random() * 5) + 's';
                
                // Colors
                const colors = ['bg-white', 'bg-star-yellow', 'bg-tertiary'];
                star.classList.add(colors[Math.floor(Math.random() * colors.length)]);
                
                container.appendChild(star);
            }
        });
    </script>
