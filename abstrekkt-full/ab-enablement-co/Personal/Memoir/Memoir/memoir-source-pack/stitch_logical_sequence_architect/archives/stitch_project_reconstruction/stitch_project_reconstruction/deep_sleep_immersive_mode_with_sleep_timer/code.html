<!DOCTYPE html>

                    "tertiary-fixed": "#ffd9df",

                    "secondary": "#d3fbff",
                    "on-secondary-fixed": "#002022",
                    "surface-dim": "#11131c",
                    "on-error-container": "#ffdad6",
                    "tertiary-container": "#ff4c83",
                    "on-secondary": "#00363a",
                    "outline": "#968da0",
                    "outline-variant": "#4b4454",
                    "surface": "#11131c",

                    "inverse-surface": "#e1e1ef",

                    "primary-fixed": "#ecdcff",
                    "tertiary-fixed-dim": "#ffb1c0",
                    "secondary-container": "#00eefc",
                    "surface-tint": "#d6baff",
                    "secondary-fixed": "#7df4ff",
                    "surface-variant": "#32343e",
                    "on-error": "#690005",
                    "surface-container-highest": "#32343e",
                    "primary-fixed-dim": "#d6baff",
                    "surface-bright": "#373943",

      }

<style>
        @keyframes slow-breathing {
            0%, 100% { transform: scale(0.9); opacity: 0.3; filter: blur(40px); }
            50% { transform: scale(1.1); opacity: 0.7; filter: blur(20px); }
        }

        @keyframes nebula-drift {
            0% { transform: translate(-5%, -5%) rotate(0deg); }
            50% { transform: translate(5%, 5%) rotate(5deg); }
            100% { transform: translate(-5%, -5%) rotate(0deg); }
        }

        @keyframes star-twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        .breathing-circle {
            animation: slow-breathing 8s ease-in-out infinite;
        }

        .nebula-bg {
            animation: nebula-drift 40s ease-in-out infinite;
            filter: blur(80px);
        }

        .glass-lens {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        body {
            background-color: #0c0e17;
            overflow: hidden;
        }
    </style>
</head>
<body class="text-on-surface font-body-md select-none">
<!-- THE SHADER LAYER: Nebula Starlight Background -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<!-- Deep Space Base -->
<div class="absolute inset-0 bg-surface-container-lowest"></div>
<!-- Animated Nebula (Purple/Blue Energy) -->
<!-- Golden Starlight (Static Grain/Twinkle) -->
<div class="absolute inset-0 opacity-30 mix-blend-screen" id="starfield"></div>
</div>
<!-- MAIN IMMERSIVE CANVAS -->
<main class="relative z-10 h-screen w-full flex flex-col items-center justify-center px-container-padding">
<!-- EXIT BUTTON (Low Opacity Utility) -->
<button class="fixed top-8 right-8 z-50 glass-lens px-4 py-2 rounded-full opacity-30 hover:opacity-100 transition-all duration-700 flex items-center gap-2 group">
<span class="material-symbols-outlined text-sm">close</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Exit Immersive Mode</span>
</button>
<!-- CENTERPIECE: BREATHING GUIDE -->
<div class="relative flex items-center justify-center w-full max-w-lg aspect-square">
<!-- Core Pulse -->
<div class="breathing-circle absolute w-64 h-64 md:w-96 md:h-96 rounded-full bg-primary/20 shadow-[0_0_120px_rgba(214,186,255,0.2)]"></div>
<!-- Secondary Optical Lens -->
<div class="absolute w-48 h-48 md:w-72 md:h-72 rounded-full border border-primary/20 backdrop-blur-3xl flex flex-col items-center justify-center text-center">
<span class="text-primary-fixed/60 font-label-sm text-label-sm tracking-[0.3em] uppercase" id="breathing-text">Inhale</span>
<div class="w-1 h-8 bg-gradient-to-b from-primary/40 to-transparent my-4"></div>
</div>
<!-- Peripheral Rings (Golden Glow) -->
<div class="absolute inset-0 border border-tertiary-fixed/5 rounded-full scale-110 opacity-20"></div>
<div class="absolute inset-0 border border-primary/5 rounded-full scale-125 opacity-10"></div>
</div>
<!-- TRACK INFO & TIME (Bottom Focus) -->
<div class="absolute bottom-12 left-0 w-full flex flex-col items-center space-y-6 justify-center">
<div class="text-center">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary-fixed/80 drop-shadow-2xl">
                    Deep Sleep - Delta Waves
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant/40 mt-2 tracking-widest uppercase">
                    Celestial Resonance Engine
                </p>
</div>
<!-- Time Indicator (Minimalist) -->
<div class="flex items-center gap-4 glass-lens px-6 py-3 rounded-full opacity-60 mb-4">
<span class="text-[10px] font-label-sm uppercase text-outline tracking-tighter">Set Timer</span>
<div class="flex gap-3">
<button class="text-label-sm font-label-sm text-primary-fixed/60 hover:text-primary-fixed transition-colors">15m</button>
<button class="text-label-sm font-label-sm text-primary-fixed/60 hover:text-primary-fixed transition-colors">30m</button>
<button class="text-label-sm font-label-sm text-primary-fixed/60 hover:text-primary-fixed transition-colors">45m</button>
<button class="text-label-sm font-label-sm text-primary-fixed/60 hover:text-primary-fixed transition-colors">60m</button>
</div>
</div><div class="flex items-center gap-8 glass-lens px-8 py-3 rounded-full opacity-60">
<div class="flex flex-col items-center">
<span class="text-[10px] font-label-sm uppercase text-outline tracking-tighter mb-1">Time Remaining</span>
<span class="font-label-sm text-label-sm text-primary-fixed tabular-nums" id="timer-display">42:18</span>
</div>
<div class="h-6 w-[1px] bg-outline-variant/30"></div>
<button class="group flex items-center justify-center p-2 rounded-full hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-primary-fixed text-2xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</div>
</div>
<!-- DECORATIVE ATMOSPHERIC OVERLAYS -->
<div class="pointer-events-none fixed inset-0 bg-gradient-to-t from-surface-container-lowest/80 via-transparent to-surface-container-lowest/40 mix-blend-multiply"></div>
</main>
<!-- MICRO-INTERACTIONS SCRIPT -->
<script>
        // Breathing Text Cycle
        const breathingText = document.getElementById('breathing-text');
        const phrases = ['Inhale', 'Hold', 'Exhale', 'Rest'];
        let currentIndex = 0;

        setInterval(() => {
            breathingText.style.opacity = '0';
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % phrases.length;
                breathingText.textContent = phrases[currentIndex];
                breathingText.style.opacity = '0.6';
            }, 1000);
        }, 4000);

        // Timer Simulation
        const timerDisplay = document.getElementById('timer-display');
        let seconds = 2538; // 42:18

        setInterval(() => {
            if (seconds > 0) {
                seconds--;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);

        // Star Generation
        const starfield = document.getElementById('starfield');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'absolute rounded-full bg-white';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.opacity = Math.random();
            star.style.boxShadow = `0 0 ${size * 2}px rgba(255, 255, 255, 0.5)`;
            star.style.animation = `star-twinkle ${Math.random() * 5 + 3}s infinite ease-in-out`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starfield.appendChild(star);
        }

        // Mouse Drift Effect for background
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.nebula-bg').style.transform = `translate(${moveX}px, ${moveY}px) scale(1.1)`;
        });
    </script>
</body></html>
