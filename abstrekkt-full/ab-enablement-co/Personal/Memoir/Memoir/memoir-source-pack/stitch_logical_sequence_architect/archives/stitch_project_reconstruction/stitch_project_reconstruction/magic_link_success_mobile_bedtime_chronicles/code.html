<style>
        body {
            background-color: #08122d;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .star-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #151e3a 0%, #08122d 100%);
        }

        .twinkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        .celestial-scroll {
            background: linear-gradient(180deg, rgba(21, 30, 58, 0.8) 0%, rgba(11, 19, 43, 0.9) 100%);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .success-glow {
            filter: drop-shadow(0 0 15px rgba(225, 197, 84, 0.6));
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(225, 197, 84, 0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 25px rgba(225, 197, 84, 0.8)); transform: scale(1.05); }
        }

        .gold-pill-button {
            background: linear-gradient(135deg, #ffe16e 0%, #e1c554 100%);
            box-shadow: 0 4px 15px rgba(225, 197, 84, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gold-pill-button:active {
            transform: scale(0.95);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="font-ui-main text-on-surface">
<!-- Star Field Background -->
<div class="star-field" id="stars"></div>
<!-- Main Content Canvas -->
<main class="min-h-screen flex flex-col items-center justify-center p-gutter">

<div class="relative w-32 h-32 flex items-center justify-center success-glow">
<!-- Golden Rings -->
<div class="absolute inset-0 border-2 border-secondary/30 rounded-full animate-[spin_10s_linear_infinite]"></div>
<div class="absolute inset-2 border border-secondary/20 rounded-full animate-[spin_6s_linear_infinite_reverse]"></div>
<!-- Central Icon -->
<div class="bg-secondary/10 w-24 h-24 rounded-full flex items-center justify-center backdrop-blur-md border border-secondary/40">
<span class="material-symbols-outlined text-[48px] text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Header Content -->
<div class="space-y-stack-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-secondary tracking-tight">Welcome Back</h1>
<p class="font-story-body text-story-body italic opacity-90">Magic Link accepted. Your library is ready.</p>
</div>
<!-- Voice Recognition Feature Highlight -->
<div class="w-full bg-surface-container-low/50 border border-white/5 rounded-xl p-stack-md flex items-center space-x-4">
<div class="bg-secondary-container/20 p-2 rounded-lg">
<span class="material-symbols-outlined text-secondary">mic</span>
</div>
<div class="text-left">
<p class="text-label-sm font-label-sm uppercase tracking-widest text-secondary/70">Authenticated Profile</p>
<p class="font-ui-main text-on-surface font-semibold">Mom's Voice Enabled</p>
</div>
</div>

</button>

<span class="material-symbols-outlined text-[12px]">star</span>
</div>
</div>

            You are currently signed in as nocturne.dreamer@example.com
        </p>
</main>
<!-- Success Feedback Overlay (Micro-interaction) -->
<div class="fixed inset-0 pointer-events-none z-50 overflow-hidden" id="confetti-container"></div>
<script>
        // Generate Twinkling Stars
        const starContainer = document.getElementById('stars');
        const starCount = 60;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'twinkle';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            star.style.animationDelay = `${Math.random() * 5}s`;
            starContainer.appendChild(star);
        }

        // Lightweight Confetti Burst on Load
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#ffe16e', '#e1c554', '#9d5cff', '#ffffff'];
            
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.width = '6px';
                p.style.height = '6px';
                p.style.borderRadius = '2px';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.top = '50%';
                p.style.opacity = '0';
                
                container.appendChild(p);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 150 + 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                    delay: Math.random() * 200
                });
            }
        });

        // Button Click Interactivity
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Mimic navigation feel
                btn.style.opacity = '0.7';
                setTimeout(() => btn.style.opacity = '1', 200);
            });
        });
    </script>
