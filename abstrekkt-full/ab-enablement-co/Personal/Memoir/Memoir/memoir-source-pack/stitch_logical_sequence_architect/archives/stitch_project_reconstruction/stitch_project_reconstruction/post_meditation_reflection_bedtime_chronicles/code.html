<style>
        /* Base styles */
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Celestial Background Effects */
        .bg-celestial {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, theme('colors.surface-container-high'), theme('colors.surface-dim') 80%);
            overflow: hidden;
        }

        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 50px 160px, theme('colors.star-yellow'), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, theme('colors.tertiary'), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s infinite linear;
            opacity: 0.6;
        }

        .nebula {
            position: absolute;
            width: 150vw;
            height: 150vh;
            top: -25vh;
            left: -25vw;
            background: radial-gradient(circle at 30% 30%, theme('colors.nebula-purple') 0%, transparent 40%),
                        radial-gradient(circle at 70% 60%, theme('colors.surface-container') 0%, transparent 50%);
            opacity: 0.15;
            filter: blur(60px);
            animation: drift 20s infinite alternate ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; transform: translateY(-10px); }
        }

        @keyframes drift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, 2%); }
        }

        /* The Celestial Scroll */
        .celestial-scroll {
            background: linear-gradient(180deg, theme('colors.scroll-gradient-start') 0%, theme('colors.scroll-gradient-end') 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: theme('colors.surface-glass');
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15); /* Top highlight */
        }

        /* Interactive Elements */
        .btn-primary {
            background: linear-gradient(135deg, theme('colors.secondary'), theme('colors.secondary-fixed-dim'));
            color: theme('colors.on-secondary');
            box-shadow: 0 0 15px rgba(225, 197, 84, 0.3);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(225, 197, 84, 0.5);
        }

        .btn-ghost {
            border: 1px solid theme('colors.secondary');
            color: theme('colors.secondary');
            background: transparent;
            transition: all 0.3s ease;
        }
        .btn-ghost:hover {
            background: rgba(225, 197, 84, 0.1);
        }

        /* Glowing Text Area */
        .journal-textarea {
            background: transparent;
            border: 1px solid theme('colors.secondary');
            color: theme('colors.on-surface');
            transition: all 0.3s ease;
        }
        .journal-textarea:focus {
            outline: none;
            background: rgba(225, 197, 84, 0.05);
            box-shadow: 0 0 20px rgba(225, 197, 84, 0.2);
            border-color: theme('colors.star-yellow');
        }
        .journal-textarea::placeholder {
            color: theme('colors.on-surface-variant');
            opacity: 0.6;
        }
    </style>
</head>
<body class="antialiased">
<!-- Background Elements -->
<div class="bg-celestial">
<div class="nebula"></div>
<div class="stars"></div>
</div>
<!-- Main Content Container -->
<main class="flex-grow flex items-center justify-center p-4 md:p-8 relative z-10 w-full h-full min-h-screen">
<!-- The Celestial Scroll (Main Canvas) -->
<div class="celestial-scroll w-full max-w-3xl rounded-3xl p-story-padding flex flex-col items-center text-center">
<!-- Icon/Graphic -->
<div class="mb-stack-lg">
<span class="material-symbols-outlined text-secondary" style="font-size: 64px; font-variation-settings: 'FILL' 0, 'wght' 200;">
                    auto_awesome
                </span>
</div>
<!-- Header Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-md">
                Reflect &amp; Journal
            </h1>
<p class="font-story-body text-story-body text-on-surface-variant italic mb-stack-lg max-w-xl">
                The Whispering Woods has left its peace with you. How do you feel?
            </p>
<!-- Journal Input Area -->
<div class="w-full mb-stack-lg">
<textarea class="journal-textarea w-full h-48 rounded-xl p-gutter font-story-body text-story-body resize-none" placeholder="Capture your thoughts, dreams, or simply the feeling of stillness..."></textarea>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-stack-md w-full justify-center">
<button class="btn-primary rounded-full px-8 py-3 font-ui-main text-ui-main flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 20px;">nightlight</span>
                    Finish for Tonight
                </button>
<button class="btn-ghost rounded-full px-8 py-3 font-ui-main text-ui-main flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 20px;">menu_book</span>
                    View Library
                </button>
</div>
</div>
</main>
</body></html>
