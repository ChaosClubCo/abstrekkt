<!doctype html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Writing Room",
  "schemaVersion": 1,
  "description": "Writing Room — a live writing dashboard for blog + memoir with Mem write-back. Reads drafts from Mem via list_notes; writes back to Mem: piece statuses sync to a machine-managed 'Writing Room/Status Index' note (newest-wins merge, optimistic-concurrency via note version — draft notes are never edited), excavation/drafting sessions log as 'Memoir/Sessions/…' notes with duration + word delta, and captured ideas can be saved as 'Memoir/Fragments/…' notes by lane. Can schedule writing sessions on Google Calendar and create gap-return tasks in Todoist (self-healing tool-name resolver). Tabs: Today (nudge + coldest piece + session controls), Library, Progress, Ideas, AI Studio. All writes are user-initiated with visible sync state; falls back to demo data / local-only persistence when connectors are unreachable.",
  "mcpTools": [
    "mcp__1bbb4a36-ad18-42c1-856a-9557daa302fa__list_notes",
    "mcp__1bbb4a36-ad18-42c1-856a-9557daa302fa__create_note",
    "mcp__1bbb4a36-ad18-42c1-856a-9557daa302fa__update_note",
    "mcp__1bbb4a36-ad18-42c1-856a-9557daa302fa__get_note",
    "mcp__8870b7e1-6709-4cd9-9490-6d6edf6031d6__create_event"
  ],
  "mcpServerNames": [
    "Mem",
    "Google Calendar"
  ]
}
</script>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Room</title>
<style>
:root{
  color-scheme: light;
  --bg:#faf7f2; --panel:#ffffff; --ink:#241f1a; --ink2:#5c5348; --line:#e7ded1;
  --accent:#8a5a2b; --accent2:#b07d46; --chip:#f1e9dc;
  --freelance:#2f6f5e; --personal:#7a4b8f; --intinc:#2c5d8a;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 6px 20px rgba(40,30,20,.05);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 22px 60px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;font-weight:700}
.sub{color:var(--ink2);font-size:13px;margin:2px 0 0}
.src{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#c9bda9;display:inline-block}
.dot.live{background:#2f6f5e}
.dot.demo{background:#c98a2b}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 18px;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;color:var(--ink2);font:inherit;font-weight:600;font-size:14px;padding:9px 13px;border-radius:9px 9px 0 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink2);margin-top:2px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
input[type=text]:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:0;border-color:var(--accent2)}
input.search{flex:1;min-width:180px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.proj{margin-bottom:22px}
.proj h3{display:flex;align-items:center;gap:9px;font-size:15px;margin:0 0 10px}
.count{color:var(--ink2);font-weight:500;font-size:13px}
.chip{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.chip.FREELANCE{background:#e4f0ec;color:var(--freelance)}
.chip.PERSONAL{background:#efe6f4;color:var(--personal)}
.chip.INTINC{background:#e2ecf5;color:var(--intinc)}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent2);transform:translateY(-1px)}
.card .t{font-weight:650;font-size:14.5px;margin:0 0 5px;line-height:1.3}
.card .snip{color:var(--ink2);font-size:13px;margin:0 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink2)}
.status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:capitalize}
.status.idea{background:#fbeecd;color:#8a5c14}
.status.draft{background:#f3e7d6;color:#7a5322}
.status.editing{background:#e2ecf5;color:var(--intinc)}
.status.done{background:#e4f0ec;color:var(--freelance)}
.empty{color:var(--ink2);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.bars .row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bars .lab{width:170px;font-size:13px;flex:none;color:var(--ink2);display:flex;gap:6px;align-items:center}
.bars .track{flex:1;height:12px;background:#f0e8db;border-radius:999px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent2)}
.bars .val{width:72px;text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.today-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:720px){.today-grid{grid-template-columns:1fr}}
.nudge{border-left:3px solid var(--accent2);padding:2px 0 2px 14px;margin:6px 0 2px}
.nudge .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:700}
.nudge .v{font-size:15px;margin-top:3px}
.muted{color:var(--ink2);font-size:13px}
label.fld{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
textarea{width:100%;min-height:90px;resize:vertical}
.ai-out{white-space:pre-wrap;background:#fbf8f2;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;min-height:40px;font-size:14px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(30,22,14,.38);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.overlay.show{display:flex}
.reader{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(20,14,8,.3)}
.reader-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.reader-head h2{font-size:19px;margin:0;line-height:1.25}
.reader-body{padding:18px 26px 30px;font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.72;color:#2b241d;white-space:pre-wrap;word-break:break-word}
.x{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer;line-height:1;flex:none}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.reader-status{display:flex;gap:6px;align-items:center;padding:10px 26px;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--ink2);margin-top:8px}
.banner{background:#fdf3e0;border:1px solid #e6d3a6;color:#7a5514;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:14px;display:none}
.banner.show{display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--accent2);border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
a.lnk{color:var(--accent);cursor:pointer}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#241f1a;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.sessionbar{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--accent2);border-radius:12px;box-shadow:0 8px 30px rgba(40,30,20,.18);padding:10px 14px;z-index:60;font-size:13px;max-width:340px}
.sessionbar .row1{display:flex;gap:10px;align-items:center}
.sessionbar .tmr{font-weight:700;font-variant-numeric:tabular-nums}
.sync{font-size:11.5px;color:var(--ink2)}
.sync.ok{color:var(--freelance)}
.sync.err{color:#a33b2e}
.sync.busy{color:var(--accent)}
.miniform{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.miniform .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
input[type=date],input[type=time]{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Writing Room</h1>
      <p class="sub">Browse &amp; search drafts · track progress · capture ideas · daily nudge · AI generate / brainstorm / gap-fill</p>
    </div>
    <div class="src"><span class="dot" id="srcDot"></span><span id="srcTxt">connecting to Mem…</span><span class="sync" id="syncTxt"></span></div>
  </header>

  <div class="banner" id="banner"></div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="library">Library</button>
    <button class="tab" data-tab="progress">Progress</button>
    <button class="tab" data-tab="ideas">Ideas</button>
    <button class="tab" data-tab="studio">AI Studio</button>
  </nav>

  <section id="view"></section>
</div>

<div class="toast" id="toast"></div>
<div id="sessWrap"></div>

<div class="overlay" id="overlay">
  <div class="reader">
    <div class="reader-head">
      <div>
        <h2 id="rTitle"></h2>
        <div class="pill-row" id="rPills"></div>
      </div>
      <button class="x" id="rClose" aria-label="Close">×</button>
    </div>
    <div class="reader-status" id="rStatusBar"></div>
    <div class="reader-body" id="rBody"></div>
  </div>
</div>

<script>
"use strict";
var MEM_ID="1bbb4a36-ad18-42c1-856a-9557daa302fa";
var GCAL_ID="8870b7e1-6709-4cd9-9490-6d6edf6031d6";
var TODOIST_ID="89fab6f0-2572-46a8-b41a-c6e1f2f22b3f";
var LIST_NOTES = "mcp__"+MEM_ID+"__list_notes";
var TOOLS={
  createNote:"mcp__"+MEM_ID+"__create_note",
  updateNote:"mcp__"+MEM_ID+"__update_note",
  getNote:"mcp__"+MEM_ID+"__get_note",
  calCreate:"mcp__"+GCAL_ID+"__create_event"
};
/* Todoist hosted MCP doesn't publish tool names — resolver tries candidates once, caches the winner */
var TODOIST_CANDIDATES=["add-tasks","addTasks","add_task","create_task","add-task"];
var IDX_TITLE="Writing Room/Status Index";
var FRAG_PREFIX={PERSONAL:"Memoir/Fragments/",FREELANCE:"Blog/Fragments/",INTINC:"Newsletter/Fragments/","":"Inbox/Fragments/"};

var LS = {
  get:function(k,d){ try{ var v=localStorage.getItem("wr."+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set:function(k,v){ try{ localStorage.setItem("wr."+k, JSON.stringify(v)); }catch(e){} }
};

var STATE = {
  notes: [], live:false, tab:"today", openId:null, indexId:null,
  filter:{ project:"all", status:"all", q:"", sort:"updated" }
};
var TODAY = { memoir:"", blog:"" };

/* helpers */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function el(id){ return document.getElementById(id); }
function daysAgo(iso){ if(!iso) return 999; return (Date.now()-new Date(iso).getTime())/86400000; }
function fmtDate(iso){ if(!iso) return ""; try{ return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }catch(e){ return ""; } }
function wordCount(s){ if(!s) return 0; var m=String(s).trim().match(/\S+/g); return m?m.length:0; }
function noteText(n){ return n.content || n.snippet || ""; }
function noteById(id){ for(var i=0;i<STATE.notes.length;i++){ if(STATE.notes[i].id===id) return STATE.notes[i]; } return null; }

function projectOf(title){
  var t=(title||"").trim();
  if(!t) return "Unfiled";
  if(t.indexOf("/")>-1) return t.split("/")[0].trim() || "Unfiled";
  if(/^chapter\s+\d+/i.test(t)) return "Book";
  return "Unfiled";
}
function laneOf(project){
  var s=(project||"").toLowerCase();
  if(s.indexOf("blog")>-1 || s.indexOf("flashfusion")>-1) return "FREELANCE";
  if(s.indexOf("memoir")>-1 || s.indexOf("tax the damage")>-1) return "PERSONAL";
  if(s.indexOf("newsletter")>-1 || s.indexOf("prompt")>-1 || s.indexOf("int")===0) return "INTINC";
  return null;
}
function shortTitle(title){
  var t=(title||"Untitled").trim();
  if(t.indexOf("/")>-1){ var p=t.split("/"); return p[p.length-1].trim()||t; }
  return t;
}
function defaultStatus(n){
  var t=(n.title||"").toLowerCase();
  if(t.indexOf("/sessions/")>-1) return "done";
  if(/eod|daily|pulse|audit|research|standup/.test(t)) return "editing";
  return "draft";
}
/* status v2: {id:{s:status,t:isoTimestamp}} — timestamps enable newest-wins merge with the Mem status index */
function statusMap(){
  var v2=LS.get("status2",null);
  if(v2) return v2;
  var old=LS.get("status",{}); v2={};
  Object.keys(old).forEach(function(k){ v2[k]={s:old[k],t:"1970-01-01T00:00:00.000Z"}; });
  LS.set("status2",v2); return v2;
}
function statusOf(n){ var m=statusMap(); return (m[n.id]&&m[n.id].s) || defaultStatus(n); }
function setStatus(id,v){
  var m=statusMap(); m[id]={s:v,t:new Date().toISOString()}; LS.set("status2",m);
  queueStatusSync();
  render(); if(STATE.openId===id){ var n=noteById(id); if(n) openReader(n); }
}

/* MCP */
async function callTool(name,args){
  var r=await window.cowork.callMcpTool(name,args);
  if(r && r.isError){
    var msg="tool_error";
    try{ if(r.content && r.content[0] && r.content[0].text) msg=String(r.content[0].text).slice(0,300); }catch(e2){}
    throw new Error(msg);
  }
  var d=r && r.structuredContent;
  if(!d && r && r.content && r.content[0] && r.content[0].text){ try{ d=JSON.parse(r.content[0].text); }catch(e){ d=null; } }
  return d||{};
}
async function loadNotes(){
  var all=[], page=null, guard=0;
  do{
    var d=await callTool(LIST_NOTES,{limit:100,include_note_content:true,order_by:"updated_at",page:page});
    (d.results||[]).forEach(function(n){ all.push(n); });
    page=d.next_page||null; guard++;
  }while(page && guard<12);
  return all;
}

/* ---------- write-back layer ---------- */
var toastT=null;
function toast(msg){ var t=el("toast"); if(!t) return; t.textContent=msg; t.classList.add("show"); if(toastT) clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},2800); }

var SYNC={timer:null,state:"idle"};
function setSync(state,detail){
  SYNC.state=state;
  var e=el("syncTxt"); if(!e) return;
  var map={idle:["",""],pending:["busy","· status: pending…"],syncing:["busy","· status: syncing…"],synced:["ok","· status synced ✓"],local:["","· status: local only"],error:["err","· status sync failed"]};
  var m=map[state]||map.idle;
  e.className="sync "+m[0]; e.textContent=m[1];
  if(state==="error" && detail){ e.title=detail; } else { e.title=""; }
}
function queueStatusSync(){
  if(SYNC.timer) clearTimeout(SYNC.timer);
  setSync("pending");
  SYNC.timer=setTimeout(function(){ syncStatusIndex(); },1500);
}
function buildIndexContent(map){
  return "# "+IDX_TITLE+"\n\nMachine-managed by the Writing Room artifact — piece statuses. Manual edits will be overwritten.\n\n```json\n"
    +JSON.stringify({v:2,updatedAt:new Date().toISOString(),status:map})+"\n```\n";
}
function parseIndexContent(txt){
  var m=/```json\s*([\s\S]*?)```/.exec(txt||""); if(!m) return null;
  try{ var d=JSON.parse(m[1]); return (d && d.status)?d:null; }catch(e){ return null; }
}
function mergeStatusFromIndex(remote){
  var local=statusMap(), changed=false;
  Object.keys(remote.status||{}).forEach(function(id){
    var r=remote.status[id], l=local[id];
    if(r && r.s && (!l || new Date(r.t||0)>new Date(l.t||0))){ local[id]=r; changed=true; }
  });
  if(changed) LS.set("status2",local);
  return changed;
}
/* arg-name fallback: hosted MCP schemas differ on note_id vs id */
async function memGetNote(id){
  try{ return await callTool(TOOLS.getNote,{note_id:id}); }
  catch(e){ return await callTool(TOOLS.getNote,{id:id}); }
}
async function memUpdateNote(id,content,version){
  try{ return await callTool(TOOLS.updateNote,{note_id:id,content:content,version:version}); }
  catch(e){ return await callTool(TOOLS.updateNote,{id:id,content:content,version:version}); }
}
function extractNoteId(res){
  if(!res) return null;
  return res.id || res.note_id || (res.note&&res.note.id) || (res.result&&res.result.id) || null;
}
function extractVersion(res){
  if(res==null) return null;
  if(res.version!=null) return res.version;
  if(res.note && res.note.version!=null) return res.note.version;
  return null;
}
async function syncStatusIndex(){
  if(!STATE.live){ setSync("local"); return; }
  setSync("syncing");
  var content=buildIndexContent(statusMap());
  try{
    if(STATE.indexId){
      var attempt=async function(){
        var g=await memGetNote(STATE.indexId);
        await memUpdateNote(STATE.indexId,content,extractVersion(g));
      };
      try{ await attempt(); }
      catch(e){ await attempt(); } /* one retry — covers version-conflict races */
    }else{
      var made=await callTool(TOOLS.createNote,{content:content});
      STATE.indexId=extractNoteId(made);
      if(STATE.indexId) LS.set("idxNote",STATE.indexId);
    }
    setSync("synced");
  }catch(e){
    setSync("error", e&&e.message?e.message:String(e));
    toast("Status sync to Mem failed — kept locally. It retries on your next status change.");
  }
}
async function memCreateNote(content){
  var made=await callTool(TOOLS.createNote,{content:content});
  return extractNoteId(made);
}
function fragTitle(text,lane){
  var slug=(text||"").trim().replace(/\s+/g," ").slice(0,48);
  return (FRAG_PREFIX[lane||""]||FRAG_PREFIX[""])+slug;
}
function fragContent(text,lane){
  return "# "+fragTitle(text,lane)+"\n\n"+(text||"").trim()+"\n\n— captured in Writing Room, "+new Date().toLocaleDateString()+"\n";
}
async function todoistCreateTask(content,dueString){
  var cached=LS.get("tdTool",null);
  var cands=cached?[cached].concat(TODOIST_CANDIDATES.filter(function(c){return c!==cached;})):TODOIST_CANDIDATES.slice();
  var lastErr=null;
  for(var i=0;i<cands.length;i++){
    var name="mcp__"+TODOIST_ID+"__"+cands[i];
    var argsets=/s$/.test(cands[i])
      ? [{tasks:[{content:content,dueString:dueString}]},{tasks:[{content:content,due_string:dueString}]}]
      : [{content:content,due_string:dueString},{content:content,dueString:dueString}];
    for(var j=0;j<argsets.length;j++){
      try{ var r=await callTool(name,argsets[j]); LS.set("tdTool",cands[i]); return r; }
      catch(e){ lastErr=e; }
    }
  }
  throw new Error("No Todoist task tool matched ("+(lastErr&&lastErr.message?lastErr.message.slice(0,120):"no detail")+"). Check the Todoist grant on this artifact.");
}
function localDateStr(d){ var p=function(n){return (n<10?"0":"")+n;}; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function naiveISO(d){ var p=function(n){return (n<10?"0":"")+n;}; return localDateStr(d)+"T"+p(d.getHours())+":"+p(d.getMinutes())+":00"; }

/* ---------- session engine ---------- */
var SESS_TICK=null;
function activeSession(){ return LS.get("session",null); }
function memoirWords(){
  return STATE.notes.filter(function(n){
    var t=(n.title||"").toLowerCase();
    if(t.indexOf("/sessions/")>-1) return false;
    var p=projectOf(n.title).toLowerCase();
    return p.indexOf("memoir")>-1 || p.indexOf("tax the damage")>-1;
  }).reduce(function(a,n){return a+wordCount(noteText(n));},0);
}
function startSession(type){
  if(activeSession()){ toast("A session is already running — end it first."); return; }
  LS.set("session",{type:type,startedAt:new Date().toISOString(),baseWords:memoirWords()});
  renderSessionBar();
  toast((type==="excavation"?"Excavation":"Drafting")+" session started. Go.");
  if(STATE.tab==="today") render();
}
function fmtDur(ms){ var m=Math.max(1,Math.round(ms/60000)); return m>=60 ? Math.floor(m/60)+"h "+(m%60)+"m" : m+" min"; }
function renderSessionBar(){
  var w=el("sessWrap"); if(!w) return;
  var s=activeSession();
  if(SESS_TICK){ clearInterval(SESS_TICK); SESS_TICK=null; }
  if(!s){ w.innerHTML=""; return; }
  w.innerHTML='<div class="sessionbar" id="sb"><div class="row1">'
    +'<span>✍️ '+esc(s.type)+' · <span class="tmr" id="sbTmr">…</span></span>'
    +'<button class="btn" id="sbEnd">End</button></div><div id="sbForm"></div></div>';
  var tick=function(){ var t=el("sbTmr"); if(t) t.textContent=fmtDur(Date.now()-new Date(s.startedAt).getTime()); };
  tick(); SESS_TICK=setInterval(tick,30000);
  el("sbEnd").addEventListener("click", showEndForm);
}
function showEndForm(){
  var f=el("sbForm"); if(!f) return;
  f.innerHTML='<div class="miniform"><label class="fld">What surfaced? (goes in the session log)</label>'
    +'<textarea id="sbNotes" style="min-height:64px" placeholder="A scene, a line, a dead end worth remembering…"></textarea>'
    +'<div class="frow"><button class="btn primary" id="sbLog">Log to Mem &amp; end</button>'
    +'<button class="btn" id="sbDiscard">Discard session</button></div></div>';
  el("sbDiscard").addEventListener("click", function(){ LS.set("session",null); renderSessionBar(); if(STATE.tab==="today") render(); });
  el("sbLog").addEventListener("click", endSessionAndLog);
}
function sessionNoteContent(s,mins,delta,before,after,notes){
  var d=new Date(s.startedAt);
  var typeCap=s.type.charAt(0).toUpperCase()+s.type.slice(1);
  return "# Memoir/Sessions/"+localDateStr(d)+" — "+typeCap+"\n\n"
    +"- Type: "+s.type+"\n"
    +"- Started: "+d.toLocaleString()+"\n"
    +"- Duration: "+mins+"\n"
    +"- Word delta: "+(delta==null?"unknown (Mem unreachable at session end)":((delta>=0?"+":"")+delta+" (memoir total "+before.toLocaleString()+" → "+after.toLocaleString()+")"))+"\n\n"
    +"What surfaced:\n\n"+((notes||"").trim()||"—")+"\n";
}
async function endSessionAndLog(){
  var s=activeSession(); if(!s) return;
  var btn=el("sbLog"); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span> logging…'; }
  var notes=(el("sbNotes")&&el("sbNotes").value)||"";
  var mins=fmtDur(Date.now()-new Date(s.startedAt).getTime());
  var delta=null, after=s.baseWords;
  if(STATE.live){
    try{ STATE.notes=await loadNotes().then(splitIndexNote); after=memoirWords(); delta=after-s.baseWords; }
    catch(e){ delta=null; }
  }
  var content=sessionNoteContent(s,mins,delta,s.baseWords,after,notes);
  try{
    if(!STATE.live) throw new Error("Mem unreachable (demo mode)");
    await memCreateNote(content);
    toast("Session logged to Mem · "+mins+(delta!=null?" · "+(delta>=0?"+":"")+delta+" words":""));
  }catch(e){
    var pend=LS.get("pendingSessions",[]); pend.push(content); LS.set("pendingSessions",pend);
    toast("Couldn't reach Mem — session saved locally, will retry next load.");
  }
  LS.set("session",null);
  renderSessionBar(); render();
}
async function flushPendingSessions(){
  var pend=LS.get("pendingSessions",[]); if(!pend.length||!STATE.live) return;
  var still=[];
  for(var i=0;i<pend.length;i++){
    try{ await memCreateNote(pend[i]); }catch(e){ still.push(pend[i]); }
  }
  LS.set("pendingSessions",still);
  if(pend.length!==still.length) toast((pend.length-still.length)+" queued session log(s) flushed to Mem.");
}
function splitIndexNote(notes){
  var idx=null;
  var rest=notes.filter(function(n){ if((n.title||"").trim()===IDX_TITLE){ idx=n; return false; } return true; });
  if(idx){
    STATE.indexId=idx.id||STATE.indexId;
    if(STATE.indexId) LS.set("idxNote",STATE.indexId);
    var parsed=parseIndexContent(noteText(idx));
    if(parsed) mergeStatusFromIndex(parsed);
  }else{
    STATE.indexId=LS.get("idxNote",null);
  }
  return rest;
}
function coldestMemoir(){
  var l=STATE.notes.filter(function(n){
    var t=(n.title||"").toLowerCase();
    if(t.indexOf("/sessions/")>-1) return false;
    var p=projectOf(n.title).toLowerCase();
    if(p.indexOf("memoir")<0 && p.indexOf("tax the damage")<0) return false;
    var s=statusOf(n); return s==="draft"||s==="editing"||s==="idea";
  }).sort(function(a,b){ return daysAgo(b.updated_at)-daysAgo(a.updated_at); });
  return l[0]||null;
}

/* AI */
async function ai(prompt,data){
  try{
    var out=await window.cowork.askClaude(prompt, data||[]);
    if(out==null) return "";
    if(typeof out==="string") return out;
    return out.text||out.content||out.result||JSON.stringify(out);
  }catch(e){ return "AI error: "+(e && e.message ? e.message : e); }
}
function contextForProject(project,limit){
  return STATE.notes.filter(function(n){ return projectOf(n.title)===project; })
    .slice(0,limit||6)
    .map(function(n){ return { title:shortTitle(n.title), text:noteText(n).slice(0,1500) }; });
}

/* derived */
function projects(){
  var map={};
  STATE.notes.forEach(function(n){
    var p=projectOf(n.title);
    if(!map[p]) map[p]={name:p,lane:laneOf(p),notes:[],words:0};
    map[p].notes.push(n); map[p].words+=wordCount(noteText(n));
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){ return b.notes.length-a.notes.length; });
}
function filteredNotes(){
  var f=STATE.filter, q=f.q.toLowerCase();
  var list=STATE.notes.filter(function(n){
    if(f.project!=="all" && projectOf(n.title)!==f.project) return false;
    if(f.status!=="all" && statusOf(n)!==f.status) return false;
    if(q){ if(((n.title||"")+" "+noteText(n)).toLowerCase().indexOf(q)<0) return false; }
    return true;
  });
  list.sort(function(a,b){
    if(f.sort==="title") return shortTitle(a.title).localeCompare(shortTitle(b.title));
    if(f.sort==="words") return wordCount(noteText(b))-wordCount(noteText(a));
    if(f.sort==="created") return new Date(b.created_at)-new Date(a.created_at);
    return new Date(b.updated_at)-new Date(a.updated_at);
  });
  return list;
}

/* reader */
function openReader(n){
  STATE.openId=n.id;
  el("rTitle").textContent=shortTitle(n.title);
  var lane=laneOf(projectOf(n.title)), pills="";
  pills+='<span class="chip '+(lane||"")+'">'+esc(projectOf(n.title))+'</span>';
  if(lane) pills+='<span class="chip '+lane+'">'+lane+'</span>';
  pills+='<span class="muted">'+wordCount(noteText(n))+' words · updated '+fmtDate(n.updated_at)+'</span>';
  el("rPills").innerHTML=pills;
  var cur=statusOf(n);
  el("rStatusBar").innerHTML='<span class="muted">Status:</span> '+["idea","draft","editing","done"].map(function(s){
    return '<button class="btn'+(s===cur?" primary":"")+'" data-set="'+s+'" style="padding:5px 10px">'+s+'</button>';
  }).join(" ");
  el("rStatusBar").querySelectorAll("[data-set]").forEach(function(b){
    b.addEventListener("click", function(){ setStatus(n.id, b.getAttribute("data-set")); });
  });
  el("rBody").textContent=(noteText(n)||"(No content stored for this note.)");
  el("overlay").classList.add("show");
}
function closeReader(){ el("overlay").classList.remove("show"); STATE.openId=null; }

/* card */
function cardHTML(n){
  var st=statusOf(n);
  return '<div class="card" data-id="'+esc(n.id)+'">'
    +'<p class="t">'+esc(shortTitle(n.title))+'</p>'
    +'<p class="snip">'+esc(n.snippet||noteText(n).slice(0,140)||"—")+'</p>'
    +'<div class="meta"><span class="status '+st+'">'+st+'</span>'
    +'<span>'+wordCount(noteText(n))+' w · '+fmtDate(n.updated_at)+'</span></div></div>';
}

/* views */
function viewLibrary(){
  var projs=projects();
  var opts='<option value="all">All projects</option>'+projs.map(function(p){
    return '<option value="'+esc(p.name)+'"'+(STATE.filter.project===p.name?" selected":"")+'>'+esc(p.name)+' ('+p.notes.length+')</option>';
  }).join("");
  var statusOpts=["all","idea","draft","editing","done"].map(function(s){
    return '<option value="'+s+'"'+(STATE.filter.status===s?" selected":"")+'>'+(s==="all"?"All statuses":s.charAt(0).toUpperCase()+s.slice(1))+'</option>';
  }).join("");
  var sortOpts=[["updated","Recently updated"],["created","Newest"],["title","Title A–Z"],["words","Longest"]].map(function(o){
    return '<option value="'+o[0]+'"'+(STATE.filter.sort===o[0]?" selected":"")+'>'+o[1]+'</option>';
  }).join("");

  var list=filteredNotes(), body;
  if(!list.length){ body='<div class="empty">No pieces match. Clear the search, or add drafts to Mem — they appear here on Reload.</div>'; }
  else{
    var groups={};
    list.forEach(function(n){ var p=projectOf(n.title); (groups[p]=groups[p]||[]).push(n); });
    body=Object.keys(groups).map(function(p){
      var lane=laneOf(p);
      var w=groups[p].reduce(function(a,n){return a+wordCount(noteText(n));},0);
      return '<div class="proj"><h3>'+esc(p)+(lane?' <span class="chip '+lane+'">'+lane+'</span>':'')
        +' <span class="count">'+groups[p].length+' pc · '+w.toLocaleString()+' w</span></h3>'
        +'<div class="cards">'+groups[p].map(cardHTML).join("")+'</div></div>';
    }).join("");
  }
  return '<div class="panel"><div class="controls">'
    +'<input type="text" class="search" id="q" placeholder="Search titles &amp; text…" value="'+esc(STATE.filter.q)+'">'
    +'<select id="fProject">'+opts+'</select><select id="fStatus">'+statusOpts+'</select><select id="fSort">'+sortOpts+'</select>'
    +'</div>'+body+'</div>';
}

function viewProgress(){
  var projs=projects();
  var totalW=projs.reduce(function(a,p){return a+p.words;},0);
  var recent=STATE.notes.filter(function(n){return daysAgo(n.updated_at)<=7;}).length;
  var stalled=STATE.notes.filter(function(n){ var s=statusOf(n); return (s==="draft"||s==="editing") && daysAgo(n.updated_at)>14; }).length;
  var stat=''
    +'<div class="stat"><div class="n">'+STATE.notes.length+'</div><div class="l">pieces</div></div>'
    +'<div class="stat"><div class="n">'+totalW.toLocaleString()+'</div><div class="l">words tracked</div></div>'
    +'<div class="stat"><div class="n">'+recent+'</div><div class="l">touched this week</div></div>'
    +'<div class="stat"><div class="n">'+stalled+'</div><div class="l">stalled &gt;14d</div></div>';
  var maxW=Math.max.apply(null,[1].concat(projs.map(function(p){return p.words;})));
  var bars=projs.map(function(p){
    var pct=Math.round(p.words/maxW*100);
    return '<div class="row"><div class="lab">'+esc(p.name)+(p.lane?' <span class="chip '+p.lane+'">'+p.lane+'</span>':'')+'</div>'
      +'<div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="val">'+p.words.toLocaleString()+' w</div></div>';
  }).join("");
  var sc={idea:0,draft:0,editing:0,done:0};
  STATE.notes.forEach(function(n){ sc[statusOf(n)]=(sc[statusOf(n)]||0)+1; });
  var pipe=["idea","draft","editing","done"].map(function(s){ return '<span class="status '+s+'">'+s+' · '+sc[s]+'</span>'; }).join(" ");
  return '<div class="grid stats" style="margin-bottom:16px">'+stat+'</div>'
    +'<div class="panel"><h3 style="margin:2px 0 10px">Volume by project</h3><div class="bars">'
    +(bars||'<div class="muted">No pieces yet.</div>')+'</div>'
    +'<h3 style="margin:20px 0 8px">Pipeline</h3><div class="pill-row">'+pipe+'</div>'
    +'<p class="note">Set a piece’s status from its reader view. Statuses sync to a machine-managed “Writing Room/Status Index” note in Mem (newest-wins across devices), with a local cache when Mem is unreachable. Draft notes themselves are never edited.</p></div>';
}

    .sort(function(a,b){ return daysAgo(b.updated_at)-daysAgo(a.updated_at); });
  var pick=stalledList[0];
  var pickHTML = pick
    ? '<div class="card" data-id="'+esc(pick.id)+'"><p class="t">'+esc(shortTitle(pick.title))+'</p>'
        +'<p class="snip">'+esc(pick.snippet||"")+'</p><div class="meta"><span class="status '+statusOf(pick)+'">'+statusOf(pick)+'</span>'
        +'<span>untouched '+Math.round(daysAgo(pick.updated_at))+'d · '+wordCount(noteText(pick))+' w</span></div></div>'
    : '<div class="empty">Nothing in draft/editing right now. Start something in AI Studio.</div>';
  var seed=Number(new Date().toISOString().slice(0,10).replace(/-/g,""));

    "Describe one physical object from the year everything changed. Don't explain why it matters yet — just the object.",
    "What did you build with your hands during the hardest stretch? Start with the materials.",
    "Write the moment you first noticed you were constructing a self, not recovering an old one.",
    "Name a room. Put yourself in it at your worst. What was on the walls?",
    "What's a sentence a doctor said that you still hear? Begin there.",
    "Write about a table — the literal surface where the work happened.",
    "What did competence feel like before, and what does it feel like now?"
  ];
  var blogQ=[
    "What did you figure out this week that a reader would pay to skip the pain of learning?",
    "Take your last strong opinion and write the one-line version that would start an argument.",
    "What tool or workflow saved you an hour recently? Teach the 3-step version.",
    "Describe a mistake you made that others are about to make.",
    "What's obvious to you now that was invisible six months ago?",
    "Turn your most-used prompt into a short 'here's the pattern' post.",
    "What did a colleague ask that everyone is secretly wondering?"

  TODAY.memoir=memoirQ[seed%memoirQ.length];
  TODAY.blog=blogQ[(seed>>1)%blogQ.length];
  return '<div class="today-grid">'
    +'<div class="panel"><h3 style="margin:2px 0 8px">Pick this up today</h3>'
    +'<p class="muted" style="margin:0 0 12px">The piece that’s gone coldest while still open.</p>'+pickHTML+'</div>'
    +'<div class="panel"><h3 style="margin:2px 0 10px">Break the blank page</h3>'
    +'<div class="nudge"><div class="k">Memoir · excavation</div><div class="v">'+esc(TODAY.memoir)+'</div></div>'
    +'<div class="nudge" style="margin-top:14px"><div class="k">Blog · angle</div><div class="v">'+esc(TODAY.blog)+'</div></div>'
    +'<div class="row-actions"><button class="btn" id="toStudioMemoir">Draft the memoir one →</button>'
    +'<button class="btn" id="toStudioBlog">Draft the blog one →</button></div></div>'
    +'<div class="panel" style="grid-column:1/-1"><h3 style="margin:2px 0 8px">Memoir session &amp; scheduling</h3>'
    +(activeSession()

      : '<div class="row-actions" style="margin-top:2px"><button class="btn primary" id="sessExc">Start excavation session</button>'
        +'<button class="btn primary" id="sessDraft">Start drafting session</button></div>')
    +'<div class="row-actions"><button class="btn" id="schedBtn">Schedule next session →</button>'
    +'<button class="btn" id="gapBtn">Create gap-return task →</button></div>'

}

/* render */
function render(){
  var v=el("view");
  if(STATE.tab==="today") v.innerHTML=viewToday();
  else if(STATE.tab==="library") v.innerHTML=viewLibrary();
  else if(STATE.tab==="progress") v.innerHTML=viewProgress();
  else if(STATE.tab==="ideas") v.innerHTML=viewIdeas();

/* studio */
var STUDIO={mode:"brainstorm",lastOut:"",seed:""};
function mountStudio(mode){
  STUDIO.mode=mode;
  var box=el("modeBox");
  document.querySelectorAll("[data-mode]").forEach(function(b){ b.classList.toggle("primary", b.getAttribute("data-mode")===mode); });
  if(mode==="brainstorm"){
    box.innerHTML='<label class="fld">Topic or theme</label>'
      +'<input type="text" class="search" id="sTopic" style="width:100%" placeholder="e.g. what nobody tells you about shipping AI internally" value="'+esc(STUDIO.seed)+'">'
      +'<label class="fld">Draw context from project (optional)</label><select id="sProj" style="width:100%">'+(window.__projOpts||"")+'</select>'
      +'<div class="row-actions"><button class="btn primary" id="sRun">Brainstorm angles</button></div>';
  }else if(mode==="draft"){
    box.innerHTML='<label class="fld">What should the draft be about?</label>'
      +'<textarea id="sTopic" placeholder="One or two sentences on the piece you want drafted…">'+esc(STUDIO.seed)+'</textarea>'
      +'<label class="fld">Match the voice of project (optional)</label><select id="sProj" style="width:100%">'+(window.__projOpts||"")+'</select>'
      +'<div class="row-actions"><button class="btn primary" id="sRun">Generate draft</button></div>';
  }else{
    box.innerHTML='<label class="fld">Piece to gap-fill</label><select id="sPiece" style="width:100%">'+(window.__pieceOpts||"")+'</select>'
      +'<label class="fld">Or paste a draft</label><textarea id="sPaste" placeholder="Paste text here to find gaps &amp; get fill suggestions…"></textarea>'
      +'<div class="row-actions"><button class="btn primary" id="sRun">Find gaps &amp; suggest</button></div>';
  }
  STUDIO.seed="";
  el("sRun").addEventListener("click", runStudio);
}
async function runStudio(){
  var out=el("aiOut"), acts=el("aiActions");
  out.classList.remove("hidden"); out.innerHTML='<span class="spinner"></span> thinking…';
  var prompt, data=[];
  if(STUDIO.mode==="brainstorm"){
    var topic=(el("sTopic").value||"").trim(); var proj=el("sProj").value;
    if(!topic){ out.textContent="Give me a topic first."; return; }
    if(proj) data=contextForProject(proj,5);
    prompt="You are a writing partner. Brainstorm 6 sharp, non-generic angles for a piece on: \""+topic+"\". "
      +(proj?"Match the voice and concerns of the sample writing provided. ":"")
      +"For each angle give a one-line hook and a 1-sentence why-it-lands. Number them. Be specific, avoid clichés.";
  }else if(STUDIO.mode==="draft"){
    var t=(el("sTopic").value||"").trim(); var pr=el("sProj").value;
    if(!t){ out.textContent="Tell me what to draft first."; return; }
    if(pr) data=contextForProject(pr,5);
    prompt="Write a focused first draft (~350–500 words) for: \""+t+"\". "
      +(pr?"Closely match the tone, rhythm, and vocabulary of the sample writing provided — this is the author's own voice. ":"")
      +"No preamble, no headings unless natural. Start strong. It's a draft, so favor momentum over polish.";
  }else{
    var pasted=(el("sPaste").value||"").trim(); var pieceId=el("sPiece").value; var base=pasted;
    if(!base && pieceId){ var n=noteById(pieceId); base=n?noteText(n):""; }
    if(!base){ out.textContent="Pick a piece or paste a draft first."; return; }
    data=[{title:"draft",text:base.slice(0,6000)}];
    prompt="Analyze the provided draft. Return: (1) the 3–5 most important GAPS — missing evidence, unearned claims, weak transitions, unanswered questions; then (2) for each gap, a concrete 1–2 sentence suggestion or a sample sentence to fill it. Be direct and specific to THIS text. Don't rewrite the whole thing.";
  }
  var res=await ai(prompt,data);
  STUDIO.lastOut=res; out.textContent=res; acts.classList.remove("hidden");
}

/* wiring */
function wireView(){
  el("view").querySelectorAll(".card[data-id]").forEach(function(c){
    c.addEventListener("click", function(){ var n=noteById(c.getAttribute("data-id")); if(n) openReader(n); });
  });
  if(STATE.tab==="library"){
    var q=el("q");
    if(q) q.addEventListener("input", function(){ STATE.filter.q=q.value; LS.set("filter",STATE.filter);
      var pos=q.selectionStart; render(); var nq=el("q"); if(nq){ nq.focus(); try{nq.setSelectionRange(pos,pos);}catch(e){} } });
    ["fProject","fStatus","fSort"].forEach(function(id){
      var s=el(id); if(!s) return;
      s.addEventListener("change", function(){
        if(id==="fProject") STATE.filter.project=s.value;
        if(id==="fStatus") STATE.filter.status=s.value;
        if(id==="fSort") STATE.filter.sort=s.value;
        LS.set("filter",STATE.filter); render();
      });
    });
  }
  if(STATE.tab==="ideas"){
    var add=el("addIdea");
    if(add) add.addEventListener("click", function(){
      var txt=(el("ideaText").value||"").trim(); if(!txt) return;
      var arr=LS.get("ideas",[]); arr.unshift({text:txt,lane:el("ideaLane").value,at:new Date().toISOString()});
      LS.set("ideas",arr); render();
    });
    el("view").querySelectorAll(".delIdea").forEach(function(a){
      a.addEventListener("click", function(e){ e.preventDefault(); var i=+a.getAttribute("data-del");
        var arr=LS.get("ideas",[]); arr.splice(i,1); LS.set("ideas",arr); render(); });
    });
    el("view").querySelectorAll(".toMem").forEach(function(a){
      a.addEventListener("click", async function(e){
        e.preventDefault();
        var i=+a.getAttribute("data-mem");
        var arr=LS.get("ideas",[]); var it=arr[i]; if(!it) return;
        a.textContent="saving…";
        try{
          if(!STATE.live) throw new Error("Mem unreachable (demo mode)");
          await memCreateNote(fragContent(it.text,it.lane));
          it.mem=true; LS.set("ideas",arr);
          toast('Saved to Mem as "'+fragTitle(it.text,it.lane)+'"');
          render();
        }catch(err){
          a.textContent="save to Mem";
          toast("Couldn't save to Mem: "+(err&&err.message?err.message.slice(0,140):err));
        }
      });
    });
  }
  if(STATE.tab==="studio"){
    document.querySelectorAll("[data-mode]").forEach(function(b){
      b.addEventListener("click", function(){ mountStudio(b.getAttribute("data-mode")); el("aiOut").classList.add("hidden"); el("aiActions").classList.add("hidden"); });
    });
    var cp=el("copyOut"); if(cp) cp.addEventListener("click", function(){ try{ navigator.clipboard.writeText(STUDIO.lastOut||""); cp.textContent="Copied ✓"; setTimeout(function(){cp.textContent="Copy";},1200); }catch(e){} });
    var ti=el("toIdea"); if(ti) ti.addEventListener("click", function(){ var arr=LS.get("ideas",[]); arr.unshift({text:(STUDIO.lastOut||"").slice(0,240),lane:"",at:new Date().toISOString()}); LS.set("ideas",arr); ti.textContent="Saved ✓"; setTimeout(function(){ti.textContent="Save as idea";},1200); });
  }
  if(STATE.tab==="today"){
    var m=el("toStudioMemoir"), bl=el("toStudioBlog");
    if(m) m.addEventListener("click", function(){ STUDIO.seed=TODAY.memoir; setTab("studio"); mountStudio("draft"); });
    if(bl) bl.addEventListener("click", function(){ STUDIO.seed=TODAY.blog; setTab("studio"); mountStudio("draft"); });
    var se=el("sessExc"), sd=el("sessDraft");
    if(se) se.addEventListener("click", function(){ startSession("excavation"); });
    if(sd) sd.addEventListener("click", function(){ startSession("drafting"); });
    var sb=el("schedBtn");
    if(sb) sb.addEventListener("click", function(){
      var f=el("schedForm");
      if(f.innerHTML){ f.innerHTML=""; return; }
      var tmr=new Date(Date.now()+86400000);
      f.innerHTML='<div class="miniform"><div class="frow">'
        +'<input type="date" id="schedDate" value="'+localDateStr(tmr)+'">'
        +'<input type="time" id="schedTime" value="21:00">'
        +'<select id="schedDur"><option value="30">30 min</option><option value="45" selected>45 min</option><option value="60">60 min</option><option value="90">90 min</option></select>'
        +'<select id="schedType"><option value="drafting">drafting</option><option value="excavation">excavation</option></select>'
        +'<button class="btn primary" id="schedGo">Create calendar event</button></div>'
        +'<p class="note" id="schedMsg">Creates "Memoir — [type] session" on your primary calendar, in your calendar\'s own timezone.</p></div>';
      el("schedGo").addEventListener("click", async function(){
        var btn=el("schedGo"); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> creating…';
        try{
          var dv=el("schedDate").value, tv=el("schedTime").value, dur=+el("schedDur").value, ty=el("schedType").value;
          if(!dv||!tv) throw new Error("Pick a date and time.");
          var start=new Date(dv+"T"+tv+":00");
          var end=new Date(start.getTime()+dur*60000);
          await callTool(TOOLS.calCreate,{
            summary:"Memoir — "+ty+" session",
            startTime:naiveISO(start), endTime:naiveISO(end),
            description:"Writing Room session block.\n\nToday's excavation prompt:\n"+TODAY.memoir,
            colorId:"3"
          });
          el("schedForm").innerHTML="";
          toast("Calendar event created: Memoir — "+ty+" session, "+dv+" "+tv);
        }catch(e){
          var msg=el("schedMsg"); if(msg) msg.textContent="Calendar write failed: "+(e&&e.message?e.message.slice(0,160):e);
          btn.disabled=false; btn.textContent="Create calendar event";
        }
      });
    });
    var gb=el("gapBtn");
    if(gb) gb.addEventListener("click", function(){
      var f=el("gapForm");
      if(f.innerHTML){ f.innerHTML=""; return; }
      var cold=coldestMemoir();
      var taskText="Memoir gap-return: "+(cold?shortTitle(cold.title):"pick up the manuscript");
      f.innerHTML='<div class="miniform"><div class="frow">'
        +'<input type="text" class="search" id="gapText" value="'+esc(taskText)+'" style="min-width:260px">'
        +'<select id="gapDue"><option value="tomorrow">due tomorrow</option><option value="in 3 days" selected>due in 3 days</option><option value="next week">due next week</option></select>'
        +'<button class="btn primary" id="gapGo">Create Todoist task</button></div>'
        +'<p class="note" id="gapMsg">'+(cold?('Coldest open memoir piece: "'+esc(shortTitle(cold.title))+'" — untouched '+Math.round(daysAgo(cold.updated_at))+'d.'):'No open memoir pieces found — edit the task text.')+'</p></div>';
      el("gapGo").addEventListener("click", async function(){
        var btn=el("gapGo"); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> creating…';
        try{
          await todoistCreateTask((el("gapText").value||"").trim()||taskText, el("gapDue").value);
          el("gapForm").innerHTML="";
          toast("Todoist task created.");
        }catch(e){
          var msg=el("gapMsg"); if(msg) msg.textContent=(e&&e.message?e.message:String(e));
          btn.disabled=false; btn.textContent="Create Todoist task";
        }
      });
    });
  }
}

/* tabs */
function setTab(t){
  STATE.tab=t;
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab")===t); });
  render();
}
el("tabs").addEventListener("click", function(e){ var b=e.target.closest(".tab"); if(b) setTab(b.getAttribute("data-tab")); });
el("rClose").addEventListener("click", closeReader);
el("overlay").addEventListener("click", function(e){ if(e.target===el("overlay")) closeReader(); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeReader(); });

/* boot */
async function boot(){
  var saved=LS.get("filter",null); if(saved) STATE.filter=Object.assign(STATE.filter,saved);
  try{
    var notes=await loadNotes();
    STATE.live=true;
    STATE.notes=splitIndexNote(notes);
    el("srcDot").className="dot live";
    el("srcTxt").textContent="Live · Mem · "+STATE.notes.length+" pieces";
    setSync(STATE.indexId?"synced":"idle");
    flushPendingSessions();
  }catch(e){
    STATE.live=false; STATE.notes=DEMO;
    el("srcDot").className="dot demo";
    el("srcTxt").textContent="Demo data (Mem unreachable)";
    setSync("local");
    var b=el("banner"); b.classList.add("show");
    b.textContent="Couldn't reach Mem, so this is sample content. Grant this artifact access to Mem (connector permissions), then Reload. Error detail: "+(e && e.message ? e.message : String(e));
  }
  render();
  renderSessionBar();
}
boot();
</script>
