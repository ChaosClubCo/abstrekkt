<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden flex">

</div>
<div class="flex items-center gap-4">

</div>
<div class="flex items-center gap-1 bg-surface-container-high px-3 py-1 rounded-full shadow-sm border border-outline-variant hidden sm:flex">

</div>
<button class="p-2 text-on-surface-variant hover:opacity-80 transition-opacity">

</button>
</div>

</a>
</li>
<li>

</a>
</li>
<li>

</a>
</li>

<div class="relative w-full max-w-[1200px] h-[768px] bg-inverse-surface rounded-xl shadow-[0_16px_32px_rgba(0,0,0,0.2)] border-[3px] border-outline-variant overflow-hidden group">

</svg>
<div class="absolute inset-0 flex items-center justify-center">
