<style>
        body {
            background-color: #020a14;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(98, 250, 227, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(182, 189, 215, 0.05) 0%, transparent 40%);
        }
        
        .bioluminescent-glow {
            filter: drop-shadow(0 0 8px rgba(98, 250, 227, 0.4));
        }
        
        .leaf-ui {
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            background: linear-gradient(145deg, #152031, #081425);
            border: 1px solid rgba(98, 250, 227, 0.2);
        }

        .resin-pool {
            background: rgba(45, 212, 191, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(98, 250, 227, 0.3);
            box-shadow: inset 0 0 20px rgba(98, 250, 227, 0.1), 0 0 15px rgba(98, 250, 227, 0.2);
        }

        .pulse-slow {
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }

        .hud-hidden .toggleable-ui {
            opacity: 0;
            pointer-events: none;
            filter: blur(20px);
            transform: scale(1.1);
        }
        .toggleable-ui {
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Vine Decoration */
        .vine-bg {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            opacity: 0.3;
        }
    </style>
</head>

<script>
    // HUD Toggle Logic
    const toggleBtn = document.getElementById('toggleHudBtn');
    const body = document.body;
    const toggleIcon = document.getElementById('toggleIcon');
    const toggleText = document.getElementById('toggleText');

    toggleBtn.addEventListener('click', () => {
        body.classList.toggle('hud-hidden');
        
        if (body.classList.contains('hud-hidden')) {
            toggleIcon.textContent = 'visibility';
            toggleText.textContent = 'SHOW SANCTUM UI';
        } else {
            toggleIcon.textContent = 'visibility_off';
            toggleText.textContent = 'HIDE SANCTUM UI';
        }
    });
</script>
