<style>
        /* Custom Noise Texture */
        .texture-noise {
            position: relative;
        }
        .texture-noise::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            mix-blend-mode: multiply;
            z-index: 10;
        }

        /* Isometric/2.5D setup */
        .iso-container {
            perspective: 1200px;
            transform-style: preserve-3d;
        }
        .iso-surface {
            transform: rotateX(60deg) rotateZ(-45deg);
            transform-style: preserve-3d;
        }
        
        /* Floating animations for charts */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(10deg); }
            50% { transform: translateY(-15px) rotateX(12deg); }
        }
        .animate-float-slow { animation: float 8s ease-in-out infinite; }
        .animate-float-medium { animation: float 6s ease-in-out infinite; }
        .animate-float-fast { animation: float 4s ease-in-out infinite; }

        /* Holographic effect */
        .hologram-border {
            border: 1px solid rgba(188, 237, 220, 0.4);
            box-shadow: 0 0 15px rgba(188, 237, 220, 0.2), inset 0 0 10px rgba(188, 237, 220, 0.1);
        }
        .hologram-text {
            color: #bceddc;
            text-shadow: 0 0 5px rgba(188, 237, 220, 0.5);
        }

        /* Washi tape */
        .washi-tape {
            background-color: rgba(231, 187, 198, 0.6);
            mix-blend-mode: multiply;
            border-radius: 2px;
            box-shadow: 1px 1px 3px rgba(139, 94, 60, 0.1);
            position: absolute;
            z-index: 20;
        }

        /* Die-cut sticker effect */
        .sticker-die-cut {
            border: 3px solid white;
            box-shadow: 0 4px 6px -1px rgba(139, 94, 60, 0.15), 0 2px 4px -1px rgba(139, 94, 60, 0.1);
            background-color: white;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-inverse-surface text-inverse-on-surface font-body-md text-body-md overflow-x-hidden min-h-screen texture-noise">
<!-- Ambient Background / Night Sky -->

<div class="absolute top-[30%] left-[80%] w-[3px] h-[3px] bg-white rounded-full opacity-50 shadow-[0_0_6px_white]"></div>

</div>

<div class="absolute w-[400px] h-[400px] rounded-full border-2 border-secondary-fixed opacity-20"></div>
<!-- Central Brass Telescope Base (Abstract representation in 2.5D) -->
