<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude GUI Course</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/tabler-icons.min.css">
<style>
:root {
  --color-background-primary: #1e1e1e;
  --color-background-secondary: #2a2a2a;
  --color-background-info: #112233;
  --color-background-warning: #231a08;
  --color-background-danger: #2a1010;
  --color-background-success: #102310;
  --color-text-primary: #e5e5e5;
  --color-text-secondary: #a0a0a0;
  --color-text-tertiary: #5a5a5a;
  --color-text-info: #60a5fa;
  --color-text-warning: #f59e0b;
  --color-text-danger: #f87171;
  --color-text-success: #4ade80;
  --color-border-tertiary: rgba(255,255,255,0.08);
  --color-border-secondary: rgba(255,255,255,0.15);
  --color-border-primary: rgba(255,255,255,0.25);
  --color-border-info: rgba(96,165,250,0.35);
  --color-border-warning: rgba(245,158,11,0.35);
  --color-border-danger: rgba(248,113,113,0.35);
  --color-border-success: rgba(74,222,128,0.35);
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #111; color: var(--color-text-primary); font-family: var(--font-sans); }
#root { max-width: 860px; margin: 0 auto; padding: 0; }
#tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary)}
.tb{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--color-text-tertiary);font-family:var(--font-sans);margin-bottom:-1px;transition:color .15s}
.tb.on{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
#shell{display:grid;grid-template-columns:160px 1fr;min-height:460px}
#sl{border-right:0.5px solid var(--color-border-tertiary);padding:10px 0}
.sb2{width:100%;background:none;border:none;border-left:2px solid transparent;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--color-text-tertiary);font-family:var(--font-sans);text-align:left;display:flex;gap:8px;line-height:1.35;align-items:flex-start}
.sb2.on{color:var(--color-text-primary);background:var(--color-background-secondary);border-left-color:var(--color-text-primary)}
.sn{font-size:10px;opacity:.4;flex-shrink:0;padding-top:1px}
#ca{padding:20px 22px;max-width:500px}
.mtag{font-size:11px;color:var(--color-text-tertiary);margin:0 0 14px}
.shd{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pip{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:100px;padding:2px 8px;font-size:10px;color:var(--color-text-secondary)}
.st{font-size:17px;font-weight:500;margin:0;color:var(--color-text-primary)}
.sbdy{font-size:14px;color:var(--color-text-secondary);line-height:1.65;margin:0 0 14px}
.gui{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px;margin:0 0 14px}
.glb{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
.sk-bar{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-tertiary)}
.sk-p{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:100px;padding:2px 8px;font-size:11px;color:var(--color-text-secondary);flex-shrink:0}
.sk-send{background:var(--color-text-primary);color:var(--color-background-primary);border:none;border-radius:var(--border-radius-md);padding:4px 10px;font-size:12px;flex-shrink:0}
.sk-stop{background:var(--color-background-danger);border:0.5px solid var(--color-border-danger);border-radius:var(--border-radius-md);padding:4px 10px;font-size:12px;color:var(--color-text-danger);flex-shrink:0}
.sk-ic{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:3px 7px;font-size:13px;color:var(--color-text-secondary);flex-shrink:0}
.sk-msg{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-secondary)}
.sk-umsg{background:var(--color-background-info);border:0.5px solid var(--color-border-info);border-radius:var(--border-radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-info);position:relative}
.cs{border-top:0.5px solid var(--color-border-tertiary);padding-top:8px;margin-top:8px;display:flex;gap:6px}
.ci{background:var(--color-background-secondary);border:0.5px solid transparent;border-radius:var(--border-radius-md);padding:3px 7px;font-size:13px;color:var(--color-text-secondary)}
.ci.hi{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}
.lbl{display:inline-flex;align-items:center;gap:3px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:100px;padding:2px 8px;font-size:11px;color:var(--color-text-secondary);margin:2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.fk{border-left:1.5px solid var(--color-border-secondary);padding-left:10px;margin-left:4px}
.fk.a{border-color:var(--color-border-info)}
.fk.b{border-color:var(--color-border-warning)}
.tips{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;margin:0 0 14px}
.tph{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.tip{display:flex;gap:8px;font-size:12px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:4px}
.td2{color:var(--color-text-tertiary);flex-shrink:0}
.nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.nbtn{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:6px 14px;cursor:pointer;font-size:12px;color:var(--color-text-secondary);font-family:var(--font-sans);display:flex;align-items:center;gap:6px}
.nbtn:hover{background:var(--color-background-secondary)}
.nbtn:disabled{opacity:.3;cursor:default}
.prog{flex:1;height:2px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden}
.pf{height:100%;background:var(--color-text-primary);transition:width .2s}
.dk-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.dk-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;font-size:11px;color:var(--color-text-secondary);display:flex;flex-direction:column;gap:4px}
.dk-head{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.row-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.row-item:last-child{border-bottom:none}
.ri-icon{width:28px;height:28px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.ri-lbl{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.ri-sub{font-size:11px;color:var(--color-text-tertiary)}
.sk-pencil{position:absolute;right:-10px;top:50%;transform:translateY(-50%);background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);padding:4px 8px;font-size:13px;color:var(--color-text-warning)}
</style>
</head>
<body>
<div id="root">
<div id="tabs"></div>
<div id="shell">
  <aside id="sl"></aside>
  <main id="ca"></main>
</div>
</div>
<script>
function d(type){
  const g=(c,h)=>`<div class="gui"><div class="glb">gui \u00b7 ${c}</div>${h}</div>`;

  if(type==='layout') return g('interface layout',`
    <div class="row" style="align-items:stretch;gap:8px;height:110px">
      <div style="width:110px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px;display:flex;flex-direction:column;gap:4px;flex-shrink:0">
        <div style="font-size:9px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Sidebar</div>
        <div style="background:var(--color-background-secondary);border-radius:100px;padding:3px 8px;font-size:10px;color:var(--color-text-primary)"><i class="ti ti-plus" aria-hidden="true" style="font-size:10px"></i> New chat</div>
        <div style="font-size:10px;color:var(--color-text-tertiary);padding:2px 4px">Past conv...</div>
        <div style="font-size:10px;color:var(--color-text-tertiary);padding:2px 4px">Past conv...</div>
        <div style="margin-top:auto;font-size:10px;color:var(--color-text-tertiary);padding:2px 4px"><i class="ti ti-settings" aria-hidden="true" style="font-size:10px"></i> Settings</div>
      </div>
      <div style="flex:1;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="font-size:9px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em">Chat area</div>
        <div class="sk-bar"><span style="flex:1;font-size:11px">Message...</span><span class="sk-send" style="font-size:11px"><i class="ti ti-arrow-up" aria-hidden="true"></i></span></div>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="lbl"><i class="ti ti-arrow-narrow-left" aria-hidden="true"></i> ~260px fixed</span>
      <span class="lbl">fills remaining width <i class="ti ti-arrow-narrow-right" aria-hidden="true"></i></span>
    </div>
  `);

  if(type==='sidebar') return g('sidebar elements',`
    <div class="col" style="gap:0">
      ${[['ti-edit','New chat','Primary action \u2014 always at top'],['ti-message','Recent conversations','Most recent first \u2014 click to resume'],['ti-folder','Projects (Pro/Team)','Persistent system prompt per group'],['ti-settings','Settings','Account, preferences, memory']].map(([ic,lbl,sub])=>`<div class="row-item"><div class="ri-icon"><i class="ti ${ic}" aria-hidden="true"></i></div><div><div class="ri-lbl">${lbl}</div><div class="ri-sub">${sub}</div></div></div>`).join('')}
    </div>
  `);

  if(type==='input-pre') return g('input area \u2014 before sending',`
    <div class="sk-bar">
      <span class="sk-p"><i class="ti ti-circle-dot" aria-hidden="true" style="font-size:10px"></i> Sonnet 4.6 <i class="ti ti-chevron-down" aria-hidden="true" style="font-size:10px"></i></span>
      <span class="sk-ic"><i class="ti ti-paperclip" aria-hidden="true"></i></span>
      <span style="flex:1;font-size:12px;color:var(--color-text-tertiary)">Message...</span>
      <span class="sk-ic"><i class="ti ti-world-search" aria-hidden="true"></i></span>
      <span class="sk-send"><i class="ti ti-arrow-up" aria-hidden="true"></i></span>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="lbl"><i class="ti ti-circle-dot" aria-hidden="true" style="font-size:10px"></i> Model selector</span>
      <span class="lbl"><i class="ti ti-paperclip" aria-hidden="true" style="font-size:10px"></i> Attach</span>
      <span class="lbl"><i class="ti ti-world-search" aria-hidden="true" style="font-size:10px"></i> Web search</span>
      <span class="lbl"><i class="ti ti-arrow-up" aria-hidden="true" style="font-size:10px"></i> Send</span>
    </div>
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:8px">Set model and web search before your first message \u2014 they apply to the full conversation.</div>
  `);

  if(type==='send') return g('sending a message',`
    <div class="sk-bar"><span style="flex:1;font-size:12px">Your message here</span><span class="sk-send"><i class="ti ti-arrow-up" aria-hidden="true"></i></span></div>
    <div class="row" style="margin-top:8px"><span class="lbl">Enter = send</span><span class="lbl">Shift+Enter = new line</span></div>
  `);

  if(type==='stop') return g('stop generation',`
    <div class="sk-bar"><span style="flex:1;font-size:12px;color:var(--color-text-tertiary);font-style:italic">Claude is generating...</span><span class="sk-stop"><i class="ti ti-player-stop" aria-hidden="true"></i> Stop</span></div>
    <div style="font-size:11px;color:var(--color-text-secondary);margin-top:8px">Square stop button replaces the send arrow while generating. Click to halt. Existing output stays in the thread.</div>
  `);

  if(type==='regen') return g('regenerate \u2014 hover claude\'s last response',`
    <div class="sk-msg">Claude's response text here...<div class="cs"><span class="ci hi"><i class="ti ti-refresh" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-copy" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-thumb-up" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-thumb-down" aria-hidden="true"></i></span></div></div>
    <div class="row" style="margin-top:8px"><span class="lbl" style="background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)"><i class="ti ti-refresh" aria-hidden="true" style="font-size:10px"></i> Regenerate \u2014 replaces last response</span></div>
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:6px">Only works on the last response. Not a branch \u2014 original is gone.</div>
  `);

  if(type==='edit') return g('edit your message \u2014 hover to reveal pencil',`
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div class="sk-umsg" style="flex:1">Your message text...<span class="sk-pencil"><i class="ti ti-edit" aria-hidden="true"></i></span></div>
    </div>
    <div class="row" style="margin-top:12px">
      <span class="lbl" style="background:var(--color-background-warning);border-color:var(--color-border-warning);color:var(--color-text-warning)"><i class="ti ti-edit" aria-hidden="true" style="font-size:10px"></i> Pencil \u2014 hover to reveal</span>
      <span class="lbl">Appears on YOUR messages only</span>
      <span class="lbl">Works anywhere in thread</span>
    </div>
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:6px">Editing creates a branch \u2014 original path is preserved. This is how all branching starts.</div>
  `);

  if(type==='controls') return g('claude message \u2014 hover controls',`
    <div class="sk-msg">Claude's response...<div class="cs"><span class="ci"><i class="ti ti-refresh" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-copy" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-thumb-up" aria-hidden="true"></i></span><span class="ci"><i class="ti ti-thumb-down" aria-hidden="true"></i></span></div></div>
    <div class="col" style="margin-top:10px;gap:4px">
      ${[['ti-refresh','Regenerate','Replaces last response (no fork)'],['ti-copy','Copy','Full response as plaintext. Code blocks have their own copy button.'],['ti-thumb-up','Thumbs up','Feedback to Anthropic'],['ti-thumb-down','Thumbs down','Opens feedback dialog \u2014 more useful than just the vote']].map(([ic,lbl,note])=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="lbl" style="flex-shrink:0"><i class="ti ${ic}" aria-hidden="true" style="font-size:10px"></i> ${lbl}</span><span style="font-size:11px;color:var(--color-text-tertiary);line-height:1.4">${note}</span></div>`).join('')}
    </div>
  `);

  if(type==='branch-concept') return g('branch concept',`
    <div style="font-size:12px;color:var(--color-text-secondary);line-height:1.8;font-family:var(--font-mono)">
      <div style="color:var(--color-text-tertiary)">msg 1 \u2014 your message</div>
      <div style="color:var(--color-text-tertiary)">msg 2 \u2014 claude responds</div>
      <div style="color:var(--color-text-warning)">msg 3 \u2014 your message <span style="background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:100px;padding:1px 8px;font-size:10px;color:var(--color-text-warning)"><i class="ti ti-edit" aria-hidden="true" style="font-size:10px"></i> edit here = fork</span></div>
      <div style="display:flex;gap:20px;margin:6px 0 0 12px">
        <div class="fk a"><div style="font-size:11px;color:var(--color-text-info);font-weight:500">Branch A (original)</div><div style="font-size:11px;color:var(--color-text-tertiary)">original response</div><div style="font-size:11px;color:var(--color-text-tertiary)">your follow-ups...</div></div>
        <div class="fk b"><div style="font-size:11px;color:var(--color-text-warning);font-weight:500">Branch B (new)</div><div style="font-size:11px;color:var(--color-text-tertiary)">fresh response</div><div style="font-size:11px;color:var(--color-text-tertiary)">different path...</div></div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:10px">Both paths preserved. Both independently continuable. Think: git for conversations.</div>
  `);

  if(type==='branch-how') return g('how to branch \u2014 step by step',`
    <div class="col" style="gap:6px">
      ${[['1','Find message where things went wrong',''],['2','Hover over YOUR message','Pencil icon appears on the right side'],['3','Click the pencil icon',''],['4','Edit the text \u2014 or re-send unchanged','Re-sending unchanged still gives a fresh response'],['5','Claude responds from that point','Navigation arrows appear at the fork']].map(([n,txt,note])=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="width:20px;height:20px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--color-text-secondary);flex-shrink:0;font-family:var(--font-mono)">${n}</div><div><div style="font-size:12px;color:var(--color-text-primary)">${txt}</div>${note?`<div style="font-size:11px;color:var(--color-text-tertiary)">${note}</div>`:''}</div></div>`).join('')}
    </div>
  `);

  if(type==='branch-nav') return g('navigating between branches',`
    <div class="sk-msg">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:2px 8px;font-size:13px;color:var(--color-text-secondary)"><i class="ti ti-chevron-left" aria-hidden="true"></i></span>
        <span style="font-size:11px;color:var(--color-text-tertiary);font-family:var(--font-mono)">2 / 2</span>
        <span style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:2px 8px;font-size:13px;color:var(--color-text-tertiary)"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
      </div>
      Claude's response on the current branch...
    </div>
    <div class="col" style="margin-top:10px;gap:4px">
      <div style="font-size:11px;color:var(--color-text-secondary)">Arrows flip between branches at this fork point</div>
      <div style="font-size:11px;color:var(--color-text-secondary)">2/2 = you're on branch 2 of 2 at this fork</div>
      <div style="font-size:11px;color:var(--color-text-secondary)">Each branch is independently continuable \u2014 not just viewable</div>
    </div>
  `);

  if(type==='decision') return g('which action to use',`
    <div class="dk-row">
      ${[{ic:'ti-refresh',lbl:'Regenerate',col:'info',when:'Last response was wrong',scope:'Last response only',keeps:'Nothing \u2014 replaces current'},{ic:'ti-git-branch',lbl:'Branch',col:'warning',when:'Wrong at a specific earlier point',scope:'Any prior message',keeps:'Both paths preserved'},{ic:'ti-square-plus',lbl:'New chat',col:'success',when:'Context degraded or topic changed',scope:'Full reset',keeps:'Nothing \u2014 clean slate'}].map(({ic,lbl,col,when,scope,keeps})=>`<div class="dk-card" style="border-color:var(--color-border-${col})"><div class="dk-head"><i class="ti ${ic}" aria-hidden="true" style="color:var(--color-text-${col})"></i> <span style="color:var(--color-text-${col})">${lbl}</span></div><div style="color:var(--color-text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.05em">Use when</div><div>${when}</div><div style="color:var(--color-text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px">Scope</div><div>${scope}</div><div style="color:var(--color-text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px">Keeps</div><div>${keeps}</div></div>`).join('')}
    </div>
  `);

  return '';
}

const M=[
  {lbl:'01 \u00b7 Walk up',tagline:'Getting oriented before you type',steps:[
    {short:'Layout',title:'The interface layout',gui:'layout',body:'Two zones: sidebar (~260px, left) and chat area (everything else, right). The sidebar collapses on mobile. On first visit you land in an empty chat.',tips:['Sidebar collapses on narrow screens and mobile','First-time users see a sign-in prompt before the interface loads']},
    {short:'Sidebar',title:'Sidebar elements',gui:'sidebar',body:'From top to bottom: New Chat button, conversation history (most recent first), Projects if you\'re on Pro or Team, and Settings at the bottom.',tips:['Click any past conversation to resume \u2014 context is preserved exactly where you left it','Projects let you attach a persistent system prompt to a group of related conversations']},
    {short:'New chat',title:'Starting a new conversation',gui:'input-pre',body:'Click New chat or press Cmd/Ctrl+Shift+O. You land on a blank input. The model selector shows your last-used model. Set the model and web search toggle before you type \u2014 they apply to the whole conversation.',tips:['Model selector is in the input area, left side \u2014 click to switch between Sonnet, Opus, etc.','You can drag a file or paste an image before typing your first message']},
    {short:'Input controls',title:'Controls before you send',gui:'input-pre',body:'In the input area before your first message: model selector (left), paperclip/attach, text field, web search toggle, and send button (right). Web search state persists through the full conversation.',tips:['Set web search before typing \u2014 it applies to the message you\'re composing','Switching models mid-conversation is possible but starts a fresh internal context window']},
    {short:'Context front-loading',title:'Front-load your context',gui:null,body:'Claude has zero memory between sessions. It only knows what\'s in the current window. Paste role, constraints, relevant files, and expected output format in your first message. This is the single highest-ROI move at walk-up.',tips:['Don\'t save important context for later \u2014 it compounds misunderstanding if you wait','Long first messages are fine. Vague first messages cost you correction rounds later.']}
  ]},
  {lbl:'02 \u00b7 During',tagline:'Controls available while the conversation runs',steps:[
    {short:'Send',title:'Sending a message',gui:'send',body:'Enter sends. Shift+Enter adds a newline within your message. Compose multi-line prompts with Shift+Enter first, then send as one block.',tips:['Mobile uses a send button only \u2014 no keyboard shortcut','Pasting code, long text, or a URL into the input works fine']},
    {short:'Stop',title:'Stop generation',gui:'stop',body:'While Claude is typing, the send button becomes a square stop icon. Click it to halt generation. Whatever was already generated stays in the thread \u2014 stopping is non-destructive.',tips:['Use this when Claude has misread the prompt and is heading in the wrong direction','After stopping, you can edit your message (which creates a branch) or send a follow-up']},
    {short:'Regenerate',title:'Regenerate a response',gui:'regen',body:'Hover over Claude\'s last response. A circular arrow icon appears in the control strip. Click it for a fresh generation from the same prompt. This replaces the current response \u2014 it is not a branch, so the original is gone.',tips:['Regenerate only works on the last response \u2014 you can\'t regenerate earlier ones','If you want to keep the original while trying a new response, use Edit (branch) instead']},
    {short:'Edit message',title:'Edit your message',gui:'edit',body:'Hover over any of your messages. A pencil icon appears on the right side. Click it, modify your text (or leave it unchanged), and send. Claude responds fresh from that point. Both paths are preserved \u2014 this is how branching works.',tips:['Works on any of your messages in the thread, not just the last one','The pencil icon only appears on YOUR messages \u2014 not on Claude\'s responses']},
    {short:'Message controls',title:'Copy, rate, and give feedback',gui:'controls',body:'Hover over any Claude response to reveal the control strip: copy, thumbs up, thumbs down. Code blocks have their own copy button in the block header. Thumbs down opens a specific feedback dialog.',tips:['Copying a code block copies only that block\'s content, not the surrounding text','Feedback votes are sent to Anthropic \u2014 they don\'t affect your current conversation']},
    {short:'Attachments',title:'File and image attachment',gui:'input-pre',body:'Paperclip icon in the input area. Supports PDFs, images (JPEG/PNG/GIF/WebP), text files, and code files. Attachments are tied to the message they\'re sent with and can be referenced throughout the conversation.',tips:['Images go through Claude\'s vision \u2014 it reads them directly, no OCR step','Very large PDFs may hit context limits; split them if you see truncation']},
    {short:'Context drift',title:'Watch for context drift',gui:null,body:'There\'s no context-limit indicator. Signs it\'s happening: Claude contradicts earlier instructions, gives vague responses, or forgets constraints you set upfront. At this point branching won\'t fix it \u2014 you need a fresh conversation.',tips:['Long conversations accumulate compounding misunderstandings \u2014 not just token limits','When drift hits, start a new chat and open with a summary of where the last session landed']}
  ]},
  {lbl:'03 \u00b7 Resolution',tagline:'Branching, ending, and knowing the difference',steps:[
    {short:'Resolution types',title:'Three ways a conversation ends',gui:null,body:'Done: you got what you needed \u2014 close or copy output. Branch: conversation went wrong at a specific point \u2014 fork from there. Fresh start: context is degraded or topic changed \u2014 open a new chat.',tips:['Copy useful outputs before closing \u2014 Claude has no cross-session memory by default','Closing the tab without copying is fine for casual use, but you lose the artifact permanently']},
    {short:'Branch concept',title:'What branching actually does',gui:'branch-concept',body:'Editing any of your past messages forks the conversation at that point. The original path is preserved. You get a new response from that point. Both paths live in the same conversation and are independently continuable.',tips:['You can branch off a branch \u2014 deeper forks are supported','Branches don\'t merge \u2014 once you fork, the paths are independent going forward']},
    {short:'How to branch',title:'How to branch \u2014 step by step',gui:'branch-how',body:'Find the message where things went wrong. Hover over your message \u2014 the pencil icon appears on the right. Click the pencil. Edit your text or re-send it unchanged. Claude responds fresh. Navigation arrows appear at the fork.',tips:['Re-sending the same text unchanged still creates a branch with a fresh response','The pencil only appears on YOUR messages, not on Claude\'s responses']},
    {short:'Branch navigation',title:'Navigating between branches',gui:'branch-nav',body:'After branching, left/right arrow controls appear on Claude\'s response at the fork, with a counter showing how many branches exist (e.g., 2/2). Click the arrows to flip between paths.',tips:['The counter tells you both how many branches exist and which one you\'re on','You can keep working in any branch \u2014 it\'s not a view mode, it\'s a full continuation']},
    {short:'Which to use',title:'Branch vs. Regenerate vs. New chat',gui:'decision',body:'Regenerate: swap out the last response, no fork, original gone. Branch: fork from any prior message, both paths saved. New chat: clean slate \u2014 use when context is fundamentally broken or the topic has changed.',tips:['Default to Branch when you\'re several messages deep and want a different direction','Default to New chat when you\'ve solved one thing and are starting something unrelated']},
    {short:'Exit cleanly',title:'Exiting a conversation cleanly',gui:null,body:'Before closing a useful conversation: copy key outputs to a doc or clipboard. If continuing tomorrow, paste a quick summary as your opener in the next session \u2014 Claude reads it as fresh context.',tips:['There\'s no automatic save for conversation outputs \u2014 extract manually before closing','Projects (Pro/Team) let you persist a system prompt, but not conversation history as context']}
  ]}
];

let mi=0,si=0;
function render(){
  const mod=M[mi],step=mod.steps[si],tot=mod.steps.length;
  document.getElementById('tabs').innerHTML=M.map((m,i)=>`<button class="tb${i===mi?' on':''}" onclick="go(${i})">${m.lbl}</button>`).join('');
  document.getElementById('sl').innerHTML=mod.steps.map((s,i)=>`<button class="sb2${i===si?' on':''}" onclick="gs(${i})"><span class="sn">${String(i+1).padStart(2,'0')}</span><span>${s.short}</span></button>`).join('');
  const guiH=step.gui?d(step.gui):'';
  const tipsH=step.tips.length?`<div class="tips"><div class="tph">Notes</div>${step.tips.map(t=>`<div class="tip"><span class="td2">\u00b7</span><span>${t}</span></div>`).join('')}</div>`:'';
  document.getElementById('ca').innerHTML=`
    <div class="mtag">${mod.lbl} \u2014 ${mod.tagline}</div>
    <div class="shd"><span class="pip">${si+1}\u2009/\u2009${tot}</span><h2 class="st">${step.title}</h2></div>
    <p class="sbdy">${step.body}</p>
    ${guiH}${tipsH}
    <div class="nav">
      <button class="nbtn" onclick="prev()" ${si===0?'disabled':''}><i class="ti ti-arrow-left" aria-hidden="true"></i> Prev</button>
      <div class="prog"><div class="pf" style="width:${Math.round(((si+1)/tot)*100)}%"></div></div>
      <button class="nbtn" onclick="next()" ${si===tot-1?'disabled':''}>Next <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>`;
}
function go(i){mi=i;si=0;render();}
function gs(i){si=i;render();}
function prev(){if(si>0){si--;render();}}
function next(){if(si<M[mi].steps.length-1){si++;render();}}
render();
</script>
</body>
</html>
