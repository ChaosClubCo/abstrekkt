<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abstrekkt</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #c8a86a;
      font-family: 'Fraunces', Georgia, serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .wordmark {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1;
    }
    .rule {
      width: 60px;
      height: 1px;
      background: #c8a86a;
      opacity: 0.4;
      margin: 2rem auto;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #555;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <h1 class="wordmark">Abstrekkt</h1>
  <div class="rule"></div>
  <p class="tagline">Construction over recovery</p>
</body>
</html>
