<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pivotal Moments v11 — Abstrekkt / Kyle Rosebrook</title>
<meta name="description" content="Pivotal decisions across Kyle Rosebrook's Oct 2025–Jun 2026 arc. Internal map.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ╔══════════════════════════════════════════╗
   ║  ABSTREKKT DESIGN TOKENS — edit to theme ║
   ╚══════════════════════════════════════════╝ */
:root{
  --bg:#111008; --bg2:#1a1a1d; --sf:#222220; --sf2:#2a2a2e; --sf3:#323230;
  --bd:#33322f; --bd2:#47463f; --bd3:#5a5950;
  --t:#e9e4da; --t2:#9a948a; --t3:#5f5a52; --t4:#38342c;
  --brass:#C8A86A; --brass2:#8a7448; --brass3:#3a2e12; --brass-glow:rgba(200,168,106,.1);
  --p:#c8a0f0; --pd:#1e1030; --pb:#2a1848;
  --tc:#7ab8d4; --tcd:#0c1e2c; --tcb:#102838;
  --s:#C8A86A;  --sd:#241a06; --sb:#30220a;
  --k:#c87878;  --kd:#241010; --kb:#301818;
  --x:#78afc8;  --xd:#0c1c28; --xb:#102230;
  --src-c-bg:#0e1820; --src-c-t:#5a90b8;
  --src-d-bg:#181408; --src-d-t:#907840;
  --src-p-bg:#121408; --src-p-t:#788040;
  --ff-display:'Fraunces',Georgia,serif;
  --ff-body:'Crimson Pro',Georgia,serif;
  --ff-mono:'JetBrains Mono','Courier New',monospace;
  --dur-f:130ms; --dur-m:240ms; --dur-s:380ms;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--ff-mono);background:var(--bg);color:var(--t);min-height:100vh;
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
/* Reading Room at Midnight — atmospheric gradient */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 45% at 50% -8%,var(--brass-glow),transparent 55%),
    radial-gradient(ellipse 35% 25% at 8% 85%,rgba(120,95,40,.04),transparent 65%)}
/* Grain overlay — very quiet */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ── A11y ── */
.skip{position:absolute;top:-9em;left:1rem;z-index:9999;
  background:var(--brass);color:var(--bg);padding:.5rem 1rem;border-radius:2px;
  font-family:var(--ff-mono);font-size:.75rem;font-weight:700;text-decoration:none;
  transition:top var(--dur-f)}
.skip:focus{top:1rem;outline:3px solid var(--t);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}
button{cursor:pointer;font-family:inherit;border:none;background:none}
a{color:inherit}

/* ── Header ── */
.hdr{position:relative;z-index:10;padding:1.25rem 1.5rem 1rem;
  border-bottom:1px solid var(--bd);
  background:rgba(17,16,8,.93);backdrop-filter:blur(8px);
  display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem}
.hdr-brand h1{font-family:var(--ff-display);font-size:.875rem;font-weight:600;font-style:italic;
  letter-spacing:.01em;color:var(--brass);line-height:1.3}
.hdr-brand p{font-family:var(--ff-mono);font-size:.5rem;color:var(--t3);margin-top:.25rem;letter-spacing:.04em}
.hdr-count{font-family:var(--ff-mono);font-size:.5625rem;color:var(--t3);text-align:right;align-self:flex-end}
.hdr-count strong{color:var(--brass)}

/* ── Stats ── */
.stats{position:relative;z-index:10;display:flex;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:1;min-width:60px;padding:.5rem .75rem;border-right:1px solid var(--bd);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.stat:last-child{border-right:none}
.sn{font-family:var(--ff-display);font-size:1.25rem;font-weight:700;font-style:italic;line-height:1}
.sl{font-family:var(--ff-mono);font-size:.375rem;color:var(--t3);text-transform:uppercase;letter-spacing:.12em}
.sn.all{color:var(--brass)}.sn.personal{color:var(--p)}.sn.technical{color:var(--tc)}
.sn.synthesis{color:var(--s)}.sn.kill{color:var(--k)}.sn.tension{color:var(--x)}

/* ── Controls ── */
.ctrl{position:sticky;top:0;z-index:20;background:rgba(17,16,8,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bd);padding:.625rem 1.5rem;display:flex;flex-direction:column;gap:.375rem}
.ctrl-row{display:flex;gap:.25rem;align-items:center;flex-wrap:wrap}
.ctrl-lbl{font-family:var(--ff-mono);font-size:.4375rem;color:var(--t3);
  text-transform:uppercase;letter-spacing:.12em;white-space:nowrap;min-width:2.25rem}

.f-btn{font-family:var(--ff-mono);font-size:.4375rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:.375rem .625rem;min-height:2rem;min-width:2.5rem;
  border-radius:2px;border:1px solid var(--bd2);background:var(--sf);color:var(--t3);
  transition:all var(--dur-f);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.f-btn:hover{background:var(--sf2);color:var(--t2);border-color:var(--bd3)}
.f-btn[aria-checked=true][data-f=all]{background:var(--brass3);border-color:var(--brass);color:var(--brass)}
.f-btn[aria-checked=true][data-f=personal]{background:var(--pb);border-color:var(--p);color:var(--p)}
.f-btn[aria-checked=true][data-f=technical]{background:var(--tcb);border-color:var(--tc);color:var(--tc)}
.f-btn[aria-checked=true][data-f=synthesis]{background:var(--sb);border-color:var(--s);color:var(--s)}
.f-btn[aria-checked=true][data-f=kill]{background:var(--kb);border-color:var(--k);color:var(--k)}
.f-btn[aria-checked=true][data-f=tension]{background:var(--xb);border-color:var(--x);color:var(--x)}
/* source filter active states */
.f-btn[aria-checked=true][data-sf=all]{background:var(--brass3);border-color:var(--brass);color:var(--brass)}
.f-btn[aria-checked=true][data-sf=chat]{background:var(--src-c-bg);border-color:var(--src-c-t);color:var(--src-c-t)}
.f-btn[aria-checked=true][data-sf=project]{background:var(--src-p-bg);border-color:var(--src-p-t);color:var(--src-p-t)}
.f-btn[aria-checked=true][data-sf=drive]{background:var(--src-d-bg);border-color:var(--src-d-t);color:var(--src-d-t)}

.v-tab{font-family:var(--ff-mono);font-size:.4375rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:.375rem .625rem;min-height:2rem;
  border-radius:2px;border:1px solid var(--bd2);background:var(--sf);color:var(--t3);
  transition:all var(--dur-f);display:inline-flex;align-items:center}
.v-tab:hover{background:var(--sf2);color:var(--t2)}
.v-tab[aria-selected=true]{background:var(--sf2);border-color:var(--brass);color:var(--brass)}

.srch{position:relative;display:flex;align-items:center;margin-left:auto}
.srch-icon{position:absolute;left:.5rem;font-size:.5625rem;color:var(--t3);pointer-events:none;user-select:none}
.srch-in{font-family:var(--ff-mono);font-size:.5rem;background:var(--sf);border:1px solid var(--bd2);
  color:var(--t);padding:.375rem .625rem .375rem 1.5rem;border-radius:2px;
  min-height:2rem;width:clamp(110px,20vw,190px);transition:border-color var(--dur-f),background var(--dur-f)}
.srch-in::placeholder{color:var(--t3)}
.srch-in:focus{outline:none;border-color:var(--brass);background:var(--sf2);
  box-shadow:0 0 0 2px rgba(200,168,106,.15)}
.srch-x{position:absolute;right:.375rem;color:var(--t3);padding:.125rem .25rem;
  line-height:1;display:none;background:none;border:none;min-height:1.5rem;min-width:1.5rem;
  font-size:.875rem;align-items:center;justify-content:center}
.srch-x.on{display:flex}
.srch-x:hover{color:var(--brass)}
.ctrl-sep{width:1px;height:.875rem;background:var(--bd2);margin:0 .25rem;flex-shrink:0}
.rc{font-family:var(--ff-mono);font-size:.4375rem;color:var(--t3)}
.rc strong{color:var(--brass)}

/* ── Main ── */
.main{position:relative;z-index:5;padding:0 1.5rem 5rem}
[role=tabpanel]{outline:none}
[role=tabpanel]:focus-visible{outline:2px solid var(--brass)}

.phase-sec{margin-bottom:.5rem}
.phase-hdr{display:flex;align-items:center;gap:.75rem;padding:1.75rem 0 .75rem}
.phase-line{flex:1;height:1px;background:var(--bd)}
.phase-lbl{font-family:var(--ff-display);font-size:.875rem;font-weight:600;font-style:italic;
  color:var(--t3);white-space:nowrap}
.phase-new{font-family:var(--ff-mono);font-size:.375rem;color:var(--brass);margin-left:.375rem}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:.5rem}

/* ── Card ── */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:2px;
  padding:.875rem 1rem;text-align:left;width:100%;
  transition:border-color var(--dur-f),background var(--dur-f),transform var(--dur-f);
  position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.card[data-c=personal]::before{background:linear-gradient(90deg,var(--p),#a080e0)}
.card[data-c=technical]::before{background:linear-gradient(90deg,var(--tc),#5a98b8)}
.card[data-c=synthesis]::before{background:linear-gradient(90deg,var(--brass),#d49040)}
.card[data-c=kill]::before{background:linear-gradient(90deg,var(--k),#a05050)}
.card[data-c=tension]::before{background:linear-gradient(90deg,var(--x),#5890b0)}
.card:hover{border-color:var(--bd2);background:var(--sf2);transform:translateY(-1px)}
.card[aria-expanded=true]{background:var(--sf2);border-color:var(--bd3)}
.card.is-new::after{content:'NEW';position:absolute;top:.5rem;right:.5rem;
  font-family:var(--ff-mono);font-size:.3125rem;font-weight:700;letter-spacing:.14em;
  color:var(--brass);background:var(--brass3);border:1px solid var(--brass2);border-radius:2px;padding:1px 4px}

.card-meta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.375rem;gap:.25rem}
.cat{font-family:var(--ff-mono);font-size:.3125rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;padding:2px 5px;border-radius:2px;flex-shrink:0}
.cat.personal{background:var(--pd);color:var(--p)}
.cat.technical{background:var(--tcd);color:var(--tc)}
.cat.synthesis{background:var(--sd);color:var(--s)}
.cat.kill{background:var(--kd);color:var(--k)}
.cat.tension{background:var(--xd);color:var(--x)}
.cdate{font-family:var(--ff-mono);font-size:.4375rem;color:var(--t3)}
.src{font-family:var(--ff-mono);font-size:.3125rem;padding:1px 4px;border-radius:2px;display:inline-block}
.src.chat{background:var(--src-c-bg);color:var(--src-c-t)}
.src.drive{background:var(--src-d-bg);color:var(--src-d-t)}
.src.project{background:var(--src-p-bg);color:var(--src-p-t)}
/* Fraunces for card titles */
.ctit{font-family:var(--ff-display);font-size:.75rem;font-weight:600;color:var(--t);
  line-height:1.35;margin-bottom:.3125rem}
.cexp{display:inline-block;font-size:.4375rem;color:var(--t3);margin-left:.25rem;
  transition:transform var(--dur-m) var(--ease);vertical-align:middle;font-family:var(--ff-mono)}
.card[aria-expanded=true] .cexp{transform:rotate(180deg)}
.csig{font-family:var(--ff-mono);font-size:.5rem;color:var(--t3);font-style:italic;line-height:1.45}

/* Expand/collapse via CSS grid trick */
.cdet{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-s) var(--ease)}
.card[aria-expanded=true] .cdet{grid-template-rows:1fr}
.cdet-inner{overflow:hidden}
.cdet-body{padding-top:.75rem;margin-top:.75rem;border-top:1px solid var(--bd)}
/* Crimson Pro for expanded prose */
.cq{font-family:var(--ff-body);font-size:.9375rem;font-style:italic;color:var(--t2);
  line-height:1.6;padding:.5rem .75rem;background:var(--bg);
  border-left:2px solid var(--brass2);border-radius:0 2px 2px 0;margin-bottom:.5rem}
.cq strong{color:var(--t);font-style:normal}
.cw{font-family:var(--ff-body);font-size:.9375rem;color:var(--t2);line-height:1.65;margin-bottom:.5rem}
.cem{display:grid;grid-template-columns:1fr 1fr;gap:.3125rem;margin-bottom:.5rem}
.em-item{background:var(--bg);border:1px solid var(--bd);border-radius:2px;padding:.375rem .5rem}
.em-l{font-family:var(--ff-mono);font-size:.3125rem;text-transform:uppercase;
  letter-spacing:.1em;color:var(--t3);margin-bottom:.125rem}
.em-v{font-family:var(--ff-mono);font-size:.5rem;color:var(--t2);line-height:1.4}
.clinks{display:flex;flex-wrap:wrap;gap:.25rem}
.clink{display:inline-flex;align-items:center;gap:.1875rem;font-family:var(--ff-mono);font-size:.4375rem;
  border:1px solid var(--bd);border-radius:2px;padding:.125rem .375rem;
  text-decoration:none;transition:color var(--dur-f),border-color var(--dur-f);
  min-height:1.5rem;background:transparent}
.clink.is-chat{color:#4a80aa;border-color:#1a2838}.clink.is-chat:hover{color:var(--tc);border-color:var(--tc)}
.clink.is-drive{color:#807040;border-color:#201c08}.clink.is-drive:hover{color:var(--brass);border-color:var(--brass)}
.clink.is-file{color:#607048;border-color:#181c08}.clink.is-file:hover{color:#90c060}

/* ── Grid View ── */
.gv{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;padding-top:1rem}
.gc{background:var(--sf);border:1px solid var(--bd);border-radius:2px;
  padding:.75rem .875rem;text-align:left;width:100%;
  transition:border-color var(--dur-f),background var(--dur-f);position:relative;overflow:hidden}
.gc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px}
.gc[data-c=personal]::before{background:var(--p)}.gc[data-c=technical]::before{background:var(--tc)}
.gc[data-c=synthesis]::before{background:var(--s)}.gc[data-c=kill]::before{background:var(--k)}
.gc[data-c=tension]::before{background:var(--x)}
.gc:hover{border-color:var(--bd2);background:var(--sf2)}
.gc.is-new{border-color:var(--brass3)}
.gn{font-family:var(--ff-display);font-size:1.875rem;font-weight:700;font-style:italic;
  opacity:.05;position:absolute;right:.375rem;top:.1875rem;line-height:1;user-select:none}
.gnew{position:absolute;top:.4375rem;right:.4375rem;
  font-family:var(--ff-mono);font-size:.3125rem;font-weight:700;letter-spacing:.12em;
  color:var(--brass);background:var(--brass3);border:1px solid var(--brass2);border-radius:2px;padding:1px 3px}
.gcat{font-family:var(--ff-mono);font-size:.3125rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;padding:2px 5px;border-radius:2px;display:inline-block;margin-bottom:.375rem}
.gdate{font-family:var(--ff-mono);font-size:.4375rem;color:var(--t3);margin-bottom:.1875rem}
.gtit{font-family:var(--ff-display);font-size:.6875rem;font-weight:600;font-style:italic;
  color:var(--t);line-height:1.3;margin-bottom:.1875rem}
.gsig{font-family:var(--ff-mono);font-size:.4375rem;color:var(--t3);font-style:italic;line-height:1.3}

/* ── Columns View ── */
.cv{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;padding-top:1rem}
.col-hdr{font-family:var(--ff-display);font-size:.75rem;font-weight:600;font-style:italic;
  padding:.375rem 0 .5rem;border-bottom:2px solid;margin-bottom:.5rem}
.col-hdr.personal{color:var(--p);border-color:var(--p)}.col-hdr.technical{color:var(--tc);border-color:var(--tc)}
.col-hdr.synthesis{color:var(--s);border-color:var(--s)}.col-hdr.kill{color:var(--k);border-color:var(--k)}
.col-hdr.tension{color:var(--x);border-color:var(--x)}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:2px;
  padding:.5rem .625rem;margin-bottom:.375rem;text-align:left;width:100%;
  transition:border-color var(--dur-f),background var(--dur-f);position:relative}
.cc:hover{background:var(--sf2);border-color:var(--bd2)}
.cc.is-new::after{content:'✦';font-size:.375rem;color:var(--brass);position:absolute;top:.3125rem;right:.5rem}
.ccdate{font-family:var(--ff-mono);font-size:.375rem;color:var(--t3);margin-bottom:.125rem}
.cctit{font-family:var(--ff-display);font-size:.5625rem;font-weight:600;font-style:italic;
  color:var(--t2);line-height:1.3;margin-bottom:.125rem}
.ccsig{font-family:var(--ff-mono);font-size:.4375rem;color:var(--t3);font-style:italic;line-height:1.3}

.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;
  font-family:var(--ff-body);font-size:1.125rem;font-style:italic;color:var(--t3)}
.hi{display:none!important}

/* ── Responsive ── */
@media(max-width:1280px){.gv{grid-template-columns:repeat(3,1fr)}.cv{grid-template-columns:repeat(3,1fr)}}
@media(max-width:960px){.gv{grid-template-columns:repeat(2,1fr)}.cv{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .hdr,.ctrl,.main{padding-left:1rem;padding-right:1rem}
  .cg{grid-template-columns:1fr}
  .gv{grid-template-columns:1fr 1fr}
  .f-btn,.v-tab{min-height:2.25rem;padding:.5rem .625rem}
}
@media(max-width:540px){
  .gv,.cv{grid-template-columns:1fr}
  .f-btn,.v-tab{min-height:2.5rem}
  .srch-in{width:110px}
}
@media(max-width:380px){
  .hdr,.ctrl,.main{padding-left:.75rem;padding-right:.75rem}
  .ctrl-row{gap:.1875rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}.cdet{transition:none}
  body::before,body::after{display:none}
}
@media(prefers-contrast:high){
  :root{--bg:#000;--sf:#0a0a08;--bd:#666;--bd2:#999;--t:#fff;--t2:#ddd;--t3:#aaa}
}
@media print{
  .skip,.ctrl{display:none!important}
  body{background:#fff;color:#000}
  .ctit,.gtit,.cctit,.phase-lbl,.col-hdr,.hdr-brand h1{font-family:Georgia,serif}
  .card{border:1px solid #ccc;page-break-inside:avoid}
  .cdet{grid-template-rows:1fr!important}
  body::before,body::after{display:none}
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to moments</a>

<header class="hdr" role="banner">
  <div class="hdr-brand">
    <h1>Pivotal Moments · Abstrekkt / Kyle Rosebrook · v11</h1>
    <p>Oct 2025 → Jun 2026 &nbsp;·&nbsp; Chat · Drive · Project Files · Memory</p>
  </div>
  <p class="hdr-count" id="hdrCount" aria-label="Version delta">—</p>
</header>

<dl class="stats" aria-label="Moment counts by category">
  <div class="stat"><dt class="sl">Total</dt><dd class="sn all" id="st-all">—</dd></div>
  <div class="stat"><dt class="sl">Personal</dt><dd class="sn personal" id="st-personal">—</dd></div>
  <div class="stat"><dt class="sl">Technical</dt><dd class="sn technical" id="st-technical">—</dd></div>
  <div class="stat"><dt class="sl">Synthesis</dt><dd class="sn synthesis" id="st-synthesis">—</dd></div>
  <div class="stat"><dt class="sl">Kill / Cut</dt><dd class="sn kill" id="st-kill">—</dd></div>
  <div class="stat"><dt class="sl">Tension</dt><dd class="sn tension" id="st-tension">—</dd></div>
</dl>

<nav class="ctrl" aria-label="Filter and view controls">
  <div class="ctrl-row">

/* ══════════════ DERIVED COUNTS — single source of truth = M[] ══════════════ */
const COUNTS=(()=>{
  const byCat={personal:0,technical:0,synthesis:0,kill:0,tension:0};
  const newByPhase={};
  let total=0,nNew=0;
  M.forEach(m=>{
    total++;
    byCat[m.c]=(byCat[m.c]||0)+1;
    if(m.N){nNew++;newByPhase[m.phase]=(newByPhase[m.phase]||0)+1;}
  });
  return {total,nNew,prior:total-nNew,byCat,newByPhase};
})();

function paintStaticCounts(){
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('st-all',COUNTS.total);
  COL_CATS.forEach(c=>set('st-'+c,COUNTS.byCat[c]||0));
  set('fAll','All '+COUNTS.total);
  set('sfAll','All '+COUNTS.total);
  const hc=document.getElementById('hdrCount');
  if(hc) hc.innerHTML=`${COUNTS.prior} prior &nbsp;+&nbsp; <strong>${COUNTS.nNew} new</strong> &nbsp;=&nbsp; ${COUNTS.total} total`;
}

/* ══════════════ HELPERS ══════════════ */
const catBadge=c=>`<span class="cat ${c}" aria-label="Category: ${CAT[c]||c}">${CAT[c]||c}</span>`;
const srcBadge=s=>`<span class="src ${s}">${SRC[s]||s}</span>`;
const linkHtml=m=>{
  if(!m.lk) return '';
  const cls=m.src==='drive'?'is-drive':'is-chat';
  return `<a class="clink ${cls}" href="${m.lk}" target="_blank" rel="noopener"
    aria-label="Opens source: ${m.lkt||'link'} in new tab">↗ ${m.lkt||'Link'}</a>`;
};

/* ══════════════ TIMELINE ══════════════ */
function renderTimeline(moments){
  const p=document.getElementById('panel-t');
  if(!moments.length){p.innerHTML='<p class="empty">No moments match your filters.</p>';return;}
  const byPhase={};
  moments.forEach(m=>{(byPhase[m.phase]||(byPhase[m.phase]=[])).push(m);});
  let html='';
  Object.keys(byPhase).sort((a,b)=>a-b).forEach(pi=>{
    const ph=PHASES[pi]||{l:'Phase '+pi,nx:''};
    html+=`<section class="phase-sec" aria-labelledby="ph${pi}">
      <div class="phase-hdr">
        <div class="phase-line" aria-hidden="true"></div>
        <h2 class="phase-lbl" id="ph${pi}">${ph.l}${COUNTS.newByPhase[pi]?`<span class="phase-new">+${COUNTS.newByPhase[pi]} new</span>`:''}</h2>
        <div class="phase-line" aria-hidden="true"></div>
      </div>
      <ul class="cg" role="list" aria-label="${ph.l} moments">`;
    byPhase[pi].forEach(m=>{html+=`<li>${buildCard(m)}</li>`;});
    html+=`</ul></section>`;
  });
  p.innerHTML=html;
  p.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click',()=>toggleCard(el));
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCard(el);}
      if(e.key==='Escape'){collapseCard(el);}
    });
  });
}

function buildCard(m){
  const did=`det-${m.n}`,tid=`tit-${m.n}`;
  const has=m.q||m.w||(m.em&&m.em.length)||m.lk;
  let det='';
  if(has){
    let inner='';
    if(m.q) inner+=`<blockquote class="cq">${m.q}</blockquote>`;
    if(m.w) inner+=`<p class="cw">${m.w}</p>`;
    if(m.em&&m.em.length){
      inner+='<div class="cem">';
      m.em.forEach(e=>{inner+=`<div class="em-item"><div class="em-l">${e.l}</div><div class="em-v">${e.v}</div></div>`;});
      inner+='</div>';
    }
    if(m.lk) inner+=`<div class="clinks">${linkHtml(m)}</div>`;
    det=`<div class="cdet" id="${did}" role="region" aria-labelledby="${tid}"><div class="cdet-inner"><div class="cdet-body">${inner}</div></div></div>`;
  }
  return `<div class="card${m.N?' is-new':''}" data-c="${m.c}" tabindex="0"
    ${has?`aria-expanded="false" aria-controls="${did}"`:''}
    aria-label="${m.T}"
  ><div class="card-meta">${catBadge(m.c)}<span class="cdate">${m.d} · ${srcBadge(m.src)}</span></div>
  <h3 class="ctit" id="${tid}">${m.T}${has?`<span class="cexp" aria-hidden="true">▾</span>`:''}</h3>
  <p class="csig">${m.S}</p>${det}</div>`;
}

function toggleCard(el){
  const open=el.getAttribute('aria-expanded')==='true';
  document.querySelectorAll('.card[aria-expanded=true]').forEach(c=>{if(c!==el)collapseCard(c);});
  el.setAttribute('aria-expanded',open?'false':'true');
}
function collapseCard(el){el.setAttribute('aria-expanded','false');}

/* ══════════════ GRID ══════════════ */
function renderGrid(moments){
  const p=document.getElementById('panel-g');
  if(!moments.length){p.innerHTML='<p class="empty">No moments match your filters.</p>';return;}
  let html='<ul class="gv" role="list">';
  moments.forEach(m=>{
    html+=`<li><button class="gc${m.N?' is-new':''}" data-c="${m.c}"
      ${m.lk?`onclick="window.open('${m.lk}','_blank','noopener')"`:''} 
      aria-label="${m.T}${m.lk?' — opens source':''}"
    ><span class="gn" aria-hidden="true">${String(m.n).padStart(2,'0')}</span>
    ${m.N?'<span class="gnew" aria-label="New moment">NEW</span>':''}
    <span class="gcat cat ${m.c}">${CAT[m.c]||m.c}</span>
    <div class="gdate">${m.d} · ${srcBadge(m.src)}</div>
    <div class="gtit">${m.T}</div>
    <div class="gsig">${m.S}</div></button></li>`;
  });
  html+='</ul>';p.innerHTML=html;
}

/* ══════════════ COLUMNS ══════════════ */
function renderColumns(moments){
  const p=document.getElementById('panel-c');
  let html='<div class="cv">';
  COL_CATS.forEach(cat=>{
    const items=moments.filter(m=>m.c===cat);
    html+=`<section aria-labelledby="colhdr-${cat}">
      <h2 class="col-hdr ${cat}" id="colhdr-${cat}">${CAT[cat]} (${COUNTS.byCat[cat]||0})</h2>`;
    if(!items.length){html+='<p style="font-family:var(--ff-body);font-size:.9rem;font-style:italic;color:var(--t3);padding:.5rem 0">None visible</p>';}
    else items.forEach(m=>{
      html+=`<button class="cc${m.N?' is-new':''}" data-c="${m.c}"
        ${m.lk?`onclick="window.open('${m.lk}','_blank','noopener')"`:''} 
        aria-label="${m.T}${m.lk?' — opens source':''}"
      ><div class="ccdate">${m.d} · ${srcBadge(m.src)}</div>
      <div class="cctit">${m.T}</div>
      <div class="ccsig">${m.S}</div></button>`;
    });
    html+=`</section>`;
  });
  html+='</div>';p.innerHTML=html;
}

/* ══════════════ STATE ══════════════ */
let curF='all',curV='t',curS='',curSrc='all';
function visible(){
  let r=M;
  if(curF!=='all') r=r.filter(m=>m.c===curF);
  if(curSrc!=='all') r=r.filter(m=>m.src===curSrc);
  if(curS){const t=curS.toLowerCase();r=r.filter(m=>m.T.toLowerCase().includes(t)||m.S.toLowerCase().includes(t));}
  return r;
}
function update(){
  const v=visible();
  document.getElementById('rc').innerHTML=`<strong>${v.length}</strong> shown`;
  const fl=curF==='all'?'all categories':CAT[curF]||curF;
  const sl=curSrc==='all'?'':' from '+(SRC[curSrc]||curSrc);
  document.getElementById('status').textContent=`Showing ${v.length} moments${curF!=='all'?' in '+fl:''}${sl}${curS?' matching "'+curS+'"':''}.`;
  if(curV==='t') renderTimeline(v);
  else if(curV==='g') renderGrid(v);
  else renderColumns(v);
}

    if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();fbtns[(i+1)%fbtns.length].focus();}
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();fbtns[(i-1+fbtns.length)%fbtns.length].focus();}
  });
});

/* ── Source filter ── */
const sfbtns=[...document.querySelectorAll('#sfgrp .f-btn')];
sfbtns.forEach((btn,i)=>{
  btn.addEventListener('click',()=>{
    curSrc=btn.dataset.sf;
    sfbtns.forEach(b=>b.setAttribute('aria-checked',String(b.dataset.sf===curSrc)));
    update();
  });
  btn.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();sfbtns[(i+1)%sfbtns.length].focus();}
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();sfbtns[(i-1+sfbtns.length)%sfbtns.length].focus();}
  });
});

/* ── View tabs ── */
const vtabs=[...document.querySelectorAll('.v-tab')];
vtabs.forEach((tab,i)=>{
  const v=tab.id.replace('tab-','');
  tab.addEventListener('click',()=>setView(v));
  tab.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){e.preventDefault();const n=vtabs[(i+1)%vtabs.length];n.click();n.focus();}
    if(e.key==='ArrowLeft'){e.preventDefault();const n=vtabs[(i-1+vtabs.length)%vtabs.length];n.click();n.focus();}
  });
});
function setView(v){
  curV=v;
  vtabs.forEach(t=>t.setAttribute('aria-selected',String(t.id===`tab-${v}`)));
  ['t','g','c'].forEach(k=>{
    const pan=document.getElementById(`panel-${k}`);
    k===v?pan.removeAttribute('hidden'):pan.setAttribute('hidden','');
  });
  update();
}

/* ── Search ── */
const srchIn=document.getElementById('srchIn'),srchX=document.getElementById('srchX');
let srchT;
srchIn.addEventListener('input',()=>{
  clearTimeout(srchT);
  srchT=setTimeout(()=>{curS=srchIn.value.trim();srchX.classList.toggle('on',curS.length>0);update();},200);
});
srchX.addEventListener('click',()=>{srchIn.value='';curS='';srchX.classList.remove('on');srchIn.focus();update();});

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==srchIn&&document.activeElement.tagName!=='INPUT'){
    e.preventDefault();srchIn.focus();srchIn.select();return;
  }
  if(e.key==='Escape'){
    if(curS){srchIn.value='';curS='';srchX.classList.remove('on');update();srchIn.focus();}
    else{const o=document.querySelector('.card[aria-expanded=true]');if(o){collapseCard(o);o.focus();}}
  }
});

paintStaticCounts();
update();
</script>
</body>
</html>
