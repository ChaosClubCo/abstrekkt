<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperGem Pro | Persistent Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap');
        
        :root {
            --primary: #4f46e5;
            --bg-main: #f8fafc;
            --border: #e2e8f0;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: #1e293b; overflow-x: hidden; }
        .code-font { font-family: 'Fira Code', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid var(--border); }
        
        .pa-card { transition: all 0.2s ease; border: 1px solid var(--border); }
        .pa-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-color: var(--primary); }
        .pa-card.selected { border: 2px solid var(--primary); background-color: #f5f3ff; }

        .strength-meter { height: 4px; border-radius: 2px; transition: all 0.4s ease; }
        .status-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Toast Animations */
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast { animation: slideInUp 0.3s ease forwards; }
        .toast.hiding { animation: fadeOut 0.3s ease forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel px-6 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center text-white">
                    <span class="material-symbols-outlined text-sm">terminal</span>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold text-slate-900 leading-none">SuperGem <span class="text-indigo-600">PRO</span></h1>
                    <p class="text-[9px] uppercase tracking-widest text-slate-500 font-bold mt-1">v3.0 Local State</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div id="batchStats" class="flex items-center gap-3 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                    <span class="text-xs font-bold text-slate-600"><span id="batchCount">0</span> Queued</span>
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-full text-[10px] font-bold transition-all flex items-center gap-1 disabled:opacity-50" onclick="downloadBatchZip()" id="btnDownload">
                        <span class="material-symbols-outlined text-[14px]">folder_zip</span> Export
                    </button>
                    <button class="text-slate-400 hover:text-red-500 transition-colors" onclick="clearBatch()" title="Clear Batch">
                        <span class="material-symbols-outlined text-sm">delete</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Sidebar: Templates & Variables (4 Cols) -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            
            <!-- Dynamic Variable Extraction -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xs font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                        <span class="material-symbols-outlined text-sm text-amber-500">data_object</span>
                        Variables Detected
                    </h2>
                    <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded font-bold text-slate-500" id="varCount">0</span>
                </div>
                <div id="variableList" class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar">
                    <p class="text-xs text-slate-400 italic">No &lt;placeholders&gt; detected in input.</p>
                </div>
            </section>

            <!-- Template Library -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-grow flex flex-col">
                <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                        <span class="material-symbols-outlined text-indigo-500 text-sm">database</span>
                        Template Base
                    </h3>
                </div>
                <div class="p-4 space-y-3 flex-grow overflow-y-auto custom-scrollbar h-[400px]" id="templateGrid">
                    <!-- JS Injected -->
                </div>
            </section>
        </div>

        <!-- Center Workspace (5 Cols) -->
        <div class="lg:col-span-5 space-y-6">
            
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-full">
                <div class="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50/50">
                    <h2 class="text-xs font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                        <span class="material-symbols-outlined text-sm text-indigo-500">edit_note</span> Editor
                    </h2>
                    <button class="text-[10px] font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 bg-indigo-50 px-2 py-1 rounded" onclick="sanitizeInput()">
                        <span class="material-symbols-outlined text-[12px]">cleaning_services</span> Sanitize
                    </button>
                </div>

                <div class="p-4 flex-grow flex flex-col gap-4">
                    <textarea 
                        id="mainInput" 
                        class="w-full flex-grow h-64 p-3 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none code-font custom-scrollbar resize-none"
                        placeholder="Select a template or paste input..."
                    ></textarea>

                    <!-- Quality Audit -->
                    <div class="bg-slate-50 rounded-lg p-3 border border-slate-100">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Input Quality</span>
                            <span id="strengthText" class="status-pill bg-slate-200 text-slate-600">Idle</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-1.5 mb-3">
                            <div id="strengthMeter" class="strength-meter w-0 bg-slate-400"></div>
                        </div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-400">
                            <span id="statGoal" class="flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">cancel</span> GOAL</span>
                            <span id="statContext" class="flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">cancel</span> CONTEXT</span>
                            <span id="statConst" class="flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">cancel</span> CONSTRAINTS</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <select id="engineSel" class="w-full bg-white border border-slate-200 rounded text-xs font-bold p-2 outline-none">
                            <option value="FirstPrinciples">FirstPrinciples</option>
                            <option value="ChainOfThought">ChainOfThought</option>
                            <option value="TreeOfThoughts">TreeOfThoughts</option>
                            <option value="SelfCriticism">SelfCriticism</option>
                            <option value="ReActLoop">ReActLoop</option>
                        </select>
                        <select id="frameworkSel" class="w-full bg-white border border-slate-200 rounded text-xs font-bold p-2 outline-none">
                            <option value="RISEN">RISEN</option>
                            <option value="CO-STAR">CO-STAR</option>
                            <option value="RACE">RACE</option>
                            <option value="TRACE">TRACE</option>
                        </select>
                    </div>

                    <button class="w-full bg-slate-900 hover:bg-black text-white py-3 rounded-lg font-bold flex items-center justify-center gap-2 transition-colors" onclick="compileAndQueue()">
                        <span class="material-symbols-outlined text-sm">add_to_queue</span>
                        Compile & Add to Batch
                    </button>
                </div>
            </section>
        </div>

        <!-- Right Sidebar: The Batch Queue (3 Cols) -->
        <div class="lg:col-span-3 flex flex-col gap-6">
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full min-h-[500px]">
                <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                        <span class="material-symbols-outlined text-emerald-500 text-sm">list_alt</span>
                        Compiled Queue
                    </h3>
                </div>
                
                <div id="batchList" class="p-3 space-y-3 overflow-y-auto custom-scrollbar flex-grow bg-slate-50/30">
                    <div id="emptyBatchState" class="text-center py-10">
                        <span class="material-symbols-outlined text-4xl text-slate-300 mb-2">inbox</span>
                        <p class="text-xs text-slate-400 font-medium">Queue is empty</p>
                    </div>
                    <!-- Batch items injected here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <script>
        const templates = [
            { id: "1", title: "Repo Audit (Prod-Ready)", content: "GOAL: Audit the repository I provide, identify production gaps, and output a prioritized roadmap.\nCONTEXT:\n- Platform: GitHub repo\n- Audience: senior engineering\nCONSTRAINTS:\n- No breaking changes\n- Do not request secrets (<GITHUB_TOKEN>)\nINPUTS:\n- Paste: README.md, package.json\nOUTPUT NEEDS:\n- Markdown\nMODE SWITCHES:\n- ReasoningEngine=TreeOfThoughts\n- Framework=RISEN" },
            { id: "2", title: "PRD + MVP Scope Lock", content: "GOAL: Convert rough feature notes into a complete PRD with MVP scope lock.\nCONTEXT:\n- Product type: B2B SaaS\n- Target: spec-driven development\nCONSTRAINTS:\n- Defer non-essential items\n- Include <ANALYTICS_TOOL> considerations\nINPUTS:\n- Paste: feature notes\nOUTPUT NEEDS:\n- Markdown\nMODE SWITCHES:\n- ReasoningEngine=FirstPrinciples\n- Framework=CO-STAR" },
            { id: "3", title: "API Contract + Schemas", content: "GOAL: Produce a stable API contract for a feature including JSON Schemas.\nCONTEXT:\n- Consumers: web app\nCONSTRAINTS:\n- Use consistent error envelope\n- Include auth model via <AUTH_PROVIDER>\nINPUTS:\n- Paste: feature description\nOUTPUT NEEDS:\n- JSONOnly\nMODE SWITCHES:\n- ReasoningEngine=SkeletonOfThought\n- Framework=RTF" },
            { id: "4", title: "Security Threat Model", content: "GOAL: Create a threat model for the described app, output mitigations.\nCONTEXT:\n- Goal: reduce real-world risk\nCONSTRAINTS:\n- Practical controls only\n- Check against <COMPLIANCE_STANDARD>\nINPUTS:\n- Paste: architecture notes\nOUTPUT NEEDS:\n- Markdown\nMODE SWITCHES:\n- ReasoningEngine=SelfCriticism\n- Framework=TRACE" }
        ];

        let compiledBatch = [];

        // Core Init
        function init() {
            renderTemplates();
            loadState();
            setupInputListener();
        }

        // Render Templates
        function renderTemplates() {
            const grid = document.getElementById('templateGrid');
            templates.forEach(t => {
                const card = document.createElement('div');
                card.className = "pa-card p-3 rounded-lg cursor-pointer bg-white group";
                card.onclick = () => loadTemplateToEditor(t);
                card.innerHTML = `
                    <h4 class="text-xs font-bold text-slate-800 group-hover:text-indigo-600 transition-colors truncate">${t.title}</h4>
                    <p class="text-[10px] text-slate-500 mt-1 line-clamp-2">${t.content.split('\n')[0].replace('GOAL:', '').trim()}</p>
                `;
                grid.appendChild(card);
            });
        }

        function loadTemplateToEditor(t) {
            document.getElementById('mainInput').value = t.content;
            
            const engineMatch = t.content.match(/ReasoningEngine=(.*)/);
            if (engineMatch) document.getElementById('engineSel').value = engineMatch[1].trim();
            
            const frameworkMatch = t.content.match(/Framework=(.*)/);
            if (frameworkMatch) document.getElementById('frameworkSel').value = frameworkMatch[1].trim();

            triggerInputAnalysis();
        }

        // Listener for dynamic updates
        function setupInputListener() {
            document.getElementById('mainInput').addEventListener('input', triggerInputAnalysis);
        }

        function triggerInputAnalysis() {
            analyzePromptStrength();
            extractVariables();
        }

        // Auto-extract Variables (<...>)
        function extractVariables() {
            const text = document.getElementById('mainInput').value;
            const varList = document.getElementById('variableList');
            const varCount = document.getElementById('varCount');
            
            // Regex matches <Word> or <WORD_WORD>
            const regex = /<([a-zA-Z0-9_]+)>/g;
            const matches = [...new Set(Array.from(text.matchAll(regex), m => m[1]))];

            varCount.innerText = matches.length;

            if (matches.length === 0) {
                varList.innerHTML = '<p class="text-[10px] text-slate-400 italic">No &lt;placeholders&gt; detected.</p>';
                return;
            }

            varList.innerHTML = matches.map(m => `
                <div class="flex items-center gap-2 text-[10px] bg-amber-50 text-amber-800 px-2 py-1.5 rounded border border-amber-100 font-mono">
                    <span class="material-symbols-outlined text-[12px]">data_object</span>
                    ${m}
                </div>
            `).join('');
        }

        // Quality Analysis
        function analyzePromptStrength() {
            const text = document.getElementById('mainInput').value;
            const meter = document.getElementById('strengthMeter');
            const stText = document.getElementById('strengthText');
            
            let score = 0;
            const hasGoal = /GOAL:/i.test(text) && text.split(/GOAL:/i)[1]?.length > 10;
            const hasContext = /CONTEXT:/i.test(text) && text.split(/CONTEXT:/i)[1]?.length > 10;
            const hasConst = /CONSTRAINTS:/i.test(text) && text.split(/CONSTRAINTS:/i)[1]?.length > 10;

            const updateIcon = (id, valid) => {
                const icon = document.getElementById(id).querySelector('span.material-symbols-outlined');
                if (valid) {
                    icon.innerText = "check_circle";
                    icon.className = "material-symbols-outlined text-emerald-500 text-[12px] mt-1";
                    score += 33.3;
                } else {
                    icon.innerText = "cancel";
                    icon.className = "material-symbols-outlined text-slate-300 text-[12px] mt-1";
                }
            };

            updateIcon('statGoal', hasGoal);
            updateIcon('statContext', hasContext);
            updateIcon('statConst', hasConst);

            meter.style.width = `${score}%`;
            
            if (score < 40) {
                stText.innerText = "Weak"; stText.className = "status-pill bg-red-100 text-red-600"; meter.className = "strength-meter bg-red-500";
            } else if (score < 80) {
                stText.innerText = "Average"; stText.className = "status-pill bg-yellow-100 text-yellow-600"; meter.className = "strength-meter bg-yellow-500";
            } else {
                stText.innerText = "Ready"; stText.className = "status-pill bg-emerald-100 text-emerald-600"; meter.className = "strength-meter bg-emerald-500";
            }
        }

        // Input Sanitizer
        function sanitizeInput() {
            let text = document.getElementById('mainInput').value;
            text = text.replace(/\n\s*\n/g, '\n\n'); // normalize newlines
            text = text.trim();
            document.getElementById('mainInput').value = text;
            triggerInputAnalysis();
            showToast("Input sanitized successfully.", "success");
        }

        // Compilation & State
        function compileAndQueue() {
            const raw = document.getElementById('mainInput').value.trim();
            if (!raw) {
                showToast("Cannot compile empty input.", "error");
                return;
            }

            const engine = document.getElementById('engineSel').value;
            const framework = document.getElementById('frameworkSel').value;
            const id = Date.now().toString();

            // Extract title from GOAL if present
            let titleMatch = raw.match(/GOAL:\s*(.*?)\n/i);
            let title = titleMatch ? titleMatch[1].substring(0, 30) + "..." : `Custom Prompt ${id.slice(-4)}`;

            const compiledText = `ROLE:
You are an Elite Execution Agent.

PRIME DIRECTIVE:
Operationalize the GOAL below.

REASONING:
- Engine: ${engine}
- Framework: ${framework}

INPUT:
${raw.split('MODE SWITCHES')[0].trim()}

SAFETY:
- Replace <PLACEHOLDERS> safely.
- Output is correct only if all CONSTRAINTS are verified.`;

            compiledBatch.push({ id, title, engine, framework, content: compiledText });
            
            saveState();
            renderBatch();
            showToast(`"${title}" added to queue.`, "success");
        }

        function removeBatchItem(id) {
            compiledBatch = compiledBatch.filter(item => item.id !== id);
            saveState();
            renderBatch();
            showToast("Item removed from queue.", "info");
        }

        function clearBatch() {
            if(compiledBatch.length === 0) return;
            compiledBatch = [];
            saveState();
            renderBatch();
            showToast("Queue cleared.", "info");
        }

        function renderBatch() {
            const list = document.getElementById('batchList');
            const empty = document.getElementById('emptyBatchState');
            
            document.getElementById('batchCount').innerText = compiledBatch.length;
            document.getElementById('btnDownload').disabled = compiledBatch.length === 0;

            if (compiledBatch.length === 0) {
                list.innerHTML = '';
                list.appendChild(empty);
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = '';

            compiledBatch.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-lg border border-slate-200 shadow-sm relative group";
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h4 class="text-[11px] font-bold text-slate-800 pr-6 leading-tight">${item.title}</h4>
                        <button class="absolute top-2 right-2 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity" onclick="removeBatchItem('${item.id}')">
                            <span class="material-symbols-outlined text-[14px]">close</span>
                        </button>
                    </div>
                    <div class="flex gap-1 mt-2">
                        <span class="text-[8px] bg-slate-100 text-slate-500 px-1 py-0.5 rounded">${item.engine}</span>
                        <span class="text-[8px] bg-indigo-50 text-indigo-500 px-1 py-0.5 rounded">${item.framework}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // Export ZIP
        async function downloadBatchZip() {
            if (compiledBatch.length === 0) return;

            const zip = new JSZip();
            const folder = zip.folder("SuperGem_Pro_Export");

            compiledBatch.forEach(item => {
                const filename = `${item.framework}_${item.engine}_${item.id.slice(-4)}.md`;
                folder.file(filename, item.content);
            });

            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `SuperGem_Batch_${new Date().getTime()}.zip`);
            showToast(`Exported ${compiledBatch.length} prompts to ZIP.`, "success");
        }

        // Local Storage Persistence
        function saveState() {
            try {
                localStorage.setItem('superGemBatch', JSON.stringify(compiledBatch));
            } catch (e) {
                console.error("Local storage error", e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('superGemBatch');
                if (saved) {
                    compiledBatch = JSON.parse(saved);
                    if(compiledBatch.length > 0) {
                        showToast(`Restored ${compiledBatch.length} items from previous session.`, "info");
                    }
                }
            } catch (e) {
                console.error("Local storage load error", e);
            }
            renderBatch();
        }

        // Non-blocking Toast System
        function showToast(message, type = "info") {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let icon = "info";
            let colorClass = "bg-slate-800 text-white";
            
            if (type === "success") { icon = "check_circle"; colorClass = "bg-emerald-600 text-white"; }
            if (type === "error") { icon = "error"; colorClass = "bg-red-600 text-white"; }

            toast.className = `toast flex items-center gap-2 px-4 py-3 rounded-lg shadow-xl text-sm font-medium ${colorClass}`;
            toast.innerHTML = `
                <span class="material-symbols-outlined text-[18px]">${icon}</span>
                ${message}
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Start
        init();
    </script>
</body>
</html>
