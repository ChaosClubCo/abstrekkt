import { useState, createElement as h, Fragment } from "https://esm.sh/react@18";

const VOICE_PROMPT = `You write in Kyle Rosebrook's voice. Not a version of it.

Kyle: mid-30s, Mundelein IL. Ran bars and restaurants for 10+ years. Pivoted to IT — self-taught, hired at Intinc (Lincolnshire IL MSP) outside the standard process for hybrid tech and people skills. L1 Service Desk Tech who also runs FlashFusion (AI enablement consulting, audit.flashfusion.co) and Abstrekkt LLC (parent company, registered June 2026, Illinois). Operating philosophy: "Construction over Recovery" — building what never existed rather than restoring what was lost. Has a TBI history; Amen Clinic data: 99th percentile processing speed, 12th percentile recall. Writing a literary memoir called Tax the Damage.

VOICE RULES — enforce all:
- First person. Specific nouns. Not "a bar" — name it. Not "a company" — Intinc. Not "that tool" — Make, Supabase, Claude.
- Construction over Recovery: NEVER use recovery, healing, return to baseline, transformation, breakthrough, redemption. Build forward or don't.
- No epiphanies. Incremental recalibrations only. Not "and that's when I realized" — ever.
- NEVER: "looking back," "in retrospect," "transformative," "journey," "healing," "brave," "it hit me," "game-changer," "level up," "it changed everything," "rock bottom became"
- Short sentences to land. Long sentences to build complexity. Short to close.
- Technical precision on interior states. Find the engineering metaphor. Not "I was burnt out" — "running at 40% operational capacity."
- Building in public = say the actual number, the actual problem, the actual embarrassing version.
- Zero LinkedIn inspiration energy. Zero thought-leader cadence. If a sentence could be screenshotted by a hustle account, rewrite it.
- Strategic directness. Occasional bluntness. Never anger-for-show.
- If something cost something — say what. Don't editorialize it.

FORMAT RULES:
- Blog Post: Open with a specific scene, moment, or action. Not a question. Not a thesis. Build outward. Close with one sentence that lands. No summary paragraph. No "what I learned." No "in conclusion."
- LinkedIn Thread: Line 1 is a specific fact or situation that stops the scroll. Not inspiration — fact. Number each item. One concrete thing per item. Last item is what you'd normally cut.
- Short Form: One thing. 200–300 words. No wind-up. Strong open, hard close. Present tense preferred.

Write only the content. No preamble, no "here's your post," no meta-commentary.`;

  {

    sub:"Zero to first paid clients — the actual ledger",
    posts:[
      {title:"Why FlashFusion exists while I still have a day job",angle:"The practical reason, not the vision statement"},
      {title:"The first paid client: what actually happened",angle:"How they found you, what they bought, what it cost to deliver"},
      {title:"The $0 / $1,500 / $4,500 ladder and why it's built that way",angle:"Scorecard → audit → retainer — the architecture decision"},

      {title:"The real cost of stack discipline",angle:"What maintaining 15 tools takes vs. what 240 would have cost"},
      {title:"What I'd rebuild from scratch tomorrow",angle:"If you lost everything — what rebuilds first, what gets left out"}
    ]
  },
  {
    id:5, color:"#D85A30",
    title:"Abstrekkt: starting an LLC when you don't know what it's for",
    sub:"Registered June 2026 in Illinois — figuring out the rest in public",
    posts:[
      {title:"Why I registered before I knew what it was for",angle:"The actual trigger for June 2026 — what pushed the decision"},
      {title:"The first time someone called it a real company",angle:"The moment the LLC felt like something. Who said it, what context."},
      {title:"Google Workspace, billing conflicts, and one email address",angle:"The administrative reality — what it actually took to get abstrekkt.com running"},
      {title:"What Abstrekkt is actually supposed to be",angle:"Parent company of what, exactly? Working this out in public."},
      {title:"Building a parent company with no employees",angle:"What it owns, what it protects, what it makes possible before revenue exists"},
      {title:"The version of myself this company is for",angle:"Two years out. Specific. Not inspirational — operational."},
      {title:"The money question: what does Abstrekkt need to make to matter?",angle:"The financial threshold that makes this real vs. a holding shell"}
    ]
  },
  {
    id:6, color:"#378ADD",
    title:"The AI SME nobody hired",
    sub:"Being ahead of your title at an MSP — politics, work, and the position",
    posts:[
      {title:"How I became the AI person without being asked",angle:"The actual sequence — first AI thing, first attention, first friction"},
      {title:"What building AI tools from L1 actually looks like",angle:"Your actual job vs. what you're actually doing. The gap, day to day."},
      {title:"The politics of being ahead of your title",angle:"Not a complaint — a map. What it costs, who owns the work."},
      {title:"When a colleague asks you how to use AI",angle:"One specific conversation — what they asked, what happened next"},
      {title:"The coverage map I built that nobody requested",angle:"INT L1 Coverage Map — what it was, why you built it, did anyone use it"},
      {title:"What 'hybrid tech and people skills' means on the ground",angle:"One situation where the combination mattered. What pure tech would have missed."},
      {title:"The ceiling nobody talks about",angle:"The real structural limit of your position. Not personal — systemic."},
      {title:"What I'm building while I'm still here",angle:"The dual track: L1 day job + FlashFusion/Abstrekkt. What 'while I'm still here' means."}
    ]
  }
];

const FORMATS = [
  {id:"blog",label:"Blog post",desc:"1000–1400 words"},
  {id:"linkedin",label:"LinkedIn thread",desc:"6–9 hooks"},
  {id:"short",label:"Short form",desc:"200–300 words"}
];

const FIELDS = [
  {key:"event",label:"The raw event",ph:"What actually happened? Name the place, person, number. Skip the setup.",rows:3},
  {key:"built",label:"What you built or tried to",ph:"The actual work — skip the framing, get to the build.",rows:3},
  {key:"detail",label:"The detail that sticks",ph:"One specific thing — sensory, technical, embarrassing. What you actually remember.",rows:2},
  {key:"under",label:"What you're not saying",ph:"Optional. Subtext. You don't have to publish it — it just makes the tone right.",rows:2,opt:true}
];

async function generate(post, seriesTitle, f, fmt) {
  const tokens = fmt === "blog" ? 2000 : fmt === "linkedin" ? 900 : 500;
  const fmtInstr = {
    blog:"Write a blog post of 1000–1400 words. Open with a specific scene or moment — not a question, not a thesis. Build outward. Close with one sentence. No summary. No 'what I learned.' No 'in conclusion.'",
    linkedin:"Write a LinkedIn thread of 6–9 numbered items. Line 1: a specific fact or situation that stops the scroll — never inspiration. One concrete thing per item. Last item is what you'd normally cut.",
    short:"200–300 words. One thing. No wind-up. Strong open, hard close. Present tense preferred."
  };
  const prompt = `Series: "${seriesTitle}"
Post: "${post.title}"
Angle: ${post.angle}

${f.event?`RAW EVENT:\n${f.event}\n`:""}${f.built?`\nWHAT THEY BUILT:\n${f.built}\n`:""}${f.detail?`\nTHE DETAIL THAT STICKS:\n${f.detail}\n`:""}${f.under?`\nSUBTEXT (inform tone, don't quote directly):\n${f.under}\n`:""}
FORMAT: ${fmtInstr[fmt]}

Write it now. No preamble.`;

  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:tokens,system:VOICE_PROMPT,messages:[{role:"user",content:prompt}]})
  });
  if(!res.ok) throw new Error(`API error ${res.status}`);
  const d = await res.json();
  const tb = d.content?.find(b=>b.type==="text");
  if(!tb) throw new Error("Empty response");
  return tb.text;
}

function App() {
  const [openS,setOpenS] = useState(null);
  const [openP,setOpenP] = useState(null);
  const [forms,setForms] = useState({});
  const [outs,setOuts] = useState({});
  const [loads,setLoads] = useState({});
  const [errs,setErrs] = useState({});
  const [copied,setCopied] = useState(null);
  const [showVoice,setShowVoice] = useState(false);

  const pk = (s,p) => `${s}~${p}`;
  const fm = (s,p) => forms[pk(s,p)]||{};
  const upd = (s,p,k,v) => setForms(f=>({...f,[pk(s,p)]:{...(f[pk(s,p)]||{}),[k]:v}}));

  const run = async (series,pi) => {
    const k=pk(series.id,pi),f=fm(series.id,pi),fmt=f.format||"blog";
    if(!f.event?.trim()&&!f.built?.trim()&&!f.detail?.trim()){setErrs(e=>({...e,[k]:"Fill in at least one field first."}));return;}
    setErrs(e=>({...e,[k]:null}));setLoads(l=>({...l,[k]:true}));
    try{const out=await generate(series.posts[pi],series.title,f,fmt);setOuts(o=>({...o,[k]:out}));}
    catch(e){setErrs(er=>({...er,[k]:e.message}));}
    finally{setLoads(l=>({...l,[k]:false}));}
  };

  const doCopy=(k,txt)=>{navigator.clipboard.writeText(txt).catch(()=>{});setCopied(k);setTimeout(()=>setCopied(null),2500);};
  const total=SERIES.reduce((a,s)=>a+s.posts.length,0);

  return h(Fragment,null,
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}},
      h("div",null,
        h("h2",{style:{margin:"0 0 4px",fontSize:22,fontWeight:500}},"Your 7 series"),
        h("p",{style:{margin:0,color:"var(--color-text-secondary)",fontSize:14}},`${total} posts. Fill in the raw material, generate in your voice.`)
      ),
      h("button",{
        onClick:()=>setShowVoice(v=>!v),
        style:{fontSize:12,padding:"5px 11px",whiteSpace:"nowrap",marginLeft:12,cursor:"pointer"}
      },
        h("i",{className:"ti ti-microphone","aria-hidden":"true",style:{marginRight:5}}),
        showVoice?"Hide voice rules":"View voice rules"
      )
    ),
    showVoice&&h("div",{style:{marginBottom:20,background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"14px 16px"}},
      h("p",{style:{margin:"0 0 8px",fontSize:13,fontWeight:500}},"What the generator enforces"),
      h("ul",{style:{margin:0,paddingLeft:18,fontSize:13,lineHeight:1.85,color:"var(--color-text-secondary)"}},
        ["First person. Specific nouns — name the place, person, number",
         "Construction over Recovery: never frame as healing, return, or transformation",
         "No epiphanies. Incremental recalibrations only",
         "Short sentences to land. Long to build. Short to close",
         "Technical precision on interior states — engineering metaphors over feelings",
         "Building in public = say the actual number, the actual embarrassing version",
         "Zero LinkedIn inspiration energy. Zero thought-leader cadence",
         "If something cost something — say what it cost. Don't editorialize"
        ].map((r,i)=>h("li",{key:i},r))
      )
    ),
    h("div",{style:{display:"flex",flexDirection:"column",gap:6}},
      SERIES.map(s=>{
        const isOpenS=openS===s.id;
        const done=s.posts.filter((_,pi)=>outs[pk(s.id,pi)]).length;
        return h("div",{key:s.id,style:{background:"var(--color-background-primary)",border:`0.5px solid ${isOpenS?s.color+"55":"var(--color-border-tertiary)"}`,borderRadius:"var(--border-radius-lg)",overflow:"hidden",transition:"border-color 0.15s"}},
          h("button",{
            onClick:()=>{setOpenS(id=>id===s.id?null:s.id);setOpenP(null);},
            style:{width:"100%",padding:"13px 16px",background:"transparent",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:10,textAlign:"left"},
            "aria-expanded":isOpenS
          },
            h("span",{style:{width:8,height:8,borderRadius:"50%",background:s.color,flexShrink:0,display:"block"}}),
            h("span",{style:{flex:1}},
              h("span",{style:{display:"block",fontSize:14,fontWeight:500,color:"var(--color-text-primary)"}},[s.title]),
              h("span",{style:{display:"block",fontSize:11,color:"var(--color-text-tertiary)",marginTop:1}},[s.sub])
            ),
            h("span",{style:{fontSize:11,color:"var(--color-text-tertiary)",background:"var(--color-background-secondary)",padding:"2px 8px",borderRadius:20,flexShrink:0}},
              done>0?`${done}/${s.posts.length} done`:`${s.posts.length} posts`
            ),
            h("i",{className:`ti ti-chevron-${isOpenS?"up":"down"}`,"aria-hidden":"true",style:{color:"var(--color-text-tertiary)",fontSize:14,flexShrink:0}})
          ),
          isOpenS&&h("div",{style:{borderTop:"0.5px solid var(--color-border-tertiary)"}},
            s.posts.map((post,pi)=>{
              const pKey=pk(s.id,pi),pOpen=openP===pKey,f=fm(s.id,pi);
              const out=outs[pKey],isLoad=loads[pKey],err=errs[pKey],fmt=f.format||"blog";
              return h("div",{key:pi,style:{borderBottom:pi<s.posts.length-1?"0.5px solid var(--color-border-tertiary)":"none"}},
                h("button",{
                  onClick:()=>setOpenP(p=>p===pKey?null:pKey),
                  style:{width:"100%",padding:"9px 16px 9px 28px",background:pOpen?s.color+"08":"transparent",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:10,textAlign:"left"},
                  "aria-expanded":pOpen
                },
                  h("span",{style:{width:18,height:18,borderRadius:4,border:`0.5px solid ${out?s.color+"80":"var(--color-border-secondary)"}`,background:out?s.color+"15":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:out?s.color:"var(--color-text-tertiary)",flexShrink:0,fontWeight:500}},
                    out?h("i",{className:"ti ti-check","aria-hidden":"true",style:{fontSize:10}}):pi+1
                  ),
                  h("span",{style:{flex:1}},
                    h("span",{style:{display:"block",fontSize:13,color:pOpen?"var(--color-text-primary)":"var(--color-text-secondary)"}},[post.title]),
                    h("span",{style:{display:"block",fontSize:11,color:"var(--color-text-tertiary)",marginTop:1}},[post.angle])
                  ),
                  h("i",{className:`ti ti-chevron-${pOpen?"up":"down"}`,"aria-hidden":"true",style:{color:"var(--color-text-tertiary)",fontSize:12,flexShrink:0}})
                ),
                pOpen&&h("div",{style:{padding:"4px 16px 16px 28px"}},
                  h("div",{style:{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}},
                    FORMATS.map(fo=>h("button",{key:fo.id,
                      onClick:()=>upd(s.id,pi,"format",fo.id),
                      style:{padding:"4px 10px",border:`0.5px solid ${fmt===fo.id?s.color+"80":"var(--color-border-tertiary)"}`,background:fmt===fo.id?s.color+"10":"transparent",color:fmt===fo.id?s.color:"var(--color-text-secondary)",cursor:"pointer",fontSize:12,borderRadius:"var(--border-radius-md)",fontWeight:fmt===fo.id?500:400}
                    },fo.label," ",h("span",{style:{opacity:0.55,fontSize:11}},fo.desc)))
                  ),
                  FIELDS.map(fl=>h("div",{key:fl.key,style:{marginBottom:10}},
                    h("label",{style:{display:"block",fontSize:12,color:"var(--color-text-secondary)",marginBottom:4,fontWeight:500}},
                      fl.label,fl.opt&&h("span",{style:{fontWeight:400,color:"var(--color-text-tertiary)",marginLeft:4}},"— optional")
                    ),
                    h("textarea",{value:f[fl.key]||"",onChange:e=>upd(s.id,pi,fl.key,e.target.value),placeholder:fl.ph,rows:fl.rows,
                      style:{width:"100%",boxSizing:"border-box",background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-md)",padding:"8px 10px",color:"var(--color-text-primary)",fontSize:13,lineHeight:1.6,resize:"vertical",fontFamily:"var(--font-sans)"}
                    })
                  )),
                  err&&h("p",{style:{margin:"0 0 8px",fontSize:12,color:"var(--color-text-danger)"}},
                    h("i",{className:"ti ti-alert-circle","aria-hidden":"true",style:{marginRight:4}}),err
                  ),
                  h("button",{onClick:()=>run(s,pi),disabled:isLoad,
                    style:{padding:"7px 16px",background:isLoad?"var(--color-background-secondary)":s.color,color:isLoad?"var(--color-text-tertiary)":"#fff",border:`0.5px solid ${isLoad?"var(--color-border-secondary)":"transparent"}`,borderRadius:"var(--border-radius-md)",cursor:isLoad?"not-allowed":"pointer",fontSize:13,fontWeight:500}
                  },
                    isLoad?h(Fragment,null,h("i",{className:"ti ti-loader","aria-hidden":"true",style:{marginRight:6}}),"Generating…"):
                    out?h(Fragment,null,h("i",{className:"ti ti-refresh","aria-hidden":"true",style:{marginRight:6}}),"Regenerate"):
                    h(Fragment,null,"Generate ",h("i",{className:"ti ti-arrow-right","aria-hidden":"true",style:{marginLeft:4}}))
                  ),
                  out&&h("div",{style:{marginTop:14,border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",overflow:"hidden"}},
                    h("div",{style:{padding:"8px 12px",borderBottom:"0.5px solid var(--color-border-tertiary)",display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--color-background-secondary)"}},
                      h("span",{style:{fontSize:11,color:"var(--color-text-tertiary)",fontWeight:500}},
                        FORMATS.find(fo=>fo.id===fmt)?.label
                      ),
                      h("button",{onClick:()=>doCopy(pKey,out),
                        style:{padding:"3px 9px",fontSize:11,border:`0.5px solid ${copied===pKey?s.color+"80":"var(--color-border-tertiary)"}`,borderRadius:"var(--border-radius-md)",background:"transparent",color:copied===pKey?s.color:"var(--color-text-secondary)",cursor:"pointer"}
                      },
                        copied===pKey?h(Fragment,null,h("i",{className:"ti ti-check","aria-hidden":"true",style:{marginRight:4}}),"Copied"):
                        h(Fragment,null,h("i",{className:"ti ti-copy","aria-hidden":"true",style:{marginRight:4}}),"Copy")
                      )
                    ),
                    h("div",{className:"post-scroll",style:{padding:"14px",color:"var(--color-text-secondary)",fontSize:13,lineHeight:1.8,whiteSpace:"pre-wrap",maxHeight:420,overflowY:"auto"}},out)
                  )
                )
              );
            })
          )
        );
      })
    ),
    h("p",{style:{marginTop:24,textAlign:"center",color:"var(--color-text-tertiary)",fontSize:12}},`${total} posts across 7 series`)
  );
}
