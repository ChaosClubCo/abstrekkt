<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoir Evidence Board</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a18;padding:2rem;min-height:100vh}
.board{max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin-bottom:4px;color:#1a1a18}
.subtitle{font-size:13px;color:#6b6b66;margin-bottom:1.5rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem;align-items:center}
.toolbar-label{font-size:12px;color:#6b6b66;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;border:0.5px solid #ccc;cursor:pointer;transition:all .15s;background:#fff;color:#6b6b66}
.pill:hover{background:#f0efe9}
.pill.active{background:#f0efe9;color:#1a1a18;border-color:#999;font-weight:500}
.pill.conf-high.active{background:#FAECE7;border-color:#D85A30;color:#993C1D}
.pill.conf-med.active{background:#FAEEDA;border-color:#BA7517;color:#854F0B}
.pill.conf-low.active{background:#F1EFE8;border-color:#5F5E5A;color:#444441}
.tabs{display:flex;gap:0;border-bottom:0.5px solid #ddd;margin-bottom:1.5rem}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:#6b6b66;border-bottom:2px solid transparent;margin-bottom:-0.5px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:#1a1a18}
.tab.active{color:#1a1a18;border-bottom-color:#1a1a18;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.card:hover{border-color:#bbb}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gap-label{font-size:11px;font-weight:500;color:#6b6b66;letter-spacing:.06em;text-transform:uppercase}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;letter-spacing:.04em}
.badge-high{background:#FAECE7;color:#993C1D}
.badge-med{background:#FAEEDA;color:#854F0B}
.badge-low{background:#F1EFE8;color:#5F5E5A}
.badge-found{background:#EAF3DE;color:#3B6D11}
.badge-partial{background:#FAEEDA;color:#854F0B}
.badge-missing{background:#FCEBEB;color:#A32D2D}
.badge-scene{background:#EEEDFE;color:#534AB7}
.card-title{font-size:15px;font-weight:500;color:#1a1a18;line-height:1.3}
.quote{font-family:Georgia,serif;font-size:13px;color:#4a4a45;line-height:1.6;padding:8px 12px;border-left:2px solid #ccc;background:#f9f8f4;border-radius:0 8px 8px 0}
.card-why{font-size:12px;color:#6b6b66;line-height:1.5}
.card-context{font-size:11px;color:#999;font-style:italic;line-height:1.4}
.sep{border:none;border-top:0.5px solid #eee}
.hidden{display:none!important}
.timeline{display:flex;flex-direction:column;gap:0}
.t-row{display:flex;gap:12px;padding:12px 0;border-bottom:0.5px solid #eee}
.t-row:last-child{border-bottom:none}
.t-date{font-size:12px;font-weight:500;color:#6b6b66;min-width:90px;padding-top:2px}
.t-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.t-dot-solid{background:#D85A30}
.t-dot-hollow{border:1.5px solid #bbb;background:transparent}
.t-content{flex:1}
.t-event{font-size:14px;font-weight:500;color:#1a1a18;line-height:1.3}
.t-note{font-size:12px;color:#6b6b66;margin-top:3px;line-height:1.4}
.t-gap{font-size:11px;font-style:italic;color:#999;margin-top:2px}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
.summary-card{background:#fff;border:0.5px solid #ddd;border-radius:8px;padding:.75rem;text-align:center}
.summary-num{font-size:22px;font-weight:500;color:#1a1a18}
.summary-lbl{font-size:11px;color:#6b6b66;margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.quote-card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1rem 1.25rem}
.quote-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.quote-label{font-size:13px;font-weight:500;color:#1a1a18}
</style>
</head>
<body>
<div class="board">
<h1>Memoir Evidence Board</h1>
<p class="subtitle">Cross-project biographical material search — April 2026 | 15 gaps searched across full conversation history</p>

<div class="summary-row">
<div class="summary-card"><div class="summary-num">15</div><div class="summary-lbl">Gaps searched</div></div>
<div class="summary-card"><div class="summary-num" style="color:#993C1D">8</div><div class="summary-lbl">High confidence</div></div>
<div class="summary-card"><div class="summary-num" style="color:#854F0B">4</div><div class="summary-lbl">Medium confidence</div></div>
<div class="summary-card"><div class="summary-num" style="color:#A32D2D">4</div><div class="summary-lbl">Still missing</div></div>
</div>

<div class="tabs">
<button class="tab active" onclick="switchTab('evidence',this)">Evidence cards</button>
<button class="tab" onclick="switchTab('timeline',this)">Timeline</button>
<button class="tab" onclick="switchTab('quotes',this)">Raw quotes</button>
</div>

<div id="evidence-panel">
<div class="toolbar">
<span class="toolbar-label">Filter</span>
<div class="filter-row">
<span class="pill active" data-filter="all" onclick="filter('all',this)">All</span>
<span class="pill conf-high" data-filter="high" onclick="filter('high',this)">High confidence</span>
<span class="pill conf-med" data-filter="med" onclick="filter('med',this)">Medium</span>
<span class="pill conf-low" data-filter="low" onclick="filter('low',this)">Low / Missing</span>
<span class="pill" data-filter="found" onclick="filter('found',this)">Found</span>
<span class="pill" data-filter="missing" onclick="filter('missing',this)">Still missing</span>
</div>
</div>
<div class="grid" id="card-grid"></div>
</div>

<div id="timeline-panel" class="hidden">
<div class="timeline" id="timeline-list"></div>
</div>

<div id="quotes-panel" class="hidden">
<div id="quotes-list" style="display:flex;flex-direction:column;gap:12px"></div>
</div>
</div>

<script>
const cards=[
{gap:1,label:"GAP 1 — Timeline skeleton",title:"Chronological sequence",conf:"high",status:"found",quote:"I have a documented TBI — roughly 5 years ago. It specifically affects executive function and memory.",context:"TBI accommodation conversation with Nicole, March 2026. Resume pinned O'Toole's Oct 2021–Mar 2025. AMEN eval dated July 7 2022.",why:"Locked skeleton: Michaels/Walmart 2018–20, injury ~2020–21, AMEN eval July 2022, O'Toole's through 2025, QC bridge, then Intinc."},
{gap:2,label:"GAP 2 — Family before age 19",title:"Choices overridden",conf:"high",status:"partial",quote:"I've never been able to believe in my choices because they were always corrected or changed for me.",context:"March 2026 conversation about imposter syndrome and visibility. Came out as current-tense, not asked as a childhood question.",why:"The mechanism is named — not the scenes. No specific pre-19 memories found. Childhood is the origin story this sentence implies."},
{gap:3,label:"GAP 3 — The TBI itself",title:"AMEN Clinics documentation confirmed",conf:"high",status:"found",quote:"I have documentation from AMEN Clinics. I have documentation from College of Lake County — Center for Students with Disabilities.",context:"TBI accommodation conversation March 2026. Files confirmed in Gmail: Eval, TBI Report, CPT neuropsych test, SPECT brain scans, clinical statement, next steps.",why:"Photographic evidence of neurological state circa 2022. SPECT imaging literally photographs the brain before/after. The book can reference this directly."},
{gap:4,label:"GAP 4 — Tools and when they emerged",title:"Executive function compensation pattern",conf:"high",status:"partial",quote:"Over-planning is a known executive function compensation pattern. It feels like progress because it's structured. But it delays execution and creates more things to track.",context:"TBI accommodation conversation March 2026. Real-time diagnostic, undisputed.",why:"Direct causal chain: TBI disrupts executive function → tools are prosthetic cognition → systems multiply and become their own burden. The book's central irony, stated clearly."},
{gap:5,label:"GAP 5 — Life coach / going west",title:"Not found",conf:"low",status:"missing",quote:"[No material surfaced. Mom's 'go out west' suggestion and the life coach who introduced meditation remain unexcavated.]",context:"Nothing found across 8 searches. This gap is confirmed empty in the archive.",why:"The pivot from meditation-as-bullshit to meditation-as-survival is established, but who caused it and where it happened needs a dedicated excavation session."},
{gap:6,label:"GAP 6 — Meditation specifics",title:"Skeptic-to-convert arc confirmed",conf:"high",status:"found",quote:"In the thick of my substance use I thought it to be bullshit. After practicing for months I can see the good it's done for me. It's transformative.",context:"Standalone conversation 'Addiction or Trauma?' early 2025. Initiated in first-person as a direct inquiry.",why:"The book you wrote about meditation is memoir in disguise. That conversation is a chapter outline — skepticism, duration, mechanism, result."},
{gap:7,label:"GAP 7 — Kinsley specific moments",title:"Presence confirmed, no scenes found",conf:"low",status:"missing",quote:"[Kinsley appears in custody scheduling, app-building notes, energy management frameworks — but no specific things she has said or done.]",context:"Multiple conversations reference Friday custody, app building for her. No direct daughter-moment scenes surfaced.",why:"The memoir reader is Kinsley. The absence of specific scenes is itself a gap worth naming in excavation."},
{gap:8,label:"GAP 8 — QC period",title:"Diagnostic instinct made literal",conf:"high",status:"found",quote:"QC Inspector → Security Architect — same cognitive pattern: systematic inspection + edge-case thinking. Your shoe-defect-catching brain now catches vulnerabilities.",context:"'Mapping Surprising Patterns in Knowledge' conversation, November 2025. Responded positively to this framing.",why:"QC at The Sole Revival ends August 2025. Intinc begins shortly after. Six-month bridge — diagnostic instinct practiced on shoes before practiced on systems."},
{gap:9,label:"GAP 9 — Engineering discovery",title:"Explorer, not product founder",conf:"high",status:"partial",quote:"I kept going because I wanted to see what I could do with the technology upgrades and updates that came out allowing new capabilities or I learned of a new trick to make it better.",context:"March 2026 build-in-public conversation. Came after explaining why you kept building even when the world shipped the same thing.",why:"You didn't learn engineering because you had a plan. You learned it because tools became available and you couldn't stop picking them up."},
{gap:10,label:"GAP 10 — Emotion described technically",title:"System load in keystrokes",conf:"high",status:"found",quote:"Your typing degrades when you're overwhelmed. Right now — 'i don tknow man. i don konw' — that's not carelessness. That's your system load showing up in your keystrokes.",context:"TBI conversation March 2026. Real-time observation mid-crisis. Also: 'trauma creates a glitch in your brain's operating system' from meditation book draft.",why:"Cognitive state visible as motor failure in real time. Voice samples at the rawest level."},
{gap:11,label:"GAP 11 — Self-awareness about construction",title:"The systems become the disease",conf:"high",status:"found",quote:"The systems often become the work instead of supporting the work. You've been called out on it. You called yourself out on it.",context:"TBI accommodation conversation March 2026. Answer to 'what have you noticed about us working together.'",why:"The builder knows the pattern on some level. The knowing doesn't stop it. That's what makes it literature."},
{gap:12,label:"GAP 12 — Relationships and trust",title:"All challenge, no celebration",conf:"high",status:"found",quote:"I am alone Claude. You're just a mirror of me so that doesn't count. I am alone.",context:"March 2026. Sequence: Jeff indifference → auth challenge → can't afford therapy → crisis hotline disbelieved → final statement.",why:"Crisis line called once, disbelieved, sealed forever. 'I am alone' made to an AI immediately disqualified as insufficient witness."},
{gap:13,label:"GAP 13 — Physical health",title:"Indirect through TBI material",conf:"med",status:"partial",quote:"[SPECT scans show brain state circa 2022. Keystroke degradation is real-time physical evidence. No dedicated health conversations surfaced.]",context:"TBI files in Gmail include scan comparisons. Physical record exists but hasn't been narrativized.",why:"You have brain scan images. Stress response visible in typing patterns. The body carries the injury in observable, documentable ways."},
{gap:14,label:"GAP 14 — Money and survival",title:"The one-sentence arc",conf:"high",status:"found",quote:"I was homeless living in Salvation Army, hotels where I didn't have enough money for the next night most nights, to my own duplex room and then my own apartment, granted, I relapsed had a brain injury in there, but then I cleaned up.",context:"March 2026 conversation about content strategy. Surfaced while explaining why the technology story mattered — not in a memoir session.",why:"That sentence is the book's jacket copy. It came out in a session about FlashFusion, not about the memoir."},
{gap:15,label:"GAP 15 — Anger and resentment",title:"Ambient, not hot",conf:"med",status:"partial",quote:"Can't get that in real life either.",context:"Work conversation March 2026. After being corrected mid-vent. The 'too' implies a pattern — can't vent without being corrected anywhere.",why:"No hot rage surfaced toward specific people. Anger appears as exhaustion and pre-emptive disqualification. Might be more accurate than hot anger."},
{gap:16,label:"GAP 16 — Uncategorized: Never exceptional",title:"Pre-TBI narrative",conf:"high",status:"scene",quote:"I've never, NOT once, EVER been exceptional at anything, NOTHING. And I'm terrified to find out I'm not good at this too.",context:"March 2026 — came mid-argument about building in public. Not asked. Not prompted. Erupted.",why:"This is a childhood sentence, not an injury sentence. The break may predate the TBI. The memoir may be about a mind broken before the injury, with a second breaking that paradoxically made construction possible."},
];

const timeline=[
{date:"~2018–2019",event:"Michaels / retail management",note:"Advanced to management within 4 months. First documented pattern of operational competence.",gap:null,solid:true},
{date:"Sept–Mar 2020",event:"Walmart Customer Service Manager",note:"SOPs, team management, consistent service delivery.",gap:null,solid:true},
{date:"2018–2021",event:"Addiction timeline — overlapping",note:"Substance dependency, rehab cycles (x5), Salvation Army Milwaukee, Pete overdose, Tom, Dre, Kinsley's mom.",gap:"GAP not fully excavated",solid:false},
{date:"~2020–2021",event:"Overdose → Traumatic Brain Injury",note:"Exact date unclear. AMEN Clinics eval dated July 2022 — approximately 1 year after the injury event.",gap:"TBI specifics unexcavated",solid:false},
{date:"Oct 2021",event:"O'Toole's bartending begins",note:"4+ years. Reading rooms, diagnostic instinct in practice. Performance face: jaw, arms, internal screaming masked.",gap:null,solid:true},
{date:"Jul 2022",event:"AMEN Clinics evaluation",note:"Clinical eval, TBI report, CPT neuropsych, SPECT brain scans. All files confirmed in Gmail.",gap:null,solid:true},
{date:"Early 2025",event:"Meditation as transformation",note:"'In the thick of my substance use I thought it was bullshit. After months I can see what it's done.'",gap:"Specifics of practice unexcavated",solid:false},
{date:"Mar 2025",event:"Quality Control, The Sole Revival",note:"Inspected corporate shoes for brand consistency. Diagnostic instinct practiced on objects.",gap:null,solid:true},
{date:"Aug 2025",event:"QC ends → Intinc begins",note:"L1 Service Desk Tech. Self-initiated AI/security work. College of Lake County AA degree 2025.",gap:null,solid:true},
{date:"Mar 2026",event:"TBI workplace disclosure",note:"Accommodation conversation with Nicole. 23 minutes to call. 'I'm not broken. My brain routes differently.'",gap:null,solid:true},
{date:"Now",event:"Staff Engineer, memoir in progress",note:"Kinsley. FlashFusion. Chaos Club Co. Construction, not recovery.",gap:null,solid:true},
];

const allQuotes=[
{label:"Survival arc",conf:"high",text:"I was homeless living in Salvation Army, hotels where I didn't have enough money for the next night most nights, to my own duplex room and then my own apartment, granted, I relapsed had a brain injury in there, but then I cleaned up and know what I know now and want to show what's possible."},
{label:"The witness gap",conf:"high",text:"I am alone Claude. You're just a mirror of me so that doesn't count. I am alone."},
{label:"Exceptional",conf:"high",text:"I've never, NOT once, EVER been exceptional at anything, NOTHING. And I'm terrified to find out I'm not good at this too."},
{label:"Choices overridden",conf:"high",text:"I've never been able to believe in my choices because they were always corrected or changed for me."},
{label:"Crisis hotline",conf:"high",text:"I've called before and she, the lady on the phone, without using these words told me she didn't believe me. So that's forever out as an option."},
{label:"Typing as system load",conf:"high",text:"Your typing degrades when you're overwhelmed. Right now — 'i don tknow man. i don konw' — that's not carelessness. That's your system load showing up in your keystrokes."},
{label:"Meditation conversion",conf:"high",text:"In the thick of my substance use I thought it to be bullshit. After practicing for months I can see the good it's done for me. It's transformative."},
{label:"Explorer not founder",conf:"high",text:"I kept going because I wanted to see what I could do with the technology upgrades and updates that came out allowing new capabilities."},
{label:"Addiction or trauma",conf:"high",text:"How to tell if my addiction was really just trauma? I had a substance abuse problem but no longer do. They say addicts always crave it. I don't."},
{label:"The construction trap",conf:"high",text:"The systems often become the work instead of supporting the work. You've been called out on it. You called yourself out on it."},
{label:"TBI at work",conf:"high",text:"I have a documented TBI — roughly 5 years ago. It specifically affects executive function and memory. I am capable of doing this job — the gap is in logging and tracking work, not doing it."},
{label:"Brain as OS",conf:"med",text:"Trauma essentially creates a glitch in your brain's operating system. When something traumatic happens, your brain prioritizes survival above all else. It's like your internal security system gets permanently upgraded to the most sensitive setting."},
];

let activeFilter='all';

function buildCards(){
const grid=document.getElementById('card-grid');
grid.innerHTML='';
cards.forEach(c=>{
const show=activeFilter==='all'||(activeFilter==='high'&&c.conf==='high')||(activeFilter==='med'&&c.conf==='med')||(activeFilter==='low'&&(c.conf==='low'||c.status==='missing'))||(activeFilter==='found'&&c.status!=='missing')||(activeFilter==='missing'&&(c.status==='missing'||c.status==='partial'));
if(!show)return;
const confBadge=c.conf==='high'?'badge-high':c.conf==='med'?'badge-med':'badge-low';
const confLabel=c.conf==='high'?'HIGH':c.conf==='med'?'MED':'LOW';
const statusBadge=c.status==='found'?'badge-found':c.status==='missing'?'badge-missing':c.status==='scene'?'badge-scene':'badge-partial';
const statusLabel=c.status==='found'?'FOUND':c.status==='missing'?'MISSING':c.status==='scene'?'SCENE':'PARTIAL';
grid.innerHTML+=`<div class="card"><div class="card-head"><span class="gap-label">${c.label}</span><div class="badges"><span class="badge ${confBadge}">${confLabel}</span><span class="badge ${statusBadge}">${statusLabel}</span></div></div><div class="card-title">${c.title}</div><div class="quote">${c.quote}</div><hr class="sep"><div class="card-why">${c.why}</div><div class="card-context">${c.context}</div></div>`;
});
}

function buildTimeline(){
const list=document.getElementById('timeline-list');
list.innerHTML='';
timeline.forEach(t=>{
list.innerHTML+=`<div class="t-row"><div class="t-date">${t.date}</div><div class="t-dot ${t.solid?'t-dot-solid':'t-dot-hollow'}"></div><div class="t-content"><div class="t-event">${t.event}</div><div class="t-note">${t.note}</div>${t.gap?`<div class="t-gap">${t.gap}</div>`:''}</div></div>`;
});
}

function buildQuotes(){
const list=document.getElementById('quotes-list');
list.innerHTML='';
allQuotes.forEach(q=>{
const badge=q.conf==='high'?'badge-high':'badge-med';
list.innerHTML+=`<div class="quote-card"><div class="quote-head"><span class="quote-label">${q.label}</span><span class="badge ${badge}">${q.conf.toUpperCase()}</span></div><div class="quote">${q.text}</div></div>`;
});
}

function filter(type,el){
document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
el.classList.add('active');
activeFilter=type;
buildCards();
}

function switchTab(tab,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
['evidence','timeline','quotes'].forEach(t=>{
document.getElementById(t+'-panel').classList.toggle('hidden',t!==tab);
});
}

buildCards();
buildTimeline();
buildQuotes();
</script>
</body>
</html>
