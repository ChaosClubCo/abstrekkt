<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>PyroStudio: Pure Canvas Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020205; }
        canvas { display: block; touch-action: none; cursor: crosshair; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- 1. CONFIGURATION & PRESETS ---
        const CONSTANTS = { GRAVITY: 0.12, TIME_STEP: 1 };
        const PRESETS = [
            { id: 'peony', name: 'Red Peony', type: 'sphere', colors: ['#ff0044', '#ff4466'], physics: { count: 100, speed: 4, friction: 0.95, decay: 0.015, sound: 'thud' } },
            { id: 'willow', name: 'Gold Willow', type: 'sphere', colors: ['#ffd700'], physics: { count: 80, speed: 3, friction: 0.98, gravity: 0.06, decay: 0.005, heavy: true, sound: 'crackle' } },
            { id: 'crossette', name: 'Crossette', type: 'sphere', colors: ['#00ffcc'], physics: { count: 40, speed: 4, friction: 0.98, decay: 0.01, behavior: 'split', sound: 'pop' } },
            { id: 'ghost', name: 'Ghost Shell', type: 'sphere', colors: ['#4444ff', '#8888ff'], physics: { count: 90, speed: 3.5, friction: 0.96, decay: 0.02, fade: 'in', sound: 'thud' } },
            { id: 'saturn', name: 'Saturn', type: 'saturn', colors: ['#ff8800', '#ffffff'], physics: { count: 120, speed: 3, friction: 0.96, decay: 0.015, sound: 'heavy' } },
            { id: 'strobe', name: 'Strobe', type: 'sphere', colors: ['#ffffff'], physics: { count: 90, speed: 4, friction: 0.93, decay: 0.01, strobe: true, sound: 'crackle' } },
            { id: 'spiral', name: 'Spiral', type: 'spiral', colors: ['#10b981', '#34d399'], physics: { count: 140, speed: 2, friction: 0.94, decay: 0.015, sound: 'thud' } },
            { id: 'glitter', name: 'Champagne', type: 'sphere', colors: ['#fde68a'], physics: { count: 130, speed: 3.5, friction: 0.9, decay: 0.01, behavior: 'glitter', sound: 'crackle' } }
        ];

        const STATE = {
            width: window.innerWidth, height: window.innerHeight,
            fireworks: [], particles: [],
            wind: 0, timeScale: 1, audioReady: false,
            isRandom: false, isFinale: false,
            currentConfig: PRESETS[0]
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        window.addEventListener('resize', () => {
            STATE.width = canvas.width = window.innerWidth;
            STATE.height = canvas.height = window.innerHeight;
            generateSkyline();
            setupUI();
        });
        canvas.width = STATE.width; canvas.height = STATE.height;

        // --- 2. AUDIO ENGINE ---
        const AUDIO = {
            limiter: null, reverb: null, thud: null, bang: null, crackle: null, whoosh: null, filter: null,
            init: async () => {
                if (STATE.audioReady) return;
                await Tone.start();
                AUDIO.limiter = new Tone.Limiter(-2).toDestination();
                AUDIO.reverb = new Tone.Reverb({ decay: 2.5, wet: 0.25 }).connect(AUDIO.limiter);
                
                AUDIO.thud = new Tone.MembraneSynth({ volume: -2, pitchDecay: 0.05, octaves: 4, envelope: { attack: 0.001, decay: 0.5, release: 1 }});
                AUDIO.bang = new Tone.NoiseSynth({ volume: -8, noise: { type: 'pink' }, envelope: { attack: 0.001, decay: 0.3, release: 0.3 }});
                AUDIO.crackle = new Tone.MembraneSynth({ volume: -15, pitchDecay: 0.01, octaves: 2, oscillator: {type:'square'}, envelope: { attack: 0.001, decay: 0.05, release: 0.01 }});
                
                AUDIO.whoosh = new Tone.NoiseSynth({ volume: -10, noise: { type: 'brown' }, envelope: { attack: 0.1, decay: 0.6, release: 0.5 }});
                AUDIO.filter = new Tone.Filter(200, "lowpass");
                AUDIO.whoosh.connect(AUDIO.filter);

                STATE.audioReady = true;
            },
            play: (type, posX) => {
                if (!STATE.audioReady) return;
                const pan = Math.max(-1, Math.min(1, (posX / STATE.width) * 2 - 1));
                const panner = new Tone.Panner(pan).connect(AUDIO.reverb);
                const now = Tone.now();

                if (type === 'launch') {
                    AUDIO.filter.disconnect(); AUDIO.filter.connect(panner);
                    AUDIO.filter.frequency.setValueAtTime(200, now);
                    AUDIO.filter.frequency.rampTo(1000, 0.5, now);
                    AUDIO.whoosh.triggerAttackRelease(0.5, now);
                } else {
                    const delay = 0.05 + Math.random() * 0.1;
                    const time = now + delay;

                    AUDIO.thud.disconnect(); AUDIO.thud.connect(panner);
                    AUDIO.bang.disconnect(); AUDIO.bang.connect(panner);

                    if (type === 'heavy') {
                        AUDIO.thud.triggerAttackRelease("C1", "4n", time);
                        AUDIO.bang.triggerAttackRelease("4n", time);
                    } else if (type === 'pop') {
                        AUDIO.thud.triggerAttackRelease("G2", "32n", time);
                        AUDIO.bang.triggerAttackRelease("32n", time);
                    } else {
                        AUDIO.thud.triggerAttackRelease("D1", "16n", time);
                        AUDIO.bang.triggerAttackRelease("16n", time);
                    }
                    if (type === 'crackle') {
                        AUDIO.crackle.disconnect(); AUDIO.crackle.connect(panner);
                        for(let i=0; i<6; i++) AUDIO.crackle.triggerAttackRelease("C5", "64n", time + 0.1 + (Math.random()*0.4));
                    }
                }
                setTimeout(() => panner.dispose(), 2000);
            }
        };

        // --- 3. PHYSICS & LOGIC ---
        const MATH = {
            project: (x, y, z) => {
                const scale = 500 / (500 + z);
                return { x: x * scale, y: y * scale, scale: scale };
            },
            rotate: (x, y, z, ax, ay) => {
                let cos = Math.cos(ay), sin = Math.sin(ay);
                let x1 = x * cos - z * sin, z1 = z * cos + x * sin;
                cos = Math.cos(ax); sin = Math.sin(ax);
                return { x: x1, y: y * cos - z1 * sin, z: z1 * cos + y * sin };
            }
        };

        class Firework {
            constructor(tx, ty, config) {
                this.x = STATE.width / 2 + (Math.random() * 80 - 40);
                this.y = STATE.height;
                this.sx = this.x; this.sy = this.y;
                this.tx = tx; this.ty = ty;
                this.config = config;
                this.color = config.colors[0];
                this.progress = 0;
                this.speed = 0.012 + Math.random() * 0.004;
                this.trail = [];
            }
            update(dt) {
                this.progress += this.speed * dt;
                const ease = 1 - Math.pow(1 - this.progress, 3);
                this.x = this.sx + (this.tx - this.sx) * ease + (STATE.wind * 0.5 * this.progress * dt);
                this.y = this.sy + (this.ty - this.sy) * ease;
                
                if (Math.random() > 0.5) this.trail.push({x: this.x, y: this.y, a: 1});
                return this.progress >= 1;
            }
            draw(ctx) {
                ctx.lineWidth = 2;
                for (let i = 0; i < this.trail.length; i++) {
                    let t = this.trail[i];
                    ctx.fillStyle = `rgba(255, 255, 255, ${t.a})`;
                    ctx.beginPath(); ctx.arc(t.x, t.y, 1, 0, Math.PI*2); ctx.fill();
                    t.a -= 0.05 * STATE.timeScale;
                }
                this.trail = this.trail.filter(t => t.a > 0);
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, z, color, config) {
                this.pos = { x: x, y: y, z: z };
                this.vel = { x: 0, y: 0, z: 0 };
                this.color = color;
                this.config = config;
                this.alpha = config.physics.fade === 'in' ? 0 : 1;
                this.life = 1.0;
                this.decay = config.physics.decay * (0.8 + Math.random() * 0.4);
                this.hasSplit = false;
            }
            update(dt) {
                this.vel.x *= Math.pow(this.config.physics.friction, dt);
                this.vel.y *= Math.pow(this.config.physics.friction, dt);
                this.vel.z *= Math.pow(this.config.physics.friction, dt);
                this.vel.y += CONSTANTS.GRAVITY * (this.config.physics.heavy ? 1.5 : 1) * dt;
                
                this.pos.x += this.vel.x * dt + (STATE.wind * 0.1 * dt);
                this.pos.y += this.vel.y * dt;
                this.pos.z += this.vel.z * dt;

                if (this.config.physics.fade === 'in' && this.life > 0.8) this.alpha = Math.min(1, this.alpha + 0.1 * dt);
                else this.alpha -= this.decay * dt;

                this.visible = this.config.physics.strobe ? (Math.floor(Date.now() / 50) % 2 === 0) : true;

                if (this.config.physics.behavior === 'split' && this.life < 0.7 && !this.hasSplit) {
                    this.hasSplit = true; this.alpha = 0; return 'SPLIT'; 
                }
                this.life = this.alpha;
                return this.alpha <= 0;
            }
            draw(ctx) {
                if (!this.visible || this.alpha <= 0) return;
                const p = MATH.project(this.pos.x - (STATE.width/2), this.pos.y - (STATE.height/2), this.pos.z);
                const sx = p.x + (STATE.width/2), sy = p.y + (STATE.height/2);
                const size = (this.config.physics.heavy ? 2 : 1.5) * p.scale;

                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                if (this.config.physics.trail && Math.random() > 0.5) ctx.fillRect(sx + (Math.random()*2-1), sy + (Math.random()*2-1), size/2, size/2);
                ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
                if (this.config.physics.behavior === 'glitter' && Math.random() > 0.8) {
                    ctx.fillStyle = '#fff'; ctx.fillRect(sx, sy, 2, 2);
                }
                ctx.globalAlpha = 1;
            }
        }

        function burst(x, y, config) {
            const count = config.physics.count;
            const speed = config.physics.speed;
            const colors = config.colors;
            const rx = Math.random() * Math.PI, ry = Math.random() * Math.PI;

            for (let i = 0; i < count; i++) {
                let vx, vy, vz, color = colors[i % colors.length];
                
                if (config.type === 'sphere') {
                    const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1);
                    vx = Math.sin(phi) * Math.cos(theta); vy = Math.sin(phi) * Math.sin(theta); vz = Math.cos(phi);
                } else if (config.type === 'saturn') {
                    const theta = (Math.PI * 2 * i) / count;
                    vx = Math.cos(theta); vy = Math.sin(theta); vz = (Math.random() - 0.5) * 0.1;
                    if (i < count * 0.3) { vx *= 0.3; vy *= 0.3; vz = Math.random()-0.5; color = '#fff'; }
                } else if (config.type === 'spiral') {
                    const t = i * 0.2;
                    vx = Math.cos(t) * (t/10); vy = Math.sin(t) * (t/10); vz = (Math.random()-0.5)*0.5;
                }

                if (config.type !== 'sphere') {
                    const r = MATH.rotate(vx, vy, vz, rx, ry);
                    vx = r.x; vy = r.y; vz = r.z;
                }

                const mag = speed * (0.8 + Math.random() * 0.4);
                const p = new Particle(x, y, 0, color, config);
                p.vel = { x: vx * mag, y: vy * mag, z: vz * mag };
                STATE.particles.push(p);
            }
        }

        // --- 4. UI ENGINE (PURE CANVAS) ---
        
        let skylineData = [];
        function generateSkyline() {
            skylineData = [];
            let cx = 0;
            while(cx < STATE.width) {
                let w = Math.random() * 60 + 30;
                let h = Math.random() * 150 + 50;
                skylineData.push({x: cx, w: w, h: h});
                cx += w;
            }
        }
        generateSkyline();

        const UI = {
            buttons: [],
            slider: null,
            mouseX: 0, mouseY: 0,
            
            drawRoundRect: (ctx, x, y, w, h, r) => {
                ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
            }
        };

        class Button {
            constructor(id, text, x, y, w, h, onClick, isPreset = false, presetData = null) {
                this.id = id; this.text = text; this.x = x; this.y = y; this.w = w; this.h = h;
                this.onClick = onClick; this.isHovered = false; this.isActive = false;
                this.isPreset = isPreset; this.presetData = presetData;
            }
            draw(ctx) {
                UI.drawRoundRect(ctx, this.x, this.y, this.w, this.h, 8);
                
                if (this.isActive) {
                    ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
                    ctx.strokeStyle = '#a855f7';
                } else if (this.isHovered) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                } else {
                    ctx.fillStyle = 'rgba(30, 30, 40, 0.7)';
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                }
                
                // Specific style for Finale
                if (this.id === 'finale' && STATE.isFinale) {
                    ctx.fillStyle = 'rgba(220, 38, 38, 0.8)';
                    ctx.strokeStyle = '#fca5a5';
                }

                ctx.fill(); ctx.stroke();

                if (this.isPreset && this.presetData) {
                    // Draw color preview
                    ctx.fillStyle = this.presetData.colors[0];
                    ctx.beginPath(); ctx.arc(this.x + this.w/2, this.y + 25, 10, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px Arial'; ctx.textAlign = 'center';
                    ctx.fillText(this.text, this.x + this.w/2, this.y + 50);
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(this.text, this.x + this.w/2, this.y + this.h/2);
                }
            }
        }

        class Slider {
            constructor(x, y, w, h) {
                this.x = x; this.y = y; this.w = w; this.h = h;
                this.isDragging = false;
            }
            draw(ctx) {
                ctx.fillStyle = 'rgba(30,30,40,0.7)';
                UI.drawRoundRect(ctx, this.x, this.y, this.w, this.h, 10);
                ctx.fill();
                
                // Track
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(this.x + this.w/2 - 2, this.y + 20, 4, this.h - 40);

                // Thumb
                const pct = (STATE.wind + 8) / 16; // mapped -8 to 8
                const thumbY = this.y + 20 + (1-pct) * (this.h - 40);
                ctx.fillStyle = '#60a5fa';
                ctx.beginPath(); ctx.arc(this.x + this.w/2, thumbY, 8, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = '#aaa'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
                ctx.fillText("WIND", this.x + this.w/2, this.y + this.h - 10);
            }
            updateVal(mouseY) {
                let trackStart = this.y + 20;
                let trackLen = this.h - 40;
                let pct = 1 - Math.max(0, Math.min(1, (mouseY - trackStart) / trackLen));
                STATE.wind = (pct * 16) - 8;
            }
        }

        function setupUI() {
            UI.buttons = [];
            
            // Top Controls
            UI.buttons.push(new Button('audio', STATE.audioReady ? (Tone.Destination.mute ? 'Audio: OFF' : 'Audio: ON') : 'Audio: OFF', STATE.width - 120, 20, 100, 40, () => {
                if (!STATE.audioReady) AUDIO.init();
                else {
                    Tone.Destination.mute = !Tone.Destination.mute;
                    UI.buttons.find(b => b.id === 'audio').text = Tone.Destination.mute ? 'Audio: OFF' : 'Audio: ON';
                }
            }));

            UI.buttons.push(new Button('finale', 'FINALE', STATE.width - 240, 20, 100, 40, () => {
                STATE.isFinale = !STATE.isFinale;
                if (!STATE.audioReady) AUDIO.init();
            }));

            // Wind Slider
            UI.slider = new Slider(STATE.width - 60, 80, 40, 150);

            // Bottom Presets
            const btnW = 70; const btnH = 65; const gap = 10;
            const startX = Math.max(20, (STATE.width - (9 * (btnW + gap))) / 2);
            const startY = STATE.height - 90;

            UI.buttons.push(new Button('random', 'Random', startX, startY, btnW, btnH, () => {
                STATE.isRandom = true;
                UI.buttons.forEach(b => { if(b.isPreset) b.isActive = false; });
                UI.buttons.find(b => b.id === 'random').isActive = true;
            }, true, {colors:['#888']}));
            UI.buttons[UI.buttons.length-1].isActive = STATE.isRandom;

            for(let i=0; i<8; i++) {
                const p = PRESETS[i];
                let b = new Button(`pre_${p.id}`, p.name, startX + (i+1)*(btnW+gap), startY, btnW, btnH, () => {
                    STATE.isRandom = false;
                    STATE.currentConfig = p;
                    UI.buttons.forEach(btn => { if(btn.isPreset) btn.isActive = false; });
                    b.isActive = true;
                }, true, p);
                if (p.id === STATE.currentConfig.id && !STATE.isRandom) b.isActive = true;
                UI.buttons.push(b);
            }
        }
        setupUI();

        // --- 5. INPUT HANDLING ---
        
        canvas.addEventListener('mousemove', e => {
            UI.mouseX = e.clientX; UI.mouseY = e.clientY;
            UI.buttons.forEach(b => {
                b.isHovered = (UI.mouseX >= b.x && UI.mouseX <= b.x + b.w && UI.mouseY >= b.y && UI.mouseY <= b.y + b.h);
            });
            if (UI.slider.isDragging) UI.slider.updateVal(UI.mouseY);
        });

        canvas.addEventListener('mousedown', e => {
            if (!STATE.audioReady) AUDIO.init();
            const x = e.clientX; const y = e.clientY;
            let uiHit = false;

            UI.buttons.forEach(b => {
                if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.onClick(); uiHit = true; }
            });

            if (x >= UI.slider.x && x <= UI.slider.x + UI.slider.w && y >= UI.slider.y && y <= UI.slider.y + UI.slider.h) {
                UI.slider.isDragging = true;
                UI.slider.updateVal(y);
                uiHit = true;
            }

            if (!uiHit && !STATE.isFinale) {
                const config = STATE.isRandom ? PRESETS[Math.floor(Math.random() * PRESETS.length)] : STATE.currentConfig;
                STATE.fireworks.push(new Firework(x, y, config));
                AUDIO.play('launch', x);
            }
        });

        window.addEventListener('mouseup', () => UI.slider.isDragging = false);
        window.addEventListener('keydown', e => { if (e.code === 'Space') STATE.timeScale = 0.2; });
        window.addEventListener('keyup', e => { if (e.code === 'Space') STATE.timeScale = 1; });

        // Finale Auto-Launch
        setInterval(() => {
            if (STATE.isFinale) {
                const x = STATE.width * 0.1 + Math.random() * STATE.width * 0.8;
                const y = STATE.height * 0.15 + Math.random() * STATE.height * 0.4;
                const config = PRESETS[Math.floor(Math.random() * PRESETS.length)];
                STATE.fireworks.push(new Firework(x, y, config));
                AUDIO.play('launch', x);
            }
        }, 300);

        // --- 6. RENDER LOOP ---
        function drawUI() {
            // Skyline
            ctx.fillStyle = '#0a0a0e';
            for (let b of skylineData) ctx.fillRect(b.x, STATE.height - b.h, b.w, b.h);

            // Title
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
            ctx.fillText("PyroStudio X", 20, 20);
            ctx.font = '12px Arial'; ctx.fillStyle = '#888';
            ctx.fillText(`Status: ${STATE.isRandom ? 'Random' : STATE.currentConfig.name} | Space: Slow Mo`, 20, 50);

            // Components
            UI.buttons.forEach(b => b.draw(ctx));
            UI.slider.draw(ctx);
        }

        function loop() {
            requestAnimationFrame(loop);
            
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = `rgba(2, 2, 5, ${STATE.timeScale < 1 ? 0.1 : 0.2})`;
            ctx.fillRect(0, 0, STATE.width, STATE.height);

            ctx.globalCompositeOperation = 'screen';
            const dt = STATE.timeScale;

            for (let i = STATE.fireworks.length - 1; i >= 0; i--) {
                const fw = STATE.fireworks[i];
                fw.draw(ctx);
                if (fw.update(dt)) {
                    burst(fw.x, fw.y, fw.config);
                    AUDIO.play(fw.config.physics.sound, fw.x);
                    STATE.fireworks.splice(i, 1);
                }
            }

            for (let i = STATE.particles.length - 1; i >= 0; i--) {
                const p = STATE.particles[i];
                p.draw(ctx);
                const res = p.update(dt);
                if (res === true) {
                    STATE.particles.splice(i, 1);
                } else if (res === 'SPLIT') {
                    for(let k=0; k<4; k++) {
                        const sub = new Particle(p.pos.x, p.pos.y, p.pos.z, p.color, p.config);
                        const angle = (Math.PI/2) * k;
                        sub.vel = { x: Math.cos(angle)*3, y: Math.sin(angle)*3, z: Math.random()-0.5 };
                        sub.life = 0.6; 
                        sub.config = { ...p.config, physics: { ...p.config.physics, behavior: 'none', friction: 0.92 }};
                        STATE.particles.push(sub);
                    }
                    STATE.particles.splice(i, 1);
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            drawUI();
        }
        loop();
    </script>
</body>
</html>
