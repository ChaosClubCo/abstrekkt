<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" role="img" aria-label="FlashFusion FF monogram">
  <defs>
    <!-- Core brand gradient -->
    <linearGradient id="ff-mono-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF6A00"/>
      <stop offset="35%"  stop-color="#A144FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <!-- Enterprise cool gradient (for alternate usage) -->
    <linearGradient id="ff-cool-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="55%"  stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="ff-mono-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Dark bg for standalone usage -->
    <clipPath id="ff-clip">
      <rect width="80" height="64" rx="12"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect width="80" height="64" rx="12" fill="#0B0B14"/>

  <!-- FF Double chevron mark -->
  <!-- Each F is a chevron/slash shape suggesting forward motion -->
  <g filter="url(#ff-mono-glow)">
    <!-- Left F chevron -->
    <path
      d="M 8 54 L 22 10 L 30 10 L 20 38 L 34 38 L 32 44 L 18 44 L 16 54 Z"
      fill="url(#ff-mono-grad)"
    />
    <!-- Right F chevron (offset, overlapping) -->
    <path
      d="M 28 54 L 42 10 L 50 10 L 40 38 L 54 38 L 52 44 L 38 44 L 36 54 Z"
      fill="url(#ff-mono-grad)"
      opacity="0.92"
    />
    <!-- Crossbar — first F -->
    <rect x="14" y="27" width="18" height="5" rx="2.5" fill="url(#ff-mono-grad)"/>
    <!-- Crossbar — second F -->
    <rect x="34" y="27" width="18" height="5" rx="2.5" fill="url(#ff-mono-grad)" opacity="0.92"/>
  </g>
</svg>
