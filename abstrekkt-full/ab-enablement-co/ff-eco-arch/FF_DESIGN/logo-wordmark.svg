<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" role="img" aria-label="FlashFusion wordmark">
  <defs>
    <!-- Brand gradient: violet → magenta → cyan -->
    <linearGradient id="ff-brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="55%"  stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow filter for mark -->
    <filter id="ff-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ── LIGHTNING BOLT MARK ─────────────────── -->
  <!-- Geometric: sharp top-right angle, clean descending stroke -->
  <g filter="url(#ff-glow)" transform="translate(0, 4)">
    <polygon
      points="38,0 18,36 30,36 10,72 46,28 34,28"
      fill="url(#ff-brand-grad)"
    />
  </g>

  <!-- ── WORDMARK ────────────────────────────── -->
  <!-- Rendered as path approximation; real usage loads Poppins 700 -->
  <text
    x="60" y="56"
    font-family="Poppins, sans-serif"
    font-weight="700"
    font-size="40"
    letter-spacing="2"
    fill="url(#ff-brand-grad)"
    text-anchor="start"
  >FLASHFUSION</text>
</svg>
