<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" role="img" aria-label="FlashFusion horizontal lockup">
  <defs>
    <linearGradient id="lk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF6A00"/>
      <stop offset="40%"  stop-color="#A144FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="lk-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="55%"  stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="lk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon mark (48×48 container, scaled down) -->
  <rect width="44" height="44" x="2" y="2" rx="8" fill="#0B0B14"/>
  <g filter="url(#lk-glow)">
    <!-- Left F -->
    <path d="M 6 38 L 16 10 L 21 10 L 13 28 L 23 28 L 22 32 L 12 32 L 11 38 Z" fill="url(#lk-grad)"/>
    <!-- Crossbar L -->
    <rect x="9" y="21" width="12" height="3.5" rx="1.75" fill="url(#lk-grad)"/>
    <!-- Right F -->
    <path d="M 22 38 L 32 10 L 37 10 L 29 28 L 39 28 L 38 32 L 28 32 L 27 38 Z" fill="url(#lk-grad)" opacity="0.9"/>
    <!-- Crossbar R -->
    <rect x="25" y="21" width="12" height="3.5" rx="1.75" fill="url(#lk-grad)" opacity="0.9"/>
  </g>

  <!-- FLASHFUSION wordmark -->
  <text
    x="58" y="23"
    font-family="Poppins, sans-serif"
    font-weight="700"
    font-size="16"
    letter-spacing="1.5"
    fill="url(#lk-text-grad)"
  >FLASHFUSION</text>

  <!-- Sub-label -->
  <text
    x="59" y="37"
    font-family="Geist, Inter, sans-serif"
    font-weight="400"
    font-size="9"
    letter-spacing="2"
    fill="#8A8A96"
  >AI ENABLEMENT &amp; CONSULTING</text>
</svg>
