<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FlashFusion icon mark">
  <defs>
    <linearGradient id="ff-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="55%"  stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="ff-icon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background — dark void circle -->
  <rect width="64" height="64" rx="14" fill="#0B0B14"/>

  <!-- Lightning bolt mark — centered in 64×64 -->
  <g filter="url(#ff-icon-glow)">
    <polygon
      points="40,6 22,32 30,32 14,58 44,30 36,30"
      fill="url(#ff-icon-grad)"
    />
  </g>
</svg>
