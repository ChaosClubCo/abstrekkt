}

}

  padding: var(--space-32);
}

}

}

}

}

.step-label {

/* Skip Link for Keyboard Navigation */
.skip-link {
    position: absolute;
    top: -40px;
    left: 0;
    background: var(--color-primary, #21808d);
    color: white;
    padding: 8px 16px;
    text-decoration: none;
    z-index: 10000;
    border-radius: 0 0 4px 0;
    font-weight: 600;
    transition: top 0.3s ease;
}

.skip-link:focus {
    top: 0;
    outline: 3px solid #f59e0b;
    outline-offset: 2px;
}

/* Enhanced Focus Indicators (WCAG 2.1 Level AA) */
*:focus {
    outline: 3px solid var(--color-primary, #21808d);
    outline-offset: 2px;
}

*:focus:not(:focus-visible) {
    outline: none;
}

*:focus-visible {
    outline: 3px solid var(--color-primary, #21808d);
    outline-offset: 2px;
}

button:focus-visible,
.btn:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 3px solid var(--color-primary, #21808d);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(33, 128, 141, 0.2);
}

/* Remove focus outline for mouse users only */
.js-focus-visible :focus:not(.focus-visible) {
    outline: none;
}

/* Screen Reader Only Content */
.sr-only,
.visually-hidden {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border-width: 0 !important;
}

/* Allow screen reader text to be focusable when navigated to via keyboard */
.sr-only.focusable:active,
.sr-only.focusable:focus {
    position: static;
    width: auto;
    height: auto;
    overflow: visible;
    clip: auto;
    white-space: normal;
}

/* Improved Disabled State Visibility */
button:disabled,
button[aria-disabled="true"],
.btn:disabled,
.btn[aria-disabled="true"] {
    opacity: 0.6;
    cursor: not-allowed;
    filter: grayscale(40%);
    pointer-events: none;
}

/* High Contrast Mode Support */
@media (prefers-contrast: high) {
    * {
        border-color: currentColor !important;
    }
    
    button,
    .btn {
        border: 2px solid currentColor !important;
    }
    
    *:focus,
    *:focus-visible {
        outline: 3px solid currentColor !important;
        outline-offset: 2px !important;
    }
}

/* Reduced Motion Support (WCAG 2.1 Success Criterion 2.3.3) */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
    
    .step-content {
        transition: none !important;
    }
}

/* Improved Link Accessibility */
a:focus {
    outline: 3px solid var(--color-primary, #21808d);
    outline-offset: 2px;
    background: rgba(33, 128, 141, 0.1);
    border-radius: 2px;
}

/* Improve checkbox/radio visibility */
input[type="checkbox"]:focus,
input[type="radio"]:focus {
    outline: 3px solid var(--color-primary, #21808d);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(33, 128, 141, 0.15);
}

/* Ensure sufficient color contrast for text */
.text-secondary,
.step-label {
    color: #626c71 !important; /* WCAG AA compliant contrast */
}

/* Better error message visibility */
.error-message,
[role="alert"] {
    color: #c0152f;
    font-weight: 600;
    padding: 8px 12px;
    background: rgba(192, 21, 47, 0.1);
    border-radius: 4px;
    border-left: 4px solid #c0152f;
}

/* Loading/Processing States */
[aria-busy="true"] {
    cursor: wait;
    opacity: 0.7;
    position: relative;
}

[aria-busy="true"]::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.5);
    cursor: wait;
}

/* Improve form field error states */
input:invalid:not(:placeholder-shown),
input[aria-invalid="true"] {
    border-color: #c0152f !important;
    border-width: 2px;
}

input:invalid:not(:placeholder-shown):focus,
input[aria-invalid="true"]:focus {
    outline-color: #c0152f !important;
    box-shadow: 0 0 0 4px rgba(192, 21, 47, 0.2) !important;
}

/* Success state for valid inputs */
input:valid:not(:placeholder-shown):not([type="checkbox"]):not([type="radio"]) {
    border-color: #10b981;
}

/* Improve button hover states for low vision */
.btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.btn:active:not(:disabled) {
    transform: translateY(0);
}

/* Ensure adequate touch target size (WCAG 2.5.5) */
button,
.btn,
input[type="checkbox"],
input[type="radio"],
a {
    min-height: 44px;
    min-width: 44px;
}

/* Exception for inline checkboxes - add padding to labels */
label input[type="checkbox"],
label input[type="radio"] {
    min-height: 20px;
    min-width: 20px;
    margin: 12px;
}

/* Progress bar accessibility */
.progress-step[aria-current="true"] .step-circle,
.progress-step.active .step-circle {
    position: relative;
}

.progress-step[aria-current="true"] .step-circle::after,
.progress-step.active .step-circle::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 2px solid var(--color-primary, #21808d);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.05); }
}

/* Dark mode support (if needed) */
@media (prefers-color-scheme: dark) {
    .skip-link {
        background: #29a4b3;
    }
    
    *:focus,
    *:focus-visible {
        outline-color: #29a4b3;
    }
}

/* Print styles - hide non-essential elements */
@media print {
    .skip-link,
    .btn,
    button,
    nav,
    .progress-bar,
    [aria-live] {
        display: none !important;
    }
}
</head>
<body>
    <!-- Skip Link for Keyboard Navigation -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div class="app-container">
        <header class="header" role="banner">
            <div class="header-content">
                <div>
                    <div class="logo">INT Inc.</div>
                    <div class="logo-subtitle">Executive AI Assessment Platform</div>
                </div>
                <div class="mode-toggle">
                    <button class="mode-btn active" 
                            id="internalModeBtn" 
                            onclick="switchMode('internal')"
                            role="tab"
                            aria-selected="true"
                            aria-label="Internal AI Maturity Assessment Mode">
                        Internal AI Maturity
                    </button>
                    <button class="mode-btn" 
                            id="clientModeBtn" 
                            onclick="switchMode('client')"
                            role="tab"
                            aria-selected="false"
                            aria-label="Client Assessment and Market Opportunity Mode">
                        Client Assessment &amp; Market Opportunity
                    </button>
                </div>
            </div>
        </header>

        <main id="main-content" class="main-content" role="main">
            <div class="progress-bar">
                <h3 id="progressTitle">Assessment Progress</h3>
                <div class="progress-steps" id="progressSteps">
                    <!-- Progress steps will be dynamically inserted -->
                </div>
            </div>

            <!-- Internal Mode Content -->
            <div id="internalMode">
                <!-- Step 1: Department Selection -->
                <div class="card step-content" id="internal-step-1">
                    <div class="card-header">
                        <h2>Step 1: Select Departments</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">Select the departments you want to assess for AI opportunities</p>
                    </div>
                    <div class="card-body">
                        <div class="info-box">
                            <div class="info-box-title">INT Inc. Current Tech Stack</div>
                            <div class="tech-stack-display">
                                <span class="tech-badge">HubSpot (CRM)</span>
                                <span class="tech-badge">Microsoft 365 (Productivity)</span>
                                <span class="tech-badge">Freshdesk (Customer Service)</span>
                                <span class="tech-badge">GitLab (Development)</span>
                            </div>
                        </div>
                        <div class="checkbox-grid" id="departmentCheckboxes">
                            <!-- Department checkboxes will be inserted here -->
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="nextStep()">Next: Activity Inventory</button>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Activity Inventory -->
                <div class="card step-content hidden" id="internal-step-2">
                    <div class="card-header">
                        <h2>Step 2: Activity Inventory</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">Select the activities performed by each department</p>
                    </div>
                    <div class="card-body" id="activityInventoryContainer">
                        <!-- Activity selections will be inserted here -->
                    </div>
                    <div class="btn-group" style="padding: 0 var(--space-24) var(--space-24);">
                        <button class="btn btn-secondary" onclick="previousStep()">Back</button>
                        <button class="btn btn-primary" onclick="nextStep()">Next: Pain Points</button>
                    </div>
                </div>

                <!-- Step 3: Pain Points -->
                <div class="card step-content hidden" id="internal-step-3">
                    <div class="card-header">
                        <h2>Step 3: Current Pain Points</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">Identify your top 3 pain points per department</p>
                    </div>
                    <div class="card-body" id="painPointsContainer">
                        <!-- Pain points selections will be inserted here -->
                    </div>
                    <div class="btn-group" style="padding: 0 var(--space-24) var(--space-24);">
                        <button class="btn btn-secondary" onclick="previousStep()">Back</button>
                        <button class="btn btn-primary" onclick="generateInternalReport()">Generate Assessment</button>
                    </div>
                </div>

                <!-- Step 4: Results -->
                <div class="card step-content hidden" id="internal-step-4">
                    <div class="card-header">
                        <h2>INT Inc. Internal AI Transformation Opportunity</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">Comprehensive analysis and recommendations</p>
                    </div>
                    <div class="card-body">
                        <div class="summary-stats" id="internalSummaryStats">
                            <!-- Summary stats will be inserted here -->
                        </div>
                        <div class="results-container" id="internalResults">
                            <!-- Results will be inserted here -->
                        </div>
                        <div class="export-buttons">
                            <button class="btn btn-primary" onclick="exportPDF('internal')">Download Executive Summary (PDF)</button>
                            <button class="btn btn-primary" onclick="exportReport('internal')">Download Full Report</button>
                            <button class="btn btn-secondary" onclick="exportRoadmap()">Download Implementation Roadmap</button>
                            <button class="btn btn-secondary" onclick="resetAssessment()">Start New Assessment</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Client Mode Content -->
            <div id="clientMode" class="hidden">
                <!-- Step 1: Client Profile -->
                <div class="card step-content" id="client-step-1">
                    <div class="card-header">
                        <h2>Step 1: Client Profile</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">Enter client information to begin assessment</p>
                    </div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="clientCompany" placeholder="Enter company name">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Contact Name</label>
                                <input type="text" class="form-control" id="clientContact" placeholder="Enter contact name">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Contact Email</label>
                                <input type="email" class="form-control" id="clientEmail" placeholder="contact@company.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Industry</label>
                                <select class="form-control" id="clientIndustry">
                                    <option value="">Select industry...</option>
                                    <option value="saas">SaaS / Software</option>
                                    <option value="manufacturing">Manufacturing</option>
                                    <option value="professional">Professional Services</option>
                                    <option value="financial">Financial Services</option>
                                    <option value="healthcare">Healthcare</option>
                                    <option value="technology">Technology</option>
                                    <option value="retail">Retail / E-commerce</option>
                                    <option value="consulting">Consulting</option>
                                    <option value="marketing">Marketing Agencies</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Company Size (Employees)</label>
                                <select class="form-control" id="clientSize">
                                    <option value="">Select size...</option>
                                    <option value="1-10">1-10</option>
                                    <option value="11-50">11-50</option>
                                    <option value="51-200">51-200</option>
                                    <option value="201-500">201-500</option>
                                    <option value="501-1000">501-1,000</option>
                                    <option value="1001+">1,001+</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Budget Range</label>
                                <select class="form-control" id="clientBudget">
                                    <option value="">Select budget...</option>
                                    <option value="10k-25k">$10,000 - $25,000</option>
                                    <option value="25k-50k">$25,000 - $50,000</option>
                                    <option value="50k-100k">$50,000 - $100,000</option>
                                    <option value="100k-250k">$100,000 - $250,000</option>
                                    <option value="250k+">$250,000+</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Decision Timeline</label>
                                <select class="form-control" id="clientTimeline">
                                    <option value="">Select timeline...</option>
                                    <option value="immediate">Immediate (0-30 days)</option>
                                    <option value="short">Short-term (1-3 months)</option>
                                    <option value="medium">Medium-term (3-6 months)</option>
                                    <option value="long">Long-term (6-12 months)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Current AI Maturity</label>
                                <select class="form-control" id="clientMaturity">
                                    <option value="">Select maturity level...</option>
                                    <option value="none">No AI adoption</option>
                                    <option value="exploring">Exploring AI options</option>
                                    <option value="pilot">Pilot projects underway</option>
                                    <option value="partial">Partial implementation</option>
                                    <option value="advanced">Advanced AI user</option>
                                </select>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="nextStep()">Next: Technology Stack</button>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Tech Stack Discovery -->
                <div class="card step-content hidden" id="client-step-2">
                    <div class="card-header">
                        <h2>Step 2: Technology Stack Discovery</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">What technology platforms does the client currently use?</p>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label">Current Productivity Suite</label>
                            <select class="form-control" id="clientProductivity">
                                <option value="">Select...</option>
                                <option value="m365">Microsoft 365</option>
                                <option value="google">Google Workspace</option>
                                <option value="other">Other</option>
                                <option value="none">None</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Current CRM</label>
                            <select class="form-control" id="clientCRM">
                                <option value="">Select...</option>
                                <option value="Salesforce">Salesforce</option>
                                <option value="HubSpot">HubSpot</option>
                                <option value="Microsoft Dynamics 365">Microsoft Dynamics 365</option>
                                <option value="Zoho">Zoho</option>
                                <option value="Oracle NetSuite">Oracle NetSuite</option>
                                <option value="Freshsales">Freshsales</option>
                                <option value="Pipedrive">Pipedrive</option>
                                <option value="other">Other</option>
                                <option value="none">None</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Current ERP (if applicable)</label>
                            <select class="form-control" id="clientERP">
                                <option value="">Select...</option>
                                <option value="Oracle NetSuite">Oracle NetSuite</option>
                                <option value="Microsoft Dynamics 365">Microsoft Dynamics 365</option>
                                <option value="SAP S/4HANA">SAP S/4HANA</option>
                                <option value="Infor CloudSuite">Infor CloudSuite</option>
                                <option value="Acumatica">Acumatica</option>
                                <option value="other">Other</option>
                                <option value="none">None</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Cloud Provider</label>
                            <select class="form-control" id="clientCloud">
                                <option value="">Select...</option>
                                <option value="azure">Microsoft Azure</option>
                                <option value="aws">Amazon AWS</option>
                                <option value="google">Google Cloud</option>
                                <option value="hybrid">Hybrid</option>
                                <option value="onprem">On-premises</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Compliance Requirements</label>
                            <div class="checkbox-grid" id="clientComplianceCheckboxes">
                                <div class="checkbox-item">
                                    <input type="checkbox" id="comp-soc2" value="SOC 2 Type II">
                                    <label for="comp-soc2">SOC 2 Type II</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="comp-iso" value="ISO 27001">
                                    <label for="comp-iso">ISO 27001</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="comp-gdpr" value="GDPR">
                                    <label for="comp-gdpr">GDPR</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="comp-hipaa" value="HIPAA">
                                    <label for="comp-hipaa">HIPAA</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="comp-fedramp" value="FedRAMP">
                                    <label for="comp-fedramp">FedRAMP</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="comp-pci" value="PCI-DSS">
                                    <label for="comp-pci">PCI-DSS</label>
                                </div>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-secondary" onclick="previousStep()">Back</button>
                            <button class="btn btn-primary" onclick="nextStep()">Next: Departments</button>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Department & Activity Selection -->
                <div class="card step-content hidden" id="client-step-3">
                    <div class="card-header">
                        <h2>Step 3: Department &amp; Activity Selection</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">Select departments and their activities</p>
                    </div>
                    <div class="card-body">
                        <div class="checkbox-grid" id="clientDepartmentCheckboxes">
                            <!-- Department checkboxes will be inserted here -->
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-secondary" onclick="previousStep()">Back</button>
                            <button class="btn btn-primary" onclick="nextStep()">Next: Activities &amp; Pain Points</button>
                        </div>
                    </div>
                </div>

                <!-- Step 4: Activities and Pain Points -->
                <div class="card step-content hidden" id="client-step-4">
                    <div class="card-header">
                        <h2>Step 4: Activities &amp; Pain Points</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">Select activities and pain points for each department</p>
                    </div>
                    <div class="card-body" id="clientActivityPainContainer">
                        <!-- Activities and pain points will be inserted here -->
                    </div>
                    <div class="btn-group" style="padding: 0 var(--space-24) var(--space-24);">
                        <button class="btn btn-secondary" onclick="previousStep()">Back</button>
                        <button class="btn btn-primary" onclick="generateClientReport()">Generate Assessment</button>
                    </div>
                </div>

                <!-- Step 5: Results -->
                <div class="card step-content hidden" id="client-step-5">
                    <div class="card-header">
                        <h2>Client AI Assessment &amp; Market Opportunity</h2>
                        <p style="color: var(--color-text-secondary); margin-top: var(--space-8);">Comprehensive analysis and recommendations</p>
                    </div>
                    <div class="card-body">
                        <div class="summary-stats" id="clientSummaryStats">
                            <!-- Summary stats will be inserted here -->
                        </div>
                        <div class="results-container" id="clientResults">
                            <!-- Results will be inserted here -->
                        </div>
                        <div class="export-buttons">
                            <button class="btn btn-primary btn-large" onclick="scheduleCall()">Schedule Implementation Planning Call</button>
                            <button class="btn btn-primary" onclick="exportPDF('client')">Download Executive Summary (PDF)</button>
                            <button class="btn btn-primary" onclick="exportReport('client')">Download Full Report</button>
                            <button class="btn btn-secondary" onclick="exportProposal()">Generate Proposal/SOW</button>
                            <button class="btn btn-secondary" onclick="resetAssessment()">Start New Assessment</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
