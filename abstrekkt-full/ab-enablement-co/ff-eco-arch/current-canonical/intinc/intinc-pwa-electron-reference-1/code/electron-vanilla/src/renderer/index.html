<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Intinc Electron Reference</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0f23; color: #e0e0e0; padding: 2rem; }
    h1 { color: #e94560; margin-bottom: 1rem; }
    button { background: #1a1a2e; color: #fff; border: 1px solid #e94560; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 4px; }
    button:hover { background: #e94560; }
    #output { margin-top: 1rem; padding: 1rem; background: #1a1a2e; border-radius: 8px; white-space: pre-wrap; font-family: monospace; min-height: 100px; }
  </style>
</head>
<body>
  <h1>Intinc Electron Reference</h1>
  <div>
    <button id="btn-open">Open File</button>
    <button id="btn-save">Save File</button>
    <button id="btn-workflow">Trigger Workflow</button>
  </div>
  <div id="output">Ready.</div>
  <script src="./app.js"></script>
</body>
</html>
