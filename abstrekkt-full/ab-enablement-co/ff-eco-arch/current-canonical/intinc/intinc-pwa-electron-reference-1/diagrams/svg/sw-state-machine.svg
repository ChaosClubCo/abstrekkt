<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Inter,system-ui,sans-serif">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
    </marker>
    <marker id="arr6g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="800" height="350" rx="16" fill="#0f0f23"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#e94560">Service Worker State Machine</text>

  <!-- States -->
  <circle cx="100" cy="170" r="40" fill="#16213e" stroke="#888" stroke-width="2"/>
  <text x="100" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#888">parsed</text>
  <text x="100" y="180" text-anchor="middle" font-size="9" fill="#666">(initial)</text>

  <circle cx="260" cy="170" r="40" fill="#16213e" stroke="#fbbf24" stroke-width="2"/>
  <text x="260" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">installing</text>

  <circle cx="420" cy="100" r="40" fill="#16213e" stroke="#f87171" stroke-width="2"/>
  <text x="420" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#f87171">redundant</text>

  <circle cx="420" cy="240" r="40" fill="#16213e" stroke="#533483" stroke-width="2"/>
  <text x="420" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#533483">installed</text>

  <circle cx="580" cy="170" r="40" fill="#16213e" stroke="#fbbf24" stroke-width="2"/>
  <text x="580" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">activating</text>

  <circle cx="720" cy="170" r="45" fill="#0f3460" stroke="#4ade80" stroke-width="3"/>
  <text x="720" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">activated</text>
  <text x="720" y="180" text-anchor="middle" font-size="9" fill="#888">(controlling)</text>

  <!-- Transitions -->
  <line x1="140" y1="170" x2="215" y2="170" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr6)"/>
  <text x="178" y="162" text-anchor="middle" font-size="9" fill="#888">register()</text>

  <line x1="290" y1="145" x2="385" y2="110" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr6)"/>
  <text x="340" y="118" text-anchor="middle" font-size="9" fill="#888">install fail</text>

  <line x1="290" y1="195" x2="385" y2="230" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr6)"/>
  <text x="340" y="225" text-anchor="middle" font-size="9" fill="#888">install ok</text>

  <line x1="455" y1="225" x2="545" y2="185" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr6)"/>
  <text x="500" y="198" text-anchor="middle" font-size="9" fill="#888">skipWaiting()</text>

  <line x1="620" y1="170" x2="670" y2="170" stroke="#4ade80" stroke-width="2" marker-end="url(#arr6g)"/>
  <text x="645" y="162" text-anchor="middle" font-size="9" fill="#888">activate</text>

  <!-- Waiting annotation -->
  <rect x="380" y="278" width="80" height="24" rx="4" fill="#16213e"/>
  <text x="420" y="294" text-anchor="middle" font-size="9" fill="#fbbf24">waiting...</text>

  <!-- Legend -->
  <text x="400" y="336" text-anchor="middle" font-size="11" fill="#888">The SW stays "installed" (waiting) until all tabs using the old SW close, or skipWaiting() is called</text>
</svg>