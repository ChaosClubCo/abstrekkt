<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
    </marker>
    <marker id="arr3g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="16" fill="url(#bg3)"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#e94560">Request Data Flow — Online vs Offline</text>

  <!-- Online Path -->
  <text x="400" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#4ade80">── Online Path ──</text>

  <rect x="40" y="80" width="120" height="50" rx="8" fill="#0f3460"/>
  <text x="100" y="110" text-anchor="middle" font-size="12" fill="#fff">User Action</text>
  <line x1="160" y1="105" x2="210" y2="105" stroke="#4ade80" stroke-width="2" marker-end="url(#arr3g)"/>

  <rect x="220" y="80" width="120" height="50" rx="8" fill="#0f3460"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#fff">fetch()</text>
  <line x1="340" y1="105" x2="390" y2="105" stroke="#4ade80" stroke-width="2" marker-end="url(#arr3g)"/>

  <rect x="400" y="80" width="140" height="50" rx="8" fill="#533483"/>
  <text x="470" y="110" text-anchor="middle" font-size="12" fill="#fff">Service Worker</text>
  <line x1="540" y1="105" x2="590" y2="105" stroke="#4ade80" stroke-width="2" marker-end="url(#arr3g)"/>

  <rect x="600" y="80" width="120" height="50" rx="8" fill="#0f3460"/>
  <text x="660" y="105" text-anchor="middle" font-size="12" fill="#fff">Network</text>

  <line x1="660" y1="130" x2="660" y2="155" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr3g)"/>
  <rect x="600" y="160" width="120" height="40" rx="6" fill="#16213e"/>
  <text x="660" y="184" text-anchor="middle" font-size="11" fill="#4ade80">Cache Update</text>

  <!-- Offline Path -->
  <text x="400" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#e94560">── Offline Path ──</text>

  <rect x="40" y="260" width="120" height="50" rx="8" fill="#0f3460"/>
  <text x="100" y="290" text-anchor="middle" font-size="12" fill="#fff">User Action</text>
  <line x1="160" y1="285" x2="210" y2="285" stroke="#e94560" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="220" y="260" width="120" height="50" rx="8" fill="#0f3460"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#fff">fetch()</text>
  <line x1="340" y1="285" x2="390" y2="285" stroke="#e94560" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="400" y="260" width="140" height="50" rx="8" fill="#533483"/>
  <text x="470" y="290" text-anchor="middle" font-size="12" fill="#fff">Service Worker</text>

  <line x1="470" y1="310" x2="470" y2="340" stroke="#e94560" stroke-width="1.5"/>
  <line x1="470" y1="340" x2="580" y2="340" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="590" y="320" width="130" height="40" rx="6" fill="#16213e"/>
  <text x="655" y="344" text-anchor="middle" font-size="11" fill="#fbbf24">Cache Response</text>

  <line x1="470" y1="340" x2="280" y2="370" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="200" y="355" width="160" height="36" rx="6" fill="#16213e"/>
  <text x="280" y="377" text-anchor="middle" font-size="11" fill="#fbbf24">IndexedDB Queue</text>

  <text x="100" y="380" font-size="10" fill="#888">Replays on reconnect →</text>
</svg>