<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
    </marker>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg2)"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#e94560">PWA Component Dependency Graph</text>

  <!-- App Shell -->
  <rect x="300" y="60" width="200" height="50" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">App Shell</text>

  <!-- Layer 2 -->
  <rect x="60" y="160" width="160" height="44" rx="8" fill="#16213e" stroke="#533483" stroke-width="1.5"/>
  <text x="140" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">UpdatePrompt</text>

  <rect x="260" y="160" width="160" height="44" rx="8" fill="#16213e" stroke="#533483" stroke-width="1.5"/>
  <text x="340" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">OfflineIndicator</text>

  <rect x="460" y="160" width="160" height="44" rx="8" fill="#16213e" stroke="#533483" stroke-width="1.5"/>
  <text x="540" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">InstallButton</text>

  <!-- Layer 3: Hooks -->
  <rect x="30" y="260" width="170" height="44" rx="8" fill="#533483" stroke="#e94560" stroke-width="1"/>
  <text x="115" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">useSWRegistration</text>

  <rect x="220" y="260" width="150" height="44" rx="8" fill="#533483" stroke="#e94560" stroke-width="1"/>
  <text x="295" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">useOnlineStatus</text>

  <rect x="390" y="260" width="170" height="44" rx="8" fill="#533483" stroke="#e94560" stroke-width="1"/>
  <text x="475" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">usePushSubscription</text>

  <rect x="580" y="260" width="160" height="44" rx="8" fill="#533483" stroke="#e94560" stroke-width="1"/>
  <text x="660" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">useInstallPrompt</text>

  <!-- Layer 4: Core -->
  <rect x="100" y="360" width="160" height="44" rx="8" fill="#0f3460" stroke="#4ade80" stroke-width="1.5"/>
  <text x="180" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Service Worker</text>

  <rect x="320" y="360" width="160" height="44" rx="8" fill="#0f3460" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Cache API</text>

  <rect x="540" y="360" width="160" height="44" rx="8" fill="#0f3460" stroke="#4ade80" stroke-width="1.5"/>
  <text x="620" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">IndexedDB</text>

  <!-- Layer 5: Browser -->
  <rect x="200" y="440" width="400" height="40" rx="8" fill="#16213e" stroke="#888" stroke-width="1"/>
  <text x="400" y="465" text-anchor="middle" font-size="13" font-weight="600" fill="#888">Browser APIs</text>

  <!-- Arrows -->
  <line x1="400" y1="110" x2="140" y2="160" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="110" x2="340" y2="160" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="110" x2="540" y2="160" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="204" x2="115" y2="260" stroke="#533483" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="204" x2="295" y2="260" stroke="#533483" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="540" y1="204" x2="660" y2="260" stroke="#533483" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="115" y1="304" x2="180" y2="360" stroke="#4ade80" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="475" y1="304" x2="400" y2="360" stroke="#4ade80" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="180" y1="404" x2="300" y2="440" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="404" x2="400" y2="440" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="620" y1="404" x2="500" y2="440" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
</svg>