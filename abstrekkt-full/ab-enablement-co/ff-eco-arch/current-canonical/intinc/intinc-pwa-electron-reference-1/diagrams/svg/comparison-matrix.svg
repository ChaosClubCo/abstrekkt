<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" rx="16" fill="url(#bg)"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#e94560">Platform Comparison Matrix</text>

  <!-- Headers -->
  <rect x="20" y="60" width="160" height="40" rx="6" fill="#16213e"/>
  <text x="100" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Capability</text>
  <rect x="190" y="60" width="160" height="40" rx="6" fill="#0f3460"/>
  <text x="270" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">PWA</text>
  <rect x="360" y="60" width="160" height="40" rx="6" fill="#533483"/>
  <text x="440" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Electron</text>
  <rect x="530" y="60" width="160" height="40" rx="6" fill="#0f3460"/>
  <text x="610" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Native</text>
  <rect x="700" y="60" width="180" height="40" rx="6" fill="#533483"/>
  <text x="790" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Tauri</text>

  <!-- Rows -->
  <g font-size="12" fill="#c0c0c0">
    <!-- Row 1 -->
    <rect x="20" y="110" width="160" height="36" rx="4" fill="#16213e" opacity="0.6"/>
    <text x="100" y="133" text-anchor="middle" fill="#e0e0e0">Install Size</text>
    <text x="270" y="133" text-anchor="middle" fill="#4ade80">~0 MB</text>
    <text x="440" y="133" text-anchor="middle" fill="#fbbf24">150-200 MB</text>
    <text x="610" y="133" text-anchor="middle" fill="#4ade80">Native</text>
    <text x="790" y="133" text-anchor="middle" fill="#4ade80">40-50 MB</text>

    <!-- Row 2 -->
    <rect x="20" y="156" width="160" height="36" rx="4" fill="#16213e" opacity="0.4"/>
    <text x="100" y="179" text-anchor="middle" fill="#e0e0e0">File System</text>
    <text x="270" y="179" text-anchor="middle" fill="#fbbf24">Limited</text>
    <text x="440" y="179" text-anchor="middle" fill="#4ade80">Full</text>
    <text x="610" y="179" text-anchor="middle" fill="#4ade80">Full</text>
    <text x="790" y="179" text-anchor="middle" fill="#4ade80">Full</text>

    <!-- Row 3 -->
    <rect x="20" y="202" width="160" height="36" rx="4" fill="#16213e" opacity="0.6"/>
    <text x="100" y="225" text-anchor="middle" fill="#e0e0e0">Offline Support</text>
    <text x="270" y="225" text-anchor="middle" fill="#4ade80">Excellent</text>
    <text x="440" y="225" text-anchor="middle" fill="#4ade80">Excellent</text>
    <text x="610" y="225" text-anchor="middle" fill="#4ade80">Excellent</text>
    <text x="790" y="225" text-anchor="middle" fill="#4ade80">Excellent</text>

    <!-- Row 4 -->
    <rect x="20" y="248" width="160" height="36" rx="4" fill="#16213e" opacity="0.4"/>
    <text x="100" y="271" text-anchor="middle" fill="#e0e0e0">Push Notifications</text>
    <text x="270" y="271" text-anchor="middle" fill="#4ade80">Yes</text>
    <text x="440" y="271" text-anchor="middle" fill="#4ade80">Yes</text>
    <text x="610" y="271" text-anchor="middle" fill="#4ade80">Yes</text>
    <text x="790" y="271" text-anchor="middle" fill="#4ade80">Yes</text>

    <!-- Row 5 -->
    <rect x="20" y="294" width="160" height="36" rx="4" fill="#16213e" opacity="0.6"/>
    <text x="100" y="317" text-anchor="middle" fill="#e0e0e0">Auto-Update</text>
    <text x="270" y="317" text-anchor="middle" fill="#4ade80">Instant</text>
    <text x="440" y="317" text-anchor="middle" fill="#fbbf24">Download</text>
    <text x="610" y="317" text-anchor="middle" fill="#f87171">App Store</text>
    <text x="790" y="317" text-anchor="middle" fill="#fbbf24">Download</text>

    <!-- Row 6 -->
    <rect x="20" y="340" width="160" height="36" rx="4" fill="#16213e" opacity="0.4"/>
    <text x="100" y="363" text-anchor="middle" fill="#e0e0e0">Dev Complexity</text>
    <text x="270" y="363" text-anchor="middle" fill="#4ade80">Low</text>
    <text x="440" y="363" text-anchor="middle" fill="#fbbf24">Medium</text>
    <text x="610" y="363" text-anchor="middle" fill="#f87171">High</text>
    <text x="790" y="363" text-anchor="middle" fill="#fbbf24">Medium</text>

    <!-- Row 7 -->
    <rect x="20" y="386" width="160" height="36" rx="4" fill="#16213e" opacity="0.6"/>
    <text x="100" y="409" text-anchor="middle" fill="#e0e0e0">Native APIs</text>
    <text x="270" y="409" text-anchor="middle" fill="#f87171">Limited</text>
    <text x="440" y="409" text-anchor="middle" fill="#4ade80">Full Node.js</text>
    <text x="610" y="409" text-anchor="middle" fill="#4ade80">Full</text>
    <text x="790" y="409" text-anchor="middle" fill="#4ade80">Rust Bridge</text>

    <!-- Row 8 -->
    <rect x="20" y="432" width="160" height="36" rx="4" fill="#16213e" opacity="0.4"/>
    <text x="100" y="455" text-anchor="middle" fill="#e0e0e0">Cross-Platform</text>
    <text x="270" y="455" text-anchor="middle" fill="#4ade80">All browsers</text>
    <text x="440" y="455" text-anchor="middle" fill="#4ade80">Win/Mac/Lin</text>
    <text x="610" y="455" text-anchor="middle" fill="#fbbf24">Per platform</text>
    <text x="790" y="455" text-anchor="middle" fill="#4ade80">Win/Mac/Lin</text>
  </g>

  <!-- Legend -->
  <circle cx="40" cy="500" r="6" fill="#4ade80"/>
  <text x="52" y="504" font-size="11" fill="#888">Excellent</text>
  <circle cx="140" cy="500" r="6" fill="#fbbf24"/>
  <text x="152" y="504" font-size="11" fill="#888">Moderate</text>
  <circle cx="240" cy="500" r="6" fill="#f87171"/>
  <text x="252" y="504" font-size="11" fill="#888">Limited</text>
</svg>