<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter,system-ui,sans-serif">
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3e50">Push Notification Flow</text>
  <rect x="50" y="60" width="100" height="35" rx="8" fill="#3498db"/><text x="100" y="82" text-anchor="middle" fill="#fff" font-size="11">📱 Web App</text><line x1="100" y1="95" x2="100" y2="500" stroke="#3498db" stroke-width="1" stroke-dasharray="4,4"/><rect x="250" y="60" width="100" height="35" rx="8" fill="#9b59b6"/><text x="300" y="82" text-anchor="middle" fill="#fff" font-size="11">⚙️ Service Worker</text><line x1="300" y1="95" x2="300" y2="500" stroke="#9b59b6" stroke-width="1" stroke-dasharray="4,4"/><rect x="450" y="60" width="100" height="35" rx="8" fill="#e67e22"/><text x="500" y="82" text-anchor="middle" fill="#fff" font-size="11">🖥️ Push Server</text><line x1="500" y1="95" x2="500" y2="500" stroke="#e67e22" stroke-width="1" stroke-dasharray="4,4"/><rect x="650" y="60" width="100" height="35" rx="8" fill="#e74c3c"/><text x="700" y="82" text-anchor="middle" fill="#fff" font-size="11">☁️ FCM/APNs</text><line x1="700" y1="95" x2="700" y2="500" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="80" y="120" font-size="11" fill="#333">1. User clicks 'Enable Notifications'</text><text x="80" y="152" font-size="11" fill="#333">2. App requests Notification.requestPermission()</text><text x="80" y="184" font-size="11" fill="#333">3. User grants permission</text><text x="80" y="216" font-size="11" fill="#333">4. App subscribes via Push API → gets PushSubscription</text><text x="80" y="248" font-size="11" fill="#333">5. App sends subscription to server (POST /subscribe)</text><text x="80" y="280" font-size="11" fill="#333">6. Server stores subscription in database</text><text x="80" y="312" font-size="11" fill="#333">7. Event occurs → Server creates encrypted payload</text><text x="80" y="344" font-size="11" fill="#333">8. Server POSTs to push service endpoint (VAPID auth)</text><text x="80" y="376" font-size="11" fill="#333">9. FCM/APNs queues and delivers to device</text><text x="80" y="408" font-size="11" fill="#333">10. SW receives 'push' event → showNotification()</text><text x="80" y="440" font-size="11" fill="#333">11. User clicks → 'notificationclick' → open/focus app</text>
</svg>