<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <marker id="arr5" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="16" fill="url(#bg5)"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#e94560">Migration Paths</text>

  <!-- Source nodes -->
