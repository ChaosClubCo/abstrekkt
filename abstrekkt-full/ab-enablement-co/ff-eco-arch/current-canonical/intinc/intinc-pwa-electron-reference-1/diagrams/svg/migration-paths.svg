  <rect x="350" y="300" width="160" height="50" rx="10" fill="#533483"/>
  <text x="430" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">PWA (Lite)</text>

  <!-- Effort labels -->
  <rect x="620" y="60" width="150" height="50" rx="8" fill="#16213e"/>
