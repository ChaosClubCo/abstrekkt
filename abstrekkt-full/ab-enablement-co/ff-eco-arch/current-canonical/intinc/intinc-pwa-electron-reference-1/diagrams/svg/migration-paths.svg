  <text x="695" y="178" text-anchor="middle" font-size="10" fill="#888">Wrap existing app</text>

  <rect x="620" y="220" width="150" height="50" rx="8" fill="#16213e"/>
  <text x="695" y="242" text-anchor="middle" font-size="11" fill="#fbbf24">4-6 hours</text>
  <text x="695" y="258" text-anchor="middle" font-size="10" fill="#888">Rust bridge setup</text>

  <rect x="620" y="300" width="150" height="50" rx="8" fill="#16213e"/>
  <text x="695" y="322" text-anchor="middle" font-size="11" fill="#4ade80">4 hours</text>
  <text x="695" y="338" text-anchor="middle" font-size="10" fill="#888">Manifest + icons only</text>

  <!-- Arrows -->
  <line x1="170" y1="95" x2="350" y2="80" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr5)"/>
  <line x1="170" y1="110" x2="350" y2="160" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr5)"/>
