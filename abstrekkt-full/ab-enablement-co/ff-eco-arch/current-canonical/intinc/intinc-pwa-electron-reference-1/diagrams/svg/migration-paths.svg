  <line x1="170" y1="210" x2="350" y2="245" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr5)"/>
  <line x1="170" y1="210" x2="350" y2="320" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr5)"/>
  <line x1="170" y1="300" x2="350" y2="245" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr5)"/>
  <line x1="510" y1="85" x2="620" y2="85" stroke="#888" stroke-width="1" stroke-dasharray="4"/>
  <line x1="510" y1="165" x2="620" y2="165" stroke="#888" stroke-width="1" stroke-dasharray="4"/>
  <line x1="510" y1="245" x2="620" y2="245" stroke="#888" stroke-width="1" stroke-dasharray="4"/>
