  <text x="100" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Web App</text>

  <rect x="30" y="280" width="140" height="50" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="100" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Electron App</text>

  <!-- Target nodes -->
  <rect x="350" y="60" width="160" height="50" rx="10" fill="#533483"/>
  <text x="430" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">PWA (Full)</text>

