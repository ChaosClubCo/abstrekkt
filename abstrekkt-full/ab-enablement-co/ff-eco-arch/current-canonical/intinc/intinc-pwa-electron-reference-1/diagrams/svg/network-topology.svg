<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter,system-ui,sans-serif">
  <rect width="800" height="450" rx="16" fill="#0f0f23"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#e94560">PWA Network Topology</text>

  <!-- Client Layer -->
  <rect x="50" y="55" width="700" height="100" rx="12" fill="#1a1a2e" stroke="#16213e" stroke-width="1"/>
  <text x="80" y="78" font-size="11" font-weight="600" fill="#e94560">CLIENT</text>

  <rect x="80" y="90" width="100" height="45" rx="6" fill="#0f3460"/>
  <text x="130" y="117" text-anchor="middle" font-size="11" fill="#fff">React App</text>

  <rect x="220" y="90" width="120" height="45" rx="6" fill="#533483"/>
  <text x="280" y="117" text-anchor="middle" font-size="11" fill="#fff">Service Worker</text>

  <rect x="380" y="90" width="100" height="45" rx="6" fill="#0f3460"/>
  <text x="430" y="117" text-anchor="middle" font-size="11" fill="#fff">Cache API</text>

  <rect x="520" y="90" width="100" height="45" rx="6" fill="#0f3460"/>
  <text x="570" y="117" text-anchor="middle" font-size="11" fill="#fff">IndexedDB</text>

  <rect x="660" y="90" width="70" height="45" rx="6" fill="#16213e"/>
  <text x="695" y="117" text-anchor="middle" font-size="10" fill="#888">KV Store</text>

  <!-- CDN Layer -->
  <rect x="50" y="195" width="700" height="70" rx="12" fill="#1a1a2e" stroke="#16213e" stroke-width="1"/>
  <text x="80" y="218" font-size="11" font-weight="600" fill="#fbbf24">CDN / EDGE</text>

  <rect x="200" y="225" width="140" height="30" rx="6" fill="#16213e"/>
  <text x="270" y="244" text-anchor="middle" font-size="10" fill="#fbbf24">Static Assets</text>
  <rect x="380" y="225" width="140" height="30" rx="6" fill="#16213e"/>
  <text x="450" y="244" text-anchor="middle" font-size="10" fill="#fbbf24">API Gateway</text>

  <!-- Origin Layer -->
  <rect x="50" y="305" width="700" height="100" rx="12" fill="#1a1a2e" stroke="#16213e" stroke-width="1"/>
  <text x="80" y="328" font-size="11" font-weight="600" fill="#4ade80">ORIGIN</text>

  <rect x="120" y="340" width="120" height="45" rx="6" fill="#0f3460"/>
  <text x="180" y="367" text-anchor="middle" font-size="11" fill="#fff">API Server</text>

  <rect x="280" y="340" width="120" height="45" rx="6" fill="#0f3460"/>
  <text x="340" y="367" text-anchor="middle" font-size="11" fill="#fff">Push Server</text>

  <rect x="440" y="340" width="120" height="45" rx="6" fill="#0f3460"/>
  <text x="500" y="367" text-anchor="middle" font-size="11" fill="#fff">Auth Service</text>

  <rect x="600" y="340" width="120" height="45" rx="6" fill="#0f3460"/>
  <text x="660" y="367" text-anchor="middle" font-size="11" fill="#fff">Database</text>

  <!-- Connection lines -->
  <line x1="280" y1="135" x2="280" y2="195" stroke="#533483" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="430" y1="135" x2="430" y2="195" stroke="#533483" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="270" y1="265" x2="180" y2="340" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="450" y1="265" x2="340" y2="340" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="450" y1="265" x2="500" y2="340" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Labels -->
  <text x="400" y="435" text-anchor="middle" font-size="11" fill="#888">SW intercepts all requests · Cache-first for static · Network-first for API · Background sync for mutations</text>
</svg>