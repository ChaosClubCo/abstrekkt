<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Inter,system-ui,sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
    .node { font-size: 12px; fill: #fff; }
    .label { font-size: 10px; fill: #666; }
    .yes { fill: #27ae60; font-weight: 600; font-size: 11px; }
    .no { fill: #e74c3c; font-weight: 600; font-size: 11px; }
  </style>
  <text x="450" y="30" text-anchor="middle" class="title">PWA Decision Tree</text>

  <!-- Level 0 -->
  <rect x="325" y="50" width="250" height="40" rx="20" fill="#1a1a2e"/>
  <text x="450" y="75" text-anchor="middle" class="node">Should you build a PWA?</text>

  <!-- Level 1 -->
  <polygon points="450,120 550,160 450,200 350,160" fill="#0f3460"/>
  <text x="450" y="163" text-anchor="middle" class="node" font-size="11">Users visit weekly+?</text>

  <line x1="450" y1="90" x2="450" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes branch -->
  <polygon points="280,250 380,290 280,330 180,290" fill="#0f3460"/>
  <text x="280" y="290" text-anchor="middle" class="node" font-size="11">Content cacheable?</text>
  <line x1="400" y1="180" x2="310" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="210" class="yes">Yes</text>

  <!-- No branch -->
  <polygon points="650,250 750,290 650,330 550,290" fill="#0f3460"/>
  <text x="650" y="290" text-anchor="middle" class="node" font-size="11">Need push?</text>
  <line x1="500" y1="180" x2="600" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="210" class="no">No</text>

  <!-- Cacheable Yes → Offline? -->
  <polygon points="200,380 300,420 200,460 100,420" fill="#0f3460"/>
  <text x="200" y="420" text-anchor="middle" class="node" font-size="11">Need offline?</text>
  <line x1="240" y1="330" x2="220" y2="380" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="355" class="yes">Yes</text>

  <!-- Cacheable No → Standard web -->
  <rect x="310" y="370" width="130" height="35" rx="6" fill="#e74c3c"/>
  <text x="375" y="392" text-anchor="middle" class="node" font-size="11">Standard web app</text>
  <line x1="310" y1="330" x2="360" y2="370" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="350" class="no">No</text>

  <!-- Offline Yes → Full PWA -->
  <rect x="50" y="510" width="160" height="40" rx="8" fill="#0f3460"/>
  <text x="130" y="534" text-anchor="middle" class="node">✅ Path C: Full PWA</text>
  <text x="130" y="548" text-anchor="middle" class="node" font-size="9">120-200 hours</text>
  <line x1="160" y1="460" x2="140" y2="510" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="485" class="yes">Yes</text>

  <!-- Offline No → Path B or D -->
  <rect x="230" y="510" width="160" height="40" rx="8" fill="#533483"/>
  <text x="310" y="534" text-anchor="middle" class="node">✅ Path B or D</text>
  <text x="310" y="548" text-anchor="middle" class="node" font-size="9">8-80 hours</text>
  <line x1="240" y1="460" x2="290" y2="510" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="485" class="no">No</text>

  <!-- Push Yes -->
  <rect x="560" y="370" width="180" height="40" rx="8" fill="#533483"/>
  <text x="650" y="395" text-anchor="middle" class="node">✅ Path A + Push</text>
  <line x1="610" y1="330" x2="620" y2="370" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="350" class="yes">Yes</text>

  <!-- Push No -->
  <rect x="700" y="370" width="130" height="35" rx="6" fill="#e74c3c"/>
  <text x="765" y="392" text-anchor="middle" class="node" font-size="11">❌ Skip PWA</text>
  <line x1="690" y1="330" x2="750" y2="370" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="350" class="no">No</text>

  <!-- Legend -->
  <rect x="20" y="630" width="860" height="50" rx="8" fill="#f8f9fa" stroke="#ddd"/>
  <circle cx="50" cy="655" r="8" fill="#0f3460"/><text x="65" y="659" font-size="11" fill="#333">Decision</text>
  <rect x="140" y="647" width="16" height="16" rx="4" fill="#533483"/><text x="162" y="659" font-size="11" fill="#333">Recommended Path</text>
  <rect x="300" y="647" width="16" height="16" rx="4" fill="#e74c3c"/><text x="322" y="659" font-size="11" fill="#333">Skip/Alternative</text>
  <text x="470" y="659" font-size="11" fill="#27ae60" font-weight="600">Yes</text>
  <text x="510" y="659" font-size="11" fill="#e74c3c" font-weight="600">No</text>
  <text x="560" y="659" font-size="11" fill="#333">= Branch labels</text>
</svg>