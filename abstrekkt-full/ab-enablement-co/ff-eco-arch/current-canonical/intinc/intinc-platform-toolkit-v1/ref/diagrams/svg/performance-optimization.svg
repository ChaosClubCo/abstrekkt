<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter,system-ui,sans-serif">
  <rect width="800" height="400" rx="16" fill="#0f0f23"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#e94560">Performance Optimization Layers</text>

  <!-- Build Time -->
  <rect x="30" y="55" width="230" height="310" rx="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="1.5"/>
  <text x="145" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#4ade80">Build Time</text>
  <rect x="50" y="95" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="145" y="115" text-anchor="middle" font-size="11" fill="#e0e0e0">Tree Shaking</text>
  <rect x="50" y="135" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="145" y="155" text-anchor="middle" font-size="11" fill="#e0e0e0">Code Splitting</text>
  <rect x="50" y="175" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="145" y="195" text-anchor="middle" font-size="11" fill="#e0e0e0">Asset Compression (Brotli)</text>
  <rect x="50" y="215" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="145" y="235" text-anchor="middle" font-size="11" fill="#e0e0e0">Image Optimization</text>
  <rect x="50" y="255" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="145" y="275" text-anchor="middle" font-size="11" fill="#e0e0e0">CSS Purging</text>
  <rect x="50" y="295" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="145" y="315" text-anchor="middle" font-size="11" fill="#e0e0e0">Preload Hints</text>
  <text x="145" y="352" text-anchor="middle" font-size="10" fill="#4ade80">JS &lt;200KB gz · CSS &lt;50KB gz</text>

  <!-- Load Time -->
  <rect x="285" y="55" width="230" height="310" rx="12" fill="#1a1a2e" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#fbbf24">Load Time</text>
  <rect x="305" y="95" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="400" y="115" text-anchor="middle" font-size="11" fill="#e0e0e0">SW Precache (App Shell)</text>
  <rect x="305" y="135" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="400" y="155" text-anchor="middle" font-size="11" fill="#e0e0e0">Route-Level Lazy Loading</text>
  <rect x="305" y="175" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="400" y="195" text-anchor="middle" font-size="11" fill="#e0e0e0">Critical CSS Inline</text>
  <rect x="305" y="215" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="400" y="235" text-anchor="middle" font-size="11" fill="#e0e0e0">Font Preconnect</text>
  <rect x="305" y="255" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="400" y="275" text-anchor="middle" font-size="11" fill="#e0e0e0">Responsive Images</text>
  <rect x="305" y="295" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="400" y="315" text-anchor="middle" font-size="11" fill="#e0e0e0">Priority Hints</text>
  <text x="400" y="352" text-anchor="middle" font-size="10" fill="#fbbf24">LCP &lt;2.5s · FID &lt;100ms</text>

  <!-- Runtime -->
  <rect x="540" y="55" width="230" height="310" rx="12" fill="#1a1a2e" stroke="#e94560" stroke-width="1.5"/>
  <text x="655" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#e94560">Runtime</text>
  <rect x="560" y="95" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="655" y="115" text-anchor="middle" font-size="11" fill="#e0e0e0">SW Cache Strategies</text>
  <rect x="560" y="135" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="655" y="155" text-anchor="middle" font-size="11" fill="#e0e0e0">Virtual Scrolling</text>
  <rect x="560" y="175" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="655" y="195" text-anchor="middle" font-size="11" fill="#e0e0e0">Web Workers (Heavy Ops)</text>
  <rect x="560" y="215" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="655" y="235" text-anchor="middle" font-size="11" fill="#e0e0e0">Debounce / Throttle</text>
  <rect x="560" y="255" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="655" y="275" text-anchor="middle" font-size="11" fill="#e0e0e0">IndexedDB Batch Ops</text>
  <rect x="560" y="295" width="190" height="32" rx="6" fill="#16213e"/>
  <text x="655" y="315" text-anchor="middle" font-size="11" fill="#e0e0e0">Memory Management</text>
  <text x="655" y="352" text-anchor="middle" font-size="10" fill="#e94560">CLS &lt;0.1 · INP &lt;200ms</text>

  <!-- Bottom bar -->
  <text x="400" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#888">Measure with Lighthouse CI · Monitor with web-vitals.js · Budget with bundlesize</text>
</svg>