<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Inter,system-ui,sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3e50">Service Worker Lifecycle</text>

  <!-- Register -->
  <rect x="275" y="50" width="250" height="40" rx="8" fill="#95a5a6"/>
  <text x="400" y="75" text-anchor="middle" fill="#fff" font-size="12">navigator.serviceWorker.register()</text>
  <line x1="400" y1="90" x2="400" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Download + Parse -->
  <rect x="300" y="120" width="200" height="35" rx="8" fill="#7f8c8d"/>
  <text x="400" y="142" text-anchor="middle" fill="#fff" font-size="12">Download &amp; Parse SW</text>
  <line x1="400" y1="155" x2="400" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Install -->
  <rect x="300" y="185" width="200" height="40" rx="8" fill="#3498db"/>
  <text x="400" y="200" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">🔧 Install Event</text>
  <text x="400" y="215" text-anchor="middle" fill="#dbeafe" font-size="10">Cache app shell (waitUntil)</text>
  <line x1="400" y1="225" x2="400" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Success/Fail branch -->
  <polygon points="400,260 480,290 400,320 320,290" fill="#34495e"/>
  <text x="400" y="294" text-anchor="middle" fill="#fff" font-size="11">Success?</text>

  <!-- Fail -->
  <rect x="550" y="272" width="160" height="35" rx="8" fill="#e74c3c"/>
  <text x="630" y="294" text-anchor="middle" fill="#fff" font-size="12">❌ Install Failed</text>
  <line x1="480" y1="290" x2="550" y2="290" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="283" font-size="10" fill="#e74c3c">No</text>

  <!-- Waiting -->
  <rect x="300" y="345" width="200" height="40" rx="8" fill="#f39c12"/>
  <text x="400" y="362" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">⏳ Waiting</text>
  <text x="400" y="377" text-anchor="middle" fill="#fff" font-size="9">Until all tabs close or skipWaiting()</text>
  <line x1="400" y1="320" x2="400" y2="345" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="335" font-size="10" fill="#27ae60">Yes</text>
  <line x1="400" y1="385" x2="400" y2="415" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Activate -->
  <rect x="300" y="415" width="200" height="40" rx="8" fill="#2ecc71"/>
  <text x="400" y="432" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">⚡ Activate Event</text>
  <text x="400" y="447" text-anchor="middle" fill="#fff" font-size="9">Clean caches + clients.claim()</text>
  <line x1="400" y1="455" x2="400" y2="485" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Active -->
  <rect x="275" y="485" width="250" height="45" rx="8" fill="#27ae60"/>
  <text x="400" y="505" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">✅ Active</text>
  <text x="400" y="522" text-anchor="middle" fill="#e8f8f5" font-size="10">Intercepting fetch, push, sync events</text>
  <line x1="400" y1="530" x2="400" y2="560" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Event handlers -->
  <rect x="150" y="560" width="130" height="35" rx="6" fill="#2980b9"/>
  <text x="215" y="582" text-anchor="middle" fill="#fff" font-size="11">📡 Fetch Events</text>

  <rect x="335" y="560" width="130" height="35" rx="6" fill="#8e44ad"/>
  <text x="400" y="582" text-anchor="middle" fill="#fff" font-size="11">🔔 Push Events</text>

  <rect x="520" y="560" width="130" height="35" rx="6" fill="#d35400"/>
  <text x="585" y="582" text-anchor="middle" fill="#fff" font-size="11">🔄 Sync Events</text>

  <line x1="330" y1="545" x2="215" y2="560" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="545" x2="400" y2="560" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="470" y1="545" x2="585" y2="560" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Redundant -->
  <rect x="575" y="485" width="170" height="35" rx="8" fill="#7f8c8d"/>
  <text x="660" y="507" text-anchor="middle" fill="#fff" font-size="12">Redundant (replaced)</text>
  <line x1="525" y1="507" x2="575" y2="507" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="550" y="500" font-size="9" fill="#7f8c8d">Newer SW</text>

  <!-- Legend -->
  <rect x="50" y="640" width="700" height="40" rx="6" fill="#f8f9fa" stroke="#eee"/>
  <rect x="70" y="650" width="14" height="14" rx="3" fill="#3498db"/><text x="90" y="662" font-size="10" fill="#333">Install</text>
  <rect x="140" y="650" width="14" height="14" rx="3" fill="#f39c12"/><text x="160" y="662" font-size="10" fill="#333">Waiting</text>
  <rect x="220" y="650" width="14" height="14" rx="3" fill="#2ecc71"/><text x="240" y="662" font-size="10" fill="#333">Activate</text>
  <rect x="310" y="650" width="14" height="14" rx="3" fill="#27ae60"/><text x="330" y="662" font-size="10" fill="#333">Active</text>
  <rect x="385" y="650" width="14" height="14" rx="3" fill="#e74c3c"/><text x="405" y="662" font-size="10" fill="#333">Failed</text>
  <rect x="460" y="650" width="14" height="14" rx="3" fill="#7f8c8d"/><text x="480" y="662" font-size="10" fill="#333">Redundant</text>
</svg>