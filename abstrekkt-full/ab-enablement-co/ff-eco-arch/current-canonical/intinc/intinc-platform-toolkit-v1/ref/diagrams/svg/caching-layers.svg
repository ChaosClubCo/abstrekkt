<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter,system-ui,sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3e50">Caching Strategy Layers</text>

  <!-- Request -->
  <rect x="30" y="180" width="120" height="50" rx="25" fill="#3498db"/>
  <text x="90" y="210" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Request</text>

  <!-- SW -->
  <rect x="200" y="140" width="160" height="130" rx="12" fill="#2ecc71"/>
  <text x="280" y="165" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Service Worker</text>
  <text x="280" y="185" text-anchor="middle" fill="#e8f8f5" font-size="10">Route Matching</text>
  <line x1="280" y1="195" x2="280" y2="205" stroke="#fff" stroke-width="0.5"/>
  <text x="280" y="215" text-anchor="middle" fill="#fff" font-size="9">HTML → Network-First</text>
  <text x="280" y="228" text-anchor="middle" fill="#fff" font-size="9">JS/CSS → Cache-First</text>
  <text x="280" y="241" text-anchor="middle" fill="#fff" font-size="9">API → Stale-While-Rev.</text>
  <text x="280" y="254" text-anchor="middle" fill="#fff" font-size="9">Images → Cache-First</text>

  <line x1="150" y1="205" x2="200" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cache Storage -->
  <rect x="420" y="80" width="160" height="100" rx="12" fill="#27ae60"/>
  <text x="500" y="105" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Cache Storage</text>
  <text x="500" y="125" text-anchor="middle" fill="#e8f8f5" font-size="10">static-v2</text>
  <text x="500" y="140" text-anchor="middle" fill="#e8f8f5" font-size="10">dynamic-v2</text>
  <text x="500" y="155" text-anchor="middle" fill="#e8f8f5" font-size="10">images-v2</text>
  <text x="500" y="170" text-anchor="middle" fill="#e8f8f5" font-size="10">api-cache-v2</text>

  <line x1="360" y1="180" x2="420" y2="140" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="150" font-size="9" fill="#27ae60">Check</text>

  <!-- Network -->
  <rect x="420" y="250" width="160" height="70" rx="12" fill="#e74c3c"/>
  <text x="500" y="280" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Network</text>
  <text x="500" y="298" text-anchor="middle" fill="#fce4e4" font-size="10">CDN → Origin Server</text>

  <line x1="360" y1="230" x2="420" y2="270" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="260" font-size="9" fill="#e74c3c">Fetch</text>

  <!-- IndexedDB -->
  <rect x="420" y="350" width="160" height="60" rx="12" fill="#f39c12"/>
  <text x="500" y="378" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">IndexedDB</text>
  <text x="500" y="395" text-anchor="middle" fill="#fff" font-size="10">Offline write queue</text>

  <line x1="360" y1="260" x2="420" y2="365" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="375" y="320" font-size="9" fill="#f39c12">Offline writes</text>

  <!-- Response back -->
  <rect x="640" y="180" width="120" height="50" rx="25" fill="#9b59b6"/>
  <text x="700" y="210" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Response</text>

  <line x1="580" y1="140" x2="640" y2="195" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="160" font-size="9" fill="#27ae60">Cache hit</text>

  <line x1="580" y1="280" x2="640" y2="215" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="260" font-size="9" fill="#e74c3c">Fresh data</text>

  <!-- Background revalidate arrow -->
  <path d="M 560 300 Q 600 330 560 350" fill="none" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="610" y="330" font-size="8" fill="#f39c12">BG revalidate</text>

  <!-- Legend -->
  <rect x="640" y="350" width="230" height="80" rx="8" fill="#f8f9fa" stroke="#eee"/>
  <text x="660" y="370" font-size="11" font-weight="600" fill="#333">Strategies</text>
  <text x="660" y="388" font-size="10" fill="#27ae60">● Cache-First: assets, fonts, images</text>
  <text x="660" y="403" font-size="10" fill="#e74c3c">● Network-First: HTML (3s timeout)</text>
  <text x="660" y="418" font-size="10" fill="#9b59b6">● SWR: API data (show+refresh)</text>
</svg>