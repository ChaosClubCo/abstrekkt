<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Inter,system-ui,sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3e50">Electron IPC Architecture</text>

  <!-- Renderer -->
  <rect x="50" y="55" width="600" height="110" rx="12" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
  <text x="70" y="75" font-size="13" font-weight="700" fill="#c0392b">🔒 Renderer Process (Chromium Sandbox)</text>
  <rect x="80" y="90" width="240" height="55" rx="8" fill="#fff" stroke="#e57373"/>
  <text x="200" y="112" text-anchor="middle" font-size="12" fill="#333">React Application</text>
  <text x="200" y="128" text-anchor="middle" font-size="10" fill="#777">window.electronAPI.readFile(path)</text>
  <rect x="370" y="90" width="250" height="55" rx="8" fill="#fff" stroke="#e57373"/>
  <text x="495" y="112" text-anchor="middle" font-size="12" fill="#333">User Input / Third-Party Code</text>
  <text x="495" y="128" text-anchor="middle" font-size="10" fill="#c0392b">⚠️ Untrusted zone</text>

  <!-- Preload -->
  <rect x="50" y="195" width="600" height="80" rx="12" fill="#fff8e1" stroke="#f39c12" stroke-width="2"/>
  <text x="70" y="218" font-size="13" font-weight="700" fill="#e67e22">🌉 Preload Script (contextBridge)</text>
  <rect x="80" y="230" width="250" height="35" rx="6" fill="#fff" stroke="#ffcc02"/>
  <text x="205" y="252" text-anchor="middle" font-size="11" fill="#333">contextBridge.exposeInMainWorld()</text>
  <rect x="370" y="230" width="250" height="35" rx="6" fill="#fff" stroke="#ffcc02"/>
  <text x="495" y="252" text-anchor="middle" font-size="11" fill="#333">ipcRenderer.invoke(channel, args)</text>

  <!-- Arrow renderer → preload -->
  <line x1="200" y1="145" x2="200" y2="195" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="175" font-size="10" fill="#e67e22">Typed API calls</text>

  <!-- Main -->
  <rect x="50" y="310" width="600" height="130" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="70" y="335" font-size="13" font-weight="700" fill="#2e7d32">🖥️ Main Process (Node.js — Full OS Access)</text>
  <rect x="80" y="350" width="150" height="35" rx="6" fill="#fff" stroke="#66bb6a"/>
  <text x="155" y="372" text-anchor="middle" font-size="11" fill="#333">ipcMain.handle()</text>
  <rect x="250" y="350" width="130" height="35" rx="6" fill="#fff" stroke="#66bb6a"/>
  <text x="315" y="372" text-anchor="middle" font-size="11" fill="#333">Zod Validation</text>
  <rect x="400" y="350" width="110" height="35" rx="6" fill="#fff" stroke="#66bb6a"/>
  <text x="455" y="372" text-anchor="middle" font-size="11" fill="#333">Path Allowlist</text>
  <rect x="530" y="350" width="100" height="35" rx="6" fill="#fff" stroke="#66bb6a"/>
  <text x="580" y="372" text-anchor="middle" font-size="11" fill="#333">fs / shell / net</text>

  <line x1="155" y1="385" x2="250" y2="370" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="370" x2="400" y2="370" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="370" x2="530" y2="370" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow preload → main -->
  <line x1="350" y1="275" x2="350" y2="310" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="283" width="140" height="20" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="350" y="297" text-anchor="middle" font-size="10" fill="#333" font-weight="600">IPC Channel</text>

  <!-- OS -->
  <rect x="150" y="460" width="400" height="30" rx="6" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="350" y="480" text-anchor="middle" font-size="12" fill="#1565c0">🔵 Operating System (Files, Network, Shell, Keychain)</text>
  <line x1="350" y1="440" x2="350" y2="460" stroke="#2196f3" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>