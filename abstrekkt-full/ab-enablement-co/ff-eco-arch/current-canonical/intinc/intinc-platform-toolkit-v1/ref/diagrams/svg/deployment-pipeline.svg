<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <marker id="arr4" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="16" fill="url(#bg4)"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#e94560">CI/CD Build Pipeline</text>

  <!-- Stage 1: Commit -->
  <rect x="20" y="70" width="120" height="80" rx="10" fill="#0f3460" stroke="#4ade80" stroke-width="2"/>
  <text x="80" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">git push</text>
  <text x="80" y="118" text-anchor="middle" font-size="10" fill="#888">Trigger CI</text>
  <text x="80" y="140" text-anchor="middle" font-size="20">📝</text>

  <line x1="140" y1="110" x2="170" y2="110" stroke="#4ade80" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Stage 2: Lint + Type -->
  <rect x="180" y="70" width="120" height="80" rx="10" fill="#16213e" stroke="#533483" stroke-width="1.5"/>
  <text x="240" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Lint &amp;</text>
  <text x="240" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Typecheck</text>
  <text x="240" y="140" text-anchor="middle" font-size="20">🔍</text>

  <line x1="300" y1="110" x2="330" y2="110" stroke="#4ade80" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Stage 3: Unit Tests -->
  <rect x="340" y="70" width="120" height="80" rx="10" fill="#16213e" stroke="#533483" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Unit Tests</text>
  <text x="400" y="116" text-anchor="middle" font-size="10" fill="#888">+ Coverage</text>
  <text x="400" y="140" text-anchor="middle" font-size="20">🧪</text>

  <line x1="460" y1="110" x2="490" y2="110" stroke="#4ade80" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Stage 4: E2E -->
  <rect x="500" y="70" width="120" height="80" rx="10" fill="#16213e" stroke="#533483" stroke-width="1.5"/>
  <text x="560" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">E2E Tests</text>
  <text x="560" y="116" text-anchor="middle" font-size="10" fill="#888">Playwright</text>
  <text x="560" y="140" text-anchor="middle" font-size="20">🎭</text>

  <line x1="620" y1="110" x2="650" y2="110" stroke="#4ade80" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Stage 5: Build -->
  <rect x="660" y="70" width="100" height="80" rx="10" fill="#16213e" stroke="#533483" stroke-width="1.5"/>
  <text x="710" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Build</text>
  <text x="710" y="116" text-anchor="middle" font-size="10" fill="#888">Vite</text>
  <text x="710" y="140" text-anchor="middle" font-size="20">📦</text>

  <line x1="760" y1="110" x2="790" y2="110" stroke="#4ade80" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Stage 6: Deploy -->
  <rect x="800" y="70" width="80" height="80" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <text x="840" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Deploy</text>
  <text x="840" y="140" text-anchor="middle" font-size="20">🚀</text>

  <!-- Lighthouse row -->
  <line x1="710" y1="150" x2="710" y2="190" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="640" y="195" width="140" height="50" rx="8" fill="#16213e" stroke="#fbbf24" stroke-width="1"/>
  <text x="710" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">Lighthouse CI</text>
  <text x="710" y="233" text-anchor="middle" font-size="10" fill="#888">PWA 90+ / Perf 85+</text>

  <!-- Quality gates -->
  <text x="450" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#888">Quality Gates: Coverage ≥70% · No lint errors · LCP &lt;2.5s · CLS &lt;0.1 · All E2E pass</text>
</svg>