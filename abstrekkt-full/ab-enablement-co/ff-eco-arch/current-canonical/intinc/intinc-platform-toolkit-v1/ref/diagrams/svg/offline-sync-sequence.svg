<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter,system-ui,sans-serif">
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3e50">Offline Sync Flow</text>
  <rect x="50" y="60" width="100" height="35" rx="8" fill="#3498db"/><text x="100" y="82" text-anchor="middle" fill="#fff" font-size="11">📱 React App</text><line x1="100" y1="95" x2="100" y2="500" stroke="#3498db" stroke-width="1" stroke-dasharray="4,4"/><rect x="250" y="60" width="100" height="35" rx="8" fill="#27ae60"/><text x="300" y="82" text-anchor="middle" fill="#fff" font-size="11">💾 IndexedDB</text><line x1="300" y1="95" x2="300" y2="500" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4"/><rect x="450" y="60" width="100" height="35" rx="8" fill="#f39c12"/><text x="500" y="82" text-anchor="middle" fill="#fff" font-size="11">📋 Sync Queue</text><line x1="500" y1="95" x2="500" y2="500" stroke="#f39c12" stroke-width="1" stroke-dasharray="4,4"/><rect x="650" y="60" width="100" height="35" rx="8" fill="#e74c3c"/><text x="700" y="82" text-anchor="middle" fill="#fff" font-size="11">🖥️ API Server</text><line x1="700" y1="95" x2="700" y2="500" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="80" y="120" font-size="11" fill="#333">1. User creates/edits item</text><text x="80" y="152" font-size="11" fill="#333">2. App writes to IndexedDB immediately (optimistic UI)</text><text x="80" y="184" font-size="11" fill="#333">3. App enqueues sync operation</text><text x="80" y="216" font-size="11" fill="#333">4. UI updates instantly ✅</text><line x1="70" y1="248" x2="730" y2="248" stroke="#ddd" stroke-width="1"/><text x="400" y="252" text-anchor="middle" font-size="10" fill="#999" font-style="italic">Online Path</text><text x="80" y="280" font-size="11" fill="#333">5a. Queue processes → POST to API server</text><text x="80" y="312" font-size="11" fill="#333">6a. Server confirms → Remove from queue</text><line x1="70" y1="344" x2="730" y2="344" stroke="#ddd" stroke-width="1"/><text x="400" y="348" text-anchor="middle" font-size="10" fill="#999" font-style="italic">Offline Path</text><text x="80" y="376" font-size="11" fill="#333">5b. Operations stay queued while offline</text><text x="80" y="408" font-size="11" fill="#333">6b. Network reconnects → SW processes queue</text><text x="80" y="440" font-size="11" fill="#333">7b. For each: send → success/conflict/retry</text><text x="80" y="472" font-size="11" fill="#333">8b. Conflicts → merge strategy → resolved version sent</text>
</svg>