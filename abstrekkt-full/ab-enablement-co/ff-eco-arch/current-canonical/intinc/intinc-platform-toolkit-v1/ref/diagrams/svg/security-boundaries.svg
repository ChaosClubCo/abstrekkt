<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter,system-ui,sans-serif">
  <rect width="800" height="420" rx="16" fill="#0f0f23"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#e94560">Electron Security Boundaries</text>

  <!-- Renderer Process (Sandboxed) -->
  <rect x="30" y="55" width="350" height="330" rx="12" fill="#1a1a2e" stroke="#f87171" stroke-width="2" stroke-dasharray="8"/>
  <text x="205" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">RENDERER (Sandboxed)</text>
  <text x="205" y="96" text-anchor="middle" font-size="10" fill="#888">No Node.js · No Electron APIs · No FS access</text>

  <rect x="60" y="110" width="290" height="50" rx="8" fill="#0f3460"/>
  <text x="205" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">React Application</text>
  <text x="205" y="148" text-anchor="middle" font-size="10" fill="#888">HTML · CSS · JavaScript</text>

  <rect x="60" y="175" width="290" height="40" rx="8" fill="#16213e" stroke="#fbbf24" stroke-width="1"/>
  <text x="205" y="200" text-anchor="middle" font-size="12" fill="#fbbf24">window.electronAPI.*</text>

  <rect x="60" y="230" width="130" height="35" rx="6" fill="#16213e"/>
  <text x="125" y="252" text-anchor="middle" font-size="10" fill="#e0e0e0">openFile()</text>
  <rect x="200" y="230" width="150" height="35" rx="6" fill="#16213e"/>
  <text x="275" y="252" text-anchor="middle" font-size="10" fill="#e0e0e0">triggerWorkflow()</text>
  <rect x="60" y="275" width="130" height="35" rx="6" fill="#16213e"/>
  <text x="125" y="297" text-anchor="middle" font-size="10" fill="#e0e0e0">readFile()</text>
  <rect x="200" y="275" width="150" height="35" rx="6" fill="#16213e"/>
  <text x="275" y="297" text-anchor="middle" font-size="10" fill="#e0e0e0">checkForUpdate()</text>

  <text x="205" y="340" text-anchor="middle" font-size="10" fill="#888">CSP: default-src 'self'</text>
  <text x="205" y="356" text-anchor="middle" font-size="10" fill="#888">No navigation to external URLs</text>
  <text x="205" y="372" text-anchor="middle" font-size="10" fill="#888">No new window creation</text>

  <!-- Preload Bridge -->
  <rect x="395" y="120" width="20" height="220" rx="4" fill="#fbbf24"/>
  <text x="405" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#0f0f23" transform="rotate(-90 405 240)">contextBridge</text>

  <!-- Main Process (Privileged) -->
  <rect x="430" y="55" width="340" height="330" rx="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
  <text x="600" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#4ade80">MAIN PROCESS (Privileged)</text>
  <text x="600" y="96" text-anchor="middle" font-size="10" fill="#888">Full Node.js · Full OS access · Electron APIs</text>

  <rect x="460" y="110" width="280" height="50" rx="8" fill="#0f3460"/>
  <text x="600" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">IPC Handlers (ipcMain.handle)</text>
  <text x="600" y="148" text-anchor="middle" font-size="10" fill="#888">Input validation · Path sanitization</text>

  <rect x="460" y="175" width="130" height="35" rx="6" fill="#16213e"/>
  <text x="525" y="197" text-anchor="middle" font-size="10" fill="#e0e0e0">fs.readFile()</text>
  <rect x="600" y="175" width="140" height="35" rx="6" fill="#16213e"/>
  <text x="670" y="197" text-anchor="middle" font-size="10" fill="#e0e0e0">dialog.showOpen()</text>

  <rect x="460" y="225" width="130" height="35" rx="6" fill="#16213e"/>
  <text x="525" y="247" text-anchor="middle" font-size="10" fill="#e0e0e0">fetch() to APIs</text>
  <rect x="600" y="225" width="140" height="35" rx="6" fill="#16213e"/>
  <text x="670" y="247" text-anchor="middle" font-size="10" fill="#e0e0e0">autoUpdater</text>

  <rect x="460" y="275" width="130" height="35" rx="6" fill="#16213e"/>
  <text x="525" y="297" text-anchor="middle" font-size="10" fill="#e0e0e0">child_process</text>
  <rect x="600" y="275" width="140" height="35" rx="6" fill="#16213e"/>
  <text x="670" y="297" text-anchor="middle" font-size="10" fill="#e0e0e0">shell.openExt()</text>

  <text x="600" y="340" text-anchor="middle" font-size="10" fill="#888">Code signing enforced</text>
  <text x="600" y="356" text-anchor="middle" font-size="10" fill="#888">ASAR packaging</text>
  <text x="600" y="372" text-anchor="middle" font-size="10" fill="#888">Hardened runtime (macOS)</text>

  <!-- Legend -->
  <rect x="200" y="398" width="12" height="12" rx="2" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="3"/>
  <text x="218" y="409" font-size="10" fill="#888">Sandboxed (untrusted)</text>
  <rect x="370" y="398" width="12" height="12" rx="2" fill="#fbbf24"/>
  <text x="388" y="409" font-size="10" fill="#888">IPC Bridge</text>
  <rect x="480" y="398" width="12" height="12" rx="2" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="498" y="409" font-size="10" fill="#888">Privileged (trusted)</text>
</svg>