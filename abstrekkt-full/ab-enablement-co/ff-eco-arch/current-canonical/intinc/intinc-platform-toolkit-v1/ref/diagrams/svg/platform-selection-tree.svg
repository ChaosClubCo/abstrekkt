<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Inter,system-ui,sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
  <style>.t{font-size:12px;fill:#fff;text-anchor:middle}.d{font-size:11px;fill:#fff;text-anchor:middle}.l{font-size:10px;fill:#666}</style>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#2d3436">Platform Selection Decision Tree</text>

  <rect x="375" y="50" width="250" height="40" rx="20" fill="#2d3436"/>
  <text x="500" y="75" class="t">New Project: Choose Platform</text>

  <polygon points="500,120 620,170 500,220 380,170" fill="#34495e"/>
  <text x="500" y="168" class="d">Needs OS-level access?</text>
  <text x="500" y="180" class="d" font-size="9">(filesystem, shell, tray)</text>
  <line x1="500" y1="90" x2="500" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes: Desktop? -->
  <polygon points="250,270 370,310 250,350 130,310" fill="#34495e"/>
  <text x="250" y="313" class="d">Target platform?</text>
  <line x1="430" y1="195" x2="310" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="230" font-size="11" fill="#27ae60" font-weight="600">Yes</text>

  <!-- No: Offline? -->
  <polygon points="750,270 870,310 750,350 630,310" fill="#34495e"/>
  <text x="750" y="313" class="d">Needs offline?</text>
  <line x1="570" y1="195" x2="690" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="645" y="230" font-size="11" fill="#e74c3c" font-weight="600">No</text>

  <!-- Desktop outcomes -->
  <rect x="50" y="400" width="140" height="45" rx="8" fill="#00b894"/>
  <text x="120" y="420" class="t">🦀 Tauri</text>
  <text x="120" y="435" class="t" font-size="9">40-60MB bundle</text>
  <line x1="190" y1="350" x2="140" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="375" font-size="10" fill="#333">Desktop, small</text>

  <rect x="220" y="400" width="140" height="45" rx="8" fill="#0984e3"/>
  <text x="290" y="420" class="t">💻 Electron</text>
  <text x="290" y="435" class="t" font-size="9">150-200MB bundle</text>
  <line x1="250" y1="350" x2="270" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="375" font-size="10" fill="#333">Desktop, standard</text>

  <rect x="385" y="400" width="140" height="45" rx="8" fill="#fdcb6e"/>
  <text x="455" y="420" font-size="12" text-anchor="middle" fill="#2d3436">📲 Native / RN</text>
  <text x="455" y="435" font-size="9" text-anchor="middle" fill="#2d3436">Per-platform</text>
  <line x1="310" y1="350" x2="430" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="375" font-size="10" fill="#333">Mobile</text>

  <!-- No-OS outcomes -->
  <rect x="620" y="400" width="140" height="45" rx="8" fill="#6c5ce7"/>
  <text x="690" y="420" class="t">📱 PWA</text>
  <text x="690" y="435" class="t" font-size="9">Path B or C</text>
  <line x1="710" y1="350" x2="695" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="375" font-size="11" fill="#27ae60" font-weight="600">Yes</text>

  <rect x="790" y="400" width="160" height="45" rx="8" fill="#95a5a6"/>
  <text x="870" y="420" class="t">🌐 Standard Web</text>
  <text x="870" y="435" class="t" font-size="9">No offline needed</text>
  <line x1="790" y1="350" x2="850" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="830" y="375" font-size="11" fill="#e74c3c" font-weight="600">No</text>
</svg>