appId: com.intinc.electron-reference
productName: "Intinc Electron Reference"
copyright: "Copyright © 2026 Intinc"

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - dist/**/*

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  sign: true

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

publish:
  provider: github
  releaseType: release

electronDownload:
  mirror: "https://npmmirror.com/mirrors/electron/"
