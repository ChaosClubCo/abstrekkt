name: Push Server CI

on:
  push:
    branches: [main, develop]
    paths: ["code/push-server/**"]
  pull_request:
    branches: [main]
    paths: ["code/push-server/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: code/push-server/package-lock.json }
      - run: cd code/push-server && npm ci
      - run: cd code/push-server && npm test
