name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  scaffold-smoke:
    name: Scaffold Smoke Test
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        template: [pwa-react, electron-react, tauri-react, push-server]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scaffold ${{ matrix.template }}
        run: |
          cd /tmp
          node ${{ github.workspace }}/packages/cli-scaffold/dist/index.js create \
            --template ${{ matrix.template }} \
            --name test-${{ matrix.template }} \
            --no-install --no-git --yes
      - name: Verify output
        run: |
          test -f /tmp/test-${{ matrix.template }}/package.json
          test -f /tmp/test-${{ matrix.template }}/tsconfig.json
          test -f /tmp/test-${{ matrix.template }}/README.md
