name: Claude Auto-Fix (Semi-Auto, Draft PR Review)

# Option B (RECOMMENDED): Claude generates a fix, commits to a new branch, opens
# a DRAFT PR for your review. Tests/lint/typecheck run and are reported in the PR.
# You approve & merge. Do NOT enable auto-merge for these branches.
#
# Requires repo secret ANTHROPIC_API_KEY. This is the only workflow that needs a
# credential or contents:write. See ../../SECURITY.md for the safety model and
# why zero-review (Option C) is fenced off to low-risk changes only.

on:
  workflow_dispatch:
    inputs:
      fix_type:
        description: "Type of fix to generate"
        required: true
        type: choice
        options:
          - "add-quality-gates"
          - "add-observability"
          - "add-error-boundaries"
          - "add-tests"
          - "env-example"
          - "buildathon-submission"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-fix:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate fix with Claude
        run: |
          node .github/scripts/claude-fix-generator.mjs \
            --fix-type "${{ inputs.fix_type }}" \
            --project-dir "." \
            --output /tmp/fix.json

      - name: Create fix branch
        run: |
          BRANCH="claude-fix/${{ inputs.fix_type }}-$(date +%s)"
          git config user.name "Claude Auto-Fix Bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Apply generated changes
        run: |
          node .github/scripts/apply-fix.mjs --fix-file /tmp/fix.json --target-dir "."

      - name: Validate (non-blocking; reported in PR)
        continue-on-error: true
        run: |
          npm run lint 2>&1 | tee /tmp/lint.log || true
          npm run typecheck 2>&1 | tee /tmp/typecheck.log || true
          npm test 2>&1 | tee /tmp/test.log || true

      - name: Commit & push
        run: |
          git add -A
          git commit -m "claude: auto-fix ${{ inputs.fix_type }}" || echo "no changes"
          git push origin "${{ env.BRANCH }}"

      - name: Open draft PR (manual review required)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const read = (p) => { try { return fs.readFileSync(p, "utf8"); } catch { return ""; } };
            const fix = JSON.parse(read("/tmp/fix.json") || "{}");
            const lint = read("/tmp/lint.log");
            const types = read("/tmp/typecheck.log");
            const tests = read("/tmp/test.log");
            const pf = (log) => (log.toLowerCase().includes("error") || log.includes("FAIL")) ? "FAILED" : "PASSED";
            const body = [
              `## Claude Auto-Fix: ${{ inputs.fix_type }}`,
              "",
              "Generated by Claude, awaiting your review. **Do NOT auto-merge.**",
              "",
              "### Summary",
              "```", fix.summary || "(none)", "```",
              "### Files modified",
              (fix.filesModified || []).map(f => `- \`${f}\``).join("\n") || "(none)",
              "",
              "### Validation",
              "```",
              `Lint:      ${pf(lint)}`,
              `TypeCheck: ${pf(types)}`,
              `Tests:     ${pf(tests)}`,
              "```",
              "### Review checklist",
              "- [ ] Code matches your style",
              "- [ ] No security issues (secrets, injection)",
              "- [ ] Tests pass locally",
              "- [ ] Ready to merge",
            ].join("\n");
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: process.env.BRANCH,
              base: context.payload.repository.default_branch,
              title: `[Claude Auto-Fix] ${{ inputs.fix_type }}`,
              body,
              draft: true,
            });
            core.notice(`Created draft PR #${pr.data.number}`);
