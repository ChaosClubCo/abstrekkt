name: Project Evaluation (PR Comment)

# Trigger: comment "/evaluate" on a PR. Posts (or updates) a single eval comment.
# Least privilege: reads code, writes PR comments. No repo mutation, no pushes.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  evaluate:
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/evaluate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run evaluator
        id: eval
        run: |
          node .github/scripts/evaluate-project.mjs > /tmp/eval.md
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/eval.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run Replit readiness (if Expo detected)
        id: replit
        run: |
          if grep -q '"expo"' package.json 2>/dev/null || [ -f app.json ]; then
            node .github/scripts/replit-readiness-check.mjs > /tmp/replit.md
            echo "output<<EOF" >> "$GITHUB_OUTPUT"
            cat /tmp/replit.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing bot comment
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const marker = "<!-- EVAL-BOT -->";
            const existing = comments.find(c => c.body && c.body.includes(marker));
            core.setOutput("comment_id", existing ? String(existing.id) : "");

      - name: Post or update PR comment
        uses: actions/github-script@v7
        env:
          EVAL_OUTPUT: ${{ steps.eval.outputs.output }}
          REPLIT_OUTPUT: ${{ steps.replit.outputs.output }}
        with:
          script: |
            const marker = "<!-- EVAL-BOT -->";
            const evalOut = process.env.EVAL_OUTPUT || "";
            const replitOut = process.env.REPLIT_OUTPUT || "";
            const body = `${marker}\n${evalOut}${replitOut ? `\n\n${replitOut}` : ""}`;
            const issue_number = context.payload.issue.number;
            const { owner, repo } = context.repo;
            const commentId = "${{ steps.find.outputs.comment_id }}";
            if (commentId) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: Number(commentId), body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
