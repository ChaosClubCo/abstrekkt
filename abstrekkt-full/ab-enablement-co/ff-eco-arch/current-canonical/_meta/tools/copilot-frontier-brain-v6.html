<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontier Brain v6 · Copilot Studio Agent Architect</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c19;--card:rgba(13,20,38,0.9);--border:rgba(255,255,255,0.07);--cyan:#06b6d4;--violet:#8b5cf6;--pink:#ec4899;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;--font:'Outfit',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;overflow:hidden;display:flex}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px}
input,select,textarea{background:rgba(15,23,42,.8);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:var(--font)}
input:focus,select:focus,textarea:focus{border-color:rgba(6,182,212,.4)}textarea{resize:vertical;min-height:56px}select{cursor:pointer}button{font-family:var(--font);cursor:pointer}
#sb{width:200px;background:rgba(13,20,38,.95);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.logo{padding:12px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.logo-t{font-size:13px;font-weight:800;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-s{font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
#nav{flex:1;overflow-y:auto;padding:4px 3px}
.nb{width:100%;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-size:11.5px;font-weight:500;text-align:left}
.nb:hover{background:rgba(255,255,255,.03)}.nb.on{background:rgba(255,255,255,.06);color:var(--text);font-weight:700}
.nb .bg{margin-left:auto;min-width:16px;height:16px;border-radius:999px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center}
#sbf{padding:8px 6px;border-top:1px solid var(--border)}
#mn{flex:1;display:flex;flex-direction:column;overflow:hidden}
#hd{padding:13px 22px;border-bottom:1px solid var(--border);background:rgba(8,12,25,.95);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#hd h1{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
#ct{flex:1;overflow-y:auto;padding:18px 22px 60px}
.cd{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;position:relative}
.sd{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.7}
.tg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.ab{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(6,182,212,.06);border:1px dashed rgba(6,182,212,.25);border-radius:10px;padding:10px;color:#67e8f9;font-size:12px;width:100%}.ab:hover{background:rgba(6,182,212,.1)}
.sb2{display:flex;align-items:center;gap:4px;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.2);border-radius:8px;padding:5px 12px;color:#67e8f9;font-size:12px}.sb2:hover{background:rgba(6,182,212,.15)}
.rb{background:none;border:none;color:var(--dim);font-size:14px;padding:4px}.rb:hover{color:var(--red)}
.tp{position:relative;display:inline-flex;cursor:help;margin-left:3px}
.tp::after{content:attr(data-t);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:260px;padding:10px 12px;background:#1e293b;border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--text);line-height:1.65;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .15s;font-weight:400;white-space:normal}
.tp:hover::after{opacity:1}.tp svg{width:14px;height:14px}
.sp{position:absolute;right:4px;top:0;background:none;border:none;color:var(--dim);font-size:14px;padding:2px 4px;transition:all .15s;z-index:2}.sp:hover{color:var(--cyan);transform:scale(1.2)}
.sp.ld{animation:pu .8s infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}
.ar{font-size:10px;color:var(--cyan);background:rgba(6,182,212,.05);border:1px solid rgba(6,182,212,.12);border-radius:6px;padding:4px 8px;margin-top:4px;line-height:1.5;display:flex;align-items:flex-start;gap:4px}
.ar .dm{background:none;border:none;color:var(--dim);font-size:10px;margin-left:auto;cursor:pointer;flex-shrink:0}
.rc{background:rgba(139,92,246,.05);border:1px solid rgba(139,92,246,.15);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:11px;color:#c4b5fd;line-height:1.6}
.gs{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(6,182,212,.08),rgba(139,92,246,.08));border:1px solid rgba(6,182,212,.2);border-radius:10px;padding:8px 16px;color:#67e8f9;font-size:12px;font-weight:600;margin-bottom:16px}.gs:hover{background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(139,92,246,.15))}.gs.lk{opacity:.4;cursor:not-allowed}
.sg{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#fcd34d;line-height:1.6}
.gc{border-radius:10px;padding:12px;margin-bottom:6px}
.ci{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:4px;cursor:pointer}.ci:hover{background:rgba(255,255,255,.02)}
.cb{width:14px;height:14px;border-radius:3px;border:2px solid rgba(255,255,255,.2);display:grid;place-items:center;flex-shrink:0;font-size:9px;font-weight:800;margin-top:1px}.cb.dn{border-color:var(--green);background:var(--green);color:#020617}
.mc{cursor:pointer;transition:border-color .15s}.mc:hover{border-color:rgba(255,255,255,.15)}.mc.sel{border-color:rgba(34,197,94,.4)}
.ec{cursor:pointer;text-align:left}.ec:hover{border-color:rgba(6,182,212,.3)}
/* Intent wizard */
.wiz{background:linear-gradient(135deg,rgba(6,182,212,.06),rgba(139,92,246,.06));border:1px solid rgba(6,182,212,.2);border-radius:16px;padding:24px;margin-bottom:20px}
.wiz h2{font-size:18px;font-weight:800;margin-bottom:4px;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.wiz p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.wiz textarea{min-height:80px;border-color:rgba(6,182,212,.3);font-size:14px}
.wiz-btn{background:linear-gradient(135deg,var(--cyan),var(--violet));border:none;border-radius:10px;padding:10px 24px;color:#fff;font-size:14px;font-weight:700;margin-top:12px}
.wiz-btn:disabled{opacity:.4;cursor:not-allowed}
.wiz-out{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.wiz-item{background:rgba(15,23,42,.7);border:1px solid var(--border);border-radius:10px;padding:12px}
.wiz-item h4{font-size:12px;color:var(--cyan);font-weight:700;margin-bottom:6px}
.wiz-accept{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:6px 14px;color:#86efac;font-size:12px;font-weight:600;margin-top:8px}
.wiz-accept:hover{background:rgba(34,197,94,.15)}
/* AI panel */
#ap{width:0;border-left:1px solid var(--border);background:rgba(13,20,38,.95);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .2s}#ap.open{width:320px}
#ac{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.am{max-width:88%;padding:8px 10px;font-size:12px;line-height:1.6;white-space:pre-wrap}
.au{align-self:flex-end;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.15);border-radius:10px 10px 2px 10px}
.abt{align-self:flex-start;background:rgba(15,23,42,.7);border:1px solid rgba(255,255,255,.05);border-radius:10px 10px 10px 2px}
.apb{background:rgba(6,182,212,.05);border:1px solid rgba(6,182,212,.15);border-radius:8px;padding:7px 10px;color:#67e8f9;font-size:11px;width:100%;text-align:left}.apb:hover{background:rgba(6,182,212,.1)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:100}
.mdl{background:#0f172a;border:1px solid rgba(6,182,212,.3);border-radius:18px;padding:24px;max-width:400px;width:90%}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}#ct>div{animation:fi .2s ease}
</style>
</head>
<body>
<div id="sb">
  <div class="logo"><span style="font-size:16px">🧠</span><div><div class="logo-t">Frontier Brain</div><div class="logo-s">v6 · Agent Architect</div></div></div>
  <div id="nav"></div>
  <div id="sbf"><button class="nb" onclick="toggleAI()" style="border:1px solid rgba(6,182,212,.2);background:rgba(6,182,212,.04);border-radius:7px"><span style="font-size:12px">💬</span><span>AI Chat</span></button></div>
</div>
<div id="mn"><div id="hd"></div><div id="ct"></div></div>
<div id="ap">
  <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:700">✨ AI Assistant</span><button class="rb" onclick="toggleAI()">✕</button></div>
  <div id="ac"></div>
  <div style="padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px">
    <input id="ai" placeholder="Ask..." onkeydown="if(event.key==='Enter')sendAI()" style="flex:1;font-size:11px;border-color:rgba(6,182,212,.15)">
    <button onclick="sendAI()" style="background:linear-gradient(135deg,var(--cyan),var(--violet));border:none;border-radius:7px;padding:5px 10px;color:#fff;font-size:12px">→</button>
  </div>
</div>
<div id="mr"></div>

<script>
const $=s=>document.getElementById(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const opt=(p,v)=>{let h='';for(let i=0;i<p.length;i+=2)h+=`<option value="${p[i]}" ${v===p[i]?'selected':''}>${p[i+1]}</option>`;return h;};

// ═══ STATE ═══
const A={sec:'wizard',aiOpen:false,msgs:[],ld:false,chk:{},rsn:{},wizResult:null,
  agent:{
    config:{name:'',description:'',instructions:'',orchestration:'generative',model:'gpt-4.1',license:'standalone',language:'en-US',suggestedPrompts:['','','','','','']},
    personas:[],knowledge:[],tools:[],topics:[],
    auth:{provider:'microsoft',clientId:'',tenantId:'',scopes:['profile','openid'],redirectUri:'',ssoEnabled:false,tokenExchangeUrl:''},
    computerUse:{enabled:false,targetUrl:'',taskInstructions:'',machineType:'hosted_browser',errorHandling:'',humanSupervision:false},
    powerPlatform:{environment:'',environmentType:'production',dataverseSearch:false,tenantGraphGrounding:false,envVariables:[]},
    collections:[],alm:{solutionName:'',publisher:'',devEnv:'',testEnv:'',prodEnv:'',exportType:'managed'},
    governance:{agent365Enabled:false,defenderEnabled:false,purviewEnabled:false,auditEnabled:false,dlpReviewed:false,restrictedSPSearch:false},
    channels:[]
  }
};

const SECS=[
  {id:'wizard',n:'✨ Intent Wizard',i:'🪄'},
  {id:'config',n:'Agent Config',i:'⚙'},{id:'personas',n:'Personas',i:'👥'},{id:'knowledge',n:'Knowledge Sources',i:'📚'},
  {id:'tools',n:'Tools & Actions',i:'⚡'},{id:'topics',n:'Topics & Triggers',i:'🔀'},{id:'auth',n:'Auth & Security',i:'🔒'},
  {id:'orchestration',n:'Orchestration',i:'🧠'},{id:'models',n:'Models',i:'🤖'},{id:'computer_use',n:'Computer Use',i:'🖥'},
  {id:'power_platform',n:'Power Platform',i:'📦'},{id:'collections',n:'Collections',i:'📂'},{id:'alm',n:'Solutions & ALM',i:'🔄'},
  {id:'governance',n:'Governance',i:'🛡'},{id:'channels',n:'Channels',i:'📡'},
  {id:'gaps',n:'Gap Analysis',i:'🔍'},{id:'testplan',n:'Test Plan',i:'✅'},{id:'integration',n:'Integration Check',i:'🔗'},
  {id:'preflight',n:'Pre-Publish',i:'🚀'},{id:'export',n:'Export Specs',i:'📤'}
];

const TT={agentName:"Appears in Teams/M365. Users search by this. Use 2-4 word descriptive name (e.g. 'IT Ticket Helper' not 'Agent').",agentDesc:"Generative orchestration uses this to route. 1-2 sentences: WHAT it does + WHEN to use it. Also say what it CANT do.",instructions:"System prompt. 12k char limit. Include: persona, constraints, escalation rules, output format, what NOT to do.",orchestration:"Generative=AI dynamically picks tools/topics/knowledge (25 websites). Classic=trigger-phrase matching only (4 websites).",model:"GPT-4.1=production. GPT-5.x=preview only. GPT-5.2 needs M365 license.",license:"M365 unlocks: tenant graph grounding, 512MB files, better SP retrieval. Standalone=7MB limit.",ksType:"Website=Copilot crawls live. SP Site=full (no 500 limit). File=static upload (500 max). Dataverse=structured tables (2 sources, 15 tables each).",ksDesc:"CRITICAL. Orchestrator reads this to decide WHEN to search. Include what it contains AND what it cant answer.",toolDesc:"THE #1 routing signal. Include: what it does + when to invoke + what inputs needed. Also what it DOESNT do.",toolAuth:"End User=their perms (recommended). Maker=YOUR perms (security risk). None=no auth.",topicDesc:"Generative: routes topic. Classic: informational. Write like briefing a dispatcher.",authScopes:"profile+openid=baseline. Sites.Read.All+Files.Read.All=required for SharePoint knowledge.",cuEnabled:"Preview. Web ~80%/Desktop ~35%. CAPTCHA=hard stop. 1 session/user. Not for production."};
function tp(k){const t=TT[k];if(!t)return'';return `<span class="tp" data-t="${t.replace(/"/g,'&quot;')}"><svg viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>`;}

// ═══ SEED GATE ═══
function seedOk(){return A.agent.config.name.length>=2&&A.agent.config.description.length>=10&&A.agent.personas.length>=1;}
function seedHTML(){if(seedOk())return'';const m=[];if(A.agent.config.name.length<2)m.push('Name');if(A.agent.config.description.length<10)m.push('Description (10+ chars)');if(!A.agent.personas.length)m.push(`<a href="#" onclick="nav('personas');return false" style="color:#67e8f9">Add a Persona →</a>`);return `<div class="sg">🔒 <strong>AI needs:</strong> ${m.join(' · ')}</div>`;}

// ═══ AI GENERATION ═══
const SYS_BASE=`You are a Microsoft Copilot Studio expert. HARD LIMITS: 500 files, 5 concurrent sources, 500 total objects, generative=25 websites/classic=4, 2 Dataverse (15 tables each), 1000 topics (250 Teams), 12000 char prompt, 30-40 tools+topics perf cliff. SP files <7MB w/o M365 (512MB with). No sensitivity-labeled files. No '&' in SP names. Guest users blocked from SP in SSO. Auth NOT inherited on import. Single credential sign-in NOT supported.

BEST PRACTICES (from Microsoft docs):
- Use simple, direct language. No jargon.
- Active voice, present tense: "This tool provides..." not "Weather info is provided..."
- Descriptions: 1-2 sentences explaining what it does AND what it CANT do
- Names: 2-4 word descriptive phrases, never generic ("Weather Forecast" not "Weather")
- Use keywords matching user intent
- Instructions: include persona, constraints, escalation, output format, what NOT to do`;

async function aiGen(path,label,constraint,isDrop,opts){
  if(!seedOk()&&!['config.name','config.description'].includes(path)&&!path.startsWith('personas')){
    const m=[];if(A.agent.config.name.length<2)m.push('Name');if(A.agent.config.description.length<10)m.push('Description');if(!A.agent.personas.length)m.push('Persona');
    alert('AI needs: '+m.join(', '));return;}
  const el=document.querySelector(`[data-g="${path}"]`);if(el){el.classList.add('ld');el.textContent='⏳';}
  const ctx=JSON.stringify({config:A.agent.config,personas:A.agent.personas,knowledge:A.agent.knowledge.map(k=>({type:k.type,name:k.name,description:k.description})),tools:A.agent.tools.map(t=>({type:t.type,name:t.name,description:t.description})),auth:{provider:A.agent.auth.provider,scopes:A.agent.auth.scopes}});
  const prompt=isDrop
    ?`${SYS_BASE}\n\nAgent: ${ctx}\n\nRECOMMEND best value for "${label}". Options: ${opts}. Constraint: ${constraint}\n\nFormat:\nVALUE: [option]\nREASON: [1-2 sentences referencing this agents specific config]\n\nIf unsure: VALUE: UNSURE`
    :`${SYS_BASE}\n\nAgent: ${ctx}\n\nGENERATE content for "${label}". Constraint: ${constraint}\n\nFormat:\nCONTENT: [text, no quotes/markdown]\nREASON: [1 sentence]\n\nIf insufficient context: CONTENT: NEED_CONTEXT`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();const txt=d.content?.map(c=>c.text||'').join('\n')||'';
    if(isDrop){const v=txt.match(/VALUE:\s*(.+)/),re=txt.match(/REASON:\s*(.+)/);A.rsn[path]={type:'rec',val:v?v[1].trim():'unsure',reason:re?re[1].trim():''};}
    else{const c=txt.match(/CONTENT:\s*([\s\S]*?)(?=\nREASON:|$)/),re=txt.match(/REASON:\s*(.+)/);const content=c?c[1].trim():'';
      if(content&&content!=='NEED_CONTEXT'){setV(path,content);A.rsn[path]={type:'gen',reason:re?re[1].trim():''};}
      else A.rsn[path]={type:'gen',reason:re?re[1].trim():'Need more context.'};}
  }catch(e){A.rsn[path]={type:'gen',reason:'Error: '+e.message};}
  if(el){el.classList.remove('ld');el.textContent='✨';}render();
}

function setV(p,v){const k=p.split('.');let o=A.agent;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;}
function dismissR(p){delete A.rsn[p];render();}
function sp(p,l,c,d,o){return `<button class="sp" data-g="${p}" onclick="event.preventDefault();aiGen('${p}','${esc(l)}','${esc(c)}',${!!d},${d?`'${esc(o)}'`:'null'})" title="✨ AI Generate">✨</button>`;}
function rn(p){const r=A.rsn[p];if(!r)return'';if(r.type==='rec')return `<div class="rc">✨ Recommended: <strong>${esc(r.val)}</strong> — ${esc(r.reason)} <button class="rb" style="float:right;font-size:10px" onclick="dismissR('${p}')">✕</button></div>`;return `<div class="ar"><span>✨ ${esc(r.reason)}</span><button class="dm" onclick="dismissR('${p}')">✕</button></div>`;}
function gsb(id,fields){const lk=!seedOk()&&id!=='config'&&id!=='personas'&&id!=='wizard';const n=SECS.find(s=>s.id===id)?.n||id;if(lk)return `<button class="gs lk" onclick="alert('Fill seed fields first')" disabled>✨ Generate ${n}</button>`;window['_g_'+id]=fields;return `<button class="gs" onclick="genSec('${id}',window['_g_${id}'])">✨ Generate ${n}</button>`;}
function seedAlert(){alert('Fill seed fields first.');}
async function genSec(id,f){for(const x of f)await aiGen(x.path,x.label,x.constraint,false,null);}

// ═══ INTENT WIZARD ═══
async function runWizard(){
  const intent=$('wiz-input').value.trim();if(!intent)return;
  const btn=$('wiz-btn');btn.disabled=true;btn.textContent='Analyzing...';
  const prompt=`${SYS_BASE}\n\nA user wants to build a Copilot Studio agent. Their intent:\n"${intent}"\n\nGenerate a complete agent starter based on this intent. Respond ONLY in this JSON format (no markdown, no backticks):\n{"name":"2-4 word agent name","description":"1-2 sentences: what it does + when to use it","instructions":"Full system prompt (2000-4000 chars). Include persona, constraints, escalation, output format, what NOT to do.","personas":[{"name":"persona name","type":"employee|customer|partner|admin","channel":"teams|m365_copilot|web|power_page","needs":"what this persona needs"}],"suggestedPrompts":["prompt1","prompt2","prompt3","prompt4","prompt5","prompt6"],"recommendedKnowledge":[{"type":"website|sharepoint_site|file|dataverse","name":"source name","reason":"why this source"}],"recommendedTools":[{"type":"agent_flow|prompt|connector","name":"tool name","reason":"why this tool"}]}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();const txt=d.content?.map(c=>c.text||'').join('\n')||'';
    const clean=txt.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    const m=clean.match(/\{[\s\S]*\}/);if(m)A.wizResult=JSON.parse(m[0]);
  }catch(e){A.wizResult={error:e.message};}
  btn.disabled=false;btn.textContent='✨ Generate Agent Blueprint';render();
}

function acceptWiz(){
  const w=A.wizResult;if(!w||w.error)return;
  A.agent.config.name=w.name||'';A.agent.config.description=w.description||'';A.agent.config.instructions=w.instructions||'';
  if(w.suggestedPrompts)A.agent.config.suggestedPrompts=w.suggestedPrompts.slice(0,6);while(A.agent.config.suggestedPrompts.length<6)A.agent.config.suggestedPrompts.push('');
  if(w.personas)w.personas.forEach(p=>A.agent.personas.push({id:uid(),name:p.name||'',type:p.type||'employee',channel:p.channel||'teams',needs:p.needs||''}));
  A.wizResult=null;nav('config');
}

// ═══ GAP ENGINE ═══
function gaps(){const a=A.agent,g=[];const p=(s,c,t,d,f)=>g.push({sev:s,cat:c,title:t,detail:d,fix:f});
if(!a.config.name)p('high','gap','No name','Required for publishing.','Config → name.');
if(!a.config.description)p('high','gap','No description','Orchestrator needs this for routing.','Config → description.');
if(!a.config.instructions||a.config.instructions.length<50)p('high','gap',`Instructions ${a.config.instructions?.length||0} chars`,'Primary behavior lever.','Write 2-8k chars.');
if((a.config.instructions?.length||0)>10000)p('warn','bottleneck',`Instructions ${a.config.instructions.length}/12k`,'Near limit.','Move to knowledge.');
if(a.config.model.startsWith('gpt-5'))p('warn','edge','Preview model','Not prod.','Use GPT-4.1.');
if(!a.personas.length)p('high','gap','No personas','Cant scope auth/channels.','Add personas.');
if(!a.knowledge.length)p('warn','gap','No knowledge','No domain data.','Add sources.');
const wm=a.config.orchestration==='generative'?25:4,ws=a.knowledge.filter(k=>k.type==='website');
if(ws.length>wm)p('critical','edge',`${ws.length} websites > ${wm}`,'Publish FAILS.','Remove or switch mode.');
a.knowledge.filter(k=>k.type==='website'&&(!k.description||k.description.length<10)).forEach(k=>p('warn','bottleneck',`"${k.name||'?'}" no desc`,'Wont search.','Add description.'));
const sps=a.knowledge.filter(k=>k.type==='sharepoint_site'||k.type==='sharepoint_files');
if(sps.length&&!a.auth.scopes.includes('Sites.Read.All'))p('critical','edge','SP no Sites.Read.All','Silent fail.','Add scope.');
if(sps.length&&!a.auth.scopes.includes('Files.Read.All'))p('critical','edge','SP no Files.Read.All','Silent fail.','Add scope.');
if(sps.length&&a.auth.ssoEnabled)p('warn','edge','SSO+SP=guests blocked','Absolute.','Disable SSO.');
a.knowledge.filter(k=>(k.name||'').includes('&')||(k.url||'').includes('&')).forEach(k=>p('high','edge',`& in "${k.name}"`,'Breaks indexing.','Remove.'));
const dv=a.knowledge.filter(k=>k.type==='dataverse');if(dv.length>2)p('critical','edge',`${dv.length} DV>2`,'Limit 2.','Consolidate.');
if(dv.length&&!a.powerPlatform.dataverseSearch)p('critical','edge','DV no search','Returns nothing.','Enable.');
a.tools.filter(t=>!t.description||t.description.length<20).forEach(t=>p('high','bottleneck',`Tool "${t.name||'?'}" weak desc`,'Wont route.','Write specific.'));
if(a.tools.length+a.topics.length>35)p('warn','bottleneck',`${a.tools.length+a.topics.length} tools+topics>35`,'Perf cliff.','Split agents.');
if(a.auth.provider!=='none'&&!a.auth.clientId)p('high','gap','No client ID','Auth fails.','Register Entra.');
if(!a.channels.length)p('warn','gap','No channels','Unreachable.','Add channels.');
if(a.computerUse.enabled&&!a.computerUse.taskInstructions)p('high','gap','CU no instructions','Random.','Write steps.');
if(a.governance.restrictedSPSearch)p('critical','edge','Restricted SP','Blocks ALL.','Disable.');
p('info','unknown','Work IQ boundaries','Undocumented.','Test profiles.');
p('info','unknown','MCP tool limit','Undocumented.','Monitor count.');
p('info','unknown','Concurrent source selection','5 active, logic unknown.','Test multi-source.');return g;}

function tests(){const a=A.agent,t=[];const ad=(c,n,s,e,x)=>t.push({cat:c,name:n,steps:s,expected:e,edge:x});
a.knowledge.forEach(k=>{ad('Knowledge','Query: '+(k.name||k.type),['Ask about content','Use terminology'],'Accurate answer',false);ad('Knowledge','Edge: '+(k.name||k.type),['Ask irrelevant'],'Says doesnt have info',true);});
a.tools.forEach(x=>{ad('Tools','Invoke: '+(x.name||x.type),['Trigger via NL','Check result'],'Executes',false);if(x.dynamic)ad('Tools','Wrong ctx: '+x.name,['Wrong query'],'NOT invoked',true);});
if(a.auth.provider!=='none')ad('Auth','Sign-in',['Start unauth','Sign in','Test'],'Smooth',false);
if(a.computerUse.enabled){ad('CU','Happy path',['Trigger','Observe'],'Completes',false);ad('CU','CAPTCHA',['Test banners'],'Reports',true);}
a.channels.filter(c=>c.enabled).forEach(c=>ad('Channels',c.type,['Open','Query','Tool'],'Works',false));
ad('Escalation','Unknown',['Out-of-scope'],'Graceful',true);ad('Escalation','Multi-turn',['Q→followup→change→return'],'Context kept',true);return t;}

function integ(){const a=A.agent,items=[];const ad=(c,i,d,det)=>items.push({cat:c,item:i,done:d,detail:det});
a.knowledge.forEach(k=>{ad('Knowledge',`"${k.name||k.type}": description`,!!(k.description&&k.description.length>10),'Required for routing.');
if(k.type==='dataverse')ad('Knowledge',`DV "${k.name}": search on`,a.powerPlatform.dataverseSearch,'Admin enables.');});
a.tools.forEach(t=>{ad('Tools',`"${t.name||t.type}": desc specific`,!!(t.description&&t.description.length>20),'Generic=never fires.');
if(t.type==='agent_flow'){ad('Tools',`Flow "${t.name}": Copilot trigger`,false,'Verify in PA.');ad('Tools',`Flow "${t.name}": Respond action`,false,'Hangs without.');}});
if(a.auth.provider!=='none'){ad('Auth','Entra app exists',!!a.auth.clientId,'Azure Portal.');ad('Auth','Scopes set',a.auth.scopes.length>2,`[${a.auth.scopes.join(',')}]`);}
a.channels.filter(c=>c.enabled).forEach(c=>ad('Channels',`${c.type}: published`,false,'Test after publish.'));return items;}

function expSec(id){const a=A.agent;if(id==='full')return JSON.stringify(a,null,2);if(id==='gaps')return gaps().map(g=>`[${g.sev}/${g.cat}] ${g.title}\n  ${g.detail}\n  Fix: ${g.fix}`).join('\n\n');if(id==='testplan')return tests().map(t=>`[${t.cat}] ${t.name}${t.edge?' (EDGE)':''}\n  Steps: ${t.steps.join(' → ')}\n  Expected: ${t.expected}`).join('\n\n');if(id==='integration')return integ().map(i=>`[${i.done?'✓':'✗'}] ${i.item}\n  ${i.detail}`).join('\n\n');
const m={config:a.config,personas:a.personas,knowledge:a.knowledge,tools:a.tools,topics:a.topics,auth:a.auth,computer_use:a.computerUse,power_platform:a.powerPlatform,collections:a.collections,alm:a.alm,governance:a.governance,channels:a.channels};return JSON.stringify(m[id]||a,null,2);}
function cpExp(id){navigator.clipboard.writeText(expSec(id));const b=document.querySelector(`[data-e="${id}"]`);if(b){const o=b.textContent;b.textContent='✓ Copied';setTimeout(()=>b.textContent=o,2000);}}

function u(p,v){const k=p.split('.');let o=A.agent;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;render();}
function uS(p,v){const k=p.split('.');let o=A.agent;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;}
function addI(k,it){A.agent[k].push({id:uid(),...it});render();}
function rmI(k,id){A.agent[k]=A.agent[k].filter(x=>x.id!==id);render();}
function upI(k,id,f,v){const i=A.agent[k].find(x=>x.id===id);if(i){i[f]=v;render();}}
function addTr(tid){const t=A.agent.topics.find(x=>x.id===tid);if(t){t.triggers.push('');render();}}
function rmTr(tid,i){const t=A.agent.topics.find(x=>x.id===tid);if(t){t.triggers.splice(i,1);render();}}
function upTr(tid,i,v){const t=A.agent.topics.find(x=>x.id===tid);if(t)t.triggers[i]=v;}
function tgSc(s,c){if(c&&!A.agent.auth.scopes.includes(s))A.agent.auth.scopes.push(s);if(!c)A.agent.auth.scopes=A.agent.auth.scopes.filter(x=>x!==s);render();}
function tgChk(i){A.chk[i]=!A.chk[i];render();}

function rNav(){const crit=gaps().filter(g=>g.sev==='critical'||g.sev==='high').length;
$('nav').innerHTML=SECS.map(s=>`<button class="nb ${A.sec===s.id?'on':''}" onclick="nav('${s.id}')"><span style="font-size:13px;width:20px;text-align:center;flex-shrink:0">${s.i}</span><span>${s.n}</span>${s.id==='gaps'&&crit>0?`<span class="bg">${crit}</span>`:''}</button>`).join('');}

function rHd(){const s=SECS.find(x=>x.id===A.sec);const crit=gaps().filter(g=>g.sev==='critical'||g.sev==='high').length;
$('hd').innerHTML=`<h1><span style="font-size:16px">${s.i}</span> ${s.n}${crit>0&&A.sec!=='gaps'?` <button class="sb2" onclick="nav('gaps')" style="background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);color:#fca5a5;font-size:10px;padding:2px 8px">⚠ ${crit}</button>`:''}</h1><button class="sb2" onclick="cpExp('${A.sec==='export'?'full':A.sec}')" data-e="${A.sec==='export'?'full':A.sec}">📋 Export</button>`;}

function rCt(){const fn={wizard:rWiz,config:rCfg,personas:rPer,knowledge:rKn,tools:rTl,topics:rTp,auth:rAu,orchestration:rOr,models:rMo,computer_use:rCU,power_platform:rPP,collections:rCo,alm:rAL,governance:rGo,channels:rCh,gaps:rGa,testplan:rTe,integration:rIn,preflight:rPf,export:rEx};
$('ct').innerHTML=`<div>${(fn[A.sec]||rWiz)()}</div>`;}

// ═══ TOOLS ═══
function rTl(){return `${seedHTML()}${gsb('tools',A.agent.tools.filter(t=>!t.description||t.description.length<20).map((t,i)=>({path:'tools.'+A.agent.tools.indexOf(t)+'.description',label:'Description for '+t.name,constraint:'What it does + when to invoke + inputs needed + what it DOESNT do'})))}<p class="sd">Description = #1 routing signal. Current: ${A.agent.tools.length+A.agent.topics.length}/35.</p>

    <div class="g3" style="margin-top:8px"><div class="fl"><span>${tp('toolAuth')} Dynamic</span><select onchange="upI('tools','${t.id}','dynamic',this.value==='true')">${opt(['true','Agent decides','false','Explicit only'],String(t.dynamic))}</select></div><div class="fl">Ask user?<select onchange="upI('tools','${t.id}','askUser',this.value==='true')">${opt(['false','No','true','Confirm'],String(t.askUser))}</select></div>${t.type==='mcp'?`<div class="fl">MCP URL<input value="${esc(t.mcpUrl||'')}" onchange="upI('tools','${t.id}','mcpUrl',this.value)"></div>`:''}</div>
  </div>`).join('')}<button class="ab" onclick="addI('tools',{type:'agent_flow',name:'',description:'',auth:'end_user',dynamic:true,askUser:false,mcpUrl:''})">+ Add Tool</button>`;}

// ═══ TOPICS ═══

    <div class="g2"><div class="fl">Name<input value="${esc(t.name)}" onchange="upI('topics','${t.id}','name',this.value)" placeholder="e.g. Create Ticket"></div><div class="fl" style="position:relative"><span>${tp('topicDesc')} Description</span>${sp('topics.'+i+'.description','Topic Description','When this fires. Write like briefing a dispatcher.')}<input value="${esc(t.description)}" onchange="upI('topics','${t.id}','description',this.value)" placeholder="Handles when a user wants to...">${rn('topics.'+i+'.description')}</div></div>
    <div style="margin-top:8px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;color:var(--muted)">Triggers</span><button class="sb2" style="padding:2px 8px;font-size:10px" onclick="addTr('${t.id}')">+</button></div>

    <div class="fl"><span>Provider</span><select onchange="u('auth.provider',this.value);render()">${opt(['none','No Auth','microsoft','Microsoft','entra_v2_secret','Entra V2 (Secret)','manual_oauth','Manual OAuth'],a.provider)}</select></div>

    <div class="fl">SSO<select onchange="u('auth.ssoEnabled',this.value==='true');render()">${opt(['false','Disabled','true','Enabled'],String(a.ssoEnabled))}</select></div>

// ═══ ORCHESTRATION ═══

  <div class="cd" style="margin-top:12px;border-color:rgba(139,92,246,.15)"><span style="font-size:12px;font-weight:700;color:#c4b5fd">Impact</span><p style="font-size:12px;color:var(--muted);margin-top:4px">${o} · ${A.agent.knowledge.filter(k=>k.type==='website').length}/${o==='generative'?25:4} websites · ${tt}/35 tools+topics</p></div>`;}

// ═══ MODELS ═══
function rMo(){return `<div class="g3">${[['gpt-4.1','GPT-4.1','Prod','--green','Stable.'],['gpt-5-chat','GPT-5 Chat','Preview','--amber','Conversational.'],['gpt-5-auto','GPT-5 Auto','Preview','--amber','Auto-selects.'],['gpt-5-reasoning','GPT-5 Reason','Preview','--amber','Multi-step.'],['gpt-5.1','GPT-5.1','Preview','--amber','Latest.'],['gpt-5.2','GPT-5.2','M365','--red','Needs license.']].map(([v,n,s,c,d])=>`<div class="cd mc ${A.agent.config.model===v?'sel':''}" onclick="u('config.model','${v}')"><div style="display:flex;justify-content:space-between"><span style="font-size:12px;font-weight:700">${n}</span><span class="tg" style="background:var(${c})22;color:var(${c})">${s}</span></div><p style="font-size:11px;color:var(--muted);margin-top:4px">${d}</p>${A.agent.config.model===v?'<div style="margin-top:4px;font-size:10px;color:var(--cyan);font-weight:600">✓</div>':''}</div>`).join('')}</div>`;}

// ═══ COMPUTER USE ═══
function rCU(){const c=A.agent.computerUse;return `${seedHTML()}<div class="fl"><span>${tp('cuEnabled')} Enable</span><select onchange="u('computerUse.enabled',this.value==='true');render()" style="max-width:300px">${opt(['false','Disabled','true','Enabled (Preview)'],String(c.enabled))}</select></div>
  ${c.enabled?`<div class="g2" style="margin-top:12px"><div style="display:flex;flex-direction:column;gap:10px"><div class="fl">Target URL<input value="${esc(c.targetUrl)}" onchange="u('computerUse.targetUrl',this.value)"></div><div class="fl">Machine<select onchange="u('computerUse.machineType',this.value)">${opt(['hosted_browser','Hosted Browser','desktop_app','Desktop (~35%)'],c.machineType)}</select></div><div class="fl">Supervision<select onchange="u('computerUse.humanSupervision',this.value==='true')">${opt(['false','Off','true','On'],String(c.humanSupervision))}</select></div></div>

// ═══ POWER PLATFORM ═══
function rPP(){const p=A.agent.powerPlatform;return `${seedHTML()}<div class="g2"><div style="display:flex;flex-direction:column;gap:10px"><div class="fl">Environment<input value="${esc(p.environment)}" onchange="u('powerPlatform.environment',this.value)"></div><div class="fl">Type<select onchange="u('powerPlatform.environmentType',this.value);render()">${opt(['production','Production','sandbox','Sandbox','developer','Developer','teams','Teams (250 topics)'],p.environmentType)}</select></div><div class="fl">DV Search<select onchange="u('powerPlatform.dataverseSearch',this.value==='true')">${opt(['false','Disabled','true','Enabled'],String(p.dataverseSearch))}</select></div><div class="fl">Tenant Graph<select onchange="u('powerPlatform.tenantGraphGrounding',this.value==='true')">${opt(['false','Disabled','true','Enabled (M365)'],String(p.tenantGraphGrounding))}</select></div></div>
  <div><span style="font-size:12px;color:var(--muted);display:block;margin-bottom:8px">Env Variables</span>${(p.envVariables||[]).map((v,i)=>`<div style="display:flex;gap:4px;margin-bottom:4px"><input value="${esc(v.name||'')}" onchange="A.agent.powerPlatform.envVariables[${i}].name=this.value" placeholder="Name" style="flex:1;font-size:11px"><input value="${esc(v.value||'')}" onchange="A.agent.powerPlatform.envVariables[${i}].value=this.value" placeholder="Value" style="flex:1;font-size:11px"><button class="rb" onclick="A.agent.powerPlatform.envVariables.splice(${i},1);render()">✕</button></div>`).join('')}<button class="ab" style="padding:6px;font-size:11px" onclick="A.agent.powerPlatform.envVariables.push({name:'',value:''});render()">+ Add</button></div></div>`;}

// ═══ COLLECTIONS / ALM / GOV / CHANNELS ═══
function rCo(){return `${A.agent.collections.map((c,i)=>`<div class="cd" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:12px;font-weight:700">Collection ${i+1}</span><button class="rb" onclick="rmI('collections','${c.id}')">✕</button></div><div class="g2"><div class="fl">Name<input value="${esc(c.name)}" onchange="upI('collections','${c.id}','name',this.value)"></div><div class="fl">Description<input value="${esc(c.description)}" onchange="upI('collections','${c.id}','description',this.value)"></div></div></div>`).join('')}<button class="ab" onclick="addI('collections',{name:'',description:''})">+ Add</button>`;}

function rAL(){const a=A.agent.alm;return `<div class="g2"><div style="display:flex;flex-direction:column;gap:10px"><div class="fl">Solution<input value="${esc(a.solutionName)}" onchange="u('alm.solutionName',this.value)"></div><div class="fl">Publisher<input value="${esc(a.publisher)}" onchange="u('alm.publisher',this.value)"></div><div class="fl">Export<select onchange="u('alm.exportType',this.value)">${opt(['managed','Managed','unmanaged','Unmanaged'],a.exportType)}</select></div></div><div style="display:flex;flex-direction:column;gap:10px"><div class="fl">Dev<input value="${esc(a.devEnv)}" onchange="u('alm.devEnv',this.value)"></div><div class="fl">Test<input value="${esc(a.testEnv)}" onchange="u('alm.testEnv',this.value)"></div><div class="fl">Prod<input value="${esc(a.prodEnv)}" onchange="u('alm.prodEnv',this.value)"></div></div></div>`;}

function rGo(){return `<div class="g2">${[['agent365Enabled','Agent 365'],['defenderEnabled','Defender'],['purviewEnabled','Purview'],['auditEnabled','Audit'],['dlpReviewed','DLP Reviewed'],['restrictedSPSearch','Restricted SP Search']].map(([k,l])=>`<label class="cd" style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" ${A.agent.governance[k]?'checked':''} onchange="u('governance.${k}',this.checked)" style="accent-color:var(--cyan);width:16px;height:16px"><span style="font-size:13px">${l}</span>${k==='restrictedSPSearch'&&A.agent.governance.restrictedSPSearch?'<span style="font-size:10px;color:#fca5a5;margin-left:auto">⚠ Blocks ALL SP</span>':''}</label>`).join('')}</div>`;}

function rCh(){return `${A.agent.channels.map((c,i)=>`<div class="cd" style="margin-bottom:10px;opacity:${c.enabled?1:.5}"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:8px"><input type="checkbox" ${c.enabled?'checked':''} onchange="upI('channels','${c.id}','enabled',this.checked);render()" style="accent-color:var(--cyan)"><span style="font-size:12px;font-weight:700">${c.type}</span></div><button class="rb" onclick="rmI('channels','${c.id}')">✕</button></div><div class="fl" style="margin-top:8px"><select onchange="upI('channels','${c.id}','type',this.value);render()">${opt(['teams','Teams','m365_copilot','M365 Copilot','web_demo','Demo Website','web_live','Live Website','whatsapp','WhatsApp','custom_canvas','Custom Canvas','power_page','Power Pages'],c.type)}</select></div></div>`).join('')}<button class="ab" onclick="addI('channels',{type:'teams',enabled:true})">+ Add Channel</button>`;}

// ═══ GAP / TEST / INTEG / PREFLIGHT / EXPORT ═══
function rGa(){const g=gaps();const cl={critical:{bg:'rgba(239,68,68,.06)',b:'rgba(239,68,68,.2)',t:'#fca5a5',l:'CRITICAL'},high:{bg:'rgba(245,158,11,.06)',b:'rgba(245,158,11,.2)',t:'#fcd34d',l:'HIGH'},warn:{bg:'rgba(6,182,212,.04)',b:'rgba(6,182,212,.15)',t:'#67e8f9',l:'WARNING'},info:{bg:'rgba(139,92,246,.04)',b:'rgba(139,92,246,.15)',t:'#c4b5fd',l:'UNKNOWN'}};
  return `<p class="sd">${g.length} issues.</p>${['critical','high','warn','info'].map(s=>{const it=g.filter(x=>x.sev===s);if(!it.length)return'';const c=cl[s];return `<div style="margin-bottom:16px"><span class="tg" style="background:${c.bg};color:${c.t};padding:4px 10px;display:inline-flex;margin-bottom:8px">${c.l} (${it.length})</span>${it.map(x=>`<div class="gc" style="background:${c.bg};border:1px solid ${c.b}"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span class="tg" style="background:${c.t}22;color:${c.t}">${x.cat}</span><span style="font-size:13px;font-weight:700">${esc(x.title)}</span></div><p style="font-size:12px;color:var(--muted);line-height:1.6">${esc(x.detail)}</p><p style="margin-top:4px;font-weight:600;font-size:12px;color:${c.t}">→ ${esc(x.fix)}</p></div>`).join('')}</div>`;}).join('')}`;}

function rTe(){const t=tests();return `<p class="sd">${t.length} tests.</p>${['Knowledge','Tools','Auth','CU','Channels','Escalation'].map(c=>{const it=t.filter(x=>x.cat===c);if(!it.length)return'';return `<div style="margin-bottom:16px"><span class="tg" style="background:rgba(34,197,94,.12);color:#86efac;padding:3px 10px">${c} (${it.length})</span>${it.map(x=>`<div class="cd" style="margin-bottom:6px;margin-top:6px;border-left:3px solid ${x.edge?'var(--amber)':'var(--green)'}"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700">${esc(x.name)}</span>${x.edge?'<span class="tg" style="background:rgba(245,158,11,.12);color:#fcd34d">edge</span>':''}</div><div style="margin-top:6px;font-size:11px;color:var(--muted);line-height:1.7"><b>Steps:</b> ${x.steps.map(esc).join(' → ')}<br><b>Expected:</b> ${esc(x.expected)}</div></div>`).join('')}</div>`;}).join('')}`;}

function rIn(){const it=integ();return `<p class="sd">${it.filter(i=>i.done||A.chk[i.item]).length}/${it.length} verified.</p>${['Knowledge','Tools','Auth','Channels'].map(c=>{const ci=it.filter(i=>i.cat===c);if(!ci.length)return'';return `<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:700;margin-bottom:8px">${c}</div>${ci.map(x=>{const d=x.done||A.chk[x.item];return `<div class="ci" onclick="tgChk('${esc(x.item)}')" style="background:${d?'rgba(34,197,94,.03)':'transparent'}"><div class="cb ${d?'dn':''}">${d?'✓':''}</div><div><div style="font-size:12px;color:${d?'var(--dim)':'var(--text)'}">${esc(x.item)}</div><div style="font-size:11px;color:var(--dim);margin-top:2px">${esc(x.detail)}</div></div></div>`;}).join('')}</div>`;}).join('')}`;}

function rPf(){const cr=gaps().filter(g=>g.sev==='critical'||g.sev==='high').length;const te=tests().length;const uc=integ().filter(i=>!i.done&&!A.chk[i.item]).length;
  return `<div class="g3" style="margin-bottom:16px"><div class="cd" style="text-align:center;cursor:pointer" onclick="nav('gaps')"><div style="font-size:20px;font-weight:800;color:${cr?'var(--red)':'var(--green)'}">${cr}</div><div style="font-size:11px;color:var(--muted)">Critical/High</div></div><div class="cd" style="text-align:center;cursor:pointer" onclick="nav('testplan')"><div style="font-size:20px;font-weight:800;color:var(--cyan)">${te}</div><div style="font-size:11px;color:var(--muted)">Tests</div></div><div class="cd" style="text-align:center;cursor:pointer" onclick="nav('integration')"><div style="font-size:20px;font-weight:800;color:var(--amber)">${uc}</div><div style="font-size:11px;color:var(--muted)">Unchecked</div></div></div>
  ${cr?`<div style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:#fca5a5">⚠ ${cr} critical. <button class="sb2" onclick="nav('gaps')" style="font-size:11px;padding:2px 8px;margin-left:8px">View →</button></div>`:`<div style="background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:#86efac">✓ No critical gaps.</div>`}`;}

function rEx(){return `<p class="sd">Click to copy.</p><div class="g3">${[['config','Config'],['personas','Personas'],['knowledge','Knowledge'],['tools','Tools'],['topics','Topics'],['auth','Auth'],['computer_use','CU'],['power_platform','PP'],['collections','Collections'],['alm','ALM'],['governance','Governance'],['channels','Channels'],['gaps','Gaps'],['testplan','Tests'],['integration','Integration'],['full','⬛ FULL']].map(([k,n])=>`<div class="cd ec" onclick="cpExp('${k}')" data-e="${k}"><div style="font-size:12px;font-weight:700">${n}</div><div style="font-size:10px;color:var(--dim);margin-top:4px">Click to copy</div></div>`).join('')}</div>`;}

// ═══ AI CHAT ═══
function toggleAI(){A.aiOpen=!A.aiOpen;$('ap').classList.toggle('open',A.aiOpen);if(A.aiOpen)rAI();}
function rAI(){const c=$('ac');if(!A.aiOpen){c.innerHTML='';return;}
  if(!A.msgs.length){c.innerHTML=['Review my config','What sources do I need?','Generate tool descriptions','What am I missing?'].map(p=>`<button class="apb" onclick="sendAI('${p}')">${p}</button>`).join('');return;}
  c.innerHTML=A.msgs.map(m=>`<div class="am ${m.role==='user'?'au':'abt'}">${esc(m.content)}</div>`).join('')+(A.ld?'<div style="font-size:11px;color:var(--muted);padding:6px">Thinking...</div>':'');c.scrollTop=c.scrollHeight;}
async function sendAI(text){const msg=text||$('ai').value.trim();if(!msg)return;$('ai').value='';
  A.msgs.push({role:'user',content:msg});A.ld=true;rAI();
  const sys=`${SYS_BASE}\n\nAgent: name=${A.agent.config.name}, desc=${A.agent.config.description?.slice(0,100)}, knowledge=${A.agent.knowledge.length}, tools=${A.agent.tools.length}, topics=${A.agent.topics.length}, auth=${A.agent.auth.provider}, channels=${A.agent.channels.length}. Section: ${A.sec}. Top gaps: ${gaps().slice(0,5).map(g=>g.title).join('; ')}. Be direct. Reference actual config.`;
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,system:sys,messages:A.msgs.map(m=>({role:m.role,content:m.content}))})});
    const d=await r.json();A.msgs.push({role:'assistant',content:d.content?.map(c=>c.text||'').join('\n')||d.error?.message||'No response'});
  }catch(e){A.msgs.push({role:'assistant',content:'Error: '+e.message});}A.ld=false;rAI();}

render();
</script>
