# Deploy backend to Replit. Gated (Zone 2) — backend reliability is an open risk.
name: deploy-replit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "type 'deploy' to confirm"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production   # requires human approval in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - name: Pull secrets from Vault
        run: ./infra/vault/scripts/inject-env.sh
      - name: Deploy to Replit
        run: ./scripts/replit-deploy.sh
        env:
          REPLIT_TOKEN: ${{ secrets.REPLIT_TOKEN }}
      - name: Smoke check + register rollback point
        run: ./runbooks/scripts/register-rollback-point.sh
# NOTE: "Replit is always-on/reliable" is an UNVERIFIED claim (see README CLAIMS).
# Keep a rollback point every deploy until validated.
