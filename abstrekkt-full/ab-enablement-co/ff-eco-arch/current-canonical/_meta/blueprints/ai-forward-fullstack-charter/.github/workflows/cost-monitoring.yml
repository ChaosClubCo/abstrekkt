# Poll per-agent API spend; trip the kill switch on runaway cost (Zone 3 protection).
name: cost-monitoring

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-spend:
    runs-on: ubuntu-latest
    env:
      DAILY_USD_LIMIT: "50"        # conservative starting threshold per agent
    steps:
      - uses: actions/checkout@v4
      - name: Fetch agent spend
        run: ./cli-router/scripts/fetch-spend.sh > spend.json   # see cli-router/
      - name: Evaluate thresholds + trip kill switch
        run: |
          node -e '
            const s = require("./spend.json");
            const limit = Number(process.env.DAILY_USD_LIMIT);
            const over = Object.entries(s).filter(([,v]) => v > limit);
            if (over.length) {
              console.error("Over budget:", over);
              // Revoke tokens + pause queues via the CLI router kill switch.
              require("child_process").execSync("./cli-router/scripts/kill-switch.sh " +
                over.map(([a]) => a).join(" "), { stdio: "inherit" });
              process.exit(1);
            }
            console.log("All agents within budget.");
          '
      - name: Alert on trip
        if: failure()
        run: ./observability/scripts/alert.sh "cost kill-switch tripped"
