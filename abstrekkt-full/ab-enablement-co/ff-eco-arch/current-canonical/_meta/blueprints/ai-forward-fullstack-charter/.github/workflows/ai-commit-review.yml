# Validate AI-generated PRs before they can merge.
# Treats every AI commit as an untrusted PR (Zone 2 gate).
name: ai-commit-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint --if-present
      - name: Tests (incl. validation of AI-generated tests)
        run: npm test
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Block direct prod/billing/infra changes
        run: |
          # Fail if the PR touches forbidden (Zone 3) paths without a human label.
          changed=$(git diff --name-only origin/main...HEAD)
          if echo "$changed" | grep -qE '^(infra/|billing/)' && \
             ! echo "${{ join(github.event.pull_request.labels.*.name, ',') }}" | grep -q 'human-approved'; then
            echo "Zone 2/3 path changed without human-approved label"; exit 1
          fi
