
<style>

</style>

<div class="ra-wrap" id="app"></div>

<script>
const SYSTEM_PROMPT = `You are a Routine Architect. Analyze all available project context and output exactly 20 production-ready Claude routine definitions: 10 cron-scheduled (CRON) and 10 API-triggered (API), ranked by value, formatted as copy-pasteable routine cards.

PHASE 1 — DISCOVERY
Run steps in order. Stop at first successful read per step. If nothing is accessible, proceed from session context and connector list alone. Tag every card generated this way [INFERRED].
1. Read first found: README.md, package.json, pyproject.toml, Pipfile, composer.json, Cargo.toml. Extract: project type, language, dependencies, purpose.
2. Scan top-level file structure (2 levels deep). Infer domain: e-commerce, SaaS, automation, content, internal tooling, data pipeline.
3. List every MCP connector active in this session. These define actionable integrations. A card referencing Notion is only [SOURCED] if Notion is present as a connector.
4. Check for .claude/, routines/, or any existing automation config. Note gaps.
5. If a repo is attached: scan 10 most recent commits and open issues/PRs. Surface repeated manual patterns worth automating.

PHASE 2 — SCORING
Score every candidate:
- UNIVERSAL (0-5): Useful regardless of stack, domain, or user
- TIME_SAVE (0-5): Eliminates measurable repetitive manual work per week
- KYLE_SCOPED (YES/NO): Requires n8n, Base44, Supabase, Notion, FlashFusion, or Intinc context

Rank order within each group (CRON / API):
1. UNIVERSAL >= 4 AND TIME_SAVE >= 4 -> top slots
2. UNIVERSAL >= 3 OR TIME_SAVE >= 4 -> middle slots
3. KYLE_SCOPED: YES -> last 2-3 slots

Minimum 3 KYLE_SCOPED routines across both groups combined (hard floor). Known Kyle stack: n8n at krosebrook.app.n8n.cloud, Base44 app 68dd8e79ca073475565c8e16, Supabase project oorstbwcydxwiojrsoim, Notion tasks DB, PostHog, FlashFusion.

If two candidates are functionally duplicate, merge them into one card and explain in RANK NOTE.

PHASE 3 — OUTPUT
Output exactly 20 cards. 10 CRON then 10 API. Use this EXACT format for every card (no deviation):

════════════════════════════════════════
[CRON|API] #N — {Routine Name}
────────────────────────────────────────
TRIGGER    : {5-field POSIX cron expression} OR {POST /trigger/{slug} — Payload: { field: type, ... }}
UNIVERSAL  : {0-5}  |  TIME_SAVE: {0-5}  |  KYLE_SCOPED: {YES/NO}
RANK NOTE  : {One sentence: why this ranked here, or merge rationale.}
TAG        : {[INFERRED] or [SOURCED]}
── INSTRUCTIONS ──────────────────────────────────────────────────
{Complete, self-contained instruction text for this routine. No placeholders. No TODOs. No "replace with your X". Name connectors exactly. Name env vars explicitly (e.g. NOTION_DB_ID) but never embed values. Claude must execute with zero clarification. Max 400 words.}
════════════════════════════════════════

After all 20 cards output this exact block:

DISCOVERY SUMMARY
{One paragraph: what was accessible vs inferred, which connectors drove most recommendations and why, automation gaps that didn't make top 20, what a follow-up run with more context would unlock.}

CONSTRAINTS:
- 5-field POSIX cron syntax only. Sanity-check schedules (catch impossible dates, wrong hour ranges).
- API cards: POST body shape defined inline with explicit types.
- No two cards share the same trigger purpose. Merge duplicates and explain in RANK NOTE.
- KYLE_SCOPED cards must reference at least one: n8n, Base44, Supabase, Notion, FlashFusion, Intinc, PostHog.
- Never embed API keys, tokens, connection strings, or credential values in any instruction block.
- Always output exactly 20 cards. Never fewer.`;

function parseOutput(text) {
  const lines = text.split('\n');
  const cards = [];
  let cur = null;
  let inInstr = false;
  let instrBuf = [];

  const flush = () => {
    if (cur) {
      cur.instructions = instrBuf.join('\n').trim();
      cards.push(cur);
      cur = null; inInstr = false; instrBuf = [];
    }
  };

  for (const line of lines) {
    if (/^[═]{10,}/.test(line.trim())) { flush(); continue; }

    const tm = line.match(/\[(CRON|API)\]\s*#(\d+)\s*[—\-\u2013]\s*(.+)/);
    if (tm) {
      flush();
      cur = { type: tm[1], num: parseInt(tm[2]), name: tm[3].trim(), trigger: '', universal: 3, timeSave: 3, kyleScoped: false, rankNote: '', tag: '[INFERRED]', instructions: '' };
      inInstr = false; instrBuf = [];
      continue;
    }

    if (!cur) continue;

    const trig = line.match(/TRIGGER\s*:\s*(.+)/);
    if (trig) { cur.trigger = trig[1].trim(); continue; }

    const uLine = line.match(/UNIVERSAL\s*:\s*(\d)/);
    if (uLine) {
      cur.universal = parseInt(uLine[1]);
      const ts = line.match(/TIME_SAVE:\s*(\d)/); if (ts) cur.timeSave = parseInt(ts[1]);
      const ks = line.match(/KYLE_SCOPED:\s*(YES|NO)/i); if (ks) cur.kyleScoped = ks[1].toUpperCase() === 'YES';
      continue;
    }

    const rn = line.match(/RANK NOTE\s*:\s*(.+)/); if (rn) { cur.rankNote = rn[1].trim(); continue; }
    const tg = line.match(/TAG\s*:\s*(\[(?:INFERRED|SOURCED)\])/i); if (tg) { cur.tag = tg[1]; continue; }
    if (/[─]{2,}\s*INSTRUCTIONS/.test(line)) { inInstr = true; continue; }
    if (inInstr) instrBuf.push(line);
  }
  flush();

  const sumM = text.match(/DISCOVERY SUMMARY\s*\n([\s\S]+?)(?:\n{3,}|$)/);
  const summary = sumM ? sumM[1].trim() : '';
  return { cards, summary };
}

function generateMarkdown(cards, summary, ctx) {
  const date = new Date().toISOString().split('T')[0];
  const kyle = cards.filter(c => c.kyleScoped).length;
  let md = `# Claude Routine Cards\nGenerated   : ${date}\nSource      : ${ctx.trim() ? 'SOURCED (project context provided)' : 'INFERRED (session context only)'}\nKyle-scoped : ${kyle} / 20 cards\n\n---\n\n`;
  for (const c of cards) {
    md += `${'═'.repeat(40)}\n[${c.type}] #${c.num} — ${c.name}\n${'─'.repeat(40)}\n`;
    md += `TRIGGER    : ${c.trigger}\n`;
    md += `UNIVERSAL  : ${c.universal}  |  TIME_SAVE: ${c.timeSave}  |  KYLE_SCOPED: ${c.kyleScoped ? 'YES' : 'NO'}\n`;
    md += `RANK NOTE  : ${c.rankNote}\nTAG        : ${c.tag}\n── INSTRUCTIONS ──────────────────────────────────────────────────\n${c.instructions}\n${'═'.repeat(40)}\n\n`;
  }
  if (summary) md += `\n---\n\n## DISCOVERY SUMMARY\n\n${summary}\n`;
  return md;
}

// State
let state = {
  ctx: '', cards: [], summary: '', streaming: false,
  streamText: '', phase: '', error: '', filter: 'ALL',
  ctxOpen: true, expandedCards: new Set()
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function pips(val, total = 5) {
  let html = '<div class="ra-pips">';
  for (let i = 0; i < total; i++) html += `<div class="ra-pip${i < val ? ' on' : ''}"></div>`;
  return html + '</div>';
}

function cardHTML(card) {
  const exp = state.expandedCards.has(card.num);
  const kyleBadge = card.kyleScoped ? `<span class="ra-badge badge-kyle" title="Kyle-scoped">KYLE</span>` : '';
  const tagBadge = `<span class="ra-badge ${card.tag === '[SOURCED]' ? 'badge-sourced' : 'badge-inferred'}">${card.tag === '[SOURCED]' ? 'SOURCED' : 'INFERRED'}</span>`;
  return `
    <div class="ra-card" data-num="${card.num}">
      <div class="ra-card-hd">
        <div class="ra-card-badges">
          <span class="ra-badge ${card.type === 'CRON' ? 'badge-cron' : 'badge-api'}">${card.type}</span>
          ${kyleBadge}
        </div>
        <div class="ra-card-name">${card.name}</div>
        <div class="ra-card-num">#${card.num}</div>
      </div>
      <div class="ra-trigger">${escHtml(card.trigger)}</div>
      <div class="ra-scores">
        <div style="display:flex;align-items:center;gap:6px;flex:1">
          <span class="ra-score-lbl">Universal</span>${pips(card.universal)}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex:1">
          <span class="ra-score-lbl">Time save</span>${pips(card.timeSave)}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">${tagBadge}</div>
      ${card.rankNote ? `<div class="ra-rank-note">${escHtml(card.rankNote)}</div>` : ''}
      <button class="ra-expand-btn" data-expand="${card.num}">
        <i class="ti ${exp ? 'ti-chevron-up' : 'ti-chevron-down'}" aria-hidden="true"></i>
        ${exp ? 'Hide instructions' : 'View instructions'}
      </button>
      ${exp ? `<div class="ra-instructions">${escHtml(card.instructions)}</div>` : ''}
    </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filteredCards() {
  const { cards, filter } = state;
  if (filter === 'CRON') return cards.filter(c => c.type === 'CRON');
  if (filter === 'API') return cards.filter(c => c.type === 'API');
  if (filter === 'KYLE') return cards.filter(c => c.kyleScoped);
  return cards;
}

function render() {
  const { ctx, cards, summary, streaming, streamText, phase, error, filter, ctxOpen } = state;
  const fc = filteredCards();
  const kyleCount = cards.filter(c => c.kyleScoped).length;
  const cronCount = cards.filter(c => c.type === 'CRON').length;
  const apiCount = cards.filter(c => c.type === 'API').length;

  const streamPreview = streamText.length > 600 ? '...' + streamText.slice(-600) : streamText;

  document.getElementById('app').innerHTML = `
    <h2 class="sr-only">Routine Architect — generate Claude routine cards from project context</h2>
    <div class="ra-header">
      <div>
        <div class="ra-title">Routine Architect</div>
        <div class="ra-subtitle">Generates 20 production-ready Claude routine cards — 10 cron, 10 API</div>
      </div>
      <div class="ra-hright">
        ${cards.length ? `<button class="ra-btn" id="dl-btn"><i class="ti ti-download" aria-hidden="true"></i>Download .md</button>` : ''}
        <button class="ra-btn ra-btn-primary" id="gen-btn" ${streaming ? 'disabled' : ''}>
          ${streaming ? '<i class="ti ti-loader" aria-hidden="true"></i> Generating...' : '<i class="ti ti-player-play" aria-hidden="true"></i> Generate routines ↗'}
        </button>
      </div>
    </div>

    ${error ? `<div class="ra-error"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ${escHtml(error)}</div>` : ''}

    <div class="ra-section">
      <div class="ra-section-hd" id="ctx-toggle">
        <span><i class="ti ti-code" aria-hidden="true"></i> Project context <span style="font-weight:400;color:var(--color-text-tertiary)">(optional — paste README, package.json, etc.)</span></span>
        <i class="ti ${ctxOpen ? 'ti-chevron-up' : 'ti-chevron-down'}" aria-hidden="true"></i>
      </div>
      ${ctxOpen ? `<textarea id="ctx-input" placeholder="Paste any project context here: README, package.json, file tree, commit log...&#10;&#10;Leave blank to generate from session context alone — all cards will be tagged [INFERRED].">${escHtml(ctx)}</textarea>` : ''}
    </div>

    ${streaming ? `
      <div class="ra-section">
        <div class="ra-phase"><div class="ra-phase-dot"></div>${phase || 'Running discovery...'}</div>
        <div class="ra-stream">${escHtml(streamPreview)}</div>
      </div>
    ` : ''}

    ${cards.length ? `
      <div class="ra-filters">
        <button class="ra-tab${filter==='ALL'?' active':''}" data-f="ALL">All cards<span class="ra-count-badge">${cards.length}</span></button>
        <button class="ra-tab${filter==='CRON'?' active':''}" data-f="CRON">CRON<span class="ra-count-badge">${cronCount}</span></button>
        <button class="ra-tab${filter==='API'?' active':''}" data-f="API">API<span class="ra-count-badge">${apiCount}</span></button>
        <button class="ra-tab${filter==='KYLE'?' active':''}" data-f="KYLE">Kyle-scoped<span class="ra-count-badge">${kyleCount}</span></button>
      </div>
      <div class="ra-grid">${fc.map(cardHTML).join('')}</div>
    ` : (!streaming ? `<div class="ra-empty"><i class="ti ti-wand" style="font-size:28px;margin-bottom:8px;display:block" aria-hidden="true"></i>Paste project context above or click Generate to run from session context.</div>` : '')}

    ${summary ? `
      <div class="ra-summary">
        <div class="ra-summary-lbl">Discovery Summary</div>
        <div class="ra-summary-text">${escHtml(summary)}</div>
      </div>
    ` : ''}

    ${cards.length ? `
      <div class="ra-footer">
        <span class="ra-footer-stat">${cards.length} cards · ${kyleCount} kyle-scoped · ${cronCount} cron · ${apiCount} api</span>
        <span class="ra-footer-stat" style="color:var(--color-text-tertiary)">generated ${new Date().toLocaleDateString()}</span>
      </div>
    ` : ''}
  `;

  // Bind events
  const genBtn = document.getElementById('gen-btn');
  if (genBtn) genBtn.addEventListener('click', runGenerate);

  const dlBtn = document.getElementById('dl-btn');
  if (dlBtn) dlBtn.addEventListener('click', doDownload);

  const ctxToggle = document.getElementById('ctx-toggle');
  if (ctxToggle) ctxToggle.addEventListener('click', () => setState({ ctxOpen: !state.ctxOpen }));

  const ctxInput = document.getElementById('ctx-input');
  if (ctxInput) ctxInput.addEventListener('input', e => { state.ctx = e.target.value; });

  document.querySelectorAll('[data-f]').forEach(btn => {
    btn.addEventListener('click', () => setState({ filter: btn.dataset.f }));
  });

  document.querySelectorAll('[data-expand]').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = parseInt(btn.dataset.expand);
      const s = new Set(state.expandedCards);
      s.has(num) ? s.delete(num) : s.add(num);
      setState({ expandedCards: s });
    });
  });
}

async function runGenerate() {
  setState({ streaming: true, cards: [], summary: '', error: '', streamText: '', phase: 'Phase 1 — Discovery', ctxOpen: false });

  const userMsg = state.ctx.trim()
    ? `PROJECT CONTEXT:\n\n${state.ctx}\n\nRun the full Routine Architect protocol on this project. Output all 20 cards.`
    : `No project files attached. Run the full Routine Architect protocol from session context and connector inventory alone. Tag all generated cards [INFERRED]. Output all 20 cards.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 8000,
        stream: true,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: userMsg }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err?.error?.message || `API error ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const ev = JSON.parse(data);
          if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
            fullText += ev.delta.text;
            let ph = state.phase;
            if (fullText.includes('PHASE 1') || fullText.includes('DISCOVERY')) ph = 'Phase 1 — Discovery';
            if (fullText.includes('PHASE 2') || fullText.includes('SCORING')) ph = 'Phase 2 — Scoring';
            if (fullText.includes('PHASE 3') || fullText.includes('[CRON]') || fullText.includes('[API]')) ph = 'Phase 3 — Generating cards';
            if (fullText.includes('DISCOVERY SUMMARY')) ph = 'Finalizing...';
            state.phase = ph;
            state.streamText = fullText;
            render();
          }
        } catch {}
      }
    }

    const { cards, summary } = parseOutput(fullText);
    setState({ streaming: false, cards, summary, streamText: '', phase: '' });

  } catch (e) {
    setState({ streaming: false, error: e.message || 'Generation failed. Check console.' });
  }
}

function doDownload() {
  const md = generateMarkdown(state.cards, state.summary, state.ctx);
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `routine-cards-${new Date().toISOString().split('T')[0]}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
