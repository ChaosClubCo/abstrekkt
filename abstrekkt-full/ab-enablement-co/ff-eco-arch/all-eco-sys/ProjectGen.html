<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeStack v6.0 | Sovereign Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-vsc-dark-plus.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>

    <style>
        :root { --bg-dark: #050505; --panel-bg: #0a0a0a; --border: #27272a; --accent: #6366f1; }
        body { background-color: var(--bg-dark); color: #a1a1aa; font-family: 'Inter', sans-serif; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .glass-header {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .code-preview { background-color: #0d0d0d !important; font-size: 12px; line-height: 1.5; }
        
        .toggle-checkbox:checked { right: 0; border-color: var(--accent); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--accent); }
        
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
            animation: pulse-indigo 2s infinite;
        }
        @keyframes pulse-indigo {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
    </style>
</head>
<body class="flex flex-col h-screen text-sm">

    <header class="glass-header h-14 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center pulse-ring">
                <i data-lucide="cpu" class="text-white w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-gray-100 tracking-tight flex items-center gap-2">
                    VibeStack <span class="text-indigo-500">Sovereign</span>
                    <span class="text-[10px] bg-indigo-500/10 text-indigo-400 px-1.5 py-0.5 rounded border border-indigo-500/20 font-mono">v6.0</span>
                </h1>
                <p class="text-[10px] text-gray-500 font-mono tracking-wide">NEXT.JS 15 • LANGGRAPH • MDC PROTOCOL</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="hidden md:flex items-center gap-2 px-3 py-1.5 bg-[#111] border border-gray-800 rounded text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span class="text-gray-400">System Nominal</span>
            </div>
            <button onclick="downloadArtifact()" class="bg-white text-black hover:bg-gray-200 px-4 py-2 rounded font-bold text-xs flex items-center gap-2 transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                <i data-lucide="download-cloud" class="w-4 h-4"></i> Generate Artifact
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        
        <aside class="w-80 bg-black border-r border-[#27272a] flex flex-col overflow-y-auto">
            <div class="p-6 space-y-8">
                
                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Project Identity</label>
                    <input type="text" id="projectName" value="nexus-supervisor-v1" class="w-full bg-[#111] border border-gray-800 rounded px-3 py-2 text-gray-300 focus:border-indigo-500 focus:outline-none transition-colors font-mono text-xs">
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest flex items-center justify-between">
                        Architecture Topology
                        <i data-lucide="network" class="w-3 h-3 text-indigo-500"></i>
                    </label>
                    <div class="grid grid-cols-1 gap-2">
                        <button onclick="selectTopology('supervisor')" id="top-supervisor" class="text-left px-3 py-3 rounded border border-indigo-500/50 bg-indigo-500/10 text-white transition-all group">
                            <div class="flex items-center justify-between mb-1">
                                <span class="font-bold text-xs">LangGraph Supervisor</span>
                                <div class="w-2 h-2 bg-indigo-500 rounded-full"></div>
                            </div>
                            <p class="text-[10px] text-indigo-300 leading-relaxed">Central brain orchestrating specialized sub-agents (Researcher, Coder).</p>
                        </button>
                        <button onclick="selectTopology('monolith')" id="top-monolith" class="text-left px-3 py-3 rounded border border-gray-800 bg-[#111] text-gray-400 hover:border-gray-700 transition-all group">
                            <div class="flex items-center justify-between mb-1">
                                <span class="font-bold text-xs">Monolithic SaaS</span>
                            </div>
                            <p class="text-[10px] text-gray-500 leading-relaxed">Standard Next.js 15 App Router with hardened security headers.</p>
                        </button>
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Strictness Gates</label>
                    
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-gray-400">Next.js 15 Async</span>
                        <div class="relative inline-block w-8 h-4 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="nextStrict" checked disabled class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                            <label for="nextStrict" class="toggle-label block overflow-hidden h-4 rounded-full bg-indigo-900 cursor-pointer"></label>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="text-xs text-gray-400">Cursor .mdc Rules</span>
                        <div class="relative inline-block w-8 h-4 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="mdcStrict" checked onchange="regenerate()" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer right-0 border-indigo-500"/>
                            <label for="mdcStrict" class="toggle-label block overflow-hidden h-4 rounded-full bg-indigo-600 cursor-pointer"></label>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="text-xs text-gray-400">Docker Compose</span>
                        <div class="relative inline-block w-8 h-4 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="dockerStrict" onchange="regenerate()" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                            <label for="dockerStrict" class="toggle-label block overflow-hidden h-4 rounded-full bg-gray-800 cursor-pointer"></label>
                        </div>
                    </div>
                </div>

                <div class="mt-auto bg-yellow-500/5 border border-yellow-500/20 p-3 rounded">
                    <div class="flex items-start gap-2">
                        <i data-lucide="alert-triangle" class="w-3 h-3 text-yellow-500 mt-0.5"></i>
                        <div class="space-y-1">
                            <p class="text-[10px] text-yellow-200 font-bold">Download Blocked?</p>
                            <p class="text-[10px] text-yellow-500/80 leading-tight">Chrome may flag the .zip. Click arrow → Keep → Keep Anyway.</p>
                        </div>
                    </div>
                </div>

            </div>
        </aside>

        <div class="w-64 bg-[#0a0a0a] border-r border-[#27272a] flex flex-col">
            <div class="h-10 flex items-center px-4 border-b border-[#27272a] bg-[#0a0a0a]">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Generated Structure</span>
            </div>
            <div id="file-tree" class="flex-1 overflow-y-auto p-2 space-y-0.5 font-mono text-xs">
                </div>
        </div>

        <main class="flex-1 flex flex-col bg-[#050505] relative overflow-hidden">
            <div id="tabs-bar" class="h-10 bg-[#0a0a0a] border-b border-[#27272a] flex items-center overflow-x-auto no-scrollbar">
                </div>
            
            <div class="flex-1 relative overflow-auto">
                <pre class="m-0 p-6 min-h-full code-preview"><code id="code-content" class="language-typescript"></code></pre>
            </div>
        </main>

    </div>

    <script>
        lucide.createIcons();

        // --- 1. STATE MANAGEMENT ---
        let currentTopology = 'supervisor'; // 'supervisor' | 'monolith'
        let activeFile = 'package.json';
        let fileSystem = {};

        function selectTopology(topo) {
            currentTopology = topo;
            
            // Visual Updates
            const btnSup = document.getElementById('top-supervisor');
            const btnMono = document.getElementById('top-monolith');
            
            if (topo === 'supervisor') {
                btnSup.className = "text-left px-3 py-3 rounded border border-indigo-500/50 bg-indigo-500/10 text-white transition-all group";
                btnSup.querySelector('div div').className = "w-2 h-2 bg-indigo-500 rounded-full";
                btnMono.className = "text-left px-3 py-3 rounded border border-gray-800 bg-[#111] text-gray-400 hover:border-gray-700 transition-all group";
            } else {
                btnMono.className = "text-left px-3 py-3 rounded border border-indigo-500/50 bg-indigo-500/10 text-white transition-all group";
                btnSup.className = "text-left px-3 py-3 rounded border border-gray-800 bg-[#111] text-gray-400 hover:border-gray-700 transition-all group";
                btnSup.querySelector('div div').className = "w-2 h-2 bg-gray-600 rounded-full";
            }
            regenerate();
        }

        // --- 2. VETERAN SCAFFOLDING ENGINE (v6.0) ---
        function regenerate() {
            const name = document.getElementById('projectName').value || 'vibestack';
            const mdc = document.getElementById('mdcStrict').checked;
            const docker = document.getElementById('dockerStrict').checked;

            let files = {};

            // --- A. NEXT.JS 15 CORE (Async Hardening) ---
            files['package.json'] = JSON.stringify({
                name: name,
                version: "6.0.0",
                private: true,
                scripts: {
                    dev: "next dev --turbopack",
                    build: "next build",
                    start: "next start",
                    lint: "next lint",
                    "agent:sup": "tsx src/agents/supervisor.ts"
                },
                dependencies: {
                    "next": "15.0.0",
                    "react": "19.0.0",
                    "react-dom": "19.0.0",
                    "zod": "^3.23.0",
                    "@langchain/langgraph": "^0.0.15",
                    "@langchain/openai": "^0.0.28",
                    "lucide-react": "latest"
                },
                devDependencies: {
                    "tsx": "^4.7.0",
                    "typescript": "^5.0.0",
                    "@types/node": "^20.0.0",
                    "@types/react": "^19.0.0"
                }
            }, null, 2);

            files['tsconfig.json'] = `{
  "compilerOptions": {
    "lib": ["dom", "dom.iterable", "esnext"],
    "allowJs": true,
    "skipLibCheck": true,
    "strict": true,
    "noEmit": true,
    "esModuleInterop": true,
    "module": "esnext",
    "moduleResolution": "bundler",
    "resolveJsonModule": true,
    "isolatedModules": true,
    "jsx": "preserve",
    "incremental": true,
    "plugins": [{ "name": "next" }],
    "paths": { "@/*": ["./src/*"] }
  },
  "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],
  "exclude": ["node_modules"]
}`;

            // --- B. TOPOLOGY LOGIC ---
            
            if (currentTopology === 'supervisor') {
                // LangGraph Supervisor Pattern (Search Result 2.3)
                files['src/agents/supervisor.ts'] = `import { StateGraph, END } from "@langchain/langgraph";
import { HumanMessage, BaseMessage } from "@langchain/core/messages";
import { z } from "zod";

// 1. Define State
const AgentState = z.object({
  messages: z.array(z.any()),
  next: z.enum(["researcher", "coder", "FINISH"]),
});

// 2. Supervisor Logic (The Brain)
async function supervisorNode(state: any) {
  const prompt = "You are the supervisor. Manage the conversation between 'researcher' and 'coder'. Return 'FINISH' when done.";
  // Call LLM here (mocked for scaffold)
  return { next: "researcher" };
}

// 3. Graph Construction
const workflow = new StateGraph({ channels: AgentState })
  .addNode("supervisor", supervisorNode)
  .addNode("researcher", async () => ({ messages: [new HumanMessage("Researching...")] }))
  .addNode("coder", async () => ({ messages: [new HumanMessage("Coding...")] }))
  .addEdge("researcher", "supervisor")
  .addEdge("coder", "supervisor")
  .setEntryPoint("supervisor");

export const graph = workflow.compile();`;

                files['src/app/page.tsx'] = `// Client Component for Agent Stream
"use client";
import { useState } from "react";
import { useActions } from "ai/rsc"; // Mock import

export default function AgentConsole() {
  const [log, setLog] = useState<string[]>([]);
  
  return (
    <div className="h-screen bg-black text-green-400 p-8 font-mono">
      <h1 className="text-xl mb-4">> SUPERVISOR_NODE_ACTIVE</h1>
      <div className="border border-green-900 p-4 h-2/3 mb-4 rounded bg-gray-900/50">
        {log.map((l, i) => <div key={i}>{l}</div>)}
      </div>
      <input 
        className="w-full bg-gray-900 border border-green-800 p-2 text-white focus:outline-none"
        placeholder="Command the swarm..."
      />
    </div>
  );
}`;
            } else {
                // Monolith SaaS (Next 15 Strict)
                files['src/app/page.tsx'] = `import { Suspense } from "react";

// Next.js 15: Async Params enforced
export default async function Page({ params }: { params: Promise<{ slug: string }> }) {
  // Await is mandatory in v15
  const { slug } = await params; 
  
  return (
    <main className="flex min-h-screen flex-col items-center justify-between p-24">
      <h1 className="text-4xl font-bold">Monolith v6.0</h1>
      <p>Slug: {slug}</p>
    </main>
  );
}`;
            }

            // --- C. CURSOR .MDC RULES (Search Result 1.2) ---
            if (mdc) {
                files['.cursor/rules/nextjs-15.mdc'] = `---
description: Enforce Next.js 15 Async & Server Actions
globs: src/app/**/*
alwaysApply: true
---
# Next.js 15 Strict Rules

1. **Async Params**: Always \`await params\` and \`await searchParams\`.
2. **No useEffect Data Fetching**: Use Server Components for data.
3. **Forms**: Use \`next/form\` and React 19 \`useActionState\`.
4. **Caching**: Fetch is no longer cached by default. Use \`cache: 'force-cache'\` explicitly if needed.`;

                files['.cursor/rules/agent-supervisor.mdc'] = `---
description: LangGraph Supervisor Patterns
globs: src/agents/**/*
---
# Supervisor Architecture

1. **State**: Define a shared \`AgentState\` schema using Zod.
2. **Handoff**: Supervisor MUST return the name of the next node or 'FINISH'.
3. **Tools**: Agents should not call tools directly; they emit tool_calls for the runtime.`;
            }

            // --- D. SECURITY HARDENING (Search Result 3.1) ---
            files['middleware.ts'] = `import { NextResponse } from 'next/server';
import type { NextRequest } from 'next/server';

export function middleware(request: NextRequest) {
  const response = NextResponse.next();

  // CVE-2025-29927 Mitigation: Strip internal headers
  response.headers.delete('x-middleware-subrequest');

  // CSP & Security Headers
  response.headers.set('X-Frame-Options', 'DENY');
  response.headers.set('X-Content-Type-Options', 'nosniff');
  
  return response;
}`;

            if (docker) {
                files['Dockerfile'] = `FROM node:18-alpine\nWORKDIR /app\nCOPY . .\nRUN npm install\nCMD ["npm", "run", "dev"]`;
            }

            fileSystem = files;
            
            // UI Update
            renderTree();
            renderEditor(activeFile);
        }

        // --- 3. UI RENDERING ---
        function renderTree() {
            const tree = document.getElementById('file-tree');
            tree.innerHTML = '';
            
            const paths = Object.keys(fileSystem).sort();
            
            paths.forEach(path => {
                const isActive = path === activeFile;
                const div = document.createElement('div');
                div.className = `flex items-center gap-2 px-2 py-1.5 rounded cursor-pointer group ${isActive ? 'bg-indigo-900/30 text-indigo-300' : 'hover:bg-[#151515] text-gray-500'}`;
                div.onclick = () => renderEditor(path);
                
                // Icon Logic
                let icon = "file";
                if(path.endsWith('.ts') || path.endsWith('.tsx')) icon = "file-code";
                if(path.endsWith('.json')) icon = "file-json";
                if(path.endsWith('.mdc')) icon = "shield";
                if(path.includes('supervisor')) icon = "network";

                div.innerHTML = `
                    <i data-lucide="${icon}" class="w-3 h-3 ${isActive ? 'text-indigo-400' : 'text-gray-600 group-hover:text-gray-400'}"></i>
                    <span class="truncate">${path}</span>
                `;
                tree.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderEditor(fileName) {
            activeFile = fileName;
            const code = fileSystem[fileName];
            const el = document.getElementById('code-content');
            
            // Tab Update
            const tabs = document.getElementById('tabs-bar');
            tabs.innerHTML = `
                <div class="px-4 h-full flex items-center bg-[#050505] border-t-2 border-indigo-500 text-xs text-indigo-100 font-mono border-r border-[#27272a]">
                    ${fileName}
                </div>
            `;

            // Content
            el.textContent = code;
            el.className = `language-${fileName.endsWith('json') ? 'json' : fileName.endsWith('mdc') ? 'markdown' : 'typescript'}`;
            Prism.highlightElement(el);
            
            renderTree();
        }

        // --- 4. DOWNLOAD HANDLER ---
        async function downloadArtifact() {
            const zip = new JSZip();
            const name = document.getElementById('projectName').value;

            for (const [path, content] of Object.entries(fileSystem)) {
                zip.file(path, content);
            }

            // Add Bootstrapper
            zip.file("SETUP_GUIDE.md", `# ${name} Setup\n\n1. \`npm install\`\n2. \`npm run dev\`\n3. **Important**: If Next.js 15 warns about async params, check .cursor/rules.`);

            const blob = await zip.generateAsync({type:"blob"});
            saveAs(blob, `${name}_v6_sovereign.zip`);
        }

        // Initialize
        window.onload = regenerate;

    </script>
</body>
</html>
