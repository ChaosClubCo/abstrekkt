<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Enterprise Cloud — Setup Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#0d1117;--sb2:#161b22;--sbb:#30363d;--sbt:#e6edf3;--sbm:#7d8590;
  --bg:#f6f8fa;--card:#fff;--br:#d0d7de;--brl:#eaeef2;
  --t1:#1f2328;--t2:#656d76;--t3:#9198a1;
  --ac:#0969da;--acb:#ddf4ff;--acbr:#54aeff;
  --tip:#fffbdd;--tipbr:#d4a72c;--tipt:#7d4e00;
  --sec:#fff5f5;--secbr:#cf222e;--sect:#82071e;
  --ok:#1a7f37;--okb:#dafbe1;--okbr:#2da44e;
  --new:#8250df;--newb:#fbefff;--newbr:#c9a8e0;
  --code:#f6f8fa;--r:8px
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t1);display:flex;font-size:14px;line-height:1.5}
.sb{width:248px;min-width:248px;background:var(--sb);height:100vh;overflow-y:auto;display:flex;flex-direction:column;flex-shrink:0}
.sb-hdr{padding:16px;border-bottom:1px solid #21262d}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sb-title{color:var(--sbt);font-size:13px;font-weight:600;line-height:1.35}
.sb-title small{display:block;color:var(--sbm);font-size:10px;font-weight:400;margin-top:2px}
.sb-prog{height:3px;background:#21262d;border-radius:2px;overflow:hidden;margin-top:10px}
.sb-prog-fill{height:100%;border-radius:2px;background:#2da44e;transition:width .4s}
.sb-pct{color:var(--sbm);font-size:11px;margin-top:5px}
.sb-phases{padding:6px 0;flex:1}
.ph-btn{width:100%;text-align:left;padding:8px 16px;border:none;background:none;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s}
.ph-btn:hover{background:var(--sb2)}
.ph-btn.active{background:#1c2128}
.ph-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;transition:all .2s}
.ph-num.done{background:var(--ok);color:#fff}
.ph-num.cur{background:var(--ac);color:#fff}
.ph-num.idle{background:var(--sbb);color:var(--sbm)}
.ph-info{flex:1;min-width:0}
.ph-name{font-size:12px;font-weight:500;color:var(--sbt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-track{height:2px;background:#21262d;border-radius:1px;margin-top:4px;overflow:hidden}
.ph-fill{height:100%;border-radius:1px;transition:width .4s}
.sb-ftr{padding:12px 16px;border-top:1px solid #21262d;display:flex;flex-direction:column;gap:6px}
.sb-action{padding:6px 10px;border:1px solid #30363d;border-radius:6px;background:none;color:var(--sbm);cursor:pointer;font-size:11px;font-family:inherit;transition:all .1s;width:100%;text-align:left}
.sb-action:hover{background:var(--sb2);color:var(--sbt);border-color:#484f58}
.main{flex:1;overflow-y:auto;height:100vh}
.main-inner{max-width:730px;margin:0 auto;padding:32px 36px 90px}
.ph-header{margin-bottom:26px}
.ph-htop{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ph-htitle{font-size:22px;font-weight:600}
.ph-hdesc{color:var(--t2);font-size:14px;margin-bottom:14px}
.ph-pbar{height:5px;background:var(--brl);border-radius:3px;overflow:hidden;margin-bottom:5px}
.ph-pfill{height:100%;border-radius:3px;background:var(--ok);transition:width .4s}
.ph-pmeta{font-size:11px;color:var(--t3)}
.step-card{background:var(--card);border:1px solid var(--br);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.step-card:hover{border-color:#adbac7}
.step-card.done{border-color:var(--okbr)}
.step-hdr{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none}
.step-hdr:hover{background:var(--bg)}
.step-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;transition:all .2s}
.step-badge.done{background:var(--okb);color:var(--ok);border:1px solid var(--okbr)}
.step-badge.idle{background:var(--bg);color:var(--t3);border:1px solid var(--br)}
.step-meta{flex:1;min-width:0}
.step-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step-sub{font-size:11px;color:var(--t3);margin-top:2px}
.chev{color:var(--t3);font-size:11px;transition:transform .15s;flex-shrink:0}
.chev.open{transform:rotate(90deg)}
.step-body{padding:0 16px 16px;border-top:1px solid var(--brl)}
.step-desc{font-size:13px;line-height:1.65;color:var(--t2);margin:14px 0 12px}
.step-code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:11.5px;background:var(--code);border:1px solid var(--br);border-radius:6px;padding:12px 14px;margin-bottom:12px;white-space:pre;overflow-x:auto;color:var(--t1);line-height:1.6}
.tip-box,.sec-box,.new-box{border-radius:0 var(--r) var(--r) 0;padding:10px 12px;margin-bottom:12px}
.tip-box{background:var(--tip);border-left:3px solid var(--tipbr)}
.sec-box{background:var(--sec);border-left:3px solid var(--secbr)}
.new-box{background:var(--newb);border-left:3px solid var(--newbr)}
.box-lbl{font-size:10px;font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.tip-box .box-lbl{color:var(--tipt)}
.sec-box .box-lbl{color:var(--sect)}
.new-box .box-lbl{color:var(--new)}
.box-txt{font-size:12px;line-height:1.55;color:var(--t2)}
.acts-lbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 8px}
.act-row{display:flex;gap:9px;align-items:flex-start;padding:4px 0;cursor:pointer}
.act-row:hover .ck{border-color:var(--ac)}
.ck{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--br);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;transition:all .1s}
.ck.done{background:var(--okb);border-color:var(--okbr);color:var(--ok)}
.act-txt{font-size:12px;line-height:1.55;color:var(--t2)}
.act-txt.done{text-decoration:line-through;color:var(--t3)}
.step-link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;color:var(--ac);text-decoration:none}
.step-link:hover{text-decoration:underline}
.nav-row{display:flex;justify-content:space-between;margin-top:28px;gap:12px}
.btn{padding:9px 18px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--br);font-family:inherit;transition:all .1s}
.btn-back{background:var(--card);color:var(--t2)}
.btn-back:hover{background:var(--bg);border-color:#adbac7}
.btn-next{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn-next:hover{background:#0860ca}
.btn-done{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-done:hover{background:#1a7035}
.tag{display:inline-flex;align-items:center;font-size:9px;font-weight:600;border-radius:8px;padding:2px 7px;border:1px solid;flex-shrink:0}
.tag-new{background:var(--newb);color:var(--new);border-color:var(--newbr)}
.tag-done{background:var(--okb);color:var(--ok);border-color:var(--okbr)}
@media print{.sb{display:none}.main{height:auto;overflow:visible}.main-inner{max-width:100%;padding:20px}.step-card{break-inside:avoid}}
</style>
</head>
<body>
<aside class="sb" id="sb"></aside>
<main class="main" id="mainscroll"><div class="main-inner" id="content"></div></main>
<script>
const PH=[
  {t:"Pre-flight",       d:"What to gather before you begin"},
  {t:"Enterprise Account",d:"Create your GitHub Enterprise Cloud account"},
  {t:"Identity & Access", d:"Connect Microsoft Entra ID for login"},
  {t:"Security Hardening",d:"Lock down your organization"},
  {t:"First Repository",  d:"Create and protect your first repository"},
  {t:"Invite Your Team",  d:"Bring members in safely"},
  {t:"CI/CD & Actions",   d:"Automated workflows with no stored secrets",n:true}
];

const ST=[
[
 {t:"Count users and prepare billing",
  b:"GitHub Enterprise Cloud costs $21 per user/month billed annually, or $25 monthly. Count everyone who will access GitHub — developers, reviewers, project managers, anyone who will read or comment on code.",
  tip:"Start with your core team. You can add or remove licenses at any time. When in doubt, undercount and grow into it.",
  sec:null,code:null,link:{l:"GitHub Enterprise pricing",u:"https://github.com/enterprise"},
  a:["Write down the exact number of users who need access","Have a company credit card or purchase order number ready","Note your company email domain (e.g., yourcompany.com)"]},

 {t:"Locate your Microsoft Entra ID tenant",
  b:"GitHub Enterprise will connect to Microsoft Entra ID (formerly Azure AD) for login. You need your Tenant ID — a code that looks like 12345678-1234-1234-1234-123456789012. Find it in portal.azure.com under Entra ID Overview.",
  tip:"Your IT administrator has this. If you can't find it, search 'Microsoft Entra ID' in your Azure Portal — the Tenant ID is on the Overview page, top-right.",
  sec:"You also need Global Administrator or Application Administrator rights in Entra ID. If you don't have these, involve your IT team before proceeding.",
  code:null,link:null,
  a:["Locate your Entra Tenant ID in portal.azure.com","Confirm you have Application Administrator rights in Entra","Note the UPN domain your team uses — e.g., firstname.lastname@yourcompany.com"]},

 {t:"Choose your organization name",
  b:"Your GitHub org name becomes part of every URL: github.com/YOUR-ORG. It's visible externally and is effectively permanent. Use lowercase letters and hyphens only — no spaces, no capitals.",
  tip:"Good examples: acme-corp, contoso, northwind-labs. Avoid underscores, capitals, or names longer than 20 characters. Short and clear wins.",
  sec:"Avoid names that reveal internal structure, project codenames, or sensitive business information. Your org name is publicly visible on GitHub.",
  code:null,link:null,
  a:["Decide your org name — lowercase, hyphens only, no spaces","Check it's available: visit github.com/YOUR-CHOSEN-NAME (a 404 page means it's free)","Get sign-off from your IT manager or team lead"]},

 {t:"Designate your Enterprise Owner account",
  b:"The Enterprise Owner has the highest access level: billing, org creation, policy overrides. This must be a named person's work account — never a shared or generic login. Limit to 2 designated owners maximum.",
  tip:"Think of this as the master key. Assign it to an IT manager or department head — a named, accountable person who can be reached. Two owners provides a backup.",
  sec:"CRITICAL: This account must use a work email address — not Gmail or Outlook.com. Enable 2FA immediately after creating it. Store recovery codes in your company password manager, not locally.",
  code:null,link:null,
  a:["Name 1–2 designated Enterprise Owners","Confirm each has a work email address (not personal)","Confirm your company has a password manager ready for storing recovery codes"]}
],
[
 {t:"Start your GitHub Enterprise trial",
  b:"Go to github.com/enterprise and start a 30-day free trial — no credit card required. You get full Enterprise Cloud features immediately. Sign in with your designated Enterprise Owner's GitHub account, or create one now using your work email.",
  tip:"The trial is your full setup window. Use all 30 days to configure everything before going live with your team. Billing only starts when you add paid seats.",
  sec:null,code:null,link:{l:"Start Enterprise trial",u:"https://github.com/enterprise"},
  a:["Go to github.com/enterprise","Click 'Start a free trial'","Sign in with — or create — the Enterprise Owner GitHub account using your work email"]},

 {t:"Name your enterprise account",
  b:"The enterprise name sits one level above your organizations and appears in billing and admin URLs. Use your company name. The URL slug is what actually matters — display name: Acme Corporation becomes slug: acme-corporation.",
  tip:"The slug appears in URLs like github.com/enterprises/acme-corporation. You can update the display name later but the slug is much harder to change.",
  sec:"The enterprise slug is publicly visible in URLs. Use only your company name — no internal identifiers or project names.",
  code:null,link:null,
  a:["Enter your company name as the enterprise name","Note the auto-generated slug shown below the name field","Click 'Create enterprise'"]},

 {t:"Create your first organization",
  b:"Under the enterprise account, create an Organization — this is where repositories live. Enterprise is the billing container; Organizations hold the code. Most teams only ever need one organization.",
  tip:"Only create multiple orgs if you have genuinely separate business units that should never see each other's code. One org is simpler and the right choice for most teams starting out.",
  sec:"Set visibility to Private. Do not create a public organization until you have a specific, approved reason — public means anyone on the internet can see your org membership.",
  code:null,link:null,
  a:["From the enterprise dashboard, click 'New organization'","Enter your org name from pre-flight","Set visibility: Private","Click 'Create organization'"]},

 {t:"Verify your company domain",
  b:"Domain verification proves you own yourcompany.com. Once verified, you can restrict membership to that domain and block impersonation. It requires adding a DNS TXT record — your IT team or DNS provider can do this in 5 minutes.",
  tip:"Your DNS provider is wherever your domain is registered: GoDaddy, Cloudflare, AWS Route 53, etc. GitHub gives you the exact record to add. DNS propagation takes 5–30 minutes after adding it.",
  sec:"After verification, enable 'Restrict email notifications to verified domains' in org settings. This blocks members from using personal email addresses for GitHub activity in your org.",
  code:null,link:null,
  a:["Go to Org Settings → Code security → Verified & approved domains","Click 'Add a domain' and enter your company domain","Copy the DNS TXT record GitHub provides","Add that TXT record in your DNS provider's control panel","Return to GitHub and click 'Verify domain'","Enable 'Restrict email notifications to approved domains'"]}
],
[
 {t:"Add GitHub to Microsoft Entra ID",
  b:"In the Azure Portal, add GitHub Enterprise Cloud as an Enterprise Application. Microsoft has a pre-built template for this — no manual configuration from scratch needed.",
  tip:"Azure Portal path: Entra ID → Enterprise Applications → New Application → search 'GitHub Enterprise Cloud – Organization'. Use the official Microsoft-maintained app from the gallery.",
  sec:null,code:null,link:null,
  a:["Sign into portal.azure.com as Application Administrator","Navigate: Entra ID → Enterprise Applications → New Application","Search: 'GitHub Enterprise Cloud – Organization'","Click the result and click 'Create'","Note the Application ID on the Overview page"]},

 {t:"Configure SAML SSO",
  b:"You will copy values between the GitHub settings page and the Entra app. Open both in separate browser tabs. GitHub gives you what Entra needs; Entra gives you what GitHub needs. This is copy-paste, not manual configuration.",
  tip:"Work through this with both tabs open side-by-side. GitHub labels each field to match exactly what Entra calls the same thing. Take it one field at a time.",
  sec:"Do NOT enable SSO enforcement yet. Set it up, test with your own account first, then enforce. Enforcing before testing can lock everyone — including owners — out of the org.",
  code:null,link:null,
  a:["In GitHub: Org Settings → Authentication security → Enable SAML","Copy 'Assertion Consumer Service URL' from GitHub → paste as 'Reply URL' in Entra","Copy 'Entity ID' from GitHub → paste as 'Identifier' in Entra","In Entra: set Sign on URL to https://github.com/orgs/YOUR-ORG/sso","In Entra: download the Certificate (Base64)","Copy Entra's 'Login URL' → paste into GitHub as 'Sign on URL'","Copy Entra's 'Azure AD Identifier' → paste into GitHub as 'Issuer'","Upload the certificate to GitHub","Click 'Test SAML configuration' in GitHub and verify it succeeds"]},

 {t:"Enable SCIM automatic user sync",
  b:"SCIM automatically adds GitHub org members when you add them in Entra, and removes their access when you remove them from Entra. This is essential for offboarding compliance — no manual cleanup required in two systems.",
  tip:"Once SCIM is running, removing someone from Entra revokes their GitHub access within minutes. No manual GitHub step required. This is the most important operational time-saver in the whole setup.",
  sec:"SCIM requires a GitHub token stored in Entra. Generate a classic Personal Access Token with admin:org scope from a dedicated service account — not your personal owner account. Store this token in Azure Key Vault.",
  code:null,link:null,
  a:["Create a dedicated GitHub service account (e.g., yourorg-scim-bot@yourcompany.com)","From that account: Settings → Developer settings → Tokens → Generate new token (classic) → scope: admin:org","In Entra app Provisioning tab: set to Automatic, paste SCIM endpoint URL from GitHub and the PAT as secret token","Click 'Test Connection' — confirm it shows success","Set Provisioning Status to On","Assign a test user in Entra and confirm they appear in the GitHub org within 5 minutes"]},

 {t:"Map Entra groups to GitHub teams",
  b:"Entra security groups become GitHub teams. When someone joins an Entra group they automatically join the corresponding GitHub team and gain its repository permissions. Create the groups in Entra before mapping them here.",
  tip:"Set this up before the full team rollout. Create groups in Entra first (e.g., GitHub-Developers, GitHub-Readers) then map them here. Anyone added to the Entra group gets the right GitHub access automatically.",
  sec:null,code:null,link:null,
  a:["In GitHub: Org → Teams → New team — create one team per role you need","Inside each team: Settings → Connect to an identity provider group","Map each GitHub team to the corresponding Entra security group","Assign the Entra app to those security groups (not individual users)"]},

 {t:"Enforce SAML for all members",
  b:"Now that SSO is tested and working, turn on enforcement. After this, no one can access the org without authenticating through Microsoft first. PATs and SSH keys still work for git operations but must be SAML-authorized.",
  tip:"Send a communication before enforcing: 'On DATE, GitHub login will require your Microsoft credentials. If prompted, click Authorize.' Give 24–48 hours notice.",
  sec:"BLOCKING: Before clicking Enforce, confirm every Org Owner has successfully completed a SAML login at least once. Any owner who has not done so will be removed from the org and require manual re-invitation.",
  code:null,link:null,
  a:["Confirm all Org Owners have authorized SAML: Org Settings → People → filter by SSO authorized","Send 48-hour advance notice to your team","Go to Org Settings → Authentication security","Click 'Require SAML SSO authentication for all members'","Click Save"]},

 {t:"Schedule SCIM token rotation",n:true,
  b:"The GitHub Personal Access Token used by SCIM has no built-in expiry alert. If it expires silently, new hires won't be provisioned and departed employees won't lose access — both are security and compliance failures.",
  tip:"Safe rotation order: (1) generate new PAT → (2) update Entra SCIM settings → (3) test provisioning with a test user → (4) revoke the old PAT. Never revoke before updating Entra.",
  sec:"This PAT has admin:org scope — treat it like a master password. Store in Azure Key Vault only. Limit Key Vault read access to 2 named IT administrators. Audit access annually.",
  code:null,link:null,
  a:["Set a recurring 90-day calendar reminder: 'Rotate GitHub SCIM service account token'","Document the rotation procedure in your IT runbook: Generate → Update Entra → Test → Revoke","Confirm the PAT is stored in Azure Key Vault — not in a spreadsheet, email, or shared document","Audit who has read access to the Key Vault secret: limit to 2 named IT administrators","Store the service account email and recovery contact in your IT runbook"]}
],
[
 {t:"Require 2FA for all members",
  b:"Require two-factor authentication (2FA) for every org member. Anyone without 2FA will be removed from the org and receive an email to re-enable access after setting it up. This takes effect immediately when enabled.",
  tip:"Warn your team 48 hours in advance. Recommended 2FA methods: GitHub Mobile, Authy, or a YubiKey hardware key. Avoid SMS-based 2FA — it's the weakest option.",
  sec:"Hardware security keys (YubiKeys) are best-in-class. TOTP apps (Authy, Google Authenticator) are strong. SMS 2FA is acceptable only as a last resort.",
  code:null,link:null,
  a:["Notify all org members to set up 2FA before your chosen enforcement date","Go to Org Settings → Authentication security","Enable 'Require two-factor authentication for everyone in YOUR-ORG'","Review the list of members who will be removed (shown before you confirm)","Click 'Remove members and require two-factor authentication'"]},

 {t:"Lock down member privileges",
  b:"Set the minimum permissions a regular member has by default. Owners can always grant more access to specific teams, but these settings define the security floor everyone starts from.",
  tip:"Read permission means members can see repos they're assigned to but cannot push changes without explicit write access. This prevents accidental commits from people who shouldn't be editing.",
  sec:"Most impactful: disable public repo creation (prevents code leaks), disable forking of private repos (prevents IP exfiltration), restrict outside collaborators to admins only.",
  code:null,link:null,
  a:["Go to Org Settings → Member privileges","Base permissions: set to 'Read'","Repository creation: 'Private repositories only' or disabled entirely","Repository forking: uncheck 'Allow forking of private repositories'","Outside collaborators: 'Only owners can invite outside collaborators'","Click Save"]},

 {t:"Enable secret scanning and push protection",
  b:"GitHub automatically scans every commit for accidentally embedded secrets — API keys, passwords, connection strings, certificates. Push protection blocks the commit before it reaches the repository.",
  tip:"Push protection is the most important setting here. It stops secrets at the source — before they're committed — rather than alerting after the fact.",
  sec:"Enable on all repos including private ones. Private repos can still leak through forks, mirrors, or data breaches. Secret scanning costs nothing extra on Enterprise.",
  code:null,link:null,
  a:["Go to Org Settings → Code security and analysis","Enable 'Secret scanning' for all repositories","Enable 'Push protection' — this blocks commits containing detected secrets","Enable 'Dependency graph'","Enable 'Dependabot alerts' and 'Dependabot security updates'"]},

 {t:"Configure the audit log",
  b:"Every action in your GitHub org is logged — logins, repo changes, member additions, permission changes. This is your incident response record and compliance trail. GitHub stores 6 months of searchable history.",
  tip:"Even if you don't need compliance reporting today, set up audit log forwarding now. Recreating six months of history after an incident is painful or impossible.",
  sec:"For regulated environments (finance, healthcare, legal), stream audit logs to a SIEM immediately. Do not rely on GitHub's 6-month retention as your only record.",
  code:null,link:null,
  a:["Go to Enterprise Settings → Audit log","Search for a recent login event to confirm it's recording","Optional: Configure audit log streaming → Azure Event Hubs or Microsoft Sentinel","Set a monthly calendar reminder to review the audit log"]},

 {t:"Set default branch name to main",
  b:"Ensure all new repositories default to a branch named 'main'. This is the current GitHub standard and prevents confusion. This setting only affects new repositories going forward.",
  tip:"Existing repos are not changed by this setting. You can rename each repo's default branch later under repo Settings → Branches.",
  sec:null,code:null,link:null,
  a:["Go to Org Settings → Repository defaults","Set 'Default branch name for new repositories' to: main","Click Save"]},

 {t:"Configure IP allowlisting",n:true,
  b:"Restrict GitHub org access to approved IP address ranges — office networks, VPN, and remote access endpoints. Even users with valid credentials are blocked from unapproved IPs, adding a strong network-layer control.",
  tip:"Get your VPN exit IPs and office IP ranges from your network team in CIDR notation (e.g., 203.0.113.0/24). If your team is fully remote, your corporate VPN exit node is the primary IP to add.",
  sec:"Test from OUTSIDE your allowlisted network before finalizing. Use a mobile hotspot. Misconfiguration can lock out everyone including owners — have the enterprise admin panel URL saved as an emergency override before enabling.",
  code:null,link:null,
  a:["Collect all corporate IP ranges from your network team (in CIDR notation)","Collect VPN exit node IP address(es) — ask your IT team for the static exit IPs","Go to Enterprise Settings → Security → IP allow list","Add each range with a descriptive name: e.g., 'London Office', 'VPN Primary', 'Remote Backup'","Enable the IP allow list","Test access from a personal mobile hotspot — GitHub should block access","Confirm your office or VPN connection still works normally"]},

 {t:"Configure compliance controls",n:true,
  b:"If your org is subject to SOC 2, GDPR, HIPAA, or ISO 27001, GitHub Enterprise has specific settings that satisfy common control requirements. Start with what applies to your organization and build from there.",
  tip:"You don't need all of these on day one. Identify which regulation applies, start there, and document what you have. Compliance is iterative — a written process beats a perfect unwritten one.",
  sec:"For GDPR: GitHub stores activity metadata on US servers by default. Request GitHub's Data Processing Agreement (DPA) from your account manager. GitHub Enterprise Cloud has EU data residency options — ask about them.",
  code:null,link:null,
  a:["Identify which regulations apply: SOC 2 / GDPR / HIPAA / ISO 27001 — confirm with your legal team","Request GitHub's Data Processing Agreement (DPA) from your GitHub account manager if GDPR applies","Set up audit log streaming for long-term retention (Azure Sentinel, Splunk, or your SIEM)","Schedule quarterly access reviews: export org member list → verify each person still needs access → remove those who don't","Enable 'Require signed commits' on critical repos (repo Settings → Branches → branch protection rule)","Create a SECURITY.md at repo root with your vulnerability disclosure contact","Document your GitHub admin process in your IT/security policy documentation"]}
],
[
 {t:"Create the repository",
  b:"From your organization page, create your first repository. Pay close attention to the Owner field — it must be set to your organization, not your personal account. Repository name should be lowercase with hyphens.",
  tip:"Everything about a repo can be changed later except its fundamental URL structure. Take 60 seconds to pick a clear name before creating it.",
  sec:"Always set visibility to Private unless you have a specific approved reason to make it public. Private repos are visible only to org members with explicit access.",
  code:null,link:null,
  a:["Go to github.com/orgs/YOUR-ORG and click 'New repository'","Owner: select your ORGANIZATION — not your personal account","Repository name: lowercase-with-hyphens","Visibility: Private","Check: 'Add a README file'","Add a .gitignore template matching your tech stack","Click 'Create repository'"]},

 {t:"Protect the main branch",

 {t:"Set up OIDC authentication for Azure",n:true,

const SK='ghes-guide-v3';
let S={ph:0,open:{},chk:{}};
try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);S={...S,...p,open:p.open||{},chk:p.chk||{}}}}catch(e){}

function sv(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function goPh(p){S.ph=p;S.open={};sv();draw();document.getElementById('mainscroll').scrollTo(0,0)}
function togStep(p,s){const k=p+'-'+s;S.open[k]=!S.open[k];sv();draw()}
function togChk(p,s,a){const k=p+'-'+s+'-'+a;S.chk[k]=!S.chk[k];sv();draw()}
function reset(){if(confirm('Reset all progress? This cannot be undone.')){S={ph:0,open:{},chk:{}};sv();draw();document.getElementById('mainscroll').scrollTo(0,0)}}

function phPct(p){
  let t=0,d=0;
  ST[p].forEach((s,si)=>(s.a||[]).forEach((_,ai)=>{t++;if(S.chk[p+'-'+si+'-'+ai])d++}));
  return t?Math.round(d/t*100):0
}
function stPct(p,s){
  const a=ST[p][s].a||[];if(!a.length)return 0;
  let d=0;a.forEach((_,ai)=>{if(S.chk[p+'-'+s+'-'+ai])d++});
  return Math.round(d/a.length*100)
}
function totPct(){
  let t=0,d=0;
  ST.forEach((ph,pi)=>ph.forEach((s,si)=>(s.a||[]).forEach((_,ai)=>{t++;if(S.chk[pi+'-'+si+'-'+ai])d++})));
  return t?Math.round(d/t*100):0
}

function drawSidebar(){
  const tp=totPct();
  let h='';
  h+=`<div class="sb-hdr">
    <div class="sb-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#e6edf3" style="flex-shrink:0">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      <div class="sb-title">GitHub Enterprise<br><small>Setup Guide · 7 phases · 35 steps</small></div>
    </div>
    <div class="sb-prog"><div class="sb-prog-fill" style="width:${tp}%"></div></div>
    <div class="sb-pct">${tp}% complete overall</div>
  </div>
  <div class="sb-phases">`;

  PH.forEach((p,i)=>{
    const pc=phPct(i);const done=pc===100;const cur=i===S.ph;
    h+=`<button class="ph-btn${cur?' active':''}" onclick="goPh(${i})">
      <div class="ph-num ${done?'done':cur?'cur':'idle'}">${done?'✓':(i+1)}</div>
      <div class="ph-info">
        <div class="ph-name">${p.t}${p.n?' <span class="tag tag-new">NEW</span>':''}</div>
        <div class="ph-track"><div class="ph-fill" style="width:${pc}%;background:${done?'#2da44e':'#1f6feb'}"></div></div>
      </div>
    </button>`;
  });

  h+=`</div>
  <div class="sb-ftr">
    <button class="sb-action" onclick="window.print()">Print this guide</button>
    <button class="sb-action" onclick="reset()">Reset all progress</button>
  </div>`;

  document.getElementById('sb').innerHTML=h;
}

function drawMain(){
  const p=S.ph;const ph=PH[p];const steps=ST[p];const pp=phPct(p);
  let h='';

  h+=`<div class="ph-header">
    <div class="ph-htop">
      <div class="ph-htitle">Phase ${p+1}: ${ph.t}</div>
      ${ph.n?'<span class="tag tag-new">NEW</span>':''}
      ${pp===100?'<span class="tag tag-done">Complete</span>':''}
    </div>
    <div class="ph-hdesc">${ph.d}</div>
    <div class="ph-pbar"><div class="ph-pfill" style="width:${pp}%"></div></div>
    <div class="ph-pmeta">${pp}% complete &middot; ${steps.length} step${steps.length!==1?'s':''}</div>
  </div>`;

  steps.forEach((step,si)=>{
    const sp=stPct(p,si);
    const done=step.a&&step.a.length>0&&sp===100;
    const ex=!!S.open[p+'-'+si];

    h+=`<div class="step-card${done?' done':''}">
      <div class="step-hdr" onclick="togStep(${p},${si})">
        <div class="step-badge ${done?'done':'idle'}">${done?'&#10003;':(si+1)}</div>
        <div class="step-meta">
          <div class="step-title">${step.t}${step.n?' <span class="tag tag-new">NEW</span>':''}</div>
          ${step.a?`<div class="step-sub">${step.a.length} action${step.a.length!==1?'s':''}${sp>0?' &middot; '+sp+'% done':''}</div>`:''}
        </div>
        <div class="chev${ex?' open':''}">&#9654;</div>
      </div>`;

    if(ex){
      h+=`<div class="step-body"><p class="step-desc">${step.b}</p>`;

      if(step.code){
        h+=`<pre class="step-code">${step.code}</pre>`;
      }
      if(step.tip){
        h+=`<div class="tip-box"><div class="box-lbl">Mentor tip</div><div class="box-txt">${step.tip}</div></div>`;
      }
      if(step.sec){
        h+=`<div class="sec-box"><div class="box-lbl">Security</div><div class="box-txt">${step.sec}</div></div>`;
      }
      if(step.a&&step.a.length){
        h+=`<div class="acts-lbl">Action items</div>`;
        step.a.forEach((act,ai)=>{
          const ck=!!S.chk[p+'-'+si+'-'+ai];
          h+=`<div class="act-row" onclick="togChk(${p},${si},${ai})">
            <div class="ck${ck?' done':''}">${ck?'&#10003;':''}</div>
            <span class="act-txt${ck?' done':''}">${act}</span>
          </div>`;
        });
      }
      if(step.link){
        h+=`<a class="step-link" href="${step.link.u}" target="_blank">&#8599; ${step.link.l}</a>`;
      }
      h+=`</div>`;
    }
    h+=`</div>`;
  });

  h+=`<div class="nav-row">`;
  if(p>0){
    h+=`<button class="btn btn-back" onclick="goPh(${p-1})">&#8592; ${PH[p-1].t}</button>`;
  } else {
    h+=`<div></div>`;
  }
  if(p<PH.length-1){
    h+=`<button class="btn btn-next" onclick="goPh(${p+1})">${PH[p+1].t} &#8594;</button>`;
  } else {
    const all=totPct()===100;
    h+=`<button class="btn ${all?'btn-done':'btn-next'}" onclick="alert('${all?'Setup complete — all 35 steps checked off. You are ready to roll.':'You have outstanding steps. Review unchecked items before going live.'}')">${all?'&#10003; Setup complete':'Mark as complete'}</button>`;
  }
  h+=`</div>`;

  document.getElementById('content').innerHTML=h;
}

function draw(){drawSidebar();drawMain()}
draw();
</script>
