<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeStack Studio v3.0 | Enterprise Scaffolder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #020617; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .editor-font { font-family: 'JetBrains Mono', 'Menlo', 'Monaco', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .sidebar-select { @apply w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none transition-colors; }
        .sidebar-label { @apply block text-xs font-bold text-slate-500 uppercase mb-2 mt-4; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="h-16 border-b border-slate-800 bg-slate-950 flex items-center justify-between px-6 z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i data-lucide="layers" class="text-white w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight text-white">VibeStack Studio <span class="text-indigo-400">v3.0</span></h1>
                <p class="text-[10px] text-slate-500 font-mono">FRAMEWORK_ADAPTERS: LOADED</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="status-pill" class="flex items-center gap-2 px-3 py-1.5 bg-slate-900 rounded-full border border-slate-800">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs text-slate-400">Engine Idle</span>
            </div>
            <button onclick="downloadBundle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-md text-sm font-semibold transition-all flex items-center gap-2 shadow-lg shadow-indigo-900/20 border border-indigo-500/50">
                <i data-lucide="download-cloud" class="w-4 h-4"></i> Generate .ZIP
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        
        <aside class="w-80 bg-slate-950 border-r border-slate-800 flex flex-col overflow-y-auto z-10">
            <div class="p-5 space-y-1">
                
                <label class="sidebar-label !mt-0">Project Identity</label>
                <input type="text" id="projectName" value="flashfusion-mvp" class="sidebar-select text-white mb-2">

                <label class="sidebar-label">Core Framework</label>
                <div class="relative">
                    <select id="frameworkSelect" onchange="regenerateScaffold()" class="sidebar-select appearance-none cursor-pointer">
                        <option value="nextjs">1. Vibe SaaS (Next.js 14 + TS)</option>
                        <option value="reactnative">2. Chaos Mobile (Expo + Native)</option>
                        <option value="fastapi">3. Agentic API (FastAPI + Python)</option>
                        <option value="chrome">4. Browser Tool (React Extension)</option>
                        <option value="electron">5. Desktop Pro (Electron + React)</option>
                        <option value="streamlit">6. Data Insight (Streamlit)</option>
                        <option value="cli">7. CLI Commander (Node + Oclif)</option>
                    </select>
                    <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-slate-500 pointer-events-none"></i>
                </div>

                <label class="sidebar-label">Infrastructure Modules</label>
                
                <div class="space-y-2">
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                        <div class="text-[10px] text-slate-500 mb-1 font-bold">AUTHENTICATION</div>
                        <select id="authModule" onchange="regenerateScaffold()" class="w-full bg-slate-950 border border-slate-700 text-xs rounded p-1 text-slate-300">
                            <option value="supabase">Supabase Auth (Recommended)</option>
                            <option value="clerk">Clerk (Enterprise)</option>
                            <option value="nextauth">NextAuth (Self-Hosted)</option>
                            <option value="none">None (Public)</option>
                        </select>
                    </div>

                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                        <div class="text-[10px] text-slate-500 mb-1 font-bold">DATABASE</div>
                        <select id="dbModule" onchange="regenerateScaffold()" class="w-full bg-slate-950 border border-slate-700 text-xs rounded p-1 text-slate-300">
                            <option value="postgres">PostgreSQL (Prisma)</option>
                            <option value="redis">Redis (Upstash)</option>
                            <option value="sqlite">SQLite (Local)</option>
                            <option value="none">None</option>
                        </select>
                    </div>

                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                        <div class="text-[10px] text-slate-500 mb-1 font-bold">AI MODEL INTEGRATION</div>
                        <select id="aiModule" onchange="regenerateScaffold()" class="w-full bg-slate-950 border border-slate-700 text-xs rounded p-1 text-slate-300">
                            <option value="openai">OpenAI (GPT-4o)</option>
                            <option value="anthropic">Anthropic (Claude 3.5)</option>
                            <option value="gemini">Google (Gemini 1.5 Pro)</option>
                            <option value="local">Ollama (Local LLM)</option>
                        </select>
                    </div>
                </div>

                <label class="sidebar-label">Production Gates</label>
                <div class="space-y-2">
                    <label class="flex items-center gap-3 p-2 hover:bg-slate-900 rounded cursor-pointer transition">
                        <input type="checkbox" id="dockerToggle" onchange="regenerateScaffold()" checked class="accent-indigo-500 w-4 h-4">
                        <span class="text-xs text-slate-300">Docker / Containerization</span>
                    </label>
                    <label class="flex items-center gap-3 p-2 hover:bg-slate-900 rounded cursor-pointer transition">
                        <input type="checkbox" id="ciToggle" onchange="regenerateScaffold()" checked class="accent-indigo-500 w-4 h-4">
                        <span class="text-xs text-slate-300">GitHub Actions (CI/CD)</span>
                    </label>
                    <label class="flex items-center gap-3 p-2 hover:bg-slate-900 rounded cursor-pointer transition">
                        <input type="checkbox" id="cursorToggle" onchange="regenerateScaffold()" checked class="accent-indigo-500 w-4 h-4">
                        <span class="text-xs text-slate-300">.cursorrules (Context Eng)</span>
                    </label>
                </div>

            </div>
        </aside>

        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
            <div class="h-10 flex items-center px-4 border-b border-slate-800 bg-slate-900">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Project Structure</span>
            </div>
            <div id="file-tree" class="flex-1 overflow-y-auto p-2 space-y-0.5">
                </div>
        </aside>

        <main class="flex-1 flex flex-col bg-[#0b0e14] relative">
            <div id="tabs-container" class="h-10 bg-slate-900 border-b border-slate-800 flex items-center px-0 overflow-x-auto no-scrollbar">
                </div>
            <div class="flex-1 relative group">
                <textarea id="code-editor" class="w-full h-full bg-transparent text-slate-300 p-6 editor-font text-xs md:text-sm resize-none focus:outline-none leading-relaxed" spellcheck="false"></textarea>
                <div class="absolute bottom-4 right-4 text-[10px] text-slate-600 font-mono">Read-Only Preview (Edit to Override)</div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // --- 1. SCAFFOLDING ENGINE ---
        
        let currentProject = {};
        let activeFile = 'README.md';

        // The CLEAR Framework System Prompt (Injected into .cursorrules)
        const CLEAR_PROMPT = `
# .cursorrules - VibeStack Context Engineering
# Framework: CLEAR (Context, Length, Examples, Audience, Response)

## C - Context
You are a Senior Staff Engineer and Architect. You prioritize clean, maintainable, and strictly typed code.
Project: {PROJECT_NAME}
Stack: {STACK_DETAILS}

## L - Length
Keep code concise. Avoid boilerplate where possible. 
When explaining, use "TL;DR" summaries followed by technical bullet points.

## E - Examples
Refer to "Golden Patterns" in the codebase. 
If generating a new component, follow the 'atomic design' pattern used in /components.

## A - Audience
Target audience is other Senior Engineers. Do not over-explain basic language syntax. 
Focus on architectural implications, edge cases, and performance trade-offs.

## R - Response Format
1. Filepath comment at the top of every code block.
2. Production-grade error handling (try/catch with typed errors).
3. Zod schemas for all external inputs.
`;

        function getBaseScaffold(type) {
            switch(type) {
                case 'nextjs': return {
                    'package.json': `{\n  "name": "vibestack-saas",\n  "dependencies": {\n    "next": "14.0.0",\n    "react": "^18",\n    "tailwindcss": "^3.3",\n    "lucide-react": "latest"\n  }\n}`,
                    'app/page.tsx': `export default function Home() {\n  return (\n    <main className="flex min-h-screen flex-col items-center justify-between p-24">\n      <h1 className="text-4xl font-bold">VibeStack SaaS</h1>\n    </main>\n  )\n}`,
                    'next.config.js': `/** @type {import('next').NextConfig} */\nconst nextConfig = {};\nmodule.exports = nextConfig;`,
                    'tailwind.config.ts': `import type { Config } from 'tailwindcss'\nexport default {\n  content: ['./app/**/*.{ts,tsx}'],\n  theme: { extend: {} },\n  plugins: [],\n} satisfies Config`,
                    'tsconfig.json': `{\n  "compilerOptions": {\n    "target": "es5",\n    "lib": ["dom", "dom.iterable", "esnext"],\n    "allowJs": true,\n    "skipLibCheck": true,\n    "strict": true,\n    "noEmit": true,\n    "esModuleInterop": true,\n    "module": "esnext",\n    "moduleResolution": "bundler",\n    "resolveJsonModule": true,\n    "isolatedModules": true,\n    "jsx": "preserve",\n    "incremental": true,\n    "plugins": [{ "name": "next" }],\n    "paths": { "@/*": ["./*"] }\n  },\n  "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],\n  "exclude": ["node_modules"]\n}`
                };
                case 'reactnative': return {
                    'package.json': `{\n  "name": "vibestack-mobile",\n  "main": "node_modules/expo/AppEntry.js",\n  "dependencies": {\n    "expo": "~49.0.0",\n    "react-native": "0.72.0",\n    "expo-router": "latest"\n  }\n}`,
                    'app/_layout.tsx': `import { Stack } from 'expo-router';\nexport default function Layout() { return <Stack />; }`,
                    'app/index.tsx': `import { View, Text } from 'react-native';\nexport default function Page() {\n  return <View><Text>Chaos Mobile</Text></View>;\n}`,
                    'app.json': `{\n  "expo": {\n    "name": "VibeMobile",\n    "slug": "vibe-mobile",\n    "version": "1.0.0"\n  }\n}`
                };
                case 'fastapi': return {
                    'requirements.txt': `fastapi==0.100.0\nuvicorn==0.23.0\npydantic==2.0.0\npython-dotenv==1.0.0`,
                    'main.py': `from fastapi import FastAPI\nfrom pydantic import BaseModel\n\napp = FastAPI(title="Agentic API")\n\n@app.get("/health")\ndef health_check():\n    return {"status": "operational", "mode": "agentic"}\n`,
                    'models.py': `from pydantic import BaseModel\n\nclass AgentRequest(BaseModel):\n    prompt: str\n    context: dict`
                };
                case 'chrome': return {
                    'manifest.json': `{\n  "manifest_version": 3,\n  "name": "Vibe Tools",\n  "version": "1.0",\n  "action": { "default_popup": "index.html" },\n  "permissions": ["activeTab", "storage"]\n}`,
                    'package.json': `{\n  "name": "chrome-ext-vibe",\n  "dependencies": { "react": "^18", "vite": "^4" }\n}`,
                    'src/popup.tsx': `import React from 'react';\nexport const Popup = () => <div>Extension Active</div>;`
                };
                case 'electron': return {
                    'package.json': `{\n  "name": "desktop-pro",\n  "main": "main.js",\n  "scripts": { "start": "electron ." }\n}`,
                    'main.js': `const { app, BrowserWindow } = require('electron');\nconst path = require('path');\n\nfunction createWindow () {\n  const win = new BrowserWindow({ width: 800, height: 600 });\n  win.loadFile('index.html');\n}\napp.whenReady().then(createWindow);`,
                    'index.html': `<!DOCTYPE html><html><body><h1>Desktop Pro Loaded</h1></body></html>`
                };
                case 'streamlit': return {
                    'requirements.txt': `streamlit\npandas\nnumpy\nplotly`,
                    'app.py': `import streamlit as st\nimport pandas as pd\n\nst.set_page_config(page_title="Data Vibe", layout="wide")\nst.title("Insight Dashboard")\n\nst.metric(label="Active Users", value="1,234", delta="12%")\n`
                };
                case 'cli': return {
                    'package.json': `{\n  "name": "cli-commander",\n  "bin": { "vibe": "./bin/run" },\n  "dependencies": { "@oclif/core": "latest", "chalk": "latest" }\n}`,
                    'bin/run': `#!/usr/bin/env node\nrequire('../lib/index').run()`,
                    'src/index.ts': `import { Command } from '@oclif/core';\nexport default class Hello extends Command {\n  async run() {\n    console.log('Vibe Commander Ready');\n  }\n}`
                };
                default: return {};
            }
        }

        function regenerateScaffold() {
            // 1. Get Selections
            const framework = document.getElementById('frameworkSelect').value;
            const auth = document.getElementById('authModule').value;
            const db = document.getElementById('dbModule').value;
            const ai = document.getElementById('aiModule').value;
            const useDocker = document.getElementById('dockerToggle').checked;
            const useCI = document.getElementById('ciToggle').checked;
            const useCursor = document.getElementById('cursorToggle').checked;
            const projectName = document.getElementById('projectName').value;

            // 2. Load Base
            let files = getBaseScaffold(framework);

            // 3. Inject Modules
            // --- ENV VARS ---
            let envContent = `# VibeStack Environment\nENV=development\nAPP_NAME=${projectName}\n`;
            
            // --- AUTH INJECTION ---
            if (auth === 'supabase') {
                envContent += `\n# Supabase Auth\nNEXT_PUBLIC_SUPABASE_URL=https://your-project.supabase.co\nNEXT_PUBLIC_SUPABASE_ANON_KEY=ey...\n`;
                if(framework === 'nextjs') {
                    files['lib/supabase.ts'] = `import { createClient } from '@supabase/supabase-js';\nexport const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL!, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY!);`;
                }
            } else if (auth === 'clerk') {
                envContent += `\n# Clerk Auth\nNEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_...\nCLERK_SECRET_KEY=sk_test_...\n`;
            }

            // --- DB INJECTION ---
            if (db === 'postgres') {
                envContent += `\n# Database\nDATABASE_URL="postgresql://user:password@localhost:5432/mydb"\n`;
                files['prisma/schema.prisma'] = `datasource db {\n  provider = "postgresql"\n  url      = env("DATABASE_URL")\n}\ngenerator client {\n  provider = "prisma-client-js"\n}`;
            }

            // --- AI INJECTION ---
            if (ai !== 'none') {
                envContent += `\n# AI Provider (${ai.toUpperCase()})\nAI_API_KEY=sk-...\n`;
                if (framework === 'nextjs' || framework === 'fastapi') {
                    files['lib/ai_config.ts'] = `// AI Configuration for ${ai}\nexport const AI_CONFIG = {\n  provider: '${ai}',\n  model: '${ai === 'openai' ? 'gpt-4o' : ai === 'anthropic' ? 'claude-3-5-sonnet' : 'gemini-1.5-pro'}'\n};`;
                }
            }

            files['.env.example'] = envContent;

            // 4. Inject Best Practices
            if (useDocker) {
                files['Dockerfile'] = `FROM node:18-alpine\nWORKDIR /app\nCOPY . .\nRUN npm install\nCMD ["npm", "start"]`;
                files['docker-compose.yml'] = `version: '3'\nservices:\n  app:\n    build: .\n    ports: ["3000:3000"]\n    env_file: .env`;
            }

            if (useCI) {
                files['.github/workflows/ci.yml'] = `name: CI\non: [push]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      - run: npm install\n      - run: npm test`;
            }

            if (useCursor) {
                const stackDetails = `${framework.toUpperCase()} + ${auth.toUpperCase()} + ${db.toUpperCase()}`;
                files['.cursorrules'] = CLEAR_PROMPT.replace('{PROJECT_NAME}', projectName).replace('{STACK_DETAILS}', stackDetails);
            }

            files['README.md'] = `# ${projectName}\n\nGenerated by VibeStack Studio v3.0\n\n## Stack\n- Framework: ${framework}\n- Auth: ${auth}\n- DB: ${db}\n- AI: ${ai}\n\n## Quick Start\n1. \`cp .env.example .env\`\n2. \`npm install\`\n3. \`npm run dev\``;

            // 5. Update State
            currentProject = files;
            if (!currentProject[activeFile]) {
                activeFile = Object.keys(currentProject)[0];
            }
            
            renderFileTree();
            renderEditor();
            updateStatus("Ready");
        }

        // --- 2. UI RENDERING ---

        function renderFileTree() {
            const tree = document.getElementById('file-tree');
            tree.innerHTML = '';
            
            Object.keys(currentProject).sort().forEach(fileName => {
                const div = document.createElement('div');
                const isSelected = fileName === activeFile;
                div.className = `flex items-center gap-2 px-3 py-1.5 cursor-pointer rounded text-xs transition-colors ${isSelected ? 'bg-indigo-600/20 text-indigo-300 border-l-2 border-indigo-500' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`;
                
                let icon = 'file';
                if(fileName.endsWith('json')) icon = 'file-json';
                if(fileName.endsWith('js') || fileName.endsWith('ts') || fileName.endsWith('tsx')) icon = 'file-code';
                if(fileName.includes('docker') || fileName.includes('yml')) icon = 'container';
                if(fileName.startsWith('.')) icon = 'settings';

                div.innerHTML = `<i data-lucide="${icon}" class="w-3 h-3 opacity-70"></i> ${fileName}`;
                div.onclick = () => { activeFile = fileName; renderEditor(); renderFileTree(); };
                tree.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderEditor() {
            const editor = document.getElementById('code-editor');
            editor.value = currentProject[activeFile] || '';
            
            const tabs = document.getElementById('tabs-container');
            tabs.innerHTML = `<div class="px-4 h-full flex items-center bg-[#0b0e14] border-t-2 border-indigo-500 text-xs text-slate-200 font-mono">${activeFile}</div>`;
        }

        function updateStatus(msg) {
            const pill = document.getElementById('status-pill');
            pill.innerHTML = `<div class="w-2 h-2 rounded-full bg-green-500"></div><span class="text-xs text-slate-400">${msg}</span>`;
        }

        // --- 3. DOWNLOAD ---

        async function downloadBundle() {
            updateStatus("Compressing...");
            const zip = new JSZip();
            const projectName = document.getElementById('projectName').value || "vibestack-project";

            for (const [path, content] of Object.entries(currentProject)) {
                zip.file(path, content);
            }

            // Universal Install Scripts
            const installScript = `
#!/bin/bash
echo "🚀 VibeStack: ${projectName} Initializing..."
if [ ! -f .env ]; then
    echo "📄 Creating .env..."
    cp .env.example .env
fi
echo "📦 Installing Dependencies..."
npm install || pip install -r requirements.txt
echo "✅ Done! Run 'npm run dev' or 'python main.py' to start."
            `;
            zip.file("setup.sh", installScript.trim());

            const blob = await zip.generateAsync({type:"blob"});
            saveAs(blob, `${projectName}.zip`);
            updateStatus("Downloaded!");
            setTimeout(() => updateStatus("Engine Idle"), 2000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            regenerateScaffold();
        });

    </script>
</body>
</html>
