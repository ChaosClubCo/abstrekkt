  if(!vis.length){g.innerHTML=`<div class="empty">No skills match "${q}"</div>`;return;}
  g.innerHTML=vis.map(s=>{
    const bl=s.c==="user"?"bu":s.c==="public"?"bp":"be";
    const blLabel=s.c==="user"?"User":s.c==="public"?"Public":"Example";
    const act=ACTIVE.has(s.n);
    return `<div class="card" data-c="${s.c}">
  <div class="card-top"><div class="card-name">${s.n}</div><span class="badge ${bl}">${blLabel}</span></div>
  <div class="desc">${s.d}</div>
  <div class="card-foot">
    <span class="fname">${s.f}</span><span class="fsize">${fmt(s.kb)}</span>
    <a class="btn dl" href="skills/${s.f}" download="${s.f}">${DL_ICO} Install</a>
    <button class="btn cp" onclick="cp(this,'${s.n}')">${CP_ICO} Copy</button>
    ${act?`<span class="active-pill"><span class="dot"></span>Active</span>`:''}
  </div>
</div>`;
  }).join("");
}

function cp(btn,name){
  navigator.clipboard.writeText(name).catch(()=>{const t=document.createElement("textarea");t.value=name;document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);});
  btn.classList.add("ok");btn.innerHTML=`${OK_ICO} Copied`;
  setTimeout(()=>{btn.classList.remove("ok");btn.innerHTML=`${CP_ICO} Copy`;},2000);
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;
  fil=b.dataset.f;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  b.classList.add("on");render();
});
document.getElementById("sq").addEventListener("input",e=>{q=e.target.value;render();});
render();
</script>
</body>
</html>
