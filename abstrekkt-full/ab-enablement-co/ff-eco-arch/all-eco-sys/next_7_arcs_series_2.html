
<style>
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
*{box-sizing:border-box;margin:0;padding:0;}
.wrap{padding:1rem 0 2rem;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{
  background:var(--color-background-primary);
  border:0.5px solid var(--color-border-tertiary);
  border-radius:var(--border-radius-lg);
  padding:14px 16px;
  cursor:pointer;
  transition:border-color .15s,transform .1s;
  position:relative;
  border-left:3px solid var(--accent-color,var(--color-border-tertiary));
}
.card:hover{border-color:var(--accent-color);transform:translateY(-1px);}
.card.active{border-color:var(--accent-color);background:var(--color-background-secondary);}
.card-top{display:flex;align-items:flex-start;gap:10px;}
.card-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.card-title{font-size:14px;font-weight:500;color:var(--color-text-primary);line-height:1.3;margin-bottom:3px;}
.card-lane{font-size:11px;color:var(--color-text-secondary);letter-spacing:.04em;}
.chevron{position:absolute;top:14px;right:14px;font-size:14px;color:var(--color-text-secondary);transition:transform .2s;}
.card.active .chevron{transform:rotate(180deg);}
.detail{max-height:0;overflow:hidden;transition:max-height .3s ease;border-top:0.5px solid transparent;margin-top:0;}
.card.active .detail{max-height:320px;border-top-color:var(--color-border-tertiary);margin-top:12px;padding-top:12px;}
.why{font-size:12.5px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:10px;}
.capstone-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:4px;}
.capstone{font-size:12.5px;color:var(--color-text-primary);font-style:italic;line-height:1.5;margin-bottom:12px;}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pill{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:500;}
.build-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:6px 12px;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);color:var(--color-text-primary);cursor:pointer;transition:background .15s;font-family:inherit;}
.build-btn:hover{background:var(--color-background-secondary);}
</style>

<div class="wrap">
  <h2 class="sr-only">Seven suggested arc types for the second series of learning timelines</h2>
  <div class="grid" id="grid"></div>
</div>

<script>
const ARCS = [
  {
    id:'gcp',
    title:'The GCP / Vertex AI Arc',
    lane:'Cloud infrastructure · ML Engineer cert',
    accent:'#4285f4',
    iconBg:'rgba(66,133,244,0.12)',
    icon:'ti-cloud',
    load:'HIGH',
    cert:'Google Professional ML Engineer',
    horizon:'12 mo',
    why:"Google ML Engineer is already on your cert list and you've flagged GCP as a 3–6 month ramp given your Microsoft-heavy background. This arc builds that ramp deliberately: Vertex AI, Cloud Run, BigQuery, IAM, Artifact Registry, and the ML pipeline tooling that the exam actually tests. Without this arc, the Gemini arc's M11 cert attempt is under-prepared.",
    capstone:"Google Professional ML Engineer cert passed. A production Vertex AI pipeline deployed. A comparison doc — 'When to use Azure ML vs. Vertex AI' — that earns Partner Network credibility with multi-cloud clients."
  },
  {
    id:'fullstack',
    title:'The Full-Stack AI App Arc',
    lane:'Next.js · FastAPI · auth · Vercel',
    accent:'#e879f9',
    iconBg:'rgba(232,121,249,0.12)',
    icon:'ti-layout-2',
    load:'HIGH',
    cert:'Portfolio-based — no exam',
    horizon:'12 mo',
    why:"Every agent you've shipped runs in n8n, Copilot Studio, or Claude Desktop. None of them are user-facing products with auth, a database, and a UI a non-technical user can actually open. The gap between automation and product is a full-stack app. This arc closes it: Next.js or SvelteKit frontend, FastAPI or Hono backend, Supabase for data, Vercel for deployment, Clerk or Auth.js for auth. The output is a product a stranger can use.",
    capstone:"A deployed user-facing AI application with real authentication, a real database, and at least one user who didn't know you personally before they signed up. The product that closes the 'can you actually ship a product?' question."
  },
  {
    id:'azure',
    title:'The Azure AI Foundry Arc',
    lane:'Azure OpenAI · Prompt Flow · enterprise ML',
    accent:'#6366f1',
    iconBg:'rgba(99,102,241,0.12)',
    icon:'ti-server',
    load:'MED',
    cert:'AI-102 deepening (already targeted)',
    horizon:'9 mo',
    why:"Copilot Studio is the surface layer. Azure AI Foundry is the engineering layer underneath it — Azure OpenAI Service endpoints, Prompt Flow for multi-step pipelines, Azure ML for model deployment, Semantic Kernel for orchestration. The Head of AIaaS role needs someone who can operate at both layers. This arc is what separates 'Copilot Studio implementer' from 'Microsoft AI engineer.'",
    capstone:"A Foundry-backed agent deployed to an Azure endpoint. A published architecture comparison: Copilot Studio vs. Azure AI Foundry — when to use which and why. The artifact that makes Intinc a credible Microsoft AI partner, not just a Copilot reseller."
  },
  {
    id:'eval',
    title:'The Agentic Evaluation Arc',
    lane:'LangSmith · Braintrust · CI/CD for AI quality',
    accent:'#eab308',
    iconBg:'rgba(234,179,8,0.12)',
    icon:'ti-clipboard-data',
    load:'MED',
    cert:'No official cert — depth-based',
    horizon:'9 mo',
    why:"Your eval work across arcs has been instrumental — a means to prove improvements, not a discipline in itself. This arc makes eval a first-class skill: LangSmith or Braintrust mastered rather than sampled, golden dataset design as a repeatable practice, LLM-as-judge calibration documented and defensible, and CI/CD quality gates that catch regressions before production. The rare skill that lets you prove your agents work — not claim they do.",
    capstone:"A production eval harness running as CI/CD across your most critical agent. Public LangSmith or Braintrust traces that demonstrate eval methodology. An 'agentic eval playbook' that becomes the most-cited artifact in your Partner Network profile."
  },
  {
    id:'voice',
    title:'The Voice & Realtime Arc',
    lane:'OpenAI Realtime · streaming · sub-700ms agents',
    accent:'#a855f7',
    iconBg:'rgba(168,85,247,0.12)',
    icon:'ti-microphone',
    load:'MED',
    cert:'No official cert — shipped artifact',
    horizon:'9 mo',
    why:"Text chat is the current interaction paradigm. Voice is the next one. OpenAI Realtime API, Claude streaming patterns, Whisper for transcription, TTS for response, WebRTC transport, sub-700ms turn latency design. The enterprise use cases — meeting assistants, call center AI, voice-first internal tools — are arriving faster than most practitioners are ready for. Almost nobody on the independent consultant side is actually building them well yet.",
    capstone:"A deployed voice agent with measured sub-700ms turn latency. One real workflow that works genuinely better as voice than text — documented with before/after comparison. The proof artifact that the Voice & Realtime lane is yours, not just on your resume."
  },
  {
    id:'product',
    title:'The AI Product Strategy Arc',
    lane:'PRDs · roadmapping · AI metrics · advisory',
    accent:'#f43f5e',
    iconBg:'rgba(244,63,94,0.12)',
    icon:'ti-device-desktop-analytics',
    load:'LOW',
    cert:'PSPO or similar (optional)',
    horizon:'9 mo',
    why:"You can build production AI systems. The gap between that and advising enterprise leadership on what AI systems to build — writing PRDs for agentic features, running user research on AI workflows, defining 'done' for an AI product, roadmapping what comes after the pilot — is a product thinking skill, not a technical one. This arc is the fastest path to the strategic advisory layer that the Head of AIaaS role will eventually require. Practitioners who can think in both engineering and product terms are rare.",
    capstone:"An AI product strategy document for a real Intinc initiative or FlashFusion client engagement. A PRD template for agentic features that Daniel could hand to a client. The artifact that signals you advise on AI strategy, not just implement it."
  },
  {
    id:'cloudflare',
    title:'The Cloudflare Edge AI Arc',
    lane:'Workers AI · Vectorize · D1 · AI Gateway',
    accent:'#fb923c',
    iconBg:'rgba(251,146,60,0.12)',
    icon:'ti-bolt',
    load:'LOW',
    cert:'No official cert — registry presence',
    horizon:'9 mo',
    why:"You already use Cloudflare Workers for webhook relays and proxy patterns. Workers AI, Vectorize (Cloudflare's vector DB), D1 (SQL at the edge), R2 (object storage), and AI Gateway let you build AI applications that run at the edge with sub-50ms response times and no cold starts. The deployment pattern for AI workloads that can't tolerate latency — real-time inference, low-latency RAG, streaming AI responses, and agent middleware. The most underused layer in your existing stack.",
    capstone:"Five Workers AI deployments to production. An 'AI at the edge' architecture guide published — the patterns for when edge inference beats serverless and when it doesn't. The Cloudflare AI stack added to your Partner Network capability listing."
  },
];

let active = null;

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = ARCS.map((a,i)=>`
    <div class="card${active===i?' active':''}" style="--accent-color:${a.accent}" data-i="${i}">
      <div class="card-top">
        <div class="card-icon" style="background:${a.iconBg}">
          <i class="ti ${a.icon}" style="font-size:16px;color:${a.accent}" aria-hidden="true"></i>
        </div>
        <div style="flex:1;min-width:0;">
          <div class="card-title">${a.title}</div>
          <div class="card-lane">${a.lane}</div>
        </div>
      </div>
      <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
      <div class="detail">
        <p class="why">${a.why}</p>
        <div class="capstone-label">Capstone output</div>
        <p class="capstone">${a.capstone}</p>
        <div class="meta-row">
          <span class="pill" style="background:rgba(100,100,100,0.1);color:var(--color-text-secondary);">Load: ${a.load}</span>
          <span class="pill" style="background:rgba(100,100,100,0.1);color:var(--color-text-secondary);">${a.horizon}</span>
          <span class="pill" style="background:${a.iconBg};color:${a.accent};">${a.cert}</span>
        </div>
        <button class="build-btn" onclick="buildArc(${i})">
          Build this arc <i class="ti ti-arrow-up-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('button'))return;
      const i=+el.dataset.i;
      active=active===i?null:i;
      render();
    });
  });
}

function buildArc(i){
  const a=ARCS[i];
  sendPrompt(`Build ${a.title} — ${a.lane}`);
}

render();
</script>
