<style>
:root{--bg:#0c0c0b;--sf:#111110;--c:#181815;--b:#232320;--h:#303030;--a:#d4893a;--t:#ddd8ce;--t2:#807c74;--t3:#3a3835;--g:#5a9c5a;--m:#78afc8;--r:#c05050;--tg:#1e1e1a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;font-size:13px;line-height:1.6}
h1{font-family:Georgia,serif;font-size:17px;font-weight:700}
header{padding:12px 20px 10px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-family:monospace;font-size:10px;color:var(--t2);margin-top:2px}
nav{display:flex;border-bottom:1px solid var(--b);padding:0 20px}
.tb{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font:inherit;font-size:12px;font-weight:500;padding:8px 11px;color:var(--t2);margin-bottom:-1px;transition:.15s}
.tb.on{color:var(--t);border-bottom-color:var(--a)}
#ct{padding:15px 20px;max-width:820px}
.cd{background:var(--c);border:1px solid var(--b);border-radius:3px;padding:12px 14px;margin-bottom:7px}
.mn{font-family:monospace;font-size:10px;color:var(--t2)}
.inp{width:100%;padding:6px 9px;border-radius:2px;border:1px solid var(--h);font:inherit;font-size:12px;background:var(--bg);color:var(--t);margin-bottom:6px;outline:none}
.lbl{font-family:monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.btn{background:transparent;border:1px solid var(--h);border-radius:2px;color:var(--t2);font-family:monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;cursor:pointer;transition:.15s}
.btn:hover:not([disabled]){color:var(--t);border-color:var(--t2)}
.btn.a{border-color:var(--a);color:var(--a)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.rd{display:flex;align-items:center;gap:7px;cursor:pointer;padding:5px 7px;border-radius:2px;border:1px solid var(--b);margin-bottom:3px;transition:.15s}
.rd.on{border-color:var(--a);background:var(--tg)}
.ci{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--tg);cursor:pointer;transition:.1s}
.ci:last-child{border-bottom:none}
.ci:hover,.ci.d{background:var(--sf)}
.cb{width:14px;height:14px;flex-shrink:0;margin-top:1px;border:1px solid var(--h);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--g)}
.ci.d .cb{background:#1a2a1a;border-color:var(--g)}
.ci.d .cl{color:var(--t2);text-decoration:line-through}
.cl{font-size:12px;font-weight:500;color:var(--t)}
.ta{width:100%;background:var(--sf);border:1px solid var(--b);border-radius:2px;color:var(--t);font:inherit;font-size:12px;padding:7px 9px;resize:vertical;min-height:50px;outline:none}
</style>
<header>
  <div><h1>Employee Suite</h1><div class="sub">◆ Setup Checklist · Weekly Check-in · Claude Enablement</div></div>
  <div id="hs" style="text-align:right"></div>
</header>
<nav><button class="tb" data-t="s">Setup</button><button class="tb" data-t="c">Check-in</button></nav>
<div id="ct"><div class="mn" style="padding:10px">Loading…</div></div>
<script>
const E=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $=s=>document.querySelector(s);

const STEPS=[
  [1,'Create your Claude account','Go to claude.ai and sign up or log in.','free','Foundation'],
  [2,'Understand your plan','Free → Pro → Team → Enterprise. Pro unlocks Projects, memory, and connectors.','free','Foundation'],
  [3,'Upgrade to Pro (recommended)','$20/mo. Unlocks Projects, persistent memory, and connectors.','pro','Foundation'],
  [4,'Explore the interface','Send test messages. Try drafting something from your actual work.','free','Foundation'],
  [5,'Create your first Project','Settings → Projects → New Project. Gives Claude persistent context for a work area.','pro','Projects & Memory'],
  [6,'Write Project custom instructions','Add your role, preferences, and working style. Use your prompt package from your facilitator.','pro','Projects & Memory'],
  [7,'Configure memory','Settings → Memory. Claude captures things from conversations. Review and curate them.','pro','Projects & Memory'],
  [8,'Add 3–5 memory edits','Format: "User is [role] at [company]. Prefers [style]. Always [preference]."','pro','Projects & Memory'],
  [9,'Install a connector','Settings → Connectors. Connect a daily tool — Google Workspace, Slack, or Notion.','pro','Connectors'],
  [10,'Test your connector','Ask Claude something using real data from the connected tool. Verify accuracy.','pro','Connectors'],
  [11,'Practice your #1 use case','Do the highest-impact task your facilitator identified. Real work, not a test.','free','Real Work'],
  [12,'Build your first Artifact','Ask Claude to create a document, table, or code snippet. Artifacts are editable outputs.','free','Real Work'],
  [13,'Try web search','On Pro/Max: enable web search. Research something current and verify the citations.','pro','Real Work'],
  [14,'Submit your first weekly check-in','Use the Check-in tab. Your facilitator reviews these before the next session.','free','Accountability'],
  [15,'Set a recurring Claude habit','Block 10 min weekly to try one new use case. Track it in your check-ins.','free','Accountability'],
];

const FREQ=[{v:'daily',l:'Daily',d:'Every day'},{v:'few_week',l:'A few times/week',d:'3–4 times'},{v:'once_week',l:'Once/week',d:'Weekly'},{v:'once_few',l:'Once every few weeks',d:'Occasionally'},{v:'not_yet',l:'Not yet',d:"Haven't started"}];
const PLAN_IDX={free:0,pro:1,max:2,team:3,enterprise:4};

const sget=async k=>{try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch{return null;}};
const sset=async(k,v)=>{try{await window.storage.set(k,JSON.stringify(v));}catch{}};

const ST={tab:'s',ch:{},pl:'pro',ci:[],done:false,
  cf:{nm:'',fr:'',conf:0,win:'',stuck:'',goal:''},submitted:false};

async function init(){
  const[s,c]=await Promise.all([sget('self-setup-v1'),sget('checkin-records-v1')]);
  if(s){ST.ch=s.checkState||{};ST.pl=s.plan||'pro';}
  ST.ci=c||[];
  render();
}

function updateHdr(){
  const d=Object.values(ST.ch).filter(Boolean).length;
  const pct=Math.round(d/STEPS.length*100);
  $('#hs').innerHTML=`<div class="mn" style="font-size:15px;color:${pct===100?'var(--g)':'var(--a)'}">${pct}%</div><div class="mn" style="text-transform:uppercase;letter-spacing:.08em;color:var(--t3)">setup</div>`;
}

function rS(){
  const d=Object.values(ST.ch).filter(Boolean).length;const pct=Math.round(d/STEPS.length*100);
  const pidx=PLAN_IDX[ST.pl]??0;
  const cats=[...new Set(STEPS.map(s=>s[4]))];
  let h=`<div style="font-family:Georgia,serif;font-size:14px;font-weight:600;margin-bottom:7px">Claude Setup Checklist</div><p style="font-size:11px;color:var(--t2);margin-bottom:12px">15 steps to fully configure Claude. Check off as you go.</p>`;
  h+=`<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="mn">${d}/${STEPS.length} complete</span><span class="mn" style="color:${pct===100?'var(--g)':'var(--a)'}">${pct}%</span></div>`;
  h+=`<div style="background:var(--tg);border-radius:2px;height:3px;margin-bottom:12px"><div style="height:3px;background:${pct===100?'var(--g)':'var(--a)'};border-radius:2px;width:${pct}%;transition:width .3s"></div></div>`;
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:13px"><span class="mn" style="letter-spacing:.1em;text-transform:uppercase;color:var(--t3);font-size:9px">Your Plan</span><div style="display:flex;gap:3px">';
  for(const[v,l] of[['free','Free'],['pro','Pro'],['max','Max'],['team','Team'],['enterprise','Enterprise']])h+=`<button class="btn${ST.pl===v?' a':''}" data-a="pl" data-v="${v}" style="padding:2px 8px">${l}</button>`;
  h+='</div></div>';
  for(const cat of cats){
    const cs=STEPS.filter(s=>s[4]===cat);const cd=cs.filter(s=>ST.ch[s[0]]).length;
    h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span class="mn" style="letter-spacing:.1em;text-transform:uppercase;color:var(--t2);font-size:9px">${cat}</span><span class="mn" style="color:${cd===cs.length?'var(--g)':'var(--t3)'}">${cd}/${cs.length}</span></div>`;
    h+='<div class="cd" style="padding:0;overflow:hidden">';
    for(let si=0;si<cs.length;si++){
      const s=cs[si];const lock=(PLAN_IDX[s[2]]??0)>pidx;const dn=!!ST.ch[s[0]];
      h+=`<div class="ci${dn?' d':''}" data-a="tog" data-id="${s[0]}" style="opacity:${lock?0.45:1};cursor:${lock?'not-allowed':'pointer'};border-bottom:${si<cs.length-1?'1px solid var(--tg)':'none'}"><div class="cb">${dn?'◆':''}</div><div style="flex:1"><div class="cl">${s[1]}${s[2]!=='free'?` <span class="mn" style="color:var(--m)">${s[2]}+</span>`:''}</div><div style="font-size:11px;color:var(--t3);margin-top:2px">${s[3]}</div></div><span class="mn" style="font-size:9px;flex-shrink:0">${String(s[0]).padStart(2,'0')}</span></div>`;
    }
    h+='</div></div>';
  }
  if(pct===100)h+=`<div class="cd" style="border-color:#2a3a2a;text-align:center"><div class="mn" style="color:var(--g);margin-bottom:3px">◆ Setup complete</div><div style="font-size:12px;color:var(--t2)">Submit a weekly check-in to keep your facilitator in the loop.</div></div>`;
  return h;
}

function rC(){
  if(ST.submitted){
    let h=`<div class="cd" style="border-color:#2a3a2a;text-align:center;margin-bottom:12px"><div class="mn" style="color:var(--g);margin-bottom:3px">◆ Check-in submitted</div><div style="font-size:12px;color:var(--t2);margin-bottom:9px">Your facilitator will review before the next session.</div><button class="btn a" data-a="newci">Submit Another</button></div>`;
    if(ST.ci.length){
      h+='<div style="font-family:Georgia,serif;font-size:14px;font-weight:600;margin-bottom:7px">Your Check-ins</div>';
      for(const c of ST.ci.slice(0,5)){
        const fr=FREQ.find(f=>f.v===c.fr)||{l:c.fr||'—'};
        h+=`<div class="cd" style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px"><div style="font-weight:500;font-size:12px">${E(c.nm)}</div><div style="display:flex;align-items:center;gap:7px"><span class="mn">${c.weekOf||'—'}</span><div style="display:flex;gap:2px">${[1,2,3,4,5].map(n=>`<div style="width:7px;height:7px;border-radius:50%;background:${n<=c.conf?'var(--a)':'var(--b)'}"></div>`).join('')}</div></div></div>`;
        h+=`<div class="mn" style="color:var(--m);margin-bottom:5px">${E(fr.l)}</div>`;
        if(c.win)h+=`<div style="font-size:11px;color:var(--t2);margin-bottom:3px"><span style="color:var(--g)">◆</span> ${E(c.win)}</div>`;
        if(c.stuck)h+=`<div style="font-size:11px;color:var(--t2);margin-bottom:3px"><span style="color:var(--r)">◇</span> ${E(c.stuck)}</div>`;
        if(c.goal)h+=`<div style="font-size:11px;color:var(--t2)"><span style="color:var(--m)">→</span> ${E(c.goal)}</div>`;
        h+='</div>';
      }
    }
    return h;
  }
  const f=ST.cf;const ok=f.nm.trim()&&f.fr&&f.conf>0;
  let h='<div style="font-family:Georgia,serif;font-size:14px;font-weight:600;margin-bottom:7px">Weekly Check-in</div><p style="font-size:11px;color:var(--t2);margin-bottom:12px">2 minutes. Your facilitator reviews this before the next session.</p>';
  h+=`<div class="cd" style="margin-bottom:7px"><div class="lbl">Your Name *</div><input class="inp" data-cf="nm" value="${E(f.nm)}" placeholder="Jane Smith"></div>`;
  h+='<div class="cd" style="margin-bottom:7px"><div class="lbl" style="margin-bottom:6px">How often are you using Claude? *</div>';
  for(const fr of FREQ)h+=`<div class="rd${f.fr===fr.v?' on':''}" data-a="fr" data-v="${fr.v}"><span class="mn" style="color:${f.fr===fr.v?'var(--a)':'var(--m)'}">${fr.l}</span><span style="font-size:11px;color:var(--t3)">${fr.d}</span></div>`;
  h+='</div><div class="cd" style="margin-bottom:7px"><div class="lbl" style="margin-bottom:6px">Confidence with Claude (1–5) *</div><div style="display:flex;gap:6px;margin-top:4px">';
  for(const n of[1,2,3,4,5])h+=`<button class="btn${f.conf===n?' a':''}" data-a="conf" data-v="${n}" style="width:36px;height:36px;padding:0">${n}</button>`;
  h+=`</div>${f.conf?`<div class="mn" style="margin-top:5px">${['','Struggling','Getting started','Making progress','Comfortable','Confident'][f.conf]}</div>`:''}</div>`;
  h+=`<div class="cd" style="margin-bottom:7px"><div class="lbl" style="margin-bottom:4px">Biggest win this week</div><textarea class="ta" data-cf="win" placeholder="What did Claude help you accomplish?">${E(f.win)}</textarea></div>`;
  h+=`<div class="cd" style="margin-bottom:7px"><div class="lbl" style="margin-bottom:4px">What are you stuck on?</div><textarea class="ta" data-cf="stuck" placeholder="Blockers, confusion, or things not working?">${E(f.stuck)}</textarea></div>`;
  h+=`<div class="cd" style="margin-bottom:9px"><div class="lbl" style="margin-bottom:4px">Goal for next week</div><textarea class="ta" data-cf="goal" placeholder="One specific thing you'll try next week.">${E(f.goal)}</textarea></div>`;
  h+=`<div style="text-align:right"><button class="btn${ok?' a':''}" data-a="subci"${!ok?' disabled':''}>Submit Check-in →</button></div>`;
  return h;
}

function render(){
  $$('button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===ST.tab));
  $('#ct').innerHTML=ST.tab==='s'?rS():rC();
  updateHdr();
}
function $$( s){return document.querySelectorAll(s);}

document.body.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a],[data-t]');if(!el)return;
  const{a,v,id}=el.dataset;
  if(el.dataset.t){ST.tab=el.dataset.t;render();}
  else if(a==='pl'){ST.pl=v;await sset('self-setup-v1',{checkState:ST.ch,plan:ST.pl});render();}
  else if(a==='tog'){
    const n=Number(id);if(!n)return;
    const pidx=PLAN_IDX[ST.pl]??0;const step=STEPS.find(s=>s[0]===n);
    if(step&&(PLAN_IDX[step[2]]??0)>pidx)return;
    ST.ch={...ST.ch,[n]:!ST.ch[n]};await sset('self-setup-v1',{checkState:ST.ch,plan:ST.pl});render();
  }
  else if(a==='fr'){ST.cf.fr=v;render();}
  else if(a==='conf'){ST.cf.conf=Number(v);render();}
  else if(a==='newci'){ST.submitted=false;ST.cf={nm:'',fr:'',conf:0,win:'',stuck:'',goal:''};render();}
  else if(a==='subci'){
    const rec={...ST.cf,id:Date.now(),weekOf:new Date().toISOString().slice(0,10),createdAt:new Date().toISOString()};
    ST.ci=[rec,...ST.ci];await sset('checkin-records-v1',ST.ci);ST.submitted=true;render();
  }
});

document.body.addEventListener('input',e=>{
  const el=e.target;if(el.dataset.cf)ST.cf[el.dataset.cf]=el.value;
});

init();
</script>
