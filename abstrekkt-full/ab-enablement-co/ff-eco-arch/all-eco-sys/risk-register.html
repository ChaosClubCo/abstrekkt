<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Register | INT Inc.</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --int-navy: #0A1628;
            --int-blue: #1E4D8C;
            --int-accent: #FF6B35;
            --green: #10B981;
            --yellow: #F59E0B;
            --red: #EF4444;
            --purple: #8B5CF6;
            --gray-50: #F8FAFC;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-300: #CBD5E1;
            --gray-400: #94A3B8;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--int-navy), var(--int-blue));
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .header-meta {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .header-stat {
            text-align: center;
        }

        .header-stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-stat-label {
            font-size: 0.75rem;
            color: var(--gray-400);
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--int-accent);
            color: white;
        }

        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .summary-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .summary-icon.critical { background: #FEE2E2; }
        .summary-icon.high { background: #FFEDD5; }
        .summary-icon.medium { background: #FEF3C7; }
        .summary-icon.low { background: #D1FAE5; }
        .summary-icon.mitigated { background: #DBEAFE; }

        .summary-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--int-navy);
        }

        .summary-label {
            font-size: 0.85rem;
            color: var(--gray-500);
        }

        /* Risk Matrix */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--int-navy);
        }

        .card-body {
            padding: 1.5rem;
        }

        .risk-matrix {
            display: grid;
            grid-template-columns: 40px repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr) 40px;
            gap: 2px;
            height: 300px;
            margin-bottom: 1rem;
        }

        .matrix-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--gray-500);
            font-weight: 600;
        }

        .matrix-label.y-axis {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        .matrix-cell {
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .matrix-cell:hover {
            transform: scale(1.05);
        }

        .matrix-cell.critical { background: #DC2626; }
        .matrix-cell.high { background: #F97316; }
        .matrix-cell.medium { background: #EAB308; }
        .matrix-cell.low { background: #22C55E; }

        .matrix-axis-label {
            font-size: 0.8rem;
            text-align: center;
            color: var(--gray-600);
            font-weight: 600;
            padding: 0.5rem;
        }

        /* Risk Table */
        .risk-table {
            width: 100%;
            border-collapse: collapse;
        }

        .risk-table th,
        .risk-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--gray-100);
        }

        .risk-table th {
            background: var(--gray-50);
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--gray-500);
            font-weight: 600;
        }

        .risk-table tr:hover {
            background: var(--gray-50);
        }

        .risk-id {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--int-blue);
        }

        .risk-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .risk-badge.critical { background: #FEE2E2; color: #991B1B; }
        .risk-badge.high { background: #FFEDD5; color: #C2410C; }
        .risk-badge.medium { background: #FEF3C7; color: #A16207; }
        .risk-badge.low { background: #D1FAE5; color: #065F46; }
        .risk-badge.mitigated { background: #DBEAFE; color: #1E40AF; }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .status-badge.open { background: #FEE2E2; color: #991B1B; }
        .status-badge.monitoring { background: #FEF3C7; color: #A16207; }
        .status-badge.mitigated { background: #D1FAE5; color: #065F46; }
        .status-badge.closed { background: #DBEAFE; color: #1E40AF; }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.375rem 0.5rem;
            background: var(--gray-100);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .action-btn:hover {
            background: var(--gray-200);
        }

        /* Quick Add Form */
        .quick-add {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .quick-add h3 {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: var(--int-navy);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: var(--gray-600);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .add-risk-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--int-accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--gray-600);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        @media (max-width: 1100px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .summary-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>⚠️ Risk Register</h1>
        <div class="header-meta">
            <div class="header-stat">
                <div class="header-stat-value" id="totalRisks">0</div>
                <div class="header-stat-label">Total Risks</div>
            </div>
            <div class="header-stat">
                <div class="header-stat-value" id="avgScore">0</div>
                <div class="header-stat-label">Avg. Score</div>
            </div>
            <button class="btn btn-primary" onclick="exportRisks()">📥 Export CSV</button>
        </div>
    </header>

    <main class="main">
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-icon critical">🔴</div>
                <div>
                    <div class="summary-value" id="criticalCount">0</div>
                    <div class="summary-label">Critical</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon high">🟠</div>
                <div>
                    <div class="summary-value" id="highCount">0</div>
                    <div class="summary-label">High</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon medium">🟡</div>
                <div>
                    <div class="summary-value" id="mediumCount">0</div>
                    <div class="summary-label">Medium</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon low">🟢</div>
                <div>
                    <div class="summary-value" id="lowCount">0</div>
                    <div class="summary-label">Low</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon mitigated">✓</div>
                <div>
                    <div class="summary-value" id="mitigatedCount">0</div>
                    <div class="summary-label">Mitigated</div>
                </div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Risk Log</span>
                    <select onchange="filterRisks(this.value)" style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--gray-300);">
                        <option value="all">All Risks</option>
                        <option value="critical">Critical Only</option>
                        <option value="high">High & Above</option>
                        <option value="open">Open Only</option>
                    </select>
                </div>
                <div class="card-body" style="padding: 0; overflow-x: auto;">
                    <table class="risk-table" id="riskTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Risk Description</th>
                                <th>Category</th>
                                <th>Level</th>
                                <th>Score</th>
                                <th>Status</th>
                                <th>Owner</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="riskTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div>
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-header">
                        <span class="card-title">Risk Matrix</span>
                    </div>
                    <div class="card-body">
                        <div style="text-align: center; font-size: 0.75rem; color: var(--gray-500); margin-bottom: 0.5rem;">IMPACT →</div>
                        <div class="risk-matrix" id="riskMatrix">
                            <div class="matrix-label y-axis">LIKELIHOOD</div>
                            <!-- Row 5 (Very High) -->
                            <div class="matrix-cell medium" data-l="5" data-i="1"></div>
                            <div class="matrix-cell high" data-l="5" data-i="2"></div>
                            <div class="matrix-cell high" data-l="5" data-i="3"></div>
                            <div class="matrix-cell critical" data-l="5" data-i="4"></div>
                            <div class="matrix-cell critical" data-l="5" data-i="5"></div>
                            <!-- Row 4 (High) -->
                            <div class="matrix-label"></div>
                            <div class="matrix-cell low" data-l="4" data-i="1"></div>
                            <div class="matrix-cell medium" data-l="4" data-i="2"></div>
                            <div class="matrix-cell high" data-l="4" data-i="3"></div>
                            <div class="matrix-cell high" data-l="4" data-i="4"></div>
                            <div class="matrix-cell critical" data-l="4" data-i="5"></div>
                            <!-- Row 3 (Medium) -->
                            <div class="matrix-label"></div>
                            <div class="matrix-cell low" data-l="3" data-i="1"></div>
                            <div class="matrix-cell medium" data-l="3" data-i="2"></div>
                            <div class="matrix-cell medium" data-l="3" data-i="3"></div>
                            <div class="matrix-cell high" data-l="3" data-i="4"></div>
                            <div class="matrix-cell high" data-l="3" data-i="5"></div>
                            <!-- Row 2 (Low) -->
                            <div class="matrix-label"></div>
                            <div class="matrix-cell low" data-l="2" data-i="1"></div>
                            <div class="matrix-cell low" data-l="2" data-i="2"></div>
                            <div class="matrix-cell medium" data-l="2" data-i="3"></div>
                            <div class="matrix-cell medium" data-l="2" data-i="4"></div>
                            <div class="matrix-cell high" data-l="2" data-i="5"></div>
                            <!-- Row 1 (Very Low) -->
                            <div class="matrix-label"></div>
                            <div class="matrix-cell low" data-l="1" data-i="1"></div>
                            <div class="matrix-cell low" data-l="1" data-i="2"></div>
                            <div class="matrix-cell low" data-l="1" data-i="3"></div>
                            <div class="matrix-cell medium" data-l="1" data-i="4"></div>
                            <div class="matrix-cell medium" data-l="1" data-i="5"></div>
                            <!-- Bottom labels -->
                            <div class="matrix-label"></div>
                            <div class="matrix-label">1</div>
                            <div class="matrix-label">2</div>
                            <div class="matrix-label">3</div>
                            <div class="matrix-label">4</div>
                            <div class="matrix-label">5</div>
                        </div>
                        <div class="legend">
                            <div class="legend-item"><div class="legend-dot" style="background: #22C55E;"></div> Low</div>
                            <div class="legend-item"><div class="legend-dot" style="background: #EAB308;"></div> Medium</div>
                            <div class="legend-item"><div class="legend-dot" style="background: #F97316;"></div> High</div>
                            <div class="legend-item"><div class="legend-dot" style="background: #DC2626;"></div> Critical</div>
                        </div>
                    </div>
                </div>

                <div class="quick-add">
                    <h3>➕ Add New Risk</h3>
                    <div class="form-group">
                        <label>Risk Description</label>
                        <textarea id="riskDesc" placeholder="Describe the risk..." rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="riskCategory">
                            <option value="Technical">Technical</option>
                            <option value="Resource">Resource</option>
                            <option value="Schedule">Schedule</option>
                            <option value="Scope">Scope</option>
                            <option value="External">External</option>
                            <option value="Compliance">Compliance</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Likelihood (1-5)</label>
                            <select id="riskLikelihood">
                                <option value="1">1 - Rare</option>
                                <option value="2">2 - Unlikely</option>
                                <option value="3" selected>3 - Possible</option>
                                <option value="4">4 - Likely</option>
                                <option value="5">5 - Almost Certain</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Impact (1-5)</label>
                            <select id="riskImpact">
                                <option value="1">1 - Minimal</option>
                                <option value="2">2 - Minor</option>
                                <option value="3" selected>3 - Moderate</option>
                                <option value="4">4 - Major</option>
                                <option value="5">5 - Severe</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Owner</label>
                        <input type="text" id="riskOwner" placeholder="Who is responsible?">
                    </div>
                    <div class="form-group">
                        <label>Mitigation Plan</label>
                        <textarea id="riskMitigation" placeholder="How will this be addressed?" rows="2"></textarea>
                    </div>
                    <button class="add-risk-btn" onclick="addRisk()">Add Risk</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let risks = [
            { id: 'R001', desc: 'Key technical resource unavailable during critical phase', category: 'Resource', likelihood: 3, impact: 4, status: 'open', owner: 'PM', mitigation: 'Cross-train backup resources, document all processes' },
            { id: 'R002', desc: 'Integration with legacy EHR system may take longer than estimated', category: 'Technical', likelihood: 4, impact: 4, status: 'monitoring', owner: 'Tech Lead', mitigation: 'Early spike testing, buffer time in schedule' },
            { id: 'R003', desc: 'HIPAA compliance validation may require additional review cycles', category: 'Compliance', likelihood: 3, impact: 5, status: 'open', owner: 'Security', mitigation: 'Engage compliance team early, use pre-approved patterns' },
            { id: 'R004', desc: 'Scope creep from stakeholder feature requests', category: 'Scope', likelihood: 4, impact: 3, status: 'monitoring', owner: 'PM', mitigation: 'Strict change control process, prioritized backlog' },
            { id: 'R005', desc: 'Vendor API changes during implementation', category: 'External', likelihood: 2, impact: 4, status: 'mitigated', owner: 'Tech Lead', mitigation: 'Version lock, abstraction layer, vendor communication' }
        ];

        let riskCounter = 6;

        function getRiskLevel(score) {
            if (score >= 20) return 'critical';
            if (score >= 12) return 'high';
            if (score >= 6) return 'medium';
            return 'low';
        }

        function addRisk() {
            const desc = document.getElementById('riskDesc').value.trim();
            if (!desc) {
                alert('Please enter a risk description');
                return;
            }

            const risk = {
                id: `R${String(riskCounter++).padStart(3, '0')}`,
                desc: desc,
                category: document.getElementById('riskCategory').value,
                likelihood: parseInt(document.getElementById('riskLikelihood').value),
                impact: parseInt(document.getElementById('riskImpact').value),
                status: 'open',
                owner: document.getElementById('riskOwner').value.trim() || 'TBD',
                mitigation: document.getElementById('riskMitigation').value.trim()
            };

            risks.push(risk);
            renderAll();
            clearForm();
        }

        function clearForm() {
            document.getElementById('riskDesc').value = '';
            document.getElementById('riskOwner').value = '';
            document.getElementById('riskMitigation').value = '';
            document.getElementById('riskLikelihood').value = '3';
            document.getElementById('riskImpact').value = '3';
        }

        function deleteRisk(id) {
            risks = risks.filter(r => r.id !== id);
            renderAll();
        }

        function updateStatus(id, newStatus) {
            const risk = risks.find(r => r.id === id);
            if (risk) {
                risk.status = newStatus;
                renderAll();
            }
        }

        function filterRisks(filter) {
            renderTable(filter);
        }

        function renderAll() {
            renderTable('all');
            renderMatrix();
            updateSummary();
        }

        function renderTable(filter = 'all') {
            const tbody = document.getElementById('riskTableBody');
            
            let filtered = risks;
            if (filter === 'critical') filtered = risks.filter(r => getRiskLevel(r.likelihood * r.impact) === 'critical');
            else if (filter === 'high') filtered = risks.filter(r => ['critical', 'high'].includes(getRiskLevel(r.likelihood * r.impact)));
            else if (filter === 'open') filtered = risks.filter(r => r.status === 'open');

            tbody.innerHTML = filtered.map(r => {
                const score = r.likelihood * r.impact;
                const level = getRiskLevel(score);
                return `
                    <tr>
                        <td><span class="risk-id">${r.id}</span></td>
                        <td>${r.desc}</td>
                        <td>${r.category}</td>
                        <td><span class="risk-badge ${level}">${level}</span></td>
                        <td><strong>${score}</strong></td>
                        <td>
                            <select onchange="updateStatus('${r.id}', this.value)" style="padding: 0.25rem; border-radius: 4px; border: 1px solid var(--gray-300); font-size: 0.8rem;">
                                <option value="open" ${r.status === 'open' ? 'selected' : ''}>Open</option>
                                <option value="monitoring" ${r.status === 'monitoring' ? 'selected' : ''}>Monitoring</option>
                                <option value="mitigated" ${r.status === 'mitigated' ? 'selected' : ''}>Mitigated</option>
                                <option value="closed" ${r.status === 'closed' ? 'selected' : ''}>Closed</option>
                            </select>
                        </td>
                        <td>${r.owner}</td>
                        <td>
                            <div class="actions">
                                <button class="action-btn" onclick="alert('Mitigation: ${r.mitigation.replace(/'/g, "\\'")}')">👁️</button>
                                <button class="action-btn" onclick="deleteRisk('${r.id}')">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderMatrix() {
            // Clear existing counts
            document.querySelectorAll('.matrix-cell').forEach(cell => {
                cell.textContent = '';
            });

            // Count risks per cell
            risks.forEach(r => {
                if (r.status !== 'closed' && r.status !== 'mitigated') {
                    const cell = document.querySelector(`.matrix-cell[data-l="${r.likelihood}"][data-i="${r.impact}"]`);
                    if (cell) {
                        const count = parseInt(cell.textContent || '0') + 1;
                        cell.textContent = count;
                    }
                }
            });
        }

        function updateSummary() {
            document.getElementById('totalRisks').textContent = risks.length;
            
            let critical = 0, high = 0, medium = 0, low = 0, mitigated = 0;
            let totalScore = 0;

            risks.forEach(r => {
                const score = r.likelihood * r.impact;
                totalScore += score;
                
                if (r.status === 'mitigated' || r.status === 'closed') {
                    mitigated++;
                } else {
                    const level = getRiskLevel(score);
                    if (level === 'critical') critical++;
                    else if (level === 'high') high++;
                    else if (level === 'medium') medium++;
                    else low++;
                }
            });

            document.getElementById('criticalCount').textContent = critical;
            document.getElementById('highCount').textContent = high;
            document.getElementById('mediumCount').textContent = medium;
            document.getElementById('lowCount').textContent = low;
            document.getElementById('mitigatedCount').textContent = mitigated;
            document.getElementById('avgScore').textContent = risks.length ? (totalScore / risks.length).toFixed(1) : '0';
        }

        function exportRisks() {
            const csv = [
                ['ID', 'Description', 'Category', 'Likelihood', 'Impact', 'Score', 'Level', 'Status', 'Owner', 'Mitigation'],
                ...risks.map(r => {
                    const score = r.likelihood * r.impact;
                    return [r.id, r.desc, r.category, r.likelihood, r.impact, score, getRiskLevel(score), r.status, r.owner, r.mitigation];
                })
            ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'risk-register.csv';
            a.click();
        }

        // Initialize
        renderAll();
    </script>
</body>
</html>
