
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a1a;--bg2:#222;--bg3:#2a2a2a;--bg4:#313131;
  --border:#333;--border2:#444;
  --text:#e8e6e3;--text2:#a8a49f;--text3:#6b6863;
  --purple:#9d93e0;--purple-bg:#2d2840;
  --green:#4ca87a;--green-bg:#1e3328;
  --blue:#5b9bd5;--teal:#3db8a0;
  --orange:#e8904a;--pink:#d4649a;
  --red:#e06060;--amber:#d4a843;
}
body{background:var(--bg);font-family:-apple-system,'Segoe UI',sans-serif;color:var(--text);padding:16px}

.search-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:9px 14px 9px 36px;font-size:13px;color:var(--text);outline:none;position:relative}
.search-input:focus{border-color:var(--purple)}
.search-wrap{position:relative;flex:1}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.filter-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 11px;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:background 0.1s,border-color 0.1s}
.filter-btn:hover,.filter-btn.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}

.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:all 0.1s}
.chip:hover{border-color:var(--border2)}
.chip.on{border-color:transparent}
.chip.all.on{background:#3a3630;color:#c0bab4;border-color:var(--border2)}
.chip.claude.on{background:rgba(157,147,224,0.2);color:var(--purple);border-color:rgba(157,147,224,0.4)}
.chip.chatgpt.on{background:rgba(76,168,122,0.2);color:var(--green);border-color:rgba(76,168,122,0.4)}
.chip.midjourney.on{background:rgba(232,144,74,0.2);color:var(--orange);border-color:rgba(232,144,74,0.4)}
.chip.sora.on{background:rgba(224,96,96,0.2);color:var(--red);border-color:rgba(224,96,96,0.4)}
.chip.suno.on{background:rgba(212,100,154,0.2);color:var(--pink);border-color:rgba(212,100,154,0.4)}
.chip.replit.on{background:rgba(91,155,213,0.2);color:var(--blue);border-color:rgba(91,155,213,0.4)}
.chip.goto.on{background:rgba(212,168,67,0.2);color:var(--amber);border-color:rgba(212,168,67,0.4)}

.meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.result-count{font-size:12px;color:var(--text3)}
.sort-sel{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--text2);cursor:pointer;outline:none}

.list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.list-head{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px 70px;padding:7px 14px;background:var(--bg3);font-size:10px;font-weight:600;letter-spacing:0.06em;color:var(--text3);text-transform:uppercase}
.row{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px 70px;padding:10px 14px;background:var(--bg2);cursor:pointer;transition:background 0.1s;align-items:center;gap:4px}
.row:hover{background:var(--bg3)}
.row.hidden{display:none}
.row-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.row-name .em{font-size:14px;flex-shrink:0}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;white-space:nowrap}
.tag.claude{background:rgba(157,147,224,0.2);color:var(--purple)}
.tag.chatgpt{background:rgba(76,168,122,0.2);color:var(--green)}
.tag.midjourney{background:rgba(232,144,74,0.2);color:var(--orange)}
.tag.sora{background:rgba(224,96,96,0.2);color:var(--red)}
.tag.suno{background:rgba(212,100,154,0.2);color:var(--pink)}
.tag.replit{background:rgba(91,155,213,0.2);color:var(--blue)}
.tag.multi{background:rgba(61,184,160,0.2);color:var(--teal)}
.status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600}
.status.goto{background:rgba(76,168,122,0.2);color:var(--green)}
.status.tested{background:rgba(212,168,67,0.18);color:var(--amber)}
.status.draft{background:rgba(122,120,117,0.2);color:#7a7875}
.stars{font-size:10px;letter-spacing:1px;color:var(--amber)}
.stars .e{color:var(--border2)}

.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;background:var(--bg2);border-radius:0 0 10px 10px}
.empty span{font-size:24px;display:block;margin-bottom:8px}

.detail-panel{display:none;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:18px;margin-top:14px}
.detail-panel.open{display:block}
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.detail-title{font-size:16px;font-weight:600;color:var(--text);line-height:1.3}
.detail-close{font-size:16px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:4px;flex-shrink:0}
.detail-close:hover{background:var(--bg4);color:var(--text2)}
.detail-meta{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.prompt-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:12px;color:var(--text2);line-height:1.7;white-space:pre-wrap;font-family:'SF Mono','Fira Code',monospace;max-height:240px;overflow-y:auto}
.copy-btn{margin-top:10px;background:var(--purple-bg);border:1px solid var(--purple);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--purple);cursor:pointer;transition:background 0.1s}
.copy-btn:hover{background:rgba(157,147,224,0.25)}
.copy-btn.copied{background:var(--green-bg);border-color:var(--green);color:var(--green)}
</style>

<script>
const PROMPTS = [
  {name:"Universal System Prompt Builder",tool:"claude",toolLabel:"Claude",cat:"System Prompt",em:"⚡",status:"goto",rating:5,tags:["Foundation","Meta-Prompt","Reusable"],prompt:`You are building a system prompt for an AI assistant. Define the following clearly:

1. ROLE: Who is the AI? (e.g. "You are a senior product manager...")
2. TASK: What specific job does it do?
3. CONSTRAINTS: What must it avoid? What guardrails apply?
4. OUTPUT FORMAT: Exact structure of the response (JSON, markdown, bullets, etc.)
5. EXAMPLES: Include 1–2 golden path examples.

Combine into a single system prompt block. Test it mentally: would a junior developer know exactly what this AI does from reading it?

Add a 'Do NOT' section at the end. Negative constraints prevent the most common failure modes.`},
  {name:"Anti-Slop Design System",tool:"claude",toolLabel:"Claude",cat:"System Prompt",em:"🎨",status:"goto",rating:5,tags:["Design","System Prompt","Anti-Slop"],prompt:`You are a staff design systems lead. You do not produce generic AI interfaces, boilerplate dashboards, bland admin panels, or shallow glassmorphism.

You design software that feels authored by a top human team with taste, judgment, hierarchy, and restraint.

Before any design output:
1. Ask for: product type, user archetype, emotional job-to-be-done, platform, brand adjectives, hard exclusions
2. Reject these patterns: default sidebar+main, card spam, hero→features→CTA clones, pure black backgrounds, rgba(0,0,0) shadows on colored surfaces, tooltip-only affordances

Operate in SPEC MODE (design system + interaction spec, no code) or BUILD MODE (production-ready HTML/CSS/JS).

The test: "Would this embarrass the best designers in the world if they saw it?" If yes — redesign.`},
  {name:"Persistent Role Configuration",tool:"claude",toolLabel:"Claude",cat:"System Prompt",em:"⚡",status:"goto",rating:5,tags:["System Prompt","Foundation"],prompt:`Design a system prompt that makes every subsequent conversation better.

Step 1 — Define the role:
- What domain expertise does this AI have?
- What is its communication style? (direct, Socratic, paired-engineer, etc.)
- What does it always include? (security notes, tests, docs)
- What does it never do? (hallucinate citations, skip error handling)

Step 2 — Define the output contract:
- Default response structure
- Length calibration (brief for trivial, full spec for complex)
- Code standards (TypeScript, comments, no placeholders)

Step 3 — Add self-verification:
Include a "Before responding, verify:" block that the model runs on every output.

Output as a single system prompt block, ready to paste.`},
  {name:"Model Adaptation (Claude / ChatGPT / Gemini)",tool:"multi",toolLabel:"Multi",cat:"System Prompt",em:"⚡",status:"tested",rating:4,tags:["Multi-model","Adaptation"],prompt:`Take the following prompt and optimize it for [TARGET MODEL]:

[ORIGINAL PROMPT]

Claude optimization: Add explicit constraints, use XML tags for structure, leverage extended context window, include self-verification step.

ChatGPT/GPT-4o optimization: Use persona framing, add "Let's think step by step" for reasoning tasks, leverage function calling format for structured output.

Gemini optimization: Include multimodal context if applicable, use Google-specific grounding syntax, leverage longer context for document tasks.

Output: Three versions of the prompt, one per model, with a diff summary of key changes.`},
  {name:"Code Review (Security Focus)",tool:"claude",toolLabel:"Claude",cat:"Development",em:"🛡",status:"goto",rating:5,tags:["AppSec","Code Review","Security"],prompt:`Review the following [Language] code with an AppSec lens.

Check for:
1. Input validation gaps
2. Authentication/authorization flaws
3. Injection vulnerabilities (SQL, XSS, command injection)
4. Secrets exposure (hardcoded keys, env vars in logs)
5. Race conditions
6. Error handling that leaks stack traces or system info
7. Dependency risks (known CVEs, outdated packages)

For each finding:
- Severity: Critical / High / Medium / Low
- Line reference
- Fix recommendation with code example
- OWASP category

End with: "No issues found" if clean, or a prioritized fix list ranked by exploitability.

Code: [PASTE CODE]`},
  {name:"Bug Report to Root Cause Analyzer",tool:"claude",toolLabel:"Claude",cat:"Development",em:"🔍",status:"goto",rating:5,tags:["Debugging","RCA","Incident"],prompt:`Analyze this bug report and identify the root cause.

1. CLASSIFICATION: UI / API / Database / Auth / Infrastructure / Third-party
2. SEVERITY: P0 (outage) / P1 (major feature broken) / P2 (degraded) / P3 (minor)
3. ROOT CAUSE HYPOTHESIS: Most likely cause based on evidence (ranked by confidence %)
4. INVESTIGATION STEPS: Exact commands/queries to confirm — not "check the logs" but "run: kubectl logs -f deployment/api --since=1h | grep ERROR"
5. FIX RECOMMENDATION: Specific code change or config fix
6. REGRESSION PREVENTION: Test to add to prevent recurrence

Bug description: [DESCRIPTION]
Stack trace: [STACK TRACE]
Environment: [ENV]
Steps to reproduce: [STEPS]`},
  {name:"Technical Architecture Decision Record",tool:"claude",toolLabel:"Claude",cat:"Development",em:"📐",status:"goto",rating:5,tags:["Architecture","ADR","Documentation"],prompt:`Create an Architecture Decision Record (ADR) for the following decision.

Context: [DESCRIBE THE PROBLEM AND CONSTRAINTS]
Decision: [WHAT WAS DECIDED]

Structure the ADR as:
## Status
[Proposed / Accepted / Deprecated / Superseded by ADR-XXX]

## Context
What is the issue motivating this decision? What forces are at play?

## Decision
What is the change being proposed or made?

## Consequences
Positive: What becomes easier?
Negative: What becomes harder or more expensive?
Risks: What could go wrong?

## Alternatives Considered
List 2–3 alternatives with one-line rejection reason each.

## Review Date
When should this be revisited?`},
  {name:"API Endpoint Documentation Generator",tool:"claude",toolLabel:"Claude",cat:"Development",em:"📡",status:"tested",rating:4,tags:["API","Documentation","OpenAPI"],prompt:`Generate API documentation for the following endpoint.

Include:
- Endpoint: [METHOD] [URL]
- Description (1 sentence)
- Authentication requirements
- Request headers
- Request body (JSON schema with types and required fields)
- Response body (success + error examples)
- Rate limits
- Example cURL command
- Common error codes with explanations

Format as clean markdown suitable for a docs site.

Endpoint details: [PASTE ENDPOINT DETAILS OR CODE]`},
  {name:"Database Schema Designer",tool:"claude",toolLabel:"Claude",cat:"Development",em:"🗄",status:"tested",rating:4,tags:["Database","Schema","Architecture"],prompt:`Design a production-ready database schema for [PROJECT DESCRIPTION].

Deliver:
1. Entity definitions with all fields (name, type, nullable, default, constraints)
2. Relationships with cardinality (1:1, 1:N, M:N)
3. Indexing strategy — which columns to index and why
4. RLS (Row Level Security) policies for multi-tenant isolation
5. SQL DDL for PostgreSQL (Supabase-compatible)
6. Prisma schema alternative

Constraints to apply:
- Never store PII in plain text
- Include created_at / updated_at on every table
- Use UUIDs not auto-increment IDs
- Add soft-delete (deleted_at) where appropriate

Requirements: [DESCRIBE WHAT NEEDS TO BE STORED]`},
  {name:"Replit Agent Project Scaffolder",tool:"replit",toolLabel:"Replit",cat:"Development",em:"🚀",status:"tested",rating:4,tags:["Scaffold","Replit","Setup"],prompt:`You are scaffolding a new project in Replit.

Project: [PROJECT TYPE]
Stack: [STACK — e.g. Next.js + Supabase + Stripe]
Features: [CORE FEATURES]

Generate:
1. File structure (tree format)
2. package.json with exact dependencies and versions
3. Entry point file with boilerplate and error handling
4. Environment variable template (.env.example with placeholder values only)
5. README.md with setup instructions
6. Health check endpoint

Rules:
- Use latest stable versions
- Include TypeScript config if applicable
- Add .gitignore
- Include basic error handling in entry point
- No placeholder comments — every file should be runnable`},
  {name:"Incident Post-Mortem Writer",tool:"claude",toolLabel:"Claude",cat:"Development",em:"📋",status:"tested",rating:4,tags:["Incident","Post-Mortem","SRE"],prompt:`Write a blameless post-mortem for the following incident.

Structure:
## Summary
One paragraph: what happened, impact, and resolution.

## Timeline
Chronological list of events with timestamps. Format: [HH:MM UTC] — event description

## Root Cause
The technical root cause — be specific. "Human error" is not a root cause.

## Contributing Factors
What conditions made this incident possible or worse?

## Impact
- Duration of incident
- Users/services affected
- Business impact

## Resolution
What fixed it?

## Action Items
Table: Action | Owner | Priority | Due Date

## What Went Well
What detection, response, or processes worked?

Incident details: [DESCRIBE WHAT HAPPENED]`},
  {name:"Full-Stack App Prompt Chain (16-Step)",tool:"claude",toolLabel:"Claude",cat:"Development",em:"⛓",status:"goto",rating:5,tags:["Cursor","Full-Stack","Chain"],prompt:`Phase 1A — Solution Architect:
You are a Senior Solution Architect. Analyze: [REQUIREMENTS]
Deliver: tech stack with justification, ASCII architecture diagram, database schema outline, API patterns, security checklist, deployment architecture.

Phase 1B — Tech Stack Validator:
Review the architecture from 1A. Score 1–10. Risk-assess each component. Flag compatibility issues. Suggest alternatives if score < 8.

Phase 2A — DevOps Bootstrap:
Create complete project structure, package.json, Docker config (dev + prod), GitHub Actions CI/CD, ESLint + Prettier configs.

Phase 2B — Backend Foundation:
Build Express.js server with JWT auth, rate limiting, error handling, input validation (Zod), security headers (helmet), health checks.

[Continue through Phases 3–8: Database → Auth → Frontend → API → Testing → Deployment]

Run each phase in sequence. Paste previous output into next prompt.`},
  {name:"Research → Analysis → Draft Pipeline",tool:"claude",toolLabel:"Claude",cat:"Development",em:"🔬",status:"goto",rating:5,tags:["Workflow","Research","Chain"],prompt:`3-prompt chain. Each prompt is explicitly blocked from doing the next step's job.

PROMPT 1 — RESEARCH ONLY:
Research [TOPIC]. Output ONLY raw findings: facts, data, quotes, sources.
Do NOT analyze, interpret, or recommend. Stop when you have raw material.

PROMPT 2 — ANALYSIS ONLY:
Given these research findings: [PASTE PROMPT 1 OUTPUT]
Identify patterns, contradictions, and implications.
Do NOT write or draft anything. Output ONLY analytical conclusions.

PROMPT 3 — DRAFT ONLY:
Given this analysis: [PASTE PROMPT 2 OUTPUT]
Write [FORMAT: article / report / email / proposal].
Use the analysis as your foundation. Do NOT add new research.

Result: Expert-level output without context drift between stages.`},
  {name:"Product Landing Page Copy Generator",tool:"claude",toolLabel:"Claude",cat:"Marketing",em:"📢",status:"goto",rating:5,tags:["Copywriting","Landing Page","Marketing"],prompt:`Write landing page copy for [Product Name] targeting [Target Audience].

Structure:
- Hero headline (max 8 words, benefit-driven, not clever)
- Subheadline (1 sentence expanding the hook)
- 3 core benefits (problem → solution format, not feature lists)
- Social proof block (testimonial format with specifics)
- FAQ section (5 questions: top objections)
- CTA section (action verb + benefit, not "Submit")

Rules:
- No jargon the audience doesn't use themselves
- Lead with pain, not product
- Every claim needs a reason to believe
- Use "you" not "our users"

Tone: [TONE — e.g. direct, professional, conversational]
Key benefits: [LIST BENEFITS]`},
  {name:"Email Sequence Writer (3-Part)",tool:"chatgpt",toolLabel:"ChatGPT",cat:"Marketing",em:"✉️",status:"tested",rating:4,tags:["Email","Sequence","Conversion"],prompt:`Write a 3-email sequence for [Product] targeting [Audience].

Email 1 (Day 0) — Hook + problem awareness:
Subject line A/B options. Lead with the problem, not the product.

Email 2 (Day 3) — Solution + social proof:
One clear CTA. Include a specific result or testimonial.

Email 3 (Day 7) — Urgency + objection handling:
Address the #1 reason they haven't bought. Final CTA.

Rules for all emails:
- Subject lines under 50 characters
- Body under 150 words per email
- Conversational tone — write like a person, not a brand
- Each email must work standalone
- Include preview text for each

Product details: [PRODUCT]
Audience: [AUDIENCE]
Main benefit: [BENEFIT]`},
  {name:"Social Media Content Calendar (7-Day)",tool:"chatgpt",toolLabel:"ChatGPT",cat:"Marketing",em:"📅",status:"tested",rating:4,tags:["Social Media","Content","Calendar"],prompt:`Create a 7-day content calendar for [Brand] across [Platforms].
Content pillars: [PILLARS]
Posting frequency: [FREQUENCY]

For each post:
- Day + Platform
- Content type (carousel, reel, text, story)
- Hook (first line — must stop the scroll)
- Full caption (under 100 words)
- Hashtags (5–8: mix broad and niche, no generic #instagood)
- CTA
- Visual direction (1 sentence describing image/video)

Format as a table. Include one engagement post per week (poll, question, or UGC prompt).

Constraint: No two posts on the same platform in the same format in the same week.`},
  {name:"Facebook/Instagram Ad Copy (3 Variants)",tool:"chatgpt",toolLabel:"ChatGPT",cat:"Marketing",em:"🎯",status:"tested",rating:4,tags:["Ads","Meta","Conversion"],prompt:`Write 3 Facebook/Instagram ad copy variants for [Product].

Variant A — Pain-led:
Hook on the problem. Use "If you..." framing. CTA: eliminate the pain.

Variant B — Social proof-led:
Open with a result or number. Use "Join X people who..." framing. CTA: get the same result.

Variant C — Curiosity-led:
Open with a counterintuitive claim or question. CTA: find out how.

For each variant:
- Primary text (125 chars for feed)
- Headline (40 chars max)
- Description (30 chars max)

Target audience: [AUDIENCE]
Product: [PRODUCT]
Main benefit: [BENEFIT]
Budget signal (premium vs accessible): [SIGNAL]`},
  {name:"SEO Blog Post Outliner",tool:"chatgpt",toolLabel:"ChatGPT",cat:"Marketing",em:"📝",status:"tested",rating:4,tags:["SEO","Blog","Content"],prompt:`Create an SEO-optimized blog post outline for the following topic.

Target keyword: [PRIMARY KEYWORD]
Secondary keywords: [3–5 SECONDARY KEYWORDS]
Target audience: [AUDIENCE]
Word count target: [LENGTH]

Deliver:
1. Title options (3 variants — include the primary keyword near the front)
2. Meta description (155 chars max, includes keyword)
3. H1 → H2 → H3 hierarchy outline
4. Featured snippet opportunity (answer a question directly in 40–60 words)
5. Internal link opportunities (suggest anchor text + page types)
6. CTA placement recommendations

Format: markdown outline, ready to write from.`},
  {name:"Content Repurposing Engine",tool:"claude",toolLabel:"Claude",cat:"Marketing",em:"♻️",status:"goto",rating:5,tags:["Repurposing","Multi-channel","Workflow"],prompt:`Transform [ORIGINAL CONTENT] into 6 platform-native formats.

Each format is blocked from doing another format's job:

1. TWITTER THREAD (10 tweets): Hook tweet + numbered insights + CTA tweet. Each tweet standalone.
2. LINKEDIN POST (1500 chars max): Professional framing, paragraph format, 3 line-break hooks.
3. EMAIL NEWSLETTER SECTION: Subject line + preview text + body (250 words) + CTA.
4. INSTAGRAM CAPTION: Short hook + value + hashtags (8–10 niche-specific).
5. YOUTUBE DESCRIPTION: Title suggestion + 150-word description + timestamps outline + tags.
6. SHORT-FORM SCRIPT (60 sec): Hook (0–3s) + problem (3–15s) + solution (15–50s) + CTA (50–60s).

Original content: [PASTE CONTENT]`},
  {name:"Weekly Newsletter Draft Generator",tool:"claude",toolLabel:"Claude",cat:"Marketing",em:"📰",status:"tested",rating:4,tags:["Newsletter","Email","Content"],prompt:`Draft a weekly newsletter edition for [Newsletter Name].

Audience: [WHO THEY ARE AND WHAT THEY CARE ABOUT]
This week's theme: [THEME]
Source material: [PASTE NOTES, LINKS, OR ROUGH IDEAS]

Structure:
1. Subject line (A/B options — one curiosity, one direct)
2. Preview text (50 chars)
3. Opener (2–3 sentences — personal, specific, not generic)
4. Main section: [THEME] — 300–400 words, teachable insight format
5. Quick hits (3 links + 1-sentence commentary each)

let activeTool = 'all';
let goToOnly = false;

function render(list) {
  const container = document.getElementById('rows');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  container.innerHTML = '';
  if (!list.length) {
    empty.style.display = 'block';
    count.textContent = '0 prompts';
    return;
  }
  empty.style.display = 'none';
  count.textContent = list.length + (list.length === 1 ? ' prompt' : ' prompts');
  list.forEach((p,i) => {
    const stars = Array.from({length:5}, (_,j) => `<span class="${j<p.rating?'':'e'}">★</span>`).join('');
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="row-name"><span class="em">${p.em}</span>${p.name}</span><span><span class="tag ${p.tool}">${p.toolLabel}</span></span><span style="font-size:12px;color:var(--text2)">${p.cat}</span><span class="stars">${stars}</span>`;
    row.onclick = () => openDetail(p);
    container.appendChild(row);
  });
}

function filter() {
  const q = document.getElementById('q').value.toLowerCase();
  const sort = document.getElementById('sort').value;
  let list = PROMPTS.filter(p => {
    const matchTool = activeTool === 'all' || p.tool === activeTool;
    const matchStatus = !goToOnly || p.status === 'goto';
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q) || p.toolLabel.toLowerCase().includes(q) || (p.tags && p.tags.some(t => t.toLowerCase().includes(q))) || p.prompt.toLowerCase().includes(q);
    return matchTool && matchStatus && matchQ;
  });
  list.sort((a,b) => {
    if (sort === 'name') return a.name.localeCompare(b.name);
    if (sort === 'rating') return b.rating - a.rating;
    if (sort === 'tool') return a.tool.localeCompare(b.tool);
    return a.cat.localeCompare(b.cat);
  });
  return list;
}

function doSearch() { render(filter()); }

function toggleChip(el) {
  if (el.dataset.f === 'all') {
    activeTool = 'all';
    document.querySelectorAll('#chips .chip:not(.goto)').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
  } else {
    document.querySelectorAll('#chips .chip.all').forEach(c => c.classList.remove('on'));
    const wasOn = el.classList.contains('on');
    document.querySelectorAll('#chips .chip:not(.all):not(.goto)').forEach(c => c.classList.remove('on'));
    if (wasOn) { activeTool = 'all'; document.querySelectorAll('#chips .chip.all').forEach(c => c.classList.add('on')); }
    else { el.classList.add('on'); activeTool = el.dataset.f; }
  }
  doSearch();
}

function toggleStatus(el) {
  goToOnly = !goToOnly;
  el.classList.toggle('on', goToOnly);
  doSearch();
}

function openDetail(p) {
  document.getElementById('d-title').textContent = p.em + ' ' + p.name;
  document.getElementById('d-meta').innerHTML = `<span class="tag ${p.tool}">${p.toolLabel}</span><span class="status ${p.status}">${p.status === 'goto' ? '⭐ Go-to' : 'Tested'}</span><span style="font-size:11px;color:var(--text3)">${p.cat}</span>`;
  document.getElementById('d-prompt').textContent = p.prompt;
  document.getElementById('copy-btn').textContent = 'Copy prompt';
  document.getElementById('copy-btn').classList.remove('copied');
  document.getElementById('detail').classList.add('open');
  document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closeDetail() { document.getElementById('detail').classList.remove('open'); }

function copyPrompt() {
  const text = document.getElementById('d-prompt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy prompt'; btn.classList.remove('copied'); }, 2000);
  });
}

doSearch();
</script>
