# Jules Autonomous Coding Agent Configuration
# https://jules.dev (verify actual URL)

version: "1.0"
updated: "2025-12-27"

# =============================================================================
# Authentication
# =============================================================================
auth:
  # Jules API key from https://jules.dev/settings/api-keys
  api_key: "${JULES_API_KEY}"
  
  # GitHub personal access token (for repo access)
  github_token: "${GITHUB_TOKEN}"
  
  # Plan tier (free, pro, ultra, enterprise)
  plan: "free"

# =============================================================================
# Project Configuration
# =============================================================================
project:
  # Project name (for organization)
  name: "my-project"
  
  # GitHub repository URL
  repository: "https://github.com/username/repo"
  
  # Default branch to work on
  default_branch: "main"
  
  # Working directory (relative to repo root)
  working_directory: "."
  
  # File patterns to include (glob)
  include_patterns:
    - "src/**/*.{ts,tsx,js,jsx}"
    - "tests/**/*.{test.ts,spec.ts}"
    - "*.{json,yaml,yml,md}"
  
  # File patterns to exclude (glob)
  exclude_patterns:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - ".git/**"
    - "*.lock"

# =============================================================================
# Model Configuration
# =============================================================================
model:
  # Primary model for code generation
  primary: "gemini-2.5-pro"
  
  # Fallback model if primary fails
  fallback: "gemini-3-flash"
  
  # Temperature (0.0-2.0, lower = more deterministic)
  temperature: 0.7
  
  # Max tokens per response
  max_tokens: 4096

# =============================================================================
# Task Settings
# =============================================================================
tasks:
  # Max concurrent tasks
  max_concurrent: 3
  
  # Task timeout in minutes
  timeout_minutes: 60
  
  # Auto-create PR after task completion
  auto_create_pr: true
  
  # PR title template
  pr_title_template: "[Jules] {task_summary}"
  
  # PR body template
  pr_body_template: |
    ## Task
    {task_description}
    
    ## Changes
    {changes_summary}
    
    ## Testing
    {test_results}
    
    ---
    Generated by Jules
  
  # Require human review before merging
  require_review: true
  
  # Auto-assign reviewers
  auto_assign_reviewers:
    - "username1"
    - "username2"

# =============================================================================
# Coding Standards
# =============================================================================
coding_standards:
  # Programming language
  language: "typescript"
  
  # Style guide (eslint, prettier, etc.)
  style_guide: "airbnb"
  
  # Linter configuration file
  linter_config: ".eslintrc.json"
  
  # Formatter configuration file
  formatter_config: ".prettierrc"
  
  # Run linter before committing
  run_linter: true
  
  # Run formatter before committing
  run_formatter: true
  
  # Fix linter errors automatically
  auto_fix_lint_errors: true

# =============================================================================
# Testing Configuration
# =============================================================================
testing:
  # Testing framework (jest, vitest, mocha, pytest, etc.)
  framework: "jest"
  
  # Test command
  test_command: "npm test"
  
  # Run tests before creating PR
  run_tests_before_pr: true
  
  # Require tests to pass
  require_passing_tests: true
  
  # Auto-generate tests for new code
  auto_generate_tests: true
  
  # Test coverage threshold (0-100)
  coverage_threshold: 80

# =============================================================================
# Code Review Settings
# =============================================================================
code_review:
  # Enable Jules code review mode
  enabled: true
  
  # Review checklist
  checklist:
    - "Code follows style guide"
    - "Tests are included and passing"
    - "No security vulnerabilities"
    - "Performance considerations addressed"
    - "Documentation updated"
  
  # Auto-comment on PRs
  auto_comment: true
  
  # Severity levels to flag (low, medium, high, critical)
  flag_severity:
    - "high"
    - "critical"

# =============================================================================
# Safety & Security
# =============================================================================
safety:
  # Sandboxed execution (always true, cannot be disabled)
  sandboxed: true
  
  # Block destructive operations
  block_destructive_ops: true
  
  # Operations to block
  blocked_operations:
    - "rm -rf"
    - "DROP DATABASE"
    - "ALTER TABLE"
    - "DELETE FROM"
  
  # Require approval for sensitive changes
  require_approval_for:
    - "package.json"
    - ".env"
    - "tsconfig.json"
    - "database/**"
  
  # Scan for secrets before committing
  scan_for_secrets: true
  
  # Scan for security vulnerabilities
  scan_for_vulnerabilities: true

# =============================================================================
# Workflow Customization
# =============================================================================
workflow:
  # Custom workflows (ordered list)
  steps:
    - name: "Analyze task"
      enabled: true
    - name: "Plan changes"
      enabled: true
    - name: "Generate code"
      enabled: true
    - name: "Run tests"
      enabled: true
    - name: "Run linter"
      enabled: true
    - name: "Create PR"
      enabled: true
  
  # Custom prompts for Jules
  prompts:
    task_analysis: |
      Analyze this task and break it down into subtasks.
      Consider dependencies, edge cases, and testing requirements.
    
    code_generation: |
      Generate production-ready code following these standards:
      - TypeScript with strict mode
      - Comprehensive error handling
      - Unit tests included
      - JSDoc comments for public APIs

# =============================================================================
# Notifications
# =============================================================================
notifications:
  # Enable notifications
  enabled: true
  
  # Notification channels
  channels:
    # Slack webhook
    slack:
      enabled: false
      webhook_url: "${SLACK_WEBHOOK_URL}"
      notify_on:
        - "task_started"
        - "task_completed"
        - "task_failed"
        - "pr_created"
    
    # Email notifications
    email:
      enabled: true
      recipients:
        - "dev@example.com"
      notify_on:
        - "task_failed"
        - "pr_created"
    
    # GitHub comments
    github:
      enabled: true
      notify_on:
        - "task_completed"
        - "pr_created"

# =============================================================================
# Logging & Telemetry
# =============================================================================
logging:
  # Log level (DEBUG, INFO, WARN, ERROR)
  level: "INFO"
  
  # Log to file
  log_to_file: true
  log_file_path: "./jules.log"
  
  # Log rotation
  max_log_size_mb: 10
  max_log_files: 5
  
  # Send telemetry to Jules
  telemetry_enabled: true

# =============================================================================
# Rate Limits (Per Plan)
# =============================================================================
rate_limits:
  free:
    tasks_per_day: 15
    concurrent_tasks: 1
  pro:
    tasks_per_day: 100
    concurrent_tasks: 3
  ultra:
    tasks_per_day: 500
    concurrent_tasks: 5
  enterprise:
    tasks_per_day: null  # unlimited
    concurrent_tasks: 10

# =============================================================================
# Team Settings (Enterprise Only)
# =============================================================================
team:
  # Team name
  name: "Engineering Team"
  
  # Team members (emails)
  members:
    - "dev1@example.com"
    - "dev2@example.com"
  
  # Shared task queue
  shared_queue: true
  
  # Task assignment strategy (round_robin, load_balanced, manual)
  assignment_strategy: "load_balanced"

# =============================================================================
# Advanced Features
# =============================================================================
advanced:
  # Codebase analysis depth (shallow, medium, deep)
  analysis_depth: "medium"
  
  # Enable multi-repo support
  multi_repo_enabled: false
  
  # Custom model fine-tuning (enterprise only)
  custom_model_enabled: false
  
  # Integration with external tools
  integrations:
    linear:
      enabled: false
      api_key: "${LINEAR_API_KEY}"
    
    jira:
      enabled: false
      api_key: "${JIRA_API_KEY}"
      project_key: "PROJ"
