<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">FlashFusion — Universal App Generator</text>
  <text x="600" y="65" text-anchor="middle" font-size="14" fill="#7f8c8d">Templates → AI Orchestration → Real-time Deployment</text>
  
  <!-- Input Layer -->
  <rect x="50" y="120" width="150" height="80" rx="12" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
  <text x="125" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Template</text>
  <text x="125" y="160" text-anchor="middle" font-size="12" fill="#2c3e50">Selection</text>
  <text x="125" y="180" text-anchor="middle" font-size="10" fill="#7f8c8d">React/Next/Vue</text>
  
  <rect x="50" y="220" width="150" height="80" rx="12" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
  <text x="125" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Brand Kit</text>
  <text x="125" y="260" text-anchor="middle" font-size="12" fill="#2c3e50">Upload</text>
  <text x="125" y="280" text-anchor="middle" font-size="10" fill="#7f8c8d">Assets + Style</text>
  
  <!-- AI Orchestration Core -->
  <rect x="350" y="150" width="200" height="120" rx="12" fill="#f8e8e8" stroke="#e74c3c" stroke-width="2"/>
  <text x="450" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">AI Orchestration Engine</text>
  <text x="450" y="195" text-anchor="middle" font-size="11" fill="#7f8c8d">LangChain/LangFlow</text>
  
  <!-- Multi-Role Agents -->
  <rect x="370" y="210" width="70" height="25" rx="6" fill="#fff2e6" stroke="#f39c12"/>
  <text x="405" y="225" text-anchor="middle" font-size="9" fill="#2c3e50">Agent K</text>
  
  <rect x="450" y="210" width="70" height="25" rx="6" fill="#fff2e6" stroke="#f39c12"/>
  <text x="485" y="225" text-anchor="middle" font-size="9" fill="#2c3e50">Tessa</text>
  
  <rect x="370" y="240" width="80" height="25" rx="6" fill="#fff2e6" stroke="#f39c12"/>
  <text x="410" y="255" text-anchor="middle" font-size="9" fill="#2c3e50">Security Guard</text>
  
  <rect x="460" y="240" width="80" height="25" rx="6" fill="#fff2e6" stroke="#f39c12"/>
  <text x="500" y="255" text-anchor="middle" font-size="9" fill="#2c3e50">Influencer Orch</text>
  
  <!-- Validator Suite Integration -->
  <rect x="350" y="320" width="200" height="60" rx="12" fill="#f0f8e8" stroke="#27ae60" stroke-width="2"/>
  <text x="450" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Validator Suite</text>
  <text x="450" y="355" text-anchor="middle" font-size="11" fill="#7f8c8d">Supabase + GPT/Claude</text>
  <text x="450" y="370" text-anchor="middle" font-size="10" fill="#27ae60">Real-time Validation</text>
  
  <!-- Output Layer -->
  <rect x="700" y="100" width="120" height="60" rx="12" fill="#f4e8f8" stroke="#9b59b6" stroke-width="2"/>
  <text x="760" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Web App</text>
  <text x="760" y="135" text-anchor="middle" font-size="10" fill="#7f8c8d">Next.js/React</text>
  <text x="760" y="150" text-anchor="middle" font-size="10" fill="#9b59b6">Vercel Deploy</text>
  
  <rect x="850" y="100" width="120" height="60" rx="12" fill="#f4e8f8" stroke="#9b59b6" stroke-width="2"/>
  <text x="910" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Mobile App</text>
  <text x="910" y="135" text-anchor="middle" font-size="10" fill="#7f8c8d">React Native</text>
  <text x="910" y="150" text-anchor="middle" font-size="10" fill="#9b59b6">Expo Deploy</text>
  
  <rect x="700" y="180" width="120" height="60" rx="12" fill="#f4e8f8" stroke="#9b59b6" stroke-width="2"/>
  <text x="760" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Desktop App</text>
  <text x="760" y="215" text-anchor="middle" font-size="10" fill="#7f8c8d">Electron/Tauri</text>
  <text x="760" y="230" text-anchor="middle" font-size="10" fill="#9b59b6">Cross Platform</text>
  
  <rect x="850" y="180" width="120" height="60" rx="12" fill="#f4e8f8" stroke="#9b59b6" stroke-width="2"/>
  <text x="910" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">PWA</text>
  <text x="910" y="215" text-anchor="middle" font-size="10" fill="#7f8c8d">Progressive Web</text>
  <text x="910" y="230" text-anchor="middle" font-size="10" fill="#9b59b6">Offline-First</text>
  
  <!-- Deployment Pipeline -->
  <rect x="700" y="300" width="270" height="80" rx="12" fill="#e8f8f0" stroke="#1abc9c" stroke-width="2"/>
  <text x="835" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Real-time Deployment Pipeline</text>
  <text x="835" y="345" text-anchor="middle" font-size="11" fill="#7f8c8d">GitHub Actions + Docker</text>
  <text x="835" y="360" text-anchor="middle" font-size="10" fill="#1abc9c">Auto-scaling + Monitoring</text>
  
  <!-- Tech Stack Box -->
  <rect x="50" y="450" width="300" height="120" rx="8" fill="#f9f9f9" stroke="#bdc3c7" stroke-dasharray="5,5"/>
  <text x="60" y="470" font-size="12" font-weight="bold" fill="#2c3e50">Tech Stack</text>
  <text x="60" y="490" font-size="10" fill="#7f8c8d">• Frontend: React, Next.js, TypeScript, Tailwind</text>
  <text x="60" y="505" font-size="10" fill="#7f8c8d">• Backend: Node.js, Supabase, PostgreSQL</text>
  <text x="60" y="520" font-size="10" fill="#7f8c8d">• AI: LangChain, OpenAI GPT, Claude API</text>
  <text x="60" y="535" font-size="10" fill="#7f8c8d">• Deploy: Vercel, GitHub Actions, Docker</text>
  <text x="60" y="550" font-size="10" fill="#7f8c8d">• Mobile: React Native, Expo</text>
  
  <!-- Arrows -->
  <line x1="200" y1="160" x2="350" y2="180" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="275" y="165" font-size="10" fill="#3498db">templates</text>
  
  <line x1="200" y1="260" x2="350" y2="240" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="275" y="255" font-size="10" fill="#3498db">brand assets</text>
  
  <line x1="450" y1="270" x2="450" y2="320" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="295" font-size="10" fill="#e74c3c">validate</text>
  
  <line x1="550" y1="190" x2="700" y2="130" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="625" y="150" font-size="10" fill="#9b59b6">web build</text>
  
  <line x1="550" y1="200" x2="850" y2="130" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="700" y="155" font-size="10" fill="#9b59b6">mobile build</text>
  
  <line x1="550" y1="220" x2="700" y2="210" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="625" y="225" font-size="10" fill="#9b59b6">desktop</text>
  
  <line x1="550" y1="230" x2="850" y2="210" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="700" y="235" font-size="10" fill="#9b59b6">pwa</text>
  
  <line x1="835" y1="260" x2="835" y2="300" stroke="#1abc9c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="845" y="280" font-size="10" fill="#1abc9c">deploy</text>
</svg>