# [G] otel-collector-config.yaml
# Assumption: App sends OTLP traces/metrics/logs via gRPC :4317 and HTTP :4318
# Assumption: Loki log format is logfmt or JSON with resource attributes
# Assumption: Tempo accepts OTLP over gRPC on internal port 4317

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - action: insert
        key: service.environment
        value: local

exporters:
  # Metrics → Prometheus (pull-based via scrape)
  prometheus:
    endpoint: "0.0.0.0:9464"
    namespace: ai_orchestration

  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Logs → Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    labels:
      resource:
        service.name: "service_name"
        service.version: "service_version"
      attributes:
        level: "level"

  # Debug output — disable in production
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:8889
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [loki, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
