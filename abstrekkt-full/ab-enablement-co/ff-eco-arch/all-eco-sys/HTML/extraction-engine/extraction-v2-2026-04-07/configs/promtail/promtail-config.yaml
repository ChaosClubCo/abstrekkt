# [G] promtail/promtail-config.yaml
# Assumption: Runs on Docker host, reads container logs and /var/log
# Assumption: Structured JSON logs from application containers

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log

  # Docker container logs
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: logstream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Attempt JSON parsing for structured logs
      - json:
          expressions:
            level: level
            msg: msg
            ts: ts
      - labels:
          level:
      # Drop debug logs in production — remove if debug needed
      - drop:
          source: level
          value: debug
          drop_counter_reason: debug_dropped
