# [G] prometheus/prometheus.yml
# Assumption: AI Orchestration Platform exposes /metrics on port 8080
# Assumption: Node exporter not deployed — extend scrape_configs if needed
# Assumption: Alert rules live in /etc/prometheus/alerts/*.yml

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    environment: 'local'
    platform: 'ai-orchestration'

rule_files:
  - '/etc/prometheus/alerts/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana self-monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # OpenTelemetry Collector — exposes Prometheus metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets:
          - 'otel-collector:8888'   # OTel internal metrics
          - 'otel-collector:9464'   # Prometheus exporter from OTel

  # AI Orchestration Platform application
  # NEEDS_HUMAN_DECISION: replace host/port with actual app service name
  - job_name: 'ai-orchestration-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Loki self-monitoring
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Tempo self-monitoring
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
