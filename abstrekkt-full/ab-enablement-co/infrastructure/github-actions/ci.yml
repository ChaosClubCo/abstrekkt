name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_export.py
      - run: cd frontend && npm ci && npm run typecheck && npm test
      - run: cd backend && npm ci && npm run typecheck && npm test
