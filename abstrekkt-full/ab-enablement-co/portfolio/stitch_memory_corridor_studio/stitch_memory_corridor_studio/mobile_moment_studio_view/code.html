<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Moment Studio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&amp;family=Literata:wght@400&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffe2ab",
                        "surface-bright": "#39393b",
                        "on-secondary-container": "#ebf0ff",
                        "surface": "#131315",
                        "outline": "#9c8f78",
                        "tertiary-container": "#c9cac5",
                        "tertiary-fixed": "#e3e3de",
                        "tertiary": "#e6e6e1",
                        "on-tertiary-container": "#535551",
                        "outline-variant": "#504532",
                        "secondary-fixed": "#d6e3ff",
                        "primary-container": "#ffbf00",
                        "surface-variant": "#353437",
                        "on-primary": "#402d00",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#5c4300",
                        "secondary-fixed-dim": "#a9c7ff",
                        "surface-container-lowest": "#0e0e10",
                        "on-surface": "#e5e1e4",
                        "inverse-on-surface": "#313032",
                        "on-tertiary-fixed-variant": "#454744",
                        "surface-dim": "#131315",
                        "on-surface-variant": "#d4c5ab",
                        "primary-fixed": "#ffdfa0",
                        "on-background": "#e5e1e4",
                        "secondary": "#a9c7ff",
                        "primary-fixed-dim": "#fbbc00",
                        "error": "#ffb4ab",
                        "on-secondary": "#003064",
                        "surface-container-highest": "#353437",
                        "on-primary-container": "#6d5000",
                        "on-secondary-fixed-variant": "#00468c",
                        "error-container": "#93000a",
                        "inverse-surface": "#e5e1e4",
                        "surface-container-low": "#1c1b1d",
                        "on-tertiary": "#2f312e",
                        "background": "#131315",
                        "on-primary-fixed": "#261a00",
                        "inverse-primary": "#795900",
                        "surface-tint": "#fbbc00",
                        "on-secondary-fixed": "#001b3e",
                        "surface-container-high": "#2a2a2c",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#1a1c19",
                        "tertiary-fixed-dim": "#c6c7c2",
                        "surface-container": "#201f21",
                        "secondary-container": "#026bd2"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit": "8px",
                        "container-padding": "20px",
                        "window-frame-thickness": "4px",
                        "gutter": "24px"
                    },
                    fontFamily: {
                        "label-caps": ["EB Garamond", "serif"],
                        "body-lg": ["Literata", "serif"],
                        "headline-md": ["EB Garamond", "serif"],
                        "body-md": ["Literata", "serif"],
                        "technical-sm": ["JetBrains Mono", "monospace"],
                        "display-lg-mobile": ["EB Garamond", "serif"],
                        "display-lg": ["EB Garamond", "serif"]
                    },
                    fontSize: {
                        "label-caps": ["12px", { lineHeight: "1.0", letterSpacing: "0.1em", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "1.4", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "technical-sm": ["12px", { lineHeight: "1.5", letterSpacing: "-0.01em", fontWeight: "400" }],
                        "display-lg-mobile": ["32px", { lineHeight: "1.2", fontWeight: "500" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "500" }]
                    }
                }
            }
        };
    </script>
<style>
        body {
            background-color: theme('colors.surface-container-lowest');
            color: theme('colors.on-surface');
            min-height: 100vh;
        }
        .wood-frame {
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), inset 0 0 2px rgba(255,255,255,0.1);
            background: linear-gradient(135deg, rgba(20,20,20,1) 0%, rgba(10,10,10,1) 100%);
        }
        .glass-card {
            background: rgba(35, 34, 37, 0.4);
            backdrop-filter: blur(12px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .ghost-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }
        .ghost-input:focus {
            outline: none;
            border-bottom-color: theme('colors.tertiary');
        }
        .smudge-grain {
            position: relative;
        }
        .smudge-grain::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        .blueprint-accent {
            color: theme('colors.secondary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="wood-frame p-window-frame-thickness antialiased overflow-x-hidden">
<!-- TopAppBar Mobile -->
<header class="fixed top-0 w-full z-50 bg-gradient-to-b from-surface/90 to-transparent backdrop-blur-sm flex justify-between items-center px-container-padding py-unit">
<div class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tighter uppercase">Moment Studio</div>
<button class="text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<main class="mt-20 mb-32 px-container-padding flex flex-col gap-gutter">
<!-- Input Section -->
<section class="glass-card rounded-lg p-4 smudge-grain">
<label class="block font-technical-sm text-technical-sm text-on-surface-variant mb-2" for="moment-draft">Drafting Memory...</label>
<textarea class="ghost-input w-full font-body-lg text-body-lg text-on-surface resize-none" id="moment-draft" placeholder="Record the event..." rows="6"></textarea>
</section>
<!-- AI Generated Fields (Cards) -->
<section class="flex flex-col gap-unit">
<h2 class="font-label-caps text-label-caps text-outline uppercase tracking-widest mb-2">Extracted Metadata</h2>
<div class="glass-card rounded p-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm">fingerprint</span>
<span class="font-technical-sm text-technical-sm text-on-surface">Identity</span>
</div>
<span class="font-technical-sm text-technical-sm blueprint-accent">Resolved</span>
</div>
<div class="glass-card rounded p-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container text-sm">auto_awesome</span>
<span class="font-technical-sm text-technical-sm text-on-surface">Virtues</span>
</div>
<span class="font-technical-sm text-technical-sm text-on-surface-variant">Pending Analysis...</span>
</div>
<div class="glass-card rounded p-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-error text-sm">brightness_3</span>
<span class="font-technical-sm text-technical-sm text-on-surface">Villains</span>
</div>
<span class="font-technical-sm text-technical-sm text-on-surface-variant">Scanning...</span>
</div>
</section>
<!-- Live Preview -->
<section class="mt-4">
<h2 class="font-label-caps text-label-caps text-outline uppercase tracking-widest mb-2">Preview</h2>
<div class="bg-surface-container-highest rounded-lg p-6 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-dim opacity-80"></div>
<div class="relative z-10 flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full border border-outline-variant mb-4 flex items-center justify-center bg-surface">
<span class="material-symbols-outlined text-outline text-2xl">image</span>
</div>
<h3 class="font-headline-md text-headline-md text-primary mb-2">A Fragment in Time</h3>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-3">The record begins here, awaiting the full context of the memory to crystallize into definitive prose.</p>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Actions -->
<footer class="fixed bottom-0 left-0 w-full z-40 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest to-transparent pb-6 pt-10 px-container-padding flex justify-between items-center">
<button class="font-technical-sm text-technical-sm text-on-surface-variant hover:text-on-surface transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-sm">history</span>
            Revert
        </button>
<button class="bg-primary-container text-on-primary-container font-label-caps text-label-caps px-6 py-3 rounded hover:bg-primary transition-colors flex items-center gap-2">
            Publish Moment
            <span class="material-symbols-outlined text-sm">send</span>
</button>
</footer>
</body></html>
