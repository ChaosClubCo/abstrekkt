<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            overflow: hidden; /* Prevent scrolling for immersive parallax */
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        /* Blueprint Style Background Overlay */
        .blueprint-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(169, 199, 255, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(169, 199, 255, 0.1) 1px, transparent 1px);
            pointer-events: none;
        }

        /* Perspective Container */
        .perspective-container {
            perspective: 1000px;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Parallax Layers Wrapper */
        .parallax-wrapper {
            position: relative;
            width: calc(100% - theme('spacing.window-frame-thickness') * 2);
            height: calc(100% - theme('spacing.window-frame-thickness') * 2);
            /* Simulating the window frame inner shadow/bevel */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), inset 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden;
            border-radius: theme('borderRadius.DEFAULT');
        }
        
        /* Mobile adjustment for frame */
        @media (max-width: 768px) {
             .parallax-wrapper {
                width: calc(100% - 8px);
                height: calc(100% - 8px);
             }
        }

        .layer {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        /* Blinds Pattern Overlay */
        .blinds-overlay {
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 20px,
                rgba(0, 0, 0, 0.4) 20px,
                rgba(0, 0, 0, 0.4) 22px
            );
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        .glass-panel {
            background: rgba(32, 31, 33, 0.6); /* surface-container */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(229, 225, 228, 0.1); /* on-surface at 10% */
        }
    </style>

<!-- Lightweight Parallax Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const scene = document.getElementById('scene');
            const layers = document.querySelectorAll('.layer');
            const card = document.getElementById('glass-card');

            // Only apply mouse parallax on non-touch devices
            if (window.matchMedia("(pointer: fine)").matches) {
                document.addEventListener('mousemove', (e) => {
                    const x = (e.clientX - window.innerWidth / 2);
                    const y = (e.clientY - window.innerHeight / 2);

                    layers.forEach(layer => {
                        const depth = parseFloat(layer.getAttribute('data-depth'));
                        const moveX = (x * depth * -0.05);
                        const moveY = (y * depth * -0.05);
                        layer.style.transform = `translate(${moveX}px, ${moveY}px)`;
                    });

                    // Subtle tilt on the glass card
                    if(card) {
                         const tiltX = (y / window.innerHeight) * 10;
                         const tiltY = -(x / window.innerWidth) * 10;
                         card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
                    }
                });
            }
        });
    </script>
