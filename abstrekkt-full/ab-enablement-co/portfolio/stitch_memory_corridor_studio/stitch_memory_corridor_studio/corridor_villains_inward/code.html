<style>
        body {

            color: theme('colors.on-surface');

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        .desaturated-scene {
            filter: grayscale(80%) contrast(1.1) brightness(0.8);
            transition: filter 1s ease-in-out;
        }

        .desaturated-scene:hover {
            filter: grayscale(60%) contrast(1.15) brightness(0.9);
        }

        /* Ambient subtle pulse for the play button */
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 191, 0, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(255, 191, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 191, 0, 0); }
        }

            animation: subtlePulse 3s infinite;
