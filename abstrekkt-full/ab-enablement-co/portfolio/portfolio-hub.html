*{box-sizing:border-box;margin:0;padding:0}
:root{

body{background:var(--bg);color:var(--t);font-family:'Outfit',sans-serif;min-height:100vh;font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.mono{font-family:'JetBrains Mono',monospace}
.btn{cursor:pointer;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;padding:6px 14px;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--a);color:#fff}
.btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--b2)}
.btn-ghost:hover{color:var(--t);border-color:var(--t2)}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:#238636;color:#fff}
.btn-sm{padding:3px 9px;font-size:11px}
.inp{background:var(--s);border:1px solid var(--b2);border-radius:6px;color:var(--t);font-family:inherit;font-size:12px;padding:7px 10px;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--a)}select.inp{cursor:pointer}
.inp-sm{padding:4px 8px;font-size:12px}
textarea.inp{resize:vertical;min-height:70px}
.card{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:16px}
.kcard{background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:10px;cursor:pointer;transition:all .15s;user-select:none}
.kcard:hover{border-color:var(--b2);background:#1c2128}
.kcard.dragging{opacity:.3;transform:rotate(1deg)}
.drop-target{background:#1c2128!important;border-color:var(--blue)!important;border-style:dashed!important}
.pbar{height:4px;background:var(--s3);border-radius:2px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .5s}
.sl{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--s2);border:1px solid var(--b2);border-radius:12px;padding:24px;width:640px;max-width:100%;max-height:90vh;overflow-y:auto}
.fade{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.tpill{padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
</style>

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fmt=(m)=>m>=60?`${Math.floor(m/60)}h${m%60?` ${m%60}m`:""}`:m>0?`${m}m`:"—";
const isOverdue=(d)=>d&&new Date(d)<new Date();
const totalTime=(c)=>(c.timeLog||[]).reduce((s,e)=>s+e.duration,0);
const calcHealth=(p)=>{
  const days=p.lastActivity?Math.floor((Date.now()-new Date(p.lastActivity))/86400000):999;
  let s=100;
  if(days>180)s-=40;else if(days>90)s-=25;else if(days>30)s-=10;
  s-=((p.techDebt||3)-1)*8;
  if(p.status==="Blocked")s-=20;
  if(p.status==="Archived"||p.status==="Sunset")s-=30;
  s+=((p.businessValue||3)-3)*5;
  s+=Object.values(p.auditChecks||{}).filter(Boolean).length*2;
  return Math.max(0,Math.min(100,Math.round(s)));
};
const hc=(h)=>h>=75?"#3fb950":h>=50?"#d29922":h>=30?"#f0883e":"#da3633";
const hl=(h)=>h>=75?"Healthy":h>=50?"Fair":h>=30?"At Risk":"Critical";
const repoUrl=(r)=>r?(r.startsWith("http")?r:`https://github.com/${r}`):null;

// ─── SHARED UI COMPONENTS ─────────────────────────────────────────────────────
const Lbl=({text})=>{const c=LC[text]||"#8b949e";return <span className="tag" style={{background:c+"22",color:c,border:`1px solid ${c}44`}}>{text}</span>;};
const Ava=({name,size=22})=>{const c=["#388bfd","#3fb950","#d29922","#f0883e","#8b5cf6"][name?.charCodeAt(0)%5||0];return <div style={{width:size,height:size,borderRadius:"50%",background:c+"33",border:`1px solid ${c}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.45,fontWeight:700,color:c,flexShrink:0,fontFamily:"'JetBrains Mono'"}}>{name?.[0]?.toUpperCase()||"?"}</div>;};
const HBar=({score})=><div style={{display:"flex",alignItems:"center",gap:8}}><div className="pbar" style={{flex:1}}><div className="pfill" style={{width:`${score}%`,background:hc(score)}}/></div><span className="mono" style={{fontSize:11,color:hc(score),minWidth:24,textAlign:"right"}}>{score}</span></div>;
const SBadge=({status})=>{const c={Active:"#3fb950",Planning:"#388bfd",Blocked:"#da3633",Archived:"#484f58",Sunset:"#8b949e"}[status]||"#8b949e";return <span className="badge" style={{background:c+"22",color:c,border:`1px solid ${c}44`}}>{status}</span>;};

// ─── TODAY VIEW ──────────────────────────────────────────────────────────────

  const blocked=cards.filter(c=>c.laneId==="blocked");
  const pAlerts=projects.map(p=>({...p,health:calcHealth(p)})).filter(p=>p.health<50).sort((a,b)=>a.health-b.health);
  const laneColor=(lId)=>lanes.find(l=>l.id===lId)?.color||"#484f58";

        {card.dueDate&&<span style={{fontSize:10,fontFamily:"'JetBrains Mono'",color:isOverdue(card.dueDate)?"var(--red)":"var(--t3)"}}>{isOverdue(card.dueDate)?"⚠ ":""}{card.dueDate}</span>}

  );

    <div style={{flex:1,overflow:"auto",padding:20}}>

        <div>
          <div style={{fontSize:22,fontWeight:700,color:"var(--t)"}}>Today</div>
          <div className="mono" style={{fontSize:11,color:"var(--t3)"}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
        </div>
        {activeTimer&&(
          <div style={{marginLeft:"auto",background:"#0c2a0c",border:"1px solid var(--green)",borderRadius:8,padding:"8px 14px",display:"flex",alignItems:"center",gap:8}}>
            <span style={{color:"var(--green)",fontFamily:"'JetBrains Mono'",fontWeight:700}}>● {timerDisplay}</span>
            <button className="btn btn-danger btn-sm" onClick={()=>stopTimer(activeTimer.cardId)}>Stop</button>
          </div>
        )}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
        {[{label:"Overdue",val:overdue.length,c:"var(--red)"},{label:"Due Today",val:dueToday.length,c:"var(--yellow)"},{label:"Blocked",val:blocked.length,c:"var(--orange)"},{label:"Portfolio Alerts",val:pAlerts.length,c:pAlerts.length>0?"var(--red)":"var(--green)"}].map(s=>(
          <div key={s.label} className="card" style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div className="sl" style={{marginBottom:0}}>{s.label}</div>
            <div className="mono" style={{fontSize:22,fontWeight:700,color:s.c}}>{s.val}</div>
          </div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <div>
          {overdue.length>0&&<><div className="sl">⚠ Overdue ({overdue.length})</div>{overdue.map(c=><FCard key={c.id} card={c}/>)}</>}
          {dueToday.length>0&&<><div className="sl" style={{marginTop:overdue.length?12:0}}>📅 Due Today ({dueToday.length})</div>{dueToday.map(c=><FCard key={c.id} card={c}/>)}</>}
          {blocked.length>0&&<><div className="sl" style={{marginTop:12}}>⛔ Blocked ({blocked.length})</div>{blocked.map(c=><FCard key={c.id} card={c}/>)}</>}

            </div>
          ))}</>}
        </div>
      </div>
    </div>
  );
}

// ─── KANBAN CARD ITEM ────────────────────────────────────────────────────────
function CardItem({card,members,onClick,onDragStart,onDragEnd,activeTimer,isDragging}){
  const tt=totalTime(card),done=card.subtasks?.filter(s=>s.done).length||0,tot=card.subtasks?.length||0;
  const isActive=activeTimer?.cardId===card.id,od=isOverdue(card.dueDate),rUrl=repoUrl(card.repo);
  return (
    <div className={`kcard${isDragging?" dragging":""}`} style={{borderLeft:`3px solid ${PC[card.priority]}`,marginBottom:6}} draggable
      onClick={()=>onClick(card)} onDragStart={e=>{e.dataTransfer.effectAllowed="move";onDragStart(card.id);}} onDragEnd={onDragEnd}>
      <div style={{fontSize:12,fontWeight:500,color:"var(--t)",lineHeight:1.4,marginBottom:5}}>{card.title}</div>
      {card.labels?.length>0&&<div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:5}}>{card.labels.map(l=><Lbl key={l} text={l}/>)}</div>}

        {tot>0&&<span style={{fontSize:10,color:done===tot?"var(--green)":"var(--t3)",fontFamily:"'JetBrains Mono'"}}>{done}/{tot}</span>}
        {tt>0&&<span style={{fontSize:10,color:"var(--teal)",fontFamily:"'JetBrains Mono'"}}>⏱{fmt(tt)}</span>}
        {isActive&&<span style={{fontSize:10,color:"var(--green)",fontFamily:"'JetBrains Mono'"}}>●REC</span>}
        {rUrl&&<span onClick={e=>{e.stopPropagation();window.open(rUrl,"_blank");}} style={{fontSize:10,color:"var(--t3)",cursor:"pointer",marginLeft:"auto"}} title={card.repo}>↗</span>}
        {!rUrl&&card.storyPoints&&<span style={{fontSize:10,color:"var(--t3)",marginLeft:"auto",fontFamily:"'JetBrains Mono'"}}>{card.storyPoints}pt</span>}
        {rUrl&&card.storyPoints&&<span style={{fontSize:10,color:"var(--t3)",fontFamily:"'JetBrains Mono'"}}>{card.storyPoints}pt</span>}
      </div>
    </div>
  );
}

            <div style={{flex:1,overflowY:"auto",padding:8,background:"var(--s)",border:`1px solid ${isTarget?"var(--blue)":over?"var(--red)":"var(--b)"}`,borderTop:"none",borderRadius:"0 0 8px 8px",minHeight:120,transition:"border-color .1s"}}
              onDragOver={e=>{e.preventDefault();setDragOverLane(lane.id);}} onDrop={()=>drop(lane.id)} onDragLeave={()=>setDragOverLane(null)}>
              {lCards.map(c=><CardItem key={c.id} card={c} members={members} onClick={onCardClick} activeTimer={activeTimer} isDragging={dragCardId===c.id} onDragStart={id=>setDragCardId(id)} onDragEnd={()=>{setDragCardId(null);setDragOverLane(null);}}/>)}

            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <input className="inp" placeholder="Add subtask..." value={newSub} onChange={e=>setNewSub(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSub()}/>
              <button className="btn btn-primary" style={{flexShrink:0}} onClick={addSub}>Add</button>
            </div>
            {(form.subtasks||[]).length===0?<div style={{textAlign:"center",color:"var(--t3)",padding:20,fontSize:12}}>No subtasks yet</div>:(
              <div>
                <div style={{marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
                  <div className="pbar" style={{flex:1}}><div className="pfill" style={{width:`${(form.subtasks.filter(s=>s.done).length/form.subtasks.length)*100}%`,background:"var(--green)"}}/></div>
                  <span className="mono" style={{fontSize:11,color:"var(--t2)"}}>{form.subtasks.filter(s=>s.done).length}/{form.subtasks.length}</span>
                </div>
                {form.subtasks.map(s=>(
                  <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid var(--b)"}}>
                    <input type="checkbox" checked={s.done} onChange={()=>set("subtasks",form.subtasks.map(x=>x.id===s.id?{...x,done:!x.done}:x))} style={{cursor:"pointer",accentColor:"var(--green)"}}/>
                    <span style={{flex:1,fontSize:13,color:s.done?"var(--t3)":"var(--t)",textDecoration:s.done?"line-through":"none"}}>{s.text}</span>
                    <button onClick={()=>set("subtasks",form.subtasks.filter(x=>x.id!==s.id))} style={{background:"transparent",border:"none",color:"var(--t3)",cursor:"pointer",fontSize:14,padding:"0 4px"}}>✕</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
        <div style={{display:"flex",gap:8,marginTop:18,paddingTop:14,borderTop:"1px solid var(--b)"}}>
          <button className="btn btn-danger btn-sm" onClick={()=>onDelete(card.id)}>Delete</button>
          <div style={{flex:1}}/>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>onSave(form)}>Save</button>
        </div>
      </div>
    </div>
  );
}

// ─── AI PANEL ────────────────────────────────────────────────────────────────

      {analysis.riskAlerts?.map((r,i)=><div key={i} style={{background:"#3a1a1a",border:"1px solid #da363355",borderRadius:6,padding:"8px 10px",marginBottom:6,color:"var(--orange)",fontSize:11}}>⚠ {r}</div>)}
      {analysis.weeklyFocus?.length>0&&<div style={{marginBottom:10}}><div className="sl">This Week</div>{analysis.weeklyFocus.map((f,i)=><div key={i} style={{color:"var(--green)",padding:"3px 0",fontSize:11}}>→ {f}</div>)}</div>}

// ─── KANBAN VIEW ─────────────────────────────────────────────────────────────
function KanbanView({cards,setCards,lanes,members,sprints,setSprints,activeSprintId,setActiveSprintId,resetKanban}){
  const [kTab,setKTab]=useState("board");
  const [filters,setFilters]=useState({search:"",label:"",priority:""});
  const [dragCardId,setDragCardId]=useState(null);
  const [dragOverLane,setDragOverLane]=useState(null);
  const [editCard,setEditCard]=useState(null);
  const [tplLane,setTplLane]=useState(null);
  const [aiAnalysis,setAiAnalysis]=useState(null);
  const [aiLoading,setAiLoading]=useState(false);
  const [showAI,setShowAI]=useState(false);
  const [activeTimer,setActiveTimer]=useState(null);
  const [timerDisplay,setTimerDisplay]=useState("00:00");
  const timerRef=useRef(null);

  useEffect(()=>{
    if(activeTimer){timerRef.current=setInterval(()=>{const s=Math.floor((Date.now()-activeTimer.startTime)/1000);setTimerDisplay(`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`);},1000);}
    else{clearInterval(timerRef.current);setTimerDisplay("00:00");}
    return()=>clearInterval(timerRef.current);
  },[activeTimer]);

  const addCard=(laneId,tmpl)=>{const d=tmpl?.d||{};const c={id:`c${Date.now()}`,laneId,title:"New Card",description:d.description||"",priority:d.priority||2,labels:d.labels||[],dueDate:null,estimate:d.estimate||"",assignee:null,subtasks:[],repo:"",timeLog:[],sprintId:activeSprintId,storyPoints:1,createdAt:new Date().toISOString().split("T")[0]};setCards(prev=>[...prev,c]);setEditCard(c);setTplLane(null);};
  const quickAdd=(laneId,priority,title)=>{const c={id:`c${Date.now()}`,laneId,title,description:"",priority,labels:[],dueDate:null,estimate:"",assignee:null,subtasks:[],repo:"",timeLog:[],sprintId:activeSprintId,storyPoints:1,createdAt:new Date().toISOString().split("T")[0]};setCards(prev=>[...prev,c]);};
  const updateCard=u=>{setCards(prev=>prev.map(c=>c.id===u.id?u:c));setEditCard(null);};
  const deleteCard=id=>{setCards(prev=>prev.filter(c=>c.id!==id));setEditCard(null);};
  const moveCard=(cId,lId)=>setCards(prev=>prev.map(c=>c.id===cId?{...c,laneId:lId}:c));
  const startTimer=cId=>setActiveTimer({cardId:cId,startTime:Date.now()});
  const stopTimer=cId=>{if(!activeTimer||activeTimer.cardId!==cId)return;const dur=Math.max(1,Math.floor((Date.now()-activeTimer.startTime)/60000));setCards(prev=>prev.map(c=>c.id===cId?{...c,timeLog:[...(c.timeLog||[]),{date:new Date().toISOString().split("T")[0],duration:dur,note:"Tracked session"}]}:c));setActiveTimer(null);};
  const addTimeEntry=(cId,dur,date,note)=>setCards(prev=>prev.map(c=>c.id===cId?{...c,timeLog:[...(c.timeLog||[]),{date,duration:dur,note}]}:c));
  const runAI=async()=>{
    setAiLoading(true);setShowAI(true);
    try{
      const summary={lanes:lanes.map(l=>({lane:l.title,count:cards.filter(c=>c.laneId===l.id).length,wip:l.wipLimit})),overdue:cards.filter(c=>c.dueDate&&new Date(c.dueDate)<new Date()).map(c=>c.title),blocked:cards.filter(c=>c.laneId==="blocked").map(c=>c.title),highPriority:cards.filter(c=>c.priority>=4).map(c=>c.title)};
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:800,messages:[{role:"user",content:`Analyze this Kanban board and return ONLY valid JSON:\n${JSON.stringify(summary)}\n\nReturn: {"summary":"2-sentence overview","weeklyFocus":[],"bottlenecks":[],"riskAlerts":[]}`}]})});
      const data=await res.json();
      const txt=data.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"{}";
      setAiAnalysis(JSON.parse(txt.replace(/```json|```/g,"").trim()));
    }catch{setAiAnalysis({summary:"Analysis unavailable.",weeklyFocus:[],bottlenecks:[],riskAlerts:[]});}
    setAiLoading(false);
  };

  const filtered=cards.filter(c=>{
    if(filters.search&&!c.title.toLowerCase().includes(filters.search.toLowerCase()))return false;
    if(filters.label&&!c.labels?.includes(filters.label))return false;
    if(filters.priority&&c.priority!==+filters.priority)return false;
    return true;
  });

  // Burndown
  const sprint=sprints.find(s=>s.id===activeSprintId)||sprints[0];
  const sprintCards=cards.filter(c=>c.sprintId===activeSprintId);
  const completed=sprintCards.filter(c=>c.laneId==="done").reduce((s,c)=>s+(c.storyPoints||0),0);

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{padding:"8px 16px",borderBottom:"1px solid var(--b)",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",flexShrink:0}}>
        <div style={{display:"flex",gap:3,background:"var(--s)",borderRadius:8,padding:3}}>
          {[["board","Board"],["burndown","Burndown"],["settings","⚙"]].map(([id,lbl])=>(
            <button key={id} className="tpill" onClick={()=>setKTab(id)} style={{background:kTab===id?"var(--s3)":"transparent",color:kTab===id?"var(--t)":"var(--t2)",border:"none"}}>{lbl}</button>
          ))}
        </div>
        {kTab==="board"&&<>
          <input className="inp inp-sm" placeholder="🔍 Search..." style={{width:160}} value={filters.search} onChange={e=>setFilters(f=>({...f,search:e.target.value}))}/>
          <select className="inp inp-sm" style={{width:"auto"}} value={filters.label} onChange={e=>setFilters(f=>({...f,label:e.target.value}))}><option value="">All Labels</option>{Object.keys(LC).map(l=><option key={l}>{l}</option>)}</select>
          <select className="inp inp-sm" style={{width:"auto"}} value={filters.priority} onChange={e=>setFilters(f=>({...f,priority:e.target.value}))}><option value="">All Priorities</option>{[1,2,3,4,5].map(p=><option key={p} value={p}>P{p} {PL[p]}</option>)}</select>
        </>}
        <div style={{flex:1}}/>
        {kTab==="board"&&<select className="inp inp-sm" style={{width:"auto"}} value={activeSprintId} onChange={e=>setActiveSprintId(e.target.value)}>{sprints.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>}
        {activeTimer&&<div style={{background:"#0c2a0c",border:"1px solid var(--green)",borderRadius:6,padding:"3px 10px",fontSize:12,color:"var(--green)",fontFamily:"'JetBrains Mono'",display:"flex",alignItems:"center",gap:6}}>● {timerDisplay}<button className="btn btn-danger btn-sm" style={{padding:"1px 6px",fontSize:10}} onClick={()=>stopTimer(activeTimer.cardId)}>Stop</button></div>}
        {kTab==="board"&&<button className="btn btn-ghost btn-sm" style={{borderColor:showAI?"var(--blue)":"var(--b2)",color:showAI?"var(--blue)":"var(--t2)"}} onClick={()=>{if(!aiAnalysis&&!aiLoading)runAI();else setShowAI(v=>!v);}}>◈ AI</button>}
      </div>

      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {kTab==="board"&&<BoardView lanes={lanes} cards={filtered} members={members} dragCardId={dragCardId} setDragCardId={setDragCardId} dragOverLane={dragOverLane} setDragOverLane={setDragOverLane} moveCard={moveCard} onCardClick={setEditCard} onAddCard={(lId)=>setTplLane(lId)} activeTimer={activeTimer}/>}

          {kTab==="burndown"&&sprint&&(
            <div style={{flex:1,overflow:"auto",padding:20}}>
              <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
                {sprints.map(s=><button key={s.id} className="btn btn-ghost" style={{background:activeSprintId===s.id?"var(--s3)":"transparent",color:activeSprintId===s.id?"var(--blue)":"var(--t2)",borderColor:activeSprintId===s.id?"var(--blue)":"var(--b2)"}} onClick={()=>setActiveSprintId(s.id)}>{s.name}</button>)}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
                {[{l:"Sprint",v:sprint.name,s:`${sprint.startDate} → ${sprint.endDate}`},{l:"Total",v:sprint.totalPoints+"pt",s:"committed"},{l:"Done",v:completed+"pt",s:`${Math.round(completed/sprint.totalPoints*100)||0}%`},{l:"Remaining",v:(sprint.totalPoints-completed)+"pt",s:"to go"}].map(x=>(
                  <div key={x.l} className="card" style={{padding:"12px 16px"}}>
                    <div className="sl" style={{marginBottom:4}}>{x.l}</div>
                    <div className="mono" style={{fontSize:20,fontWeight:700}}>{x.v}</div>
                    <div style={{fontSize:11,color:"var(--t3)",marginTop:2}}>{x.s}</div>
                  </div>
                ))}
              </div>
              <div className="card" style={{padding:"14px 0 8px"}}>
                <div style={{padding:"0 16px",marginBottom:10,fontSize:13,fontWeight:600}}>Burndown — {sprint.name}</div>
                <svg width="100%" viewBox="0 0 520 180" style={{overflow:"visible"}}>
                  {[0,.25,.5,.75,1].map(p=>(
                    <g key={p}>
                      <line x1={40} y1={10+140*(1-p)} x2={500} y2={10+140*(1-p)} stroke="#21262d" strokeWidth="1"/>
                      <text x={34} y={14+140*(1-p)} fontSize="9" fill="#484f58" textAnchor="end">{Math.round(sprint.totalPoints*p)}</text>
                    </g>
                  ))}
                  {[0,3,6,9,12,14].map(d=><text key={d} x={40+(d/14)*460} y={168} fontSize="9" fill="#484f58" textAnchor="middle">D{d}</text>)}
                  <path d={sprint.burndown.map((pt,i)=>`${i===0?"M":"L"}${40+(pt.d/14)*460},${10+140*(1-pt.i/sprint.totalPoints)}`).join(" ")} fill="none" stroke="#484f58" strokeWidth="1.5" strokeDasharray="4,3"/>
                  <path d={sprint.burndown.filter(pt=>pt.a!==null).map((pt,i)=>`${i===0?"M":"L"}${40+(pt.d/14)*460},${10+140*(1-pt.a/sprint.totalPoints)}`).join(" ")} fill="none" stroke="var(--blue)" strokeWidth="2.5" strokeLinecap="round"/>
                  {sprint.burndown.filter(pt=>pt.a!==null).map(pt=><circle key={pt.d} cx={40+(pt.d/14)*460} cy={10+140*(1-pt.a/sprint.totalPoints)} r="3.5" fill="var(--blue)" stroke="var(--s)" strokeWidth="1.5"/>)}
                </svg>
              </div>
            </div>
          )}

          {kTab==="settings"&&(
            <div style={{flex:1,overflow:"auto",padding:20}}>
              <div className="card" style={{marginBottom:16}}>
                <div style={{fontSize:14,fontWeight:600,marginBottom:12}}>Data Management</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                  <button className="btn btn-ghost" onClick={()=>{const d=JSON.stringify({cards,lanes,members,sprints},null,2);const b=new Blob([d]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`kanban-${Date.now()}.json`;a.click();}}>⬇ Export JSON</button>
                  <button className="btn btn-ghost" onClick={()=>{const h="Name,Status,Priority,Labels,Assignee,Due,Points\n"+cards.map(c=>`"${c.title}","${c.laneId}","${PL[c.priority]}","${c.labels?.join(";")||""}","${c.assignee||""}","${c.dueDate||""}","${c.storyPoints||0}"`).join("\n");const b=new Blob([h],{type:"text/csv"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`kanban-${Date.now()}.csv`;a.click();}}>⬇ Export CSV</button>
                  <div style={{flex:1}}/>
                  <button className="btn btn-danger" onClick={()=>{if(window.confirm("Reset kanban to defaults?"))resetKanban();}}>↺ Reset Kanban</button>
                </div>
              </div>
              <div className="card">
                <div style={{fontSize:14,fontWeight:600,marginBottom:12}}>Sprints</div>
                <button className="btn btn-primary btn-sm" onClick={()=>setSprints(p=>[...p,{id:`sp${Date.now()}`,name:`Sprint ${p.length+9}`,startDate:"",endDate:"",totalPoints:40,burndown:[{d:0,i:40,a:40}]}])}>+ New Sprint</button>
              </div>
            </div>
          )}
        </div>

        {showAI&&(
          <div style={{width:280,borderLeft:"1px solid var(--b)",background:"var(--s2)",overflow:"auto",padding:14,flexShrink:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={{fontWeight:700,fontSize:13}}>◈ AI Analysis</span>
              <button className="btn btn-ghost btn-sm" onClick={()=>setShowAI(false)}>✕</button>
            </div>
            <AIPanel analysis={aiAnalysis} loading={aiLoading}/>
            <button className="btn btn-primary" style={{width:"100%",marginTop:10}} onClick={runAI} disabled={aiLoading}>{aiLoading?"Analyzing...":"↺ Re-analyze"}</button>
          </div>
        )}
      </div>

      {tplLane&&<TemplatePicker onSelect={t=>addCard(tplLane,t)} onClose={()=>setTplLane(null)}/>}
      {editCard&&<CardModal card={editCard} lanes={lanes} members={members} onSave={updateCard} onDelete={deleteCard} onClose={()=>setEditCard(null)} activeTimer={activeTimer} startTimer={startTimer} stopTimer={stopTimer} timerDisplay={timerDisplay} addTimeEntry={addTimeEntry}/>}
    </div>
  );
}

          <div style={{display:"flex",gap:8,justifyContent:"flex-end",paddingTop:4}}>

            <button className="btn btn-primary" onClick={()=>onSave(p)}>Save</button>
          </div>

  );
}

function PCCView({projects,setProjects,webhookUrl,setWebhookUrl,resetPCC}){
  const [pTab,setPTab]=useState("pipeline");
  const [filter,setFilter]=useState("All");
  const [editP,setEditP]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [syncError,setSyncError]=useState("");
  const [lastSync,setLastSync]=useState(null);

  const wh=projects.map(p=>({...p,health:calcHealth(p)}));
  const filtered=filter==="All"?wh:wh.filter(p=>p.status===filter);
  const criticals=wh.filter(p=>p.health<50||p.status==="Blocked").sort((a,b)=>a.health-b.health);
  const sum={total:projects.length,avgHealth:Math.round(wh.reduce((s,p)=>s+p.health,0)/(wh.length||1)),cost:projects.reduce((s,p)=>s+(p.monthlyCost||0),0),active:projects.filter(p=>p.status==="Active").length};

  const sync=async()=>{
    setSyncing(true);setSyncError("");
    try{
      const res=await fetch(webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({projects:projects.map(p=>({id:p.id,name:p.name,status:p.status,platform:p.platform,techDebt:p.techDebt,businessValue:p.businessValue,monthlyCost:p.monthlyCost,lastActivity:p.lastActivity,repo:p.repo||"",auditChecks:p.auditChecks||{}})),meta:{requestedAt:new Date().toISOString(),source:"portfolio-hub"}})});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      setLastSync(new Date());

// ─── APP SHELL ────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("today");
  const [cards,setCards]=useState(DEF_CARDS);
  const [lanes]=useState(LANES);
  const [members]=useState(DEF_MEMBERS);
  const [sprints,setSprints]=useState(DEF_SPRINTS);
  const [activeSprintId,setActiveSprintId]=useState("sp2");
  const [projects,setProjects]=useState(DEF_PROJECTS);
  const [webhookUrl,setWebhookUrl]=useState(WEBHOOK);
  const [memoir,setMemoir]=useState(DEF_MEMOIR);

  // Load from storage
  useEffect(()=>{
    try{
      const saved=JSON.parse(localStorage.getItem(HUB_KEY));
      if(!saved)return;
      if(saved.cards)setCards(saved.cards);
      if(saved.sprints)setSprints(saved.sprints);
      if(saved.activeSprintId)setActiveSprintId(saved.activeSprintId);
      if(saved.projects)setProjects(saved.projects);
      if(saved.webhookUrl)setWebhookUrl(saved.webhookUrl);
      if(saved.memoir)setMemoir(saved.memoir);
    }catch(e){}
  },[]);

  // Save on change (guarded — storage may be unavailable in the artifact sandbox)
  useEffect(()=>{
    try{localStorage.setItem(HUB_KEY,JSON.stringify({cards,sprints,activeSprintId,projects,webhookUrl,memoir}));}catch(e){}
  },[cards,sprints,activeSprintId,projects,webhookUrl,memoir]);

  const exportAll=()=>{
    const d=JSON.stringify({cards,sprints,activeSprintId,projects,webhookUrl,memoir},null,2);
    const b=new Blob([d],{type:"application/json"});
    const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=`portfolio-hub-${new Date().toISOString().split("T")[0]}.json`;a.click();
    URL.revokeObjectURL(u);
  };
  const importAll=()=>{
    const inp=document.createElement("input");inp.type="file";inp.accept=".json";
    inp.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.cards)setCards(d.cards);if(d.sprints)setSprints(d.sprints);if(d.activeSprintId)setActiveSprintId(d.activeSprintId);if(d.projects)setProjects(d.projects);if(d.memoir)setMemoir(d.memoir);if(d.webhookUrl)setWebhookUrl(d.webhookUrl);}catch{alert("Invalid JSON file");}};
      r.readAsText(f);
    };
    inp.click();
  };
  const resetAll=()=>{
    if(!window.confirm("Reset ALL data to defaults? This cannot be undone."))return;
    localStorage.removeItem(HUB_KEY);
    setCards(DEF_CARDS);setSprints(DEF_SPRINTS);setActiveSprintId("sp2");setProjects(DEF_PROJECTS);setMemoir(DEF_MEMOIR);setTab("today");
  };

  const today=new Date();
  const overdueCount=cards.filter(c=>c.laneId!=="done"&&isOverdue(c.dueDate)).length;

  const TABS=[
    {id:"today",label:"Today",dot:overdueCount>0,dotColor:"var(--red)"},
    {id:"kanban",label:"Kanban"},
    {id:"portfolio",label:"Portfolio"},
    {id:"memoir",label:"Memoir"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      {/* Nav */}
      <div style={{background:"var(--s)",borderBottom:"1px solid var(--b)",padding:"0 16px",display:"flex",alignItems:"center",gap:4,flexShrink:0,height:44}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginRight:12}}>
          <div style={{width:22,height:22,borderRadius:5,background:"linear-gradient(135deg,#7c3aed,#a855f7)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>⬡</div>
          <span className="mono" style={{fontSize:12,fontWeight:600,color:"var(--t)"}}>Hub</span>
        </div>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} className="tpill" style={{background:tab===t.id?"var(--s3)":"transparent",color:tab===t.id?"var(--t)":"var(--t2)",border:"none",position:"relative"}}>
            {t.label}
            {t.dot&&<span style={{position:"absolute",top:2,right:2,width:6,height:6,borderRadius:"50%",background:t.dotColor}}/>}
          </button>
        ))}
        <div style={{flex:1}}/>
        <div className="mono" style={{fontSize:10,color:"var(--t3)",marginRight:8}}>{today.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div>
        <button className="btn btn-ghost btn-sm" onClick={importAll} title="Import JSON backup">⬆ Import</button>
        <button className="btn btn-ghost btn-sm" onClick={exportAll} title="Export full backup">⬇ Export</button>
        <button className="btn btn-ghost btn-sm" onClick={resetAll} title="Reset all data to defaults" style={{color:"var(--t3)"}}>↺</button>
      </div>

      {/* Content */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {tab==="today"&&<TodayView cards={cards} lanes={lanes} members={members} projects={projects} onCardClick={c=>{setTab("kanban");}} onAddCard={(laneId,pri,title)=>{const c={id:`c${Date.now()}`,laneId,title,description:"",priority:pri,labels:[],dueDate:null,estimate:"",assignee:null,subtasks:[],repo:"",timeLog:[],sprintId:activeSprintId,storyPoints:1,createdAt:new Date().toISOString().split("T")[0]};setCards(p=>[...p,c]);}} activeTimer={null} timerDisplay="00:00" stopTimer={()=>{}}/>}
        {tab==="kanban"&&<KanbanView cards={cards} setCards={setCards} lanes={lanes} members={members} sprints={sprints} setSprints={setSprints} activeSprintId={activeSprintId} setActiveSprintId={setActiveSprintId} resetKanban={()=>{if(window.confirm("Reset kanban data?"))setCards(DEF_CARDS);}}/>}
        {tab==="portfolio"&&<PCCView projects={projects} setProjects={setProjects} webhookUrl={webhookUrl} setWebhookUrl={setWebhookUrl} resetPCC={()=>{if(window.confirm("Reset portfolio data?"))setProjects(DEF_PROJECTS);}}/>}
        {tab==="memoir"&&<MemoirView memoir={memoir} setMemoir={setMemoir}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
