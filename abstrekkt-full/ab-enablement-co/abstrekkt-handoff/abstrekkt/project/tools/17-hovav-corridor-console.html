<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halls of Villains and Virtues — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,300..600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── READING ROOM AT MIDNIGHT — ABSTREKKT TOKENS ── */
  :root {
    --ink:       #131315;
    --ink-2:     #1c1b1d;
    --ink-3:     #201f21;
    --ink-4:     #2a2a2c;
    --paper:     #e5e1e4;
    --paper-2:   #d4c5ab;
    --paper-3:   #9c8f78;
    --paper-4:   #6f6557;
    --border:    rgba(255,191,0,.12);
    --border-2:  rgba(255,191,0,.24);
    --brass:     #ffbf00;
    --brass-dim: rgba(255,191,0,.08);
    --brass-mid: rgba(255,191,0,.18);
    --virtue:    #ffbf00;
    --villain:   #ffb4ab;
    --ok:        #7fa88a;
    --ok-dim:    rgba(127,168,138,.14);
    --draft:     #6f6557;
    --focus:     #a9c7ff;
    --tap:       44px;
    --r:         0.375rem;
    --t-fast:    150ms;
    --t-med:     280ms;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Literata', Georgia, serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100dvh;
    overflow-x: hidden;
    background-image: radial-gradient(ellipse 60% 35% at 50% -5%, rgba(255,191,0,.05), transparent 60%);
  }

  /* Skip link */
  .skip { position:absolute;left:8px;top:-52px;z-index:100;background:var(--brass);color:var(--ink);padding:10px 16px;border-radius:var(--r);font-family:'JetBrains Mono',monospace;font-size:12px;text-decoration:none;font-weight:500;transition:top var(--t-fast); }
  .skip:focus { top:8px; }

  /* Focus */
  :focus-visible { outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r); }

  /* Screen reader only */
  .sr { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0; }

  /* ── TOPBAR ── */
  .topbar {
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:14px;
    padding:0 20px;height:58px;
    background:rgba(28,25,23,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(12px);
  }

  .menu-btn {
    display:inline-flex;align-items:center;justify-content:center;
    width:var(--tap);height:var(--tap);min-width:var(--tap);
    background:transparent;border:1px solid var(--border);border-radius:var(--r);
    color:var(--paper-2);cursor:pointer;font-size:16px;
    transition:border-color var(--t-fast),color var(--t-fast);
  }
  .menu-btn:hover { border-color:var(--border-2);color:var(--paper); }

  .brand {
    font-family:'EB Garamond', Georgia, serif;
    font-size:13px;font-weight:300;letter-spacing:.04em;
    color:var(--paper-3);
  }
  .brand strong { color:var(--brass);font-weight:500; }

  .mode-switch { margin-left:auto;display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden; }
  .mode-btn {
    background:transparent;border:none;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--paper-3);padding:0 16px;height:40px;cursor:pointer;
    transition:background var(--t-fast),color var(--t-fast);
  }
  .mode-btn[aria-pressed=true]  { background:var(--brass);color:var(--ink);font-weight:500; }
  .mode-btn:not([aria-pressed=true]):hover { background:var(--ink-3);color:var(--paper); }

  /* ── LAYOUT ── */
  .layout { display:block; }

  .sidebar {
    position:fixed;inset:58px auto 0 0;z-index:40;
    width:min(88vw,300px);height:calc(100dvh - 58px);
    background:var(--ink-2);border-right:1px solid var(--border);
    transform:translateX(-100%);transition:transform var(--t-med) ease;
    overflow-y:auto;
  }
  .sidebar.open { transform:translateX(0); }

  .scrim {
    position:fixed;inset:0;z-index:35;background:rgba(28,25,23,.7);
    opacity:0;pointer-events:none;transition:opacity var(--t-med);
  }
  .scrim.show { opacity:1;pointer-events:auto; }

  .main { padding:24px 18px;max-width:840px;margin:0 auto; }

  @media (min-width:1024px) {
    .menu-btn { display:none; }
    .layout { display:grid;grid-template-columns:280px 1fr; }
    .sidebar { position:sticky;top:58px;transform:none;height:calc(100dvh - 58px); }
    .scrim { display:none; }
    .main { padding:32px 36px; }
  }

  /* ── SIDEBAR CONTENT ── */
  .side-label {
    padding:16px 18px 10px;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--brass);
    border-bottom:1px solid var(--border);
  }

  .moment-list { list-style:none; }
  .moment-item button {
    display:flex;align-items:center;gap:12px;width:100%;
    padding:13px 18px;min-height:var(--tap);
    background:transparent;border:none;border-bottom:1px solid var(--border);
    border-left:3px solid transparent;
    color:var(--paper);text-align:left;cursor:pointer;
    font-family:'Literata', Georgia, serif;font-size:15px;
    transition:background var(--t-fast),border-left-color var(--t-fast);
  }
  .moment-item button:hover { background:var(--ink-3); }
  .moment-item button[aria-current=true] { background:var(--ink-3);border-left-color:var(--brass); }

  .m-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
  .m-dot.pub  { background:var(--ok); }
  .m-dot.dft  { background:var(--draft); }
  .m-label { font-weight:600;line-height:1.2;color:var(--paper); }
  .m-date  { font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--paper-3);letter-spacing:.04em; }

  .add-btn {
    margin:16px 18px;width:calc(100% - 36px);min-height:var(--tap);
    background:transparent;border:1px dashed var(--border-2);border-radius:var(--r);
    color:var(--brass);font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    transition:background var(--t-fast),border-color var(--t-fast);
  }
  .add-btn:hover { background:var(--brass-dim);border-color:var(--brass); }

  /* ── CARDS ── */
  .stack { display:flex;flex-direction:column;gap:20px; }

  .card {
    background:var(--ink-2);
    border:1px solid var(--border);
    border-radius:var(--r);
    padding:22px;
  }

  .card-head { display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap; }

  h2.ct {
    font-family:'EB Garamond', Georgia, serif;
    font-size:14px;font-weight:300;letter-spacing:.12em;
    text-transform:uppercase;color:var(--paper-3);
  }
  h2.ct strong { color:var(--paper);font-weight:500; }

  .pill {
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;padding:3px 10px;border:1px solid;border-radius:100px;
  }
  .pill-virtue  { color:var(--virtue);border-color:rgba(255,191,0,.4);background:var(--brass-dim); }
  .pill-villain { color:#ffb4ab;border-color:rgba(255,180,171,.4);background:rgba(255,180,171,.08); }
  .pill-pub     { color:var(--ok);border-color:rgba(127,168,138,.4);background:var(--ok-dim); }
  .pill-draft   { color:var(--paper-3);border-color:var(--border); }

  /* ── FORM ── */
  .g2 { display:grid;grid-template-columns:1fr;gap:14px; }
  @media (min-width:600px) { .g2 { grid-template-columns:1fr 1fr; } }

  .field { margin-bottom:16px; }
  .field:last-child { margin-bottom:0; }

  .field label {
    display:block;
    font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--brass);margin-bottom:6px;
  }
  .hint {
    font-family:'Literata', Georgia, serif;font-size:13px;font-style:italic;
    color:var(--paper-3);margin-bottom:7px;line-height:1.5;
  }

  .field input, .field textarea, .field select {
    width:100%;background:var(--ink);
    border:1px solid var(--border);border-radius:var(--r);
    color:var(--paper);
    font-family:'Literata', Georgia, serif;font-size:15px;
    padding:10px 13px;min-height:var(--tap);
    transition:border-color var(--t-fast);
  }
  .field textarea { min-height:80px;resize:vertical;line-height:1.6; }
  .field input:hover, .field textarea:hover, .field select:hover { border-color:var(--border-2); }
  .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--brass); }

  /* ── AI BOX ── */
  .ai-box {
    background:var(--ink);
    border:1px dashed rgba(255,191,0,.28);border-radius:var(--r);padding:16px;
  }
  .ai-box-label {
    display:block;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--brass);margin-bottom:9px;
  }
  .ai-box textarea {
    width:100%;background:transparent;border:none;
    color:var(--paper);font-family:'Literata', Georgia, serif;font-size:15px;
    line-height:1.6;outline:none;resize:vertical;min-height:80px;
  }
  .ai-box textarea:focus-visible { outline:2px solid var(--focus);outline-offset:4px;border-radius:var(--r); }

  /* ── BUTTONS ── */
  .btn {
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:var(--tap);padding:0 20px;border-radius:var(--r);
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;border:1px solid;
    transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast);
  }
  .btn-primary { background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:500; }
  .btn-primary:hover { background:#e0a800;border-color:#e0a800; }
  .btn-ghost { background:transparent;border-color:var(--border);color:var(--paper-3); }
  .btn-ghost:hover { border-color:var(--border-2);color:var(--paper); }
  .btn-danger { background:transparent;border-color:rgba(255,180,171,.4);color:#ffb4ab; }
  .btn-danger:hover { background:rgba(255,180,171,.08); }
  .btn[aria-busy=true] { opacity:.55;cursor:progress; }
  .btn:disabled { opacity:.38;cursor:not-allowed; }

  /* ── MEDIA GRID ── */
  .media-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px; }
  @media (min-width:600px) { .media-grid { grid-template-columns:repeat(4,1fr); } }

  .media-cell {
    border:1px solid var(--border);border-radius:var(--r);padding:12px;text-align:center;
  }
  .media-cell .ml {
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--paper-4);margin-bottom:8px;
  }
  .ms { font-family:'Literata', Georgia, serif;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:8px; }
  .d { width:7px;height:7px;border-radius:50%;display:inline-block; }
  .s-done .d  { background:var(--ok); }
  .s-none .d  { background:var(--draft); }
  .media-act {
    min-height:32px;width:100%;background:transparent;
    border:1px solid var(--border);border-radius:var(--r);
    color:var(--brass);font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:.06em;cursor:pointer;
    transition:background var(--t-fast),border-color var(--t-fast);
  }
  .media-act:hover { background:var(--brass-dim);border-color:var(--border-2); }

  /* ── TAGS ── */
  .tag-row { display:flex;flex-wrap:wrap;gap:6px; }
  .tag {
    font-family:'JetBrains Mono',monospace;font-size:10px;
    padding:5px 11px;min-height:30px;
    background:var(--ink);border:1px solid var(--border);border-radius:100px;
    color:var(--paper-3);cursor:pointer;
    display:inline-flex;align-items:center;
    transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast);
  }
  .tag[aria-pressed=true] { background:var(--brass-dim);border-color:var(--border-2);color:var(--brass); }
  .tag:hover { border-color:var(--border-2); }

  /* ── BOTTOM BAR ── */
  .bottom-bar { display:flex;gap:10px;flex-wrap:wrap;align-items:center; }
  .save-msg { font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em; }

  /* ── VISITOR MODE ── */
  .vis-intro {
    font-family:'Literata', Georgia, serif;font-size:16px;font-style:italic;
    color:var(--paper-2);line-height:1.65;margin-bottom:18px;
  }

  .chat-log {
    display:flex;flex-direction:column;gap:14px;
    margin:18px 0;max-height:380px;overflow-y:auto;padding-right:4px;
  }

  .msg {
    padding:13px 16px;border-radius:var(--r);
    font-family:'Literata', Georgia, serif;font-size:15px;line-height:1.65;
    max-width:92%;
  }
  .msg-user { align-self:flex-end;background:var(--ink-3);border:1px solid var(--border); }
  .msg-ai   { align-self:flex-start;background:rgba(255,191,0,.06);border:1px solid rgba(255,191,0,.2); }
  .msg-who {
    display:block;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--brass);margin-bottom:5px;
  }

  .chat-row { display:flex;gap:8px; }
  .chat-row .field { flex:1;margin:0; }

  .suggestions { display:flex;flex-wrap:wrap;gap:7px;margin-top:12px; }
  .sug {
    font-family:'Literata', Georgia, serif;font-size:13px;font-style:italic;
    padding:6px 13px;min-height:32px;
    background:transparent;border:1px solid var(--border);border-radius:100px;
    color:var(--paper-3);cursor:pointer;
    transition:border-color var(--t-fast),color var(--t-fast);
  }
  .sug:hover { border-color:var(--border-2);color:var(--paper); }

  /* ── MISC ── */
  .hidden { display:none!important; }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.001ms!important;transition-duration:.001ms!important; }
  }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:var(--border-2);border-radius:100px; }

  /* ── Abstrekkt canon ── AI surfaces = blueprint blue, microfilm grain ── */
  .ai-box { border-color: rgba(169,199,255,.34) !important; }
  .ai-box-label { color: #a9c7ff !important; }
  .msg-ai { background: rgba(2,107,210,.10) !important; border-color: rgba(169,199,255,.3) !important; }
  .msg-who { color: #a9c7ff !important; }
  .sug:hover { border-color: rgba(169,199,255,.5) !important; color: #a9c7ff !important; }
  body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:9998; opacity:.05;
    background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)"/%3E%3C/svg%3E'); }

  /* ── Captured renders + archive link (Phase 3 wiring) ── */
  .arch-link{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--paper-3);text-decoration:none;border:1px solid var(--border);border-radius:var(--r);
    padding:9px 13px;height:40px;display:inline-flex;align-items:center;gap:6px;transition:border-color var(--t-fast),color var(--t-fast);}
  .arch-link:hover{border-color:var(--border-2);color:var(--brass);}
  .rcap-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:600px){.rcap-grid{grid-template-columns:1fr;}}
  .rcap{position:relative;display:block;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
    aspect-ratio:16/10;background:var(--ink-3);transition:border-color var(--t-fast),transform var(--t-fast);}
  .rcap:hover{border-color:var(--border-2);transform:translateY(-2px);}
  .rcap img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block;}
  .rcap-tag{position:absolute;left:8px;bottom:8px;font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:.1em;text-transform:uppercase;background:rgba(19,19,21,.82);border:1px solid var(--border);
    border-radius:100px;padding:3px 9px;color:var(--paper-2);backdrop-filter:blur(4px);}
  .rcap-villain .rcap-tag{color:var(--villain);}
  .rcap-virtue .rcap-tag{color:var(--virtue);}
  .rcap-missing{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--paper-4);
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;border:1px dashed var(--border);
    border-radius:var(--r);aspect-ratio:16/10;}
</style>
</head>

<script>
"use strict";
/* ── In-prototype Claude bridge: route api.anthropic.com calls through window.claude.complete ── */
(function(){
  const orig = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = async function(url, opts){
    if (typeof url === 'string' && url.includes('api.anthropic.com')) {
      let body = {};
      try { body = JSON.parse(opts && opts.body); } catch(e){}
      const messages = (body.messages || []).slice();
      if (body.system) {
        if (messages.length && messages[0].role === 'user') {
          messages[0] = { role:'user', content: body.system + '\n\n' + messages[0].content };
        } else {
          messages.unshift({ role:'user', content: body.system });
        }
      }
      try {
        const text = await window.claude.complete({ messages });
        return { ok:true, json: async () => ({ content:[{ type:'text', text }] }) };
      } catch(e){
        return { ok:false, json: async () => ({ content:[{ type:'text', text:'' }] }) };
      }
    }
    return orig ? orig(url, opts) : Promise.reject(new Error('no fetch'));
  };
})();

let cur=1,mode='creator';

// ── Sidebar ────────────────────────────────────────────────────────
function openSidebar(){
  const s=$('#sidebar'),b=$('#menu-btn');
  s.classList.add('open');$('#scrim').classList.add('show');
  b.setAttribute('aria-expanded','true');b.setAttribute('aria-label','Close moment list');
  s.querySelector('button')?.focus();
}
function closeSidebar(){
  const b=$('#menu-btn');
  $('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');
  b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Open moment list');
}
$('#menu-btn').addEventListener('click',()=>$('#sidebar').classList.contains('open')?closeSidebar():openSidebar());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open')){closeSidebar();$('#menu-btn').focus();}});

function renderSidebar(){
  $('#m-count').textContent=`(${M.length})`;
  $('#m-list').innerHTML=M.map((m,i)=>`<li class="moment-item">
    <button onclick="setActive(${i})" ${i===cur?'aria-current="true"':''}>
      <span class="m-dot ${m.status==='published'?'pub':'dft'}" aria-hidden="true"></span>
      <span>
        <span class="m-label">${m.label}</span><br>
        <span class="m-date">${m.date}</span>
      </span>
    </button></li>`).join('');
}

function setActive(i){
  cur=i;renderSidebar();
  mode==='creator'?renderCreator():renderVisitor();
  if(window.innerWidth<1024)closeSidebar();
  announce(`${M[i].label}`);$('#main').focus();
}

// ── Mode ───────────────────────────────────────────────────────────
function setMode(m){
  mode=m;
  $('#m-creator').setAttribute('aria-pressed',m==='creator');
  $('#m-visitor').setAttribute('aria-pressed',m==='visitor');
  $('#creator-view').classList.toggle('hidden',m!=='creator');
  $('#visitor-view').classList.toggle('hidden',m!=='visitor');
  m==='creator'?renderCreator():renderVisitor();
  announce(m==='creator'?'Creator mode — build and edit moments':'Visitor mode — step inside the window');
}

// ── Helpers ────────────────────────────────────────────────────────
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function announce(t){$('#live').textContent=t;}
function mstat(done,label,act){
  return`<div class="media-cell">
    <p class="ml">${label}</p>
    <p class="ms ${done?'s-done':'s-none'}"><span class="d" aria-hidden="true"></span>${done?'done':'none'}</p>
    <button class="media-act">${done?'replace':act}</button>
  </div>`;
}
const ARCHIVE='../Corridor Archive Manifest.html';
function rcapCell(id,side,cls,arrow){
  if(!id) return `<div class="rcap-missing">no ${side.toLowerCase()} render yet</div>`;
  return`<a class="rcap rcap-${cls}" href="${ARCHIVE}?focus=${id}" target="_blank" rel="noopener" title="Open ${side} render in the Archive">
    <img loading="lazy" src="../corridor/thumbs/${id}.png" alt="${side} render">
    <span class="rcap-tag">${arrow} ${side}</span></a>`;
}
function renderCaptured(m){
  if(!m.render) return '';
  return`<section class="card" aria-labelledby="cap-h">
    <div class="card-head"><h2 class="ct" id="cap-h">Captured Renders <strong>— from archive</strong></h2>
      <span class="pill pill-pub">live</span></div>
    <p class="hint" style="margin-bottom:14px">The rendered corridor screens for this moment. Click to open it in the Archive.</p>
    <div class="rcap-grid">
      ${rcapCell(m.render.villain,'Villain','villain','↙')}
      ${rcapCell(m.render.virtue,'Virtue','virtue','↗')}
    </div></section>`;
}

// ── Creator ────────────────────────────────────────────────────────
function renderCreator(){
  const m=M[cur];
  $('#creator-view').innerHTML=`

    <section class="card" aria-labelledby="ph">
      <div class="card-head"><h2 class="ct" id="ph">Memory Parser <strong>— outside AI</strong></h2></div>
      <div class="ai-box">
        <span class="ai-box-label">Describe the memory in plain text — AI fills every field</span>
        <textarea id="ai-in" aria-describedby="ph-help"
          placeholder="I was at the shelter in 2010. They made us do religious services to eat. 4am snow shoveling for less than an inch..."></textarea>
        <p id="ph-help" class="sr">Type a freeform memory. AI extracts label, date, tags, and both virtue and villain sides.</p>
        <div style="margin-top:12px">
          <button class="btn btn-primary" id="parse-btn" onclick="parseMemory()">↯ Parse with AI</button>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="mh">
      <div class="card-head">
        <h2 class="ct" id="mh">Moment — <strong>${esc(m.label)}</strong></h2>
        <span class="pill ${m.status==='published'?'pill-pub':'pill-draft'}">${esc(m.status)}</span>
      </div>
      <div class="g2">
        <div class="field"><label for="f-label">Label</label><input id="f-label" value="${esc(m.label)}"></div>
        <div class="field"><label for="f-date">Date / Period</label><input id="f-date" value="${esc(m.date)}"></div>
      </div>
      <div class="g2">
        <div class="field"><label for="f-thread">Chapter Thread</label>
          <select id="f-thread">
            ${['rupture','formation','construction','emergence','parallel'].map(t=>`<option${t===m.thread?' selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label for="f-pos">Corridor Position</label><input id="f-pos" type="number" value="${m.pos}"></div>
      </div>
      <div class="field">
        <label id="tags-l">Tags</label>
        <div class="tag-row" role="group" aria-labelledby="tags-l">
          ${m.tags.map(t=>`<button class="tag" aria-pressed="true">${esc(t)}</button>`).join('')}
          <button class="tag" aria-pressed="false">+ add</button>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="vh">
      <div class="card-head">
        <h2 class="ct" id="vh">Virtue Side</h2>
        <span class="pill pill-virtue">↗ outward</span>
      </div>
      <div class="field">
        <label for="v-cap">Caption</label>
        <p class="hint">First person, present tense, under 45 seconds spoken. No epiphanies.</p>
        <textarea id="v-cap">${esc(m.virtue.cap)}</textarea>
      </div>
      <div class="field">
        <label for="v-env">Environment</label>
        <p class="hint">Descriptors for image and video generation.</p>
        <textarea id="v-env">${esc(m.virtue.env)}</textarea>
      </div>
    </section>

    <section class="card" aria-labelledby="lh">
      <div class="card-head">
        <h2 class="ct" id="lh">Villain Side</h2>
        <span class="pill pill-villain">↙ inward</span>
      </div>
      <div class="field">
        <label for="l-cap">Caption</label>
        <p class="hint">First person, present tense. No resolution.</p>
        <textarea id="l-cap">${esc(m.villain.cap)}</textarea>
      </div>
      <div class="field">
        <label for="l-room">Room</label>
        <p class="hint">Emotional state as physical space — light, objects, the door, emptiness.</p>
        <textarea id="l-room">${esc(m.villain.room)}</textarea>
      </div>
    </section>

    <section class="card" aria-labelledby="sh">
      <div class="card-head"><h2 class="ct" id="sh">Script Writer <strong>— outside AI</strong></h2></div>
      <p class="hint" style="margin-bottom:14px">Generates AI-Kyle narration scripts for both sides — ready for ElevenLabs + HeyGen.</p>
      <button class="btn btn-ghost" id="script-btn" onclick="writeScripts()">↯ Generate narration scripts</button>
      <div id="script-out" style="margin-top:16px"></div>
    </section>

    <section class="card" aria-labelledby="med-h">
      <div class="card-head"><h2 class="ct" id="med-h">Media Production</h2></div>
      <div class="media-grid">
        ${mstat(m.media.vi,'Virtue Image','generate')}
        ${mstat(m.media.li,'Villain Image','generate')}
        ${mstat(m.media.vv,'Virtue Video','generate')}
        ${mstat(m.media.lv,'Villain Video','generate')}

    ${renderCaptured(m)}

    <div class="bottom-bar">
      <button class="btn btn-ghost">Save Draft</button>

}

function publish(){
  const el=$('#save-msg');el.textContent='✓ published';el.style.color='var(--ok)';
  announce('Moment published to corridor');
  setTimeout(()=>el.textContent='',2600);
}

// ── Visitor ────────────────────────────────────────────────────────
let chatHistory=[];

function renderVisitor(){
  const m=M[cur];chatHistory=[];
  $('#visitor-view').innerHTML=`
    <section class="card" aria-labelledby="vis-h">
      <div class="card-head"><h2 class="ct" id="vis-h">Inside the Window — <strong>${esc(m.label)}</strong></h2></div>
      <p class="vis-intro">You're standing where I stood. Ask what it was like — I'll answer from inside this moment, not from now looking back.</p>
      <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-label="Conversation"></div>
      <div class="chat-row">
        <div class="field"><label for="ask-in" class="sr">Ask about this moment</label>
          <input id="ask-in" placeholder="What were you thinking right then?" onkeydown="if(event.key==='Enter')askMoment()">
        </div>
        <button class="btn btn-primary" id="ask-btn" onclick="askMoment()">Ask</button>
      </div>
      <div class="suggestions" role="group" aria-label="Suggested questions">
        <button class="sug" onclick="askMoment('What did you see first?')">What did you see first?</button>
        <button class="sug" onclick="askMoment('Were you scared?')">Were you scared?</button>
        <button class="sug" onclick="askMoment('What kept you there?')">What kept you there?</button>
        <button class="sug" onclick="askMoment('What does this place smell like?')">What does this place smell like?</button>
      </div>
    </section>

    <section class="card" aria-labelledby="mine-h">
      <div class="card-head"><h2 class="ct" id="mine-h">Your Window <strong>— inside AI</strong></h2></div>
      <p class="vis-intro">Everyone has a version of this. Describe yours — AI renders what your window looked like.</p>
      <div class="field">
        <label for="mine-in" class="sr">Describe your parallel memory</label>
        <textarea id="mine-in" placeholder="My version of this was…"></textarea>
      </div>
      <button class="btn btn-ghost" id="mine-btn" onclick="renderMine()">↯ Render my window</button>
      <div id="mine-out" style="margin-top:16px"></div>
    </section>

    ${renderCaptured(m)}
  `;
}

function addMsg(role,text,who){
  const log=$('#chat-log');
  const d=document.createElement('div');
  d.className=`msg msg-${role}`;
  d.innerHTML=role==='ai'?`<span class="msg-who">${esc(who||'inside the moment')}</span>${esc(text)}`:esc(text);
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
}

async function askMoment(preset){
  const inp=$('#ask-in');
  const q=preset||inp.value.trim();if(!q)return;
  inp.value='';addMsg('user',q);
  const btn=$('#ask-btn');btn.setAttribute('aria-busy','true');btn.disabled=true;
  const thinking=addMsg('ai','…','thinking');
  const m=M[cur];
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:400,
        system:`You are answering as a person standing inside a single remembered moment, in first person present tense. You are IN it — not looking back.

THE MOMENT: "${m.label}" (${m.date})
Outside: ${m.virtue.cap} — ${m.virtue.env}
Inside you: ${m.villain.cap} — ${m.villain.room}

RULES: First person, present tense only. 2–4 sentences max. No epiphanies. No "I realized." No resolution. Declarative. Sensory. If you don't know, say you don't know. Contradiction is honest. This is testimony, not insight.`,
        messages:[...chatHistory,{role:'user',content:q}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'…';
    thinking.remove();addMsg('ai',text);
    chatHistory.push({role:'user',content:q},{role:'assistant',content:text});
    announce('Response received');
  }catch(e){
    thinking.remove();addMsg('ai','(connection error — try again)','error');
  }finally{
    btn.setAttribute('aria-busy','false');btn.disabled=false;
  }
}

async function renderMine(){
  const inp=$('#mine-in');const desc=inp.value.trim();if(!desc)return;
  const btn=$('#mine-btn');btn.setAttribute('aria-busy','true');btn.disabled=true;btn.textContent='↻ rendering…';
  const out=$('#mine-out');out.innerHTML='';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:500,
        system:`A visitor describes their own hard or formative moment. Render it as two sides of a window. Return ONLY JSON, no markdown:
{"label":"short evocative name 2-4 words","virtue":{"cap":"outside view, first person present, under 35 words, no epiphany"},"villain":{"cap":"inside view, first person present, under 35 words, no resolution"}}
No advice. No resolution. Just reflect their moment back as two honest views.`,
        messages:[{role:'user',content:desc}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'{}';
    const p=JSON.parse(text.replace(/```json|```/g,'').trim());
    out.innerHTML=`
      <div class="card" style="border-color:rgba(255,191,0,.3);background:rgba(255,191,0,.04);margin-bottom:10px">
        <span class="pill pill-virtue" style="margin-bottom:10px;display:inline-block">↗ ${esc(p.label||'your window')} — outward</span>
        <p style="font-family:'Literata', Georgia, serif;font-size:16px;line-height:1.65;color:var(--paper)">${esc(p.virtue?.cap||'')}</p>
      </div>
      <div class="card" style="border-color:rgba(255,180,171,.3);background:rgba(255,180,171,.04)">
        <span class="pill pill-villain" style="margin-bottom:10px;display:inline-block">↙ inward</span>
        <p style="font-family:'Literata', Georgia, serif;font-size:16px;line-height:1.65;color:var(--paper)">${esc(p.villain?.cap||'')}</p>
      </div>`;
    announce('Your window rendered');
  }catch(e){
    out.innerHTML=`<p style="color:#ffb4ab;font-family:'Literata', Georgia, serif;font-size:14px">Couldn't render — try again.</p>`;
  }finally{
    btn.setAttribute('aria-busy','false');btn.disabled=false;btn.textContent='↯ Render my window';
  }
}

// ── Outside AI: Parse ──────────────────────────────────────────────
async function parseMemory(){
  const inp=$('#ai-in').value.trim();if(!inp)return;
  const btn=$('#parse-btn');btn.setAttribute('aria-busy','true');btn.disabled=true;btn.textContent='↻ parsing…';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:1000,
        system:`Parse a raw memory into a structured moment. Return ONLY JSON, no markdown:
{"label":"2-4 words","date":"year","tags":["t1","t2","t3"],"thread":"rupture|formation|construction|emergence|parallel","virtue":{"cap":"outside, first person present, <40 words, no epiphany","env":"image-gen descriptors"},"villain":{"cap":"inside, first person present, <40 words, no resolution","room":"emotional state as room — light, objects, door"}}`,
        messages:[{role:'user',content:inp}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'{}';
    const p=JSON.parse(text.replace(/```json|```/g,'').trim());
    if(p.label)$('#f-label').value=p.label;
    if(p.date)$('#f-date').value=p.date;
    if(p.thread&&$('#f-thread'))$('#f-thread').value=p.thread;
    if(p.virtue?.cap)$('#v-cap').value=p.virtue.cap;
    if(p.virtue?.env)$('#v-env').value=p.virtue.env;
    if(p.villain?.cap)$('#l-cap').value=p.villain.cap;
    if(p.villain?.room)$('#l-room').value=p.villain.room;
    btn.textContent='✓ parsed';announce('Fields populated from memory');
    setTimeout(()=>{btn.textContent='↯ Parse with AI';},2200);
  }catch(e){
    btn.textContent='✗ retry';setTimeout(()=>btn.textContent='↯ Parse with AI',2400);
  }finally{
    btn.setAttribute('aria-busy','false');btn.disabled=false;
  }
}

// ── Outside AI: Scripts ────────────────────────────────────────────
async function writeScripts(){
  const m=M[cur];
  const vCap=$('#v-cap')?.value||m.virtue.cap;
  const lCap=$('#l-cap')?.value||m.villain.cap;
  const btn=$('#script-btn');btn.setAttribute('aria-busy','true');btn.disabled=true;btn.textContent='↻ writing…';
  const out=$('#script-out');
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:600,
        system:`Write two AI-Kyle narration scripts (virtue + villain) for a memoir window. First person, present tense, under 45 seconds spoken (~80 words each). No epiphanies, no "I realized," no recovery language. Declarative, sensory, honest. Return ONLY JSON: {"virtue":"...","villain":"..."}`,
        messages:[{role:'user',content:`Moment: ${m.label} (${m.date})\nOutside: ${vCap}\nInside: ${lCap}`}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'{}';
    const p=JSON.parse(text.replace(/```json|```/g,'').trim());
    out.innerHTML=`
      <div class="field"><label>Virtue script (↗ outward)</label><textarea>${esc(p.virtue||'')}</textarea></div>
      <div class="field"><label>Villain script (↙ inward)</label><textarea>${esc(p.villain||'')}</textarea></div>
      <p class="hint" style="margin-top:6px">Send to ElevenLabs + HeyGen for AI-Kyle video.</p>`;
    announce('Scripts generated');
    btn.textContent='✓ done';setTimeout(()=>btn.textContent='↯ Generate narration scripts',2200);
  }catch(e){
    out.innerHTML=`<p style="color:#ffb4ab;font-family:'Literata', Georgia, serif;font-size:14px">Couldn't generate — try again.</p>`;
    btn.textContent='✗ retry';setTimeout(()=>btn.textContent='↯ Generate narration scripts',2400);
  }finally{
    btn.setAttribute('aria-busy','false');btn.disabled=false;
  }
}

function openNew(){
  M.push({id:'new-'+Date.now(),label:'New Moment',date:'',status:'draft',thread:'rupture',pos:0,
    tags:[],virtue:{cap:'',env:''},villain:{cap:'',room:''},
    media:{vi:0,li:0,vv:0,lv:0,va:0,la:0}});
  setActive(M.length-1);
}

// ── Init ───────────────────────────────────────────────────────────
renderSidebar();renderCreator();
</script>
