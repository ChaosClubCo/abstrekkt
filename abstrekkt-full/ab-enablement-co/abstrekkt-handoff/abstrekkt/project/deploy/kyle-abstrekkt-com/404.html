<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Kyle Rosebrook</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Crimson+Pro:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #101216; --surface: #16181d; --border: rgba(242,239,231,0.09); --paper: #f2efe7; --paper-dim: #a9a599; --paper-faint: #6b675c; --ember-bright: #de7449; }
  * { box-sizing: border-box; }
  body { background: var(--ink); color: var(--paper); font-family: 'Crimson Pro', Georgia, serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }
  .card { max-width: 480px; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--paper-faint); margin: 0 0 24px; }
  .kicker b { color: var(--ember-bright); font-weight: 500; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 2.4rem; font-weight: 700; line-height: 1.1; margin: 0 0 14px; }
  p { font-size: 1.1rem; line-height: 1.65; color: var(--paper-dim); margin: 0 0 32px; }
  nav { display: flex; gap: 24px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; }
  a { color: var(--ember-bright); text-decoration: none; }
  a:hover { color: var(--paper); text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <p class="kicker"><b>ABSTREKKT</b> · 404</p>

  <nav aria-label="Site sections"><a href="/">Home</a><a href="/playbook">Playbook</a><a href="/press">Press kit</a></nav>
</div>
</body>
