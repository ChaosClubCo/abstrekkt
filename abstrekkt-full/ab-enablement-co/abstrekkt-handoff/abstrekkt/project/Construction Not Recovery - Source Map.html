<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Construction, Not Recovery — Memoir Source Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Literata:opsz,wght@7..72,400;7..72,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#131315; --carbon:#0A0A0C;
  --s-lowest:#0e0e10; --s-low:#1c1b1d; --s:#201f21; --s-high:#2a2a2c; --s-highest:#353437;
  --ink:#e5e1e4; --ink-var:#d4c5ab;
  --outline:#9c8f78; --outline-var:#504532;
  --amber:#ffbf00; --amber-lt:#ffe2ab; --amber-dim:#fbbc00;
  --blue:#a9c7ff; --blue-c:#026bd2;
  --error:#ffb4ab;
  --sand:#d4c5ab; --grey:#bdb6c0;
  --garamond:'EB Garamond',Georgia,serif;
  --body:'Literata',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ghost:color-mix(in srgb, var(--outline-var) 20%, transparent);
  /* category colors */
  --c-thesis:#ffbf00; --c-subject:#e5e1e4; --c-evidence:#a9c7ff;
  --c-history:#c9a86a; --c-build:#d4c5ab; --c-craft:#bdb6c0;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%; overflow:hidden;}
body{background:var(--bg); color:var(--ink); font-family:var(--body); -webkit-font-smoothing:antialiased;}
.grain{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size:160px;}
.vignette{position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.5));}

.shell{position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;}

/* masthead */
.mast{padding:18px 28px 14px; border-bottom:1px solid var(--ghost); display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; background:color-mix(in srgb,var(--carbon) 70%,transparent);}
.mast-l .kick{font-family:var(--mono); font-size:10.5px; letter-spacing:.22em; color:var(--amber-dim); margin-bottom:7px;}
.mast-l h1{font-family:var(--garamond); font-weight:500; font-size:27px; letter-spacing:-.01em; margin:0; line-height:1;}
.mast-l h1 em{font-style:italic; color:var(--ink-var);}
.mast-l .sub{font-family:var(--mono); font-size:11px; color:var(--outline); margin-top:7px; letter-spacing:.03em;}
.mast-r{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
.tool{font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--outline); background:var(--s-lowest); border:1px solid var(--ghost); padding:7px 12px; cursor:pointer; transition:all .15s; white-space:nowrap;}
.tool:hover{color:var(--ink); border-color:var(--outline);}
.tool.primary{color:var(--on-amber); background:var(--amber); border-color:var(--amber); font-weight:700;}
.tool.on{color:var(--amber); border-color:color-mix(in srgb,var(--amber) 55%,transparent); background:color-mix(in srgb,var(--amber) 12%,transparent);}
.tool.primary:hover{background:var(--amber-lt); border-color:var(--amber-lt); color:var(--on-amber);}
.spread{display:flex; align-items:center; gap:8px; padding-right:6px;}
.spread-l{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; color:var(--outline);}
.spread input[type=range]{-webkit-appearance:none; appearance:none; width:96px; height:2px; background:var(--outline-var); outline:none; cursor:pointer;}
.spread input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px; background:var(--amber); border:2px solid var(--carbon); cursor:grab;}
.spread input[type=range]::-moz-range-thumb{width:13px; height:13px; background:var(--amber); border:2px solid var(--carbon); cursor:grab; border-radius:0;}
@media(max-width:760px){ .mast{padding:14px 18px 12px;} .mast-l h1{font-size:20px;} .mast-l .sub{font-size:10px;} .tool{font-size:10px; padding:6px 9px;} .spread{display:none;} }

.main{flex:1; display:flex; min-height:0; position:relative;}

/* board = scroll viewport; canvas = the (min-sized) graph surface */
.board{position:relative; flex:1; min-width:0; overflow:auto; cursor:grab;}
.canvas{position:relative;}
.board.panning{cursor:grabbing;}
.edges{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
.edge-line{stroke:var(--outline); stroke-opacity:.16; stroke-width:1; transition:stroke-opacity .2s, stroke .2s, stroke-width .2s;}
.edge-line.primary{stroke:var(--amber-dim); stroke-opacity:.32;}
.edge-line.dim{stroke-opacity:.05;}
.edge-line.lit{stroke:var(--amber); stroke-opacity:.9; stroke-width:1.6;}
.edge-line.lit.evd{stroke:var(--blue); stroke-opacity:.9;}
.edge-hit{stroke:transparent; stroke-width:14; cursor:pointer;}
.edge-dot{fill:var(--amber); opacity:0;}

.node{position:absolute; transform:translate(-50%,-50%); width:172px; background:var(--s-lowest);
  border:1px solid var(--ghost); border-left:2px solid var(--cat,var(--outline)); padding:10px 12px 11px;
  cursor:grab; user-select:none; transition:box-shadow .18s, border-color .18s, opacity .2s, background .18s; touch-action:none;}
.node:hover{background:var(--s-low); box-shadow:0 14px 34px -18px rgba(0,0,0,.8);}
.node.dragging{cursor:grabbing; z-index:20; box-shadow:0 22px 50px -20px rgba(0,0,0,.9);}
.node.sel{border-color:var(--cat); box-shadow:0 0 0 1px var(--cat), 0 18px 40px -18px rgba(0,0,0,.85); background:var(--s-low);}
.node.faded{opacity:.26;}
.node.neighbor{opacity:1;}
.node .ntag{font-family:var(--mono); font-size:8.5px; letter-spacing:.12em; color:var(--cat,var(--outline)); margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;}
.node .ndeg{color:var(--outline); opacity:.7;}
.node .nlabel{font-family:var(--garamond); font-weight:600; font-size:15px; line-height:1.12; letter-spacing:-.01em; color:var(--ink);}
.node.small{width:150px;}
.node.hub .nlabel{font-size:16.5px;}

/* edge tooltip */
.etip{position:absolute; transform:translate(-50%,-115%); z-index:30; max-width:240px; background:var(--carbon);
  border:1px solid color-mix(in srgb,var(--amber) 30%,transparent); border-left:2px solid var(--amber); padding:9px 11px;
  font-family:var(--mono); font-size:10.5px; line-height:1.5; color:var(--ink-var); pointer-events:none; box-shadow:0 16px 40px -18px rgba(0,0,0,.9);}
.etip.evd{border-color:color-mix(in srgb,var(--blue) 30%,transparent); border-left-color:var(--blue);}
.etip b{color:var(--ink); font-weight:700;}

/* panel — right overlay drawer (board keeps full width) */
.panel{position:absolute; top:0; right:0; bottom:0; width:352px; max-width:88%; z-index:40; border-left:1px solid var(--outline-var); background:var(--s-lowest); overflow-y:auto; padding:22px 22px 40px; box-shadow:-34px 0 80px -36px rgba(0,0,0,.85); animation:drawer .26s cubic-bezier(.2,.7,.2,1);}
@keyframes drawer{from{transform:translateX(40px); opacity:.3;}to{transform:none; opacity:1;}}
@media(max-width:860px){
  .main{position:relative;}
  .panel{position:absolute; left:0; right:0; bottom:0; top:auto; width:auto; max-width:none; max-height:64%; border-left:none; border-top:1px solid var(--outline-var);
    box-shadow:0 -24px 60px -28px rgba(0,0,0,.9); z-index:40; border-radius:2px 2px 0 0; animation:sheet .28s cubic-bezier(.2,.7,.2,1); padding-top:26px;}
  .panel::before{content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:38px; height:3px; border-radius:3px; background:var(--outline-var);}
}
@keyframes sheet{from{transform:translateY(100%);}to{transform:translateY(0);}}

/* floating intro / legend card */
.boardhint{position:absolute; left:18px; bottom:18px; z-index:22; width:320px; max-width:calc(100% - 36px);
  border:1px solid var(--ghost); border-top:2px solid var(--amber-dim); padding:16px 18px 15px; background:color-mix(in srgb,var(--carbon) 88%,transparent); backdrop-filter:blur(10px);}
.bh-kick{font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--amber-dim); margin-bottom:9px;}
.bh-p{font-size:12.5px; line-height:1.55; color:var(--ink-var); margin:0 0 13px;}
.bh-p b{color:var(--ink);}
.bh-sub{font-family:var(--mono); font-size:10.5px; line-height:1.5; color:var(--outline); margin:9px 0 0;}
.boardhint .addbtn{margin-top:0;}
.bh-legend{display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:13px; padding-top:12px; border-top:1px solid var(--ghost);}
.bh-legend .lg{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; color:var(--outline);}
.bh-legend .sw{width:9px; height:9px; background:var(--lc); flex-shrink:0;}
.panel-empty .pe-kick{font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--amber-dim); margin-bottom:12px;}
.panel-empty p{font-size:14px; line-height:1.6; color:var(--ink-var); margin:0 0 14px; max-width:40ch;}
.legend{margin-top:22px; border-top:1px solid var(--ghost); padding-top:16px; display:grid; gap:9px;}
.legend .lg{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11px; color:var(--outline); letter-spacing:.04em;}
.legend .sw{width:11px; height:11px; border-left:2px solid var(--lc); background:var(--s); border-top:1px solid var(--ghost); border-right:1px solid var(--ghost); border-bottom:1px solid var(--ghost);}
.counts{margin-top:18px; display:flex; gap:20px;}
.counts .ct .n{font-family:var(--garamond); font-size:24px; color:var(--amber); font-weight:600;}
.counts .ct .l{font-family:var(--mono); font-size:10px; color:var(--outline); letter-spacing:.1em;}

/* node detail */
.nd-tag{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--cat); margin-bottom:9px; display:flex; justify-content:space-between;}
.nd-cat{color:var(--outline);}
.nd-title{font-family:var(--garamond); font-weight:600; font-size:25px; line-height:1.12; letter-spacing:-.015em; margin:0 0 10px;}
.nd-blurb{font-size:14px; line-height:1.62; color:var(--ink-var); margin:0 0 20px;}
.nd-h{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--outline); margin:0 0 12px; display:flex; align-items:center; gap:10px;}
.nd-h::after{content:""; flex:1; height:1px; background:var(--ghost);}
.conn{display:block; width:100%; text-align:left; background:var(--carbon); border:1px solid var(--ghost); border-left:2px solid var(--cc,var(--outline-var));
  padding:11px 13px; margin-bottom:9px; cursor:pointer; transition:border-color .15s, background .15s;}
.conn:hover{background:var(--s-low); border-left-color:var(--amber);}
.conn .ct{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; color:var(--outline); margin-bottom:5px; letter-spacing:.03em;}
.conn .arrow{color:var(--amber-dim);}
.conn .cn{display:block; font-family:var(--garamond); font-size:15.5px; font-weight:600; color:var(--ink);}
.conn .cr{display:block; font-size:12.5px; line-height:1.5; color:var(--ink-var); margin-top:5px;}
.back{font-family:var(--mono); font-size:11px; color:var(--amber-dim); background:none; border:none; padding:0; cursor:pointer; margin-bottom:16px; letter-spacing:.04em;}
.back:hover{color:var(--ink);}

/* edge detail note */
.en-kick{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--amber-dim); margin-bottom:14px;}
.en-kick.evd{color:var(--blue);}
.en-pair{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.en-chip{font-family:var(--garamond); font-size:16px; font-weight:600; background:var(--carbon); border:1px solid var(--ghost); border-left:2px solid var(--ec); padding:6px 11px;}
.en-rel{font-family:var(--mono); font-size:11px; color:var(--amber-dim); letter-spacing:.06em;}
.en-reason{font-family:var(--garamond); font-size:19px; line-height:1.5; color:var(--ink); margin:0; padding:16px 0 0; border-top:1px solid var(--ghost);}

.node.added{border-style:dashed;}
.node.added .nlabel{color:var(--blue);}
.edge-line.ai{stroke-dasharray:5 4;}
.edge-line.ai.lit{stroke:var(--blue); stroke-opacity:.9;}

/* dropzone overlay on board */
.board.dropping{background:color-mix(in srgb,var(--blue-c) 9%, transparent);}
.dropmsg{position:absolute; inset:14px; z-index:45; border:1.5px dashed color-mix(in srgb,var(--blue) 55%,transparent); display:flex; align-items:center; justify-content:center; pointer-events:none; background:color-mix(in srgb,var(--carbon) 30%,transparent);}
.dropmsg-in{font-family:var(--mono); font-size:13px; letter-spacing:.06em; color:var(--blue); background:var(--carbon); padding:12px 18px; border:1px solid color-mix(in srgb,var(--blue) 40%,transparent);}

/* add buttons in panel */
.addbtn{display:block; width:100%; margin-top:20px; background:var(--amber); color:var(--on-amber); border:none; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.05em; padding:11px; cursor:pointer; transition:background .15s;}
.addbtn:hover{background:var(--amber-lt);}

/* intake modal */
.intake-scrim{position:fixed; inset:0; z-index:60; background:rgba(5,5,7,.7); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;}
.intake{width:560px; max-width:100%; background:var(--s-low); border:1px solid var(--outline-var); border-top:2px solid var(--blue); box-shadow:0 40px 100px -40px rgba(0,0,0,.9); padding:22px 24px 26px; margin:auto;}
.intake-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.intake-kick{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--blue);}
.intake-lead{font-size:14px; line-height:1.6; color:var(--ink-var); margin:0 0 18px;}
.intake-note{font-family:var(--mono); font-size:11px; color:var(--outline); margin:12px 0 0; line-height:1.5;}
.intake-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
.intake-actions .tool{padding:9px 16px;}
.tool:disabled{opacity:.4; cursor:not-allowed;}

/* dropzone in modal */
.drop{border:1.5px dashed var(--outline-var); padding:30px 20px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s;}
.drop:hover{border-color:var(--blue); background:var(--s-lowest);}
.drop-g{font-size:30px; color:var(--outline); margin-bottom:10px;}
.drop-t{font-family:var(--garamond); font-size:16px; color:var(--ink); margin-bottom:5px;}
.drop-s{font-family:var(--mono); font-size:10.5px; color:var(--outline); letter-spacing:.03em;}

/* fields */
.fld{margin-top:16px;}
.fld label{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.13em; color:var(--outline); margin-bottom:6px;}
.fld .req{color:var(--error); letter-spacing:.03em; margin-left:6px;}
.in,.ta{width:100%; background:var(--carbon); border:1px solid var(--outline-var); color:var(--ink); font-family:var(--body); font-size:14px; padding:9px 11px;}
.in:focus,.ta:focus{outline:none; border-color:var(--blue);}
select.in{font-family:var(--mono); font-size:12px;}
.ta{resize:vertical; min-height:64px; line-height:1.5;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

/* analyzing */
.analyzing{text-align:center; padding:34px 10px 30px;}
.scan{width:100%; height:3px; background:linear-gradient(90deg,transparent,var(--blue),transparent); background-size:50% 100%; animation:scan 1.1s linear infinite; margin-bottom:22px;}
@keyframes scan{0%{background-position:-60% 0;}100%{background-position:160% 0;}}
.analyzing-t{font-family:var(--garamond); font-size:18px; color:var(--ink); margin-bottom:8px;}
.analyzing-s{font-size:10.5px; color:var(--outline); letter-spacing:.08em;}

/* review */
.review-flag{font-family:var(--mono); font-size:11px; color:var(--blue); background:color-mix(in srgb,var(--blue-c) 14%,transparent); border-left:2px solid var(--blue); padding:9px 12px; margin-bottom:16px; line-height:1.5;}
.review-flag.warn{color:var(--error); border-left-color:var(--error); background:color-mix(in srgb,var(--error-c) 16%,transparent);}
.conn-h{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; color:var(--outline); margin:22px 0 12px; display:flex; justify-content:space-between;}
.conn-h span{color:var(--blue);}
.conn-edit{background:var(--carbon); border:1px solid var(--ghost); border-left:2px solid var(--blue); padding:12px; margin-bottom:10px;}
.conn-edit.off{opacity:.45; border-left-color:var(--outline-var);}
.conn-edit-top{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.conn-edit-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.chk{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:var(--outline); white-space:nowrap; cursor:pointer;}
.chk.evd{color:var(--blue);}
.chk input,.conn-edit input[type=checkbox]{accent-color:var(--blue);}
.in.sm{font-size:12px; padding:6px 8px;}
.in.kind{flex:1;}
.ai-tag{color:var(--blue); font-size:13px; margin-left:auto;}
.ta.reason{min-height:48px; font-size:13px;}
.addconn{background:none; border:1px dashed var(--outline-var); color:var(--outline); font-family:var(--mono); font-size:11px; padding:8px 12px; cursor:pointer; width:100%; transition:all .15s;}
.addconn:hover{border-color:var(--blue); color:var(--blue);}
@media(max-width:560px){ .intake{padding:18px;} .grid2{grid-template-columns:1fr;} }

/* node panel — tabbed */
.np-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
.np-tag{font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--tc); border:1px solid color-mix(in srgb,var(--tc) 45%,transparent); padding:2px 7px;}
.np-status{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--sc); border:1px solid color-mix(in srgb,var(--sc) 45%,transparent); padding:2px 7px; white-space:nowrap;}
.np-title{font-family:var(--garamond); font-weight:600; font-size:25px; line-height:1.14; letter-spacing:-.015em; margin:0 0 6px;}
.np-cat{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:var(--tc); margin-bottom:14px;}
.np-era{color:var(--outline); letter-spacing:.04em;}
.np-protect{background:color-mix(in srgb,var(--error-c) 20%, var(--s-lowest)); border:1px solid color-mix(in srgb,var(--error) 32%,transparent); border-left:2px solid var(--error); padding:11px 13px; margin-bottom:14px;}
.npp-kick{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--error); display:block; margin-bottom:5px;}
.np-protect p{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink-var);}

.np-tabs{display:flex; gap:2px; margin-bottom:16px; border-bottom:1px solid var(--ghost);}
.np-tab{position:relative; background:none; border:none; color:var(--outline); font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:8px 10px; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .14s;}
.np-tab:hover{color:var(--ink-var);}
.np-tab.on{color:var(--amber-lt); border-bottom-color:var(--amber);}
.np-badge{font-style:normal; font-size:9px; color:var(--error); margin-left:4px; vertical-align:top;}
.np-body{animation:npfade .2s ease;}
@keyframes npfade{from{opacity:0; transform:translateY(3px);}to{opacity:1;}}

.np-blurb{font-size:14.5px; line-height:1.62; color:var(--ink-var); margin:0 0 14px;}
.np-note{font-size:12.5px; line-height:1.55; color:var(--outline); font-style:italic; margin:0 0 14px;}
.np-stakes{background:var(--s-lowest); border-left:2px solid var(--amber); padding:10px 13px; margin-bottom:16px;}
.nps-kick{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--amber-dim); display:block; margin-bottom:5px;}
.np-stakes p{margin:0; font-size:13px; line-height:1.55; color:var(--ink);}

.conn-h{display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--outline); margin:0 0 10px; padding-top:2px;}
.conn-h span{color:var(--amber-dim);}
.np-conns{display:flex; flex-direction:column; gap:7px;}
.np-conn{display:grid; grid-template-columns:1fr; gap:3px; text-align:left; background:var(--s-lowest); border:1px solid var(--ghost); border-left:2px solid var(--outline-var); padding:9px 11px; color:var(--ink); transition:border-color .14s, background .14s;}
.np-conn:hover{background:var(--s-low); border-left-color:var(--outline);}
.np-conn.evd{border-left-color:var(--blue);}
.np-conn.ai{border-left-style:dashed;}
.npc-rel{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; color:var(--outline);}
.npc-other{font-family:var(--garamond); font-size:15px; font-weight:600; color:var(--oc);}
.npc-reason{font-size:12px; line-height:1.5; color:var(--ink-var);}

.np-meta{display:grid; gap:8px; margin-bottom:16px;}
.npm{display:flex; justify-content:space-between; gap:14px; font-size:12.5px; border-bottom:1px solid var(--ghost); padding-bottom:7px;}
.npm-k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--outline);}
.npm-v{color:var(--ink-var); text-align:right;}
.np-refs{margin-bottom:16px;}
.npr-kick{font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--outline); display:block; margin-bottom:7px;}
.npr-list{display:flex; flex-wrap:wrap; gap:6px;}
.npr{font-family:var(--mono); font-size:10.5px; color:var(--blue); border:1px solid color-mix(in srgb,var(--blue) 30%,transparent); background:color-mix(in srgb,var(--blue-c) 12%,transparent); padding:2px 7px;}
.np-beats{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px;}
.np-beats li{position:relative; padding-left:16px; font-size:13.5px; line-height:1.55; color:var(--ink-var); font-family:var(--garamond);}
.np-beats li::before{content:"—"; position:absolute; left:0; color:var(--amber-dim);}

.np-contra{background:var(--s-lowest); border:1px solid color-mix(in srgb,var(--amber) 22%,transparent); border-left:2px solid var(--amber); padding:11px 13px; margin-bottom:10px;}
.npx-head{display:flex; align-items:flex-start; gap:9px; margin-bottom:7px; line-height:1.3;}
.npx-mark{font-family:var(--mono); color:var(--amber); font-size:15px;}
.npx-with{background:none; border:none; padding:0; text-align:left; font-family:var(--garamond); font-size:15px; line-height:1.3; font-weight:600; color:var(--oc,var(--ink)); text-decoration:underline; text-decoration-color:color-mix(in srgb,currentColor 40%,transparent); text-underline-offset:3px; cursor:pointer;}
.npx-note{margin:0; font-size:12.5px; line-height:1.55; color:var(--ink-var);}

.np-chaps{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
.np-chap{font-family:var(--mono); font-size:10.5px; letter-spacing:.03em; color:var(--ink-var); border:1px solid var(--ghost); background:var(--s-lowest); padding:3px 8px;}
.np-open{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
.np-open li{position:relative; padding-left:18px; font-size:13px; line-height:1.5; color:var(--ink-var);}
.np-open li::before{content:"?"; position:absolute; left:0; top:-1px; font-family:var(--mono); color:var(--amber-dim); font-weight:700;}

/* help overlay */
.help-scrim{position:fixed; inset:0; z-index:70; background:rgba(5,5,7,.7); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:24px;}
.help-card{width:480px; max-width:100%; background:var(--s-low); border:1px solid var(--outline-var); border-top:2px solid var(--amber-dim); box-shadow:0 40px 100px -40px rgba(0,0,0,.9); padding:20px 22px;}
.help-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.help-kick{font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--amber-dim);}
.help-row{display:grid; grid-template-columns:172px 1fr; gap:14px; padding:8px 0; border-top:1px solid var(--ghost); font-size:13.5px;}
.help-k{font-family:var(--mono); font-size:11.5px; color:var(--amber-lt);}
.help-v{color:var(--ink-var); line-height:1.45;}
.help-foot{margin-top:14px; padding-top:12px; border-top:1px solid var(--ghost); display:flex; flex-direction:column; gap:10px; font-size:12px; color:var(--outline);}
.help-foot .hp{color:var(--amber-lt);} .help-foot .hb{color:var(--blue);}
.help-link{font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--amber-dim); text-decoration:none;}
.help-link:hover{color:var(--amber-lt);}
@media(max-width:560px){ .help-row{grid-template-columns:1fr; gap:3px;} }

/* corpus disposition ledger */
.corpus-card{background:var(--s-low); border:1px solid var(--outline-var); box-shadow:0 40px 90px -30px rgba(0,0,0,.85); width:min(760px,94vw); max-height:88vh; overflow-y:auto; padding:24px 26px;}
.corpus-lede{font-size:13.5px; line-height:1.6; color:var(--ink-var); margin:6px 0 20px; max-width:70ch;}
.corpus-lede b{color:var(--ink);} .corpus-lede code{font-family:var(--mono); font-size:11.5px; color:var(--amber-lt);}
.corpus-bars{display:grid; gap:14px; margin-bottom:24px;}
.cbar-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:6px;}
.cbar-k{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--cc); white-space:nowrap;}
.prot-foot{margin-top:22px; padding-top:18px; border-top:1px solid var(--ghost);}
.prot-cols{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:8px;}
@media(max-width:640px){ .prot-cols{grid-template-columns:1fr;} }
.cbar-n{font-size:15px; color:var(--ink); font-weight:600;}
.cbar-track{height:6px; background:var(--s-lowest); border:1px solid var(--ghost); overflow:hidden;}
.cbar-track > span{display:block; height:100%;}
.cbar-note{font-size:12px; line-height:1.5; color:var(--outline); margin-top:6px; max-width:74ch;}
.corpus-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
@media(max-width:600px){ .corpus-grid{grid-template-columns:1fr;} }
.corpus-h{font-family:var(--mono); font-size:10px; letter-spacing:.13em; color:var(--outline); margin:0 0 9px; padding-top:6px;}
.corpus-h.alert{color:var(--amber);}
.corpus-list{margin:0 0 16px; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
.corpus-list li{font-size:12.5px; line-height:1.5; color:var(--ink-var); padding-left:15px; position:relative;}
.corpus-list li::before{position:absolute; left:0; top:0;}
.cok::before{content:"✓"; color:var(--blue);}
.cwarn::before{content:"⚑"; color:var(--amber-dim);}
.creview{display:flex; flex-direction:column; gap:2px; padding-left:0 !important;}
.creview b{color:var(--amber-lt); font-size:12px;}
.creview span{color:var(--outline); font-size:11.5px; line-height:1.45;}
.crv-top{display:flex; align-items:center; gap:8px; margin-bottom:2px;}
.crv-chip{font-family:var(--mono); font-size:9px; letter-spacing:.1em; padding:2px 6px; border-radius:2px; text-transform:uppercase; flex:none;}
.crv-keep{color:var(--blue); background:color-mix(in srgb,var(--blue) 16%,transparent);}
.crv-archive{color:var(--outline); background:color-mix(in srgb,var(--outline) 18%,transparent);}
.crv-rewrite{color:var(--amber); background:color-mix(in srgb,var(--amber) 15%,transparent);}
.crv-relane{color:var(--amber-lt); background:color-mix(in srgb,var(--amber) 11%,transparent);}
.corpus-finding{font-size:12.5px; line-height:1.6; color:var(--ink-var); margin:0 0 16px; padding:11px 13px; background:color-mix(in srgb,var(--amber) 8%,var(--s-lowest)); border-left:2px solid var(--amber);}

::-webkit-scrollbar{width:9px;} ::-webkit-scrollbar-thumb{background:#22232f; border-radius:8px; border:2px solid var(--s-lowest);}
@media(prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
