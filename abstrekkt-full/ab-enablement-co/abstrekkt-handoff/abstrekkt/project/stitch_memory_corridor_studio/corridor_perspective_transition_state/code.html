<script>
    // 3D Flip Toggle
    const sceneCard = document.getElementById('sceneCard');
    const toggles = document.querySelectorAll('.perspective-toggle');
    
    toggles.forEach(toggle => {
        toggle.addEventListener('click', () => {
            sceneCard.classList.toggle('flipped');
        });
    });

    // Inactivity Timer for Micro-labels
    const microLabels = document.querySelectorAll('.micro-label');
    let inactivityTimer;
    
    function resetInactivityTimer() {
        microLabels.forEach(label => label.style.opacity = '1');
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => {
            microLabels.forEach(label => label.style.opacity = '0.2');
        }, 3000);
    }

    // Initialize timer and set up listeners
    resetInactivityTimer();
    ['mousemove', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
        document.addEventListener(evt, resetInactivityTimer);
    });

    // Horizontal Parallax on Drag/Swipe/Mousemove
    let isDragging = false;
    let startX;
    const bgLayers = document.querySelectorAll('.bg-layer');
    const midLayers = document.querySelectorAll('.mid-layer'); // Note: Added class if mid layers exist, otherwise just applies to parallax layers
    const parallaxLayers = document.querySelectorAll('.parallax-layer');

    function applyParallax(deltaX) {
        // Background moves at 30% speed
        bgLayers.forEach(layer => {
            layer.style.transform = `translateX(${deltaX * 0.3}px)`;
        });
        
        // General subtle parallax for depth (retained from original)
        parallaxLayers.forEach(layer => {
            layer.style.transform = `translate(${deltaX * 0.1}px, 0px)`;
        });
    }

    // Mouse movement parallax
    document.addEventListener('mousemove', (e) => {
        if (isDragging) return; // Prioritize drag
        const x = (window.innerWidth / 2 - e.pageX) / 20;
        applyParallax(x);
    });

    // Touch/Drag parallax
    document.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.pageX;
    });
    
    document.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].pageX;
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.pageX - startX;
        applyParallax(deltaX);
    });

    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const deltaX = e.touches[0].pageX - startX;
        applyParallax(deltaX);
    });

    document.addEventListener('mouseup', () => { isDragging = false; applyParallax(0); });
    document.addEventListener('touchend', () => { isDragging = false; applyParallax(0); });

</script>
