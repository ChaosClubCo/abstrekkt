<style>

            z-index: 9999;
            opacity: 0.04;

<body class="font-body-lg text-body-lg bg-background text-on-background selection:bg-primary-container selection:text-on-primary-container">

<script>
        // Simple script to handle icon filling based on data-weight attribute
        document.addEventListener('DOMContentLoaded', () => {
            const icons = document.querySelectorAll('.material-symbols-outlined');
            icons.forEach(icon => {
                if (icon.getAttribute('data-weight') === 'fill') {
                    icon.classList.add('filled');
                }
            });
        });
    </script>
