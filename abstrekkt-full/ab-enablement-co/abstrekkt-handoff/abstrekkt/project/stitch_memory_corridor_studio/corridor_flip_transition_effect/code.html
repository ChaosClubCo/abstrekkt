<style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .rotate-y-45 {
            transform: rotateY(45deg);
        }
        .motion-blur {
            filter: blur(8px) contrast(1.2);
            opacity: 0.8;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .glow-sm {
            text-shadow: 0 0 10px rgba(255, 220, 161, 0.5);

        body {

            background-image:

                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');

<body class="text-on-background h-screen w-screen flex items-center justify-center relative perspective-1000">
<!-- Ambient Light Spill (Villain Side) -->
<div class="absolute top-0 left-0 w-1/2 h-full bg-gradient-to-r from-error/10 to-transparent pointer-events-none mix-blend-screen opacity-50 transition-opacity duration-700"></div>
<!-- Ambient Light Spill (Virtue Side) -->

<!-- Top Navigation Anchor (Shared Component Semantic) -->
<!-- Suppressed: Top Nav is suppressed on this transitional state as it's a linear/cinematic sequence -->
<!-- The Corridor / Frame Pivot -->
<main class="w-full max-w-container-max px-margin-mobile md:px-margin-desktop h-full flex items-center justify-center relative preserve-3d">
<!-- Rotating Frame Container -->
<div class="relative w-[80vw] h-[716px] md:w-[60vw] md:h-[819px] preserve-3d rotate-y-45 transition-transform duration-[600ms] ease-in-out" id="corridor-frame">
<!-- Left Side (Villains - Fading Out/Blurring) -->
<div class="absolute inset-0 bg-surface-container-lowest border-l border-t border-b border-outline-variant/30 overflow-hidden shadow-2xl preserve-3d backface-hidden rounded-l-xl motion-blur" style="transform: rotateY(180deg) translateZ(1px);">
<div class="absolute inset-0 bg-surface-variant/80 backdrop-blur-2xl"></div>
<img class="w-full h-full object-cover opacity-40 mix-blend-luminosity" data-alt="A dark, cinematic interior of a ruined castle room, representing Villains. Heavy shadows, cold blue and subtle crimson lighting. Worn stone textures and a sense of isolation. The overall aesthetic is Dark Editorial, high contrast, atmospheric bloom." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCoxULt0mrDfoI4ktijKIRFVrfHt8MjYF6Lsmjh0LaWNvWCu-ODAqfuPO6LrFsdl0-CqRrWTPE1fBET0PIiG0zjPBURe0flDxSZr2qaA83dIh4bUMcqespt4XFrZpLJhIuwYzC9GviE3GlihyLSay1RLRuF1t_iXeUn2nPtEdZ1prkI29mU0snXUyr7FSs1b65TO5GDaUa4745XbkOwqFXj4w9STpsHB-laUNIEw89JmVTguf7Oby6mQDgGHw6VFxg9r-gv_3_bXo"/>
<div class="absolute inset-0 flex flex-col justify-center items-center text-center p-8">
<h2 class="font-display-lg text-display-lg-mobile md:text-display-lg text-error tracking-tighter opacity-70">Descent</h2>
</div>
</div>
<!-- Front Frame (The Anchor/Thickness) -->
<!-- Simulating depth in the rotating frame -->
<div class="absolute right-0 top-0 w-8 h-full bg-surface-container border-y border-r border-outline/20 origin-left shadow-[inset_4px_0_12px_rgba(0,0,0,0.8)] flex flex-col justify-between py-8 items-center" style="transform: rotateY(90deg) translateZ(0px);">
<!-- Frame Details -->
<div class="w-px h-12 bg-primary/30"></div>
<span class="font-caption-tech text-caption-tech text-primary/40 -rotate-90 origin-center tracking-[0.2em] whitespace-nowrap">TRANSITION SEQUENCE 01</span>
<div class="w-px h-12 bg-primary/30"></div>
</div>
<!-- Right Side (Virtues - Coming into Focus) -->
<div class="absolute inset-0 bg-surface-container-lowest border border-outline/50 overflow-hidden shadow-[0_0_40px_rgba(255,220,161,0.1)] preserve-3d motion-blur" style="transform: translateZ(2px);">
<div class="absolute inset-0 bg-gradient-to-tr from-surface to-surface-container-high/40 backdrop-blur-md"></div>
<img class="w-full h-full object-cover opacity-60 mix-blend-lighten" data-alt="A cinematic, sunlit grand hall with tall arches and ethereal light pouring in, representing Virtues. Warm amber glows, high fidelity textures of pristine marble and gold accents. The atmosphere is serene and weighty. Dark Editorial style with glowing light sources." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDnRgY4z2IfQPHEbBZIACMYHmcgT1svTpgeJP5mWqyOs-JmxsgeF_-go7c4WOTitV_EqcgIUOpsJ0EIofO7kA_4RPvPQn3UMAEVj72W6bTjpw5X6x7fW5GmgMtvrvMaOH5SWv9PU_x42M1KUlMomguJDEThCh3BjARl2PvB4yyupFEK0kLLiembf36BTMqH9cFrST0DX37e-qyDiE_QC31zmSY9pjSB2SmQ_TrSx1K7KsddTLnLYmyVCaE0UOcsgBjvxDX6aQ4ZuSQ"/>

<div class="absolute inset-0 flex flex-col justify-center items-center text-center p-8 opacity-80">
<span class="font-caption-tech text-caption-tech text-primary uppercase tracking-[0.3em] mb-4">Entering</span>

</main>
<!-- Navigation Suppressed for this transactional/cinematic view as per Shared Components Logic -->
<script>
        // Micro-interaction: Simulate the completion of the rotate transition
        document.addEventListener('DOMContentLoaded', () => {
            const frame = document.getElementById('corridor-frame');
            const blurElements = document.querySelectorAll('.motion-blur');
            
            // Start the rotation slightly off-center to emphasize the turning motion upon load
            setTimeout(() => {
                // Settle the rotation to look nearly flat, reducing blur to signify arrival
                frame.style.transform = 'rotateY(10deg)';
                blurElements.forEach(el => {
                    el.style.filter = 'blur(0px) contrast(1)';
                    el.style.opacity = '1';
                });
            }, 100);
        });
    </script>
