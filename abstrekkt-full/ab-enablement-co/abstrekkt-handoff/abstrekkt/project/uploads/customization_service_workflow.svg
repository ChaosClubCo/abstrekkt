<svg width="100%" viewBox="0 0 680 640" role="img">
  <title>Customization Service workflow — discovery through handoff</title>
  <desc>Five-stage operational workflow: Discovery, Template Selection, Customization, Delivery, Handoff. Each stage shows inputs, decision gates, and tool integration points.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
  </defs>
  
  
  <g class="node">
    <rect x="40" y="20" width="120" height="56" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"></rect>
    <text x="100" y="40" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="14px" font-weight="500" fill="#0C447C">1. Discovery</text>
    <text x="100" y="56" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="12px" fill="#185FA5">Intake call</text>
  </g>
  <text x="100" y="90" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="12px" font-style="italic" fill="#5F5E5A">30–45 min</text>
  <text x="100" y="108" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#888780">Kyle + Client</text>

  
  <line x1="160" y1="48" x2="200" y2="48" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"></line>

  
  <g class="node">
    <rect x="200" y="20" width="120" height="56" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"></rect>
    <text x="260" y="40" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="14px" font-weight="500" fill="#085041">2. Selection</text>
    <text x="260" y="56" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="12px" fill="#0F6E56">Pick template</text>
  </g>
  <text x="260" y="90" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="12px" font-style="italic" fill="#5F5E5A">5–10 min</text>

  
  <polygon points="320,28 340,48 320,68 300,48" fill="none" stroke="#5F5E5A" stroke-width="1.5" opacity="0.6"></polygon>
  <text x="320" y="52" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">Which?</text>

  
  <line x1="340" y1="48" x2="380" y2="48" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"></line>

  
  <g class="node">
    <rect x="380" y="20" width="120" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"></rect>
    <text x="440" y="40" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="14px" font-weight="500" fill="#712B13">3. Custom</text>
    <text x="440" y="56" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="12px" fill="#993C1D">Personalize</text>
  </g>
  <text x="440" y="90" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="12px" font-style="italic" fill="#5F5E5A">20–90 min</text>
  <text x="440" y="108" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#888780">Kyle (Zapier/n8n)</text>

  
  <line x1="500" y1="48" x2="540" y2="48" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"></line>

  
  <g class="node">
    <rect x="540" y="20" width="120" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"></rect>
    <text x="600" y="40" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="14px" font-weight="500" fill="#3C3489">4. Delivery</text>
    <text x="600" y="56" text-anchor="middle" dominant-baseline="central" font-family="Anthropic Sans, sans-serif" font-size="12px" fill="#534AB7">Upload + test</text>
  </g>
  <text x="600" y="90" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="12px" font-style="italic" fill="#5F5E5A">10 min</text>

  

  
  <g opacity="0.08">
    <rect x="30" y="130" width="150" height="170" rx="8" stroke-width="0.5" fill="#888780" stroke="#5F5E5A"></rect>
  </g>
  <text x="40" y="150" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Discovery inputs</text>
  <text x="40" y="170" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Industry + use case</text>
  <text x="40" y="186" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Team size / skill level</text>
  <text x="40" y="202" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Deliverable timeline</text>
  <text x="40" y="218" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Custom depth desired</text>
  <text x="40" y="234" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Tools in current stack</text>

  <text x="40" y="256" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Decision gate</text>
  <text x="40" y="272" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">→ Light custom (20–30 min)</text>
  <text x="40" y="288" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">→ Medium (45–60 min)</text>

  
  <g opacity="0.08">
    <rect x="200" y="130" width="150" height="170" rx="8" stroke-width="0.5" fill="#888780" stroke="#5F5E5A"></rect>
  </g>
  <text x="210" y="150" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Match template</text>
  <text x="210" y="170" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">1. SaaS Onboarding</text>
  <text x="210" y="186" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">2. E-Commerce Store</text>
  <text x="210" y="202" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">3. Services Portfolio</text>
  <text x="210" y="218" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">4. Local Business</text>
  <text x="210" y="234" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">5. Digital Product</text>

  <text x="210" y="256" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Pricing tiers</text>
  <text x="210" y="272" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">Light: $499–$699</text>
  <text x="210" y="288" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">Medium: $999–$1,299</text>

  
  <g opacity="0.08">
    <rect x="370" y="130" width="160" height="170" rx="8" stroke-width="0.5" fill="#888780" stroke="#5F5E5A"></rect>
  </g>
  <text x="380" y="150" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Custom layer</text>
  <text x="380" y="170" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Client brand colors</text>
  <text x="380" y="186" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Swap copy + placeholders</text>
  <text x="380" y="202" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Add 1–2 custom assets</text>
  <text x="380" y="218" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">• Pre-populate forms/sheets</text>

  <text x="380" y="256" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Tools</text>
  <text x="380" y="272" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">→ Zapier/n8n prompt</text>
  <text x="380" y="288" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">→ Auto-generate .docx</text>

  
  <g opacity="0.08">
    <rect x="540" y="130" width="130" height="170" rx="8" stroke-width="0.5" fill="#888780" stroke="#5F5E5A"></rect>
  </g>
  <text x="550" y="150" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Upload steps</text>
  <text x="550" y="170" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">1. Zip files</text>
  <text x="550" y="186" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">2. Wix Studio kit API</text>
  <text x="550" y="202" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">3. Test access</text>
  <text x="550" y="218" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">4. Invite client</text>

  <text x="550" y="256" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Handoff email</text>
  <text x="550" y="272" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">→ Kit link</text>
  <text x="550" y="288" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">→ Next steps doc</text>

  

  
  <g opacity="0.15">
    <rect x="40" y="330" width="630" height="100" rx="8" stroke-width="0.5" fill="#639922" stroke="#3B6D11"></rect>
  </g>
  <text x="50" y="350" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#27500A">Handoff gates (client confirms)</text>
  
  <text x="50" y="370" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">✓ All files accessible in kit</text>
  <text x="50" y="386" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">✓ Videos playing + captions correct</text>
  <text x="50" y="402" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">✓ Forms/templates pre-filled</text>
  <text x="50" y="418" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">✓ Contact info + support SOP clear</text>

  
  <text x="410" y="370" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">If PASS:</text>
  <text x="410" y="386" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">→ Mark as &#34;live&#34;</text>
  <text x="410" y="402" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">→ Invoice + deliver</text>
  <text x="410" y="418" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#444441">→ 30-day support</text>

  

  
  <text x="40" y="470" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Total project timeline</text>

  <g class="node">
    <rect x="40" y="490" width="130" height="44" rx="6" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"></rect>
    <text x="105" y="512" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="12px" fill="#0C447C">Discovery</text>
    <text x="105" y="528" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="11px" font-weight="500" fill="#185FA5">30–45 min</text>
  </g>

  <g class="node">
    <rect x="180" y="490" width="130" height="44" rx="6" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"></rect>
    <text x="245" y="512" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="12px" fill="#085041">Selection</text>
    <text x="245" y="528" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="11px" font-weight="500" fill="#0F6E56">5–10 min</text>
  </g>

  <g class="node">
    <rect x="320" y="490" width="130" height="44" rx="6" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"></rect>
    <text x="385" y="512" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="12px" fill="#712B13">Customization</text>
    <text x="385" y="528" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="11px" font-weight="500" fill="#993C1D">20–90 min*</text>
  </g>

  <g class="node">
    <rect x="460" y="490" width="200" height="44" rx="6" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"></rect>
    <text x="560" y="512" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="12px" fill="#3C3489">Delivery + Handoff</text>
    <text x="560" y="528" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-size="11px" font-weight="500" fill="#534AB7">10 min + async</text>
  </g>

  
  <text x="40" y="560" font-family="Anthropic Sans, sans-serif" font-size="11px" font-style="italic" fill="#888780">*Customization time scales: Light = 20–30 min (template + name swap). Medium = 45–60 min (add 1 custom asset, personalized copy). Advanced = 75–90 min (multi-asset, 1–2 custom workflows).</text>

  
  <text x="40" y="600" font-family="Anthropic Sans, sans-serif" font-size="13px" font-weight="500" fill="#444441">Tools in motion</text>
  <text x="40" y="620" font-family="Anthropic Sans, sans-serif" font-size="11px" fill="#5F5E5A">Notion (discovery notes) → Stripe (invoice) → Wix MCP (kit upload) → n8n/Zapier (template gen) → Email (handoff)</text>
</svg>