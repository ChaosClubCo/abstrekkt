<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlashFusion — App Preview</title>
<style>
  :root{
    --app-bg:#08090e; --surface:#12121e; --surface-2:#1a1b2e; --surface-3:#21223a;
    --border:#1c1d2e; --border-2:#252540; --text:#e4e6f0; --text-dim:#b0b4d4;
    --muted:#6b7094; --muted-2:#4a4f70; --indigo:#5e6ad2; --indigo-hi:#8b5cf6;
    --green:#22c55e; --amber:#e0a23b; --red:#ef4444;
    --nav-bg:rgba(8,9,14,.92);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--app-bg);color:var(--text);font-family:var(--font);}
  #root{min-height:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .page{max-width:1180px;margin:0 auto;padding:30px 28px 64px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .page-title{font-size:1.5rem;font-weight:650;letter-spacing:-.02em;margin:0;}
  .page-sub{color:var(--muted);font-size:.85rem;margin:4px 0 0;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;}
  .card-pad{padding:18px 20px;}
  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);} .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:820px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
  .muted{color:var(--muted);} .mono{font-family:var(--mono);}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.72rem;border:1px solid var(--border-2);color:var(--text-dim);background:var(--surface-2);}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:7px;font-size:.82rem;font-weight:500;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-dim);cursor:pointer;transition:all .15s;}
  .btn:hover{color:var(--text);border-color:#2f2f55;}
  .btn-primary{background:var(--indigo);border-color:var(--indigo);color:#fff;}
  .btn-primary:hover{background:#6b79e4;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .input,.textarea{width:100%;background:#0e0f1a;border:1px solid var(--border-2);border-radius:7px;color:var(--text);padding:9px 11px;font-size:.85rem;font-family:inherit;}
  .input:focus,.textarea:focus{outline:none;border-color:var(--indigo);}
  .textarea{resize:vertical;min-height:88px;}
  .field-label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:6px;}
  .bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--indigo-hi));}
  .stat .label{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;}
  .stat .value{font-size:1.7rem;font-weight:650;letter-spacing:-.02em;margin-top:6px;}
  .stat .delta{font-size:.74rem;margin-top:4px;} .delta.up{color:var(--green);} .delta.down{color:var(--red);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#20223a;border-radius:8px;border:2px solid var(--app-bg);}
  /* light theme */
  html.light{
    --app-bg:#f5f6fb; --surface:#ffffff; --surface-2:#f0f1f7; --surface-3:#e7e9f3;
    --border:#e4e6ef; --border-2:#d7dae8; --text:#1a1c2a; --text-dim:#3a3d52;
    --muted:#6b7094; --muted-2:#9aa0bd; --nav-bg:rgba(245,246,251,.85);
  }
  html.light ::-webkit-scrollbar-thumb{background:#d7dae8;}
  /* toasts */
  .toast-host{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--surface);border:1px solid var(--border-2);border-left:3px solid var(--indigo);border-radius:8px;padding:11px 16px 11px 14px;font-size:.83rem;color:var(--text);box-shadow:0 10px 34px rgba(0,0,0,.34);animation:toastIn .2s ease;min-width:210px;display:flex;align-items:center;gap:9px;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  /* skeleton */
  .skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.2s ease infinite;border-radius:6px;}
  @keyframes shimmer{from{background-position:100% 0;}to{background-position:-100% 0;}}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.85rem;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---- minimal lucide-style icon set ---- */
const P = {
  dash:"M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z",
  kanban:"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",

  zap:"M13 2L3 14h9l-1 8 10-12h-9z",
  code:"M16 18l6-6-6-6M8 6l-6 6 6 6",
  cog:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z",
  bell:"M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0",

  msg:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v6M9 10h6",

  plus:"M12 5v14M5 12h14",
  trash:"M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
  down:"M12 5v14M19 12l-7 7-7-7",
  send:"M22 2L11 13M22 2l-7 20-4-9-9-4z",
  cpu:"M9 9h6v6H9zM4 9h1M4 15h1M19 9h1M19 15h1M9 4v1M15 4v1M9 19v1M15 19v1M6 6h12v12H6z",
  filter:"M22 3H2l8 9.46V19l4 2v-8.54z",
  hook:"M18 16.98h-5.99c-1.66 0-3.01-1.34-3.01-3s1.34-3 3.01-3H18M6 7.01a3 3 0 1 0 0 .01",

  file:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6",
  folder:"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z",
  user:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  key:"M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3",
  check:"M20 6L9 17l-5-5",
  x:"M18 6L6 18M6 6l12 12",
  enter:"M9 10l-5 5 5 5M20 4v7a4 4 0 0 1-4 4H4",

  act:"M22 12h-4l-3 9L9 3l-3 9H2",
  trend:"M23 6l-9.5 9.5-5-5L1 18M17 6h6v6",
  dollar:"M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
  lock:"M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4",
  route:"M6 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 17h6a3 3 0 0 0 3-3V8",
  flask:"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7 14h10",
  plug:"M12 22v-5M9 7V2M15 7V2M6 7h12v3a6 6 0 0 1-12 0z",
  mail:"M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM22 6l-10 7L2 6",
  shield:"M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z",
  sun:"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
  moon:"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z",
};
function Icon({n, s=16, c="currentColor"}){
  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{(P[n]||"").split("M").filter(Boolean).map((d,i)=><path key={i} d={"M"+d}/>)}</svg>;
}

/* ---- toast bus ---- */
const toastBus={listeners:new Set(),push(msg){const t={id:Date.now()+Math.random(),msg};this.listeners.forEach(l=>l(t));}};
const toast=(msg)=>toastBus.push(msg);
function ToastHost(){
  const [items,setItems]=useState([]);
  useEffect(()=>{const l=(t)=>{setItems(x=>[...x,t]);setTimeout(()=>setItems(x=>x.filter(i=>i.id!==t.id)),2600);};toastBus.listeners.add(l);return()=>toastBus.listeners.delete(l);},[]);
  return <div className="toast-host">{items.map(t=><div key={t.id} className="toast"><Icon n="check" s={14} c="var(--green)"/> {t.msg}</div>)}</div>;
}

/* ---------------- Pages ---------------- */
function DashboardPage(){
  const [loading,setLoading]=useState(true);
  useEffect(()=>{const t=setTimeout(()=>setLoading(false),650);return()=>clearTimeout(t);},[]);
  const stats=[["Requests today","48,210","+12.4%",true,"act"],["Avg latency","312 ms","-8.1%",true,"zap"],["Spend (MTD)","$1,847","+4.6%",false,"dollar"],["Active routes","18","+2",true,"trend"]];
  const routing=[["Claude Sonnet 4.5",46,"reasoning"],["Claude Haiku 4",31,"fast"],["GPT-4o",14,"vision"],["Llama 3.1 70B",9,"local"]];
  const act=[["2m ago","Route “support-triage” switched fallback → Haiku 4","#5e6ad2"],["18m ago","Latency spike resolved on GPT-4o endpoint","#22c55e"],["1h ago","Budget alert: 80% of monthly cap reached","#e0a23b"],["3h ago","New API key provisioned for workspace “growth”","#6b7094"]];
  return <div className="page">
    <div className="page-head"><div><h1 className="page-title">Dashboard</h1><p className="page-sub">Routing health across all models and workspaces.</p></div><button className="btn btn-primary" onClick={()=>toast("New route created")}><Icon n="zap" s={14}/> New route</button></div>
    {loading
      ? <div className="grid grid-4" style={{marginBottom:14}}>{[0,1,2,3].map(i=>(<div key={i} className="card card-pad"><div className="skel" style={{height:11,width:"55%",marginBottom:14}}/><div className="skel" style={{height:26,width:"42%",marginBottom:10}}/><div className="skel" style={{height:9,width:"70%"}}/></div>))}</div>
      : <div className="grid grid-4" style={{marginBottom:14}}>{stats.map(([l,v,d,up,ic])=>(
      <div key={l} className="card card-pad stat"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span className="label">{l}</span><Icon n={ic} s={15} c="#6b7094"/></div><div className="value">{v}</div><div className={"delta "+(up?"up":"down")}>{d} vs last week</div></div>
    ))}</div>}
    <div className="grid grid-2">
      <div className="card card-pad">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><strong style={{fontSize:".95rem"}}>Model routing</strong><span className="chip">last 24h</span></div>
        {routing.map(([m,sh,t])=>(<div key={m} style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",fontSize:".82rem",marginBottom:6}}><span>{m} <span className="muted mono" style={{fontSize:".7rem"}}>· {t}</span></span><span className="muted">{sh}%</span></div><div className="bar"><span style={{width:sh+"%"}}/></div></div>))}
      </div>
      <div className="card card-pad">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><strong style={{fontSize:".95rem"}}>Recent activity</strong><a className="muted" style={{fontSize:".78rem",display:"inline-flex",gap:4,alignItems:"center"}}>View all <Icon n="up" s={12}/></a></div>
        {act.map(([t,txt,c],i)=>(<div key={i} style={{display:"flex",gap:12,padding:"10px 0",borderTop:i?"1px solid var(--border)":"none"}}><span style={{width:7,height:7,borderRadius:999,background:c,marginTop:6,flexShrink:0}}/><div><div style={{fontSize:".84rem"}}>{txt}</div><div className="muted mono" style={{fontSize:".68rem",marginTop:2}}>{t}</div></div></div>))}
      </div>
    </div>
  </div>;
}

function KanbanPage(){
  const cols=["Backlog","In Progress","Review","Done"];
  const seed={Backlog:[["c1","Add Gemini 1.5 to routing pool","routing"],["c2","Cost guardrails per workspace","billing"]],"In Progress":[["c3","Streaming fallback chains","core"],["c4","Latency-based auto-switch","core"]],Review:[["c5","Prompt cache hit-rate panel","analytics"]],Done:[["c6","API key rotation flow","security"]]};
  const [data,setData]=useState(()=>{try{return JSON.parse(localStorage.getItem("ffp_kanban"))||seed;}catch(e){return seed;}});
  const drag=useRef(null);
  const save=(d)=>{setData(d);try{localStorage.setItem("ffp_kanban",JSON.stringify(d));}catch(e){}};
  const drop=(to)=>{const g=drag.current;if(!g||g.from===to)return;const card=data[g.from].find(c=>c[0]===g.id);if(!card)return;save({...data,[g.from]:data[g.from].filter(c=>c[0]!==g.id),[to]:[...data[to],card]});drag.current=null;};
  const add=(col)=>{const t=prompt("New card title");if(!t)return;save({...data,[col]:[...data[col],["c"+Date.now(),t,""]]});};
  return <div className="page">
    <div className="page-head"><div><h1 className="page-title">Kanban</h1><p className="page-sub">Drag cards between columns — state persists locally.</p></div></div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,alignItems:"start"}}>{cols.map(col=>(
      <div key={col} onDragOver={e=>e.preventDefault()} onDrop={()=>drop(col)} className="card" style={{padding:12,minHeight:220}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,padding:"2px 4px"}}><span style={{fontSize:".78rem",fontWeight:600}}>{col} <span className="muted">· {data[col].length}</span></span><button className="btn btn-ghost" style={{padding:4}} onClick={()=>add(col)}><Icon n="plus" s={14}/></button></div>
        {data[col].map(c=>(<div key={c[0]} draggable onDragStart={()=>drag.current={id:c[0],from:col}} className="card card-pad" style={{background:"var(--surface-2)",marginBottom:8,cursor:"grab",padding:"11px 12px"}}><div style={{fontSize:".82rem"}}>{c[1]}</div>{c[2]&&<span className="chip" style={{marginTop:8,fontSize:".64rem",padding:"2px 7px"}}>{c[2]}</span>}</div>))}
      </div>
    ))}</div>
  </div>;
}

const DOCS=[["intro","Start","Introduction","FlashFusion routes every prompt to the best-fit model by cost, latency, and capability. This guide covers setup, routing rules, and observability."],["quickstart","Start","Quickstart","Install the SDK, set your server-side API key, and point your first route at a model pool. Your app calls FlashFusion; FlashFusion calls the model."],["routes","Core","Routing rules","Routes match on request metadata (tags, token budget, modality) and select from an ordered model pool with automatic fallback on error or timeout."],["fallback","Core","Fallback chains","Each route defines a primary model and ordered fallbacks. On 429/5xx or latency breach, traffic shifts to the next model and emits an event."],["keys","Security","API keys","Keys are stored server-side only and never shipped to the browser. Rotate from Settings → API; old keys remain valid for a 24h grace window."]];
function DocsPage(){
  const [active,setActive]=useState("intro");const [q,setQ]=useState("");
  const f=DOCS.filter(d=>(d[2]+d[3]).toLowerCase().includes(q.toLowerCase()));
  const groups=[...new Set(f.map(d=>d[1]))];const doc=DOCS.find(d=>d[0]===active);
  return <div className="page"><div className="page-head"><div><h1 className="page-title">Documentation</h1><p className="page-sub">Everything to get routing in production.</p></div></div>
    <div style={{display:"grid",gridTemplateColumns:"240px 1fr",gap:20,alignItems:"start"}}>
      <div className="card card-pad">
        <div style={{position:"relative",marginBottom:12}}><span style={{position:"absolute",left:10,top:9,color:"var(--muted-2)"}}><Icon n="search" s={13}/></span><input className="input" style={{paddingLeft:30}} placeholder="Search docs" value={q} onChange={e=>setQ(e.target.value)}/></div>
        {groups.map(g=>(<div key={g} style={{marginBottom:12}}><div className="muted" style={{fontSize:".66rem",textTransform:"uppercase",letterSpacing:".08em",margin:"4px 0 6px"}}>{g}</div>{f.filter(d=>d[1]===g).map(d=>(<button key={d[0]} onClick={()=>setActive(d[0])} className="btn btn-ghost" style={{width:"100%",justifyContent:"flex-start",padding:"6px 8px",fontSize:".8rem",color:active===d[0]?"var(--text)":"var(--muted)",background:active===d[0]?"var(--surface-2)":"transparent"}}>{d[2]}</button>))}</div>))}
      </div>
      <div className="card card-pad" style={{minHeight:360}}>{doc&&<React.Fragment><span className="chip" style={{marginBottom:12}}>{doc[1]}</span><h2 style={{margin:"0 0 12px",fontSize:"1.25rem",letterSpacing:"-.02em"}}>{doc[2]}</h2><p style={{color:"var(--text-dim)",lineHeight:1.7,fontSize:".9rem",maxWidth:"62ch"}}>{doc[3]}</p></React.Fragment>}</div>
    </div>
  </div>;
}

const PAL=[["Trigger","Incoming request / webhook","hook","#5e6ad2"],["Route","Pick model by rule","cpu","#8b5cf6"],["Filter","Guard / transform","filter","#e0a23b"],["Respond","Return / forward","send","#22c55e"]];
function WorkflowPage(){
  const [steps,setSteps]=useState([["s1","Trigger"],["s2","Route"],["s3","Respond"]]);
  const meta=t=>PAL.find(p=>p[0]===t);
  return <div className="page"><div className="page-head"><div><h1 className="page-title">Workflow builder</h1><p className="page-sub">Chain triggers, routing, and responses into a pipeline.</p></div><button className="btn btn-primary"><Icon n="send" s={14}/> Deploy</button></div>

  return <div className="page" style={{maxWidth:820}}>
    <div className="page-head"><div><h1 className="page-title">Team</h1><p className="page-sub">Members and roles for this workspace.</p></div></div>
    <div className="card card-pad" style={{display:"flex",gap:8,marginBottom:14}}><input className="input" placeholder="teammate@company.com" value={email} onChange={e=>setEmail(e.target.value)}/><button className="btn btn-primary" onClick={invite}><Icon n="mail" s={13}/> Invite</button></div>
    <div className="card" style={{overflow:"hidden"}}>{members.map((m,i)=>(<div key={m[1]} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 18px",borderTop:i?"1px solid var(--border)":"none"}}>
      <span style={{width:30,height:30,borderRadius:999,background:"linear-gradient(135deg,#5e6ad2,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:".64rem",fontWeight:700,color:"#fff",flexShrink:0}}>{m[0].split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}</span>
      <div style={{flex:1}}><div style={{fontSize:".85rem"}}>{m[0]}</div><div className="muted" style={{fontSize:".74rem"}}>{m[1]}</div></div>
      <span className="chip" style={{fontSize:".66rem",color:m[2]==="Owner"?"var(--indigo)":"var(--text-dim)"}}>{m[2]}</span>
    </div>))}</div>
  </div>;
}

/* ---------------- Shell ---------------- */
const NAV=[["dashboard","Dashboard","dash"],["routes","Routes","route"],["playground","Playground","flask"],["analytics","Analytics","trend"],["workflow","Workflow","zap"],["code","Code","code"]];
function NavBar({view,go,onPalette,onBell,onFeedback,theme,onTheme}){
  return <nav style={{position:"sticky",top:0,zIndex:50,display:"flex",alignItems:"center",padding:"0 16px",gap:8,height:56,background:"var(--nav-bg)",backdropFilter:"blur(16px)",borderBottom:"1px solid var(--border)"}}>
    <div onClick={()=>go("dashboard")} style={{display:"flex",alignItems:"center",gap:8,marginRight:12,cursor:"pointer"}}><div style={{width:28,height:28,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#5e6ad2,#8b5cf6)"}}><Icon n="git" s={14} c="#fff"/></div><span style={{fontWeight:700,fontSize:".9rem",letterSpacing:"-.02em"}}>FlashFusion</span></div>
    <div style={{height:20,width:1,background:"var(--border)",marginRight:6}}/>
    <div style={{display:"flex",gap:2}}>{NAV.map(i=>{const a=view===i[0];return <button key={i[0]} onClick={()=>go(i[0])} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 12px",borderRadius:6,border:"1px solid "+(a?"var(--border-2)":"transparent"),background:a?"var(--surface-2)":"transparent",color:a?"var(--text)":"var(--muted)",fontSize:".8rem",cursor:"pointer"}}><Icon n={i[2]} s={13}/> {i[1]}</button>;})}</div>
    <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:4}}>
      <button onClick={onTheme} className="btn btn-ghost" style={{padding:8}} title="Toggle theme"><Icon n={theme==="light"?"moon":"sun"} s={15}/></button>
      <button onClick={onPalette} className="btn" style={{padding:"7px 10px",marginRight:2}}><Icon n="search" s={12}/> <span style={{fontSize:".72rem"}}>Search</span> <span className="chip mono" style={{fontSize:".58rem",padding:"1px 5px"}}>⌘K</span></button>
      <button onClick={onBell} className="btn btn-ghost" style={{padding:8,position:"relative"}}><Icon n="bell" s={15}/><span style={{position:"absolute",top:4,right:4,width:14,height:14,borderRadius:999,background:"#5e6ad2",fontSize:".52rem",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>4</span></button>
      <button onClick={()=>go("settings")} className="btn btn-ghost" style={{padding:8,color:view==="settings"?"var(--text)":"var(--muted)"}}><Icon n="cog" s={15}/></button>
      <button onClick={onFeedback} className="btn btn-primary" style={{marginLeft:2}}><Icon n="msg" s={13}/> Feedback</button>
      <div onClick={()=>go("settings")} style={{width:28,height:28,borderRadius:999,marginLeft:4,display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#5e6ad2,#8b5cf6)",cursor:"pointer",fontSize:".65rem",fontWeight:700,color:"#fff"}}>JL</div>
    </div>
  </nav>;
}

function CommandPalette({open,close,go}){
  const acts=[["Go to Dashboard","dashboard","dash"],["Go to Routes","routes","route"],["Go to Playground","playground","flask"],["Go to Analytics","analytics","trend"],["Go to Workflow builder","workflow","zap"],["Go to Code","code","code"],["Go to Integrations","integrations","plug"],["Go to Billing","billing","dollar"],["Go to Team","team","user"],["Go to Kanban","kanban","kanban"],["Go to Docs","docs","docs"],["Go to Settings","settings","cog"]];
  const [q,setQ]=useState("");const [sel,setSel]=useState(0);
  const res=acts.filter(a=>a[0].toLowerCase().includes(q.toLowerCase()));
  useEffect(()=>{if(open){setQ("");setSel(0);}},[open]);
  useEffect(()=>{if(!open)return;const k=e=>{if(e.key==="Escape")close();if(e.key==="ArrowDown"){e.preventDefault();setSel(s=>Math.min(s+1,res.length-1));}if(e.key==="ArrowUp"){e.preventDefault();setSel(s=>Math.max(s-1,0));}if(e.key==="Enter"&&res[sel]){go(res[sel][1]);close();}};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k);},[open,res,sel]);
  if(!open)return null;
  return <div onClick={close} style={{position:"fixed",inset:0,zIndex:210,background:"rgba(4,5,10,.6)",backdropFilter:"blur(4px)",display:"flex",justifyContent:"center",alignItems:"flex-start",paddingTop:"14vh"}}>
    <div onClick={e=>e.stopPropagation()} className="card" style={{width:520,maxWidth:"92vw",overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"13px 16px",borderBottom:"1px solid var(--border)"}}><Icon n="search" s={15} c="var(--muted)"/><input autoFocus value={q} onChange={e=>{setQ(e.target.value);setSel(0);}} placeholder="Type a command or search…" style={{flex:1,background:"transparent",border:"none",outline:"none",color:"var(--text)",fontSize:".9rem"}}/><span className="chip mono" style={{fontSize:".6rem"}}>ESC</span></div>
      <div style={{maxHeight:320,overflowY:"auto",padding:6}}>{res.length===0&&<div className="muted" style={{padding:24,textAlign:"center",fontSize:".84rem"}}>No matches</div>}{res.map((a,i)=>(<button key={a[1]} onMouseEnter={()=>setSel(i)} onClick={()=>{go(a[1]);close();}} style={{width:"100%",display:"flex",alignItems:"center",gap:11,padding:"10px 12px",borderRadius:7,border:"none",cursor:"pointer",textAlign:"left",color:"var(--text)",background:i===sel?"var(--surface-2)":"transparent"}}><Icon n={a[2]} s={15} c="var(--muted)"/><span style={{flex:1,fontSize:".85rem"}}>{a[0]}</span>{i===sel&&<Icon n="enter" s={13} c="var(--muted)"/>}</button>))}</div>
    </div>
  </div>;
}

function FeedbackModal({open,close}){
  const cats=["Bug","Idea","Routing","Other"];const [cat,setCat]=useState("Idea");const [text,setText]=useState("");const [sent,setSent]=useState(false);
  if(!open)return null;
  const submit=()=>{if(!text.trim())return;setSent(true);setTimeout(()=>{setSent(false);setText("");close();},1100);};
  return <div onClick={close} style={{position:"fixed",inset:0,zIndex:200,background:"rgba(4,5,10,.7)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div onClick={e=>e.stopPropagation()} className="card" style={{width:440,maxWidth:"100%",padding:22}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}><strong style={{fontSize:".95rem",display:"flex",alignItems:"center",gap:8}}><Icon n="msg" s={16} c="var(--indigo)"/> Send feedback</strong><button className="btn btn-ghost" style={{padding:5}} onClick={close}><Icon n="x" s={16}/></button></div>
      {sent?<div style={{padding:"30px 0",textAlign:"center",color:"var(--green)",fontSize:".9rem"}}>Thanks — feedback received.</div>:<React.Fragment><div style={{display:"flex",gap:6,marginBottom:14}}>{cats.map(c=>(<button key={c} onClick={()=>setCat(c)} className="chip" style={{cursor:"pointer",background:cat===c?"var(--indigo)":"var(--surface-2)",borderColor:cat===c?"var(--indigo)":"var(--border-2)",color:cat===c?"#fff":"var(--text-dim)"}}>{c}</button>))}</div><textarea className="textarea" placeholder="What's on your mind?" value={text} onChange={e=>setText(e.target.value)} style={{marginBottom:16,minHeight:110}}/><div style={{display:"flex",justifyContent:"flex-end",gap:8}}><button className="btn" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={submit}>Send</button></div></React.Fragment>}
    </div>
  </div>;
}

function Drawer({open,close}){
  const seed=[[1,"Fallback triggered","“support-triage” shifted to Haiku 4 (latency).","2m",false],[2,"Budget at 80%","Workspace “growth” is near its monthly cap.","1h",false],[3,"Endpoint recovered","GPT-4o latency back to baseline.","3h",false],[4,"New key provisioned","A publishable key was created.","1d",true]];
  const [items,setItems]=useState(seed);
  return <React.Fragment>{open&&<div onClick={close} style={{position:"fixed",inset:0,zIndex:190,background:"rgba(4,5,10,.5)"}}/>}
    <div style={{position:"fixed",top:0,right:0,bottom:0,width:360,maxWidth:"90vw",zIndex:195,background:"var(--surface)",borderLeft:"1px solid var(--border)",transform:open?"translateX(0)":"translateX(100%)",transition:"transform .25s ease",display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 18px",borderBottom:"1px solid var(--border)"}}><strong style={{fontSize:".92rem",display:"flex",alignItems:"center",gap:8}}><Icon n="bell" s={15} c="var(--indigo)"/> Notifications</strong><button className="btn btn-ghost" style={{padding:5}} onClick={close}><Icon n="x" s={16}/></button></div>
      <div style={{flex:1,overflowY:"auto"}}>{items.map(n=>(<div key={n[0]} style={{display:"flex",gap:10,padding:"14px 18px",borderBottom:"1px solid var(--border)",opacity:n[4]?.55:1}}><span style={{width:7,height:7,borderRadius:999,background:n[4]?"var(--muted-2)":"var(--indigo)",marginTop:6,flexShrink:0}}/><div><div style={{fontSize:".84rem",fontWeight:500}}>{n[1]}</div><div className="muted" style={{fontSize:".76rem",marginTop:2,lineHeight:1.5}}>{n[2]}</div><div className="muted mono" style={{fontSize:".66rem",marginTop:4}}>{n[3]} ago</div></div></div>))}</div>
      <div style={{padding:14,borderTop:"1px solid var(--border)"}}><button className="btn" style={{width:"100%",justifyContent:"center"}} onClick={()=>setItems(x=>x.map(i=>[...i.slice(0,4),true]))}>Mark all as read</button></div>
    </div>
  </React.Fragment>;
}

function Onboarding({onDone}){
  const steps=[["Welcome to FlashFusion","Route every prompt to its perfect model — by cost, latency, and capability."],["Build a route","Define a model pool with automatic fallback. Start in the Workflow builder."],["Stay in control","Watch routing health on the Dashboard and manage keys in Settings."]];
  const [i,setI]=useState(0);
  return <div style={{position:"fixed",inset:0,zIndex:220,background:"rgba(4,5,10,.8)",backdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div className="card" style={{width:460,maxWidth:"100%",padding:28,textAlign:"center"}}>
      <div style={{width:46,height:46,borderRadius:12,margin:"0 auto 18px",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#5e6ad2,#8b5cf6)"}}><Icon n="git" s={22} c="#fff"/></div>
      <h2 style={{margin:"0 0 10px",fontSize:"1.3rem",letterSpacing:"-.02em"}}>{steps[i][0]}</h2>
      <p className="muted" style={{fontSize:".9rem",lineHeight:1.6,maxWidth:"42ch",margin:"0 auto 22px"}}>{steps[i][1]}</p>
      <div style={{display:"flex",justifyContent:"center",gap:6,marginBottom:20}}>{steps.map((_,k)=><span key={k} style={{width:k===i?20:7,height:7,borderRadius:999,background:k===i?"var(--indigo)":"var(--surface-3)",transition:"all .2s"}}/>)}</div>
      <div style={{display:"flex",justifyContent:"center",gap:8}}><button className="btn" onClick={onDone}>Skip</button><button className="btn btn-primary" onClick={()=>i<steps.length-1?setI(i+1):onDone()}>{i<steps.length-1?"Next":"Get started"}</button></div>
    </div>
  </div>;
}

function App(){
  const [view,setView]=useState(()=>localStorage.getItem("ffp_view")||"dashboard");
  const [pal,setPal]=useState(false);const [bell,setBell]=useState(false);const [fb,setFb]=useState(false);
  const [onb,setOnb]=useState(()=>!localStorage.getItem("ffp_onboarded"));
  const [auth,setAuth]=useState(()=>!!localStorage.getItem("ffp_auth"));
  const [theme,setTheme]=useState(()=>localStorage.getItem("ffp_theme")||"dark");
  useEffect(()=>{document.documentElement.classList.toggle("light",theme==="light");try{localStorage.setItem("ffp_theme",theme);}catch(e){}},[theme]);
  const go=v=>{setView(v);try{localStorage.setItem("ffp_view",v);}catch(e){}};
  useEffect(()=>{const k=e=>{if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();setPal(o=>!o);}};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k);},[]);
  const pages={dashboard:DashboardPage,routes:RoutesPage,playground:PlaygroundPage,analytics:AnalyticsPage,integrations:IntegrationsPage,billing:BillingPage,team:TeamPage,kanban:KanbanPage,docs:DocsPage,workflow:WorkflowPage,code:CodePage,settings:SettingsPage};
  const Page=pages[view]||DashboardPage;
  if(!auth) return <SignIn onAuth={()=>{setAuth(true);try{localStorage.setItem("ffp_auth","1");}catch(e){}}}/>;
  return <div style={{minHeight:"100vh"}}>
    <NavBar view={view} go={go} onPalette={()=>setPal(true)} onBell={()=>setBell(true)} onFeedback={()=>setFb(true)} theme={theme} onTheme={()=>setTheme(t=>t==="light"?"dark":"light")}/>
    <main><Page/></main>
    <CommandPalette open={pal} close={()=>setPal(false)} go={go}/>
    <FeedbackModal open={fb} close={()=>setFb(false)}/>
    <Drawer open={bell} close={()=>setBell(false)}/>
    <ToastHost/>
    {onb&&<Onboarding onDone={()=>{setOnb(false);try{localStorage.setItem("ffp_onboarded","1");}catch(e){}}}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
