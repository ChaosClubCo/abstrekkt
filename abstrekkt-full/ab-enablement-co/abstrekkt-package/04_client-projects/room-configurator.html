<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Preview — Room Configurator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e12;--panel:#13131a;--border:#1e1e2e;--accent:#c9a96e;--accent2:#e8d5b0;
  --muted:#5a5a72;--text:#d8d8e8;--danger:#e05555;--good:#5ec98a;
  --card:#18182a;--card-hover:#1e1e30;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,#c9a96e,#8b6840);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-text{font-family:'Playfair Display',serif;font-size:15px;color:var(--accent2);letter-spacing:.3px}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:-1px}
.header-right{display:flex;align-items:center;gap:10px}
select.preset-sel{background:var(--card);color:var(--text);border:1px solid var(--border);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;outline:none}
select.preset-sel:focus{border-color:var(--accent)}
.help-badge{font-size:10px;color:var(--muted);background:var(--card);padding:3px 8px;border-radius:12px;border:1px solid var(--border)}
.icon-btn{background:var(--card);color:var(--accent2);border:1px solid var(--border);padding:5px 11px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;display:inline-flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent}
.icon-btn:hover{border-color:var(--accent);background:var(--card-hover)}
body.present header,body.present aside,body.present .canvas-badge,body.present .sel-banner{display:none!important}
.exit-present{display:none;position:fixed;top:14px;right:14px;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:22px;font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
body.present .exit-present{display:block}
.rot-controls{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:26px;padding:6px 10px 6px 16px;z-index:15}
.rot-controls.vis{display:flex}
.rot-controls .rl{font-size:11px;color:var(--accent2);font-weight:600;letter-spacing:.4px}
.rot-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--accent2);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.rot-btn:hover{border-color:var(--accent);background:var(--card-hover)}
body.present .rot-controls{display:none!important}
main{display:flex;flex:1;overflow:hidden;min-height:0}
#cv-wrap{flex:1;position:relative;overflow:hidden}
canvas{display:block;cursor:grab;touch-action:none}
canvas.grabbing{cursor:grabbing}
canvas.moving{cursor:move}
.canvas-badge{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);backdrop-filter:blur(4px);padding:5px 14px;border-radius:20px;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none;border:1px solid var(--border)}
.sel-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(201,169,110,.18);backdrop-filter:blur(6px);border:1px solid rgba(201,169,110,.35);padding:6px 16px;border-radius:20px;font-size:12px;color:var(--accent2);font-weight:500;display:none;pointer-events:none;white-space:nowrap}
aside{width:232px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:16px;flex-shrink:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
aside::-webkit-scrollbar{width:4px}
aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sec-label{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.wall-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.wall-btn{padding:7px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;display:flex;align-items:center;justify-content:space-between;transition:all .15s}
.wall-btn:hover{background:var(--card-hover);color:var(--text)}
.wall-btn.on{background:rgba(94,201,138,.1);border-color:rgba(94,201,138,.4);color:var(--good)}
.wall-dot{width:5px;height:5px;border-radius:50%;background:var(--danger);flex-shrink:0}
.wall-btn.on .wall-dot{background:var(--good)}
.divider{height:1px;background:var(--border)}
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.color-row label{font-size:11px;color:var(--muted);flex:1}
input[type=color]{width:28px;height:22px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:0;background:none}
.furn-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.add-btn{padding:7px 6px;border:1px dashed var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s}
.add-btn:hover{background:var(--card-hover);color:var(--text);border-style:solid;border-color:var(--accent)}
.sel-panel{display:none}
.sel-panel.vis{display:block}
.sel-name{font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:10px}
.action-btn{width:100%;padding:7px;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:600;margin-bottom:5px;transition:all .15s}
.btn-danger{background:rgba(224,85,85,.15);color:var(--danger);border:1px solid rgba(224,85,85,.3)}
.btn-danger:hover{background:rgba(224,85,85,.25)}
.btn-neutral{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-neutral:hover{background:var(--card-hover);border-color:var(--accent)}
input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
.sz-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sz-row label{font-size:11px;color:var(--muted);flex:1}
.sz-row input[type=range]{flex:2}
.sz-val{font-size:10px;color:var(--accent);width:28px;text-align:right}
/* drawer handle — mobile only */
.drawer-handle{display:none}
/* ─── RESPONSIVE ─────────────────────────────────────────────────────────── */
@media(max-width:820px){
  main{flex-direction:column}
  #cv-wrap{flex:1;min-height:0}
  aside{
    position:fixed;left:0;right:0;bottom:0;width:auto;max-height:64dvh;
    border-left:none;border-top:1px solid var(--border);border-radius:16px 16px 0 0;
    transform:translateY(calc(100% - 48px));transition:transform .26s cubic-bezier(.4,0,.2,1);
    z-index:30;padding:0 12px 16px;box-shadow:0 -10px 34px rgba(0,0,0,.55);
    gap:14px;
  }
  aside.open{transform:translateY(0)}
  .drawer-handle{
    display:flex;align-items:center;justify-content:center;gap:7px;height:48px;
    position:sticky;top:0;cursor:pointer;background:var(--panel);
    border-radius:16px 16px 0 0;border-bottom:1px solid var(--border);
    font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--accent);
    margin:0 -12px;flex-shrink:0;-webkit-tap-highlight-color:transparent;
  }
  .drawer-handle::before{
    content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:2px;background:var(--border);
  }
  .wall-btn,.add-btn,.action-btn{min-height:42px}
  input[type=color]{width:34px;height:26px}
  .canvas-badge{font-size:10px;padding:5px 12px;max-width:90vw;white-space:normal;text-align:center}
}
@media(max-width:560px){
  .help-badge{display:none}
  .logo-sub{display:none}
  .canvas-badge{display:none}
  header{padding:9px 12px}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <div>
      <div class="logo-text">Space Preview</div>
      <div class="logo-sub">Room Configurator</div>
    </div>
  </div>
  <div class="header-right">
    <select class="preset-sel" id="presetSel">
      <option value="living">Living Room</option>
      <option value="bedroom">Bedroom</option>
      <option value="dining">Dining Room</option>
      <option value="open">Open Plan</option>
      <option value="empty">Empty Room</option>
    </select>
    <button class="icon-btn" id="snapBtn" onclick="snapshot()">📷 Save</button>
    <button class="icon-btn" id="presentBtn" onclick="togglePresent()">⛶ Present</button>
    <span class="help-badge">Drag · Scroll · Click furniture</span>
  </div>
</header>
<main>
  <div id="cv-wrap">
    <canvas id="cv"></canvas>
    <div class="canvas-badge">🖱 Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click furniture to select &amp; drag</div>
    <div class="sel-banner" id="selBanner"></div>
    <div class="rot-controls" id="rotControls">
      <span class="rl">Rotate</span>
      <button class="rot-btn" onclick="rotateSelBy(-Math.PI/4)" aria-label="Rotate left">↺</button>
      <button class="rot-btn" onclick="rotateSelBy(Math.PI/4)" aria-label="Rotate right">↻</button>
    </div>
  </div>
  <aside id="aside">
    <div class="drawer-handle" id="drawerHandle">⚙ Controls</div>
    <div>
      <div class="sec-label">Walls</div>
      <div class="wall-grid">
        <button class="wall-btn on" id="wN" onclick="toggleWall('N')">North <span class="wall-dot"></span></button>
        <button class="wall-btn on" id="wS" onclick="toggleWall('S')">South <span class="wall-dot"></span></button>
        <button class="wall-btn on" id="wE" onclick="toggleWall('E')">East <span class="wall-dot"></span></button>
        <button class="wall-btn on" id="wW" onclick="toggleWall('W')">West <span class="wall-dot"></span></button>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="sec-label">Room Size</div>
      <div class="sz-row"><label>Width</label><input type="range" id="rwS" min="5" max="14" step="1" value="8" oninput="resizeRoom('w',this.value)"><span class="sz-val" id="rwV">8m</span></div>
      <div class="sz-row"><label>Depth</label><input type="range" id="rdS" min="5" max="14" step="1" value="8" oninput="resizeRoom('d',this.value)"><span class="sz-val" id="rdV">8m</span></div>
      <div class="sz-row"><label>Height</label><input type="range" id="rhS" min="2.2" max="4.5" step="0.2" value="3" oninput="resizeRoom('h',this.value)"><span class="sz-val" id="rhV">3m</span></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="sec-label">Materials</div>
      <div class="color-row"><label>Wall</label><input type="color" id="wc" value="#d4c9b8" oninput="wallMat.color.set(this.value)"></div>
      <div class="color-row"><label>Floor</label><input type="color" id="fc" value="#7a5c2e" oninput="floorMat.color.set(this.value)"></div>
      <div class="color-row"><label>Ceiling</label><input type="color" id="cc" value="#f0ece6" oninput="ceilMat.color.set(this.value)"></div>
      <div class="color-row"><label>Brightness</label><input type="range" min="0.3" max="2.5" step="0.1" value="1.1" oninput="sunLight.intensity=+this.value;ambient.intensity=+this.value*.45"></div>
      <div class="color-row"><label>Sun Color</label><input type="color" value="#fff4e0" oninput="sunLight.color.set(this.value)"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="sec-label">Add Furniture</div>
      <div class="furn-grid">
        <button class="add-btn" onclick="addFurniture('sofa')">🛋 Sofa</button>
        <button class="add-btn" onclick="addFurniture('loveseat')">💺 Loveseat</button>
        <button class="add-btn" onclick="addFurniture('coffeeTable')">☕ Coffee Tbl</button>
        <button class="add-btn" onclick="addFurniture('diningTable')">🍽 Dining Tbl</button>
        <button class="add-btn" onclick="addFurniture('chair')">🪑 Chair</button>
        <button class="add-btn" onclick="addFurniture('bed')">🛏 Bed</button>
        <button class="add-btn" onclick="addFurniture('dresser')">🗄 Dresser</button>
        <button class="add-btn" onclick="addFurniture('bookshelf')">📚 Bookshelf</button>
        <button class="add-btn" onclick="addFurniture('tv')">📺 TV Stand</button>
        <button class="add-btn" onclick="addFurniture('lamp')">💡 Floor Lamp</button>
        <button class="add-btn" onclick="addFurniture('rug')">🟫 Area Rug</button>
        <button class="add-btn" onclick="addFurniture('plant')">🌿 Plant</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="sel-panel" id="selPanel">
      <div class="sec-label">Selected Item</div>
      <div class="sel-name" id="selName">—</div>
      <div class="color-row"><label>Color</label><input type="color" id="itemColor" oninput="updateItemColor(this.value)"></div>
      <button class="action-btn btn-neutral" onclick="rotateSel()">↻ Rotate 45°</button>
      <button class="action-btn btn-danger" onclick="deleteSel()">✕ Remove Item</button>
      <div class="divider" style="margin:6px 0"></div>
    </div>
    <div>
      <div class="sec-label">Quick Actions</div>
      <button class="action-btn btn-neutral" onclick="clearRoom()">🗑 Clear All Furniture</button>
      <button class="action-btn btn-neutral" onclick="resetCamera()">📷 Reset Camera View</button>
    </div>
  </aside>
</main>
<button class="exit-present" id="exitPresent" onclick="togglePresent()">✕ Exit Presentation</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── RENDERER & SCENE ──────────────────────────────────────────────────────
const wrap=document.getElementById('cv-wrap');
const cvEl=document.getElementById('cv');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090910);
scene.fog=new THREE.FogExp2(0x090910,0.032);

const renderer=new THREE.WebGLRenderer({canvas:cvEl,antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.9;

const camera=new THREE.PerspectiveCamera(52,1,0.1,80);

function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  if(w===0||h===0) return;                       // drawer mid-animation / hidden
  // mobile GPUs throttle above ~1.5 DPR — cap lower on small viewports (perf research)
  const dprCap = w<820 ? 1.5 : 2;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,dprCap));
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize',resize);
// re-fit on container changes (sidebar collapse, drawer, embed) — not just window
let _rRAF=0;
const _ro=new ResizeObserver(()=>{cancelAnimationFrame(_rRAF);_rRAF=requestAnimationFrame(resize);});
_ro.observe(wrap);

// ── LIGHTS ────────────────────────────────────────────────────────────────
const ambient=new THREE.AmbientLight(0xfff0e0,0.5);
scene.add(ambient);
const sunLight=new THREE.DirectionalLight(0xfff4e0,1.1);
sunLight.position.set(6,10,5);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);
sunLight.shadow.camera.near=0.5;
sunLight.shadow.camera.far=50;
sunLight.shadow.camera.left=-12;sunLight.shadow.camera.right=12;sunLight.shadow.camera.top=12;sunLight.shadow.camera.bottom=-12;
sunLight.shadow.bias=-0.001;
scene.add(sunLight);
const fillLight=new THREE.DirectionalLight(0x6080b0,0.28);
fillLight.position.set(-4,3,-3);
scene.add(fillLight);

// ── MATERIALS ─────────────────────────────────────────────────────────────
const wallMat=new THREE.MeshStandardMaterial({color:0xd4c9b8,roughness:0.88,metalness:0.01,side:THREE.DoubleSide});
const floorMat=new THREE.MeshStandardMaterial({color:0x7a5c2e,roughness:0.92,metalness:0.02});
const ceilMat=new THREE.MeshStandardMaterial({color:0xf0ece6,roughness:0.95});
const baseMat=new THREE.MeshStandardMaterial({color:0xfaf7f2,roughness:0.8});

// ── DISPOSAL (prevents GPU leak on rebuild/remove) ──────────────────────────
const SHARED_MATS=new Set([wallMat,floorMat,ceilMat,baseMat]); // never dispose these
function disposeRoomChild(o){
  o.traverse(c=>{
    if(c.geometry) c.geometry.dispose();
    const mats=c.material?(Array.isArray(c.material)?c.material:[c.material]):[];
    mats.forEach(m=>{ if(!SHARED_MATS.has(m)){ if(m.map)m.map.dispose(); m.dispose(); } });
  });
}
function disposeFurniture(g){ // all furniture materials are per-instance — safe to dispose
  g.traverse(c=>{
    if(c.geometry) c.geometry.dispose();
    const mats=c.material?(Array.isArray(c.material)?c.material:[c.material]):[];
    mats.forEach(m=>{ if(m.map)m.map.dispose(); m.dispose(); });
  });
}

// ── ROOM ──────────────────────────────────────────────────────────────────
let RW=8,RH=3,RD=8;
const WT=0.12;
const roomGroup=new THREE.Group();
scene.add(roomGroup);
const wallMeshes={};

function buildRoom(){
  while(roomGroup.children.length){ const c=roomGroup.children[0]; disposeRoomChild(c); roomGroup.remove(c); }

  // Floor with plank lines
  const floor=new THREE.Mesh(new THREE.BoxGeometry(RW,0.08,RD),floorMat);
  floor.position.y=-0.04; floor.receiveShadow=true;
  roomGroup.add(floor);
  const lm=new THREE.MeshBasicMaterial({color:0x4d3010,transparent:true,opacity:0.2});
  for(let i=-RW/2+0.8;i<RW/2;i+=0.8){
    const plank=new THREE.Mesh(new THREE.BoxGeometry(0.018,0.001,RD),lm);
    plank.position.set(i,0.01,0); floor.add(plank);
  }

  // Ceiling (hidden, toggle via button if needed)
  const ceil=new THREE.Mesh(new THREE.BoxGeometry(RW,0.08,RD),ceilMat);
  ceil.position.y=RH+0.04; ceil.receiveShadow=true; ceil.visible=false;
  roomGroup.add(ceil);

  // Subtle grid
  const grid=new THREE.GridHelper(Math.max(RW,RD)+2,Math.max(RW,RD)+2,0x18182a,0x121220);
  grid.position.y=0.005; roomGroup.add(grid);

  // Walls
  function makeWall(id,x,y,z,w,h,d){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
    roomGroup.add(m); wallMeshes[id]=m;
    const bb=new THREE.Mesh(new THREE.BoxGeometry(w,0.09,d),baseMat);
    bb.position.y=-h/2+0.045; m.add(bb);
    const cm=new THREE.Mesh(new THREE.BoxGeometry(w,0.055,d),baseMat);
    cm.position.y=h/2-0.028; m.add(cm);
    // Restore previous visibility
    const btn=document.getElementById('w'+id);
    if(btn&&!btn.classList.contains('on')) m.visible=false;
  }
  makeWall('N',0,RH/2,-RD/2-WT/2, RW,RH,WT);
  makeWall('S',0,RH/2, RD/2+WT/2, RW,RH,WT);
  makeWall('E', RW/2+WT/2,RH/2,0, WT,RH,RD+WT*2);
  makeWall('W',-RW/2-WT/2,RH/2,0, WT,RH,RD+WT*2);
}
buildRoom();

function toggleWall(id){
  const m=wallMeshes[id]; if(!m)return;
  m.visible=!m.visible;
  const btn=document.getElementById('w'+id);
  btn.classList.toggle('on',m.visible);
}

function resizeRoom(axis,v){
  v=parseFloat(v);
  if(axis==='w'){RW=v;document.getElementById('rwV').textContent=v+'m';}
  else if(axis==='d'){RD=v;document.getElementById('rdV').textContent=v+'m';}
  else{RH=v;document.getElementById('rhV').textContent=v.toFixed(1)+'m';}
  buildRoom(); resetCamera();
}

// ── CAMERA ORBIT ──────────────────────────────────────────────────────────
let θ=0.55,φ=1.0,r=16;
const tgt=new THREE.Vector3(0,1.2,0);
function updateCam(){
  camera.position.set(tgt.x+r*Math.sin(φ)*Math.sin(θ),tgt.y+r*Math.cos(φ),tgt.z+r*Math.sin(φ)*Math.cos(θ));
  camera.lookAt(tgt);
}
function resetCamera(){r=Math.max(RW,RD)*2;θ=0.55;φ=1.0;tgt.set(0,1.2,0);updateCam();}
updateCam();

// ── FURNITURE DEFINITIONS ─────────────────────────────────────────────────
const FDEF={
  sofa:{label:'Sofa',c:0x4a6fa5,build(g){
    const m=g.mat;
    const seat=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.32,0.95),m); seat.position.y=0.32; g.add(seat);
    const back=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.66,0.15),m); back.position.set(0,0.65,-0.41); g.add(back);
    [-1.02,1.02].forEach(x=>{const a=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.44,0.95),m);a.position.set(x,0.42,0);g.add(a);});
    const cm=new THREE.MeshStandardMaterial({color:0x6b8fc2,roughness:0.85});
    [-0.7,0,0.7].forEach(x=>{const cs=new THREE.Mesh(new THREE.BoxGeometry(0.58,0.1,0.82),cm);cs.position.set(x,0.52,0);g.add(cs);});
    const lm=new THREE.MeshStandardMaterial({color:0x2c1f12,roughness:0.6,metalness:0.15});

// ── FURNITURE MANAGEMENT ──────────────────────────────────────────────────
const furniture=[];
let selected=null;

function makeFurnGroup(type,x,z,ry=0){
  const def=FDEF[type]; if(!def) return null;
  const g=new THREE.Group();
  g.mat=new THREE.MeshStandardMaterial({color:def.c,roughness:0.82,metalness:0.04});
  g.userData={type,label:def.label};
  def.build(g);
  g.position.set(x,0,z); g.rotation.y=ry;
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;c.userData.pg=g;}});
  scene.add(g); furniture.push(g);
  return g;
}

function addFurniture(type){
  const x=(Math.random()-.5)*(RW-2.5);
  const z=(Math.random()-.5)*(RD-2.5);
  makeFurnGroup(type,x,z,Math.round(Math.random()*7)*Math.PI/4);
}

function select(g){
  if(selected) deselect();
  selected=g; if(!g) return;
  g.traverse(c=>{if(c.isMesh&&c.material){c.material.emissive=new THREE.Color(0x443322);c.material.emissiveIntensity=0.28;}});
  document.getElementById('selPanel').classList.add('vis');
  document.getElementById('selName').textContent=g.userData.label;
  document.getElementById('itemColor').value='#'+g.mat.color.getHexString();
  const banner=document.getElementById('selBanner');
  banner.style.display='block';
  banner.textContent='✦ '+g.userData.label+' — drag to move · ↺ ↻ to rotate';
  document.getElementById('rotControls').classList.add('vis');
}
function deselect(){
  if(selected){selected.traverse(c=>{if(c.isMesh&&c.material){c.material.emissive=new THREE.Color(0);c.material.emissiveIntensity=0;}});selected=null;}
  document.getElementById('selPanel').classList.remove('vis');
  document.getElementById('selBanner').style.display='none';
  document.getElementById('rotControls').classList.remove('vis');
}
function rotateSelBy(d){if(selected) selected.rotation.y+=d;}
function rotateSel(){rotateSelBy(Math.PI/4);}
function deleteSel(){
  if(!selected)return;
  scene.remove(selected);
  disposeFurniture(selected);
  const i=furniture.indexOf(selected);
  if(i>-1)furniture.splice(i,1);
  deselect();
}
function updateItemColor(hex){if(selected) selected.mat.color.set(hex);}
function clearRoom(){furniture.forEach(f=>{scene.remove(f);disposeFurniture(f);});furniture.length=0;deselect();}

// ── PRESETS ───────────────────────────────────────────────────────────────
const PRESETS={
  living:[{t:'sofa',x:0,z:-2.5,r:0},{t:'loveseat',x:-2.8,z:-.5,r:Math.PI/2},{t:'coffeeTable',x:0,z:-1,r:0},{t:'tv',x:0,z:3.3,r:Math.PI},{t:'lamp',x:-3.2,z:-3.2,r:0},{t:'rug',x:0,z:-1.6,r:0},{t:'plant',x:3,z:3,r:0}],
  bedroom:[{t:'bed',x:0,z:-2.4,r:0},{t:'dresser',x:-3.2,z:-2.8,r:Math.PI/2},{t:'dresser',x:3.2,z:-2.8,r:-Math.PI/2},{t:'lamp',x:2.6,z:-2.2,r:0},{t:'plant',x:-3,z:2.5,r:0}],
  dining:[{t:'diningTable',x:0,z:0,r:0},{t:'chair',x:0,z:-1.3,r:0},{t:'chair',x:0,z:1.3,r:Math.PI},{t:'chair',x:-1.2,z:0,r:Math.PI/2},{t:'chair',x:1.2,z:0,r:-Math.PI/2},{t:'bookshelf',x:-3.5,z:-3.5,r:0},{t:'plant',x:3,z:3,r:0}],
  open:[{t:'sofa',x:-1.5,z:-2.5,r:Math.PI/8},{t:'coffeeTable',x:-1.5,z:-1.1,r:0},{t:'tv',x:-3.5,z:.5,r:Math.PI/2},{t:'diningTable',x:2,z:2,r:0},{t:'chair',x:2,z:3.3,r:Math.PI},{t:'chair',x:2,z:.7,r:0},{t:'lamp',x:3.5,z:-3,r:0},{t:'rug',x:-1.5,z:-1.6,r:Math.PI/8}],
  empty:[]
};

function loadPreset(name){
  clearRoom();
  ['N','S','E','W'].forEach(id=>{wallMeshes[id].visible=true;document.getElementById('w'+id).classList.add('on');});
  if(name==='open'){wallMeshes['S'].visible=false;document.getElementById('wS').classList.remove('on');}
  (PRESETS[name]||[]).forEach(p=>makeFurnGroup(p.t,p.x,p.z,p.r));
  resetCamera();
}
loadPreset('living');
resetCamera();
document.getElementById('presetSel').addEventListener('change',e=>loadPreset(e.target.value));

// ── INTERACTION (unified Pointer Events: mouse + touch + pen) ──────────────
const ray=new THREE.Raycaster();
const m2=new THREE.Vector2();
const floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const dragOffset=new THREE.Vector2();
const selHalf={x:0.5,z:0.5};                     // cached footprint of the piece being dragged
const pointers=new Map();                 // pointerId → {x,y}  (pinch detection)
let primaryId=null,orbiting=false,movingF=false,pX=0,pY=0,sX=0,sY=0,pinchPrev=0,gestureMulti=false;

function ndc(x,y){const rect=cvEl.getBoundingClientRect();m2.x=((x-rect.left)/rect.width)*2-1;m2.y=-((y-rect.top)/rect.height)*2+1;}
function pinchDist(){const p=[...pointers.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}

cvEl.addEventListener('pointerdown',e=>{
  cvEl.setPointerCapture(e.pointerId);                    // keeps move/up firing off-canvas
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){gestureMulti=true;orbiting=false;movingF=false;cvEl.classList.remove('grabbing','moving');pinchPrev=pinchDist();return;}
  if(pointers.size>2) return;
  primaryId=e.pointerId; sX=pX=e.clientX; sY=pY=e.clientY;
  ndc(e.clientX,e.clientY); ray.setFromCamera(m2,camera);
  if(selected){
    const hits=ray.intersectObjects(selected.children,true);
    if(hits.length>0){
      const grabPt=new THREE.Vector3();
      if(ray.ray.intersectPlane(floorPlane,grabPt)) dragOffset.set(selected.position.x-grabPt.x,selected.position.z-grabPt.z);
      else dragOffset.set(0,0);
      const bb=new THREE.Box3().setFromObject(selected);   // footprint for clamp + snap (rotation-aware)
      selHalf.x=(bb.max.x-bb.min.x)/2; selHalf.z=(bb.max.z-bb.min.z)/2;
      movingF=true;cvEl.classList.add('moving');return;
    }
  }
  orbiting=true;cvEl.classList.add('grabbing');
});

cvEl.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){                                   // two fingers → pinch zoom
    const d=pinchDist();
    if(pinchPrev){r-=(d-pinchPrev)*0.05;r=Math.max(4,Math.min(30,r));updateCam();}
    pinchPrev=d; return;
  }
  if(e.pointerId!==primaryId) return;
  const dx=e.clientX-pX,dy=e.clientY-pY;
  if(movingF&&selected){                                  // drag furniture (mouse OR touch)
    ndc(e.clientX,e.clientY); ray.setFromCamera(m2,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      const hx=selHalf.x,hz=selHalf.z;
      // clamp fully inside the room using the piece footprint (not a fixed margin)
      let nx=Math.max(-RW/2+hx,Math.min(RW/2-hx, pt.x+dragOffset.x));
      let nz=Math.max(-RD/2+hz,Math.min(RD/2-hz, pt.z+dragOffset.y));
      // magnetic snap: pull flush to the nearest VISIBLE wall when edge is within threshold
      const T=0.4;
      if(wallMeshes.W&&wallMeshes.W.visible && nx-(-RW/2+hx)<T) nx=-RW/2+hx;
      else if(wallMeshes.E&&wallMeshes.E.visible && (RW/2-hx)-nx<T) nx=RW/2-hx;
      if(wallMeshes.N&&wallMeshes.N.visible && nz-(-RD/2+hz)<T) nz=-RD/2+hz;
      else if(wallMeshes.S&&wallMeshes.S.visible && (RD/2-hz)-nz<T) nz=RD/2-hz;
      selected.position.set(nx,0,nz);
    }
  } else if(orbiting){
    θ-=dx*0.007;φ-=dy*0.007;
    φ=Math.max(0.18,Math.min(Math.PI/2.1,φ));
    updateCam();
  }
  pX=e.clientX;pY=e.clientY;
});

function endPointer(e,canTap){
  const wasPrimary=e.pointerId===primaryId;
  const moved=Math.abs(e.clientX-sX)+Math.abs(e.clientY-sY);
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchPrev=0;
  if(canTap&&wasPrimary&&!movingF&&!gestureMulti&&moved<8&&pointers.size===0){ // tap → select/deselect
    ndc(e.clientX,e.clientY); ray.setFromCamera(m2,camera);
    const meshes=[]; furniture.forEach(f=>f.traverse(c=>{if(c.isMesh)meshes.push(c);}));
    const hits=ray.intersectObjects(meshes);
    if(hits.length>0){const g=hits[0].object.userData.pg; if(g&&furniture.includes(g)) g===selected?deselect():select(g);}
    else deselect();
  }
  if(wasPrimary){orbiting=false;movingF=false;primaryId=null;cvEl.classList.remove('grabbing','moving');}
  if(pointers.size===1){const [id,p]=[...pointers][0];primaryId=id;pX=sX=p.x;pY=sY=p.y;orbiting=true;} // resume orbit after pinch
  if(pointers.size===0) gestureMulti=false;
}
cvEl.addEventListener('pointerup',e=>endPointer(e,true));
cvEl.addEventListener('pointercancel',e=>endPointer(e,false));
cvEl.addEventListener('wheel',e=>{r+=e.deltaY*0.04;r=Math.max(4,Math.min(30,r));updateCam();e.preventDefault();},{passive:false});

// drawer toggle (mobile)
document.getElementById('drawerHandle').addEventListener('click',()=>document.getElementById('aside').classList.toggle('open'));

// ── CAPTURE & PRESENT ─────────────────────────────────────────────────────
function snapshot(){
  renderer.render(scene,camera);                 // guarantee a fresh frame in the buffer
  const a=document.createElement('a');
  a.download='space-preview-'+Date.now()+'.png';
  a.href=cvEl.toDataURL('image/png');
  a.click();
}
function togglePresent(){
  document.body.classList.toggle('present');
  setTimeout(resize,60);                          // refit canvas after UI show/hide
}

document.addEventListener('keydown',e=>{
  if((e.key==='Delete'||e.key==='Backspace')&&e.target===document.body) deleteSel();
  if(e.key==='Escape') deselect();
  if(e.key==='r'&&selected) rotateSel();
  if(selected){
    const s=0.25;
    if(e.key==='ArrowLeft'){selected.position.x-=s;e.preventDefault();}
    if(e.key==='ArrowRight'){selected.position.x+=s;e.preventDefault();}
    if(e.key==='ArrowUp'){selected.position.z-=s;e.preventDefault();}
    if(e.key==='ArrowDown'){selected.position.z+=s;e.preventDefault();}
  }
});

// ── RENDER LOOP ───────────────────────────────────────────────────────────
(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);})();
