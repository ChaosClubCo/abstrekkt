<!DOCTYPE html>
<!--
  ULTRATHINK Dashboard — rebuild with child pages + per-section/tab/global MD export.
  ================================================================================
  Profile:        INT (void surface, electric violet signal, editorial serif for display)
  Component:      Multi-tab knowledge-framework dashboard with hash-routed child pages
                  and Markdown export at section, tab, and global scope.
  Differentiator: Manuscript-margin IDs (V·01, C·02 monospaced in left gutter) +
                  persistent live MD preview pane that doubles as the export WYSIWYG.
                  Editorial serif (Fraunces) for principle titles only.
  States:         initial, route-success, route-404, hover, focus-visible, visited
                  (localStorage), copied/downloaded toast.
  Delivery:       Single-file HTML, no build step.

  Assumptions (made explicit because the source content was bundled / not annotated):
    - "6 Core Principles" reconstructed as: Think Different, Obsess Over Details,
      Plan Like Da Vinci, Iterate Relentlessly, Simplify Ruthlessly, Craft Over Speed.
    - Contract subsections reconstructed as: Security Floor, Response Guarantees,
      Quality Gates, Gaps & Blindspots.
    - Grammar tiers preserved as Tier 0–3 from the original.
    - Reference reconstructed as: Quick Analogies, Before Every Task, R-I-S-E,
      F-L-O-W, OWASP Checkpoint, I/O Validation.
    - Each section's "best-practices artifact" is a practitioner checklist designed
      to drop into a workflow document. Swap copy as needed; data is in DASHBOARD_DATA.

  Smoke test (open browser console, run window.UT.smokeTest()):
    1. Default route loads → tab="vision", section=null
    2. Hash → #/contract/security-floor → renders Contract › Security Floor
    3. Bad hash → #/garbage → 404 view
    4. exportSection("vision","think-different") → downloads .md
    5. exportTab("grammar") → downloads tab .md
    6. exportAll() → downloads combined .md
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRATHINK · Framework Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      /* INT tokens — surfaces */
      --surface-base:     #0a0a0f;
      --surface-raised:   #111118;
      --surface-overlay:  #18181f;
      --surface-deep:     #07070b;

      /* INT tokens — borders */
      --border-primary:   #2a2a38;
      --border-secondary: #1e1e28;
      --border-faint:     #14141c;

      /* INT tokens — accent (electric violet, used as signal only) */
      --accent:        hsl(262, 83%, 68%);
      --accent-dim:    hsl(262, 60%, 45%);
      --accent-glow:   hsla(262, 83%, 68%, 0.15);
      --accent-faint:  hsla(262, 83%, 68%, 0.06);

      /* INT tokens — text */
      --text-primary:   #f0f0f5;
      --text-secondary: #9898a8;
      --text-tertiary:  #52525e;
      --text-quiet:     #3a3a48;

      /* Type families */
      --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
      --font-body:    'Inter', system-ui, sans-serif;
      --font-code:    'IBM Plex Mono', 'Fira Code', monospace;

      /* Type scale */
      --text-xs:   11px;
      --text-sm:   13px;
      --text-base: 14px;
      --text-md:   16px;
      --text-lg:   20px;
      --text-xl:   28px;
      --text-2xl:  40px;
      --text-3xl:  56px;

      /* Spacing (8pt grid) */
      --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
      --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
      --s-12: 48px; --s-16: 64px; --s-24: 96px;

      /* Radii */
      --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-full: 999px;

      /* Semantic */
      --ok:   #22c55e;
      --warn: #f59e0b;
      --bad:  #ef4444;

      /* Motion */
      --ease-out-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-out-snap:   cubic-bezier(0.4, 0, 0.2, 1);
      --dur-fast: 120ms;
      --dur-base: 200ms;
      --dur-slow: 360ms;

      /* Layout */
      --shell-pad-x: var(--s-8);
      --max-w: 1400px;
      --margin-rule-w: 56px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--surface-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      /* atmospheric: subtle radial wash, not a flat solid */
      background-image:
        radial-gradient(ellipse 1200px 600px at 20% -10%, rgba(140, 100, 255, 0.06), transparent 60%),
        radial-gradient(ellipse 800px 400px at 80% 110%, rgba(140, 100, 255, 0.04), transparent 60%);
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    code, kbd, pre { font-family: var(--font-code); }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }

    /* ---------- App shell ---------- */
    .shell {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--s-10) var(--shell-pad-x) var(--s-24);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s-6);
      padding-bottom: var(--s-8);
      border-bottom: 1px solid var(--border-secondary);
      margin-bottom: var(--s-10);
    }
    .brand {
      display: flex; align-items: baseline; gap: var(--s-3);
    }
    .brand__mark {
      font-family: var(--font-code);
      font-size: var(--text-xs);
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .brand__name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--text-lg);
      letter-spacing: -0.01em;
    }
    .brand__sub {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      margin-left: var(--s-3);
    }

    .toolbar { display: flex; gap: var(--s-2); align-items: center; }
    .btn {
      display: inline-flex; align-items: center; gap: var(--s-2);
      padding: var(--s-2) var(--s-4);
      border: 1px solid var(--border-primary);
      border-radius: var(--r-md);
      background: var(--surface-raised);
      color: var(--text-primary);
      font-size: var(--text-sm);
      font-weight: 500;
      transition: border-color var(--dur-fast) var(--ease-out-snap),
                  background var(--dur-fast) var(--ease-out-snap),
                  transform var(--dur-fast) var(--ease-out-snap);
    }
    .btn:hover { border-color: var(--accent-dim); background: var(--surface-overlay); }
    .btn:active { transform: translateY(1px); }
    .btn--accent {
      border-color: var(--accent-dim);
      background: var(--accent-faint);
      color: var(--accent);
    }
    .btn--accent:hover { background: var(--accent-glow); border-color: var(--accent); }
    .btn--ghost { background: transparent; }
    .btn[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-faint);
    }
    .btn .ico { width: 14px; height: 14px; flex-shrink: 0; }

    /* ---------- Tab bar ---------- */
    .tabs {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border-secondary);
      margin-bottom: var(--s-10);
      overflow-x: auto;
    }
    .tab {
      display: inline-flex; align-items: baseline; gap: var(--s-3);
      padding: var(--s-4) var(--s-5);
      border: 0; background: transparent;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color var(--dur-fast) var(--ease-out-snap),
                  border-color var(--dur-fast) var(--ease-out-snap);
      white-space: nowrap;
    }
    .tab__id {
      font-family: var(--font-code);
      font-size: var(--text-xs);
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
    }
    .tab:hover { color: var(--text-primary); }
    .tab[aria-selected="true"] {
      color: var(--text-primary);
      border-bottom-color: var(--accent);
    }
    .tab[aria-selected="true"] .tab__id { color: var(--accent); }

    /* ---------- Layout: sidebar + content + preview ---------- */
    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 380px;
      gap: var(--s-8);
    }
    @media (max-width: 1180px) {
      .layout { grid-template-columns: 200px minmax(0, 1fr); }
      .preview { display: none; }
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { order: 2; }
      :root { --shell-pad-x: var(--s-4); }
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      position: sticky;
      top: var(--s-6);
      align-self: start;
      max-height: calc(100vh - var(--s-12));
      overflow-y: auto;
      padding-right: var(--s-2);
    }
    .sidebar__title {
      font-family: var(--font-code);
      font-size: var(--text-xs);
      letter-spacing: 0.14em;
      color: var(--text-tertiary);
      text-transform: uppercase;
      margin: 0 0 var(--s-3);
      padding-left: var(--s-3);
    }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav__item {
      display: grid;
      grid-template-columns: 32px 1fr 8px;
      align-items: center;
      gap: var(--s-2);
      padding: var(--s-2) var(--s-3);
      border-radius: var(--r-sm);
      color: var(--text-secondary);
      font-size: var(--text-sm);
      transition: background var(--dur-fast) var(--ease-out-snap),
                  color var(--dur-fast) var(--ease-out-snap);
      border: 1px solid transparent;
    }
    .nav__item:hover { background: var(--surface-raised); color: var(--text-primary); }
    .nav__item[aria-current="page"] {
      background: var(--accent-faint);
      color: var(--text-primary);
      border-color: var(--accent-dim);
    }
    .nav__id {
      font-family: var(--font-code);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
    }
    .nav__item[aria-current="page"] .nav__id { color: var(--accent); }
    .nav__dot {
      width: 6px; height: 6px; border-radius: var(--r-full);
      background: var(--text-quiet);
    }
    .nav__item.is-visited .nav__dot { background: var(--accent); }

    /* ---------- Content ---------- */
    .content { min-width: 0; }
    .breadcrumbs {
      display: flex; align-items: center; gap: var(--s-2);
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: var(--font-code);
      margin-bottom: var(--s-4);
    }
    .breadcrumbs a:hover { color: var(--accent); }
    .breadcrumbs .sep { color: var(--text-quiet); }

    .page-head {
      position: relative;
      padding-left: var(--margin-rule-w);
      margin-bottom: var(--s-8);
      padding-bottom: var(--s-6);
      border-bottom: 1px solid var(--border-secondary);
    }
    /* Manuscript margin: monospaced section ID set in the gutter */
    .page-head__id {
      position: absolute;
      left: 0;
      top: 8px;
      font-family: var(--font-code);
      font-size: var(--text-xs);
      letter-spacing: 0.12em;
      color: var(--accent);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      padding: var(--s-2) 0;
      border-left: 1px solid var(--accent-dim);
    }
    .page-head__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--text-3xl);
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0 0 var(--s-3);
      color: var(--text-primary);
    }
    .page-head__provocation {
      font-family: var(--font-display);
      font-style: italic;
      font-size: var(--text-md);
      color: var(--text-secondary);
      max-width: 56ch;
      margin: 0;
    }

    /* Section blocks */
    .block { padding-left: var(--margin-rule-w); margin-bottom: var(--s-10); }
    .block__label {
      display: inline-flex; align-items: center; gap: var(--s-2);
      font-family: var(--font-code);
      font-size: var(--text-xs);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: var(--s-3);
    }
    .block__label::before {
      content: ""; display: inline-block;
      width: 24px; height: 1px;
      background: var(--accent-dim);
    }
    .block p { margin: 0 0 var(--s-3); max-width: 64ch; }
    .block ul { padding-left: var(--s-5); margin: 0 0 var(--s-3); max-width: 64ch; }
    .block li { margin-bottom: var(--s-2); }
    .block li::marker { color: var(--accent-dim); }

    .checklist { list-style: none; padding: 0; }
    .checklist li {
      position: relative;
      padding: var(--s-2) 0 var(--s-2) var(--s-6);
      border-bottom: 1px dashed var(--border-faint);
    }
    .checklist li::before {
      content: "";
      position: absolute;
      left: 0; top: 14px;
      width: 12px; height: 12px;
      border: 1px solid var(--accent-dim);
      border-radius: 2px;
    }

    .related {
      display: flex; flex-wrap: wrap; gap: var(--s-2);
    }
    .related a {
      display: inline-flex; align-items: center; gap: var(--s-2);
      padding: var(--s-2) var(--s-3);
      background: var(--surface-raised);
      border: 1px solid var(--border-primary);
      border-radius: var(--r-md);
      font-size: var(--text-sm);
      transition: border-color var(--dur-fast) var(--ease-out-snap);
    }
    .related a:hover { border-color: var(--accent-dim); color: var(--accent); }
    .related a .id {
      font-family: var(--font-code);
      font-size: 10px;
      color: var(--text-tertiary);
    }

    /* Tab overview cards */
    .overview { padding-left: var(--margin-rule-w); }
    .overview__intro {
      font-family: var(--font-display);
      font-style: italic;
      font-size: var(--text-md);
      color: var(--text-secondary);
      max-width: 56ch;
      margin: 0 0 var(--s-8);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--s-4);
    }
    .card {
      display: flex; flex-direction: column; gap: var(--s-3);
      padding: var(--s-5);
      background: var(--surface-raised);
      border: 1px solid var(--border-primary);
      border-radius: var(--r-md);
      transition: border-color var(--dur-base) var(--ease-out-snap),
                  transform var(--dur-base) var(--ease-out-snap);
      min-height: 160px;
    }
    .card:hover {
      border-color: var(--accent-dim);
      transform: translateY(-2px);
    }
    .card__id {
      font-family: var(--font-code);
      font-size: var(--text-xs);
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
    }
    .card:hover .card__id { color: var(--accent); }
    .card__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--text-lg);
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--text-primary);
      margin: 0;
    }
    .card__desc {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.5;
    }
    .card__foot {
      margin-top: auto;
      display: flex; align-items: center; justify-content: space-between;
      padding-top: var(--s-3);
      border-top: 1px solid var(--border-secondary);
      font-size: var(--text-xs);
      color: var(--text-tertiary);
    }

    /* ---------- Preview pane ---------- */
    .preview {
      position: sticky;
      top: var(--s-6);
      align-self: start;
      max-height: calc(100vh - var(--s-12));
      display: flex; flex-direction: column;
      background: var(--surface-deep);
      border: 1px solid var(--border-primary);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .preview__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--s-3) var(--s-4);
      border-bottom: 1px solid var(--border-secondary);
      background: var(--surface-raised);
    }
    .preview__label {
      display: flex; align-items: center; gap: var(--s-2);
      font-family: var(--font-code);
      font-size: var(--text-xs);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .preview__dot {
      width: 8px; height: 8px; border-radius: var(--r-full);
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }
    .preview__actions { display: flex; gap: var(--s-1); }
    .preview__body {
      flex: 1;
      overflow: auto;
      padding: var(--s-4);
      font-family: var(--font-code);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .preview__body .h { color: var(--accent); font-weight: 500; }
    .preview__body .q { color: var(--text-primary); font-style: italic; }
    .preview__body .b { color: var(--text-tertiary); }
    .preview__foot {
      padding: var(--s-3) var(--s-4);
      border-top: 1px solid var(--border-secondary);
      display: flex; align-items: center; justify-content: space-between;
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      background: var(--surface-raised);
    }
    .preview__count { font-family: var(--font-code); }

    /* ---------- Toast ---------- */
    .toast-stack {
      position: fixed;
      right: var(--s-6);
      bottom: var(--s-6);
      display: flex; flex-direction: column-reverse; gap: var(--s-2);
      z-index: 300;
      pointer-events: none;
    }
    .toast {
      display: flex; align-items: center; gap: var(--s-3);
      padding: var(--s-3) var(--s-4);
      background: var(--surface-overlay);
      border: 1px solid var(--accent-dim);
      border-radius: var(--r-md);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      font-size: var(--text-sm);
      animation: toast-in var(--dur-base) var(--ease-out-snap);
      max-width: 360px;
    }
    .toast__dot {
      width: 8px; height: 8px; border-radius: var(--r-full);
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- 404 ---------- */
    .err {
      padding: var(--s-12) var(--margin-rule-w) var(--s-16);
      text-align: left;
      border-left: 1px solid var(--bad);
    }
    .err__code {
      font-family: var(--font-code);
      font-size: var(--text-xs);
      color: var(--bad);
      letter-spacing: 0.1em;
      margin-bottom: var(--s-3);
    }
    .err__title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      margin: 0 0 var(--s-3);
    }

    /* Skip-to-content for keyboard users */
    .skip {
      position: absolute; left: -9999px;
      padding: var(--s-2) var(--s-3);
      background: var(--accent);
      color: var(--surface-base);
      font-weight: 600;
      border-radius: var(--r-sm);
    }
    .skip:focus { left: var(--s-4); top: var(--s-4); z-index: 999; }

    .ico { display: inline-block; vertical-align: middle; }
  </style>
</head>
<body>
  <a href="#main" class="skip">Skip to content</a>
  <div class="shell">
    <header class="topbar" role="banner">
      <div class="brand">
        <span class="brand__mark">UT · 01</span>
        <span class="brand__name">ULTRATHINK</span>
        <span class="brand__sub">Framework dashboard</span>
      </div>
      <div class="toolbar" role="toolbar" aria-label="Global actions">
        <button class="btn" id="btn-export-tab" type="button" aria-label="Export current tab as Markdown">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export tab
        </button>
        <button class="btn btn--accent" id="btn-export-all" type="button" aria-label="Export entire framework as Markdown">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Export all
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Framework sections"></nav>

    <main class="layout" id="main">
      <aside class="sidebar" aria-label="Section navigation">
        <p class="sidebar__title" id="sidebar-title">Sections</p>
        <div class="nav" id="nav" role="navigation"></div>
      </aside>

      <article class="content" id="content" aria-live="polite"></article>

      <aside class="preview" aria-label="Markdown export preview">
        <div class="preview__head">
          <span class="preview__label"><span class="preview__dot"></span> Export preview</span>

  };

  /* =====================================================================
     Markdown serializer.
     Single source: walks DASHBOARD_DATA, produces MD strings used both
     for the live preview pane and for downloadable .md files.
     ===================================================================== */
  const MD = {
    section(tab, sec) {
      const lines = [];
      lines.push(`# ${tab.label} · ${tab.code}·${pad2(sec.idx)} ${sec.label}`);
      if (sec.provocation) lines.push(`> ${sec.provocation}`);
      lines.push("");
      lines.push("## TL;DR");
      lines.push(sec.tldr);
      lines.push("");
      if (sec.analogy) {
        lines.push("## Analogy");
        lines.push(sec.analogy);
        lines.push("");
      }
      if (sec.concrete) {
        lines.push("## Concrete example");
        lines.push(sec.concrete);
        lines.push("");
      }
      lines.push("## Operational definition");
      sec.operational.forEach(b => lines.push(`- ${b}`));
      lines.push("");
      lines.push("## Anti-patterns");
      sec.antiPatterns.forEach(b => lines.push(`- ${b}`));
      lines.push("");
      lines.push("## Practitioner checklist");
      sec.checklist.forEach(b => lines.push(`- [ ] ${b}`));
      lines.push("");
      if (sec.related && sec.related.length) {
        lines.push("## Related");
        sec.related.forEach(r => lines.push(`- ${r}`));
        lines.push("");
      }
      lines.push("---");
      lines.push(`_Generated from ULTRATHINK Framework v${DASHBOARD_DATA.meta.version} · ${DASHBOARD_DATA.meta.generated}_`);
      return lines.join("\n");
    },
    tab(tab) {
      const lines = [];
      lines.push(`# ULTRATHINK · ${tab.label}`);
      lines.push(`> ${tab.intro}`);
      lines.push("");
      lines.push(`Tab code: \`${tab.code}\` · Sections: ${tab.sections.length}`);
      lines.push("");
      tab.sections.forEach((sec, idx) => {
        lines.push(`## ${tab.code}·${pad2(idx + 1)} ${sec.label}`);
        if (sec.provocation) lines.push(`> ${sec.provocation}`);
        lines.push("");
        lines.push(`**TL;DR.** ${sec.tldr}`);
        lines.push("");
        lines.push("**Operational:**");
        sec.operational.forEach(b => lines.push(`- ${b}`));
        lines.push("");
        lines.push("**Practitioner checklist:**");
        sec.checklist.forEach(b => lines.push(`- [ ] ${b}`));
        lines.push("");
        lines.push("---");
        lines.push("");
      });
      lines.push(`_Generated from ULTRATHINK Framework v${DASHBOARD_DATA.meta.version} · ${DASHBOARD_DATA.meta.generated}_`);
      return lines.join("\n");
    },
    all() {
      const lines = [];
      lines.push(`# ${DASHBOARD_DATA.meta.title}`);
      lines.push(`> ${DASHBOARD_DATA.meta.tagline}`);
      lines.push("");
      lines.push(`Version ${DASHBOARD_DATA.meta.version} · ${DASHBOARD_DATA.meta.generated}`);
      lines.push("");
      lines.push("## Table of contents");
      DASHBOARD_DATA.tabs.forEach(tab => {
        lines.push(`- **${tab.label}** — ${tab.intro}`);
        tab.sections.forEach((sec, idx) => {
          lines.push(`  - ${tab.code}·${pad2(idx + 1)} ${sec.label}`);
        });
      });
      lines.push("");
      lines.push("---");
      lines.push("");
      DASHBOARD_DATA.tabs.forEach(tab => {
        lines.push(`# ${tab.label}`);
        lines.push(`> ${tab.intro}`);
        lines.push("");
        tab.sections.forEach((sec, idx) => {
          const sectionMD = MD.section(tab, { ...sec, idx: idx + 1 });
          // Demote the H1 to H2 for the combined doc
          lines.push(sectionMD.replace(/^# /, "## "));
          lines.push("");
        });
        lines.push("");
      });
      return lines.join("\n");
    }
  };

  function pad2(n) { return String(n).padStart(2, "0"); }
  function slugify(str) {
    return String(str).toLowerCase()
      .replace(/[^\w\s-]/g, "")
      .replace(/\s+/g, "-")
      .replace(/-+/g, "-");
  }

  /* =====================================================================
     Router & state
     ===================================================================== */
  const STATE = {
    tabId: "vision",
    sectionId: null,
    visited: loadVisited()
  };

  function loadVisited() {
    try {
      const raw = localStorage.getItem("ut.visited");
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch { return new Set(); }
  }
  function saveVisited() {
    try { localStorage.setItem("ut.visited", JSON.stringify([...STATE.visited])); }
    catch { /* storage unavailable; soft-fail */ }
  }

  function parseHash() {
    const h = location.hash.replace(/^#\/?/, "");
    if (!h) return { tabId: "vision", sectionId: null };
    const parts = h.split("/").filter(Boolean);
    return { tabId: parts[0] || "vision", sectionId: parts[1] || null };
  }

  function setRoute(tabId, sectionId) {
    const target = sectionId ? `#/${tabId}/${sectionId}` : `#/${tabId}`;
    if (location.hash !== target) {
      location.hash = target;
    } else {
      // Same hash, force re-render
      handleRoute();
    }
  }

  function findTab(id) { return DASHBOARD_DATA.tabs.find(t => t.id === id); }
  function findSection(tab, id) { return tab && tab.sections.find(s => s.id === id); }
  function sectionIdx(tab, id) {
    if (!tab || !id) return -1;
    return tab.sections.findIndex(s => s.id === id);
  }

  function handleRoute() {
    const { tabId, sectionId } = parseHash();
    const tab = findTab(tabId);
    if (!tab) {
      renderError(`No tab named "${tabId}".`);
      return;
    }
    if (sectionId && !findSection(tab, sectionId)) {
      renderError(`No section "${sectionId}" in tab "${tab.label}".`);
      return;
    }
    STATE.tabId = tabId;
    STATE.sectionId = sectionId;
    if (sectionId) {
      STATE.visited.add(`${tabId}/${sectionId}`);
      saveVisited();
    }
    renderTabs();
    renderSidebar();
    renderContent();
    renderPreview();
    document.title = sectionId
      ? `${findSection(tab, sectionId).label} · ${tab.label} · ULTRATHINK`
      : `${tab.label} · ULTRATHINK`;
  }

  /* =====================================================================
     Renderers
     ===================================================================== */
  const $ = (sel) => document.querySelector(sel);

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") {
        node.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (v === true) node.setAttribute(k, "");
      else if (v === false || v === null || v === undefined) { /* skip */ }
      else node.setAttribute(k, v);
    }
    for (const c of children) {
      if (c == null || c === false) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  }

  function renderTabs() {
    const bar = $("#tabs");
    bar.innerHTML = "";
    DASHBOARD_DATA.tabs.forEach((tab, i) => {
      const btn = el("button", {
        class: "tab",
        type: "button",
        role: "tab",
        "aria-selected": tab.id === STATE.tabId ? "true" : "false",
        "aria-controls": "content",
        onclick: () => setRoute(tab.id, null)
      },
        el("span", { class: "tab__id" }, `${tab.code}·0${i + 1}`),
        document.createTextNode(tab.label)
      );
      bar.appendChild(btn);
    });
  }

  function renderSidebar() {
    const tab = findTab(STATE.tabId);
    const nav = $("#nav");
    const title = $("#sidebar-title");
    title.textContent = `${tab.label} · ${tab.sections.length} sections`;
    nav.innerHTML = "";

    // Overview link (tab root)
    nav.appendChild(el("a", {
      class: "nav__item",
      href: `#/${tab.id}`,
      "aria-current": STATE.sectionId === null ? "page" : false,
      onclick: (e) => { e.preventDefault(); setRoute(tab.id, null); }
    },
      el("span", { class: "nav__id" }, `${tab.code}·00`),
      el("span", null, "Overview"),
      el("span", { class: "nav__dot" })
    ));

    tab.sections.forEach((sec, i) => {
      const visited = STATE.visited.has(`${tab.id}/${sec.id}`);
      nav.appendChild(el("a", {
        class: "nav__item" + (visited ? " is-visited" : ""),
        href: `#/${tab.id}/${sec.id}`,
        "aria-current": STATE.sectionId === sec.id ? "page" : false,
        onclick: (e) => { e.preventDefault(); setRoute(tab.id, sec.id); }
      },
        el("span", { class: "nav__id" }, `${tab.code}·${pad2(i + 1)}`),
        el("span", null, sec.label),
        el("span", { class: "nav__dot" })
      ));
    });
  }

  function renderContent() {
    const tab = findTab(STATE.tabId);
    const root = $("#content");
    root.innerHTML = "";

    // Breadcrumbs
    const crumbs = el("nav", { class: "breadcrumbs", "aria-label": "Breadcrumbs" });
    crumbs.appendChild(el("a", { href: "#/vision", onclick: (e) => { e.preventDefault(); setRoute("vision", null); } }, "ULTRATHINK"));
    crumbs.appendChild(el("span", { class: "sep" }, "/"));
    crumbs.appendChild(el("a", { href: `#/${tab.id}`, onclick: (e) => { e.preventDefault(); setRoute(tab.id, null); } }, tab.label));
    if (STATE.sectionId) {
      const sec = findSection(tab, STATE.sectionId);
      crumbs.appendChild(el("span", { class: "sep" }, "/"));
      crumbs.appendChild(el("span", null, sec.label));
    }
    root.appendChild(crumbs);

    if (!STATE.sectionId) {
      renderTabOverview(root, tab);
    } else {
      renderSection(root, tab);
    }
  }

  function renderTabOverview(root, tab) {
    root.appendChild(el("div", { class: "page-head" },
      el("span", { class: "page-head__id" }, `${tab.code} · 00`),
      el("h1", { class: "page-head__title" }, tab.label),
      el("p", { class: "page-head__provocation" }, tab.intro)
    ));

    const wrap = el("div", { class: "overview" });
    const grid = el("div", { class: "grid" });
    tab.sections.forEach((sec, i) => {
      const visited = STATE.visited.has(`${tab.id}/${sec.id}`);
      const card = el("a", {
        class: "card",
        href: `#/${tab.id}/${sec.id}`,
        onclick: (e) => { e.preventDefault(); setRoute(tab.id, sec.id); }
      },
        el("span", { class: "card__id" }, `${tab.code}·${pad2(i + 1)}`),
        el("h3", { class: "card__title" }, sec.label),
        el("p", { class: "card__desc" }, sec.tldr.slice(0, 140) + (sec.tldr.length > 140 ? "…" : "")),
        el("div", { class: "card__foot" },
          el("span", null, sec.checklist.length + " checklist items"),
          el("span", null, visited ? "✓ Read" : "Read →")
        )
      );
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    root.appendChild(wrap);
  }

  function renderSection(root, tab) {
    const sec = findSection(tab, STATE.sectionId);
    const idx = sectionIdx(tab, sec.id) + 1;

    root.appendChild(el("div", { class: "page-head" },
      el("span", { class: "page-head__id" }, `${tab.code} · ${pad2(idx)}`),
      el("h1", { class: "page-head__title" }, sec.label),
      el("p", { class: "page-head__provocation" }, sec.provocation)
    ));

    // TL;DR
    root.appendChild(blockEl("TL;DR", el("p", null, sec.tldr)));

    // Analogy
    if (sec.analogy) {
      root.appendChild(blockEl("Analogy", el("p", null, sec.analogy)));
    }

    // Concrete
    if (sec.concrete) {
      root.appendChild(blockEl("Concrete example", el("p", null, sec.concrete)));
    }

    // Operational
    const ulOp = el("ul");
    sec.operational.forEach(b => ulOp.appendChild(el("li", null, b)));
    root.appendChild(blockEl("Operational definition", ulOp));

    // Anti-patterns
    const ulAp = el("ul");
    sec.antiPatterns.forEach(b => ulAp.appendChild(el("li", null, b)));
    root.appendChild(blockEl("Anti-patterns", ulAp));

    // Checklist (the practitioner artifact)
    const ulCk = el("ul", { class: "checklist" });
    sec.checklist.forEach(b => ulCk.appendChild(el("li", null, b)));
    root.appendChild(blockEl("Practitioner checklist · best-practices artifact", ulCk));

    // Related
    if (sec.related && sec.related.length) {
      const rel = el("div", { class: "related" });
      sec.related.forEach(r => {
        const [tId, sId] = r.split("/");
        const t = findTab(tId);
        const s = t && findSection(t, sId);
        if (!t || !s) return;
        const i = sectionIdx(t, sId) + 1;
        rel.appendChild(el("a", {
          href: `#/${tId}/${sId}`,
          onclick: (e) => { e.preventDefault(); setRoute(tId, sId); }
        },
          el("span", { class: "id" }, `${t.code}·${pad2(i)}`),
          el("span", null, s.label)
        ));
      });
      root.appendChild(blockEl("Related", rel));
    }

    // Per-section export bar
    const exportBar = el("div", { class: "block" },
      el("span", { class: "block__label" }, "Export this section"),
      el("div", { style: "display:flex; gap:8px; flex-wrap: wrap;" },
        el("button", {
          class: "btn btn--accent",
          type: "button",
          onclick: () => downloadMD(MD.section(tab, { ...sec, idx }), sectionFilename(tab, sec))
        },
          iconDownload(), "Download .md"
        ),
        el("button", {
          class: "btn",
          type: "button",
          onclick: () => copyToClipboard(MD.section(tab, { ...sec, idx }))
        },
          iconCopy(), "Copy Markdown"
        )
      )
    );
    root.appendChild(exportBar);
  }

  function blockEl(label, body) {
    return el("section", { class: "block" },
      el("span", { class: "block__label" }, label),
      body
    );
  }

  function iconDownload() {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "ico");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.8");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.innerHTML = `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`;
    return svg;
  }
  function iconCopy() {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "ico");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.8");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.innerHTML = `<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>`;
    return svg;
  }

  function renderError(msg) {
    const root = $("#content");
    root.innerHTML = "";
    root.appendChild(el("div", { class: "err" },
      el("p", { class: "err__code" }, "404 · ROUTE NOT FOUND"),
      el("h1", { class: "err__title" }, msg),
      el("p", null, "Try the tabs above or jump to ",
        el("a", { href: "#/vision", style: "color: var(--accent); text-decoration: underline;" }, "Vision"),
        "."
      )
    ));
    $("#preview-body").textContent = "";
    $("#preview-meta").textContent = "—";
    $("#preview-count").textContent = "0 lines";
  }

  /* =====================================================================
     Preview pane — live MD rendering with simple highlighting
     ===================================================================== */
  function renderPreview() {
    const tab = findTab(STATE.tabId);
    let md, meta;
    if (STATE.sectionId) {
      const sec = findSection(tab, STATE.sectionId);
      const idx = sectionIdx(tab, STATE.sectionId) + 1;
      md = MD.section(tab, { ...sec, idx });
      meta = sectionFilename(tab, sec);
    } else {
      md = MD.tab(tab);
      meta = tabFilename(tab);
    }
    $("#preview-body").innerHTML = highlightMD(md);
    $("#preview-meta").textContent = meta;
    $("#preview-count").textContent = `${md.split("\n").length} lines`;
    // Stash on container for toolbar buttons to use
    $("#preview-body").dataset.md = md;
    $("#preview-body").dataset.filename = meta;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function highlightMD(md) {
    return escapeHtml(md)
      .replace(/^(#{1,6}.*)$/gm, '<span class="h">$1</span>')
      .replace(/^(&gt; .*)$/gm, '<span class="q">$1</span>')
      .replace(/^(- .*|- \[ \] .*)$/gm, '<span class="b">$1</span>');
  }

  /* =====================================================================
     Export / copy
     ===================================================================== */
  function sectionFilename(tab, sec) {
    return `ultrathink-${tab.id}-${sec.id}.md`;
  }
  function tabFilename(tab) {
    return `ultrathink-${tab.id}.md`;
  }
  function downloadMD(content, filename) {
    try {
      const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: filename, style: "display:none" });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(`Downloaded ${filename}`);
      log("download", { filename, bytes: content.length });
    } catch (err) {
      console.error("[ut] download failed", err);
      toast("Download failed — check console");
    }
  }

  async function copyToClipboard(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        // Fallback for older browsers / non-secure contexts
        const ta = el("textarea", { style: "position:fixed; left:-9999px;" });
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      toast("Markdown copied");
      log("copy", { bytes: text.length });
    } catch (err) {
      console.error("[ut] copy failed", err);
      toast("Copy failed — check console");
    }
  }

  function exportSection(tabId, sectionId) {
    const tab = findTab(tabId);
    const sec = findSection(tab, sectionId);
    if (!tab || !sec) return console.warn("[ut] exportSection: not found", tabId, sectionId);
    const idx = sectionIdx(tab, sectionId) + 1;
    downloadMD(MD.section(tab, { ...sec, idx }), sectionFilename(tab, sec));
  }
  function exportTab(tabId) {
    const tab = findTab(tabId);
    if (!tab) return console.warn("[ut] exportTab: not found", tabId);
    downloadMD(MD.tab(tab), tabFilename(tab));
  }
  function exportAll() {
    downloadMD(MD.all(), "ultrathink-all.md");
  }

  /* =====================================================================
     Toast + logging
     ===================================================================== */
  function toast(msg) {
    const stack = $("#toast-stack");
    const t = el("div", { class: "toast", role: "status" },
      el("span", { class: "toast__dot" }),
      el("span", null, msg)
    );
    stack.appendChild(t);
    setTimeout(() => {
      t.style.transition = "opacity 200ms";
      t.style.opacity = "0";
      setTimeout(() => t.remove(), 220);
    }, 2200);
  }

  function log(event, payload = {}) {
    // Single namespaced logging hook — swap to remote sink if needed.
    console.debug(`[ut.${event}]`, payload);
  }

  /* =====================================================================
     Init
     ===================================================================== */
  function init() {
    // Toolbar
    $("#btn-export-tab").addEventListener("click", () => exportTab(STATE.tabId));
    $("#btn-export-all").addEventListener("click", () => exportAll());
    $("#btn-copy-md").addEventListener("click", () => {
      const md = $("#preview-body").dataset.md || "";
      if (md) copyToClipboard(md);
    });
    $("#btn-download-md").addEventListener("click", () => {
      const md = $("#preview-body").dataset.md || "";
      const fn = $("#preview-body").dataset.filename || "ultrathink.md";
      if (md) downloadMD(md, fn);
    });

    // Routing
    window.addEventListener("hashchange", handleRoute);
    handleRoute();

    // Expose API for smoke testing / external automation
    window.UT = {
      data: DASHBOARD_DATA,
      MD,
      exportSection,
      exportTab,
      exportAll,
      goto: setRoute,
      smokeTest() {
        const out = [];
        const assert = (cond, label) => out.push(`${cond ? "PASS" : "FAIL"}  ${label}`);
        assert(DASHBOARD_DATA.tabs.length === 4, "4 tabs present");
        const total = DASHBOARD_DATA.tabs.reduce((n, t) => n + t.sections.length, 0);
        assert(total === 20, `20 sections total (got ${total})`);
        const md = MD.section(DASHBOARD_DATA.tabs[0], { ...DASHBOARD_DATA.tabs[0].sections[0], idx: 1 });
        assert(md.includes("Practitioner checklist"), "section MD includes checklist");
        const tabMD = MD.tab(DASHBOARD_DATA.tabs[1]);
        assert(tabMD.startsWith("# ULTRATHINK"), "tab MD starts with title");
        const allMD = MD.all();
        assert(allMD.includes("Table of contents"), "all MD includes TOC");
        // Round-trip a route
        setRoute("contract", "security-floor");
        assert(STATE.tabId === "contract" && STATE.sectionId === "security-floor", "route contract/security-floor set");
        setRoute("vision", null);
        out.forEach(l => console.log(l));
        return out;
      }
    };
    log("ready", { tab: STATE.tabId, section: STATE.sectionId, visited: STATE.visited.size });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
  </script>
</body>
</html>
