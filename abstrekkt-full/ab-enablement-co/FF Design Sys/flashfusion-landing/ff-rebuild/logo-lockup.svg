<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" role="img" aria-label="FlashFusion">
  <title>FlashFusion — horizontal lockup</title>
  <defs>
    <linearGradient id="lkTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6A00"/><stop offset="0.45" stop-color="#FF2D55"/>
      <stop offset="0.75" stop-color="#A144FF"/><stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="lkFusion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A00"/><stop offset="0.5" stop-color="#A144FF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- icon -->
  <rect x="20" y="20" width="80" height="80" rx="18" fill="url(#lkTile)"/>
  <g fill="#ffffff" transform="translate(20,20) scale(0.625)">
    <path d="M26,30 H58 V44 H40 V56 H54 V69 H40 V98 H26 Z"/>
    <path d="M70,30 H102 V44 H84 V56 H98 V69 H84 V98 H70 Z"/>
  </g>

  <!-- wordmark: Flash (white) + Fusion (fusion gradient). Orbitron; outline in vector editor for distribution. -->
  <text x="120" y="74" font-family="Orbitron, sans-serif" font-weight="700" font-size="40" letter-spacing="-0.5">
    <tspan fill="#ffffff">Flash</tspan><tspan fill="url(#lkFusion)">Fusion</tspan>
  </text>
  <text x="121" y="94" font-family="Inter, sans-serif" font-weight="500" font-size="11" letter-spacing="4.5" fill="#5a544e">AI ENABLEMENT &amp; CONSULTING</text>
</svg>
