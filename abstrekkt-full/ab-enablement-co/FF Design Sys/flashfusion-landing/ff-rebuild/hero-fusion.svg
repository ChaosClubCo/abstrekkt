<svg viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two halves fusing into one: an analytical circuit hemisphere and a creative organic hemisphere joined at a bright seam.">
  <defs>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="warm" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A00"/><stop offset="0.5" stop-color="#FF2D55"/><stop offset="1" stop-color="#A144FF"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A00"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A00"/><stop offset="0.4" stop-color="#FF2D55"/><stop offset="0.7" stop-color="#A144FF"/><stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#FFD9A0"/><stop offset="0.7" stop-color="#FF6A00" stop-opacity="0.5"/><stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leftHalf"><rect x="0" y="0" width="280" height="560"/></clipPath>
    <clipPath id="rightHalf"><rect x="280" y="0" width="280" height="560"/></clipPath>
  </defs>

  <style>
    .spin   { transform-origin:280px 280px; animation:spin 60s linear infinite; }
    .spinR  { transform-origin:280px 280px; animation:spin 90s linear infinite reverse; }
    .pulse  { transform-origin:280px 280px; animation:pulse 4s ease-in-out infinite; }
    .rise   { animation:rise 5s ease-in-out infinite; }
    .rise2  { animation:rise 6.5s ease-in-out infinite; animation-delay:-2s; }
    @keyframes spin  { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100%{ opacity:.85; transform:scale(1);} 50%{ opacity:1; transform:scale(1.06);} }
    @keyframes rise  { 0%{ transform:translateY(40px); opacity:0;} 25%{opacity:1;} 75%{opacity:1;} 100%{ transform:translateY(-60px); opacity:0;} }
    @media (prefers-reduced-motion: reduce){ .spin,.spinR,.pulse,.rise,.rise2{ animation:none; } }
  </style>

  <!-- faint outer rings -->
  <circle class="spinR" cx="280" cy="280" r="246" fill="none" stroke="url(#ring)" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 10"/>
  <circle class="spin"  cx="280" cy="280" r="222" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- LEFT — analytical / circuit (cool) -->
  <g clip-path="url(#leftHalf)" fill="none" stroke="url(#cool)" stroke-linecap="round">
    <path d="M280,90 A190,190 0 0,0 280,470" stroke-width="1.5" stroke-opacity="0.55"/>
    <path d="M280,130 A150,150 0 0,0 280,430" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M280,175 A105,105 0 0,0 280,385" stroke-width="1.5" stroke-opacity="0.85"/>
    <path d="M280,215 A65,65 0 0,0 280,345" stroke-width="1.5"/>
    <!-- radial circuit traces -->
    <path d="M280,280 L120,200 L92,200" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M280,280 L132,280 L104,266" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M280,280 L150,360 L150,392" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M280,280 L188,150" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M280,280 L196,410" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
  <g clip-path="url(#leftHalf)" fill="#00E5FF">
    <rect x="86" y="195" width="9" height="9" rx="1.5"/><rect x="99" y="261" width="8" height="8" rx="1.5"/>
    <rect x="145" y="388" width="9" height="9" rx="1.5"/><circle cx="188" cy="150" r="4"/><circle cx="196" cy="410" r="4"/>
    <circle cx="150" cy="280" r="3" fill="#0077FF"/>
  </g>

  <!-- RIGHT — creative / organic (warm) -->
  <g clip-path="url(#rightHalf)" fill="none" stroke="url(#warm)" stroke-linecap="round">
    <path d="M280,110 C 380,150 430,210 450,300 C 462,360 420,430 330,450" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M280,160 C 360,180 400,240 405,300 C 408,350 380,400 312,418" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M280,210 C 340,222 366,260 366,300 C 366,338 344,372 300,384" stroke-width="2"/>
    <path d="M280,280 C 360,250 400,300 470,250" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M280,280 C 350,320 410,300 452,360" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M280,280 C 330,210 400,200 430,150" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g clip-path="url(#rightHalf)" fill="#FF6A00">
    <circle cx="450" cy="300" r="4.5"/><circle cx="430" cy="150" r="4" fill="#FF2D55"/>
    <circle cx="452" cy="360" r="4" fill="#A144FF"/><circle cx="470" cy="250" r="3.5" fill="#FF2D55"/>
  </g>

  <!-- SEAM — the fusion meridian -->
  <line class="pulse" x1="280" y1="70" x2="280" y2="490" stroke="url(#seam)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- rising fused particles along seam -->
  <g filter="url(#glow)">
    <circle class="rise"  cx="280" cy="300" r="3" fill="#ffffff"/>
    <circle class="rise2" cx="280" cy="300" r="2.2" fill="#FFD9A0"/>
    <circle class="rise"  cx="274" cy="300" r="2" fill="#00E5FF" style="animation-delay:-3.5s"/>
  </g>

  <!-- fused core -->
  <circle class="pulse" cx="280" cy="280" r="70" fill="url(#core)"/>
  <circle cx="280" cy="280" r="9" fill="#ffffff" filter="url(#glow)"/>
</svg>
