<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 120" width="128" height="120" role="img" aria-label="FlashFusion FF monogram">
  <title>FlashFusion — FF monogram</title>
  <defs>
    <!-- fusion spectrum: warm (left) → cool (right), spanning the full FF -->
    <linearGradient id="ffSpectrum" gradientUnits="userSpaceOnUse" x1="22" y1="60" x2="104" y2="60">
      <stop offset="0"    stop-color="#FF6A00"/>
      <stop offset="0.30" stop-color="#FF2D55"/>
      <stop offset="0.55" stop-color="#A144FF"/>
      <stop offset="0.80" stop-color="#22D3EE"/>
      <stop offset="1"    stop-color="#00E5FF"/>
    </linearGradient>
    <!-- fusion-seam glow at the join between the two F's -->
    <radialGradient id="ffSeam" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#A144FF" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#A144FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fusion seam glow behind the join -->
  <ellipse cx="62" cy="60" rx="16" ry="46" fill="url(#ffSeam)"/>

  <!-- left F + right F, single shared spectrum so they read as one fused mark -->
  <g fill="url(#ffSpectrum)">
    <path d="M22,24 H60 V40 H38 V54 H54 V69 H38 V96 H22 Z"/>
    <path d="M66,24 H104 V40 H82 V54 H98 V69 H82 V96 H66 Z"/>
  </g>

  <!-- spark at the fusion point -->
  <circle cx="62" cy="32" r="3.4" fill="#ffffff"/>
</svg>
