# Sequence: Tiny Object POV – Phone Charger Dread

sequence_id: "tiny_object_phone_charger_dread_v1"
model: sora-2-pro
size: "1080x1920"

include:
  - "../global/global_qa_locks.yaml"

clips:
  - id: "charger_pov_clip1"
    uses_block: "blocks/blockC_tiny-object-pov.yaml"
    override:
      seconds: 10
      audio_mode: "playful-comedy"
      content_description: |
        POV at floor-level from a slightly scuffed phone charger lying near a wall outlet.
        As a giant human hand reaches down to pick it up, we hear the charger's tiny internal voice saying,
        "no... no, not again," bracing for impact. The tracking move follows as it’s lifted toward the outlet,
        with exaggerated foley for plastic creaks and cable strain, ending on a comedic, resigned sigh
        right as it’s about to be plugged in.
