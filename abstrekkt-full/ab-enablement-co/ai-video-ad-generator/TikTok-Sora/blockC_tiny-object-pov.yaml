model: sora-2-pro
seconds: 10
size: "1080x1920"
camera_mode: "director-plus"
audio_mode: "playful-comedy"  # foley + tiny internal monologue VO

camera:
  lens_mm: 24
  framing: "ground-level POV at scale-of-object"
  camera_height_m: 0.03
  subject_distance_m: 0.25
  camera_move:
    type: "tracking"
    axis: "x+z"
    distance_cm: 18
    easing: "ease-in-out"

qa_locks:
  lighting:
    key: { temp_k: 3800, side: "low-left" }
    rim: { temp_k: 5200, side: "high-right" }
    bounce: "floor neutral"
  cameo_rules:
    allow_cameos: true
    primary: "tiny object protagonist"
    anatomy_lock: "inanimate; no morphing"
  wardrobe_tokens: []
  continuity:
    scale_lock: "object remains 1:1 scale across shots"
    shadow_height: "constant"
  negatives:
    - "no hand warps"
    - "no scale drift"
    - "no speed ramps beyond 1.2x"

ship_checklist:
  anchor_frames: ["00:00 reveal", "00:05 chase beat", "00:09 button"]
  handles: { head_frames: 6, tail_frames: 6 }
  motion_overlap: "3–5 frames"
