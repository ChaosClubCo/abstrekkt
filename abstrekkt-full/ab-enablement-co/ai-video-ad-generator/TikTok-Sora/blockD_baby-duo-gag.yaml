model: sora-2-pro
seconds: 16
size: "1080x1920"
camera_mode: "director-plus"
audio_mode: "duo-comedy-dub"  # tight ADR sync, giggle foley

camera:
  lens_mm: 35
  framing: "two-shot medium"
  camera_height_m: 0.65
  subject_distance_m: 1.2
  camera_move:
    type: "locked_then_micro_push"
    axis: "z"
    distance_cm: 6
    easing: "linear"

qa_locks:
  lighting:
    key: { temp_k: 3400, side: "left" }
    rim: { temp_k: 5000, side: "back-right" }
  cameo_rules:
    allow_cameos: true
    primary: "baby_A"
    secondary: "baby_B"
    anatomy_lock: "toddler proportions; no face drift; identical across takes"
  wardrobe_tokens:
    - "pastel onesie (baby-blue)"
    - "pastel onesie (soft-pink)"
    - "soft socks"
  continuity:
    beat_timing:
      - { range: "00-02", label: "reveal" }
      - { range: "03-05", label: "setup" }
      - { range: "06-11", label: "escalation" }
      - { range: "12-14", label: "micro-reaction" }
      - { range: "15-16", label: "button" }
  negatives:
    - "no camera sway"
    - "no wardrobe swap"
    - "no lip-sync slip >2 frames"

ship_checklist:
  anchor_frames: ["00:00 two-shot", "00:08 mid-gag", "00:15 punchline face"]
  handles: { head_frames: 10, tail_frames: 10 }
  motion_overlap: "6 frames to keep comedic continuity"
