model: sora-2-pro
seconds: 6
size: "1080x1920"
camera_mode: "director-plus"
audio_mode: "texture-bed"   # swish/cloth/room to glue edits

camera:
  lens_mm: 28
  framing: "detail-to-medium whip"
  camera_height_m: 1.2
  subject_distance_m: 0.8
  camera_move:
    type: "whip-pan"
    axis: "yaw"
    angle_deg: 25
    easing: "snap"

qa_locks:
  lighting:
    key: { temp_k: 4200, side: "right" }
    practicals: "on; exposure fixed"
  cameo_rules:
    allow_cameos: false
  wardrobe_tokens: []
  continuity:
    motion_vector: "left→right matches A-scene; right→left matches B-scene"
  negatives:
    - "no rolling shutter wobble"
    - "no horizon tilt"

ship_checklist:
  anchor_frames: ["00:00 pre-whip", "00:03 peak", "00:05 settle"]
  handles: { head_frames: 8, tail_frames: 8 }
  motion_overlap: "2–4 frames with adjacent scenes"
