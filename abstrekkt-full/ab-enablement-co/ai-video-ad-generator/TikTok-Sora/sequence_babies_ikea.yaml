# Sequence: Two Babies Serious Gibberish Conversation (IKEA Build Variant)

sequence_id: "babies_ikea_serious_gibberish_v1"
model: sora-2-pro
size: "1080x1920"

include:
  - "../global/global_qa_locks.yaml"

clips:
  - id: "babies_ikea_clip1"
    uses_block: "blocks/blockD_baby-duo-gag.yaml"
    override:
      seconds: 16
      audio_mode: "duo-comedy-dub"
      content_description: |
        Two babies sitting on the floor, surrounded by half-assembled IKEA furniture pieces,
        arguing in intense but adorable gibberish about what goes where. One baby holds a tiny Allen key
        very seriously, pointing at the instructions, while the other shakes their head,
        slapping a random board. Adult voice dubs match their gibberish rhythm with mock-serious lines
        about “structural integrity” and “that is absolutely not where that goes.”
