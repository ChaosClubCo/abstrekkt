model: sora-2-pro
seconds: 12
size: "1080x1920"
camera_mode: "director-plus"
audio_mode: "dialogue-tight"  # noise-gated VO, soft room, light bed music -24 LUFS

camera:
  lens_mm: 35
  framing: "medium (chest-up)"
  camera_height_m: 1.55
  subject_distance_m: 1.4
  camera_move:
    type: "push-in"
    axis: "z"
    distance_cm: 10
    easing: "linear"

qa_locks:
  lighting:
    key: { temp_k: 3400, side: "left", intensity: "med" }
    rim: { temp_k: 5000, side: "back-right", intensity: "low" }
    fill: "subtle bounce; skin tones neutral; no tint drift"
  cameo_rules:
    allow_cameos: true
    primary: "@abstrektt"
    secondary: "none"
    anatomy_lock: "human adult"
  wardrobe_tokens:
    - "charcoal tech-hoodie"
    - "black joggers"
    - "white trainers"
  continuity:
    eye_line: "parallel to lens; horizon level"
    gesture: "micro-gestures under 10° per beat"
  negatives:
    - "no roll/tilt"
    - "no jump cuts"
    - "no lip-audio desync"

ship_checklist:
  anchor_frames: ["00:00 slate", "00:06 mid", "00:11 pre-cut"]
  handles: { head_frames: 8, tail_frames: 10 }
  motion_overlap: "4 frames to preceding, 6 to following"
