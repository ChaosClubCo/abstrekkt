model: sora-2-pro
seconds: 8
size: "1080x1920"
camera_mode: "director-plus"
audio_mode: "foley-forward"   # crisp micro-foley, subtle room tone

camera:
  lens_mm: 50
  framing: "macro-close (object fills 70–85% height)"
  camera_height_m: 0.35
  subject_distance_m: 0.45
  camera_move:
    type: "micro-dolly"
    axis: "z"
    distance_cm: 6
    easing: "linear"

qa_locks:
  lighting:
    key: { temp_k: 3600, side: "left", softness: "softbox" }
    rim: { temp_k: 5200, side: "back-right", intensity: "low" }
    bounce: "neutral floor bounce; no color shift; exposure locked"
  cameo_rules:
    allow_cameos: false
  wardrobe_tokens: []
  continuity:
    shadows_vector: "left→right stable"
    highlights: "no roll-off flicker; specular clamp mild"
  negatives:
    - "no focus breathing"
    - "no white-balance drift"
    - "no auto-exposure jumps"

ship_checklist:
  anchor_frames: ["00:00", "00:04", "00:07"]
  handles: { head_frames: 6, tail_frames: 6 }
  motion_overlap: "2–3 frames with adjacent clips"
