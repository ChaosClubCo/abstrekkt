<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare AI Case Study Template | INT Inc.</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --int-navy: #0A1628; --int-blue: #1E4D8C; --int-accent: #FF6B35; --green: #10B981; --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0; --gray-500: #64748B; --gray-800: #1E293B; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--gray-100); color: var(--gray-800); }
        .editor { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
        @media (max-width: 1024px) { .editor { grid-template-columns: 1fr; } }
        .input-panel { padding: 2rem; background: white; overflow-y: auto; max-height: 100vh; }
        .preview-panel { background: var(--gray-50); padding: 2rem; overflow-y: auto; max-height: 100vh; }
        .panel-title { font-size: 1.25rem; font-weight: 700; color: var(--int-navy); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--gray-500); margin-bottom: 0.5rem; }
        input, textarea, select { width: 100%; padding: 0.75rem; border: 2px solid var(--gray-200); border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--int-blue); }
        textarea { min-height: 80px; resize: vertical; }
        .metric-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .preview { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .preview-header { background: linear-gradient(135deg, var(--int-navy), var(--int-blue)); color: white; padding: 2rem; margin: -2rem -2rem 2rem; border-radius: 16px 16px 0 0; }
        .preview-badge { display: inline-block; background: var(--int-accent); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; margin-bottom: 0.5rem; }
        .preview-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .preview-subtitle { opacity: 0.8; }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 1.5rem 0; }
        .metric-card { background: var(--gray-50); padding: 1rem; border-radius: 8px; text-align: center; }
        .metric-value { font-size: 2rem; font-weight: 700; color: var(--green); }
        .metric-label { font-size: 0.75rem; color: var(--gray-500); }
        .section { margin-bottom: 1.5rem; }
        .section-title { font-size: 1rem; font-weight: 700; color: var(--int-navy); margin-bottom: 0.75rem; border-bottom: 2px solid var(--int-accent); display: inline-block; padding-bottom: 0.25rem; }
        .section-content { color: var(--gray-800); line-height: 1.7; }
        .quote-box { background: var(--gray-50); border-left: 4px solid var(--int-accent); padding: 1rem; margin: 1rem 0; font-style: italic; }
        .quote-author { font-style: normal; font-weight: 600; margin-top: 0.5rem; color: var(--gray-500); }
        .btn { padding: 1rem 2rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-primary { background: var(--int-accent); color: white; width: 100%; }
    </style>
</head>
<body>
    <div class="editor">
        <div class="input-panel">
            <div class="panel-title">📝 Case Study Builder</div>
            
            <div class="form-group">
                <label>Organization Name (or use pseudonym)</label>
                <input type="text" id="orgName" value="Regional Health System" oninput="updatePreview()">
            </div>
            
            <div class="form-group">
                <label>Industry Segment</label>
                <select id="segment" onchange="updatePreview()">
                    <option>Hospital System</option>
                    <option>Health Plan</option>
                    <option>Physician Group</option>
                    <option>Ambulatory Care</option>
                    <option>Behavioral Health</option>
                    <option>Long-term Care</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Organization Size</label>
                <input type="text" id="orgSize" value="12 hospitals, 4,500 beds, 35,000 employees" oninput="updatePreview()">
            </div>
            
            <div class="form-group">
                <label>AI Use Case</label>
                <input type="text" id="useCase" value="Clinical Documentation with AI-Assisted Summarization" oninput="updatePreview()">
            </div>
            
            <div class="form-group">
                <label>The Challenge</label>
                <textarea id="challenge" oninput="updatePreview()">Physicians spending 2+ hours daily on documentation, leading to burnout and reduced patient face time. 40% of clinical staff reported documentation as primary source of job dissatisfaction.</textarea>
            </div>
            
            <div class="form-group">
                <label>The Solution</label>
                <textarea id="solution" oninput="updatePreview()">Deployed Azure OpenAI-powered documentation assistant integrated with Epic EHR. AI summarizes patient encounters, suggests diagnosis codes, and drafts clinical notes for physician review. Full HIPAA compliance with BAA and private endpoints.</textarea>
            </div>
            
            <div class="form-group">
                <label>Implementation Timeline</label>
                <input type="text" id="timeline" value="12 weeks from kickoff to go-live" oninput="updatePreview()">
            </div>
            
            <div class="panel-title" style="margin-top: 2rem;">📊 Key Metrics</div>
            
            <div class="metric-row">
                <div class="form-group">
                    <label>Metric 1 Value</label>
                    <input type="text" id="metric1val" value="65%" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label>Metric 1 Label</label>
                    <input type="text" id="metric1label" value="Reduction in Documentation Time" oninput="updatePreview()">
                </div>
            </div>
            
            <div class="metric-row">
                <div class="form-group">
                    <label>Metric 2 Value</label>
                    <input type="text" id="metric2val" value="$4.2M" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label>Metric 2 Label</label>
                    <input type="text" id="metric2label" value="Annual Savings" oninput="updatePreview()">
                </div>
            </div>
            
            <div class="metric-row">
                <div class="form-group">
                    <label>Metric 3 Value</label>
                    <input type="text" id="metric3val" value="92%" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label>Metric 3 Label</label>
                    <input type="text" id="metric3label" value="Physician Satisfaction" oninput="updatePreview()">
                </div>
            </div>
            
            <div class="form-group">
                <label>Customer Quote</label>
                <textarea id="quote" oninput="updatePreview()">This has given me back an hour every day with my patients. The AI understands clinical context in a way I didn't think was possible.</textarea>
            </div>
            
            <div class="form-group">
                <label>Quote Author & Title</label>
                <input type="text" id="quoteAuthor" value="Dr. Sarah Chen, Chief Medical Officer" oninput="updatePreview()">
            </div>
            
            <div class="form-group">
                <label>Results Summary</label>
                <textarea id="results" oninput="updatePreview()">Within 90 days of full deployment, the health system achieved measurable improvements in physician productivity, patient satisfaction scores, and documentation quality. The AI system now processes over 50,000 clinical encounters monthly with 99.7% uptime.</textarea>
            </div>
            
            <button class="btn btn-primary" onclick="exportCase()">📥 Export as HTML</button>
        </div>
        
        <div class="preview-panel">
            <div class="panel-title">👁️ Live Preview</div>
            <div class="preview" id="preview"></div>
        </div>
    </div>
    
    <script>
        function updatePreview() {
            document.getElementById('preview').innerHTML = `
                <div class="preview-header">
                    <div class="preview-badge">CASE STUDY</div>
                    <div class="preview-title">${document.getElementById('orgName').value}</div>
                    <div class="preview-subtitle">${document.getElementById('segment').value} • ${document.getElementById('orgSize').value}</div>
                </div>
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value">${document.getElementById('metric1val').value}</div>
                        <div class="metric-label">${document.getElementById('metric1label').value}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${document.getElementById('metric2val').value}</div>
                        <div class="metric-label">${document.getElementById('metric2label').value}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${document.getElementById('metric3val').value}</div>
                        <div class="metric-label">${document.getElementById('metric3label').value}</div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">Use Case</div>
                    <div class="section-content">${document.getElementById('useCase').value}</div>
                </div>
                
                <div class="section">
                    <div class="section-title">The Challenge</div>
                    <div class="section-content">${document.getElementById('challenge').value}</div>
                </div>
                
                <div class="section">
                    <div class="section-title">The Solution</div>
                    <div class="section-content">${document.getElementById('solution').value}</div>
                </div>
                
                <div class="section">
                    <div class="section-title">Implementation</div>
                    <div class="section-content">${document.getElementById('timeline').value}</div>
                </div>
                
                <div class="quote-box">
                    "${document.getElementById('quote').value}"
                    <div class="quote-author">— ${document.getElementById('quoteAuthor').value}</div>
                </div>
                
                <div class="section">
                    <div class="section-title">Results</div>
                    <div class="section-content">${document.getElementById('results').value}</div>
                </div>
                
                <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #E2E8F0; text-align: center; color: #64748B; font-size: 0.85rem;">
                    Prepared by INT Inc. | Healthcare AI Solutions<br>
                    solutions@intinc.com
                </div>
            `;
        }
        
        function exportCase() {
            const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Case Study - ${document.getElementById('orgName').value}</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Space Grotesk',sans-serif;max-width:800px;margin:0 auto;padding:2rem;color:#1E293B;line-height:1.6}.header{background:linear-gradient(135deg,#0A1628,#1E4D8C);color:white;padding:2rem;border-radius:16px;margin-bottom:2rem}.badge{display:inline-block;background:#FF6B35;padding:0.25rem 0.75rem;border-radius:20px;font-size:0.75rem;margin-bottom:0.5rem}.title{font-size:1.75rem;font-weight:700}.subtitle{opacity:0.8}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.5rem 0}.metric{background:#F8FAFC;padding:1rem;border-radius:8px;text-align:center}.metric-value{font-size:2rem;font-weight:700;color:#10B981}.metric-label{font-size:0.75rem;color:#64748B}.section{margin-bottom:1.5rem}.section-title{font-size:1rem;font-weight:700;color:#0A1628;margin-bottom:0.75rem;border-bottom:2px solid #FF6B35;display:inline-block;padding-bottom:0.25rem}.quote{background:#F8FAFC;border-left:4px solid #FF6B35;padding:1rem;margin:1rem 0;font-style:italic}.quote-author{font-style:normal;font-weight:600;margin-top:0.5rem;color:#64748B}</style></head><body>${document.getElementById('preview').innerHTML}</body></html>`;
            const blob = new Blob([html], { type: 'text/html' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = 'case-study.html'; a.click();
        }
        
        updatePreview();
    </script>
</body>
</html>
