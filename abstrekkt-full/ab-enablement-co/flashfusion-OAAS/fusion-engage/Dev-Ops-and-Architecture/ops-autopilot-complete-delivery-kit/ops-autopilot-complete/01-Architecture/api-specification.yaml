openapi: "3.0.3"
info:
  title: Ops Autopilot Control Plane API
  description: 8 endpoints for workflow runs, approvals, audit, secrets, and dashboards. JWT auth required. RLS enforces tenant isolation.
  version: "1.0.0"
servers:
  - url: https://api.opsautopilot.com/api/v1
  - url: https://staging-api.opsautopilot.com/api/v1
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
paths:
  /runs:
    post:
      operationId: createRun
      summary: Create workflow run (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id, trigger]
              properties:
                workflow_id: { type: string }
                trigger: { type: object, required: [type, source_id], properties: { type: { type: string, enum: [teams_bot, slack, api, schedule] }, source_id: { type: string } } }
                initiator_user_id: { type: string }
                context: { type: object }
      responses:
        "201": { description: Run created }
        "200": { description: Idempotent - existing run returned }
        "429": { description: Rate limit exceeded }
  /runs/{run_id}:
    get:
      operationId: getRun
      summary: Get run status with steps and approvals
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Run details with steps and approvals }
        "404": { description: Not found }
  /approvals/{approval_id}/decision:
    post:
      operationId: decideApproval
      summary: Approve or reject pending approval
      parameters:
        - name: approval_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, DENIED] }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Decision recorded }
        "404": { description: Expired }
        "409": { description: Already decided }
  /n8n/{n8n_instance_id}/trigger:
    post:
      operationId: triggerWorkflow
      summary: Queue workflow for execution
      parameters:
        - name: n8n_instance_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id, context]
              properties:
                workflow_id: { type: string }
                context: { type: object }
                priority: { type: string, enum: [low, normal, high, critical], default: normal }
      responses:
        "202": { description: Job queued }
        "429": { description: Rate limit }
  /runs/{run_id}/steps/{step_id}/complete:
    post:
      operationId: completeStep
      summary: Report step completion from n8n
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: step_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [COMPLETED, FAILED] }
                output_hash: { type: string }
                execution_time_ms: { type: integer }
                error: { type: object }
      responses:
        "200": { description: Updated }
        "409": { description: Already completed }
  /audit:
    get:
      operationId: getAuditLog
      summary: Query audit log (paginated, filterable)
      parameters:
        - { name: run_id, in: query, schema: { type: string, format: uuid } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Audit entries with pagination }
  /secrets/{secret_id}/rotate:
    post:
      operationId: rotateSecret
      summary: Record secret rotation (zero-knowledge)
      parameters:
        - { name: secret_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_hash]
              properties:
                new_hash: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "200": { description: Rotation recorded }
  /customers/{customer_id}/dashboard:
    get:
      operationId: getCustomerDashboard
      summary: Aggregated customer metrics
      parameters:
        - { name: customer_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, enum: [24h, 7d, 30d], default: 7d } }
      responses:
        "200": { description: Dashboard metrics }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
