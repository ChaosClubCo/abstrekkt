<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FlashFusion Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ff-void: #0A0A0F;
    --ff-deep: #141328;
    --ff-indigo: #322B75;
    --ff-primary: #8B5CF6;
    --ff-primary-light: #C4B5FD;
    --ff-glow: #A855F7;
    --ff-electric: #06B6D4;
    --ff-electric-light: #67E8F9;
    --ff-bright: #E0E7FF;
    --ff-text: #F8FAFC;
    --ff-text-muted: #94A3B8;
    --ff-font-display: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ff-font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--ff-void);
    overflow-x: hidden;
    font-family: var(--ff-font-body);
    font-weight: 400;
    color: var(--ff-text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .ff-hero {
    position: relative;
    width: 100%;
    height: 82vh;
    min-height: 560px;
    overflow: hidden;
    background: var(--ff-void);
  }
  .ff-hero canvas, .ff-hero .ff-fallback {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  .ff-fallback {
    background:
      radial-gradient(ellipse at 25% 30%, rgba(50,43,117,.6) 0%, transparent 55%),
      radial-gradient(ellipse at 82% 70%, rgba(6,182,212,.2) 0%, transparent 50%),
      linear-gradient(180deg, #0A0A0F 0%, #141328 100%);
  }
  .ff-content {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end;
    padding: 0 24px 64px;
  }
  @media (min-width: 768px) { .ff-content { padding: 0 48px 80px; } }
  .ff-inner { width: 100%; max-width: 1440px; margin: 0 auto; }
  .ff-card {
    display: inline-block;
    padding: 40px 32px;
    max-width: 640px;
    background: linear-gradient(135deg, rgba(10,10,15,.55), rgba(20,19,40,.35));
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(196,181,253,.12);
    border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(10,10,15,.4) inset, 0 24px 60px -20px rgba(0,0,0,.6);
  }
  @media (min-width: 768px) { .ff-card { padding: 48px; } }
  .ff-headline {
    font-family: var(--ff-font-display);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 0.95;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    color: var(--ff-text);
    margin: 0 0 24px 0;
    text-shadow: 0 0 40px rgba(139,92,246,.25), 0 0 80px rgba(6,182,212,.15);
  }
  .ff-subhead {
    font-family: var(--ff-font-body);
    font-weight: 400;
    font-size: clamp(1rem, 1.6vw, 1.125rem);
    line-height: 1.5;
    color: var(--ff-text-muted);
    max-width: 480px;
    margin: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .ff-hero canvas { display: none; }
    .ff-hero .ff-fallback { display: block; }
  }
</style>
</head>
<body>
<section class="ff-hero" id="ffHero">
  <canvas id="ffCanvas" aria-hidden="true"></canvas>
  <div class="ff-fallback" aria-hidden="true" style="display:none"></div>
  <div class="ff-content">
    <div class="ff-inner">
      <div class="ff-card">
        <h1 class="ff-headline">Transform Your<br>Vision Into Reality</h1>
        <p class="ff-subhead">The AI-powered development platform where ideas become production-ready products.</p>
      </div>
    </div>
  </div>
</section>
<script>
(function () {
  'use strict';
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var container = document.getElementById('ffHero');
  var canvas = document.getElementById('ffCanvas');
  var fallback = container.querySelector('.ff-fallback');

  function showFallback() {
    canvas.style.display = 'none';
    fallback.style.display = 'block';
  }
  if (reducedMotion) { showFallback(); return; }

  var gl = canvas.getContext('webgl2', {
    antialias: false, alpha: false, depth: false, stencil: false,
    powerPreference: 'high-performance', preserveDrawingBuffer: false
  });
  if (!gl) { showFallback(); return; }

  var VERT = '#version 300 es\nin vec2 aPosition;void main(){gl_Position=vec4(aPosition,0.,1.);}';
  var FRAG = [
    '#version 300 es',
    'precision highp float;',
    'uniform vec2 uResolution;uniform float uTime;uniform float uScroll;uniform vec2 uMouse;',
    'out vec4 fragColor;',
    'const vec3 VOID=vec3(.039,.039,.059);',
    'const vec3 DEEP=vec3(.078,.074,.156);',
    'const vec3 INDIGO=vec3(.196,.169,.459);',
    'const vec3 PRIMARY=vec3(.545,.361,.965);',
    'const vec3 GLOW=vec3(.659,.333,.969);',
    'const vec3 ELECTRIC=vec3(.024,.714,.831);',
    'const vec3 BRIGHT=vec3(.404,.910,.976);',
    'vec2 hash2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return -1.+2.*fract(sin(p)*43758.5453123);}',
    'float hash1(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
    'float noise(vec2 p){const float K1=.366025404;const float K2=.211324865;vec2 i=floor(p+(p.x+p.y)*K1);vec2 a=p-i+(i.x+i.y)*K2;float m=step(a.y,a.x);vec2 o=vec2(m,1.-m);vec2 b=a-o+K2;vec2 c=a-1.+2.*K2;vec3 h=max(.5-vec3(dot(a,a),dot(b,b),dot(c,c)),0.);vec3 n=h*h*h*h*vec3(dot(a,hash2(i)),dot(b,hash2(i+o)),dot(c,hash2(i+1.)));return dot(n,vec3(70.));}',
    'float fbm(vec2 p){float v=0.;float a=.5;mat2 rot=mat2(.8,-.6,.6,.8);for(int i=0;i<5;i++){v+=a*noise(p);p=rot*p*2.;a*=.5;}return v;}',
    'float bolt(vec2 uv,float seed,float curve){float d=uv.y-.5-sin(uv.x*2.+seed)*curve;d+=fbm(vec2(uv.x*4.+seed*13.,seed))*.28;d+=noise(vec2(uv.x*22.,seed*7.))*.035;return abs(d);}',
    'float sparks(vec2 uv,float t){vec2 grid=uv*38.;vec2 gi=floor(grid);vec2 gf=fract(grid);vec2 rnd=hash2(gi);float life=fract(rnd.x*1.3+t*(.2+rnd.y*.3));vec2 pos=vec2(.5)+rnd*.35*sin(t*.8+rnd.x*10.);float d=distance(gf,pos);float size=.015+.025*(1.-life);return smoothstep(size,0.,d)*(1.-life)*step(.72,rnd.x);}',
    'void main(){vec2 uv=gl_FragCoord.xy/uResolution.xy;vec2 p=uv-.5;p.x*=uResolution.x/uResolution.y;p.y+=uScroll*.3;p+=(uMouse-.5)*.04;float t=uTime*.15;',
    'vec3 col=mix(VOID,DEEP,smoothstep(-.5,.5,uv.y));',
    'vec3 mA=mix(INDIGO*.9,DEEP,smoothstep(0.,1.,length(uv-vec2(.25,.3))));',
    'vec3 mB=mix(VOID,INDIGO*.45,smoothstep(0.,.9,length(uv-vec2(.82,.7))));',
    'col=mix(col,mA,.45);col=mix(col,mB,.35);',
    'vec2 q=vec2(fbm(p+t),fbm(p+vec2(5.2,1.3)+t*1.2));',
    'vec2 r=vec2(fbm(p+2.*q+vec2(1.7,9.2)+t*.9),fbm(p+2.*q+vec2(8.3,2.8)+t*1.1));',
    'float wave=fbm(p+3.*r);wave=smoothstep(-.2,.9,wave);',
    'vec3 wc=mix(DEEP,PRIMARY,smoothstep(.3,.7,wave));',
    'wc=mix(wc,GLOW,smoothstep(.6,.85,wave));',
    'wc=mix(wc,ELECTRIC,smoothstep(.82,1.,wave));',
    'col=mix(col,wc,smoothstep(.25,.65,wave));',
    'float iso1=sin(wave*22.-uTime*2.);float p1=smoothstep(.88,1.,iso1)*smoothstep(.35,.7,wave);',
    'col+=BRIGHT*p1*.9;col+=GLOW*p1*.4;',
    'float iso2=sin(wave*14.+uTime*3.2+1.7);float p2=smoothstep(.92,1.,iso2)*smoothstep(.5,.82,wave);',
    'col+=ELECTRIC*p2*.75;',
    'float cyc=uTime*.18;float si=floor(cyc);float ph=fract(cyc);float ac=step(.58,hash1(vec2(si,0.)));float env=exp(-ph*6.)*ac;',
    'float b1=bolt(uv,si,.08);float b2=bolt(uv+vec2(0,.12),si+3.7,-.06);float b3=bolt(uv+vec2(0,-.09),si+7.1,.04);',
    'float bd=min(b1,min(b2,b3));',
    'float core=smoothstep(.003,0.,bd)*env;float halo=smoothstep(.09,0.,bd)*env*.18;',
    'col+=BRIGHT*core*2.2;col+=ELECTRIC*halo;',
    'col+=BRIGHT*sparks(uv,uTime)*.85;col+=ELECTRIC*sparks(uv*1.3+.5,uTime*.7)*.5;',
    'float vig=1.-length((uv-.5)*vec2(1.2,1.))*.5;col*=vig;',
    'float g=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233))+uTime)*43758.5453);col+=(g-.5)*.025;',
    'fragColor=vec4(col,1.);}'
  ].join('\n');

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh)); return null;
    }
    return sh;
  }
  var vs = compile(gl.VERTEX_SHADER, VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) { showFallback(); return; }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog)); showFallback(); return;
  }

  var vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  var vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPosition');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'uResolution');
  var uTime = gl.getUniformLocation(prog, 'uTime');
  var uScr = gl.getUniformLocation(prog, 'uScroll');
  var uMouse = gl.getUniformLocation(prog, 'uMouse');

  var state = { scroll: 0, mx: 0.5, my: 0.5, visible: true };
  var start = performance.now();

  var RENDER_SCALE = 0.85, DPR_CAP = 2;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    var rect = container.getBoundingClientRect();
    var w = Math.max(1, Math.floor(rect.width * dpr * RENDER_SCALE));
    var h = Math.max(1, Math.floor(rect.height * dpr * RENDER_SCALE));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h);
    }
  }
  resize();
  var ro = new ResizeObserver(resize); ro.observe(container);

  var io = new IntersectionObserver(function (e) {
    state.visible = e[0].isIntersecting;
  }, { threshold: 0 });
  io.observe(container);

  function onScroll() {
    var rect = container.getBoundingClientRect();
    state.scroll = -rect.top / rect.height;
  }
  function onMouse(e) {
    var rect = container.getBoundingClientRect();
    state.mx = (e.clientX - rect.left) / rect.width;
    state.my = 1.0 - (e.clientY - rect.top) / rect.height;
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  container.addEventListener('mousemove', onMouse, { passive: true });

  function render() {
    if (state.visible) {
      var t = (performance.now() - start) / 1000;
      gl.useProgram(prog);
      gl.bindVertexArray(vao);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, t);
      gl.uniform1f(uScr, state.scroll);
      gl.uniform2f(uMouse, state.mx, state.my);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
