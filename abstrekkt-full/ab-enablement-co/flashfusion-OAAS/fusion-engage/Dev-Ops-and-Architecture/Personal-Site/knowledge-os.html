<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Knowledge OS — cross-document connection engine for personal, FlashFusion, Intinc, and newsletter work.">
<title>Knowledge OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── RESET & TOKENS ──────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090d;--surface:#10121a;--raised:#161b26;
  --border:#1c2030;--border2:#232840;
  --text:#e4e7f2;--sub:#606880;--muted:#303550;
  --radius:7px;
  /* focus ring — WCAG 2.4.7 */
  --focus:#a78bfa;
  /* sidebar widths */
  --sb-w:220px;--sbr-w:280px;
  /* header heights */
  --hdr-h:50px;--tab-h:40px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;font-size:13px;line-height:1.5}
button,select{font-family:'Syne',sans-serif}
input,textarea{font-family:'DM Mono',monospace}

/* ─── ACCESSIBILITY ───────────────────────────────────── */
/* Skip link */
.skip-link{
  position:absolute;top:-999px;left:8px;z-index:9999;
  background:var(--focus);color:#08090d;padding:7px 16px;
  border-radius:0 0 var(--radius) var(--radius);font-weight:700;font-size:12px;
  text-decoration:none;white-space:nowrap;
}
.skip-link:focus{top:0}

/* Focus rings on ALL interactive elements */
:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
  border-radius:3px;
}
/* Remove default outline only when we have our own */
button:focus:not(:focus-visible),
a:focus:not(:focus-visible),
[tabindex]:focus:not(:focus-visible){outline:none}

/* Scrollbars */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ─── ANIMATIONS ──────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%{transform:translateX(-150%)}100%{transform:translateX(400%)}}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.03}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}

/* ─── LAYOUT SHELL ────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ─── HEADER ──────────────────────────────────────────── */
.hdr{
  display:flex;align-items:center;gap:12px;padding:0 14px;
  height:var(--hdr-h);border-bottom:1px solid var(--border);
  background:var(--surface);z-index:30;flex-shrink:0;
}
.logo{font-size:13px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;flex-shrink:0;user-select:none}
.vbar{width:1px;height:18px;background:var(--border2);flex-shrink:0}
.mode-row{display:flex;align-items:center;gap:5px;flex-shrink:0}
/* Mode dots — now with visible label for SR */
.mdot{
  width:10px;height:10px;border-radius:50%;cursor:pointer;
  border:1.5px solid;transition:transform .15s,box-shadow .15s;
  position:relative;
}
.mdot.active{transform:scale(1.5)}
.mdot:hover{box-shadow:0 0 0 3px currentColor}
.mode-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--sub);white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.srch-wrap{position:relative}
.srch-ico{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:10px;pointer-events:none}
.srch{
  background:var(--bg);border:1px solid var(--border2);border-radius:5px;
  padding:4px 8px 4px 24px;color:var(--text);font-size:10px;width:140px;outline:none;
  transition:border .13s,width .2s;
}
.srch:focus{border-color:var(--focus);width:180px}
.hbtn{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;
  padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .13s;
  border:1px solid var(--border2);background:transparent;color:var(--sub);
  white-space:nowrap;
}
.hbtn:hover,.hbtn[aria-pressed="true"]{color:var(--text);border-color:var(--border2)}
.menu-btn{
  display:none;background:transparent;border:1px solid var(--border2);
  border-radius:4px;padding:5px 8px;color:var(--sub);cursor:pointer;
  font-size:14px;line-height:1;
}

/* ─── TAB BAR ─────────────────────────────────────────── */
.tab-bar{
  display:flex;align-items:stretch;height:var(--tab-h);
  border-bottom:1px solid var(--border);background:var(--surface);
  padding:0 8px;gap:2px;flex-shrink:0;overflow-x:auto;
}
.tab-bar::-webkit-scrollbar{height:0}
.tbtn{
  display:flex;align-items:center;gap:6px;padding:0 14px;
  border:none;background:transparent;color:var(--sub);cursor:pointer;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;
  border-bottom:2px solid transparent;transition:all .13s;white-space:nowrap;
  flex-shrink:0;
}
.tbtn:hover{color:var(--text)}
.tbtn[aria-selected="true"]{color:var(--text);border-bottom-color:currentColor}
.tbtn .badge{
  font-size:8px;padding:1px 5px;border-radius:3px;
  background:var(--border2);color:var(--sub);
}
.tbtn[aria-selected="true"] .badge{background:currentColor;color:var(--bg)}

/* ─── BODY ────────────────────────────────────────────── */
.body-grid{
  display:grid;
  grid-template-columns:var(--sb-w) 1fr var(--sbr-w);
  flex:1;overflow:hidden;min-height:0;
}

/* ─── SIDEBAR LEFT ────────────────────────────────────── */
.sb{
  border-right:1px solid var(--border);
  padding:0;display:flex;flex-direction:column;
  transition:width .2s ease;
  width:var(--sb-w);flex-shrink:0;position:relative;
}
.sb.collapsed{width:0;border:none}
/* Content inside sb scrolls; toggle is absolutely positioned and escapes overflow */
.sb>.sb-inner{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:16px;padding:14px 0;}
.sb.collapsed>.sb-inner{display:none}
.sbr{
  border-left:1px solid var(--border);display:flex;flex-direction:column;
  transition:width .2s ease;
  width:var(--sbr-w);flex-shrink:0;position:relative;overflow:visible;
}
.sbr.collapsed{width:0;border:none}
.sbr.collapsed>.dp{display:none}
.sec{padding:0 10px}
.sbl{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;margin-bottom:7px;
  padding:0 12px;display:flex;align-items:center;justify-content:space-between;
}
.si{
  display:flex;align-items:center;gap:7px;padding:6px 8px;
  border-radius:var(--radius);cursor:pointer;transition:background .1s;
  border:1px solid transparent;margin-bottom:2px;
  text-align:left;width:100%;background:transparent;color:var(--text);
}
.si:hover,.si:focus-visible{background:var(--raised);border-color:var(--border2)}
.si[aria-current="true"]{background:var(--raised);border-color:var(--border2)}
.si-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.si-nm{font-size:11px;font-weight:600;flex:1;line-height:1.2;text-align:left}
.si-ct{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted)}
.cstripe{width:3px;min-height:20px;border-radius:2px;flex-shrink:0;margin-top:2px}
.ctitle{font-size:10px;font-weight:600;line-height:1.3;flex:1;text-align:left}
.cmeta{font-family:'DM Mono',monospace;font-size:8px;margin-top:2px}

/* Connection type icons (color + shape, not color alone) */
.ctype-icon{font-size:9px;flex-shrink:0;width:12px;text-align:center}

/* ─── SIDEBAR TOGGLE BUTTONS ──────────────────────────── */
.sb-toggle{
  position:absolute;top:50%;z-index:6;
  width:16px;height:44px;border:1px solid var(--border2);
  background:var(--surface);color:var(--sub);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;line-height:1;transition:all .13s;
  padding:0;
}
.sb-toggle:hover{background:var(--raised);color:var(--text);border-color:rgba(255,255,255,.2)}
.sb-toggle.left{right:-16px;border-radius:0 4px 4px 0;border-left:none;transform:translateY(-50%)}
.sb-toggle.right{left:-16px;border-radius:4px 0 0 4px;border-right:none;transform:translateY(-50%)}

/* ─── MAIN CANVAS ─────────────────────────────────────── */
.main{position:relative;overflow:hidden;background:var(--bg);outline:none}
.main:focus{box-shadow:inset 0 0 0 2px var(--focus)}

/* Graph SVG */
.gsvg{position:absolute;inset:0;width:100%;height:100%}
.node-g{cursor:grab}
.node-g:active{cursor:grabbing}
.node-g:focus{outline:none}
.node-g .focus-ring{display:none}
.node-g:focus .focus-ring{display:block}

/* Matrix */
.mx-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;height:100%;padding:24px;overflow:auto;
}
.mx-cell{
  width:52px;height:52px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;
  cursor:pointer;transition:all .13s;border:1px solid var(--border);
}
.mx-cell:hover,.mx-cell:focus-visible{border-color:rgba(255,255,255,.25);transform:scale(1.06)}

/* Timeline */
.tl-wrap{padding:22px 28px;overflow-y:auto;width:100%;height:100%}
.tl-row{
  display:flex;align-items:center;gap:12px;padding:10px 8px;
  border-radius:var(--radius);cursor:pointer;transition:background .1s;margin-bottom:2px;
  border:1px solid transparent;
}
.tl-row:hover,.tl-row:focus-visible{background:var(--raised);border-color:var(--border2)}
.tl-row[aria-current="true"]{background:var(--raised);border-color:var(--border2)}

/* ─── ASSISTANT TAB ───────────────────────────────────── */
.asst{display:flex;flex-direction:column;width:100%;height:100%;min-height:0}
.asst-msgs{
  flex:1;overflow-y:auto;padding:20px 24px;
  display:flex;flex-direction:column;gap:16px;
}
.asst-msg{display:flex;gap:10px;animation:fadeIn .18s ease}
.asst-msg.user{flex-direction:row-reverse}
.asst-bubble{
  max-width:72%;padding:10px 14px;border-radius:10px;
  font-size:12px;line-height:1.65;
}
.asst-bubble.ai{
  background:var(--raised);border:1px solid var(--border2);
  border-bottom-left-radius:3px;color:var(--text);
}
.asst-bubble.user{
  border-bottom-right-radius:3px;color:#08090d;
}
.asst-bubble.typing{
  background:var(--raised);border:1px solid var(--border2);
  display:flex;gap:4px;align-items:center;padding:12px 16px;
}
.typing-dot{
  width:5px;height:5px;border-radius:50%;background:var(--sub);
  animation:pulse 1.2s ease infinite;
}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
.asst-input-row{
  display:flex;gap:8px;padding:14px 20px;
  border-top:1px solid var(--border);background:var(--surface);
  flex-shrink:0;
}
.asst-input{
  flex:1;background:var(--bg);border:1px solid var(--border2);
  border-radius:var(--radius);padding:9px 12px;color:var(--text);
  font-size:11px;resize:none;outline:none;line-height:1.5;
  min-height:38px;max-height:120px;transition:border .13s;
}
.asst-input:focus{border-color:var(--focus)}
.asst-send{
  width:38px;height:38px;border-radius:var(--radius);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;font-size:14px;transition:opacity .15s;
}
.asst-send:disabled{opacity:.35;cursor:not-allowed}
.asst-ctx{
  padding:8px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:'DM Mono',monospace;font-size:9px;color:var(--sub);
  flex-shrink:0;
}
.ctx-badge{
  padding:2px 7px;border-radius:3px;border:1px solid var(--border2);
  cursor:pointer;transition:all .12s;
}
.ctx-badge:hover,.ctx-badge.on{border-color:currentColor;color:var(--text)}
.ctx-badge.on::before{content:'✓ '}

/* ─── SIDEBAR RIGHT (DETAIL) ──────────────────────────── */
/* sbr already defined above with .sbr.collapsed */
.dp{overflow-y:auto;flex:1;display:flex;flex-direction:column;min-height:0}
.dp-empty{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;gap:10px;color:var(--muted);
  padding:20px;text-align:center;
}
.dp-empty-icon{font-size:26px;opacity:.4}
.dp-tag{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:3px;display:inline-block;
}
.conf-track{height:3px;background:var(--border2);border-radius:2px;overflow:hidden}
.conf-fill{height:100%;border-radius:2px;transition:width .4s ease}
.abtn{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;
  border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);
  color:var(--text);cursor:pointer;transition:all .13s;text-align:left;margin-bottom:6px;
}
.abtn:hover,.abtn:focus-visible{border-color:rgba(255,255,255,.3);background:var(--raised)}
.abtn:disabled{opacity:.35;cursor:not-allowed}
.abtn-ico{font-size:14px;width:22px;text-align:center;flex-shrink:0;line-height:1}
.abtn-lbl{font-size:11px;font-weight:600;line-height:1.2}
.abtn-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--sub);margin-top:1px}
.out-box{
  margin:0 14px 14px;padding:12px;background:var(--bg);
  border-radius:var(--radius);border:1px solid var(--border2);
  font-family:'DM Mono',monospace;font-size:10px;line-height:1.7;
  color:#8090b0;white-space:pre-wrap;max-height:260px;overflow-y:auto;
  animation:fadeIn .2s ease;
}
.out-hdr{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:7px;
}

/* ─── FAB ─────────────────────────────────────────────── */
.fab{
  position:absolute;bottom:18px;right:18px;width:44px;height:44px;
  border-radius:50%;border:none;cursor:pointer;font-size:22px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,box-shadow .2s;z-index:5;
}
.fab:hover{transform:scale(1.08)}
.fab:focus-visible{transform:scale(1.08)}

/* ─── OVERLAYS ────────────────────────────────────────── */
.ovl{
  position:absolute;inset:0;background:var(--bg);z-index:20;
  overflow-y:auto;padding:28px 32px;animation:fadeIn .15s ease;
}
.ovl-close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--border2);background:var(--surface);color:var(--sub);
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
}
.ovl-close:hover{border-color:var(--text);color:var(--text)}
.src-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.src-chip{
  padding:8px 5px;border-radius:var(--radius);text-align:center;cursor:pointer;
  border:1px solid var(--border2);background:var(--surface);transition:all .12s;
}
.txinput{
  width:100%;background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius);padding:9px 11px;color:var(--text);font-size:11px;
  resize:none;outline:none;line-height:1.6;margin-bottom:12px;display:block;
}
.txinput:focus{border-color:var(--focus)}
.pri-btn{
  padding:11px 22px;border:none;border-radius:var(--radius);cursor:pointer;
  font-family:'Syne',sans-serif;font-size:12px;font-weight:700;
  display:flex;align-items:center;gap:7px;transition:opacity .15s;
}
.pri-btn:disabled{opacity:.35;cursor:not-allowed}
.res-box{margin-top:18px;padding:14px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border2);animation:fadeIn .2s ease}
.rm-row{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.rm-num{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);width:20px;flex-shrink:0;padding-top:2px}
.rm-info{flex:1}
.rm-name{font-size:11px;font-weight:600;margin-bottom:2px}
.rm-desc{font-family:'DM Mono',monospace;font-size:9px;color:var(--sub);line-height:1.5}
.rm-status{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-size:8px;margin-top:2px}

/* ─── STATUS BAR (aria-live) ──────────────────────────── */
.scan-bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:200;overflow:hidden;pointer-events:none}
.scan-fill{height:100%;width:40%;animation:scan 1.4s linear infinite;background:linear-gradient(90deg,transparent,currentColor,transparent)}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--raised);border:1px solid var(--border2);border-radius:var(--radius);
  padding:9px 18px;font-family:'DM Mono',monospace;font-size:10px;z-index:300;
  pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:fadeUp .18s ease;
}

/* ─── RESPONSIVE ──────────────────────────────────────── */
@media(max-width:900px){
  :root{--sb-w:0px;--sbr-w:0px}
  .sb,.sbr{display:none}
  .body-grid{grid-template-columns:1fr}
  .menu-btn{display:flex}
  .srch{width:120px}
  .srch:focus{width:140px}
  /* Mobile drawer */
  .drawer{
    position:fixed;inset:0;z-index:100;display:flex;
  }
  .drawer-backdrop{
    position:absolute;inset:0;background:rgba(0,0,0,.6);
  }
  .drawer-panel{
    position:relative;width:min(320px,90vw);background:var(--surface);
    border-right:1px solid var(--border);overflow-y:auto;padding:14px 0;
    animation:slideIn .2s ease;z-index:1;
  }
  .drawer-panel.right{
    margin-left:auto;border-right:none;border-left:1px solid var(--border);
    animation:none;
  }
}
@media(max-width:520px){
  .hdr{gap:8px;padding:0 10px}
  .logo{font-size:12px}
  .mode-row{gap:4px}
  .tab-bar{padding:0 4px}
  .tbtn{padding:0 10px;font-size:9px}
}
/* ─── SIGNALS TAB ─────────────────────────────────────── */
.sigs{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;overflow:hidden}
.sigs-top{padding:14px 22px 0;flex-shrink:0}
.sigs-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sig-filter{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;padding:4px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--sub);transition:all .12s;white-space:nowrap}
.sig-filter:hover{color:var(--text);border-color:var(--border2)}
.sig-filter.on{border-color:currentColor;background:currentColor;color:#08090d}
.sigs-body{flex:1;overflow-y:auto;padding:0 22px 22px;display:flex;flex-direction:column;gap:10px}
.sig-card{border-radius:var(--radius);border:1px solid var(--border2);overflow:hidden;transition:border-color .13s}
.sig-card:hover{border-color:rgba(255,255,255,.18)}
.sig-hdr{display:flex;align-items:center;gap:9px;padding:9px 13px}
.sig-chip{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;flex-shrink:0;font-weight:500}
.sig-title{font-size:11px;font-weight:700;flex:1;line-height:1.3}
.sig-conf{font-family:'DM Mono',monospace;font-size:9px;flex-shrink:0}
.sig-body{padding:0 13px 10px;font-size:11px;line-height:1.65;color:#7888a8}
.sig-actions{display:flex;gap:6px;padding:0 13px 11px;flex-wrap:wrap}
.sig-act{font-family:'DM Mono',monospace;font-size:9px;padding:3px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--sub);transition:all .12s;white-space:nowrap}
.sig-act:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.sig-act.primary{border-color:currentColor;font-weight:500}
.sig-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--muted);gap:8px;font-family:'DM Mono',monospace;font-size:10px;text-align:center}
/* ─── LEDGER TAB ─────────────────────────────────────── */

/* ─── ZOOM CONTROLS ───────────────────────────────────── */
.zoom-ctrls{position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column;gap:4px;z-index:4}
.zoom-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--border2);background:var(--surface);color:var(--sub);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:'DM Mono',monospace}

/* ── Claude API ───────────────────────────────────────── */
async function callClaude(sys,usr,mx){
  mx=mx||900;
  var r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:mx,system:sys,messages:[{role:'user',content:usr}]})
  });
  if(!r.ok)throw new Error('Claude API '+r.status);
  var d=await r.json();
  return(d.content&&d.content[0]&&d.content[0].text)||'';
}

/* ── useFocusTrap ─────────────────────────────────────── */
function useFocusTrap(ref, active){
  useEffect(function(){
    if(!active||!ref.current)return;
    var el=ref.current;
    var SEL='button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],[tabindex]:not([tabindex="-1"])';
    function trap(e){
      if(e.key!=='Tab')return;
      var els=Array.from(el.querySelectorAll(SEL)).filter(function(x){return!x.disabled&&x.offsetParent!==null;});
      if(!els.length)return;
      var first=els[0],last=els[els.length-1];
      if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
      else{if(document.activeElement===last){e.preventDefault();first.focus();}}
    }
    document.addEventListener('keydown',trap);
    setTimeout(function(){var fe=el.querySelector(SEL);if(fe)fe.focus();},60);
    return function(){document.removeEventListener('keydown',trap);};
  },[active]);
}

/* ── Persistence ──────────────────────────────────────── */
function usePersist(key,init){
  var _s=useState(init),v=_s[0],set=_s[1];
  var ready=useRef(false);
  useEffect(function(){
    if(ready.current)return;ready.current=true;
    (async function(){try{var r=window.storage&&await window.storage.get(key);if(r&&r.value)set(JSON.parse(r.value));}catch(e){}}());
  },[key]);
  var save=useCallback(function(fn){
    set(function(c){var n=typeof fn==='function'?fn(c):fn;if(window.storage)window.storage.set(key,JSON.stringify(n)).catch(function(){});return n;});
  },[key]);
  return[v,save];
}


/* ── Decay utilities ──────────────────────────────────── */
function daysSince(dateStr){
  if(!dateStr)return 0;
  return Math.max(0,(Date.now()-new Date(dateStr).getTime())/(1000*60*60*24));
}
function decayAmt(conn){
  var d=daysSince(conn.date);
  return Math.round(Math.min(d*1.5,conn.confidence-20));
}
function effectiveConf(conn){
  return Math.max(conn.confidence-decayAmt(conn),20);
}

/* ── Physics ──────────────────────────────────────────── */
function usePhysics(clusters,connections,W,H){
  var nodes=useRef({});var raf=useRef(null);
  var _p=useState({}),pos=_p[0],setPos=_p[1];
  useEffect(function(){
    var ex=nodes.current,nx={};
    clusters.forEach(function(c,i){
      if(ex[c.id]){nx[c.id]=ex[c.id];return;}
      var a=(i/clusters.length)*Math.PI*2,r=Math.min(W,H)*0.28;
      nx[c.id]={x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:0,vy:0};
    });
    nodes.current=nx;
  },[clusters,W,H]);
  useEffect(function(){
    if(!W||!H)return;
    function tick(){
      var nd=nodes.current,ids=Object.keys(nd);
      ids.forEach(function(id){nd[id].fx=0;nd[id].fy=0;});
      for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){
        var a=nd[ids[i]],b=nd[ids[j]],dx=a.x-b.x,dy=a.y-b.y,
            d2=dx*dx+dy*dy||1,d=Math.sqrt(d2),f=22000/d2;
        a.fx+=(dx/d)*f;a.fy+=(dy/d)*f;b.fx-=(dx/d)*f;b.fy-=(dy/d)*f;
      }
      connections.forEach(function(c){
        var a=nd[c.from],b=nd[c.to];if(!a||!b)return;
        var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-190)*0.032;
        a.fx+=(dx/d)*f;a.fy+=(dy/d)*f;b.fx-=(dx/d)*f;b.fy-=(dy/d)*f;
      });
      ids.forEach(function(id){nd[id].fx+=(W/2-nd[id].x)*0.007;nd[id].fy+=(H/2-nd[id].y)*0.007;});
      ids.forEach(function(id){
        nd[id].vx=(nd[id].vx+nd[id].fx)*0.80;nd[id].vy=(nd[id].vy+nd[id].fy)*0.80;
        nd[id].x=Math.max(55,Math.min(W-55,nd[id].x+nd[id].vx));
        nd[id].y=Math.max(55,Math.min(H-55,nd[id].y+nd[id].vy));
      });
      setPos(Object.assign({},nd));raf.current=requestAnimationFrame(tick);
    }
    raf.current=requestAnimationFrame(tick);
    return function(){cancelAnimationFrame(raf.current);};
  },[clusters,connections,W,H]);
  var pin=useCallback(function(id,x,y){
    if(nodes.current[id]){nodes.current[id].x=x;nodes.current[id].y=y;nodes.current[id].vx=0;nodes.current[id].vy=0;}
  },[]);
  return{pos:pos,pin:pin};
}

/* ── ForceGraph ───────────────────────────────────────── */
function ForceGraph(props){
  var clusters=props.clusters,connections=props.connections,
      selected=props.selected,onSelect=props.onSelect,mc=props.mc;
  var svgRef=useRef(null),dragRef=useRef(null),panRef=useRef(null),wrapRef=useRef(null);
  var _d=useState({w:600,h:400}),dims=_d[0],setDims=_d[1];
  var _vp=useState({x:0,y:0,s:1}),vp=_vp[0],setVp=_vp[1];
  var ph=usePhysics(clusters,connections,dims.w,dims.h),pos=ph.pos,pin=ph.pin;

  useEffect(function(){
    var el=wrapRef.current;if(!el)return;
    var ro=new ResizeObserver(function(e){var r=e[0].contentRect;setDims({w:r.width,h:r.height});});
    ro.observe(el);return function(){ro.disconnect();};
  },[]);

  function toSVG(e){
    if(!svgRef.current)return{x:0,y:0};
    var r=svgRef.current.getBoundingClientRect();
    return{x:(e.clientX-r.left-vp.x)/vp.s,y:(e.clientY-r.top-vp.y)/vp.s};
  }

  function onWheel(e){
    e.preventDefault();
    var r=svgRef.current.getBoundingClientRect();
    var cx=e.clientX-r.left,cy=e.clientY-r.top;
    setVp(function(v){
      var ns=Math.max(0.3,Math.min(2.8,v.s*(e.deltaY>0?0.9:1.1)));
      return{x:cx-(cx-v.x)*(ns/v.s),y:cy-(cy-v.y)*(ns/v.s),s:ns};
    });
  }

  function onSvgMouseDown(e){
    /* Nodes call e.stopPropagation(), so this only fires on background clicks */
    if(dragRef.current)return;
    panRef.current={sx:e.clientX,sy:e.clientY,ox:vp.x,oy:vp.y};
  }

  function onMouseMove(e){
    if(dragRef.current){pin(dragRef.current,toSVG(e).x,toSVG(e).y);return;}
    var pan=panRef.current;
    if(pan){
      var dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;
      setVp(function(v){return{x:pan.ox+dx,y:pan.oy+dy,s:v.s};});
    }
  }
  function onMouseUp(){dragRef.current=null;panRef.current=null;}

  function zoom(delta){setVp(function(v){var ns=Math.max(0.3,Math.min(2.8,v.s*delta));return{x:v.x+(dims.w/2-v.x)*(1-ns/v.s),y:v.y+(dims.h/2-v.y)*(1-ns/v.s),s:ns};});}
  function resetVp(){setVp({x:0,y:0,s:1});}

  function handleKeyDown(e,c){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();onSelect(c.id);}
    if(e.key==='Escape'){onSelect(null);}
  }

  var tx='translate('+vp.x+','+vp.y+') scale('+vp.s+')';

  return h('div',{ref:wrapRef,style:{position:'absolute',inset:0,overflow:'hidden'}},
    h('svg',{ref:svgRef,className:'gsvg',role:'img','aria-label':'Knowledge cluster force graph. Scroll to zoom, drag background to pan.',
      style:{cursor:'default'},
      onWheel:onWheel,
      onMouseDown:onSvgMouseDown,
      onMouseMove:onMouseMove,
      onMouseUp:onMouseUp,
      onMouseLeave:onMouseUp
    },
      h('defs',null,connections.map(function(co){
        return h('marker',{key:co.id,id:'arr-'+co.id,markerWidth:'5',markerHeight:'5',refX:'4.5',refY:'2.5',orient:'auto'},
          h('path',{d:'M0,0 L0,5 L5,2.5z',fill:co.color,opacity:selected===co.id?0.9:0.45}));
      })),
      /* pan background — fill:transparent gets no pointer events in SVG, use near-zero opacity */
      h('rect',{className:'pan-bg',x:0,y:0,width:'100%',height:'100%',fill:'rgba(0,0,0,0.001)',style:{cursor:'default'}}),
      /* zoomable content */
      h('g',{transform:tx},
        /* edges */
        connections.map(function(conn){
          var a=pos[conn.from],b=pos[conn.to];if(!a||!b)return null;
          var act=selected===conn.id;
          var eff=effectiveConf(conn);
          var decayed=decayAmt(conn);
          var mx=(a.x+b.x)/2+(conn.id.charCodeAt(1)%5-2)*22,my=(a.y+b.y)/2-38;
          var d='M'+a.x+','+a.y+' Q'+mx+','+my+' '+b.x+','+b.y;
          return h('g',{key:conn.id,role:'button',tabIndex:0,
            'aria-label':conn.title+', '+conn.type+', '+eff+'% confidence'+(decayed>0?' (decayed '+decayed+'%)':''),
            style:{cursor:'pointer'},
            onClick:function(){onSelect(conn.id);},
            onKeyDown:function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();onSelect(conn.id);}}
          },
            h('path',{d:d,fill:'none',stroke:'transparent',strokeWidth:16}),
            h('path',{d:d,fill:'none',stroke:conn.color,strokeWidth:act?2.5:1.2,
              strokeDasharray:act?undefined:'6 4',
              opacity:act?0.95:Math.max(0.12,0.25-decayed*0.005),
              style:{transition:'opacity .2s,stroke-width .2s'},
              markerEnd:'url(#arr-'+conn.id+')'}),
            act&&h('text',{x:mx,y:my-10,textAnchor:'middle',fill:conn.color,

              TYPE_ICON[conn.type]+' '+conn.type+' \u00b7 '+eff+'%'+(decayed>5?' \u2193':'')),
          );
        }),
        /* nodes */
        clusters.map(function(c){
          var p=pos[c.id];if(!p)return null;
          var act=selected===c.id;
          var cc=connections.filter(function(cn){return cn.from===c.id||cn.to===c.id;}).length;
          var words=c.label.split(' ');
          return h('g',{key:c.id,className:'node-g',

            h('text',{y:-4,textAnchor:'middle',fill:'#e4e7f2',fontSize:'11',fontFamily:'Syne',fontWeight:'800',style:{pointerEvents:'none',userSelect:'none'}},c.id),
            h('text',{y:10,textAnchor:'middle',fill:'#606880',fontSize:'8',fontFamily:'DM Mono',style:{pointerEvents:'none',userSelect:'none'}},c.docCount+'d'),

function computeSignals(clusters,connections){
  var sigs=[];
  /* Isolated clusters */
  clusters.forEach(function(c){
    var cc=connections.filter(function(cn){return cn.from===c.id||cn.to===c.id;});
    if(cc.length===0)sigs.push({id:'iso-'+c.id,cat:'pattern',color:c.color,title:'Cluster '+c.id+' ('+c.label+') Is Isolated',body:'No connections to any other cluster. Either this is a new cluster that needs analysis, or it represents a true knowledge island that needs bridging.',actions:[]});
  });
  /* Highly decayed connections */
  connections.forEach(function(cn){
    var d=decayAmt(cn);
    if(d>20)sigs.push({id:'decay-'+cn.id,cat:'contradiction',color:'#ff8c4a',title:'"'+cn.title+'" Has Decayed '+d+'%',body:'This connection was last reinforced on '+cn.date+'. Effective confidence has dropped to '+effectiveConf(cn)+'%. Review and reinforce or delete.',actions:[{label:'View',connId:cn.id}]});
  });
  /* High-confidence unused bridges not already in static list */
  var staticIds=['S6','S7'];
  connections.filter(function(cn){return cn.type==='Unused Bridge'&&cn.confidence>=80;}).forEach(function(cn){
    var sid='ub-'+cn.id;
    sigs.push({id:sid,cat:'unused',color:'#f5f047',title:'Unused Bridge: '+cn.title,body:cn.body+' ('+cn.confidence+'% confidence)',actions:[{label:'View',connId:cn.id},{label:'WSJF Item',action:'wsjf',connId:cn.id}]});
  });
  return sigs;
}

function SignalsTab(props){
  var connections=props.connections,clusters=props.clusters,onSelect=props.onSelect,mc=props.mc;
  var computed=useMemo(function(){return computeSignals(clusters,connections);},[clusters,connections]);
  var allSignals=useMemo(function(){return STATIC_SIGNALS.concat(computed);},[computed]);
  var _cat=useState('all'),cat=_cat[0],setCat=_cat[1];
  var _out=useState({}),outputs=_out[0],setOutputs=_out[1];
  var _loading=useState(null),loading=_loading[0],setLoading=_loading[1];

  var filtered=useMemo(function(){
    if(cat==='all')return allSignals;
    return allSignals.filter(function(s){return s.cat===cat;});
  },[cat,allSignals]);

  async function runAction(sig,action,connId){
    var key=sig.id+'-'+action;
    setLoading(key);
    try{
      var conn=connections.find(function(c){return c.id===connId;});
      var fromC=conn&&clusters.find(function(c){return c.id===conn.from;});
      var toC=conn&&clusters.find(function(c){return c.id===conn.to;});
      var txt='';

      if(action==='draft'&&conn){
        txt=await callClaude('You are a strategic content architect. Write a concise merger outline. Use ## headers. No preamble.',
          'Synthesize:\nCluster 1: "'+(fromC&&fromC.label)+'" - '+(fromC&&fromC.desc)+'\nCluster 2: "'+(toC&&toC.label)+'" - '+(toC&&toC.desc)+'\nConnection: '+conn.title+' ('+conn.type+')\nInsight: '+conn.body+'\n\nProduce 5 sections: ## Title\n2-sentence description each.');
      } else if(action==='wsjf'&&conn){
        txt=await callClaude('You are a product manager. Output only a WSJF backlog item. No preamble.',
          'WSJF for: "'+conn.title+'"\n'+conn.body+'\n\nFormat:\nTitle: [action task]\nUser Value (1-10): X - reason\nTime Criticality (1-10): X - reason\nRisk Reduction (1-10): X - reason\nJob Size (1-10): X - reason\nWSJF Score: X.X\nSprint: S1/S2/S3\nDone When:\n* c1\n* c2');
      } else if(action==='thesis'){
        txt=await callClaude('You are a product strategist. Write a clear, punchy thesis statement. No preamble.',
          'Write a 3-paragraph strategic thesis that unifies these clusters:\n- Agentic Architecture (M): composable agents, modular skills, scheduled tasks\n- Memory OS (K): Claude+NotebookLM RAG, session persistence\n- FlashFusion (E): platform positioning, Claude partner network\n- Vibecode (I): Stack Wizard, vibe-coding-to-production\n- AI Code Quality (A): human copilot, production gap\n\nThe thesis should explain how all five are expressions of the same system-design philosophy, and what FlashFusion should say about it publicly.');
      }

      setOutputs(function(p){var n=Object.assign({},p);n[key]=txt;return n;});
    }catch(e){
      setOutputs(function(p){var n=Object.assign({},p);n[key]='Error: '+e.message;return n;});
    }
    setLoading(null);
  }

  return h('div',{className:'sigs',role:'region','aria-label':'Action signals'},
    h('div',{className:'sigs-top'},
      h('div',{className:'sigs-filters',role:'group','aria-label':'Filter signals'},
        SIG_CATS.map(function(sc){
          return h('button',{key:sc.id,className:'sig-filter'+(cat===sc.id?' on':''),
            style:{color:cat===sc.id?'#08090d':(sc.color||'var(--sub)')},
            'aria-pressed':String(cat===sc.id),
            onClick:function(){setCat(sc.id);}},sc.label);
        })
      )
    ),
    h('div',{className:'sigs-body','aria-live':'polite'},
      filtered.length===0&&h('div',{className:'sig-empty'},'No signals in this category'),
      filtered.map(function(sig){
        var catCfg=SIG_CATS.find(function(c){return c.id===sig.cat;})||SIG_CATS[0];
        return h('div',{key:sig.id,className:'sig-card',style:{borderColor:sig.color+'35'}},
          h('div',{className:'sig-hdr'},
            h('span',{className:'sig-chip',style:{background:sig.color+'22',color:sig.color}},sig.cat.toUpperCase()),
            h('span',{className:'sig-title'},sig.title)
          ),
          h('div',{className:'sig-body'},sig.body),
          h('div',{className:'sig-actions'},
            (sig.actions||[]).map(function(a,ai){
              var key=sig.id+'-'+(a.action||a.label);
              var isLoading=loading===key;
              if(a.href)return h('a',{key:ai,className:'sig-act',href:a.href,target:'_blank',rel:'noopener',style:{color:sig.color}},a.label);
              if(a.connId&&!a.action)return h('button',{key:ai,className:'sig-act',style:{color:sig.color},onClick:function(){onSelect(a.connId);}},a.label);
              return h('button',{key:ai,className:'sig-act primary',style:{color:sig.color,'--c':sig.color},
                disabled:isLoading,
                onClick:function(){runAction(sig,a.action,a.connId);}},
                isLoading?h('span',{style:{animation:'spin .9s linear infinite',display:'inline-block'},'aria-hidden':'true'},'\u25cc'):'',
                isLoading?' Running\u2026':a.label
              );
            })
          ),
          outputs[sig.id+'-draft']&&h('div',{style:{margin:'0 13px 12px',padding:'10px 12px',background:'var(--bg)',borderRadius:'5px',border:'1px solid '+sig.color+'30',fontFamily:'DM Mono,monospace',fontSize:'10px',lineHeight:'1.7',color:'#8090b0',whiteSpace:'pre-wrap',maxHeight:'200px',overflowY:'auto'}},
            h('div',{style:{color:sig.color,fontSize:'9px',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'6px'}},'DRAFT OUTPUT'),
            outputs[sig.id+'-draft']
          ),
          outputs[sig.id+'-wsjf']&&h('div',{style:{margin:'0 13px 12px',padding:'10px 12px',background:'var(--bg)',borderRadius:'5px',border:'1px solid '+sig.color+'30',fontFamily:'DM Mono,monospace',fontSize:'10px',lineHeight:'1.7',color:'#8090b0',whiteSpace:'pre-wrap',maxHeight:'200px',overflowY:'auto'}},
            h('div',{style:{color:sig.color,fontSize:'9px',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'6px'}},'WSJF OUTPUT'),
            outputs[sig.id+'-wsjf']
          ),
          outputs[sig.id+'-thesis']&&h('div',{style:{margin:'0 13px 12px',padding:'10px 12px',background:'var(--bg)',borderRadius:'5px',border:'1px solid '+sig.color+'30',fontFamily:'DM Mono,monospace',fontSize:'10px',lineHeight:'1.7',color:'#8090b0',whiteSpace:'pre-wrap',maxHeight:'200px',overflowY:'auto'}},
            h('div',{style:{color:sig.color,fontSize:'9px',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'6px'}},'THESIS OUTPUT'),
            outputs[sig.id+'-thesis']
          )
        );
      })
    )
  );
}

function DigestTab(props){
  var clusters=props.clusters,connections=props.connections,mc=props.mc;
  var _out=useState(null),digestOut=_out[0],setDigestOut=_out[1];
  var _loading=useState(false),loading=_loading[0],setLoading=_loading[1];
  var _fmt=useState('brief'),fmt=_fmt[0],setFmt=_fmt[1];

  var today=new Date().toISOString().slice(0,10);
  var recentConns=connections.filter(function(c){return c.date===today;});
  var topConns=connections.slice().sort(function(a,b){return b.confidence-a.confidence;}).slice(0,5);
  var blockers=STATIC_SIGNALS.filter(function(s){return s.cat==='blocker';});
  var avgConf=connections.length?Math.round(connections.reduce(function(s,c){return s+c.confidence;},0)/connections.length):0;

  async function generate(){
    setLoading(true);setDigestOut(null);
    try{
      var clusterSummary=clusters.map(function(c){
        var cc=connections.filter(function(cn){return cn.from===c.id||cn.to===c.id;}).length;
        return c.id+': '+c.label+' ('+c.docCount+'docs, '+cc+'connections)';
      }).join('\n');
      var connSummary=topConns.map(function(c){
        return '- '+c.title+' ['+c.type+', '+c.confidence+'%] '+c.from+'\u2194'+c.to;
      }).join('\n');
      var blockerSummary=blockers.map(function(b){return '- '+b.title;}).join('\n');

      var fmtInstr=fmt==='brief'
        ?'Write a concise 4-paragraph weekly digest. Paragraph 1: graph overview (clusters, connections, top insight). Paragraph 2: highest-leverage actions (use the blockers). Paragraph 3: the most surprising connection and what it implies. Paragraph 4: one sharp recommended next step. Use plain language. No headers. No bullet points.'
        :fmt==='newsletter'
        ?'Write a newsletter-ready section called "What the Graph Is Telling Me This Week" (max 180 words). Lead with the most surprising connection. End with a question for the reader. Use Kyle\u2019s voice: direct, metaphor-heavy, technically precise, no false resolution.'
        :'Write a structured markdown brief with: ## Graph Status (stats), ## Top Connections (ranked list), ## Blockers (action items), ## Recommended Move (one paragraph). Under 300 words total.';

      var txt=await callClaude(
        'You are the Knowledge OS digest generator for Kyle Rosebrook (self-taught engineer, founder of FlashFusion and Chaos Club Co., writing a literary memoir). Be specific, use cluster IDs, name real connections. No sycophancy.',
        'CLUSTERS ('+clusters.length+'):\n'+clusterSummary+'\n\nTOP CONNECTIONS:\n'+connSummary+'\n\nBLOCKERS:\n'+blockerSummary+'\n\nAVERAGE CONFIDENCE: '+avgConf+'%\nTOTAL CONNECTIONS: '+connections.length+'\n\nINSTRUCTIONS:\n'+fmtInstr,
        700
      );
      setDigestOut(txt);
    }catch(e){setDigestOut('Error: '+e.message);}
    setLoading(false);
  }

  function copyDigest(){
    if(digestOut)navigator.clipboard.writeText(digestOut).catch(function(){});
  }

  return h('div',{className:'dgt',role:'region','aria-label':'Weekly digest'},
    h('div',{className:'dgt-top'},
      h('div',null,
        h('div',{className:'dgt-title'},'Weekly Digest'),
        h('div',{className:'dgt-sub'},'SESSION 4 \u00b7 '+today+' \u00b7 '+clusters.length+' CLUSTERS \u00b7 '+connections.length+' CONNECTIONS')
      ),
      h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginLeft:'auto'}},
        [['brief','Brief'],['newsletter','Newsletter'],['markdown','Markdown']].map(function(p){
          return h('button',{key:p[0],
            style:{fontFamily:'DM Mono,monospace',fontSize:'9px',padding:'4px 10px',borderRadius:'4px',cursor:'pointer',border:'1px solid '+(fmt===p[0]?mc:'var(--border2)'),background:fmt===p[0]?mc+'18':'transparent',color:fmt===p[0]?mc:'var(--sub)',transition:'all .12s'},
            'aria-pressed':String(fmt===p[0]),
            onClick:function(){setFmt(p[0]);setDigestOut(null);}},p[1]);
        }),
        h('button',{
          style:{fontFamily:'DM Mono,monospace',fontSize:'9px',padding:'4px 14px',borderRadius:'4px',cursor:'pointer',border:'none',background:mc,color:'#08090d',fontWeight:'700',transition:'opacity .15s',opacity:loading?0.5:1},
          disabled:loading,'aria-busy':String(loading),
          onClick:generate},
          loading?h('span',{style:{animation:'spin .9s linear infinite',display:'inline-block'},'aria-hidden':'true'},'\u25cc'):'\u25b6',
          ' ',loading?'Generating\u2026':'Generate'
        )
      )
    ),
    h('div',{className:'dgt-body'},
      /* Stats cards */
      h('div',{className:'dgt-card'},
        h('div',{className:'dgt-card-label'},'Clusters'),
        h('div',{className:'dgt-card-val',style:{color:mc}},clusters.length),
        h('div',{style:{fontFamily:'DM Mono,monospace',fontSize:'9px',color:'var(--sub)'}},'A\u2013O \u00b7 4 sessions')
      ),
      h('div',{className:'dgt-card'},
        h('div',{className:'dgt-card-label'},'Connections'),
        h('div',{className:'dgt-card-val',style:{color:'#47a8ff'}},connections.length),
        h('div',{style:{fontFamily:'DM Mono,monospace',fontSize:'9px',color:'var(--sub)'}},'Avg '+avgConf+'% confidence')
      ),
      h('div',{className:'dgt-card'},
        h('div',{className:'dgt-card-label'},'Active Blockers'),
        h('div',{className:'dgt-card-val',style:{color:'#ff4769'}},blockers.length),
        h('div',{style:{fontFamily:'DM Mono,monospace',fontSize:'9px',color:'var(--sub)'}},'5+ sessions unresolved')
      ),
      h('div',{className:'dgt-card'},
        h('div',{className:'dgt-card-label'},'Top Connection'),
        h('div',{style:{fontSize:'11px',fontWeight:'700',lineHeight:'1.35',marginTop:'2px',color:'#ff4769'}},topConns[0]&&topConns[0].title),
        h('div',{style:{fontFamily:'DM Mono,monospace',fontSize:'9px',color:'#ff4769'}},(topConns[0]&&topConns[0].confidence)+'% \u00b7 Stealth Use Case')
      ),
      /* Top connections list */
      h('div',{className:'dgt-card dgt-full'},
        h('div',{className:'dgt-card-label'},'Top 5 Connections by Confidence'),
        h('div',{className:'dgt-card-list'},
          topConns.map(function(c,i){
            return h('div',{key:c.id,className:'dgt-item'},
              h('span',{style:{fontFamily:'DM Mono,monospace',fontSize:'9px',color:'var(--muted)',width:'14px',flexShrink:0}},i+1),
              h('span',{className:'dgt-dot',style:{background:c.color},'aria-hidden':'true'}),
              h('span',{style:{flex:1}},c.title),
              h('span',{style:{fontFamily:'DM Mono,monospace',fontSize:'9px',color:c.color,flexShrink:0}},c.confidence+'%')
            );
          })
        )
      ),
      /* Blockers */
      h('div',{className:'dgt-card dgt-full'},
        h('div',{className:'dgt-card-label'},'Blocker Carry'),
        h('div',{className:'dgt-card-list'},
          blockers.map(function(b){
            return h('div',{key:b.id,className:'dgt-item'},
              h('span',{style:{color:'#ff4769',flexShrink:0,fontSize:'10px'},'aria-hidden':'true'},'\u26a0\ufe0f'),
              h('span',{style:{flex:1}},b.title)
            );
          })
        )
      ),
      /* Generated output */
      digestOut&&h('div',{className:'dgt-card dgt-full'},
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}},
          h('div',{className:'dgt-card-label',style:{flex:1}},fmt.toUpperCase()+' OUTPUT'),
          h('button',{
            style:{fontFamily:'DM Mono,monospace',fontSize:'9px',padding:'3px 9px',borderRadius:'4px',cursor:'pointer',border:'1px solid var(--border2)',background:'transparent',color:'var(--sub)'},
            onClick:copyDigest,'aria-label':'Copy digest to clipboard'},'Copy')
        ),
        h('div',{className:'dgt-out','aria-live':'polite'},digestOut)
      )
    )
  );
}

              h('td',{className:'ldg-td'},
                cc>0
                  ? h('span',{style:{fontFamily:'DM Mono,monospace',fontSize:'10px',color:c.color}},cc+' ('+maxConf+'% peak)')
                  : h('span',{style:{fontFamily:'DM Mono,monospace',fontSize:'10px',color:'var(--muted)'}},'none')
              ),
              h('td',{className:'ldg-td',style:{color:'var(--sub)',fontSize:'10px',maxWidth:'280px'}},c.desc)
            );
          }))
        )
      )
    )
  );
}

/* ── App ──────────────────────────────────────────────── */
function App(){
  var _cl=usePersist('kos-clusters',INIT_CLUSTERS),clusters=_cl[0],setClusters=_cl[1];
  var _co=usePersist('kos-connections',INIT_CONNECTIONS),connections=_co[0],setConnections=_co[1];
  var _tab=useState('graph'),tab=_tab[0],setTab=_tab[1];
  var _mode=useState('personal'),mode=_mode[0],setMode=_mode[1];
  var _sel=useState(null),selected=_sel[0],setSelected=_sel[1];
  var _panel=useState(null),panel=_panel[0],setPanel=_panel[1];
  var _q=useState(''),query=_q[0],setQuery=_q[1];
  var _scan=useState(false),scan=_scan[0],setScan=_scan[1];
  var _toast=useState(null),toast=_toast[0],setToast=_toast[1];
  var _drawer=useState(null),drawer=_drawer[0],setDrawer=_drawer[1];
  var _confirm=useState(null),confirm=_confirm[0],setConfirm=_confirm[1];
  var _shortcuts=useState(false),shortcuts=_shortcuts[0],setShortcuts=_shortcuts[1];
  var _sbOpen=useState(true),sbOpen=_sbOpen[0],setSbOpen=_sbOpen[1];
  var _sbrOpen=useState(true),sbrOpen=_sbrOpen[0],setSbrOpen=_sbrOpen[1]; /* 'left'|'right'|null */

  var cm=useMemo(function(){return MODES.find(function(m){return m.id===mode;})||MODES[0];},[mode]);

  function flash(msg){
    setToast(msg);announce(msg);
    setTimeout(function(){setToast(null);},2500);
  }

  function handleDelete(type,id){
    var item=type==='connection'
      ?connections.find(function(c){return c.id===id;})
      :clusters.find(function(c){return c.id===id;});
    var label=item?(item.title||item.label):'item';
    setConfirm({type:type,id:id,label:label,
      onConfirm:function(){
        if(type==='connection'){
          setConnections(function(p){return p.filter(function(c){return c.id!==id;});});
          if(selected===id)setSelected(null);
          flash('✓ Connection deleted');
        } else {
          setClusters(function(p){return p.filter(function(c){return c.id!==id;});});
          setConnections(function(p){return p.filter(function(c){return c.from!==id&&c.to!==id;});});
          if(selected===id)setSelected(null);
          flash('✓ Cluster deleted');
        }
        setConfirm(null);
      }
    });
  }

  function handleReinforce(id){
    var today=new Date().toISOString().slice(0,10);
    setConnections(function(p){return p.map(function(c){
      if(c.id!==id)return c;
      var boosted=Math.min(c.confidence+5,99);
      return Object.assign({},c,{date:today,confidence:boosted});
    });});
    flash('✓ Connection reinforced');
  }

  /* Global keyboard shortcuts */
  useEffect(function(){
    function onKey(e){
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
      if(e.key==='?'&&!e.shiftKey){setShortcuts(function(s){return !s;});}
      if(e.key==='Escape'){setSelected(null);setShortcuts(false);}
      if((e.key==='Delete'||e.key==='Backspace')&&selected&&!panel&&!confirm){
        var isConn=connections.some(function(c){return c.id===selected;});
        if(isConn)handleDelete('connection',selected);
      }
      if(e.key==='0'&&!e.ctrlKey&&!e.metaKey){} /* zoom reset handled in graph */
    }
    document.addEventListener('keydown',onKey);
    return function(){document.removeEventListener('keydown',onKey);};
  },[selected,panel,confirm,connections]);

  var filteredConns=useMemo(function(){
    if(!query.trim())return connections;
    var q=query.toLowerCase();
    return connections.filter(function(c){return c.title.toLowerCase().includes(q)||c.type.toLowerCase().includes(q)||c.body.toLowerCase().includes(q);});
  },[connections,query]);

  var selItem=useMemo(function(){
    if(!selected)return null;
    return connections.find(function(c){return c.id===selected;})||clusters.find(function(c){return c.id===selected;})||null;
  },[selected,connections,clusters]);

  var handleDocResult=useCallback(function(doc){
    setScan(true);
    var valid=(doc.connections||[]).filter(function(c){
      return c.targetClusterId!==doc.cluster&&clusters.some(function(cl){return cl.id===c.targetClusterId;});
    });
    if(valid.length>0){
      var today=new Date().toISOString().slice(0,10);
      var so=SOURCES.find(function(s){return s.id===doc.src;});
      var added=valid.map(function(c,i){return{id:Date.now()+'-'+i,from:doc.cluster,to:c.targetClusterId,type:c.type,color:(so&&so.color)||'#47a8ff',confidence:c.confidence,title:c.title,date:today,body:c.description,tags:[]};});
      setConnections(function(p){return p.concat(added);});
      flash('\u2713 '+added.length+' new connection'+(added.length>1?'s':'')+' added');
    }else{flash('Analysis complete \u2014 no new connections found');}
    setTimeout(function(){setScan(false);setPanel(null);},600);
  },[clusters,setConnections]);

  function sel(id){setSelected(function(p){return p===id?null:id;});}

  var TABS=[
    {id:'graph',label:'\u2b21 Graph'},
    {id:'matrix',label:'\u229e Matrix'},
    {id:'timeline',label:'\u29d7 Timeline'},
    {id:'assistant',label:'\u2b21 Assistant',badge:'AI'},
    {id:'signals',label:'\u26a0 Signals',badge:'live'},
    {id:'digest',label:'\u25b6 Digest',badge:'NEW'},
    {id:'ledger',label:'\u2630 Ledger'},
  ];

  var mc=cm.color;

  /* Main canvas content */
  function renderTab(){
    if(tab==='graph')return h(ForceGraph,{clusters:clusters,connections:filteredConns,selected:selected,onSelect:sel,mc:mc});
    if(tab==='matrix')return h(MatrixView,{clusters:clusters,connections:filteredConns,selected:selected,onSelect:sel});
    if(tab==='timeline')return h(TimelineView,{connections:filteredConns,selected:selected,onSelect:sel});
    if(tab==='assistant')return h(AssistantTab,{clusters:clusters,connections:filteredConns,mc:mc});
    if(tab==='signals')return h(SignalsTab,{connections:connections,clusters:clusters,mc:mc,onSelect:function(id){sel(id);setTab('graph');}});
    if(tab==='digest')return h(DigestTab,{clusters:clusters,connections:connections,mc:mc});
    if(tab==='ledger')return h(LedgerTab,{clusters:clusters,connections:filteredConns,onSelect:function(id){sel(id);setTab('graph');}});
    return null;
  }

  /* Mobile drawer */
  function Drawer(){
    if(!drawer)return null;
    var isRight=drawer==='right';
    return h('div',{className:'drawer',role:'dialog','aria-modal':'true','aria-label':isRight?'Details':'Navigation'},
      h('div',{className:'drawer-backdrop',onClick:function(){setDrawer(null);}}),
      h('div',{className:'drawer-panel'+(isRight?' right':'')},
        isRight
          ? h(DetailPanel,{item:selItem,clusters:clusters,onActionDone:function(id,a){flash('\u2713 '+a+' generated');},onDelete:handleDelete,onReinforce:handleReinforce})
          : h(Sidebar,{clusters:clusters,filteredConns:filteredConns,selected:selected,onSelect:function(id){sel(id);setDrawer(null);}})
      )
    );
  }

  return h('div',{id:'app','aria-label':'Knowledge OS'},
    /* scan bar */
    scan&&h('div',{className:'scan-bar','aria-hidden':'true',style:{color:mc}},h('div',{className:'scan-fill'})),

    /* ── HEADER ── */
    h('header',{className:'hdr'},
      /* mobile menu btn */
      h('button',{className:'menu-btn','aria-label':'Open navigation',onClick:function(){setDrawer('left');}},'☰'),
      h('div',{className:'logo','aria-label':'Knowledge OS'},'Know',h('span',{style:{color:mc}},'ledge OS')),
      h('div',{className:'vbar','aria-hidden':'true'}),
      /* mode dots */
      h('div',{className:'mode-row',role:'radiogroup','aria-label':'Active mode'},
        MODES.map(function(m){
          return h('button',{key:m.id,className:'mdot'+(mode===m.id?' active':''),
            role:'radio','aria-checked':String(mode===m.id),'aria-label':m.label,
            title:m.label,
            style:{borderColor:m.color,background:mode===m.id?m.color:'transparent'},
            onClick:function(){setMode(m.id);}
          });
        }),
        h('span',{className:'mode-lbl','aria-hidden':'true'},cm.label.toUpperCase())
      ),
      /* right controls */
      h('div',{className:'hdr-right'},
        h('div',{className:'srch-wrap'},
          h('span',{className:'srch-ico','aria-hidden':'true'},'\u2315'),
          h('input',{type:'search',className:'srch',value:query,
            style:{borderColor:query?mc:'var(--border2)'},
            placeholder:'Search\u2026','aria-label':'Search connections',
            onChange:function(e){setQuery(e.target.value);}
          })
        ),
        h('button',{className:'hbtn','aria-label':'Keyboard shortcuts (? key)',title:'Keyboard shortcuts',onClick:function(){setShortcuts(function(s){return !s;});},style:{padding:'4px 8px'}},'⌘'),
        h('button',{className:'hbtn','aria-pressed':String(panel==='roadmap'),
          style:{borderColor:panel==='roadmap'?mc:'var(--border2)',color:panel==='roadmap'?mc:'var(--sub)'},
          onClick:function(){setPanel(function(p){return p==='roadmap'?null:'roadmap';});}
        },'ROADMAP'),
        /* mobile detail btn */
        selItem&&h('button',{className:'hbtn menu-btn',style:{display:'flex'},'aria-label':'Open details',onClick:function(){setDrawer('right');}},'?')
      )
    ),

    /* ── TAB BAR ── */
    h('div',{className:'tab-bar',role:'tablist','aria-label':'View modes'},
      TABS.map(function(t){
        return h('button',{key:t.id,className:'tbtn',role:'tab',
          'aria-selected':String(tab===t.id),'aria-controls':'tabpanel',
          id:'tab-'+t.id,
          style:{color:tab===t.id?mc:'var(--sub)',borderBottomColor:tab===t.id?mc:'transparent'},
          onClick:function(){setTab(t.id);}
        },
          t.label,
          t.badge&&h('span',{className:'badge','aria-label':t.badge+' feature'},t.badge)
        );
      })
    ),

    /* ── BODY ── */
    h('div',{className:'body-grid',style:{gridTemplateColumns:(sbOpen?'var(--sb-w)':'0')+' 1fr '+(sbrOpen?'var(--sbr-w)':'0')}},
      /* sidebar left */
      h('nav',{
        id:'sidebar',
        className:'sb'+(sbOpen?'':' collapsed'),
        'aria-label':'Knowledge clusters and connections',
        'aria-hidden':String(!sbOpen),
        style:{position:'relative',display:'flex',flexDirection:'column'}
      },
        h('button',{
          className:'sb-toggle left',
          'aria-label':sbOpen?'Collapse navigation':'Expand navigation',
          'aria-expanded':String(sbOpen),
          'aria-controls':'sidebar',
          onClick:function(){setSbOpen(function(v){return !v;});}
        },sbOpen?'\u25c4':'\u25ba'),
        sbOpen&&h(Sidebar,{clusters:clusters,filteredConns:filteredConns,selected:selected,onSelect:sel})
      ),

      /* main canvas */
      h('main',{className:'main',id:'main',
        role:'tabpanel','aria-labelledby':'tab-'+tab,
        tabIndex:-1,
      },
        renderTab(),
        /* Overlay panels (Add Doc, Roadmap) */
        panel==='add'&&h(AddDocPanel,{clusters:clusters,onClose:function(){setPanel(null);},onResult:handleDocResult}),
        panel==='roadmap'&&h(RoadmapPanel,{onClose:function(){setPanel(null);},mode:cm}),
        /* FAB — only on graph/matrix/timeline tabs */
        !panel&&tab!=='assistant'&&h('button',{className:'fab',
          style:{background:mc,color:'#08090d',boxShadow:'0 4px 24px '+mc+'35'},
          'aria-label':'Add document to knowledge graph',
          onClick:function(){setPanel('add');}
        },'+')
      ),

      /* sidebar right */
      h('aside',{
        className:'sbr'+(sbrOpen?'':' collapsed'),
        'aria-label':'Selection details',
        'aria-hidden':String(!sbrOpen),
        style:{position:'relative',display:'flex',flexDirection:'column'}
      },
        h('button',{
          className:'sb-toggle right',
          'aria-label':sbrOpen?'Collapse details panel':'Expand details panel',
          'aria-expanded':String(sbrOpen),
          onClick:function(){setSbrOpen(function(v){return !v;});}
        },sbrOpen?'\u25ba':'\u25c4'),
        sbrOpen&&h(DetailPanel,{item:selItem,clusters:clusters,onActionDone:function(id,a){flash('\u2713 '+a+' generated');},onDelete:handleDelete,onReinforce:handleReinforce})
      )
    ),

    /* Mobile drawer */
    h(Drawer,null),

    /* Toast */
    /* Confirm dialog */
    confirm&&h(ConfirmDialog,{
      title:'Delete '+confirm.type+': "'+confirm.label+'"?',
      sub:'This cannot be undone. Connected edges will also be removed for clusters.',
      onConfirm:confirm.onConfirm,
      onCancel:function(){setConfirm(null);}
    }),
    /* Shortcuts overlay */
    shortcuts&&h(ShortcutsOverlay,{onClose:function(){setShortcuts(false);}}),
    toast&&h('div',{className:'toast',role:'status','aria-live':'polite'},toast)
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(h(App,null));
})();
</script>
</body>
</html>
