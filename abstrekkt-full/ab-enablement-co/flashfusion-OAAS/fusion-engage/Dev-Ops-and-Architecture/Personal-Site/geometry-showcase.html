<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Geometry Lab - Bloom + GLTF + Export</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
#wrap{position:fixed;inset:0;z-index:0}
canvas{display:block}
#nav{position:fixed;left:0;top:0;bottom:0;width:186px;z-index:30;background:rgba(2,2,14,.92);backdrop-filter:blur(14px);border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;padding:20px 0 12px;transition:width .26s cubic-bezier(.4,0,.2,1);overflow:hidden}
.nl{padding:0 16px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
.nl-s{font-size:7px;letter-spacing:.44em;color:rgba(160,190,255,.22);text-transform:uppercase;margin-bottom:3px}
.nl-t{font-family:'Georgia',serif;font-size:15px;color:#fff;font-weight:400}
.ni{flex:1;overflow-y:auto;padding:8px 0}
.ni::-webkit-scrollbar{width:2px}.ni::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07)}
.nb{display:flex;align-items:flex-start;gap:8px;width:100%;padding:7px 16px;cursor:pointer;transition:all .18s;border:none;background:transparent;text-align:left;border-left:2px solid transparent}
.nb:hover{background:rgba(255,255,255,.04)}.nb.active{background:rgba(80,120,255,.1);border-left-color:#5577ff}
.nn{font-size:7px;color:rgba(160,195,255,.18);letter-spacing:.08em;padding-top:1px;min-width:18px;flex-shrink:0}
.nb.active .nn{color:#5577ff}
.nd{display:flex;flex-direction:column;gap:1px}
.nl2{font-size:9px;letter-spacing:.2em;color:rgba(190,215,255,.35);text-transform:uppercase}
.nb.active .nl2{color:rgba(210,230,255,.85)}
.ng{font-size:7px;letter-spacing:.06em;color:rgba(160,190,255,.14)}
.nb.active .ng{color:rgba(100,160,255,.38)}
.nf{padding:10px 16px 0;border-top:1px solid rgba(255,255,255,.04)}
.nf p{font-size:7px;letter-spacing:.16em;color:rgba(255,255,255,.08);line-height:2.4}
/* ── Accessibility ── */
.skip-link{position:fixed;top:-999px;left:8px;z-index:9999;background:#000;color:#8af;padding:6px 14px;font-size:11px;border-radius:3px;text-decoration:none;outline:none;transition:top .1s}
.skip-link:focus{top:8px}
*:focus-visible{outline:2px solid rgba(120,170,255,.7)!important;outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  #nav{transition:none!important}
}
/* ── Responsive ── */
@media(max-width:680px){
  #nav{width:40px}
  #nav .nl-s,#nav .nl-t,#nav .nd,#nav .nf{opacity:0;pointer-events:none}
  #nav .nl{padding:0 0 12px;display:flex;justify-content:center}
  #nav .nb{padding:7px 0;justify-content:center}
  #nav-tog{display:none}
  #ai-btn{left:58px!important;font-size:7px;padding:5px 9px}
  #ai-panel{left:40px!important}
  #hud{top:10px;right:10px}
  #hud p{font-size:8px;letter-spacing:.1em}
  #spd-ui{bottom:10px;right:10px;gap:5px}
  #spd-ui label{display:none}
}
@media(max-width:400px){
  #ai-panel{left:0!important;padding:10px 12px}
  #spd-ui{display:none}
}
/* ── Collapsible nav ── */
#nav-tog{position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:16px;height:40px;background:rgba(2,2,14,.95);border:1px solid rgba(255,255,255,.07);border-left:none;border-radius:0 5px 5px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:32;transition:background .18s;padding:0;color:rgba(160,195,255,.45);font-size:9px;line-height:1}
#nav-tog:hover{background:rgba(30,40,80,.95);color:rgba(210,230,255,.85)}
#nav.collapsed{width:40px}
#nav.collapsed .nl-s,#nav.collapsed .nl-t,#nav.collapsed .nd,#nav.collapsed .nf{opacity:0;pointer-events:none}
#nav.collapsed .nl{padding:0 0 12px;display:flex;justify-content:center;border-bottom-color:transparent}
#nav.collapsed .nb{padding:7px 0;justify-content:center}
#nav.collapsed .nn{min-width:auto;color:rgba(160,195,255,.22);font-size:8px}
#nav.collapsed .nb.active .nn{color:#5577ff}
#nav.collapsed #nav-tog{right:-1px}
/* suppress scrollbar in collapsed state */
#nav.collapsed .ni{overflow:hidden}
.nl-s,.nl-t,.nd,.nf{transition:opacity .18s}
#hud{position:fixed;top:22px;right:26px;z-index:20;text-align:right;opacity:0;transition:opacity .5s;pointer-events:none}
#hud.on{opacity:1}
#ht{font-family:'Georgia',serif;font-size:22px;color:#fff;margin-bottom:2px}
#hg{font-size:7px;letter-spacing:.28em;color:rgba(80,150,255,.5);text-transform:uppercase;margin-bottom:4px}
#hd{font-size:8px;letter-spacing:.11em;color:rgba(170,200,255,.25);line-height:2;max-width:210px}
#spd-ui{position:fixed;bottom:22px;right:26px;z-index:20;display:flex;align-items:center;gap:9px;opacity:0;transition:opacity .5s}
#spd-ui.on{opacity:1}
#spd-ui label{font-size:7px;letter-spacing:.3em;color:rgba(190,210,255,.16);text-transform:uppercase}
#spd{width:76px;accent-color:#5577ff;cursor:pointer}
#sv{font-size:8px;color:rgba(190,210,255,.26);min-width:28px;text-align:right}
#ai-btn{position:fixed;bottom:22px;left:204px;z-index:31;background:rgba(50,70,180,.18);border:1px solid rgba(100,140,255,.28);color:rgba(160,200,255,.75);font-size:8px;letter-spacing:.24em;text-transform:uppercase;padding:7px 13px;cursor:pointer;transition:all .22s;opacity:0;backdrop-filter:blur(8px);font-family:'Courier New',monospace}
#ai-btn.on{opacity:1}
#ai-btn:hover{background:rgba(70,110,255,.28);border-color:rgba(140,180,255,.45);color:#fff}
#ai-panel{position:fixed;bottom:0;left:186px;right:0;z-index:29;background:rgba(2,3,18,.95);backdrop-filter:blur(16px);border-top:1px solid rgba(100,140,255,.18);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.3,1);padding:14px 20px 18px}
#ai-panel.open{transform:translateY(0)}
.ai-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ai-ttl{font-size:8px;letter-spacing:.34em;color:rgba(140,180,255,.48);text-transform:uppercase}
.ai-x{background:none;border:none;color:rgba(160,190,255,.28);cursor:pointer;font-size:13px;padding:0 2px;transition:color .18s}
.ai-x:hover{color:rgba(200,220,255,.65)}
.ai-pre{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ai-chip{background:rgba(50,70,170,.14);border:1px solid rgba(100,130,255,.18);color:rgba(160,195,255,.45);font-size:7px;letter-spacing:.18em;text-transform:uppercase;padding:4px 9px;cursor:pointer;transition:all .18s;font-family:'Courier New',monospace}
.ai-chip:hover{background:rgba(70,110,255,.22);color:rgba(200,225,255,.8);border-color:rgba(140,170,255,.38)}
.ai-sug-chip{background:rgba(0,140,100,.12);border:1px solid rgba(0,200,140,.2);color:rgba(100,220,170,.55);font-size:7px;letter-spacing:.16em;text-transform:none;padding:4px 9px;cursor:pointer;transition:all .18s;font-family:'Courier New',monospace;max-width:220px;text-align:left;white-space:normal;line-height:1.5}
.ai-sug-chip:hover{background:rgba(0,200,140,.2);color:rgba(180,255,220,.9);border-color:rgba(0,220,160,.38)}
#suggest-btn{background:rgba(0,140,100,.12);border:1px solid rgba(0,200,140,.2);color:rgba(80,200,150,.6);font-size:7px;letter-spacing:.24em;text-transform:uppercase;padding:4px 10px;cursor:pointer;transition:all .2s;font-family:'Courier New',monospace}
#suggest-btn:hover{background:rgba(0,200,140,.2);color:rgba(160,255,200,.85)}
#suggest-btn:disabled{opacity:.3;cursor:not-allowed}
#mic-btn{background:rgba(180,20,20,.1);border:1px solid rgba(255,60,60,.2);color:rgba(255,120,120,.5);font-size:7px;letter-spacing:.24em;text-transform:uppercase;padding:4px 10px;cursor:pointer;transition:all .2s;font-family:'Courier New',monospace}
#mic-btn:hover{background:rgba(255,60,60,.2);color:rgba(255,180,180,.85)}
#mic-btn.live{background:rgba(200,20,20,.3);border-color:rgba(255,60,60,.5);color:rgba(255,160,160,.9)}
.vu-bar{display:inline-block;width:2px;background:rgba(255,80,80,.25);margin:0 1px;vertical-align:middle;transition:height .04s}
.vu-bar.on{background:rgba(255,100,80,.85)}
#vu{display:inline-flex;align-items:flex-end;height:12px;margin-left:4px;vertical-align:middle}
#sug-wrap{margin-bottom:8px}
#sug-chips{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sug-label{font-size:7px;letter-spacing:.28em;color:rgba(0,200,140,.35);text-transform:uppercase;margin-bottom:3px}
.ai-row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
#ai-input{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(100,140,255,.16);color:rgba(210,230,255,.82);font-size:9px;letter-spacing:.1em;padding:7px 11px;font-family:'Courier New',monospace;outline:none;resize:none;height:34px;transition:border-color .18s}
#ai-input:focus{border-color:rgba(100,160,255,.38)}
#ai-go{background:rgba(55,95,240,.2);border:1px solid rgba(100,150,255,.28);color:rgba(180,210,255,.75);font-size:10px;padding:0 14px;cursor:pointer;transition:all .18s;font-family:'Courier New',monospace;min-width:42px}
#ai-go:hover{background:rgba(75,125,255,.32);color:#fff}
#ai-go:disabled{opacity:.3;cursor:not-allowed}
.ai-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bloom-row{display:flex;align-items:center;gap:8px}
.bloom-row label{font-size:7px;letter-spacing:.24em;color:rgba(180,200,255,.25);text-transform:uppercase}
#bloom-sl{width:72px;accent-color:#aaccff;cursor:pointer}
#bloom-val{font-size:8px;color:rgba(180,200,255,.3);min-width:24px}
#exp-btn{background:rgba(0,200,120,.1);border:1px solid rgba(0,200,120,.22);color:rgba(100,220,160,.65);font-size:8px;letter-spacing:.2em;text-transform:uppercase;padding:5px 12px;cursor:pointer;transition:all .18s;font-family:'Courier New',monospace}
#exp-btn:hover{background:rgba(0,220,140,.18);color:rgba(180,255,210,.9);border-color:rgba(0,220,140,.4)}
#ai-status{margin-top:7px;font-size:7px;letter-spacing:.15em;color:rgba(140,180,255,.35);min-height:13px}
#ai-status.ok{color:rgba(80,220,120,.6)}
#ai-status.err{color:rgba(255,90,90,.55)}
#ldr{position:fixed;inset:0;background:#000008;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .55s}
#ldr.off{opacity:0;pointer-events:none}
.lt{font-family:'Georgia',serif;font-size:28px;color:#fff;margin-bottom:5px}
.ls{font-size:7px;letter-spacing:.48em;color:rgba(160,195,255,.22);text-transform:uppercase;margin-bottom:26px}
.lb{width:140px;height:1px;background:rgba(255,255,255,.06);margin-bottom:7px}
.lf{height:100%;width:0;background:linear-gradient(90deg,#223,#5577ff,#aac);transition:width .2s}
.lp{font-size:8px;color:rgba(185,210,255,.22);letter-spacing:.2em}
#fade{position:fixed;inset:0;background:#000;z-index:25;opacity:0;pointer-events:none;transition:opacity .24s}
#fade.on{opacity:1}
#gltf-status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.3em;color:rgba(180,210,255,.4);text-transform:uppercase;z-index:15;pointer-events:none;transition:opacity .4s}
</style>
</head>
<body>
<div id="ldr"><p class="lt">Geometry Lab</p><p class="ls">Bloom + GLTF + Export</p>
  <div class="lb"><div class="lf" id="lf"></div></div><p class="lp" id="lp">0%</p></div>
<div id="fade"></div>
<div id="wrap" id="main-content" role="main" aria-live="polite" aria-atomic="true"></div>
<div id="a11y-announce" aria-live="polite" aria-atomic="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"></div>
<p id="gltf-status" style="opacity:0"></p>

<a href="#main-content" class="skip-link">Skip to content</a>
<nav id="nav" role="navigation" aria-label="Scene list">
  <div class="nl"><p class="nl-s">Three.js r128 · AI · Bloom</p><p class="nl-t">Geometry Lab</p></div>
  <div class="ni" id="ni"></div>
  <div class="nf"><p>Arrow keys to navigate<br>Drag orbit / Scroll zoom<br>AI Edit · Bloom · Export</p></div>
  <button id="nav-tog" onclick="toggleNav()" title="Toggle sidebar" aria-label="Toggle navigation sidebar" aria-expanded="true">&#8249;</button>
</nav>

<div id="hud"><p id="ht">-</p><p id="hg">-</p><p id="hd">-</p></div>
<div id="spd-ui"><label>Speed</label><input type="range" id="spd" min="0" max="5" step=".05" value="1"><span id="sv">1.0x</span></div>
<button id="ai-btn" onclick="toggleAI()" aria-label="Open AI editor" aria-expanded="false">AI Edit</button>

<div id="ai-panel">
  <div class="ai-hdr">
    <span class="ai-ttl" id="ai-lbl">AI Edit</span>
    <button class="ai-x" onclick="toggleAI()">x</button>
  </div>
  <div class="ai-pre" id="ai-pre"></div>
  <div id="sug-wrap">
    <button id="suggest-btn" onclick="suggestAI()">&#9679; Suggest 3</button>
    <div id="sug-chips"></div>
  </div>
  <div class="ai-row">
    <input id="ai-input" placeholder="e.g. make it deep crimson with heavy storm atmosphere" onkeydown="if(event.key==='Enter')runAI()">
    <button id="ai-go" onclick="runAI()">Go</button>
  </div>
  <div class="ai-tools">
    <div class="bloom-row">
      <label>Bloom</label>
      <input type="range" id="bloom-sl" min="0" max="4" step=".05" value="1.2" oninput="setBloom(+this.value)">
      <span id="bloom-val">1.2</span>
    </div>
    <button id="exp-btn" onclick="exportScene()" aria-label="Download scene as HTML">Download HTML</button>
    <button id="mic-btn" onclick="toggleMic()" aria-label="Toggle microphone input">&#9670; Mic</button>
    <span id="vu"><span class="vu-bar" id="vu0"></span><span class="vu-bar" id="vu1"></span><span class="vu-bar" id="vu2"></span><span class="vu-bar" id="vu3"></span></span>
  </div>
  <p id="ai-status"></p>
</div>

<!-- Three.js core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- GLTF loader — jsdelivr CDN, attaches to global THREE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
/* =====================================================
   CORE ENGINE
===================================================== */
var W=innerWidth,H=innerHeight;
var wrapEl=document.getElementById('wrap');
wrapEl.innerHTML='';
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
/* NaN position interceptor -- silently fixes corrupt geometries */
(function(){
  var _orig=THREE.BufferGeometry.prototype.computeBoundingSphere;
  THREE.BufferGeometry.prototype.computeBoundingSphere=function(){
    var pos=this.attributes.position;
    if(pos){
      var arr=pos.array,dirty=false;
      for(var _i=0;_i<arr.length;_i++){
        if(isNaN(arr[_i])||!isFinite(arr[_i])){arr[_i]=0;dirty=true;}
      }
      if(dirty)pos.needsUpdate=true;
    }
    return _orig.call(this);
  };
})();

wrapEl.appendChild(renderer.domElement);

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(56,W/H,.05,3000);
var clock=new THREE.Clock();
var SPD=1,animFn=null,trash=[];

/* -- Inline Bloom: WebGLRenderTarget + ShaderMaterial, zero CDN deps -- */
var _bloomStr=1.2,bloomPass=null,composer=null;
(function(){
  try{
    var VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
    var rt1=new THREE.WebGLRenderTarget(W,H,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
    var rt2=new THREE.WebGLRenderTarget(Math.max(1,W>>1),Math.max(1,H>>1),{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
    var rt3=rt2.clone();
    var thM=new THREE.ShaderMaterial({uniforms:{tD:{value:null},th:{value:.45}},vertexShader:VS,fragmentShader:'uniform sampler2D tD;uniform float th;varying vec2 vUv;void main(){vec4 c=texture2D(tD,vUv);float l=dot(c.rgb,vec3(.299,.587,.114));gl_FragColor=vec4(c.rgb*smoothstep(th,th+.28,l),1.);}',depthTest:false,depthWrite:false});
    var bHM=new THREE.ShaderMaterial({uniforms:{tD:{value:null},px:{value:2.0/(W>>1)}},vertexShader:VS,fragmentShader:'uniform sampler2D tD;uniform float px;varying vec2 vUv;void main(){vec4 c=vec4(0.);c+=texture2D(tD,vUv+vec2(-3.*px,0.))*.0625;c+=texture2D(tD,vUv+vec2(-2.*px,0.))*.125;c+=texture2D(tD,vUv+vec2(-px,0.))*.25;c+=texture2D(tD,vUv)*.125;c+=texture2D(tD,vUv+vec2(px,0.))*.25;c+=texture2D(tD,vUv+vec2(2.*px,0.))*.125;c+=texture2D(tD,vUv+vec2(3.*px,0.))*.0625;gl_FragColor=c;}',depthTest:false,depthWrite:false});
    var bVM=new THREE.ShaderMaterial({uniforms:{tD:{value:null},py:{value:2.0/(H>>1)}},vertexShader:VS,fragmentShader:'uniform sampler2D tD;uniform float py;varying vec2 vUv;void main(){vec4 c=vec4(0.);c+=texture2D(tD,vUv+vec2(0.,-3.*py))*.0625;c+=texture2D(tD,vUv+vec2(0.,-2.*py))*.125;c+=texture2D(tD,vUv+vec2(0.,-py))*.25;c+=texture2D(tD,vUv)*.125;c+=texture2D(tD,vUv+vec2(0.,py))*.25;c+=texture2D(tD,vUv+vec2(0.,2.*py))*.125;c+=texture2D(tD,vUv+vec2(0.,3.*py))*.0625;gl_FragColor=c;}',depthTest:false,depthWrite:false});
    var cM=new THREE.ShaderMaterial({uniforms:{tD:{value:null},tB:{value:null},str:{value:1.2}},vertexShader:VS,fragmentShader:'uniform sampler2D tD,tB;uniform float str;varying vec2 vUv;void main(){gl_FragColor=texture2D(tD,vUv)+texture2D(tB,vUv)*str;}',depthTest:false,depthWrite:false});
    var quad=new THREE.Mesh(new THREE.PlaneBufferGeometry(2,2));
    var qS=new THREE.Scene();qS.add(quad);
    var qC=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    bloomPass={strength:1.2};
    composer={
      render:function(){
        var s=_bloomStr;
        renderer.setRenderTarget(rt1);renderer.render(scene,camera);
        quad.material=thM;thM.uniforms.tD.value=rt1.texture;thM.uniforms.th.value=Math.max(.02,1-s*.24);
        renderer.setRenderTarget(rt2);renderer.render(qS,qC);
        quad.material=bHM;bHM.uniforms.tD.value=rt2.texture;
        renderer.setRenderTarget(rt3);renderer.render(qS,qC);
        quad.material=bVM;bVM.uniforms.tD.value=rt3.texture;
        renderer.setRenderTarget(rt2);renderer.render(qS,qC);
        quad.material=cM;cM.uniforms.tD.value=rt1.texture;cM.uniforms.tB.value=rt2.texture;cM.uniforms.str.value=s;
        renderer.setRenderTarget(null);renderer.render(qS,qC);
      },
      setSize:function(w,h){rt1.setSize(w,h);var hw=Math.max(1,w>>1),hh=Math.max(1,h>>1);rt2.setSize(hw,hh);rt3.setSize(hw,hh);bHM.uniforms.px.value=2/hw;bVM.uniforms.py.value=2/hh;}
    };
  }catch(e){console.warn('Bloom init failed:',e.message);}
})();

/* =====================================================
   AUDIO REACTIVITY  Web Audio API mic -> FFT -> scenes
===================================================== */
var AUDIO={active:false,ctx:null,analyser:null,source:null,fftData:null,
           bass:0,mid:0,hi:0,peak:0,sb:0,sm:0,sh:0};

async function toggleMic(){
  var btn=document.getElementById('mic-btn');
  if(AUDIO.active){
    try{if(AUDIO.source)AUDIO.source.disconnect();}catch(e){}
    try{if(AUDIO.ctx)AUDIO.ctx.close();}catch(e){}
    AUDIO.active=false;AUDIO.ctx=null;AUDIO.analyser=null;AUDIO.source=null;
    AUDIO.bass=AUDIO.mid=AUDIO.hi=AUDIO.peak=0;
    btn.classList.remove('live');btn.innerHTML='&#9670; Mic';
    ['vu0','vu1','vu2','vu3'].forEach(function(id){
      var el=document.getElementById(id);if(el){el.classList.remove('on');el.style.height='3px';}
    });
    return;
  }
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    AUDIO.ctx=new(window.AudioContext||window.webkitAudioContext)();
    AUDIO.analyser=AUDIO.ctx.createAnalyser();
    AUDIO.analyser.fftSize=256;
    AUDIO.analyser.smoothingTimeConstant=0.78;
    AUDIO.fftData=new Uint8Array(AUDIO.analyser.frequencyBinCount);
    AUDIO.source=AUDIO.ctx.createMediaStreamSource(stream);
    AUDIO.source.connect(AUDIO.analyser);
    AUDIO.active=true;
    btn.classList.add('live');btn.innerHTML='&#9670; Live';
    ['vu0','vu1','vu2','vu3'].forEach(function(id){
      var el=document.getElementById(id);if(el)el.classList.add('on');
    });
  }catch(e){
    var st=document.getElementById('ai-status');

function tickAudio(){
  if(!AUDIO.active||!AUDIO.analyser)return;
  AUDIO.analyser.getByteFrequencyData(AUDIO.fftData);
  var b=0,m=0,h=0;
  for(var i=0;i<6;i++)b+=AUDIO.fftData[i];
  for(var i=6;i<46;i++)m+=AUDIO.fftData[i];
  for(var i=46;i<128;i++)h+=AUDIO.fftData[i];
  b/=6*255;m/=40*255;h/=82*255;
  var sp=0.18;
  AUDIO.sb+=(b-AUDIO.sb)*sp;
  AUDIO.sm+=(m-AUDIO.sm)*sp;
  AUDIO.sh+=(h-AUDIO.sh)*sp;
  AUDIO.bass=AUDIO.sb;AUDIO.mid=AUDIO.sm;AUDIO.hi=AUDIO.sh;
  AUDIO.peak=Math.max(AUDIO.bass,AUDIO.mid,AUDIO.hi);
  var bars=['vu0','vu1','vu2','vu3'];
  var vals=[AUDIO.bass*2,AUDIO.mid*2,AUDIO.hi*1.5,AUDIO.peak*2];
  bars.forEach(function(id,i){
    var el=document.getElementById(id);
    if(el)el.style.height=Math.max(2,Math.min(12,Math.round(vals[i]*12)))+'px';
  });
  if(bloomPass){
    var bBase=getP(SCENES[activeIdx].id).bloom||1.2;
    var bStr=bBase+AUDIO.bass*2.2;
    bloomPass.strength=bStr;
    _bloomStr=bStr;
  }
}

  var btn=document.getElementById('ai-go'),st=document.getElementById('ai-status');
  btn.disabled=true;btn.textContent='...';st.className='';st.textContent='Thinking...';
  var sys='You control a Three.js scene "'+sc.label+'". Params available: '+sc.pd+'. Current: '+JSON.stringify(p)+'. User request: "'+prompt+'". Return ONLY raw JSON with updated params. Hex strings for colors, numbers for numbers. No explanation, no markdown.';

    var data=await res.json();
    var txt=data.content.filter(function(c){return c.type==='text';}).map(function(c){return c.text;}).join('');
    var json=JSON.parse(txt.replace(/```json|```/g,'').trim());
    /* Sanitize: coerce every value to correct type */
    var defaults=DEFAULTS[sc.id]||{};
    Object.keys(json).forEach(function(k){
      var v=json[k],dv=defaults[k];
      if(Array.isArray(dv)){if(!Array.isArray(v)||!v.length)json[k]=dv;}
      else if(typeof dv==="number"){var n=parseFloat(v);json[k]=isNaN(n)?dv:n;}
      else if(typeof dv==="string"&&typeof v!=="string")json[k]=String(v);
    });
    Object.assign(p,json);
    if(json.bloom!==undefined)setBloom(json.bloom);
    st.className='ok';st.textContent='Applied: '+Object.keys(json).join(', ');
    go(activeIdx,true);
  }catch(e){st.className='err';st.textContent='Error: '+(e.message||'check console');}
  btn.disabled=false;btn.textContent='Go';
}

   EXPORT PIPELINE
   Captures current page HTML, injects param overrides
   + auto-start for the active scene, strips nav/UI.
===================================================== */
function exportScene(){
  var sc=SCENES[activeIdx];
  var params=JSON.stringify(getP(sc.id));
  var bv=bloomPass?bloomPass.strength.toFixed(3):'1.2';
  var st=document.getElementById('ai-status');
  try{
    var src=document.documentElement.outerHTML;
    // Strip dynamic classes added at runtime so loader shows correctly
    src=src.replace(' class="off"','').replace(' class="on"','');
    // UI hide CSS injection
    var uiHide='<style id="export-ui">'+
      '#nav,#ai-btn,#ai-panel,#spd-ui,#hud,#gltf-status{display:none!important}'+
      'canvas{width:100vw!important;height:100vh!important}'+
      '</style>';
    // Param + bloom bake injection
    var bake='<script id="export-bake">'+
      'window.__EID="'+sc.id+'";'+
      'window.__EIDx='+activeIdx+';'+
      'window.__EP='+params+';'+
      'window.__EB='+bv+';'+
      '<\/script>';
    src=src.replace('</head>',uiHide+bake+'</head>');
    // Override the initial go(0) call to start the right scene with baked params
    src=src.replace(
      'prog(25);go(0);prog(100);',
      'prog(25);if(window.__EP&&window.__EID)P[window.__EID]=window.__EP;if(window.__EB&&bloomPass)setBloom(+window.__EB);go(window.__EIDx||0);prog(100);'
    );
    var blob=new Blob([src],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=sc.id+'-3d-scene.html';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    st.className='ok';st.textContent='Exported: '+sc.id+'-3d-scene.html';
  }catch(e){st.className='err';st.textContent='Export error: '+e.message;}
}

  // Ground
  var gnd=new THREE.Mesh(new THREE.CircleGeometry(12,64),
    new THREE.MeshPhongMaterial({color:hx(p.bg),shininess:40,specular:hx(p.env)}));
  gnd.rotation.x=-Math.PI/2;gnd.position.y=-1.5;gnd.receiveShadow=true;reg(gnd);

  // Shadow catch
  var sc2=new THREE.Mesh(new THREE.CircleGeometry(4,32),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35,depthWrite:false}));
  sc2.rotation.x=-Math.PI/2;sc2.position.y=-1.48;reg(sc2);

  var modelMesh=null;var mixer=null;
  var gltfSt=document.getElementById('gltf-status');
  gltfSt.textContent='Loading model...';gltfSt.style.opacity='1';

  var loader=new THREE.GLTFLoader();
  loader.load(
    p.url,
    function(gltf){
      var model=gltf.scene;
      // Normalize size
      var box=new THREE.Box3().setFromObject(model);
      var size=box.getSize(new THREE.Vector3()).length();
      var center=box.getCenter(new THREE.Vector3());
      model.scale.setScalar(3/size);
      model.position.sub(center.multiplyScalar(3/size));
      model.position.y=0;
      model.traverse(function(child){if(child.isMesh){child.castShadow=true;child.receiveShadow=true;}});
      // Animation mixer
      if(gltf.animations&&gltf.animations.length){
        mixer=new THREE.AnimationMixer(model);
        gltf.animations.forEach(function(clip){mixer.clipAction(clip).play();});
      }
      scene.add(model);modelMesh=model;
      gltfSt.style.opacity='0';
    },
    function(xhr){if(xhr.total)gltfSt.textContent='Loading '+Math.round(xhr.loaded/xhr.total*100)+'%';},
    function(err){
      gltfSt.textContent='Model unavailable - showing fallback';
      setTimeout(function(){gltfSt.style.opacity='0';},2000);
      // Fallback: elegant procedural showcase object
      var fbGrp=new THREE.Group();
      var fbMat=new THREE.MeshPhongMaterial({color:0x88aacc,shininess:120,specular:0x4466aa,emissive:0x001122});
      var sphere=new THREE.Mesh(new THREE.SphereGeometry(1.2,32,32),fbMat.clone());fbGrp.add(sphere);
      var ring1=new THREE.Mesh(new THREE.TorusGeometry(1.8,.06,16,80),new THREE.MeshBasicMaterial({color:hx(p.env),transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));fbGrp.add(ring1);
      var ring2=new THREE.Mesh(new THREE.TorusGeometry(2.2,.04,12,80),new THREE.MeshBasicMaterial({color:hx(p.light),transparent:true,opacity:.4,blending:THREE.AdditiveBlending,depthWrite:false}));ring2.rotation.x=Math.PI/3;fbGrp.add(ring2);
      scene.add(fbGrp);modelMesh=fbGrp;
    }
  );

  animFn=function(t,dt){
    if(mixer)mixer.update(dt*p.rotSpd*SPD);
    if(modelMesh)modelMesh.rotation.y+=.006*p.rotSpd*SPD;
    key.position.set(Math.cos(t*.2)*4,5,Math.sin(t*.2)*4);
    autoOrbit();safeRender();
  };
}

/* =====================================================
   SWITCHER + NAV
===================================================== */
var activeIdx=-1;
function go(idx,force){
  if(idx===activeIdx&&!force)return;
  document.getElementById('fade').classList.add('on');
  setTimeout(function(){
    activeIdx=idx;var sc=SCENES[idx];
    sc.init();
    setBloom(getP(sc.id).bloom||1.2);
    document.getElementById('ht').textContent=sc.label;a11yAnnounce('Scene '+String(idx+1)+': '+sc.label+', '+sc.geo);
    document.getElementById('hg').textContent=sc.geo;
    document.getElementById('hd').textContent=sc.desc;
    document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('active',i===idx);});
    updateAIPanel(sc);
    setTimeout(function(){document.getElementById('fade').classList.remove('on');},70);
  },force?55:230);
}


/* =====================================================
   NAV COLLAPSE
===================================================== */
var navCollapsed=false;
function toggleNav(){
  navCollapsed=!navCollapsed;
  var nav=document.getElementById('nav');
  var tog=document.getElementById('nav-tog');
  var aiBtn=document.getElementById('ai-btn');
  var aiPanel=document.getElementById('ai-panel');
  if(navCollapsed){
    nav.classList.add('collapsed');
    tog.innerHTML='&#8250;';
    tog.title='Expand sidebar';
    if(aiBtn)aiBtn.style.left='58px';
    if(aiPanel)aiPanel.style.left='40px';
  }else{
    nav.classList.remove('collapsed');
    tog.innerHTML='&#8249;';
    tog.title='Collapse sidebar';
    if(aiBtn)aiBtn.style.left='204px';
    if(aiPanel)aiPanel.style.left='186px';
  }
}
/* Build nav */
var niEl=document.getElementById('ni');
SCENES.forEach(function(sc,i){
  var b=document.createElement('button');b.className='nb';
  b.innerHTML='<span class="nn">'+String(i+1).padStart(2,'0')+'</span><div class="nd"><div class="nl2">'+sc.label+'</div><div class="ng">'+sc.geo+'</div></div>';
  b.addEventListener('click',function(){go(i);});niEl.appendChild(b);
});

window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go((activeIdx+1)%SCENES.length);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')go((activeIdx-1+SCENES.length)%SCENES.length);
  if(e.key==='Escape'&&aiOpen)toggleAI();
  if(e.key==='[')toggleNav();
  if(e.key==='+'||e.key==='=')cDist=Math.max(1,cDist*.88);
  if(e.key==='-')cDist=Math.min(900,cDist*1.14);
  if(e.key==='r'||e.key==='R'){cDist=30;cTh=0;cPh=1.2;}

});

(function tick(){
  requestAnimationFrame(tick);
  var t=clock.getElapsedTime(),dt=Math.min(t-t0,.05);t0=t;
  if(animFn)animFn(t,dt);
  tickAudio();
})();

  W=innerWidth;H=innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.setSize(W,H);
  if(composer)composer.setSize(W,H);
  if(bloomPass&&bloomPass.setSize)bloomPass.setSize(W,H);
});
