                <p className="text-gray-700 mb-3"><strong>What to do:</strong> Get tech employment lawyer (~$200-300). Ask: (1) Can I publish about this while employed? (2) What details are off-limits? (3) Want legal review of final draft?</p>

              </div>

              <div className="border-t-2 border-red-200 pt-6">
                <h3 className="text-2xl font-bold text-gray-900 mb-3">3. PITCH VARIATIONS: Different Angles Per Outlet</h3>
                <p className="text-gray-700 mb-3"><strong>Problem:</strong> Atlantic wants "construction vs. recovery" philosophically. MIT TR wants "systems thinking" technically. WIRED wants "unconventional engineer" culturally. Same essay, different pitches.</p>
                <p className="text-gray-700 mb-3"><strong>Create:</strong> 5 pitch variations (literary, tech-culture, tech-systems, business, AI-future).</p>
                <p className="text-sm text-red-600 font-semibold bg-red-50 p-3 rounded-lg"><strong>Generic pitches:</strong> Low open rates. <strong>Specific pitches:</strong> Each outlet sees why essay is perfect *for them*.</p>

            </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                <div>
                  <p className="font-bold mb-2">Week 0 (NOW)</p>
                  <ul className="space-y-1">
                    <li>□ Legal review scheduled</li>

                    <li>□ Draft 5 pitch variations</li>

              </div>

ReactDOM.render(<App />, document.getElementById('root'));
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
