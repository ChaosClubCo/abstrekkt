
<style>
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
*{box-sizing:border-box;margin:0;padding:0;}
body{padding:0;}
.wrap{padding:1rem 0 2rem;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{
  background:var(--color-background-primary);
  border:0.5px solid var(--color-border-tertiary);
  border-radius:var(--border-radius-lg);
  padding:14px 16px;
  cursor:pointer;
  transition:border-color .15s,transform .1s;
  position:relative;
  border-left:3px solid var(--accent-color,var(--color-border-tertiary));
}
.card:hover{border-color:var(--accent-color);transform:translateY(-1px);}
.card.active{border-color:var(--accent-color);background:var(--color-background-secondary);}
.card-top{display:flex;align-items:flex-start;gap:10px;}
.card-icon{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:15px;
}
.card-title{font-size:14px;font-weight:500;color:var(--color-text-primary);line-height:1.3;margin-bottom:3px;}
.card-lane{font-size:11px;color:var(--color-text-secondary);letter-spacing:.04em;}
.chevron{position:absolute;top:14px;right:14px;font-size:14px;color:var(--color-text-secondary);transition:transform .2s;}
.card.active .chevron{transform:rotate(180deg);}
.detail{
  max-height:0;overflow:hidden;transition:max-height .3s ease;
  border-top:0.5px solid transparent;
  margin-top:0;
}
.card.active .detail{max-height:300px;border-top-color:var(--color-border-tertiary);margin-top:12px;padding-top:12px;}
.why{font-size:12.5px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:10px;}
.capstone-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:4px;}
.capstone{font-size:12.5px;color:var(--color-text-primary);font-style:italic;line-height:1.5;margin-bottom:12px;}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pill{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:500;}
.build-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;padding:6px 12px;
  background:transparent;
  border:0.5px solid var(--color-border-secondary);
  border-radius:var(--border-radius-md);
  color:var(--color-text-primary);
  cursor:pointer;
  transition:background .15s;
  font-family:inherit;
}
.build-btn:hover{background:var(--color-background-secondary);}
</style>

<div class="wrap">
  <h2 class="sr-only">Seven suggested arc types to build next in the learning timeline series</h2>
  <div class="grid" id="grid"></div>
</div>

<script>
const ARCS = [
  {
    id:'security',
    title:'The Security Arc',
    lane:'SecAI+ · CAISP · AppSec brand',
    accent:'#e85a5a',
    iconBg:'rgba(232,90,90,0.12)',
    icon:'ti-shield-lock',
    load:'MED',
    cert:'SecAI+ + CAISP',
    horizon:'12 mo',
    why:"Your AppSec background is your clearest personal-brand differentiator — and it's currently under-leveraged as a learning arc. OWASP LLM Top 10, MITRE ATLAS, NIST AI RMF, red-teaming your own agents. This arc turns 'security-first' from a claim into credentials.",
    capstone:"A public red-team report on your own production agents + SecAI+ and CAISP certs. The only AI practitioner in the room with both AI and security creds."
  },
  {
    id:'rag',
    title:'The RAG & Data Arc',
    lane:'Knowledge layer · vector DBs · retrieval',
    accent:'#a78bfa',
    iconBg:'rgba(167,139,250,0.12)',
    icon:'ti-database',
    load:'MED',
    cert:'No official cert — artifact-based',
    horizon:'12 mo',
    why:"Every agent you've built retrieves information somehow. Most of that retrieval is fragile. Embeddings, chunking strategies, Supabase pgvector, reranking, hybrid search — this is the knowledge layer underneath all your other work. Without it, agent quality has a ceiling.",
    capstone:"A retrieval quality benchmark across three vector backends (Supabase pgvector, Pinecone, local) with a published chunking strategy guide."
  },
  {
    id:'n8n',
    title:'The n8n / Automation Arc',
    lane:'Workflow orchestration · Make · Zapier',
    accent:'#fb923c',
    iconBg:'rgba(251,146,60,0.12)',
    icon:'ti-circuit-switchboard',
    load:'LOW',
    cert:'n8n certification (exists)',
    horizon:'6–9 mo',
    why:"n8n is already in your stack and you already use it. This arc systematizes that usage — advanced patterns, error handling, async flows, multi-agent orchestration with n8n as the backbone. Makes your workflow work teachable and sellable.",
    capstone:"An n8n-first agent pipeline template library: 5 production-grade templates, each open-sourced and documented. The kind of thing that gets forked."
  },
  {
    id:'mcp',
    title:'The MCP Builder Arc',
    lane:'Developer ecosystem · server authorship',
    accent:'#c6f432',
    iconBg:'rgba(198,244,50,0.10)',
    icon:'ti-plug-connected',
    load:'MED',
    cert:'No cert — registry presence',
    horizon:'9 mo',
    why:"You've consumed 50+ MCP connectors. Authoring them is a different skill — and the market for well-designed MCP servers is early. This arc moves you from power user to ecosystem contributor, which directly strengthens the Partner Network and Community Ambassador positioning.",
    capstone:"5 published MCP servers in the Anthropic registry, each with a documented API design rationale. Your name appears in the ecosystem, not just your LinkedIn."
  },
  {
    id:'brand',
    title:'The Personal Brand Arc',
    lane:'LinkedIn · The Prompt · CLC · Ambassador',
    accent:'#38bdf8',
    iconBg:'rgba(56,189,248,0.10)',
    icon:'ti-speakerphone',
    load:'LOW',
    cert:'N/A — reach-based milestones',
    horizon:'12 mo',
    why:"You have all the raw material: production builds, teaching experience, The Prompt newsletter, CLC relationships, Ambassador application. What's missing is a consistent publishing cadence and a clear content architecture. This arc systematizes the brand work so it compounds instead of going in bursts.",
    capstone:"1,000 LinkedIn followers who follow you specifically for AI practitioner content. A published content calendar. The Prompt at 200+ internal subscribers. One speaking credit."
  },
  {
    id:'aiaas',
    title:'The AIaaS Business Arc',
    lane:'FlashFusion · service line · Intinc dept',
    accent:'#d4a843',
    iconBg:'rgba(212,168,67,0.10)',
    icon:'ti-building-store',
    load:'MED',
    cert:'N/A — revenue and org milestone',
    horizon:'12 mo',
    why:"Head of AIaaS is the stated destination. This arc is the business side of that: pricing, packaging, proposal templates, client delivery framework, and the internal pitch that gets the department formally created. Without it, the technical arcs are expertise without a container.",
    capstone:"AIaaS service line formally proposed and approved at Intinc. One external client engagement (even paid discovery). A service catalog with three SKUs and defined margins."
  },
  {
    id:'teaching',
    title:'The Teaching & Curriculum Arc',
    lane:'CLC pilot · 3-tier curriculum · instructor cred',
    accent:'#4ade80',
    iconBg:'rgba(74,222,128,0.10)',
    icon:'ti-school',
    load:'LOW',
    cert:'Possible teaching cert via CLC',
    horizon:'9 mo',
    why:"The three-tier curriculum in your playbook already exists as a concept. This arc builds the actual artifacts — slide decks, workbooks, exercises, facilitator guides — and delivers them at CLC and Intinc. The moment you hand someone a polished curriculum, the AIaaS pitch gets 10x easier.",
    capstone:"Three deliverable curriculum packages (non-tech 90 min, technical 3 hr, AI team 6 hr), each delivered at least once with documented outcomes. The CLC pilot closes the Community Ambassador loop."
  },
];

let active = null;

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = ARCS.map((a,i)=>`
    <div class="card${active===i?' active':''}" style="--accent-color:${a.accent}" data-i="${i}">
      <div class="card-top">
        <div class="card-icon" style="background:${a.iconBg}">
          <i class="ti ${a.icon}" style="font-size:16px;color:${a.accent}" aria-hidden="true"></i>
        </div>
        <div style="flex:1;min-width:0;">
          <div class="card-title">${a.title}</div>
          <div class="card-lane">${a.lane}</div>
        </div>
      </div>
      <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
      <div class="detail">
        <p class="why">${a.why}</p>
        <div class="capstone-label">Capstone output</div>
        <p class="capstone">${a.capstone}</p>
        <div class="meta-row">
          <span class="pill" style="background:rgba(100,100,100,0.1);color:var(--color-text-secondary);">Load: ${a.load}</span>
          <span class="pill" style="background:rgba(100,100,100,0.1);color:var(--color-text-secondary);">${a.horizon}</span>
          <span class="pill" style="background:${a.iconBg};color:${a.accent};">${a.cert}</span>
        </div>
        <button class="build-btn" onclick="buildArc(${i})">
          Build this arc <i class="ti ti-arrow-up-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('button')) return;
      const i=+el.dataset.i;
      active = active===i ? null : i;
      render();
    });
  });
}

function buildArc(i){
  const a = ARCS[i];
  sendPrompt(`Build ${a.title} — ${a.lane}`);
}

render();
</script>
