
<h2 class="sr-only">Anthropic Academy Certification Prep Kit — 15 courses, 85 practice questions, AI quiz generator, progress tracking</h2>
<style>

.app{font-family:var(--font-sans);color:var(--color-text-primary);padding:1rem 0;min-height:600px}

.nav button{padding:5px 12px;border-radius:var(--border-radius-md);font-size:13px;font-family:var(--font-sans);cursor:pointer;border:0.5px solid transparent;background:transparent;color:var(--color-text-secondary);transition:all 0.1s}
.nav button.active{background:var(--color-background-secondary);border-color:var(--color-border-secondary);color:var(--color-text-primary);font-weight:500}
.nav button:hover:not(.active){background:var(--color-background-secondary)}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:12px}
.metric-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:var(--border-radius-md);font-size:11px;font-family:var(--font-mono);font-weight:500}
.badge.success{background:var(--color-background-success);color:var(--color-text-success)}
.badge.warning{background:var(--color-background-warning);color:var(--color-text-warning)}
.badge.danger{background:var(--color-background-danger);color:var(--color-text-danger)}
.badge.info{background:var(--color-background-info);color:var(--color-text-info)}
.badge.neutral{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:1.25rem}
.course-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px;cursor:pointer;transition:all 0.1s}
.course-card:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary)}

.quiz-option{width:100%;padding:10px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;text-align:left;cursor:pointer;font-family:var(--font-sans);line-height:1.5;margin-bottom:8px;transition:all 0.1s}
.quiz-option:hover:not(:disabled){border-color:var(--color-border-secondary);background:var(--color-background-tertiary)}
.quiz-option.correct{border-color:var(--color-border-success)!important;background:var(--color-background-success)!important;color:var(--color-text-success)!important}

.concept-item{display:flex;gap:10px;padding:8px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);margin-bottom:6px;align-items:flex-start;font-size:13px;line-height:1.6}
.concept-num{font-family:var(--font-mono);font-size:11px;color:var(--color-text-info);min-width:18px;padding-top:2px}
.timer-bar{height:3px;border-radius:2px;transition:width 1s linear}
.score-big{font-size:48px;font-weight:500;font-family:var(--font-mono)}
label{font-size:13px;color:var(--color-text-secondary);display:block;margin-bottom:4px}
.link{color:var(--color-text-info);font-size:12px;font-family:var(--font-mono);text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.proof-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);margin-bottom:6px;font-size:13px}
</style>

<script>
const {useState,useEffect,useCallback,useRef}=React;

const BASE="https://anthropic.skilljar.com";
const COURSES=[
  {id:"cc-action",n:"Claude Code in Action",wsjf:1,ov:"high",track:"Dev",diff:"Intermediate",hrs:"4-5",url:`${BASE}/claude-code-in-action`,
   desc:"Hooks, headless mode, parallel sessions, Plan mode, PR workflow.",
   concepts:["CLAUDE.md = project-level persistent system prompt for the codebase","Plan mode = read-only analysis — zero file modification, safe exploration","Hooks fire on lifecycle events: PreToolUse, PostToolUse, Stop, SessionStart, UserPromptSubmit","Headless mode = programmatic CLI usage via stdin/flags — powers CI/CD and bots","Git worktrees enable parallel Claude Code sessions on different branches simultaneously","PR workflow: Claude creates branch, commits changes, writes PR description — all from natural language","VS Code extension: inline editing at cursor + chat sidebar with open-file context","Slash commands: /fix /test /review /commit — built-in + custom commands via .claude/commands/"]},
  {id:"claude-101",n:"Claude 101",wsjf:2,ov:"high",track:"Foundations",diff:"Beginner",hrs:"1-2",url:`${BASE}/claude-101`,
   desc:"Plans, artifacts, memory, projects, connectors, file handling.",
   concepts:["Plans: Free → Pro ($20/mo) → Max → Team → Enterprise — gated features at each tier","Projects (Pro+): custom instructions + knowledge file pinning + isolated memory namespace","Memory: auto-generated from conversations; edit/add/delete in Settings > Memory","Artifacts: React/HTML/JS/Markdown/Mermaid/SVG — persistent storage on Pro+","Web Search: all plans; Deep Research mode for multi-step investigation","File creation: docx, pptx, xlsx, PDF, HTML, SVG, Markdown","Extended thinking: visible reasoning; configurable budget; billed as output tokens","Connectors: 50+ MCP integrations; custom MCP server URLs on Pro+; Desktop Extensions"]},
  {id:"intro-cowork",n:"Introduction to Claude Cowork",wsjf:3,ov:"high",track:"Dev",diff:"Beginner",hrs:"2-3",url:`${BASE}/introduction-to-claude-cowork`,
   desc:"Task loop, steering, skills, plugins, file workflows.",
   concepts:["Cowork = Claude works on your ACTUAL files and projects (not just generating text)","Task loop: Assign → Claude works on files → Review output → Steer → Repeat","Steering = mid-task feedback to redirect without aborting and restarting","Skills = SKILL.md packages Claude auto-applies to matching task contexts","Plugins = MCP server connectors extending Claude's access to external services","Research mode: Claude searches, reads URLs, synthesizes across sources","Multi-step tasks: Claude maintains context across sequential file operations"]},
  {id:"agent-skills",n:"Introduction to Agent Skills",wsjf:4,ov:"high",track:"Dev",diff:"Intermediate",hrs:"3-4",url:`${BASE}/introduction-to-agent-skills`,
   desc:"SKILL.md authoring, triggers, gerund naming, distribution.",
   concepts:["Gerund naming is spec-required: 'generating-docs' not 'generate-docs' or 'doc-generator'","Trigger phrases in description = activation mechanism — dense and specific wins","YAML frontmatter: name (gerund), description (trigger-rich), version","500-line soft limit — skills over this are doing too much; split them","Progressive disclosure: basic guidance first, advanced patterns deeper in file","Skills = portable/shareable; CLAUDE.md = project-specific and non-distributable","Distribution: zip package → marketplace or direct Claude Code CLI install"]},
  {id:"subagents",n:"Introduction to Subagents",wsjf:5,ov:"high",track:"Dev",diff:"Intermediate",hrs:"3-4",url:`${BASE}/introduction-to-subagents`,
   desc:"Task tool, context isolation, delegation patterns.",
   concepts:["Subagents = specialized Claude Code instances handling isolated tasks","Task tool = mechanism for spawning and invoking subagents from the main agent","Context isolation: each subagent starts with a CLEAN, empty context","Design principle: one subagent per task type — narrow specialization wins","Parallel execution via Git worktrees — independent session per branch","vs slash commands: subagents = isolated context; slash = inline same context","Use cases: code-review-agent, test-writer-agent, docs-agent, data-analysis-agent"]},
  {id:"intro-mcp",n:"Introduction to Model Context Protocol",wsjf:6,ov:"high",track:"Dev",diff:"Intermediate",hrs:"4-5",url:`${BASE}/introduction-to-model-context-protocol`,
   desc:"Three primitives, FastMCP, transport, initialization.",
   concepts:["MCP = open standard for connecting AI to external tools (created by Anthropic)","'USB-C for AI': one protocol, any AI model to any compliant tool server","Three primitives: Tools (actions), Resources (data sources), Prompts (templates)","Tools: callable functions with typed JSON Schema params; Claude decides when to call","Resources: URI-addressed data sources — file://, db://, custom schemes","Prompts: server-defined workflow templates for common interactions","Transport: HTTP POST (client→server) + SSE (server→client)","FastMCP: @mcp.tool(), @mcp.resource(), @mcp.prompt() decorators","Init = capability negotiation: client + server agree on supported features"]},
  {id:"mcp-adv",n:"MCP: Advanced Topics",wsjf:7,ov:"medium",track:"Dev",diff:"Advanced",hrs:"5-6",url:`${BASE}/model-context-protocol-advanced-topics`,
   desc:"Sampling, notifications, roots, transports, production security.",
   concepts:["Sampling = server requests model completions FROM the client (inverted flow)","Sampling enables server-side AI logic without the server needing its own API key","Notifications = server→client push for real-time state, progress, events","Roots = client declares accessible filesystem paths (explicit security boundary)","WebSockets = bidirectional real-time transport vs SSE polling","stdio transport = subprocess communication for Claude Desktop Extensions","Prompt injection via tool results = primary MCP attack vector — validate all outputs","Production: input validation + rate limiting + auth at tool-call granularity"]},
  {id:"api",n:"Building with the Claude API",wsjf:8,ov:"high",track:"Dev",diff:"Intermediate",hrs:"5-6",url:`${BASE}/claude-with-the-anthropic-api`,
   desc:"Messages API, tools, streaming, caching, batch, structured outputs.",
   concepts:["Core endpoint: POST /v1/messages — required: model, max_tokens, messages[]","Streaming: stream:true returns SSE text_delta events as tokens generate","Tool use: JSON Schema definitions; Claude calls when relevant; you execute + return results","Prompt caching: cache_control on static prefixes — reduces cost + latency for repeated calls","Batch API: async delivery, 50% cost reduction vs real-time","Structured outputs: guaranteed JSON schema compliance — eliminates parsing errors","Vision: images as base64 or URL in content array alongside text blocks","Files API: upload once → reference by file_id across all subsequent calls","Citations API: character-level references to exact passages in provided documents","Context window: 200K tokens standard; messages array = conversation history"]},
  {id:"ai-fluency",n:"AI Fluency: Framework & Foundations",wsjf:9,ov:"medium",track:"Foundations",diff:"Beginner",hrs:"3-4",url:`${BASE}/ai-fluency-framework-foundations`,
   desc:"4D framework, responsible AI collaboration, oversight, privacy.",
   concepts:["AI Fluency = ability to work with AI effectively, efficiently, ethically, and safely","4D Framework = structured methodology for consistent AI collaboration (verify Ds in actual course)","Hallucination = AI generating confident but factually incorrect information — always verify","Prompt specificity: Claude follows instructions literally — vague in, vague out","Data privacy: PII + confidential data require verified platform handling policies before input","Appropriate oversight = humans review AI outputs before acting on them","Course co-developed with Univ. College Cork + Ringling College; Creative Commons license","Higher Ed Advisory Board chaired by Rick Levin (former Yale president, former Coursera CEO)"]},
  {id:"bedrock",n:"Claude with Amazon Bedrock",wsjf:10,ov:"medium",track:"Enterprise",diff:"Intermediate",hrs:"4-5",url:`${BASE}/claude-in-amazon-bedrock`,
   desc:"VPC deployment, Guardrails, Knowledge Bases, Agents, IAM.",
   concepts:["Primary advantage: data stays in your AWS VPC — uses existing AWS security + IAM","IAM permission: bedrock:InvokeModel on specific model ARN","Guardrails = infrastructure-level content filtering (PII, topics, harmful content)","Knowledge Bases = managed RAG: Bedrock handles embedding, vector storage, retrieval","Bedrock Agents = managed multi-step orchestration with tool routing + memory","Same per-token pricing as direct API; billed to your AWS account"]},
  {id:"vertex",n:"Claude with Google Cloud's Vertex AI",wsjf:11,ov:"medium",track:"Enterprise",diff:"Intermediate",hrs:"4-5",url:`${BASE}/claude-with-google-vertex`,
   desc:"Model Garden, IAM auth, Grounding, prompt management, data residency.",
   concepts:["Vertex AI Model Garden = GCP's hub for accessing and deploying Claude","Auth: GCP IAM — service accounts or Workload Identity Federation (no Anthropic key needed)","Grounding = connect Claude to Google Search or your data stores for factual accuracy","Prompt management: store, version, share templates as versioned GCP resources","Data residency: GCP region selection controls where data is processed + stored","Batch predictions: async large-scale inference via Vertex batch jobs"]},
  {id:"edu",n:"AI Fluency for Educators",wsjf:12,ov:"medium",track:"Foundations",diff:"Intermediate",hrs:"3-4",url:`${BASE}/ai-fluency-for-educators`,
   desc:"Teaching with AI, curriculum integration, assessment strategies.",
   concepts:["Target: faculty + instructional designers — applying AI in YOUR OWN teaching","Key distinction: this = use AI yourself; Teaching AI Fluency = train others to teach it","Core challenge: assessing authentic student understanding vs AI-generated output","Sequence: instructor fluency → co-creation with students → student-directed use","Academic integrity: design assignments that verify learning, not just output production"]},
  {id:"teach",n:"Teaching AI Fluency",wsjf:13,ov:"medium",track:"Foundations",diff:"Advanced",hrs:"4-5",url:`${BASE}/teaching-ai-fluency`,
   desc:"Train-the-trainer: assessment design, observable fluency, facilitation.",
   concepts:["Target: instructors who will TRAIN OTHERS in AI fluency (train-the-trainer)","Prerequisites: AI Fluency Foundation + AI Fluency for Educators recommended first","Observable AI fluency: behavioral indicators — tool selection, critical evaluation, transparency","Portfolio-based assessment: captures process + reflection + applied performance","Creative Commons materials: any institution can freely adapt this curriculum","Instructor must demonstrate personal AI fluency before training others"]},
  {id:"students",n:"AI Fluency for Students",wsjf:14,ov:"low",track:"Foundations",diff:"Beginner",hrs:"2-3",url:`${BASE}/ai-fluency-for-students`,
   desc:"Academic integrity, fact verification, career planning.",
   concepts:["AI as amplifier: use AI to think better — not to replace your thinking","Academic integrity: disclose AI use per institutional policies","Fact verification: cross-reference AI claims against authoritative sources — AI can be confidently wrong","Career framing: AI fluency = professional differentiator in most fields"]},
  {id:"nonprofits",n:"AI Fluency for Nonprofits",wsjf:15,ov:"low",track:"Foundations",diff:"Beginner",hrs:"2-3",url:`${BASE}/ai-fluency-for-nonprofits`,
   desc:"Mission alignment, capacity building, beneficiary data ethics.",
   concepts:["Primary framing: time savings = more capacity for mission-critical work (not revenue)","Use cases: grant writing, donor comms, program reporting, volunteer coordination","Mission alignment: AI should serve organizational values, not just save time","Key ethical concern: beneficiary data privacy and bias in programs serving vulnerable populations"]},
];

const Q=[
  {id:"cc1",c:"cc-action",q:"What does Plan mode do in Claude Code?",o:["Creates a deployment roadmap","Reads + analyzes the codebase without modifying any files","Generates a project plan document","Runs tests without code changes"],a:1,x:"Plan mode = safe exploration. Claude reads and reasons about your codebase to understand scope, but writes nothing. Use before committing to changes."},
  {id:"cc2",c:"cc-action",q:"What is CLAUDE.md?",o:["A changelog for model versions","A project-level instruction file — the persistent system prompt for the codebase","A CLI configuration file","An API key vault"],a:1,x:"CLAUDE.md at project root gives Claude Code persistent context: conventions, architecture patterns, test requirements, forbidden operations. Equivalent to a system prompt for the codebase."},
  {id:"cc3",c:"cc-action",q:"Claude Code Hooks — what are they?",o:["GitHub webhook endpoints","Event-driven automation on lifecycle events: PreToolUse, PostToolUse, Stop, SessionStart","CSS hooks","API callbacks"],a:1,x:"Hooks fire on lifecycle events. PreToolUse = before tool runs (use for approval/blocking). PostToolUse = after execution. Stop = when Claude finishes. Inject logic without modifying prompts."},
  {id:"cc4",c:"cc-action",q:"What does headless mode enable?",o:["Reduced model capabilities","Lower memory usage","Programmatic CLI usage via stdin/flags — no interactive terminal — enables CI/CD and bots","Offline operation"],a:2,x:"Headless = Claude Code as a programmable component. Pipe instructions via stdin, control with flags. Powers GitHub Actions, CI/CD automation, bot workflows — no human at the terminal needed."},
  {id:"cc5",c:"cc-action",q:"Git worktrees in Claude Code — primary use case?",o:["Storing Claude's memory","Running parallel Claude Code sessions on different branches simultaneously","Managing binary assets","Repository backup"],a:1,x:"Worktrees create separate checked-out directories per branch. Each runs its own independent Claude Code session — true parallelism. Multiple agents on different features at the same time."},
  {id:"cc6",c:"cc-action",q:"Which hook fires BEFORE a tool executes?",o:["PostToolUse","ToolInit","PreToolUse","ToolComplete"],a:2,x:"PreToolUse fires before execution — use for validation, approval gates, logging, or blocking. If you want to intercept and prevent a specific tool call, PreToolUse is where you do it."},
  {id:"cc7",c:"cc-action",q:"How does Claude Code create pull requests?",o:["Requires manual git steps","Creates draft PRs only","Generates branch, commits, writes PR description — all from natural language","Needs a separate GitHub Actions step"],a:2,x:"Full PR workflow from one instruction: Claude creates the branch, makes targeted file changes, writes commit messages, and generates a PR description summarizing the changes."},
  {id:"cc8",c:"cc-action",q:"What does the VS Code extension add?",o:["More powerful models","Inline editing at cursor + chat sidebar with open-file context + native diff view","Cloud sync","Template library"],a:1,x:"Extension brings Claude Code into your editor flow: inline code edits at cursor, a sidebar chat that reads your open files, diffs in VS Code's diff viewer. No terminal switching required."},
  {id:"c1a",c:"claude-101",q:"Minimum plan required for Projects?",o:["Free","Pro","Team","Enterprise"],a:1,x:"Projects require Pro or above. Free plan supports conversations only — no persistent projects with custom instructions and knowledge file pinning."},
  {id:"c1b",c:"claude-101",q:"How does Memory work in Claude.ai?",o:["Only within one conversation","Auto-generated from past conversations; user-editable in Settings > Memory","Users write all entries manually","Enterprise only"],a:1,x:"Memory is background-generated from your conversation history. You can view, edit, add, or delete entries in Settings > Memory. Deleting conversations removes their derived memory nightly."},
  {id:"c1c",c:"claude-101",q:"Memory vs. Projects — key difference?",o:["Same thing","Memory = cross-conversation preferences; Projects = organized workspaces with isolated instructions + knowledge + memory","Projects store files; Memory stores notes","Memory is free; Projects are paid"],a:1,x:"Memory = facts about you across all conversations. Projects = isolated workspaces with their own custom instructions, pinned knowledge files, and separate memory namespace."},
  {id:"c1d",c:"claude-101",q:"Which file type can Claude NOT create?",o:["Word .docx documents","PowerPoint .pptx files","AI-generated images from text descriptions","Excel .xlsx spreadsheets"],a:2,x:"Claude can analyze images but cannot generate AI images. File creation capabilities include docx, pptx, xlsx, pdf, html, svg, markdown — but not AI image generation."},
  {id:"c1e",c:"claude-101",q:"How is Extended Thinking billed?",o:["Flat monthly add-on","Input tokens","Output tokens — thinking budget consumes output token quota","Free for Pro users"],a:2,x:"Extended thinking tokens are billed at output token rates. You set a thinking budget (max tokens for reasoning), and the thinking process consumes that output quota."},
  {id:"c1f",c:"claude-101",q:"What do Connectors provide?",o:["Faster responses","One-click MCP-based integrations to 50+ external services — not read-only, Claude can take actions","Fine-tuning on your data","Advanced analytics"],a:1,x:"Connectors = curated MCP integrations directory (50+ services). Each user authenticates independently. Claude can read, search, create, and take actions in Notion, GitHub, Slack, Stripe, and more."},
  {id:"c1g",c:"claude-101",q:"Artifact types Claude can create?",o:["Text documents only","React/HTML/JS, Markdown, Mermaid, SVG, data visualizations","Images and video","Python only"],a:1,x:"Artifact types: code (React, HTML, JS, Python), documents (Markdown), diagrams (Mermaid), SVG graphics, interactive data visualizations (Recharts, D3, Plotly, Three.js, etc.)."},
  {id:"cw1",c:"intro-cowork",q:"Core difference between Cowork and a regular conversation?",o:["Speed","Cowork operates on actual files — not just generating text for you to paste manually","Model power","Plan requirement"],a:1,x:"Cowork is file-level work: Claude reads, writes, and edits your actual project files. It's not producing text for you to apply manually — it's working directly with your file system."},
  {id:"cw2",c:"intro-cowork",q:"What is 'steering' in a Cowork task?",o:["Switching AI models","Providing mid-task feedback to adjust direction without restarting from scratch","Manually editing Claude's output","Running background automation"],a:1,x:"Steering = guidance during execution. While Claude runs a multi-step task, you can redirect, clarify scope, or add constraints without aborting and starting over."},
  {id:"cw3",c:"intro-cowork",q:"What are Cowork Plugins?",o:["Browser extensions","MCP server connectors extending Claude's access to external services","Prompt templates","Third-party AI models"],a:1,x:"Plugins = MCP server connectors. They extend what Claude can access during Cowork tasks: read/write Notion, query GitHub, update Slack — as part of file-level work."},
  {id:"cw4",c:"intro-cowork",q:"Cowork task loop flow?",o:["Prompt → Response → Done","Assign task → Claude works on files → Review → Steer → Repeat until done","Upload → Process → Download","Write → Test → Deploy"],a:1,x:"Iterative loop: assign task on real files → Claude executes → review output → steer if needed → repeat. Multiple cycles are expected and normal. Continues until the task meets your standard."},
  {id:"cw5",c:"intro-cowork",q:"What are Skills in Cowork?",o:["Pre-trained models","SKILL.md packages Claude auto-applies when it detects a matching task context","Purchased credits","Keyboard shortcuts"],a:1,x:"Skills = SKILL.md instruction packages that activate automatically on task context match. They encode expertise and transfer across all projects. The skill tells Claude how to approach a specific task type."},
  {id:"as1",c:"agent-skills",q:"Required naming format for Skills?",o:["PascalCase","snake_case","Gerund: 'generating-docs' not 'generate-docs'","Imperative"],a:2,x:"Gerund naming is a spec requirement: 'generating-docs', 'debugging-typescript', 'reviewing-prs'. Makes trigger phrases more natural and activation more reliable. This is not optional style."},
  {id:"as2",c:"agent-skills",q:"What triggers a Skill to activate?",o:["Active file extension","Time-based schedule","Trigger phrases in the skill's description matching current task context","User explicitly invoking by name"],a:2,x:"Trigger phrase density in the description controls activation. Dense, specific phrases give reliable activation. Vague descriptions = unreliable activation. The description IS the activation mechanism."},
  {id:"as3",c:"agent-skills",q:"Purpose of the 500-line soft limit?",o:["Skills can't process files longer than 500 lines","Keep SKILL.md under 500 lines — over that means it's doing too much; split it","Skills time out at 500 lines","Maximum 500 skills installable"],a:1,x:"500 lines = too much scope for one skill. If it's growing beyond this, split into two targeted skills with distinct trigger patterns. Focused skills activate more reliably."},
  {id:"as4",c:"agent-skills",q:"What is in SKILL.md frontmatter?",o:["API keys","Full instruction content","YAML: name (gerund), description (trigger-rich), version","Trigger phrase list only"],a:2,x:"Frontmatter YAML: name (gerund format), description (with dense trigger phrases), version. Machine-readable metadata. Claude reads this to determine activation context."},
  {id:"as5",c:"agent-skills",q:"Skills vs. CLAUDE.md — key difference?",o:["Identical purpose","Skills = portable/shareable packages; CLAUDE.md = project-specific, non-distributable","CLAUDE.md is for skills","Skills affect only one project"],a:1,x:"CLAUDE.md lives in your repo, scoped to that codebase. Skills are portable packages installable across any project and shareable with any team via zip/marketplace."},
  {id:"as6",c:"agent-skills",q:"What is progressive disclosure in SKILL.md?",o:["Unlocking premium features","Basic guidance first, advanced patterns deeper in the file","Gradual permission grants","Incremental file loading"],a:1,x:"Structure the skill so basic use cases are handled at the top, advanced edge cases further down. One skill serves both simple and complex invocations through this layered structure."},
  {id:"as7",c:"agent-skills",q:"How are Skills distributed to a team?",o:["Anthropic marketplace only","Email attachment","Zip package → marketplace or direct CLI install","Manual copy into each repo"],a:2,x:"Skills are zipped packages. Share via team marketplace, direct URL, or file transfer. Install via Claude Code CLI. One install per user — works across all their projects."},
  {id:"sa1",c:"subagents",q:"Core problem subagents solve?",o:["API cost reduction","Context window management + task specialization — keeps main agent focused","Network latency","File permissions"],a:1,x:"Complex tasks fill the main agent's context with accumulated details. Subagents handle isolated subtasks in clean contexts, preventing bloat and enabling the main agent to orchestrate at a higher level."},
  {id:"sa2",c:"subagents",q:"What is the Task tool?",o:["Project management feature","The mechanism for spawning and invoking subagents","A to-do list","GitHub Issues integration"],a:1,x:"Task tool = subagent invocation API. Main agent calls it with a defined task, the subagent executes with isolated context, and returns results."},
  {id:"sa3",c:"subagents",q:"What does context isolation mean for subagents?",o:["Sandboxed network","Each subagent starts with a clean context — no main conversation history inherited","No filesystem access","Encrypted comms"],a:1,x:"Each subagent gets a fresh, empty context. It sees only what you give it for its specific task. Prevents context confusion and enables clean specialization."},
  {id:"sa4",c:"subagents",q:"Design principle for subagent specialization?",o:["One subagent for everything","One per task type — narrow, well-defined specialization","Max 3 per project","As general as possible"],a:1,x:"Narrow specialization: a 'code-review-agent' optimized for reviews outperforms a generalist. Narrow scope → focused capabilities → better outputs for that specific task type."},
  {id:"sa5",c:"subagents",q:"How does parallel subagent execution work?",o:["Multiple API keys required","Git worktrees allow concurrent Claude Code sessions on different branches","Sequential only","Enterprise plan required"],a:1,x:"Git worktrees create separate directory check-outs per branch. Each runs its own independent Claude Code session — true parallelism. Multiple agents working simultaneously."},
  {id:"m1",c:"intro-mcp",q:"What does 'USB-C for AI' mean for MCP?",o:["USB hardware requirement","One universal protocol — any AI connects to any MCP tool server","Claude-only standard","Physical cable required"],a:1,x:"USB-C standardized hardware connections. MCP standardizes AI-to-tool connections: one protocol, any compliant AI to any compliant tool. No custom integration per pair."},
  {id:"m2",c:"intro-mcp",q:"MCP's three core primitives?",o:["Read, Write, Execute","Connect, Process, Return","Tools, Resources, Prompts","Input, Transform, Output"],a:2,x:"Tools = actions Claude can invoke. Resources = data sources Claude reads (URI-addressed). Prompts = predefined workflow templates the server exposes. Three distinct types of AI-tool integration."},
  {id:"m3",c:"intro-mcp",q:"What is an MCP Tool?",o:["Paid Anthropic add-on","Callable function with typed JSON Schema params — Claude decides when to invoke","Pre-built prompt library","Runtime config"],a:1,x:"Tool = function definition: name, description, typed params. Claude reads the description to understand when to call it. You execute the actual operation and return the result."},
  {id:"m4",c:"intro-mcp",q:"Standard MCP transport?",o:["WebSockets only","gRPC","HTTP POST (client→server) + SSE (server→client)","GraphQL subscriptions"],a:2,x:"Standard: HTTP POST for Claude calling tools, SSE for server streaming back. Deployable on any HTTP server — no special infrastructure required."},
  {id:"m5",c:"intro-mcp",q:"Python library for building MCP servers?",o:["langchain-mcp","anthropic-tools","FastMCP with @mcp.tool() @mcp.resource() @mcp.prompt() decorators","flask-ai"],a:2,x:"FastMCP uses Python decorators: annotate a function with @mcp.tool() and it's registered as an MCP Tool. Minimal boilerplate — the decorator handles all protocol-level details."},
  {id:"m6",c:"intro-mcp",q:"What is an MCP Resource?",o:["Billing unit","URI-addressed data source Claude can read (file://, db://, custom schemes)","Pricing tier","Cached response"],a:1,x:"Resources are URI-addressed data sources: file:///path/doc.txt, db://table/record, custom://api/endpoint. Anything the server can expose for Claude to read."},
  {id:"m7",c:"intro-mcp",q:"What is capability negotiation in MCP?",o:["API key validation","Initial handshake where client + server agree on supported feature intersection","Billing agreement","Rate limit setup"],a:1,x:"During init, client declares supported capabilities, server does the same. They agree to use the intersection. Neither side tries to use features the other doesn't support."},
  {id:"m8",c:"intro-mcp",q:"What is an MCP Prompt?",o:["System prompt for Claude","Predefined workflow template the server exposes for common interactions","Pricing tier","Model configuration"],a:1,x:"MCP Prompts = server-defined workflow templates. Named, parameterized interaction patterns clients can invoke: /summarize-doc, /generate-tests, /analyze-metrics. Server-provided slash commands."},
  {id:"ma1",c:"mcp-adv",q:"What is MCP Sampling?",o:["Rate limiting","Server requests model completions FROM the client — inverted flow","Caching mechanism","Load balancing"],a:1,x:"Sampling inverts the direction: MCP server requests AI inference from the client's model. Enables server-side AI logic without the server needing its own API key."},
  {id:"ma2",c:"mcp-adv",q:"What are MCP Notifications?",o:["Email alerts","Server→client push for real-time state changes, progress, events","Billing alerts","Error logs"],a:1,x:"Notifications = server-initiated push messages. 'Task 45% complete', 'new resource available', 'job finished'. No polling. Enables responsive real-time UX in MCP-based applications."},
  {id:"ma3",c:"mcp-adv",q:"What does the 'roots' capability provide?",o:["Root server access","Client declares accessible filesystem paths — explicit security boundary","Admin permissions","URL config"],a:1,x:"Roots = client-declared filesystem boundaries. The client tells the server which paths it's allowed to access. Server can't operate outside declared roots."},
  {id:"ma4",c:"mcp-adv",q:"Transport enabling bidirectional real-time MCP?",o:["HTTP long polling","FTP","WebSockets","REST callbacks"],a:2,x:"WebSockets = full-duplex, any-time messaging from either side without polling. Needed for high-frequency notifications and interactive real-time state management."},
  {id:"ma5",c:"mcp-adv",q:"Primary MCP security vulnerability?",o:["SQL injection","Prompt injection via tool results — malicious tool output designed to hijack model behavior","CORS violations","JWT expiration"],a:1,x:"Prompt injection via tool results: a compromised tool returns content designed to change Claude's behavior or extract info. Validate and sanitize all tool outputs."},
  {id:"ma6",c:"mcp-adv",q:"Transport used by Claude Desktop Extensions?",o:["HTTP/SSE","WebSockets","stdio — subprocess communication via stdin/stdout","gRPC"],a:2,x:"Desktop Extensions use stdio: each runs as a local subprocess. Claude Desktop spawns it, communicates via stdin/stdout. Local tools with no network infrastructure required."},
  {id:"api1",c:"api",q:"Core Claude API endpoint?",o:["POST /v1/completions","GET /v1/chat","POST /v1/messages","POST /v1/generate"],a:2,x:"POST /v1/messages — required: model, max_tokens, messages[]. The messages array of {role, content} objects maintains conversation history for multi-turn."},
  {id:"api2",c:"api",q:"How does streaming work?",o:["WebSocket connection","Polling /v1/stream","Set stream:true — API returns SSE text_delta events","Special HTTP header"],a:2,x:"stream:true switches from JSON response to SSE stream of events. Both Python (async for) and TypeScript (for await of) SDKs support native stream iteration."},
  {id:"api3",c:"api",q:"What does Prompt Caching do?",o:["Stores prompts in database","Marks static prefixes with cache_control — reuses computation, reducing cost + latency","Pre-loads model weights","Saves conversation history"],a:1,x:"cache_control on static sections (system prompt, docs, examples) tells Claude to cache that computation. Repeated calls with the same cached prefix are cheaper and faster."},
  {id:"api4",c:"api",q:"Batch API cost advantage?",o:["10%","25%","50% reduction vs real-time","Free for Enterprise"],a:2,x:"50% cost reduction for async delivery. Trade-off: results arrive when processed, not immediately. Best for offline workloads, evaluations, bulk content generation."},
  {id:"api5",c:"api",q:"What are Structured Outputs?",o:["Formatted console logs","Guaranteed JSON schema compliance — response will match the schema you specify","HTML templates","Markdown rules"],a:1,x:"Structured Outputs = schema guarantee. Specify a JSON Schema, Claude's response conforms to it exactly. Eliminates parsing errors and schema validation failures in data pipelines."},
  {id:"api6",c:"api",q:"Files API benefit?",o:["Streaming large uploads","Upload once → reference by file_id across calls without re-sending bytes","Shared storage between users","Version control"],a:1,x:"file_id persists across calls. Upload a PDF once, use its ID in any subsequent API call. No re-encoding, no re-sending. Reduces bandwidth, latency, and token overhead."},
  {id:"api7",c:"api",q:"How are images passed to the API?",o:["URL query params","Separate image endpoint","Base64 or URL in content array alongside text blocks","HTTP multipart form"],a:2,x:"Images go in the content array as image blocks: {type:'image', source:{type:'base64',...}} or type:'url'. Mix text and image blocks in the same message."},
  {id:"api8",c:"api",q:"What does tool_choice:'any' do?",o:["Claude can optionally use tools","Disables all tools","Claude MUST use at least one of the provided tools","Claude must call all tools"],a:2,x:"tool_choice:'any' forces at least one tool call. 'auto' = Claude decides. 'none' = no tools. {type:'tool',name:'X'} = must call X specifically. Use 'any' for guaranteed extraction."},
  {id:"api9",c:"api",q:"Standard Claude context window?",o:["32K","128K","200K","500K"],a:2,x:"200K tokens standard — approximately 150K words or 500 pages. Some models in beta for 1M token contexts. Available across all API access tiers."},
  {id:"api10",c:"api",q:"What does the Citations API return?",o:["Web source URLs","APA bibliography entries","Character-level offsets pointing to exact passages in documents you provided","Numbered footnotes"],a:2,x:"Character-level references into your provided documents — not web URLs. Points to exact spans in content you passed in context. For RAG apps needing auditable source attribution."},
  {id:"af1",c:"ai-fluency",q:"What is AI Fluency?",o:["Expertise in building AI systems","Ability to work with AI effectively, efficiently, ethically, and safely","Achieving benchmark scores","Managing AI infrastructure"],a:1,x:"4 dimensions: Effective (desired outputs), Efficient (minimal unnecessary iterations), Ethical (appropriate use + privacy), Safe (appropriate human oversight). All four required for true fluency."},
  {id:"af2",c:"ai-fluency",q:"Why does prompt specificity matter?",o:["Reduces API costs","Claude follows instructions literally — vague input, vague output","Faster responses","Prevents hallucination entirely"],a:1,x:"Claude is instruction-following by design. Vague prompts force Claude to fill gaps with its own judgment, which may not match intent. Specificity + context + constraints = predictable, better outputs."},
  {id:"af3",c:"ai-fluency",q:"What is hallucination in LLMs?",o:["AI infinite loop","Generating confident but factually incorrect information","Misunderstood command","Unexpectedly long responses"],a:1,x:"Structural property of LLMs: probabilistic generation can produce confident, well-structured, completely false information. Means human verification is always required before acting on AI output."},
  {id:"af4",c:"ai-fluency",q:"Data you should NOT input without verifying platform policies?",o:["Meeting notes","Public website content","PII and confidential business data","Your own code"],a:2,x:"PII and confidential data require verified data handling policies. Check: data residency, retention, training on your data, GDPR compliance. Don't assume cloud = safe."},
  {id:"af5",c:"ai-fluency",q:"Who chairs the Higher Ed Advisory Board?",o:["Sam Altman","Jensen Huang","Rick Levin (former Yale president, former Coursera CEO)","Bill Gates"],a:2,x:"Rick Levin's appointment signals Anthropic is building Academy as educational infrastructure — he ran one of the largest online education platforms on the planet. Not a marketing stunt."},
  {id:"af6",c:"ai-fluency",q:"License for AI Fluency course materials?",o:["All rights reserved","MIT License","Creative Commons — freely adaptable by any institution","Commercial only"],a:2,x:"Creative Commons. Any institution can adapt and use the materials freely. Anthropic explicitly wants widespread AI fluency education — the open license is intentional infrastructure strategy."},
  {id:"bk1",c:"bedrock",q:"Primary enterprise advantage of Bedrock?",o:["Lower per-token cost","Larger context windows","Data stays in your AWS VPC — uses existing AWS security + IAM","Faster responses"],a:2,x:"Data residency in your AWS infrastructure. Existing security posture, compliance frameworks, and IAM all apply. For enterprises with strict data governance, this is the deciding factor."},
  {id:"bk2",c:"bedrock",q:"Required IAM permission for Claude on Bedrock?",o:["iam:GetRole","s3:GetObject","bedrock:InvokeModel on the specific model ARN","ec2:RunInstances"],a:2,x:"bedrock:InvokeModel (or ...WithResponseStream for streaming) on the Claude model ARN. Least-privilege: grant only the specific model ARNs your application actually uses."},
  {id:"bk3",c:"bedrock",q:"What are Bedrock Guardrails?",o:["AWS network firewall","Infrastructure-level content filtering (PII, topics, harmful content) — independent of prompting","API rate limits","Encryption settings"],a:1,x:"Guardrails = infrastructure-layer policy enforcement. Applied to inputs and outputs based on rules you configure (PII detection, topic blocking) — regardless of what your prompts say."},
  {id:"bk4",c:"bedrock",q:"What are Bedrock Knowledge Bases?",o:["AWS documentation","Managed RAG: Bedrock handles embedding, vector storage, and retrieval for your private docs","Employee handbooks","Prompt libraries"],a:1,x:"Knowledge Bases = managed RAG pipeline. Bedrock ingests your documents, embeds them, stores in vector DB, exposes retrieval API. Claude gets relevant context without you building RAG infrastructure."},
  {id:"bk5",c:"bedrock",q:"Bedrock pricing vs. direct Anthropic API?",o:["Always cheaper","Always more expensive","Same per-token pricing; billing goes to your AWS account","Flat monthly subscription"],a:2,x:"Same per-token model pricing. Difference is billing (AWS account vs Anthropic account) and the managed infrastructure wrapper. No markup on tokens."},
  {id:"bk6",c:"bedrock",q:"What are Bedrock Agents?",o:["Human oversight agents","Managed multi-step orchestration with tool routing + memory + knowledge base integration","Lambda aliases","Cost dashboards"],a:1,x:"Bedrock Agents = managed agentic layer. Define action groups (tools), connect knowledge bases, Bedrock handles orchestration: Claude reasons → routes tool calls → results return → loop continues."},
  {id:"vx1",c:"vertex",q:"What is the Vertex AI Model Garden?",o:["Garden-themed demo","GCP's hub for accessing and deploying foundation models including Claude","AI training data marketplace","Visual prompt builder"],a:1,x:"Model Garden = GCP's unified catalog for foundation models. Find Claude, configure deployment, get API endpoints, manage model versions — all in one place."},
  {id:"vx2",c:"vertex",q:"Authentication for Claude on Vertex AI?",o:["Anthropic API key","Username/password","GCP IAM — service accounts or Workload Identity Federation","GitHub OAuth"],a:2,x:"GCP IAM. Service accounts (JSON key) or Workload Identity Federation (for GKE/Cloud Run). No separate Anthropic API key — GCP handles auth through its own IAM system."},
  {id:"vx3",c:"vertex",q:"What is Grounding in Vertex AI?",o:["Model training on your data","Fine-tuning","Connect Claude to Google Search or your data stores for factual accuracy","Output encryption"],a:2,x:"Grounding connects responses to authoritative sources: Google Search (current web info) or your own Vertex AI data stores (private document grounding). Reduces hallucination."},
  {id:"vx4",c:"vertex",q:"Data residency advantage of Vertex AI?",o:["Always US-only","No controls exist","GCP region selection ensures data processing stays within geographic boundaries","Always global network"],a:2,x:"Select a GCP region (europe-west1, us-east1, etc.) and data processing + storage stays within that region's boundaries. Critical for GDPR and data sovereignty compliance."},
  {id:"vx5",c:"vertex",q:"What is Vertex AI prompt management?",o:["Auto-optimizing prompts","Store, version, share prompt templates with API deployment — team collaboration feature","Grammar validation","Encryption at rest"],a:1,x:"Prompt templates stored as versioned GCP resources. Test in console, deploy as API endpoints, share across teams. Prompt governance = version control + team collaboration for prompts."},
  {id:"edu1",c:"edu",q:"AI Fluency for Educators vs. Teaching AI Fluency — difference?",o:["Identical content","For Educators = apply AI in YOUR teaching; Teaching = train others to teach it","Difficulty difference only","Grade level difference"],a:1,x:"Critical distinction: For Educators = you use AI in your teaching practice. Teaching AI Fluency = you train other instructors to teach it. Take 'For Educators' before 'Teaching.'"},
  {id:"edu2",c:"edu",q:"Core AI challenge for academic assessment?",o:["AI grading unreliable","Distinguishing AI-generated outputs from authentic student understanding","AI tools too expensive","Students won't use AI"],a:1,x:"Assessment integrity: traditional assignments completable by AI without student understanding. Need assessments that verify learning, not just output production."},
  {id:"edu3",c:"edu",q:"Recommended AI curriculum integration sequence?",o:["All at once","Students first","Instructor fluency → co-creation with students → student-directed use","Ban first, permit gradually"],a:2,x:"Instructor fluency must precede student guidance. Can't guide what you haven't practiced. Build your own AI practice first, then design AI-collaborative assignments, then enable student-directed use."},
  {id:"taf1",c:"teach",q:"Prerequisites for Teaching AI Fluency?",o:["None","Building with the Claude API","AI Fluency Foundation + AI Fluency for Educators","Just this course"],a:2,x:"You must have personal AI fluency before teaching it. Path: Foundation → For Educators → Teaching AI Fluency. Demonstrate your own practice before training others."},
  {id:"taf2",c:"teach",q:"What is observable AI fluency?",o:["AI benchmark scores","Number of tools used","Behavioral indicators: appropriate tool selection, critical evaluation, transparent use","Task completion speed"],a:2,x:"Observable = behavioral. Can you see them choosing appropriate tools? Critically evaluating outputs? Maintaining oversight? These behaviors are assessable; knowledge recall tests don't capture actual fluency."},
  {id:"taf3",c:"teach",q:"Recommended assessment method for AI fluency?",o:["Multiple choice only","Timed coding challenges","Portfolio: process documentation, reflection, applied performance evidence","Peer-graded essays"],a:2,x:"Portfolio captures what tests miss: process of AI collaboration decisions, critical thinking about outputs, and applied performance across real tasks. How fluency actually manifests in practice."},
  {id:"taf4",c:"teach",q:"License for Anthropic Academy AI Fluency materials?",o:["All rights reserved","MIT License","Creative Commons — any institution can freely adapt them","Commercial only"],a:2,x:"Creative Commons. Any institution can adapt the curriculum freely. Anthropic wants widespread AI fluency education — the open license is intentional infrastructure strategy."},
  {id:"stu1",c:"students",q:"Core ethical principle for AI in academic work?",o:["Hide AI use","Use AI to think better, not outsource thinking; disclose per institutional policy","AI can write everything if reviewed","Research only, not writing"],a:1,x:"AI as amplifier: use it to think faster, iterate better, research broader — but understanding, analysis, and authentic voice are yours. Disclose according to your institution's policies."},
  {id:"stu2",c:"students",q:"How should students treat AI-generated facts?",o:["Trust — usually accurate","Ignore — unreliable","Cross-reference against authoritative sources — AI can be confidently wrong","Use for opinions only"],a:2,x:"AI generates plausible text, not verified facts. For any specific factual claim, verify against primary sources, peer-reviewed research, or authoritative databases. Especially for graded work."},
  {id:"npo1",c:"nonprofits",q:"Primary ROI framing for AI at nonprofits?",o:["Revenue from new services","Staff time savings → more capacity for mission-critical work","Technology prestige","Grant eligibility"],a:1,x:"Nonprofit AI ROI = capacity, not profit. Hours freed from operational overhead = more direct program delivery, beneficiary interaction, mission-driven work. Frame as mission amplification."},
  {id:"npo2",c:"nonprofits",q:"Unique ethical concern for nonprofit AI?",o:["No ethics concerns","Beneficiary data privacy, donor trust, potential bias in programs serving vulnerable populations","All nonprofit AI is ethical by definition","Government nonprofits only"],a:1,x:"Nonprofits often serve vulnerable populations. AI processing beneficiary data or informing program decisions requires heightened review: privacy protection, bias detection, maintaining trust of donors and beneficiaries."},
];

const ovBadge=(ov)=>ov==="high"?"success":ov==="medium"?"warning":"neutral";
const diffBadge=(d)=>d==="Advanced"?"danger":d==="Intermediate"?"warning":"info";
const trackBadge=(t)=>t==="Dev"?"info":t==="Enterprise"?"warning":"neutral";

function App(){
  const [mode,setMode]=useState("dash");
  const [progress,setProgress]=useState({});
  const [proofLog,setProofLog]=useState([]);
  const [genQs,setGenQs]=useState([]);
  const [studyCourse,setStudyCourse]=useState(null);
  const [quizState,setQuizState]=useState(null);
  const [speedState,setSpeedState]=useState(null);
  const [speedTimer,setSpeedTimer]=useState(10);
  const timerRef=useRef(null);
  const [genTopic,setGenTopic]=useState("");
  const [genCid,setGenCid]=useState("");
  const [genLoading,setGenLoading]=useState(false);
  const [genOutput,setGenOutput]=useState([]);

  useEffect(()=>{
    (async()=>{
      try{
        const s=await window.storage.get("aa-prep-v2");
        if(s?.value){const d=JSON.parse(s.value);setProgress(d.p||{});setProofLog(d.pl||[]);setGenQs(d.gq||[]);}
      }catch{}
    })();
  },[]);

  const save=useCallback(async(p,pl,gq)=>{
    try{await window.storage.set("aa-prep-v2",JSON.stringify({p,pl,gq}));}catch{}
  },[]);

  const setStatus=(cid,st)=>{
    const next={...progress,[cid]:st};
    setProgress(next);
    save(next,proofLog,genQs);
  };

  const allQs=[...Q,...genQs];
  const completed=COURSES.filter(c=>progress[c.id]==="done").length;
  const inProg=COURSES.filter(c=>progress[c.id]==="wip").length;

  const startQuiz=(cid=null)=>{
    const pool=(cid?allQs.filter(q=>q.c===cid):[...allQs]).sort(()=>Math.random()-0.5).slice(0,Math.min(10,allQs.filter(q=>!cid||q.c===cid).length||allQs.length));
    if(!pool.length)return;
    setQuizState({pool,idx:0,answered:null,correct:0,done:false,cid});
    setMode("quiz");
  };

  const answerQ=(idx)=>{
    if(!quizState||quizState.answered!==null)return;
    const correct=idx===quizState.pool[quizState.idx].a;
    setQuizState(s=>({...s,answered:idx,correct:s.correct+(correct?1:0)}));
  };

  const nextQ=()=>{
    if(!quizState)return;
    const nextIdx=quizState.idx+1;
    if(nextIdx>=quizState.pool.length){setQuizState(s=>({...s,done:true}));}
    else{setQuizState(s=>({...s,idx:nextIdx,answered:null}));}
  };

  const startSpeed=(cid=null)=>{
    const pool=(cid?allQs.filter(q=>q.c===cid):[...allQs]).sort(()=>Math.random()-0.5).slice(0,Math.min(15,allQs.length));
    if(!pool.length)return;
    setSpeedState({pool,idx:0,wrong:[],done:false,cid});
    setSpeedTimer(10);
    setMode("speed");
  };

  useEffect(()=>{
    if(mode!=="speed"||!speedState||speedState.done)return;
    if(timerRef.current)clearInterval(timerRef.current);
    setSpeedTimer(10);
    timerRef.current=setInterval(()=>{
      setSpeedTimer(t=>{
        if(t<=1){
          setSpeedState(s=>{
            if(!s||s.done)return s;
            const wrong=[...s.wrong,s.pool[s.idx]];
            const nextIdx=s.idx+1;
            if(nextIdx>=s.pool.length)return{...s,wrong,done:true};
            return{...s,idx:nextIdx,wrong};
          });
          return 10;
        }
        return t-1;
      });
    },1000);
    return()=>clearInterval(timerRef.current);
  },[speedState?.idx,mode]);

  const answerSpeed=(aIdx)=>{
    if(!speedState||speedState.done)return;
    clearInterval(timerRef.current);
    const q=speedState.pool[speedState.idx];
    const correct=aIdx===q.a;
    const wrong=correct?speedState.wrong:[...speedState.wrong,q];
    const nextIdx=speedState.idx+1;
    if(nextIdx>=speedState.pool.length){setSpeedState({...speedState,wrong,done:true});}
    else{setSpeedState({...speedState,idx:nextIdx,wrong});setSpeedTimer(10);}
  };

  const generateQs=async()=>{
    if(!genTopic.trim())return;
    setGenLoading(true);setGenOutput([]);
    try{
      const cn=genCid?COURSES.find(c=>c.id===genCid)?.n||genCid:"Anthropic Academy (all courses)";
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1500,
        messages:[{role:"user",content:`You are an exam prep assistant for Anthropic Academy certifications.\n\nCourse: ${cn}\nTopic: ${genTopic}\n\nGenerate 5 exam-quality multiple-choice questions. Focus on practical application, common misconceptions, and specific details — not just definitions.\n\nReturn ONLY a JSON array, no markdown, no preamble:\n[{"q":"question","o":["A","B","C","D"],"a":0,"x":"explanation of correct answer"}]\n\n"a" = 0-indexed correct answer. Make distractors plausible.`}]
      })});
      const data=await res.json();
      const text=data.content?.[0]?.text||"[]";
      const parsed=JSON.parse(text.replace(/\`\`\`json|\`\`\`/g,"").trim());
      setGenOutput(parsed.map((q,i)=>({...q,id:`gen_${Date.now()}_${i}`,c:genCid||"all"})));
    }catch(e){setGenOutput([{q:"Error generating questions. Please try again.",o:["Retry"],a:0,x:String(e),id:"err",c:"all"}]);}
    setGenLoading(false);
  };

  const saveGenQs=()=>{
    const next=[...genQs,...genOutput];
    setGenQs(next);save(progress,proofLog,next);
    alert(`${genOutput.length} questions saved to your quiz bank.`);
    setGenOutput([]);
  };

  const logCert=(cid)=>{
    const course=COURSES.find(c=>c.id===cid);
    if(!course)return;
    const next=[...proofLog,{cid,name:course.n,date:new Date().toLocaleDateString(),wsjf:course.wsjf}];
    setProofLog(next);save(progress,next,genQs);
    setMode("proof");
  };

  const MODES=[{k:"dash",label:"Dashboard",icon:"ti-home"},{k:"study",label:"Study",icon:"ti-book"},{k:"quiz",label:"Quiz",icon:"ti-brain"},{k:"speed",label:"Speed run",icon:"ti-bolt"},{k:"ai",label:"AI generator",icon:"ti-sparkles"},{k:"proof",label:"Proof log",icon:"ti-certificate"}];

  const renderDash=()=>{
    const queue=[...COURSES].filter(c=>progress[c.id]!=="done").slice(0,8);
    return React.createElement("div",null,
      React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:16}},
        [{l:"Completed",v:`${completed}/${COURSES.length}`,cls:"success"},{l:"In progress",v:inProg,cls:"warning"},{l:"Quiz pool",v:allQs.length,cls:"info"},{l:"Total hours",v:`~${COURSES.reduce((s,c)=>s+parseInt(c.hrs),0)}h`,cls:"neutral"}].map((m,i)=>
          React.createElement("div",{key:i,className:"metric-card"},
            React.createElement("div",{style:{fontSize:11,color:"var(--color-text-secondary)",fontFamily:"var(--font-mono)",marginBottom:4}},[m.l.toUpperCase()]),
            React.createElement("div",{style:{fontSize:24,fontWeight:500,color:`var(--color-text-${m.cls==="neutral"?"primary":m.cls})`}},m.v)
          )
        )
      ),
      React.createElement("div",{className:"card"},
        React.createElement("div",{style:{fontSize:12,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",marginBottom:12}},`WSJF study queue — ${COURSES.filter(c=>progress[c.id]!=="done").length} remaining`),
        queue.map(c=>
          React.createElement("div",{key:c.id,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}},
            React.createElement("div",null,
              React.createElement("span",{style:{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",marginRight:8}},`#${c.wsjf}`),
              React.createElement("span",{style:{fontSize:13}},[c.n]),
              React.createElement("span",{style:{marginLeft:8}},React.createElement("span",{className:`badge ${ovBadge(c.ov)}`},c.ov)),
              React.createElement("span",{style:{marginLeft:4}},React.createElement("span",{className:`badge ${trackBadge(c.track)}`},c.track))
            ),
            React.createElement("div",{style:{display:"flex",gap:6}},
              React.createElement("button",{onClick:()=>{setStudyCourse(c.id);setMode("study");}},React.createElement("i",{className:"ti ti-book",style:{fontSize:14}})),
              React.createElement("button",{onClick:()=>startQuiz(c.id)},React.createElement("i",{className:"ti ti-brain",style:{fontSize:14}}))
            )
          )
        )
      ),
      React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        React.createElement("div",{className:"card"},
