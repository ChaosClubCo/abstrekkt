<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio Command Center</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efec;
    --text: #1a1a18; --text2: #6b6b67; --text3: #9b9b96;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --success-bg: #f0fdf4; --success: #15803d; --success-border: #bbf7d0;
    --warn-bg: #fefce8; --warn: #854d0e; --warn-border: #fef08a;
    --danger-bg: #fef2f2; --danger: #dc2626; --danger-border: #fecaca;
    --orange-bg: #fff7ed; --orange: #9a3412; --orange-border: #fed7aa;
    --radius: 8px; --radius-lg: 12px;
    --mono: 'Courier New', monospace; --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --bg2: #1a1a18; --bg3: #222220;
      --text: #e8e8e3; --text2: #9b9b96; --text3: #6b6b67;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
    }
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); padding: 20px; }
  h1 { font-size: 18px; font-weight: 500; }
  .sub { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .sync-btn { background: var(--text); color: var(--bg); border: none; border-radius: var(--radius); padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: var(--sans); }
  .sync-btn:hover { opacity: 0.8; }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .metric { background: var(--bg2); border-radius: var(--radius); padding: 14px 16px; }
  .metric-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .metric-val { font-size: 22px; font-weight: 500; }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input[type=text] { border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 7px 12px; font-size: 13px; background: var(--bg); color: var(--text); min-width: 160px; outline: none; font-family: var(--sans); }
  input[type=text]:focus { border-color: var(--text2); }
  select { border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 7px 10px; font-size: 13px; background: var(--bg); color: var(--text); outline: none; font-family: var(--sans); cursor: pointer; }
  .clear-btn { font-size: 13px; color: var(--text2); background: none; border: none; cursor: pointer; padding: 0 4px; }
  .shown { font-size: 12px; color: var(--text3); margin-left: auto; }
  .table-wrap { border: 0.5px solid var(--border2); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 16px; }
  .tbl-hdr { display: grid; padding: 8px 16px; background: var(--bg2); border-bottom: 0.5px solid var(--border); grid-template-columns: 1fr 108px 74px 130px 70px 50px; }
  .tbl-hdr button { border: none; background: none; cursor: pointer; font-family: var(--sans); color: var(--text2); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; padding: 0; }
  .tbl-hdr button:hover { color: var(--text); }
  .tbl-hdr span { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text2); }
  .row-btn { display: grid; width: 100%; text-align: left; padding: 10px 16px; border: none; background: none; cursor: pointer; align-items: center; border-bottom: 0.5px solid var(--border); transition: background 0.1s; grid-template-columns: 1fr 108px 74px 130px 70px 50px; font-family: var(--sans); }
  .row-btn:hover { background: var(--bg2); }
  .row-btn.sel { background: var(--bg2); }
  .row-btn:last-child { border-bottom: none; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 500; white-space: nowrap; line-height: 1.6; }
  .hbar-wrap { display: flex; align-items: center; gap: 6px; }
  .hbar-track { flex: 1; background: var(--bg3); border-radius: 99px; height: 5px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 99px; }
  .hbar-num { font-size: 11px; font-family: var(--mono); font-weight: 600; min-width: 22px; text-align: right; }
  .empty { padding: 32px; text-align: center; font-size: 13px; color: var(--text3); }
  .detail { border-top: 0.5px solid var(--border); background: var(--bg2); padding: 14px 16px; display: none; }
  .detail.open { display: block; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .detail-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; }
  .detail-card-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
  .health-score { font-size: 36px; font-weight: 500; font-family: var(--mono); margin-bottom: 10px; }
  .bk-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
  .bk-label { color: var(--text2); }
  .bk-pos { color: #15803d; }
  .bk-neg { color: #dc2626; }
  .bk-neu { color: var(--text3); }
  .audit-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
  .audit-dot { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; font-weight: 600; }
  .meta-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .meta-label { color: var(--text2); }
  .dist-section { border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px; }
  .dist-section-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text2); margin-bottom: 12px; }
  .dist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .dist-row { display: flex; align-items: center; gap: 8px; }
  .dist-name { font-size: 11px; color: var(--text2); width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dist-track { flex: 1; background: var(--bg3); border-radius: 99px; height: 4px; overflow: hidden; }
  .dist-fill { height: 100%; background: var(--text2); border-radius: 99px; }
  .dist-count { font-size: 11px; color: var(--text); width: 16px; text-align: right; flex-shrink: 0; }
  .webhook { background: var(--bg2); border-radius: var(--radius); padding: 10px 14px; }
  .webhook-url { font-size: 11px; font-family: var(--mono); color: var(--text3); }
  a { color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  @media (max-width: 700px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .detail-grid { grid-template-columns: 1fr; }
    .dist-grid { grid-template-columns: 1fr; }
    .tbl-hdr, .row-btn { grid-template-columns: 1fr 80px 60px 100px 60px 40px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Portfolio Command Center</h1>
    <p class="sub" id="sub-line">25 projects · n8n webhook · Apr 14 2026</p>
  </div>
  <button class="sync-btn" onclick="alert('Webhook: POST https://krosebrook.app.n8n.cloud/webhook/portfolio-sync')">Sync info</button>
</div>

<div class="metrics" id="metrics"></div>

<div class="filters">
  <input type="text" id="search" placeholder="Search projects..." oninput="render()" />
  <select id="platform-filter" onchange="render()"><option value="all">All platforms</option></select>
  <select id="status-filter" onchange="render()"><option value="all">All statuses</option></select>
  <button class="clear-btn" id="clear-btn" onclick="clearFilters()" style="display:none">Clear ×</button>
  <span class="shown" id="shown-count"></span>
</div>

<div class="table-wrap">
  <div class="tbl-hdr">
    <button onclick="toggleSort('name')">project <span id="sort-name"></span></button>
    <span>platform</span>
    <span>status</span>
    <button onclick="toggleSort('health')">health <span id="sort-health"></span></button>
    <button onclick="toggleSort('activity')">activity <span id="sort-activity"></span></button>
    <button onclick="toggleSort('bv')">BV <span id="sort-bv"></span></button>
  </div>
  <div id="project-list"></div>
</div>

<div class="dist-section">
  <div class="dist-section-label">Platform distribution</div>
  <div class="dist-grid" id="dist-grid"></div>
</div>

<div class="webhook">
  <span class="webhook-url">POST https://krosebrook.app.n8n.cloud/webhook/portfolio-sync</span>
</div>

<script>
const PROJECTS = [
  {id:"flashfusion",name:"FlashFusion",platform:"Base44",status:"Active",lastActivity:"2026-04-14",techDebt:2,businessValue:5,monthlyCost:25,repo:"https://github.com/ChaosClubCo/FlashFusion-Unified",auditChecks:{hasAuth:true,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},

  {id:"continuum",name:"Continuum",platform:"Vercel",status:"Active",lastActivity:"2026-03-23",techDebt:2,businessValue:4,monthlyCost:0,repo:"https://github.com/Krosebrook/continuum",auditChecks:{hasAuth:true,hasRLS:true,hasObservability:false,hasTests:true,hasCICD:true}},
  {id:"vibe-coding-workshop",name:"Vibe Coding Workshop",platform:"Vercel",status:"Active",lastActivity:"2026-04-14",techDebt:1,businessValue:3,monthlyCost:0,auditChecks:{hasAuth:false,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},
  {id:"skydda-sentinel",name:"Skydda AI Sentinel",platform:"Vercel",status:"Active",lastActivity:"2026-03-18",techDebt:1,businessValue:4,monthlyCost:0,auditChecks:{hasAuth:false,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},
  {id:"bedtime-chronicles",name:"Bedtime Chronicles",platform:"Vercel",status:"Active",lastActivity:"2026-04-14",techDebt:1,businessValue:3,monthlyCost:0,auditChecks:{hasAuth:false,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},
  {id:"agentk",name:"AgentK",platform:"Vercel",status:"Active",lastActivity:"2026-03-15",techDebt:2,businessValue:4,monthlyCost:0,auditChecks:{hasAuth:true,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},
  {id:"kidcreator",name:"KidCreator / StoryWeaver",platform:"Vercel",status:"Active",lastActivity:"2025-11-01",techDebt:1,businessValue:3,monthlyCost:0,repo:"https://github.com/ChaosClubCo/kidcreator",auditChecks:{hasAuth:false,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},
  {id:"flashnframe",name:"FlashNFrame",platform:"Vercel",status:"Archived",lastActivity:"2025-06-01",techDebt:1,businessValue:2,monthlyCost:0,repo:"https://github.com/ChaosClubCo/flashnframe",auditChecks:{hasAuth:true,hasRLS:false,hasObservability:false,hasTests:true,hasCICD:true}},

  {id:"lovable-cortex",name:"cortex-second-brain",platform:"Lovable",status:"Active",lastActivity:"2026-04-09",techDebt:1,businessValue:4,monthlyCost:0,auditChecks:{hasAuth:false,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},

  {id:"portfolio-command-center",name:"Portfolio Command Center",platform:"n8n",status:"Active",lastActivity:"2026-04-14",techDebt:1,businessValue:4,monthlyCost:0,auditChecks:{hasAuth:false,hasRLS:false,hasObservability:true,hasTests:false,hasCICD:false}},
  {id:"passive-income-scrapper",name:"PassiveIncome-Scrapper",platform:"n8n",status:"Inactive",lastActivity:"2026-03-20",techDebt:2,businessValue:3,monthlyCost:0,auditChecks:{hasAuth:false,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},
  {id:"kinsleys-world",name:"Kinsley's World (AI Studio)",platform:"Google AI Studio",status:"Active",lastActivity:"2026-03-09",techDebt:1,businessValue:3,monthlyCost:0,auditChecks:{hasAuth:false,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},
  {id:"chaos-club-book1",name:"Chaos Club Book 1 (BTTBS)",platform:"Document",status:"Active",lastActivity:"2026-03-24",techDebt:1,businessValue:4,monthlyCost:0,auditChecks:{hasAuth:false,hasRLS:false,hasObservability:false,hasTests:false,hasCICD:false}},
];

const PLATFORM_BADGE = {
  "Base44":{bg:"#ede9fe",c:"#5b21b6"},"Vercel":{bg:"#f1f5f9",c:"#334155"},
  "GitHub":{bg:"#f3f4f6",c:"#374151"},"Lovable":{bg:"#fce7f3",c:"#9d174d"},
  "n8n":{bg:"#d1fae5",c:"#065f46"},"WordPress":{bg:"#dbeafe",c:"#1e40af"},
  "Google AI Studio":{bg:"#fef3c7",c:"#92400e"},"Document":{bg:"#dcfce7",c:"#14532d"},
};
const STATUS_BADGE = {
  "Active":{bg:"#f0fdf4",c:"#15803d"},"Inactive":{bg:"#fefce8",c:"#854d0e"},
  "Archived":{bg:"#f3f4f6",c:"#6b7280"},"Stale":{bg:"#fff7ed",c:"#9a3412"},"Blocked":{bg:"#fef2f2",c:"#dc2626"},
};
const AUDIT_LABELS = {hasAuth:"Auth",hasRLS:"RLS",hasObservability:"Observability",hasTests:"Tests",hasCICD:"CI/CD"};

function calcHealth(p) {
  const days = p.lastActivity ? Math.floor((Date.now() - new Date(p.lastActivity)) / 86400000) : 999;
  let s = 100;
  if (days > 180) s -= 40; else if (days > 90) s -= 25; else if (days > 30) s -= 10;
  s -= ((p.techDebt||3) - 1) * 8;
  if (p.status === "Blocked") s -= 20;
  if (p.status === "Archived" || p.status === "Sunset") s -= 30;
  s += ((p.businessValue||3) - 3) * 5;
  s += Object.values(p.auditChecks||{}).filter(Boolean).length * 2;
  return Math.max(0, Math.min(100, Math.round(s)));
}
function hColor(s) {
  if (s >= 80) return {bar:"#22c55e",text:"#15803d",bg:"#f0fdf4",border:"#bbf7d0"};
  if (s >= 60) return {bar:"#eab308",text:"#854d0e",bg:"#fefce8",border:"#fef08a"};
  if (s >= 40) return {bar:"#f97316",text:"#9a3412",bg:"#fff7ed",border:"#fed7aa"};
  return {bar:"#ef4444",text:"#dc2626",bg:"#fef2f2",border:"#fecaca"};
}
function daysAgo(d) { return d ? Math.floor((Date.now() - new Date(d)) / 86400000) : 999; }
function relDate(d) {
  const n = daysAgo(d);
  if (n === 0) return "today"; if (n === 1) return "yesterday";
  if (n < 30) return n+"d ago"; if (n < 365) return Math.floor(n/30)+"mo ago";
  return Math.floor(n/365)+"yr ago";
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const projects = PROJECTS.map(p => ({...p, health: calcHealth(p)}));
let sortBy = "health", sortDir = "asc", selected = null;

function getFiltered() {
  const s = document.getElementById("search").value.toLowerCase();
  const pf = document.getElementById("platform-filter").value;
  const sf = document.getElementById("status-filter").value;
  let r = projects.filter(p => {
    if (s && !p.name.toLowerCase().includes(s)) return false;
    if (pf !== "all" && p.platform !== pf) return false;
    if (sf !== "all" && p.status !== sf) return false;
    return true;
  });
  r.sort((a,b) => {
    let c = 0;
    if (sortBy === "health") c = a.health - b.health;
    else if (sortBy === "name") c = a.name.localeCompare(b.name);
    else if (sortBy === "activity") c = new Date(b.lastActivity) - new Date(a.lastActivity);
    else if (sortBy === "bv") c = b.businessValue - a.businessValue;
    return sortDir === "asc" ? c : -c;
  });
  return r;
}

function renderMetrics() {
  const total = projects.length;
  const avg = Math.round(projects.reduce((s,p) => s+p.health, 0) / total);
  const critical = projects.filter(p => p.health < 40).length;
  const cost = projects.reduce((s,p) => s+p.monthlyCost, 0);
  const migration = projects.filter(p => p.platform === "Base44").length;
  const active = projects.filter(p => p.status === "Active").length;
  const hc = hColor(avg);
  document.getElementById("metrics").innerHTML = `
    <div class="metric"><div class="metric-label">total projects</div><div class="metric-val">${total}</div><div class="metric-sub">${active} active</div></div>
    <div class="metric"><div class="metric-label">avg health</div><div class="metric-val" style="color:${hc.text}">${avg}</div><div class="metric-sub">${critical} critical</div></div>
    <div class="metric"><div class="metric-label">monthly cost</div><div class="metric-val">$${cost}</div><div class="metric-sub">USD/month</div></div>
    <div class="metric"><div class="metric-label">migration needed</div><div class="metric-val">${migration}</div><div class="metric-sub">Base44 projects</div></div>`;
}

function renderDist() {
  const counts = {};
  PROJECTS.forEach(p => { counts[p.platform] = (counts[p.platform]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  document.getElementById("dist-grid").innerHTML = sorted.map(([plat,count]) => `
    <div class="dist-row">
      <span class="dist-name">${esc(plat)}</span>
      <div class="dist-track"><div class="dist-fill" style="width:${Math.round(count/PROJECTS.length*100)}%"></div></div>
      <span class="dist-count">${count}</span>
    </div>`).join("");
}

function renderSort() {
  ["name","health","activity","bv"].forEach(f => {
    const el = document.getElementById("sort-"+f);
    if (el) el.textContent = sortBy === f ? (sortDir === "asc" ? "↑" : "↓") : "";
  });
}

function renderDetail(p) {
  const days = daysAgo(p.lastActivity);
  const hc = hColor(p.health);
  const bk = [];
  if (days > 180) bk.push({l:"Stale >180d",d:-40});
  else if (days > 90) bk.push({l:"Stale >90d",d:-25});
  else if (days > 30) bk.push({l:"Stale >30d",d:-10});
  const dd = -((p.techDebt-1)*8); if (dd!==0) bk.push({l:"Debt "+p.techDebt+"/5",d:dd});
  if (p.status==="Blocked") bk.push({l:"Blocked",d:-20});
  if (p.status==="Archived"||p.status==="Sunset") bk.push({l:"Archived",d:-30});
  const bd = (p.businessValue-3)*5; if (bd!==0) bk.push({l:"BV "+p.businessValue+"/5",d:bd});
  const ap = Object.values(p.auditChecks||{}).filter(Boolean).length;
  if (ap>0) bk.push({l:"Audits "+ap+"/5",d:ap*2});

  const metaRows = [
    ["last active", p.lastActivity||"—"],
    ["days since", days+"d", days>90?"#dc2626":days>30?"#854d0e":"#15803d"],
    ["business value", p.businessValue+"/5"],
    ["tech debt", p.techDebt+"/5", p.techDebt>=4?"#dc2626":p.techDebt>=3?"#854d0e":null],
    ["monthly cost", "$"+p.monthlyCost],
    p.repo ? ["repo", `<a href="${esc(p.repo)}" target="_blank">GitHub ↗</a>`] : null,
  ].filter(Boolean);

  return `<div class="detail-grid">
    <div class="detail-card" style="border-color:${hc.border};background:${hc.bg}">
      <div class="detail-card-label">health score</div>
      <div class="health-score" style="color:${hc.text}">${p.health}</div>
      ${bk.map(b=>`<div class="bk-row"><span class="bk-label">${esc(b.l)}</span><span class="${b.d>0?"bk-pos":b.d<0?"bk-neg":"bk-neu"}">${b.d>0?"+"+b.d:b.d===0?"—":b.d}</span></div>`).join("")}
    </div>
    <div class="detail-card">
      <div class="detail-card-label">audit checklist</div>
      ${Object.entries(p.auditChecks||{}).map(([k,v])=>`
        <div class="audit-row">
          <div class="audit-dot" style="background:${v?"#dcfce7":"#f3f4f6"};color:${v?"#15803d":"#9b9b96"}">${v?"✓":"×"}</div>
          <span style="color:${v?"inherit":"#9b9b96"}">${AUDIT_LABELS[k]||k}</span>
        </div>`).join("")}
    </div>
    <div class="detail-card">
      <div class="detail-card-label">details</div>
      ${metaRows.map(([l,v,c])=>`<div class="meta-row"><span class="meta-label">${l}</span><span ${c?`style="color:${c}"`:""}>${v}</span></div>`).join("")}
    </div>
  </div>`;
}

function render() {
  const filtered = getFiltered();
  const s = document.getElementById("search").value;
  const pf = document.getElementById("platform-filter").value;
  const sf = document.getElementById("status-filter").value;
  const hasFilter = s || pf !== "all" || sf !== "all";
  document.getElementById("clear-btn").style.display = hasFilter ? "" : "none";
  document.getElementById("shown-count").textContent = filtered.length + " shown";
  renderSort();

  const list = document.getElementById("project-list");
  if (filtered.length === 0) { list.innerHTML = `<div class="empty">No projects match filters</div>`; return; }

  list.innerHTML = filtered.map((p,i) => {
    const hc = hColor(p.health);
    const pb = PLATFORM_BADGE[p.platform]||{bg:"#f3f4f6",c:"#374151"};
    const sb = STATUS_BADGE[p.status]||{bg:"#f3f4f6",c:"#6b7280"};
    const stars = "★".repeat(p.businessValue)+"☆".repeat(5-p.businessValue);
    const isSel = selected === p.id;
    return `<div>
      <button class="row-btn${isSel?" sel":""}" onclick="toggleSel('${p.id}')" style="${i===filtered.length-1&&!isSel?"border-bottom:none":""}">
        <div style="display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden">
          <span style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>
          ${p.monthlyCost>0?`<span style="font-size:11px;color:#9b9b96;flex-shrink:0">$${p.monthlyCost}</span>`:""}
        </div>
        <div><span class="badge" style="background:${pb.bg};color:${pb.c}">${esc(p.platform)}</span></div>
        <div><span class="badge" style="background:${sb.bg};color:${sb.c}">${esc(p.status)}</span></div>
        <div class="hbar-wrap">
          <div class="hbar-track"><div class="hbar-fill" style="width:${p.health}%;background:${hc.bar}"></div></div>
          <span class="hbar-num" style="color:${hc.text}">${p.health}</span>
        </div>
        <div style="font-size:12px;color:#6b7280">${relDate(p.lastActivity)}</div>
        <div style="font-size:11px;color:#9b9b96;letter-spacing:-1px">${stars}</div>
      </button>
      <div class="detail${isSel?" open":""}" id="detail-${p.id}">${isSel?renderDetail(p):""}</div>
    </div>`;
  }).join("");
}

function toggleSel(id) {
  selected = selected === id ? null : id;
  render();
}

function toggleSort(field) {
  if (sortBy === field) sortDir = sortDir === "asc" ? "desc" : "asc";
  else { sortBy = field; sortDir = field === "health" ? "asc" : "desc"; }
  render();
}

function clearFilters() {
  document.getElementById("search").value = "";
  document.getElementById("platform-filter").value = "all";
  document.getElementById("status-filter").value = "all";
  render();
}

function init() {
  const platforms = [...new Set(PROJECTS.map(p => p.platform))];
  const statuses = [...new Set(PROJECTS.map(p => p.status))];
  const pf = document.getElementById("platform-filter");
  const sf = document.getElementById("status-filter");
  platforms.forEach(p => { const o = document.createElement("option"); o.value = p; o.textContent = p; pf.appendChild(o); });
  statuses.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s; sf.appendChild(o); });
  renderMetrics();
  renderDist();
  render();
}

init();
</script>
</body>
</html>
