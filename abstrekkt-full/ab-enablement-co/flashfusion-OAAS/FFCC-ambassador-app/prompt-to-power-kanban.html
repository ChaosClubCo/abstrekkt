<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt to Power — Course Kanban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface-2: #1f1f24;
    --surface-3: #27272d;
    --border: rgba(255,255,255,0.08);
    --border-mid: rgba(255,255,255,0.14);
    --text: #e8e8ec;
    --text-2: #9898a8;
    --text-3: #5a5a6a;
    --blue: #4a9eff;
    --blue-bg: rgba(74,158,255,0.1);
    --green: #3fd68a;
    --green-bg: rgba(63,214,138,0.1);
    --amber: #f5a623;
    --amber-bg: rgba(245,166,35,0.1);
    --red: #ff6b6b;
    --red-bg: rgba(255,107,107,0.1);
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,0.1);
    --teal: #2dd4bf;
    --teal-bg: rgba(45,212,191,0.1);
    --accent: #4a9eff;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    padding: 20px 24px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #4a9eff 0%, #a78bfa 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: white;
    font-family: 'JetBrains Mono', monospace;
  }

  .title-block h1 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .title-block p {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 1px;
    font-family: 'JetBrains Mono', monospace;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border-mid);
    background: var(--surface-2);
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn:hover {
    background: var(--surface-3);
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }

  .btn-primary {
    background: rgba(74,158,255,0.15);
    border-color: rgba(74,158,255,0.35);
    color: var(--blue);
  }

  .btn-primary:hover {
    background: rgba(74,158,255,0.25);
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    padding: 12px 0;
  }

  .fg {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .fg-label {
    font-size: 11px;
    color: var(--text-3);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
    margin-right: 2px;
  }

  .fpill {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.12s;
  }

  .fpill:hover {
    border-color: var(--border-mid);
    color: var(--text-2);
  }

  .fpill.on {
    background: rgba(74,158,255,0.12);
    border-color: rgba(74,158,255,0.4);
    color: var(--blue);
  }

  /* ── STATS ── */
  .stat-bar {
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  .stat-item {
    font-size: 12px;
    color: var(--text-3);
  }

  .stat-item strong {
    font-weight: 600;
    color: var(--text-2);
    margin-right: 2px;
  }

  .stat-divider {
    width: 1px;
    height: 14px;
    background: var(--border);
  }

  /* ── BOARD ── */
  .board-wrap {
    padding: 20px 24px 40px;
    overflow-x: auto;
  }

  .board {
    display: flex;
    gap: 14px;
    min-width: max-content;
  }

  /* ── COLUMN ── */
  .col {
    width: 220px;
    flex-shrink: 0;
  }

  .col-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
  }

  .col-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.08em;
    font-family: 'JetBrains Mono', monospace;
  }

  .col-count {
    font-size: 10px;
    color: var(--text-3);
    background: var(--surface-3);
    border-radius: 99px;
    padding: 1px 7px;
    border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
  }

  /* special column colors */
  .col[data-col="design"] .col-head { border-color: rgba(74,158,255,0.25); }
  .col[data-col="design"] .col-label { color: var(--blue); }
  .col[data-col="live"] .col-head { border-color: rgba(63,214,138,0.25); }
  .col[data-col="live"] .col-label { color: var(--green); }
  .col[data-col="qa"] .col-head { border-color: rgba(245,166,35,0.25); }
  .col[data-col="qa"] .col-label { color: var(--amber); }

  /* ── CARDS ── */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 60px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: default;
    transition: border-color 0.15s;
  }

  .card:hover {
    border-color: var(--border-mid);
  }

  .card.hidden {
    display: none;
  }

  /* type accent on left edge */
  .card[data-type="MODULE"] { border-left: 2px solid rgba(74,158,255,0.5); }
  .card[data-type="CONTENT"] { border-left: 2px solid rgba(167,139,250,0.5); }
  .card[data-type="EXERCISE"] { border-left: 2px solid rgba(63,214,138,0.5); }
  .card[data-type="QA"] { border-left: 2px solid rgba(245,166,35,0.5); }

  .card-badges {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
    letter-spacing: 0.04em;
    font-family: 'JetBrains Mono', monospace;
  }

  .bm { background: var(--blue-bg); color: var(--blue); }
  .bc { background: var(--purple-bg); color: var(--purple); }
  .be { background: var(--green-bg); color: var(--green); }
  .bq { background: var(--amber-bg); color: var(--amber); }

  .bt1 { background: var(--red-bg); color: var(--red); }
  .bt2 { background: var(--blue-bg); color: var(--blue); }
  .bt3 { background: var(--teal-bg); color: var(--teal); }
  .ball { background: rgba(255,255,255,0.05); color: var(--text-3); }

  .bS { background: var(--green-bg); color: var(--green); }
  .bM { background: var(--blue-bg); color: var(--blue); }
  .bL { background: var(--purple-bg); color: var(--purple); }
  .bO { background: var(--amber-bg); color: var(--amber); }

  .card-id {
    font-size: 10px;
    color: var(--text-3);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 3px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 5px;
  }

  .card-desc {
    font-size: 11px;
    color: var(--text-3);
    line-height: 1.5;
  }

  .card-actions {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }

  .ca {
    font-size: 10px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.12s;
  }

  .ca:hover {
    background: var(--surface-2);
    color: var(--text-2);
    border-color: var(--border-mid);
  }

  /* ── NOTION EXPORT ── */
  .notion-panel {
    display: none;
    margin: 0 24px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .notion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  .notion-header span {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    font-family: 'JetBrains Mono', monospace;
  }

  .notion-body {
    padding: 16px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-3);
    white-space: pre-wrap;
    max-height: 320px;
    overflow-y: auto;
    line-height: 1.7;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }

  /* ── EMPTY STATE ── */
  .empty {
    padding: 24px 12px;
    text-align: center;
    font-size: 11px;
    color: var(--text-3);
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-mark">P2</div>
      <div class="title-block">
        <h1>Prompt to Power</h1>
        <p>Claude teaching course · Sprint 0 · 43 cards</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="toggleNotion()">Export for Notion</button>
      <button class="btn" onclick="sendPrompt('Help me design Module M01 in detail — What is Claude and why it matters — for all 3 tiers.')">↗ Deep dive a module</button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="fg">
      <span class="fg-label">TIER</span>
      <button class="fpill on" onclick="sf('tier','all',this)">All</button>
      <button class="fpill" onclick="sf('tier','T1',this)">T1 non-tech</button>
      <button class="fpill" onclick="sf('tier','T2',this)">T2 technical</button>
      <button class="fpill" onclick="sf('tier','T3',this)">T3 AI-native</button>
    </div>
    <div class="fg">
      <span class="fg-label">TRACK</span>
      <button class="fpill on" onclick="sf('track','all',this)">All</button>
      <button class="fpill" onclick="sf('track','S',this)">Short 1–2h</button>
      <button class="fpill" onclick="sf('track','M',this)">Medium 3–4h</button>
      <button class="fpill" onclick="sf('track','L',this)">Long 6–8h</button>
      <button class="fpill" onclick="sf('track','O',this)">Ongoing</button>
    </div>
    <div class="fg">
      <span class="fg-label">TYPE</span>
      <button class="fpill on" onclick="sf('type','all',this)">All</button>
      <button class="fpill" onclick="sf('type','MODULE',this)">Modules</button>
      <button class="fpill" onclick="sf('type','CONTENT',this)">Content</button>
      <button class="fpill" onclick="sf('type','EXERCISE',this)">Exercises</button>
      <button class="fpill" onclick="sf('type','QA',this)">QA gates</button>
    </div>
  </div>
</div>

<div class="stat-bar" id="stat-bar"></div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<div class="notion-panel" id="notion-panel">
  <div class="notion-header">
    <span>notion-paste-ready.md</span>
    <button class="btn" onclick="copyNotion()">Copy all</button>
  </div>
  <div class="notion-body" id="notion-body"></div>
</div>

<script>
const COLS = [
  {id:'backlog', n:'BACKLOG'},
  {id:'design',  n:'IN DESIGN'},
  {id:'draft',   n:'CONTENT DRAFT'},
  {id:'exbuild', n:'EXERCISE BUILD'},
  {id:'qa',      n:'QA REVIEW'},
  {id:'ready',   n:'READY'},
  {id:'live',    n:'LIVE'},
];

let cards = [
  {id:'M01',t:'What is Claude and why it matters',type:'MODULE',tier:'ALL',tr:'S',col:'design',d:'Orientation: capabilities, limits, use cases. Adapted per tier. Covers why Claude behaves the way it does.'},
  {id:'M02',t:'Writing prompts that actually work',type:'MODULE',tier:'ALL',tr:'S',col:'design',d:'Clarity, directness, the new-employee model. 5 common failure modes and how to fix each.'},
  {id:'M03',t:'Giving Claude a role and context',type:'MODULE',tier:'ALL',tr:'S',col:'design',d:'Role prompting, persona priming, system context framing. Immediate output quality uplift.'},
  {id:'M04',t:'Templates and reusable prompts',type:'MODULE',tier:'T2',tr:'M',col:'backlog',d:'Prompt templates with variable placeholders. Building a personal and team prompt library.'},
  {id:'M05',t:'Controlling output format',type:'MODULE',tier:'ALL',tr:'M',col:'backlog',d:'XML tags, JSON output, markdown, tables. Speaking for Claude. Structured vs free-form outputs.'},
  {id:'M06',t:'Making Claude think step by step',type:'MODULE',tier:'T2',tr:'M',col:'backlog',d:'Chain of thought, precognition, structured reasoning before answering. When it matters most.'},
  {id:'M07',t:'Teaching Claude with examples',type:'MODULE',tier:'T2',tr:'M',col:'backlog',d:'Few-shot prompting: when to use it, how many examples, positive and negative examples.'},
  {id:'M08',t:'Keeping Claude honest',type:'MODULE',tier:'T2',tr:'L',col:'backlog',d:'Hallucination types, reduction techniques, verification patterns. Prompting for uncertainty.'},
  {id:'M09',t:'Building complex prompts from scratch',type:'MODULE',tier:'T3',tr:'L',col:'backlog',d:'Guided structure for production prompts. Legal, finance, coding, chatbot use cases.'},
  {id:'M10',t:'Prompt chains and workflows',type:'MODULE',tier:'T3',tr:'O',col:'backlog',d:'Chaining outputs between prompts. Iterative refinement loops. Intro to agentic patterns.'},
  {id:'M11',t:'Tool use and function calling',type:'MODULE',tier:'T3',tr:'O',col:'backlog',d:'Giving Claude tools: calculator, DB queries, API calls. Tool use as structured output.'},
  {id:'M12',t:'Search, retrieval, and RAG basics',type:'MODULE',tier:'T3',tr:'O',col:'backlog',d:'Web search integration, Wikipedia retrieval, RAG pattern introduction for production.'},
  {id:'M13',t:'Monthly curriculum update (The Prompt)',type:'MODULE',tier:'ALL',tr:'O',col:'backlog',d:'Living curriculum. One new lesson each newsletter cycle. Course evolves with INT AI strategy.'},

  {id:'C01',t:'Facilitator guide: short track',type:'CONTENT',tier:'ALL',tr:'S',col:'design',d:'Run-of-show, timing, live demo scripts for M01–M03. Per-tier facilitation notes included.'},
  {id:'C02',t:'Slide deck: short track',type:'CONTENT',tier:'ALL',tr:'S',col:'design',d:'Presentation slides for M01–M03 with 3-tier callout variants for each key concept.'},
  {id:'C03',t:'Slide deck: medium track',type:'CONTENT',tier:'ALL',tr:'M',col:'backlog',d:'Extends short deck with M04–M07. Includes T2 technical detail sections.'},
  {id:'C04',t:'Slide deck: long track',type:'CONTENT',tier:'T3',tr:'L',col:'backlog',d:'Full-day deck M01–M09 with advanced sections and live build demonstrations.'},
  {id:'C05',t:'Participant workbook (all tiers)',type:'CONTENT',tier:'ALL',tr:'S',col:'backlog',d:'Fillable .docx workbook. Tier sections clearly marked. Includes reflection prompts and labs.'},
  {id:'C06',t:'T1 cheat sheet',type:'CONTENT',tier:'T1',tr:'S',col:'backlog',d:'1-pager: prompt anatomy, 5 key patterns, when to use Claude vs when not to.'},
  {id:'C07',t:'T2 reference card',type:'CONTENT',tier:'T2',tr:'M',col:'backlog',d:'Laminate-ready: formatting patterns, XML tags, role prompting, output control quick-ref.'},
  {id:'C08',t:'T3 deep reference',type:'CONTENT',tier:'T3',tr:'L',col:'backlog',d:'Full pattern library: chains, few-shot, RAG, tool use, hallucination control, evaluation.'},
  {id:'C09',t:'Interactive artifact: M01 sandbox',type:'CONTENT',tier:'ALL',tr:'S',col:'backlog',d:'Claude-powered in-chat artifact. Learner writes a prompt, Claude scores and explains.'},
  {id:'C10',t:'Interactive artifact: M02–M03',type:'CONTENT',tier:'ALL',tr:'S',col:'backlog',d:'Prompt challenge sandbox. Role toggle and clarity scoring in real-time.'},
  {id:'C11',t:'Newsletter ↔ course integration',type:'CONTENT',tier:'ALL',tr:'O',col:'backlog',d:'Each Prompt edition links to the relevant module. Reinforces course content weekly.'},
  {id:'C12',t:'Course landing page',type:'CONTENT',tier:'ALL',tr:'S',col:'backlog',d:'Track selector, module directory, progress tracking. Hosted in Notion or SharePoint.'},

  {id:'E01',t:'Lab: your first prompt',type:'EXERCISE',tier:'T1',tr:'S',col:'design',d:'T1 guided hands-on: use Claude to draft a real client email from a brief.'},
  {id:'E02',t:'Lab: fix this broken prompt',type:'EXERCISE',tier:'ALL',tr:'S',col:'design',d:'Show 3 deliberately broken prompts. Learner diagnoses failure, rewrites, Claude scores.'},
  {id:'E03',t:'Lab: role assignment sandbox',type:'EXERCISE',tier:'ALL',tr:'S',col:'design',d:'Toggle a role on/off live and observe the output difference. Builds intuition fast.'},
  {id:'E04',t:'Lab: template builder',type:'EXERCISE',tier:'T2',tr:'M',col:'backlog',d:'Learner builds a reusable prompt template for a real task they do weekly.'},
  {id:'E05',t:'Lab: format control challenge',type:'EXERCISE',tier:'T2',tr:'M',col:'backlog',d:'Get JSON output, then markdown, then a structured table — same input data each time.'},
  {id:'E06',t:'Lab: chain of thought puzzles',type:'EXERCISE',tier:'T2',tr:'M',col:'backlog',d:'3 logic puzzles. First with no reasoning prompt, then with step-by-step forced. Compare.'},
  {id:'E07',t:'Lab: few-shot training',type:'EXERCISE',tier:'T3',tr:'M',col:'backlog',d:'Build a few-shot example set from scratch. Measure and compare output quality before/after.'},
  {id:'E08',t:'Lab: hallucination detection',type:'EXERCISE',tier:'T2',tr:'L',col:'backlog',d:'Spot the hallucination in a Claude response. Apply mitigation prompt. Verify output.'},
  {id:'E09',t:'Lab: build a real-world prompt',type:'EXERCISE',tier:'T3',tr:'L',col:'backlog',d:'Learner builds a full production-grade prompt for their own use case. Peer review session.'},
  {id:'E10',t:'Lab: Claude-powered artifact build',type:'EXERCISE',tier:'T3',tr:'O',col:'backlog',d:'Learner ships a working Claude-in-Claude interactive artifact from scratch.'},

  {id:'Q01',t:'T1 content review',type:'QA',tier:'T1',tr:'S',col:'design',d:'Plain language audit. Zero jargon test. Business framing validation with a non-tech reader.'},
  {id:'Q02',t:'T2 content review',type:'QA',tier:'T2',tr:'M',col:'backlog',d:'Technical accuracy check. All prompt examples tested. No stale API references.'},
  {id:'Q03',t:'T3 content review',type:'QA',tier:'T3',tr:'L',col:'backlog',d:'Depth review. Advanced examples validated against current Claude Sonnet 4.6.'},
  {id:'Q04',t:'Short track dry run',type:'QA',tier:'ALL',tr:'S',col:'backlog',d:'Internal 1-person pilot. Timing confirmed. All exercises completable in allotted time.'},
  {id:'Q05',t:'Medium track dry run',type:'QA',tier:'ALL',tr:'M',col:'backlog',d:'Half-day pilot. T2 exercises validated. Facilitator guide timing confirmed.'},
  {id:'Q06',t:'Long track dry run',type:'QA',tier:'T3',tr:'L',col:'backlog',d:'Full-day pilot with AI team. All 9 modules. Post-session feedback survey required.'},
  {id:'Q07',t:'Accessibility audit (T1 materials)',type:'QA',tier:'T1',tr:'S',col:'backlog',d:'Plain language score, reading level, accessible formatting for all T1 deliverables.'},
  {id:'Q08',t:'Prompt accuracy audit (T2/T3)',type:'QA',tier:'T3',tr:'L',col:'backlog',d:'Every example prompt in the course run against Claude Sonnet 4.6. Outputs match claims.'},
];

let F = {tier:'all', track:'all', type:'all'};

function sf(k, v, btn) {
  btn.parentElement.querySelectorAll('.fpill').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  F[k] = v;
  render();
}

function vis(c) {
  if (F.tier !== 'all' && c.tier !== 'ALL' && c.tier !== F.tier) return false;
  if (F.track !== 'all' && c.tr !== F.track) return false;
  if (F.type !== 'all' && c.type !== F.type) return false;
  return true;
}

function mv(id, dir) {
  const card = cards.find(c => c.id === id);
  const ci = COLS.findIndex(c => c.id === card.col);
  const ni = ci + dir;
  if (ni >= 0 && ni < COLS.length) { card.col = COLS[ni].id; render(); }
}

const TC = {MODULE:'bm', CONTENT:'bc', EXERCISE:'be', QA:'bq'};
const TL = {MODULE:'MODULE', CONTENT:'CONTENT', EXERCISE:'EXERCISE', QA:'QA GATE'};
const TIC = {T1:'bt1', T2:'bt2', T3:'bt3', ALL:'ball'};
const RC = {S:'bS', M:'bM', L:'bL', O:'bO'};
const RL = {S:'Short', M:'Medium', L:'Long', O:'Ongoing'};

function bg(cls, txt) {
  return `<span class="badge ${cls}">${txt}</span>`;
}

function render() {
  let html = '';

  COLS.forEach((col, ci) => {
    const colCards = cards.filter(c => c.col === col.id);
    const visCards = colCards.filter(c => vis(c));

    let ch = '';
    if (colCards.length === 0 || visCards.length === 0) {
      ch = `<div class="empty">empty</div>`;
    }

    colCards.forEach(card => {
      const v = vis(card);
      const canB = ci > 0, canF = ci < COLS.length - 1;
      ch += `<div class="card${v ? '' : ' hidden'}" data-type="${card.type}">
        <div class="card-badges">
          ${bg(TC[card.type], TL[card.type])}
          ${bg(TIC[card.tier], card.tier)}
          ${bg(RC[card.tr], RL[card.tr])}
        </div>
        <div class="card-id">${card.id}</div>
        <div class="card-title">${card.t}</div>
        <div class="card-desc">${card.d.slice(0, 75)}${card.d.length > 75 ? '…' : ''}</div>
        <div class="card-actions">
          ${canB ? `<button class="ca" onclick="mv('${card.id}',-1)">← back</button>` : ''}
          ${canF ? `<button class="ca" onclick="mv('${card.id}',1)">forward →</button>` : ''}
        </div>
      </div>`;
    });

    html += `<div class="col" data-col="${col.id}">
      <div class="col-head">
        <span class="col-label">${col.n}</span>
        <span class="col-count">${visCards.length}</span>
      </div>
      <div class="cards">${ch}</div>
    </div>`;
  });

  document.getElementById('board').innerHTML = html;

  const n = cards.length;
  document.getElementById('stat-bar').innerHTML = `
    <span class="stat-item"><strong>${n}</strong> total cards</span>
    <span class="stat-divider"></span>
    <span class="stat-item"><strong>${cards.filter(c=>c.type==='MODULE').length}</strong> modules</span>
    <span class="stat-item"><strong>${cards.filter(c=>c.type==='CONTENT').length}</strong> content</span>
    <span class="stat-item"><strong>${cards.filter(c=>c.type==='EXERCISE').length}</strong> exercises</span>
    <span class="stat-item"><strong>${cards.filter(c=>c.type==='QA').length}</strong> QA gates</span>
    <span class="stat-divider"></span>
    <span class="stat-item"><strong>${cards.filter(c=>c.col==='design').length}</strong> in design now</span>
    <span class="stat-item"><strong>${cards.filter(c=>c.col==='live').length}</strong> live</span>
    <span class="stat-item"><strong>${cards.filter(c=>c.tr==='S').length}</strong> short track cards</span>
  `;
}

function toggleNotion() {
  const panel = document.getElementById('notion-panel');
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }

  let out = '# Prompt to Power — Course Kanban\n';
  out += '> Claude teaching course · Sprint 0 · 3 tiers · 4 tracks\n\n';
  out += '## Legend\n';
  out += '- Tier: T1 = Non-tech | T2 = Technical | T3 = AI-native | ALL = all tiers\n';
  out += '- Track: Short (1–2h) | Medium (3–4h) | Long (6–8h) | Ongoing (curriculum)\n';
  out += '- Type: MODULE | CONTENT | EXERCISE | QA GATE\n\n';

  COLS.forEach(col => {
    const cc = cards.filter(c => c.col === col.id);
    out += `## ${col.n} (${cc.length})\n\n`;
    if (cc.length === 0) { out += '_empty_\n\n'; return; }
    cc.forEach(c => {
      out += `- [ ] **${c.id}** ${c.t}\n`;
      out += `  - Type: ${c.type} | Tier: ${c.tier} | Track: ${RL[c.tr]}\n`;
      out += `  - ${c.d}\n\n`;
    });
  });

  document.getElementById('notion-body').textContent = out;
  panel.style.display = 'block';
}

function copyNotion() {
  const text = document.getElementById('notion-body').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.notion-header .btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy all', 1800);
  });
}

function sendPrompt(text) {
  alert('Copy this prompt:\n\n' + text);
}

render();
</script>
</body>
</html>
