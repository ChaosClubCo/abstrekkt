
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.finding-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);margin-bottom:8px;overflow:hidden}
.finding-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.finding-body{border-top:0.5px solid var(--color-border-tertiary);padding:12px 14px;font-size:13px;line-height:1.6;color:var(--color-text-secondary)}
.tab-btn{padding:8px 14px;font-size:13px;background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:-1px;color:var(--color-text-secondary)}
.tab-btn.active{font-weight:500;border-bottom-color:var(--color-text-primary);color:var(--color-text-primary)}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:0.5px solid var(--color-border-tertiary);padding-bottom:0;flex-wrap:wrap}
pre.fix-block{margin:0;padding:8px 10px;background:var(--color-background-tertiary);border-radius:var(--border-radius-md);font-size:12px;font-family:var(--font-mono);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
</style>

<h2 class="sr-only">Code Review Council — AI-powered production readiness review</h2>

<div id="app" style="padding:1rem 0;font-family:var(--font-sans)"></div>

<script>
const PROMPT_SYSTEM = `You are a senior software engineer performing a production-readiness code review. Analyze the submitted code across 8 dimensions. Be specific: cite exact function names, variable names, and patterns. Never give generic advice that could apply to any codebase unchanged.`;

const buildPrompt = (code) => `Review this code for production readiness:

<code>
${code}
</code>

Return your analysis as XML with this exact structure. Detect the language from the code itself.

<review language="DETECTED_LANGUAGE">

<summary>
<score>INTEGER_0_TO_100</score>
<blocking_issues>comma-separated CRITICAL blockers, or the word none</blocking_issues>
<verdict>1-2 sentence overall assessment</verdict>
</summary>

<refactoring>
<item severity="high|medium|low">
<title>short title</title>
<description>what to refactor and why, citing specific code</description>
<fix>corrected code snippet or pattern</fix>
</item>
</refactoring>

<bugs>
<item severity="critical|high|medium|low">
<title>short title</title>
<location>function name or line reference</location>
<description>bug description citing specific code</description>
<fix>corrected code</fix>
</item>
</bugs>

<edge_cases>
<item severity="high|medium|low">
<title>short title</title>
<scenario>exact input or state that triggers this</scenario>
<fix>how to handle it with code example</fix>
</item>
</edge_cases>

<security>
<item severity="critical|high|medium|low">
<title>short title</title>
<cve_type>OWASP category if applicable, e.g. A03:2021 Injection</cve_type>
<description>vulnerability description citing specific code</description>
<remediation>fix steps with code example</remediation>
</item>
</security>

<cicd>
<item severity="high|medium|low">
<title>short title</title>
<description>CI/CD gap or recommendation with specifics</description>
</item>
</cicd>

<code_quality>
<score>INTEGER_0_TO_100</score>
<item severity="high|medium|low">
<title>short title</title>
<description>issue citing specific code</description>
</item>
</code_quality>

<modularity>
<item severity="high|medium|low">
<title>short title</title>
<description>modularity issue or recommendation</description>
</item>
</modularity>

<production_readiness>
<score>INTEGER_0_TO_100</score>
<item severity="critical|high|medium|low">
<title>short title</title>
<description>production concern with specifics</description>
</item>
</production_readiness>

</review>

Return ONLY the XML. No preamble, no markdown fences, no text outside the XML tags.`;

const COUNCIL = [
  {id:"overview",label:"Overview",icon:"ti-layout-dashboard",sections:[]},
  {id:"security",label:"Noa",sublabel:"Security & CI/CD",icon:"ti-shield-lock",sections:["security","cicd"]},
  {id:"bugs",label:"Marcus",sublabel:"Bugs & Edge Cases",icon:"ti-bug",sections:["bugs","edge_cases"]},
  {id:"refactor",label:"Priya",sublabel:"Refactoring & Modularity",icon:"ti-refresh",sections:["refactoring","modularity"]},
  {id:"quality",label:"Jordan",sublabel:"Code Quality & Production",icon:"ti-checklist",sections:["code_quality","production_readiness"]},
];

const SEV_MAP = {
  critical:{label:"Critical",bg:"var(--color-background-danger)",color:"var(--color-text-danger)"},
  high:{label:"High",bg:"var(--color-background-warning)",color:"var(--color-text-warning)"},
  medium:{label:"Medium",bg:"var(--color-background-info)",color:"var(--color-text-info)"},
  low:{label:"Low",bg:"var(--color-background-secondary)",color:"var(--color-text-secondary)"},
};

const SEC_LABELS = {security:"Security",cicd:"CI/CD",bugs:"Bugs",edge_cases:"Edge Cases",refactoring:"Refactoring",modularity:"Modularity",code_quality:"Code Quality",production_readiness:"Production Readiness"};

let state = {code:"",loading:false,result:null,error:null,rawXml:"",activeTab:"overview",openCards:{}};

function parseXML(xmlStr) {
  const match = xmlStr.match(/<review[\s\S]*<\/review>/i);
  if (!match) return null;
  const parser = new DOMParser();
  const doc = parser.parseFromString(match[0],"text/xml");
  if (doc.querySelector("parsererror")) return null;
  const getText = (parent,sel) => { const el = parent.querySelector(sel); return el ? el.textContent.trim() : ""; };
  const parseItems = (sectionEl) => {
    if (!sectionEl) return [];
    return Array.from(sectionEl.querySelectorAll("item")).map(item => {
      const r = {severity: item.getAttribute("severity") || "low"};
      Array.from(item.children).forEach(c => { r[c.tagName] = c.textContent.trim(); });
      return r;
    });
  };
  const review = doc.querySelector("review");
  return {
    language: review ? (review.getAttribute("language") || "Unknown") : "Unknown",
    summary: {score: parseInt(getText(doc,"summary score"))||0, blocking: getText(doc,"summary blocking_issues"), verdict: getText(doc,"summary verdict")},
    refactoring: parseItems(doc.querySelector("refactoring")),
    bugs: parseItems(doc.querySelector("bugs")),
    edge_cases: parseItems(doc.querySelector("edge_cases")),
    security: parseItems(doc.querySelector("security")),
    cicd: parseItems(doc.querySelector("cicd")),
    code_quality: {score: parseInt(getText(doc,"code_quality score"))||0, items: parseItems(doc.querySelector("code_quality"))},
    modularity: parseItems(doc.querySelector("modularity")),
    production_readiness: {score: parseInt(getText(doc,"production_readiness score"))||0, items: parseItems(doc.querySelector("production_readiness"))},
  };
}

function getSectionItems(result, sectionId) {
  if (!result) return [];
  switch(sectionId) {
    case "security": return result.security;
    case "cicd": return result.cicd;
    case "bugs": return result.bugs;
    case "edge_cases": return result.edge_cases;
    case "refactoring": return result.refactoring;
    case "modularity": return result.modularity;
    case "code_quality": return result.code_quality.items;
    case "production_readiness": return result.production_readiness.items;
    default: return [];
  }
}

function scoreColor(s) {
  return s >= 80 ? "var(--color-text-success)" : s >= 60 ? "var(--color-text-warning)" : "var(--color-text-danger)";
}

function sevBadge(sev) {
  const s = SEV_MAP[sev] || SEV_MAP.low;
  return `<span style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--border-radius-md);background:${s.bg};color:${s.color};text-transform:uppercase;letter-spacing:.04em">${s.label}</span>`;
}

function renderFindingCard(item, cardId) {
  const open = state.openCards[cardId];
  const hasDetails = item.description || item.fix || item.remediation || item.scenario || item.location || item.cve_type;
  let body = "";
  if (open && hasDetails) {
    let inner = "";
    if (item.location) inner += `<div style="margin-bottom:8px"><span style="font-weight:500;color:var(--color-text-primary)">Location: </span><code style="font-size:12px;background:var(--color-background-secondary);padding:1px 6px;border-radius:4px">${item.location}</code></div>`;
    if (item.cve_type) inner += `<div style="margin-bottom:8px"><span style="font-weight:500;color:var(--color-text-primary)">OWASP: </span>${item.cve_type}</div>`;
    if (item.description) inner += `<p style="margin:0 0 8px">${item.description}</p>`;
    if (item.scenario) inner += `<p style="margin:0 0 8px"><span style="font-weight:500;color:var(--color-text-primary)">Scenario: </span>${item.scenario}</p>`;
    const fixText = item.fix || item.remediation;
    if (fixText) inner += `<div><p style="margin:0 0 4px;font-weight:500;color:var(--color-text-primary)">Fix:</p><pre class="fix-block">${fixText.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</pre></div>`;
    body = `<div class="finding-body">${inner}</div>`;
  }
  const chevron = hasDetails ? `<i class="ti ti-chevron-${open ? "up":"down"}" aria-hidden="true" style="font-size:14px;color:var(--color-text-secondary)"></i>` : "";
  return `<div class="finding-card"><div class="finding-header" onclick="toggleCard('${cardId}')" style="cursor:${hasDetails ? "pointer":"default"}">${sevBadge(item.severity)}<span style="font-size:14px;font-weight:500;flex:1">${item.title || "(untitled)"}</span>${chevron}</div>${body}</div>`;
}

function renderSection(result, sectionId, prefix) {
  const items = getSectionItems(result, sectionId);
  const scoreVal = sectionId === "code_quality" ? result.code_quality.score : sectionId === "production_readiness" ? result.production_readiness.score : null;
  const scoreHtml = scoreVal !== null ? `<span style="font-size:13px;font-weight:500;color:${scoreColor(scoreVal)}">${scoreVal}/100</span>` : "";
  let cards = items.length === 0
    ? `<div style="font-size:13px;color:var(--color-text-secondary);padding:10px 0"><i class="ti ti-circle-check" aria-hidden="true" style="margin-right:6px;color:var(--color-text-success)"></i>No issues found</div>`
    : items.map((item, i) => renderFindingCard(item, `${prefix}_${sectionId}_${i}`)).join("");
  return `<div style="margin-bottom:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h3 style="font-size:12px;font-weight:500;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-secondary)">${SEC_LABELS[sectionId]||sectionId}</h3>
      ${scoreHtml}
    </div>
    ${cards}
  </div>`;
}

function getCriticalCount(result) {
  if (!result) return 0;
  return [...result.bugs, ...result.security, ...result.production_readiness.items, ...result.edge_cases].filter(i => i.severity === "critical").length;
}

function render() {
  const {code, loading, result, error, activeTab} = state;
  const app = document.getElementById("app");
  
  let html = `
  <div style="margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:13px;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px"><i class="ti ti-code" aria-hidden="true" style="font-size:14px"></i>Paste code to review</span>
      ${code.trim() ? `<span style="font-size:12px;color:var(--color-text-secondary)">${code.split("\n").length} lines</span>` : ""}
    </div>
    <textarea id="code-input" rows="12" placeholder="// Paste your code here..." style="width:100%;box-sizing:border-box;font-family:var(--font-mono);font-size:13px;line-height:1.6;resize:vertical;padding:12px 14px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);color:var(--color-text-primary)" ${loading ? "disabled" : ""}>${code.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</textarea>
  </div>
  <button id="run-btn" ${loading || !code.trim() ? "disabled" : ""} onclick="runReview()" style="width:100%;padding:10px;font-size:14px;font-weight:500;margin-bottom:20px;cursor:${loading || !code.trim() ? "not-allowed":"pointer"};opacity:${!code.trim() ? .5 : 1}">
    ${loading
      ? `<i class="ti ti-loader-2" aria-hidden="true" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>Council reviewing...`
      : `<i class="ti ti-users" aria-hidden="true" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>Run Council Review ↗`}
  </button>`;

  if (loading) {
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px">
      ${COUNCIL.slice(1).map(m => `<div style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;text-align:center">
        <i class="ti ${m.icon}" aria-hidden="true" style="font-size:20px;color:var(--color-text-secondary);display:block;margin-bottom:6px"></i>
        <div style="font-size:13px;font-weight:500">${m.label}</div>
        <div style="font-size:11px;color:var(--color-text-secondary)">reviewing...</div>
      </div>`).join("")}
    </div>`;
  }

  if (error) {
    html += `<div style="padding:12px 16px;background:var(--color-background-danger);color:var(--color-text-danger);border-radius:var(--border-radius-md);font-size:13px;margin-bottom:16px">
      <i class="ti ti-alert-circle" aria-hidden="true" style="margin-right:8px;vertical-align:-1px"></i>${error}
    </div>`;
  }

  if (result) {
    const critCount = getCriticalCount(result);
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
      <div style="display:flex;align-items:center;gap:10px">
        <i class="ti ti-code" aria-hidden="true" style="font-size:16px;color:var(--color-text-secondary)"></i>
        <span style="font-size:14px;font-weight:500">${result.language}</span>
        ${critCount > 0 ? `<span style="font-size:12px;background:var(--color-background-danger);color:var(--color-text-danger);padding:2px 10px;border-radius:var(--border-radius-md);font-weight:500">${critCount} critical</span>` : ""}
      </div>
      <div style="display:flex;gap:20px">
        ${[{s:result.summary.score,l:"Overall"},{s:result.code_quality.score,l:"Quality"},{s:result.production_readiness.score,l:"Prod-ready"}].map(x=>`<div style="text-align:center"><div style="font-size:26px;font-weight:500;color:${scoreColor(x.s)}">${x.s}</div><div style="font-size:11px;color:var(--color-text-secondary)">${x.l}</div></div>`).join("")}
      </div>
    </div>`;

    html += `<div class="tab-bar">
      ${COUNCIL.map(t => `<button class="tab-btn ${activeTab===t.id?"active":""}" onclick="setTab('${t.id}')">
        <i class="ti ${t.icon}" aria-hidden="true" style="font-size:14px"></i>${t.label}
      </button>`).join("")}
    </div>`;

    if (activeTab === "overview") {
      const blocking = result.summary.blocking && result.summary.blocking.toLowerCase() !== "none" && result.summary.blocking.trim() !== "";
      html += `<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:14px 16px;margin-bottom:16px;font-size:14px;line-height:1.6">${result.summary.verdict}</div>`;
      if (blocking) {
        html += `<div style="background:var(--color-background-danger);border:0.5px solid var(--color-border-danger);border-radius:var(--border-radius-md);padding:12px 16px;margin-bottom:16px;font-size:13px">
          <div style="font-weight:500;color:var(--color-text-danger);margin-bottom:4px;display:flex;align-items:center;gap:6px"><i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:16px"></i>Blocking issues</div>
          <div style="color:var(--color-text-danger)">${result.summary.blocking}</div>
        </div>`;
      }
      html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
        ${COUNCIL.slice(1).map(m => {
          const items = m.sections.flatMap(s => getSectionItems(result, s));
          const hCrit = items.filter(i => i.severity==="critical"||i.severity==="high").length;
          return `<div onclick="setTab('${m.id}')" style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px;cursor:pointer;text-align:center">
            <i class="ti ${m.icon}" aria-hidden="true" style="font-size:22px;color:var(--color-text-secondary);display:block;margin-bottom:8px"></i>
            <div style="font-size:13px;font-weight:500;margin-bottom:2px">${m.label}</div>
            <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px">${m.sublabel}</div>
            <div style="font-size:12px;background:${hCrit>0?"var(--color-background-warning)":"var(--color-background-secondary)"};color:${hCrit>0?"var(--color-text-warning)":"var(--color-text-secondary)"};padding:2px 8px;border-radius:var(--border-radius-md);display:inline-block">${items.length} findings</div>
          </div>`;
        }).join("")}
      </div>`;
    } else {
      const member = COUNCIL.find(c => c.id === activeTab);
      if (member) {
        html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:0.5px solid var(--color-border-tertiary)">
          <i class="ti ${member.icon}" aria-hidden="true" style="font-size:20px;color:var(--color-text-secondary)"></i>
          <div><div style="font-size:15px;font-weight:500">${member.label}</div><div style="font-size:12px;color:var(--color-text-secondary)">${member.sublabel}</div></div>
        </div>`;
        html += member.sections.map(sId => renderSection(result, sId, activeTab)).join("");
      }
    }
  }

  app.innerHTML = html;

  const ta = document.getElementById("code-input");
  if (ta) ta.addEventListener("input", e => { state.code = e.target.value; scheduleRender(); });
}

let renderScheduled = false;
function scheduleRender() {
  if (!renderScheduled) { renderScheduled = true; requestAnimationFrame(() => { renderScheduled = false; render(); }); }
}

function toggleCard(id) {
  state.openCards[id] = !state.openCards[id];
  render();
}

function setTab(id) {
  state.activeTab = id;
  render();
}

async function runReview() {
  if (!state.code.trim() || state.loading) return;
  state.loading = true; state.result = null; state.error = null; state.rawXml = ""; state.openCards = {};
  render();
  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:4000,
        system: PROMPT_SYSTEM,
        messages:[{role:"user",content:buildPrompt(state.code)}]
      })
    });
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    state.rawXml = text;
    const parsed = parseXML(text);
    if (!parsed) { state.error = "Could not parse XML response from the model. Try again."; }
    else { state.result = parsed; state.activeTab = "overview"; }
  } catch(e) {
    state.error = "API call failed: " + e.message;
  } finally {
    state.loading = false;
    render();
  }
}

render();
</script>
