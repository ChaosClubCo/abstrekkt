version: 1
exporters:
  otlp:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
signals:
  traces:
    fields: [trace_id, span_id, route, user_tier, latency_ms, token_in, token_out, cost_usd, eval_pass]
  logs:
    pii_redaction: true
    retention_days: 30
slo:
  api_latency_p95_ms: 500
  error_rate_pct: 1.0
