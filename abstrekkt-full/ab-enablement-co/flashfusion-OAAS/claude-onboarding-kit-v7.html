<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Claude Onboarding Kit v7</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0B14;--border:rgba(139,92,246,0.14);--v:#A855F7;--m:#EC4899;--c:#22D3EE;--g:#10B981;--amber:#F59E0B;--red:#EF4444;--text:#E2E8F0;--muted:#94A3B8;--dim:#475569;--card:rgba(19,19,31,0.92);--r:12px;--rs:8px}
body{background:var(--bg);color:var(--text);font-family:'Geist','Inter',system-ui,sans-serif;min-height:100vh;font-size:15px;line-height:1.6}
.app{max-width:740px;margin:0 auto;padding:2rem 1.25rem 5rem}
h1{font-size:22px;font-weight:500;background:linear-gradient(135deg,#A855F7,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;line-height:1.5}
.sdots{display:flex;gap:8px;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap}
.sd{width:24px;height:24px;border-radius:50%;border:1px solid var(--dim);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);flex-shrink:0}
.sd.a{background:rgba(168,85,247,.2);border-color:var(--v);color:var(--v);font-weight:600}
.sd.d{background:rgba(34,211,238,.12);border-color:var(--c);color:var(--c)}
.sdl{font-size:12px;color:var(--muted)}
.dsep{width:3px;height:3px;border-radius:50%;background:var(--dim);flex-shrink:0}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
@media(max-width:480px){.pg{grid-template-columns:1fr}}
.pc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1rem;cursor:pointer;transition:all .18s;position:relative}
.pc:hover{border-color:rgba(168,85,247,.4);background:rgba(168,85,247,.05)}
.pc.sel{border-color:var(--v);background:rgba(168,85,247,.1)}
.pc.ex-c{border-color:rgba(16,185,129,.2)}.pc.ex-c:hover{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.04)}.pc.ex-c.sel{border-color:var(--g);background:rgba(16,185,129,.09)}
.pc.tc-c{border-color:rgba(34,211,238,.2)}.pc.tc-c:hover{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.04)}.pc.tc-c.sel{border-color:var(--c);background:rgba(34,211,238,.09)}
.pc .ic{font-size:22px;margin-bottom:6px}.pc .lb{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}.pc .ds{font-size:11px;color:var(--muted);line-height:1.4}
.new-tag{position:absolute;top:10px;right:10px;font-size:9px;padding:2px 6px;border-radius:8px;background:rgba(16,185,129,.15);color:var(--g);border:1px solid rgba(16,185,129,.3);font-weight:700}
.warn-tag{position:absolute;top:10px;right:10px;font-size:9px;padding:2px 6px;border-radius:8px;background:rgba(34,211,238,.15);color:var(--c);border:1px solid rgba(34,211,238,.3);font-weight:700}
.detect-banner{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.25);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detect-banner p{font-size:13px;color:var(--muted);flex:1;min-width:200px}.detect-banner strong{color:var(--g)}
.reg-warn{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.25);border-radius:var(--rs);padding:10px 14px;margin-bottom:14px;font-size:13px;color:rgba(239,68,68,.8);line-height:1.5}
.reg-warn strong{color:var(--red)}
.qb{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:10px}
.ql{font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px}
.qs{font-size:12px;color:var(--muted);margin-bottom:8px;margin-top:-4px}
.cr{display:flex;flex-wrap:wrap;gap:6px}
.ch{border:1px solid var(--dim);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted);cursor:pointer;background:transparent;transition:all .15s;user-select:none}
.ch:hover{border-color:rgba(168,85,247,.5);color:var(--text)}
.ch.on{background:rgba(168,85,247,.15);border-color:var(--v);color:var(--v)}
.ch.on.ex{background:rgba(16,185,129,.12);border-color:var(--g);color:var(--g)}
.ch.on.tc{background:rgba(34,211,238,.12);border-color:var(--c);color:var(--c)}
.ch.on.rg{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red)}
.xbar{background:rgba(168,85,247,.06);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xbar-lbl{font-size:12px;color:var(--muted);margin-right:4px}
.tr{display:flex;gap:2px;margin-bottom:1rem;border-bottom:1px solid var(--border);overflow-x:auto}

.tb:hover{color:var(--text)}.tb.on{color:var(--v);border-bottom-color:var(--v);font-weight:500}
.tb.ex-tab.on{color:var(--g);border-bottom-color:var(--g)}
.tb.tc-tab.on{color:var(--c);border-bottom-color:var(--c)}
.tb.mgr-tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.rs{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:10px}
.rs.ex-s{border-color:rgba(16,185,129,.18)}.rs.tc-s{border-color:rgba(34,211,238,.18)}.rs.mgr-s{border-color:rgba(245,158,11,.18)}.rs.red-s{border-color:rgba(239,68,68,.2)}
.rt{font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bm{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.mu{background:rgba(236,72,153,.15);color:var(--m);border:1px solid rgba(236,72,153,.3)}
.hi{background:rgba(168,85,247,.15);color:var(--v);border:1px solid rgba(168,85,247,.3)}
.op{background:rgba(148,163,184,.1);color:var(--muted);border:1px solid var(--dim)}

.gr{background:rgba(16,185,129,.12);color:var(--g);border:1px solid rgba(16,185,129,.25)}
.am{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.re{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.cap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:500px){.cap-grid{grid-template-columns:1fr}}
.cap-card{background:rgba(0,0,0,.2);border:1px solid rgba(16,185,129,.1);border-radius:var(--rs);padding:.9rem}
.cap-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cap-items{list-style:none;font-size:12px;color:var(--muted);line-height:1.8}

.cap-myth{margin-top:8px;padding-top:8px;border-top:1px solid rgba(236,72,153,.12);font-size:11px;color:rgba(236,72,153,.7);font-style:italic;line-height:1.4}
.cap-myth::before{content:'x ';font-style:normal}
.cap-real{margin-top:3px;font-size:11px;color:rgba(16,185,129,.8);line-height:1.4}

.myth-row{padding:12px 0;border-bottom:1px solid rgba(139,92,246,.06)}.myth-row:last-child{border-bottom:none}
.ml{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:8px;display:inline-block;margin-bottom:4px}
.ml.my{background:rgba(236,72,153,.12);color:var(--m)}.ml.re2{background:rgba(16,185,129,.12);color:var(--g)}
.myth-text{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:6px}.myth-text.rv{color:var(--text)}
.prompt-card{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:var(--rs);padding:.9rem;margin-bottom:8px}
.pl{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--g);margin-bottom:5px}
.pl.tc{color:var(--c)}
.pt{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
.pw{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.px{font-family:'Geist Mono',monospace;font-size:11px;color:var(--c);background:rgba(0,0,0,.3);padding:8px 10px;border-radius:var(--rs);border:1px solid rgba(34,211,238,.15);line-height:1.6;word-break:break-word}
.code-block{background:rgba(0,0,0,.4);border:1px solid rgba(34,211,238,.15);border-radius:var(--rs);padding:12px;font-family:'Geist Mono',monospace;font-size:12px;color:var(--c);line-height:1.7;margin-bottom:10px;white-space:pre}
.path-phases{display:flex;flex-direction:column;gap:0}
.phase-block{border-left:2px solid var(--border);padding:0 0 16px 16px;margin-left:10px;position:relative}
.phase-block:last-child{border-left:2px solid transparent;padding-bottom:0}
.phase-dot{width:20px;height:20px;border-radius:50%;position:absolute;left:-11px;top:0;border:2px solid var(--bg)}
.phase-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:6px;letter-spacing:.3px}
.ph-d{background:rgba(236,72,153,.15);color:var(--m);border:1px solid rgba(236,72,153,.3)}
.ph-w1{background:rgba(168,85,247,.15);color:var(--v);border:1px solid rgba(168,85,247,.3)}
.ph-w2{background:rgba(34,211,238,.12);color:var(--c);border:1px solid rgba(34,211,238,.25)}
.ph-m1{background:rgba(16,185,129,.12);color:var(--g);border:1px solid rgba(16,185,129,.25)}
.ph-m3{background:rgba(148,163,184,.1);color:var(--muted);border:1px solid var(--dim)}
.phase-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.phase-domain{font-size:11px;color:var(--v);margin-bottom:6px;font-weight:500}
.phase-items div{margin-bottom:2px;font-size:12px;color:var(--muted)}
.phase-items div::before{content:'-> ';color:var(--g);font-size:11px}
.milestone{margin-top:8px;font-size:11px;color:var(--amber);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:var(--rs);padding:5px 9px;display:inline-block}
.milestone::before{content:'Milestone: ';font-weight:600}
.mr{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(139,92,246,.06)}
.mr:last-child{border-bottom:none;padding-bottom:0}
.mi{width:30px;height:30px;border-radius:7px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.mn{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mw{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.mex{font-size:11px;color:var(--g);margin-top:3px;font-style:italic;line-height:1.4}
.gate{background:rgba(245,158,11,.05);border:1px dashed rgba(245,158,11,.3);border-radius:var(--rs);padding:14px}
.gate-title{font-size:12px;font-weight:600;color:var(--amber);margin-bottom:6px}
.gate-sub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.gate-bar{flex:1;height:4px;background:rgba(245,158,11,.15);border-radius:2px;overflow:hidden}
.gate-fill{height:100%;background:var(--amber);border-radius:2px}
.gate-prog{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.gate-label{font-size:11px;color:var(--amber);min-width:30px;text-align:right}
.gate-item{margin-bottom:3px;font-size:12px;color:var(--muted)}
.search-bar{display:flex;gap:8px;margin-bottom:10px}
.search-input{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:var(--rs);padding:7px 12px;font-size:13px;color:var(--text);font-family:inherit;flex:1;outline:none}
.search-input:focus{border-color:rgba(168,85,247,.4)}
.search-input::placeholder{color:var(--dim)}
.frow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ftag{border:1px solid var(--dim);border-radius:16px;padding:3px 10px;font-size:11px;color:var(--muted);cursor:pointer;background:transparent;transition:all .15s;white-space:nowrap}
.ftag:hover{border-color:var(--v);color:var(--text)}.ftag.on{background:rgba(168,85,247,.15);border-color:var(--v);color:var(--v)}
.cat-hdr{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin:14px 0 6px;padding-bottom:6px;border-bottom:1px solid rgba(139,92,246,.1)}
.cat-hdr:first-of-type{margin-top:0}
.stat{font-size:11px;color:var(--muted);background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:10px;padding:2px 8px;margin-left:6px}
.cb{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:var(--rs);padding:.85rem;font-family:'Geist Mono',monospace;font-size:11px;color:var(--text);line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:10px;max-height:240px;overflow-y:auto}
.ci{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(139,92,246,.06)}
.ci:last-child{border-bottom:none}
.ck{width:17px;height:17px;border:1px solid var(--dim);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:10px;color:var(--c)}
.ck:hover{border-color:var(--v)}.ck.dn{background:rgba(34,211,238,.12);border-color:var(--c)}
.ct{font-size:13px;color:var(--text);line-height:1.5}
.cs{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.ub{background:rgba(236,72,153,.06);border:1px solid rgba(236,72,153,.18);border-radius:var(--rs);padding:10px 13px;margin-bottom:8px}
.ub strong{color:var(--m);font-weight:500}.ub p{font-size:13px;color:var(--muted);line-height:1.5}
.uc-item{padding:10px 0;border-bottom:1px solid rgba(139,92,246,.06)}.uc-item:last-child{border-bottom:none}
.uc-title{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.uc-ex{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted);background:rgba(0,0,0,.3);padding:7px 10px;border-radius:var(--rs);border:1px solid var(--border);line-height:1.5}
.mgr-block{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.15);border-radius:var(--rs);padding:1rem;margin-bottom:10px}
.mgr-block h3{font-size:13px;font-weight:500;color:var(--amber);margin-bottom:6px}
.mgr-block p,.mgr-block li{font-size:13px;color:var(--muted);line-height:1.6}
.mgr-block ul{list-style:none;padding:0}.mgr-block li::before{content:'· ';color:var(--amber)}
.ex-banner{background:linear-gradient(135deg,rgba(16,185,129,.07),rgba(168,85,247,.07));border:1px solid rgba(16,185,129,.22);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:14px}
.ex-banner h2{font-size:13px;font-weight:500;margin-bottom:4px}
.ex-banner p{font-size:12px;color:var(--muted);line-height:1.5}
.note{font-size:12px;color:var(--muted);line-height:1.5;padding:8px 10px;background:rgba(0,0,0,.2);border-radius:var(--rs);border-left:2px solid var(--v);margin-top:8px}
button{background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.3);color:var(--v);padding:7px 14px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
button:hover{background:rgba(168,85,247,.2);border-color:var(--v)}
button.sec{background:transparent;border-color:var(--dim);color:var(--muted)}button.sec:hover{border-color:var(--muted);color:var(--text)}
button.dl{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.4);color:var(--v)}
button.cp{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.25);color:var(--c)}button.cp:hover{background:rgba(34,211,238,.16)}
button.pr{background:rgba(148,163,184,.08);border-color:var(--dim);color:var(--muted)}
button.nt{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.15);color:var(--dim)}button.nt:hover{background:rgba(255,255,255,.1);color:var(--text)}
button.am-btn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:var(--amber)}button.am-btn:hover{background:rgba(245,158,11,.2)}
button.gr-btn{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:var(--g)}
button.tc-btn{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.3);color:var(--c)}button.tc-btn:hover{background:rgba(34,211,238,.2)}
.br{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap}

.toast.s{opacity:1}
@media print{body{background:#fff;color:#000}.xbar,.tr,.br,.search-bar,.frow,button,.new-tag,.warn-tag,.detect-banner,.gate,.ex-banner,.reg-warn{display:none!important}.rs,.qb,.ub,.prompt-card,.cap-card,.mgr-block,.phase-block{border:1px solid #ddd!important;background:#fff!important}.cb,.code-block{background:#f5f5f5!important;max-height:none!important;color:#000!important}h1{background:none!important;-webkit-text-fill-color:#000!important;color:#000!important}.app{max-width:100%;padding:1rem}}

<body>
<div class="app" id="app"></div>
<div class="toast" id="tst"></div>
<script>
const S={step:1,profile:null,ans:{context:[],overwhelm:[],style:[],comfort:[],role:[],use:[],tools:[],pain:[],tech:[],stack:[],rollout:[]},tab:'',chk:{},search:'',filterTier:'all',filterCat:'all'};
const PROFS={
  professional:{lb:'Professional',ds:'Work, career, clients, ops',ic:'💼',ex:false,tc:false},
  personal:{lb:'Personal',ds:'Life, hobbies, creative, learning',ic:'🌱',ex:false,tc:false},
  both:{lb:'Both',ds:'Work and personal — one setup',ic:'⚡',ex:false,tc:false},
  technical:{lb:'Technical / Builder',ds:'Engineering, code, APIs, Claude Code, MCP — building with AI',ic:'⚙️',ex:false,tc:true},
  explorer:{lb:'Explorer',ds:"New to AI — want to learn what's possible",ic:'🔭',ex:true,tc:false}
};
function isEx(){return S.profile==='explorer';}
function isTc(){return S.profile==='technical';}
function isRegulated(){return(S.ans.role||[]).some(r=>['Legal / Compliance','HR / People Ops','Finance / Procurement'].includes(r));}
function isExec(){return(S.ans.role||[]).includes('Executive / Founder');}
function isRollout(){return(S.ans.rollout||[]).some(r=>r!=='Just for me');}
function isSolo(){return(S.ans.role||[]).some(r=>['Consultant / Freelance','Executive / Founder'].includes(r))&&(S.ans.context||[]).some(c=>c.includes('solo')||c.includes('own'));}

const EXQ=[
  {id:'context',lb:'Which describes you best?',sub:'Pick all that fit',opts:['Full-time employee','Manager or team lead','Student or recent grad','Freelancer / self-employed','Career changer','Stay-at-home parent','Retired or semi-retired','Small business owner','Creative professional']},
  {id:'overwhelm',lb:'What feels most inefficient or draining?',sub:'Be honest — these become your first use cases',opts:['Too much to read and absorb','Writing takes me forever','I lose track of things I need to do','Research feels endless','Meetings eat my whole day','I repeat the same things constantly','Never have time to learn new things','Making decisions is exhausting','Creative work keeps stalling','Admin tasks drain me','Explaining things over and over','I feel behind on everything']},
  {id:'style',lb:'How do you learn best?',sub:'Shapes how Claude teaches you',opts:['Show me an example first','Explain why before how','Just tell me what to do','Let me experiment','Step-by-step, one at a time','Give me context, then let me ask']},
  {id:'comfort',lb:'Where are you honestly with AI right now?',sub:'No wrong answer',opts:["Never really used it","Tried ChatGPT, didn't stick","Use it occasionally, don't get much out","Curious but slightly skeptical","Worried I'm already behind","Open and ready — just need a starting point"]}
];

function getRegulatedGuardrail(){
  const roles=S.ans.role||[];const parts=[];
  if(roles.includes('Legal / Compliance'))parts.push('- Never provide legal advice. Frame all output as analysis or research for attorney review.\n- Flag when content could be misread as legal counsel.\n- Always note when jurisdiction-specific knowledge would affect the answer.\n- Recommend attorney review before any output is acted upon legally.');
  if(roles.includes('HR / People Ops'))parts.push('- Never produce final termination, disciplinary, or PIP documents.\n- Flag when content involves protected characteristics or sensitive employee data.\n- Treat all employee information as confidential.\n- Recommend HR/legal review before any employment action documentation is used.');
  if(roles.includes('Finance / Procurement'))parts.push('- Never provide tax or financial advice. Frame output as analysis for professional review.\n- Flag all numerical outputs as unverified — I will cross-check against source data.\n- Note when calculations involve regulatory thresholds or compliance requirements.\n- Recommend CPA or CFO review for anything used in reporting or filings.');
  return parts.length?'\n\n# Professional guardrails\n'+parts.join('\n'):'';
}
function getExecModifier(){return isExec()?'\n\n# Executive mode\n- Lead with the conclusion. Never bury the answer.\n- One page maximum unless I ask for more.\n- When I ask for options, give me 2-3 with a clear recommendation — not a framework.\n- Put the most important caveat in one sentence at the end, not upfront.\n- Assume I will delegate the implementation unless I say otherwise.':'';}
function getSoloModifier(){const r=S.ans.role||[];const u=S.ans.use||[];return(r.includes('Consultant / Freelance')||r.includes('Executive / Founder'))&&u.length>3?'\n\n# Solo operator mode\n- I handle multiple functions myself: '+u.slice(0,4).join(', ')+'. I context-switch constantly.\n- Optimize responses for single-operator execution — I\'m the only person implementing this.\n- Flag when something would benefit from delegation or outside help.':'';}
function getRolloutModifier(){return isRollout()?'\n\n# Team rollout context\n- I\'m setting this up as part of deploying Claude to '+((S.ans.rollout||[])[0]||'my team')+'.\n- Recommendations should be adoptable by people with varying AI experience.\n- Prefer approaches that work for non-technical team members.':'';}

function getExplorerInst(){const sty=(S.ans.style||[])[0]||'step by step';return `I am new to AI and exploring what is possible. I want to learn as I go.\n\n# How I need you to work\n- Guide me: When you do something useful, briefly explain what you just did and why.\n- Teach me: After answering, occasionally surface one related capability I might not know about.\n- Experiment with me: After answering, suggest one related thing I could try next.\n- Keep it accessible. Not technical, but intelligent.\n- If there is a better framing for what I am asking, reframe it and answer that instead.\n\n# My learning style\n${sty}\n\n# What I am figuring out\nWhat AI can actually do for me in real life. Discovery mode.\n\n# Hard rules\n- Never make things up. Say when you do not know.\n- Do not overwhelm me. One idea at a time.\n- These instructions last updated: May 2026.`;}

function getTechInst(){const role=(S.ans.role||[])[0]||'software engineer';const stack=(S.ans.stack||[])[0]||'TypeScript';const uses=(S.ans.tech||[]).slice(0,3).join(', ')||'Claude Code and API';
return `I am a ${role}. Stack: ${stack}. Claude products I am using: ${uses}.\n\n# How I need you to work\n- Give me code first, explanation second. I can read code.\n- When you are unsure about an API or method, say so. Never hallucinate method signatures.\n- Point out security issues and edge cases I have not asked about.\n- Always suggest tests for non-trivial code you write.\n- If a better approach exists, say so before implementing mine.\n- Match the style and conventions in the code I paste.\n\n# Code output standards\n- Production-ready: typed, error handling, no TODOs or placeholders.\n- Include a smoke test or verification step with anything non-trivial.\n- For multi-file work, show the file tree first.\n- No hardcoded credentials, API keys, or secrets anywhere.\n\n# Hard rules\n- "I cannot verify this API exists" beats a confident hallucination.\n- If I ask you to do something that creates a security risk, flag it first.\n- These instructions last updated: May 2026.`;}

function getStdInst(){const r=S.ans;const role=(r.role||[])[0]||'[your role]';const use=(r.use||[]).slice(0,3).join(', ')||'[your main tasks]';const pain=(r.pain||[])[0]||'[your biggest drain]';const p=S.profile;
let b=`I am a ${role}. Primary use cases: ${use}.\n\n# How I need you to work\n- Research FIRST for any product, price, or recommendation.\n- Challenge my reasoning. If my approach has a flaw, say it directly.\n- When tradeoffs exist: show 2-3 options with evidence, pick one and justify it.\n- Be concise. Skip the preamble.\n- If you are unsure, say so. Do not fabricate confidence.\n- If my request is ambiguous, ask one clarifying question first.\n\n# My biggest time drain\n${pain}\n\n# Output defaults\n- Bullet points only when items are genuinely parallel. Otherwise prose.\n- No filler phrases.\n- Give me something I can use immediately.`;
if(p==='personal'||p==='both')b+='\n\n# Personal context\n- Respond like a trusted advisor.\n- Tone: direct but warm. Not corporate.';
if(p==='professional'||p==='both')b+='\n\n# Professional context\n- Recommendations must be implementable.\n- I care about execution and speed.';
b+=getExecModifier()+getSoloModifier()+getRolloutModifier()+getRegulatedGuardrail();
b+='\n\n# Hard rules\n- Never invent statistics. Cannot verify beats a guess.\n- These instructions last updated: May 2026.';
return b;}
