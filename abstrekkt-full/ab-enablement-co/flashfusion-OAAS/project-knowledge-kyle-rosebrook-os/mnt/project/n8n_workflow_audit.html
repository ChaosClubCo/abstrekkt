<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n8n workflow audit — April 14, 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f9f7;color:#1a1a18;padding:2rem;min-height:100vh}
.audit{max-width:860px;margin:0 auto}
h1{font-size:16px;font-weight:500;color:#1a1a18;margin-bottom:4px}
.sub{font-size:12px;color:#888780;margin-bottom:1.5rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:#f1efe8;border-radius:8px;padding:.75rem 1rem}
.sn{font-size:22px;font-weight:500;line-height:1.1}
.sl{font-size:12px;color:#888780;margin-top:3px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.875rem}
.fb{font-size:12px;padding:4px 11px;border:0.5px solid rgba(0,0,0,0.2);background:transparent;border-radius:8px;cursor:pointer;color:#5f5e5a;font-family:inherit}
.fb:hover,.fb.on{background:#f1efe8;color:#1a1a18;border-color:rgba(0,0,0,0.35)}
.wlist{border:0.5px solid rgba(0,0,0,0.12);border-radius:12px;overflow:hidden;background:#fff}
.wr{border-bottom:0.5px solid rgba(0,0,0,0.08)}
.wr:last-child{border-bottom:none}
.wm{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer}
.wm:hover{background:#f9f9f7}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-g{background:#639922}.d-a{background:#BA7517}.d-r{background:#E24B4A}.d-x{background:#B4B2A9}
.wname{flex:1;font-size:13px;font-weight:500;color:#1a1a18;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wid{font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:#5f5e5a;padding:2px 7px;border:0.5px solid rgba(0,0,0,0.12);border-radius:4px;flex-shrink:0;cursor:pointer;user-select:none;transition:background .1s,color .1s}
.wid:hover{background:#e6f1fb;color:#185fa5;border-color:#b5d4f4}
.wid.ok{background:#eaf3de;color:#3b6d11}
.tag{font-size:10px;padding:2px 6px;border-radius:3px;flex-shrink:0;font-weight:500}
.t-mcp{background:#e6f1fb;color:#185fa5}
.t-new{background:#eaf3de;color:#3b6d11}
.t-warn{background:#faeeda;color:#854f0b}
.t-dup{background:#fcebeb;color:#a32d2d}
.wdate{font-size:11px;color:#B4B2A9;flex-shrink:0;min-width:44px;text-align:right}
.chev{width:13px;height:13px;flex-shrink:0;color:#B4B2A9;transition:transform .15s;overflow:visible}
.chev.op{transform:rotate(180deg)}
.wd{padding:8px 14px 14px 31px;border-top:0.5px solid rgba(0,0,0,0.08);font-size:12px;color:#5f5e5a;line-height:1.8;display:none;background:#fafaf8}
.wd.op{display:block}
.wd-id{font-family:'SF Mono','Fira Code',monospace;font-size:11px;background:#f1efe8;padding:1px 6px;border-radius:3px;color:#1a1a18}
.dk{color:#B4B2A9;display:inline-block;width:56px;font-size:11px}
.empty{padding:2rem;text-align:center;font-size:13px;color:#B4B2A9}
.missing{margin-top:1rem;padding:.75rem 1rem;border:0.5px solid #F7C1C1;border-radius:8px;background:#fcebeb;font-size:12px;color:#a32d2d}
.missing strong{font-weight:500}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.wdate{display:none}}
</style>
</head>
<body>
<div class="audit">
  <h1>n8n workflow audit</h1>
  <div class="sub">krosebrook.app.n8n.cloud &nbsp;·&nbsp; April 14, 2026 &nbsp;·&nbsp; 29 workflows</div>
  <div class="stats">
    <div class="stat"><div class="sn" style="color:#1a1a18">29</div><div class="sl">total workflows</div></div>
    <div class="stat"><div class="sn" style="color:#3b6d11">7</div><div class="sl">active</div></div>
    <div class="stat"><div class="sn" style="color:#854f0b">8</div><div class="sl">OAI needs wiring</div></div>
    <div class="stat"><div class="sn" style="color:#a32d2d">3</div><div class="sl">duplicates to clean</div></div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="wlist" id="wlist"></div>
  <div class="missing"><strong>Missing from previous audit:</strong> Work+Personal Event Gateway with Notion — not found in current list. Deleted or renamed — confirm.</div>
</div>

<script>
const WF=[
  {id:'JPSVa3cLtQPi8NKF',name:'Portfolio Command Center — Live Sync',cat:'active',mcp:1,triggers:3,updated:'Apr 14',tags:[],desc:'Webhook-triggered portfolio health sync. 3 triggers: portfolio-sync webhook, github-push webhook, daily 9AM CT schedule. Pending: remove Webhook → Validate Auth & Input connection.'},
  {id:'YIUG6qrc9sVIEr7f',name:'Newsletter Production Pipeline',cat:'active',mcp:1,triggers:1,updated:'Mar 26',tags:[],desc:'Active newsletter pipeline. Supersedes stale duplicate tBW19T1uCwn8d4l0.'},
  {id:'XAu25hqHjz8MXcfh',name:'Newsletter Draft Generator (Phase 2)',cat:'active',mcp:1,triggers:1,updated:'Mar 27',tags:[],desc:'Phase 2 newsletter draft generator with structured Claude synthesis.'},
  {id:'6QRumAi4vETqOrTL',name:'Ascend.AI — Weekly Deal Market Pulse',cat:'active',mcp:1,triggers:1,updated:'Apr 8',tags:['new'],desc:'New since last audit. Weekly scheduled deal market pulse for Ascend.AI platform.'},
  {id:'eQp8c1Y0uM7I9dY7',name:'04 — Feed Health Monitor',cat:'active',mcp:1,triggers:1,updated:'Apr 14',tags:[],desc:'Daily RSS feed health check. Tests 12 feeds, alerts if any are broken or returning 0 items. Active — supersedes iLur4jKNxIcdAysM.'},
  {id:'jXtJOjjN8X6pWVOH',name:'01 — Ecosystem Scanner',cat:'active',mcp:1,triggers:1,updated:'Apr 14',tags:['new'],desc:'Daily AI ecosystem scanner. 16 RSS feeds → Claude scoring → Notion Research Inbox → Slack digest.'},
  {id:'wlGeCq7iEz0zs8Hc',name:'02 — Research Brief Generator',cat:'active',mcp:1,triggers:1,updated:'Apr 14',tags:['new'],desc:'Weekly: queries Notion Research Inbox, synthesizes with Claude, saves brief to Newsletter Drafts.'},
  {id:'iRYUUgbGXoILsNK4',name:'OAI Context TTL Purge',cat:'oai',mcp:1,updated:'Mar 26',tags:[],desc:'Hourly purge of AgentConversationContext records where last_accessed + ttl_seconds has passed. Needs Base44 API base URL + auth token.'},
  {id:'kLeTXNrAb3NHAmu4',name:'OAI Token Budget Reset',cat:'oai',mcp:1,updated:'Mar 26',tags:[],desc:'Hourly reset of TokenBudget records. Zeros tokens_used, accumulates all_time totals, advances next_reset_at. Needs Base44 API base URL + auth token.'},
  {id:'Nxbib8ZjIqBjl27b',name:'OAI Execution Queue Expiry',cat:'oai',mcp:1,updated:'Mar 26',tags:[],desc:'Hourly check of WorkflowExecutionQueue. Expires items past expiry_at, releases past scheduled_release_at. Needs Base44 API base URL + auth token.'},
  {id:'4v2bcTMOuY6oG0F4',name:'OAI System Health Snapshot',cat:'oai',mcp:1,updated:'Mar 26',tags:[],desc:'Hourly SystemHealthSnapshot per active Organization. Computes composite health score, updates Organization.overall_health_score. Needs Base44 API base URL + auth token.'},
  {id:'otATfw4PYkkMOBGc',name:'OAI Scheduled Job Executor',cat:'oai',mcp:1,updated:'Mar 26',tags:[],desc:'Per-minute poll of ScheduledJob records. Creates WorkflowExecution for due jobs, advances next_run_at, tracks failure streaks. Needs Base44 API base URL + auth token.'},
  {id:'fk1RKSu2sBoYvOuL',name:'OAI WebhookBridge Pinger',cat:'oai',mcp:1,updated:'Apr 8',tags:[],desc:'Every 5 minutes: pings ExecutionLayerConfig.health_check_url, cascades failures to WebhookBridge.consecutive_failures. Needs Base44 API base URL + auth token.'},
  {id:'JErzPwjEoqxgMRUR',name:'OAI Data Retention Purge',cat:'oai',mcp:1,updated:'Apr 8',tags:[],desc:'Nightly 2AM purge. Updates last_run_at and next_run_at on DataRetentionPolicy records. Needs Base44 API base URL + auth token.'},
  {id:'2DbBW5OpsxKlf11q',name:'OAI Config Proxy',cat:'oai',mcp:1,updated:'Apr 8',tags:['new'],desc:'New. Proxy: receives method/url/api_key/payload via webhook, fires server-side PUT to n8n API. Enables editing workflow node configs from inside n8n — activate this first.'},
  {id:'SPgQwR7XDoGbXPIZ',name:'03 — Newsletter Draft Assembly',cat:'builds',mcp:1,updated:'Apr 14',tags:['new'],desc:'Manual trigger by design. Pulls latest research brief, generates 3-tier newsletter drafts via Claude, saves to Notion.'},
  {id:'utVeYiOURYiB814M',name:'HITL Test Deploy',cat:'builds',mcp:1,updated:'Mar 27',tags:['new'],desc:'Test workflow to verify SDK deployment format. Inactive by design.'},
  {id:'6sNUylKakwdzpgoy',name:'HITL · Confidence Router',cat:'builds',updated:'Mar 27',tags:['new'],desc:'Shared sub-workflow. HITL confidence routing logic. Not MCP-exposed.'},
  {id:'lpENIUIhcXnpPWJW',name:'My Sub-Workflow 1',cat:'builds',updated:'Mar 25',tags:[],desc:'Empty stub sub-workflow. Created Mar 25, no content.'},
  {id:'6ZXg746BkNu2oZpN',name:'Onboarding Workflow',cat:'legacy',updated:'Dec 2025',tags:[],desc:'Unchanged since Nov 2025. Original pre-audit workflow.'},
  {id:'jJ4jCstfTi3LrWF9',name:'Cross-Platform AI Productivity Orchestration',cat:'legacy',updated:'Dec 2025',tags:[],desc:'Cross-Platform AI Productivity Orchestration and Unified Development Environment Setup. Inactive, unchanged.'},
  {id:'ybeFfMCf6WaDgs3M',name:'Agent Message Hub',cat:'legacy',updated:'Dec 2025',tags:[],desc:'Agent Message Hub with Multi-Platform Routing and Logging. Inactive, unchanged.'},
  {id:'wCkdPjj3q9HeQXjq',name:'AI Agent Health Monitoring',cat:'legacy',updated:'Jan 2026',tags:[],desc:'AI Agent Health Monitoring and Diagnostics System. Inactive, unchanged.'},
  {id:'pXWdOXrU2HU9nXI5',name:'AI-powered file management (Google Drive + MCP)',cat:'legacy',updated:'Jan 2026',tags:[],desc:'AI-powered file management automation for Google Drive with MCP. Inactive, unchanged.'},
  {id:'gOdlT6oTgSkN0aRs',name:'Local AI Agent Automation Backend',cat:'legacy',updated:'Jan 2026',tags:[],desc:'Local AI Agent Automation Backend with Action Routing. Inactive, unchanged.'},
  {id:'a41HQFUp5tMraWWP',name:'PassiveIncome-Scrapper',cat:'legacy',mcp:1,updated:'Mar 20',tags:['warn'],desc:'Was listed as active in previous audit — now shows inactive. MCP-enabled. Confirm if deactivation was intentional.'},
  {id:'tBW19T1uCwn8d4l0',name:'Newsletter Production Pipeline (stale)',cat:'dup',mcp:1,updated:'Mar 26',tags:['dup'],desc:'Duplicate. Superseded by active workflow YIUG6qrc9sVIEr7f. Safe to delete.'},
  {id:'zkmVAPRQnZkgpxiR',name:'Portfolio Command Center — Live Sync (stale)',cat:'dup',mcp:1,updated:'Apr 8',tags:['dup'],desc:'Duplicate. Superseded by active workflow JPSVa3cLtQPi8NKF. Safe to delete.'},
  {id:'iLur4jKNxIcdAysM',name:'04 — Feed Health Monitor (stale)',cat:'dup',mcp:1,updated:'Apr 14',tags:['dup'],desc:'Duplicate. Superseded by active workflow eQp8c1Y0uM7I9dY7. Safe to delete.'},
];

const TABS=[
  {key:'all',label:'All (29)'},
  {key:'active',label:'Active (7)'},
  {key:'oai',label:'OAI batch (8)'},
  {key:'builds',label:'New builds (4)'},
  {key:'legacy',label:'Legacy (7)'},
  {key:'dup',label:'Duplicates (3)'},
];

let cur='all';

function dotCls(w){
  if(w.cat==='active') return 'd-g';
  if(w.cat==='oai') return 'd-a';
  if(w.cat==='dup') return 'd-r';
  return 'd-x';
}

function tagsHtml(w){
  let t='';
  if(w.mcp) t+='<span class="tag t-mcp">MCP</span>';
  if(w.tags.includes('new')) t+='<span class="tag t-new">new</span>';
  if(w.tags.includes('warn')) t+='<span class="tag t-warn">check</span>';
  if(w.tags.includes('dup')) t+='<span class="tag t-dup">dup</span>';
  return t;
}

function render(){
  const list=cur==='all'?WF:WF.filter(w=>w.cat===cur);
  document.getElementById('filters').innerHTML=TABS.map(t=>`<button class="fb${t.key===cur?' on':''}" onclick="setTab('${t.key}')">${t.label}</button>`).join('');
  const wl=document.getElementById('wlist');
  if(!list.length){wl.innerHTML='<div class="empty">no workflows in this category</div>';return;}
  wl.innerHTML=list.map((w,i)=>`
    <div class="wr">
      <div class="wm" onclick="tog(${i})">
        <div class="dot ${dotCls(w)}"></div>
        <svg class="chev" id="cv${i}" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3,5 7,9 11,5"/></svg>
        <span class="wname">${w.name}</span>
        ${tagsHtml(w)}
        <span class="wid" id="wi${i}" onclick="cpId(event,'${w.id}',${i})" title="click to copy full ID">${w.id.slice(0,8)}&hellip;</span>
        <span class="wdate">${w.updated}</span>
      </div>
      <div class="wd" id="wd${i}">
        <div><span class="dk">id</span><span class="wd-id">${w.id}</span></div>
        <div><span class="dk">status</span>${w.cat==='active'?'active':'inactive'}${w.triggers?' &nbsp;·&nbsp; '+w.triggers+' trigger'+(w.triggers>1?'s':''):''}</div>
        <div style="margin-top:6px">${w.desc}</div>
      </div>
    </div>
  `).join('');
}

function setTab(k){cur=k;render();}

function tog(i){
  const d=document.getElementById('wd'+i);
  const c=document.getElementById('cv'+i);
  const open=d.classList.contains('op');
  d.classList.toggle('op',!open);
  c.classList.toggle('op',!open);
}

function cpId(e,id,i){
  e.stopPropagation();
  navigator.clipboard.writeText(id).catch(()=>{});
  const el=document.getElementById('wi'+i);
  el.textContent='copied';
  el.classList.add('ok');
  setTimeout(()=>{el.textContent=id.slice(0,8)+'…';el.classList.remove('ok');},1500);
}

render();
</script>
</body>
</html>
