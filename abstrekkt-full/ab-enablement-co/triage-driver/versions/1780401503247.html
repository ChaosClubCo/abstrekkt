<head>

<style>
  :root {

  /* TOOLBAR */

  .chip.active.lane-intinc { background: var(--lane-intinc); border-color: var(--lane-intinc); }
  .chip.active.lane-freelance { background: var(--lane-freelance); border-color: var(--lane-freelance); }
  .chip.active.lane-kinsley { background: var(--lane-kinsley); border-color: var(--lane-kinsley); }
  .chip.active.lane-skip { background: var(--lane-skip); border-color: var(--lane-skip); }
  .chip.active.lane-unknown { background: var(--lane-unknown); border-color: var(--lane-unknown); }

  .ctrl-group { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .ctrl-group label { color: var(--text-soft); font-size: 11px; }
  input[type="number"], input[type="text"], select {
    font: inherit; font-size: 12px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);

  input[type="number"]:focus, input[type="text"]:focus, select:focus {

  .search-box { position: relative; flex: 1; min-width: 200px; }
  .search-box input { width: 100%; padding-left: 28px; }
  .search-box .icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-mute); pointer-events: none; }
  .ctrl-btn {
    padding: 5px 10px;

    border: 1px solid var(--border);

    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 5px;

  .ctrl-btn:hover { background: var(--surface-2); }
  .ctrl-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }

  .ctrl-btn.magic { background: var(--magic-soft); color: var(--magic); border-color: #c4b5fd; }

  .ctrl-btn.warn { background: var(--warn-soft); color: var(--warn); border-color: #fde68a; }

  /* STATS */
  .stats {
    padding: 10px 20px;

    border-bottom: 1px solid var(--border);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;

  .stat { display: inline-flex; align-items: center; gap: 5px; }

  /* TABLE */
  .grid-wrap { padding: 0 20px 80px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 0; }
  thead th {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 8px; text-align: left;

    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;

  }
  thead th.sortable { cursor: pointer; transition: color 0.15s; }
  thead th.sortable:hover { color: var(--text); }

  tbody tr.data { transition: background 0.1s; cursor: default; }

  tbody tr.data.selected { background: var(--accent-softer); }
  tbody tr.data.selected:hover { background: var(--accent-soft); }

  .score-cell.hi { color: var(--good); }
  .score-cell.hi .bar i { background: var(--good); }

  .title-cell { font-weight: 500; line-height: 1.4; padding-right: 10px; }

  .lane-cell { display: flex; align-items: center; gap: 6px; }

  .lane-chip:hover { border-color: var(--border-strong); }

  .lane-chip.lane-intinc { background: var(--accent-softer); color: var(--lane-intinc); }

  .row-btn:hover { background: var(--surface-2); color: var(--text); }

  /* EXPAND ROW */

  .panel {

  .panel.magic h4 { color: var(--magic); }

  .comp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .comp {
    background: var(--surface); border: 1px solid var(--border);

  /* EMPTY / SKELETON */

  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* TOASTS */
  .toast-container {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;

    background: var(--text); color: white;

  .toast.err { background: var(--bad); }
  .toast.warn { background: var(--warn); }
  .toast.info { background: var(--accent); }
  .toast .close { margin-left: auto; opacity: 0.7; cursor: pointer; background: transparent; border: 0; color: white; font-size: 16px; padding: 0; }
  .toast .close:hover { opacity: 1; }
  @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* MODAL */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.15s ease-out;

  .ai-picks {
    margin: 10px 20px 0;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--magic-soft) 0%, var(--accent-softer) 100%);

    border-radius: var(--radius-lg);

  .ai-picks .pick .why { font-size: 11px; color: var(--text-soft); }
  .ai-picks .actions { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>

<script>
"use strict";

// ─── Config ────────────────────────────────────────────────────────────────
// Update these three when you move the kit / export / artifacts:
const KIT_ROOT     = "E:\\claude-chat-extraction-kit-v2\\claude-chat-extraction-kit-v3\\";
const EXPORT_ROOT  = "E:\\claude-chat-extraction-kit-v2\\data-8fb47a09-919b-43db-bf8f-513a2818df50-1779424005-59ea6cb3-batch-0001\\";
const TRIAGE_PATH  = EXPORT_ROOT + "triage.json";
const CHAT_ROOT    = EXPORT_ROOT;
const PKG_DIR      = KIT_ROOT + "extracted-packages\\";
const STATE_FILE   = KIT_ROOT + "tools\\triage\\triage_state.json";
const STATE_KEY    = "triage-driver-v1";
const ONBOARD_KEY  = "triage-driver-onboarded";

// Lane → distribution eligibility
const LANE_DIST = {
  personal:  { oss: true,  paid: true,  external: true,  reason: "" },
  intinc:    { oss: false, paid: false, external: false, reason: "INTINC content is SOC2-scoped — never publish externally" },
  freelance: { oss: false, paid: false, external: false, reason: "Freelance work is per-client — distribute only to that client" },
  kinsley:   { oss: false, paid: false, external: false, reason: "Kinsley/personal — review case-by-case before publishing" },
  skip:      { oss: false, paid: false, external: false, reason: "Marked skip — do not productize" },
  unknown:   { oss: false, paid: false, external: false, reason: "Lane unknown — verify before publishing" },
};

// Already-packaged source-chat allowlist (from extracted-packages/INDEX.md)
const PACKAGED_TITLES = [
  "clarifying deliverables for zip generation",
  "elite full stack ai forward architecture audit and charter",
  "flashfusion development next steps",
  "prompt replication engine implementation",

  "comprehensive prompt library for 15 year context engineer",
  "staff engineer system instructions v4.1",
  "staff engineer system instructions",
  "gemini custom instruction strategies",
  "custom skills planning for company",
  "production grade flashfusion architecture on vercel and supabase",
  "portfolio consolidation and source of truth monorepo setup",
  "universal ai app generator",
  "building a production grade ai prompt engineering platform",
  "ai co founder strategy for firebase studio app development",
  "flutterflow marketplace app development guide",
  "v0 app development discipline and lint stack setup",
  "v0.app development discipline and lint stack setup",
  "project evaluation framework for buildathon submissions",
  "secure flask oauth application with pkce",

  "production grade ui prompt pack with design tokens",
];

const LANE_KEYWORDS = {
  intinc: ["int inc","intinc","kixie","msm","freshservice","kaseya","bitdefender","bitwarden","service desk","csr role","daniel bell","prompt newsletter","soc 2","soc2","iso 27001","internal tooling","helpdesk","ticketing","onboarding review","sales team transition"],
  kinsley: ["kinsley","child","kid","family","school schedule","parenting","kids app","family app","sacred journeys"],
  freelance: ["client","customization service","freelance","per client","contract work","consult"],
  personal: ["flashfusion","flash fusion","chaosclub","chaos club","ff agent","agent control center","kit","extract","deliverable","zip","package","skill","prompt replication","cowork","claude skills","mcp"],
};

const FLAG_LABEL = {
  "unfinished-build":  { label: "unfinished", cls: "unfinished", title: "Thinking is done, artifact never shipped — finish-forward target" },
  "asks-to-continue":  { label: "continue",   cls: "continue",   title: "Chat explicitly asks to continue / resume" },
  "truncated":         { label: "cut off",    cls: "truncated",  title: "Chat hit context limit mid-build" },
};

// ─── State ─────────────────────────────────────────────────────────────────
let STATE = (() => { try { return JSON.parse(localStorage.getItem(STATE_KEY) || "{}"); } catch { return {}; } })();
let STATE_DISK_MTIME = null;  // tracks last read from disk so we know if local diverged
function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }
function rowState(uuid) { return STATE[uuid] = STATE[uuid] || {}; }

async function mergeStateFromDisk() {
  if (!window.cowork?.callMcpTool) return false;
  try {
    const r = await window.cowork.callMcpTool("mcp__Desktop_Commander__read_file", { path: STATE_FILE });
    let txt = r?.content ?? r?.text ?? r?.result?.content ?? r;
    if (typeof txt === "object" && txt?.content) txt = txt.content;
    if (typeof txt !== "string") txt = JSON.stringify(txt);
    const m = txt.match(/^\[Reading[^\]]+\]\s*([\s\S]+)$/); if (m) txt = m[1];
    const disk = JSON.parse(txt);
    if (!disk || typeof disk !== "object") return false;
    // Merge: local-state-set-after-disk-write wins; otherwise disk fills in
    let added = 0, skipped = 0;
    for (const uuid in disk) {
      const local = STATE[uuid];
      const fromDisk = disk[uuid];
      if (!local) { STATE[uuid] = fromDisk; added++; }
      else { skipped++; }  // local wins
    }
    STATE_DISK_MTIME = Date.now();
    saveState();
    if (added) toast(`Merged ${added} decisions from disk (${skipped} kept local)`, "ok");
    return true;
  } catch (e) {
    // No state file yet, or unreadable — silently fall back to localStorage only
    return false;
  }
}

let CHATS = [];
let SORT = { col: "score", dir: "desc" };
let EXPANDED = new Set();
let SELECTED = null;
let UI = {
  lane: "",
  mode: "",
  unfinished: false,
  repsOnly: true,
  hidePkg: false,
};

// ─── Utilities ─────────────────────────────────────────────────────────────
function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normTitle(s) { return (s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function laneHeuristic(text) {
  const t = (text || "").toLowerCase();
  const scores = { personal: 0, intinc: 0, freelance: 0, kinsley: 0 };
  for (const lane in LANE_KEYWORDS) for (const kw of LANE_KEYWORDS[lane]) if (t.includes(kw)) scores[lane] += 1;
  scores.intinc *= 2; scores.kinsley *= 2; scores.freelance *= 2;
  let best = "unknown", bestScore = 0;
  for (const k in scores) if (scores[k] > bestScore) { best = k; bestScore = scores[k]; }
  return bestScore === 0 ? "unknown" : best;
}
function isPackaged(title) {
  const t = normTitle(title); if (!t) return false;
  return PACKAGED_TITLES.some(p => { const np = normTitle(p); return t === np || t.includes(np) || np.includes(t); });
}
function applyLane(c) {
  const st = rowState(c.uuid);
  if (st.lane) { c._lane = st.lane; c._laneSource = "user"; }
  else { c._lane = laneHeuristic(c.title); c._laneSource = "auto"; }
}
function findChat(uuid) { return CHATS.find(c => c.uuid === uuid); }

// ─── Status + toasts ───────────────────────────────────────────────────────
function setStatus(text, kind) {
  const el = document.getElementById("status");
  el.classList.remove("ok", "busy", "err");
  if (kind) el.classList.add(kind);
  document.getElementById("statusText").textContent = text;
}
function toast(msg, kind = "info", ttl = 4000) {
  const container = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  const icon = { ok: "✓", err: "⚠", warn: "⚠", info: "ℹ" }[kind] || "•";
  el.innerHTML = `<span>${icon}</span><span>${escapeHtml(msg)}</span><button class="close">×</button>`;
  el.querySelector(".close").onclick = () => el.remove();
  container.appendChild(el);
  if (ttl) setTimeout(() => el.remove(), ttl);
}

// ─── Modal ─────────────────────────────────────────────────────────────────
function openModal(title, body, actions) {
  const root = document.getElementById("modalRoot");
  const html = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header"><h3>${title}</h3></div>
        <div class="modal-body">${body}</div>
        <div class="modal-actions">${actions || ""}</div>
      </div>
    </div>`;
  root.innerHTML = html;
  root.querySelector("#modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeModal(); });
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }

// ─── Onboarding ────────────────────────────────────────────────────────────
function renderOnboard() {
  if (localStorage.getItem(ONBOARD_KEY)) return;
  document.getElementById("onboard").innerHTML = `
    <div class="onboard">
      <div class="icon">🎯</div>
      <div class="text">
        <strong>Triage 3,540 chats → ship the best as packages.</strong>
        <ol>
          <li>Use lane chips to focus on one work stream at a time.</li>
          <li>Click <strong>Extract</strong> on chats worth productizing, or <strong>Skip</strong> ones that aren't.</li>
          <li>Hit <strong>Send →</strong> to push a single extraction prompt to chat. One at a time, no batches.</li>
        </ol>
      </div>
      <button id="dismissOnboard" title="Dismiss">×</button>
    </div>`;
  document.getElementById("dismissOnboard").onclick = () => {
    localStorage.setItem(ONBOARD_KEY, "1");
    document.getElementById("onboard").innerHTML = "";
  };
}

// ─── Data load ─────────────────────────────────────────────────────────────
async function loadFromDisk() {
  if (!window.cowork?.callMcpTool) {
    setStatus("no MCP bridge", "err");
    return false;
  }
  setStatus("loading…", "busy");
  try {
    const r = await window.cowork.callMcpTool("mcp__Desktop_Commander__read_file", { path: TRIAGE_PATH });
    let txt = r?.content ?? r?.text ?? r?.result?.content ?? r;
    if (typeof txt === "object" && txt?.content) txt = txt.content;
    if (typeof txt !== "string") txt = JSON.stringify(txt);
    const m = txt.match(/^\[Reading[^\]]+\]\s*([\s\S]+)$/);
    if (m) txt = m[1];
    const data = JSON.parse(txt);
    if (!Array.isArray(data)) throw new Error("not an array");
    CHATS = data;
    setStatus(`${CHATS.length.toLocaleString()} chats loaded`, "ok");
    toast(`Loaded ${CHATS.length.toLocaleString()} chats from disk`, "ok");
    return true;
  } catch (e) {
    setStatus("load failed", "err");
    toast("Disk load failed: " + String(e).slice(0, 80), "err", 6000);
    return false;
  }
}

function preprocess() {
  document.getElementById("totalCount").textContent = CHATS.length.toLocaleString();
  for (const c of CHATS) { applyLane(c); c._packaged = isPackaged(c.title); }
}

// ─── Filtering ─────────────────────────────────────────────────────────────
function filterChats(chats) {
  const minScore = parseFloat(document.getElementById("filterScore").value) || 0;
  const dec = document.getElementById("filterDecision").value;
  const q = document.getElementById("filterSearch").value.toLowerCase().trim();
  return chats.filter(c => {
    if (c.score < minScore) return false;
    if (UI.mode && c.mode !== UI.mode) return false;
    if (UI.unfinished && !(c.flags || []).some(x => x === "unfinished-build" || x === "asks-to-continue" || x === "truncated")) return false;
    if (UI.repsOnly && c.is_representative === false) return false;
    if (UI.hidePkg && c._packaged) return false;
    if (UI.lane && c._lane !== UI.lane) return false;
    if (dec) { const d = rowState(c.uuid).decision || "none"; if (d !== dec) return false; }
    if (q && !(c.title || "").toLowerCase().includes(q)) return false;
    return true;
  });
}
function sortChats(chats) {
  const dir = SORT.dir === "asc" ? 1 : -1;
  return chats.slice().sort((a, b) => {
    const av = a[SORT.col], bv = b[SORT.col];
    if (av == null) return 1; if (bv == null) return -1;
    return (av > bv ? 1 : av < bv ? -1 : 0) * dir;
  });
}

// ─── Stats ─────────────────────────────────────────────────────────────────
function renderStats(visible) {
  const byLane = { personal:0, intinc:0, freelance:0, kinsley:0, skip:0, unknown:0 };
  const byDec  = { none:0, extract:0, skip:0, defer:0, done:0 };
  let pkg = 0;
  for (const c of CHATS) byLane[c._lane] = (byLane[c._lane] || 0) + 1;
  for (const c of visible) {
    const d = rowState(c.uuid).decision || "none";
    byDec[d] = (byDec[d] || 0) + 1;
    if (c._packaged) pkg++;
  }
  for (const k in byLane) {
    const el = document.getElementById("lc-" + k); if (el) el.textContent = byLane[k];
  }
  document.getElementById("lc-all").textContent = CHATS.length;
  document.getElementById("stats").innerHTML = `
    <span class="stat"><strong>${visible.length.toLocaleString()}</strong> visible of ${CHATS.length.toLocaleString()}</span>
    <span class="stat-divider">·</span>
    <span class="stat">to extract: <strong>${byDec.extract}</strong></span>
    <span class="stat">skipped: <strong>${byDec.skip}</strong></span>
    <span class="stat">deferred: <strong>${byDec.defer}</strong></span>
    <span class="stat">done: <strong>${byDec.done}</strong></span>
    <span class="stat-divider">·</span>
    <span class="stat" style="color:var(--bad)">packaged in view: <strong>${pkg}</strong></span>
  `;
}

// ─── Render rows ───────────────────────────────────────────────────────────
function renderFlags(c) {
  const flagsHtml = (c.flags || []).map(f => {
    if (f.startsWith("dup")) return `<span class="flag dup" title="Near-duplicate of ${escapeHtml(f.replace(/^dup~?/, ""))}">dup</span>`;
    const m = FLAG_LABEL[f];
    if (m) return `<span class="flag ${m.cls}" title="${escapeHtml(m.title)}">${m.label}</span>`;
    return `<span class="flag" title="${escapeHtml(f)}">${escapeHtml(f.replace(/-/g, " "))}</span>`;
  }).join("");
  const pkgFlag = c._packaged ? `<span class="flag pkg" title="Already in extracted-packages/INDEX.md — extracting again is waste">PKG</span>` : "";
  return pkgFlag + flagsHtml;
}

function renderRow(c) {
  const st = rowState(c.uuid);
  const dec = st.decision || "none";
  const tr = document.createElement("tr");
  tr.className = "data" + (c._packaged ? " packaged" : "") + (dec === "done" ? " done" : "") + (SELECTED === c.uuid ? " selected" : "");
  tr.dataset.uuid = c.uuid;
  const scoreCls = c.score >= 90 ? "hi" : c.score >= 80 ? "mid" : "";
  const laneSrcMark = c._laneSource === "user" ? "👤" : c._laneSource === "content" ? "✓" : "⚡";
  const laneSrcTitle = c._laneSource === "user" ? "manual override" : c._laneSource === "content" ? "verified via content" : "title heuristic";
  tr.innerHTML = `
    <td class="score-cell ${scoreCls}">
      ${c.score?.toFixed?.(1) ?? c.score}
      <span class="bar"><i style="width:${Math.min(100, c.score)}%"></i></span>
    </td>
    <td class="title-cell">
      ${escapeHtml(c.title || "(untitled)")}
      <span class="meta">${escapeHtml((c.created || "").slice(0,10))}${c.created ? " · " : ""}cluster ${c.cluster ?? "—"}</span>
    </td>
    <td>${c.msg_count ?? "—"}</td>
    <td><span class="flag">${escapeHtml(c.mode || "")}</span></td>
    <td>${renderFlags(c)}</td>
    <td class="lane-cell">
      <span class="lane-chip lane-${c._lane}" data-act="cycleLane" title="${laneSrcTitle} — click to change">
        ${c._lane}
      </span>
      <span class="lane-source" title="${laneSrcTitle}">${laneSrcMark}</span>
    </td>
    <td class="decision-cell">
      <button class="dec-btn extract ${dec==='extract'?'active':''}" data-act="dec" data-val="extract" title="Mark to extract (X)">Extract</button>
      <button class="dec-btn skip ${dec==='skip'?'active':''}" data-act="dec" data-val="skip" title="Skip (S)">Skip</button>
      <button class="dec-btn defer ${dec==='defer'?'active':''}" data-act="dec" data-val="defer" title="Defer (D)">Defer</button>
      <button class="dec-btn done ${dec==='done'?'active':''}" data-act="dec" data-val="done">Done</button>
    </td>
    <td class="actions-cell">
      <button class="row-btn" data-act="expand" title="Expand (Enter)">${EXPANDED.has(c.uuid) ? "▼" : "▶"}</button>
      <button class="row-btn magic" data-act="ai" title="AI summary">✨</button>
      <button class="row-btn" data-act="prompts-menu" title="Generate other prompts for this chat">▾</button>
      <button class="row-btn primary" data-act="send" title="Send extraction prompt to chat">Send →</button>
    </td>
  `;
  return tr;
}

function renderExpand(c) {
  const st = rowState(c.uuid);
  const tr = document.createElement("tr");
  tr.className = "expand";
  tr.dataset.expandFor = c.uuid;
  const comp = c.components || {};
  const compHtml = ["depth","code","artifacts","intent","filetree","unfinished","summary"].map(k => {
    const v = comp[k] ?? 0; const pct = Math.round((v || 0) * 100);
    const cls = pct >= 80 ? "high" : "";
    return `<div class="comp ${cls}"><div class="label">${k}</div><div class="val">${(v?.toFixed?.(2) ?? v) || "—"}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
  tr.innerHTML = `
    <td colspan="8">
      <div class="expand-body">
        <div class="panel">
          <h4>Score components</h4>
          <div class="comp-grid">${compHtml}</div>
          <div class="path">📄 ${escapeHtml(c.path || "")}</div>
          <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
            <button class="ctrl-btn" data-act="preview">Preview chat</button>
            <button class="ctrl-btn" data-act="recheck">Verify lane via content</button>
            <span class="lane-source" style="margin-left:auto;align-self:center">human: ${(c.human_chars ?? 0).toLocaleString()} ch · assistant: ${(c.assistant_chars ?? 0).toLocaleString()} ch</span>
          </div>
          <div class="preview empty" id="prev-${c.uuid}">Click "Preview chat" to load first 200 lines</div>
          <label style="display:block;margin-top:10px;font-size:11px;color:var(--text-soft)">Notes</label>
          <textarea class="note-area" data-act="note" placeholder="Add notes about this chat…">${escapeHtml(st.note || "")}</textarea>
        </div>
        <div class="panel magic">
          <h4>✨ AI assistance</h4>
          <div class="ai-actions">
            <button class="row-btn magic" data-act="ai-summary">Summarize chat</button>
            <button class="row-btn magic" data-act="ai-shape">Suggest package shape</button>
            <button class="row-btn magic" data-act="ai-lane">Verify lane (content)</button>
          </div>
          <div class="ai-output" id="ai-${c.uuid}">Pick an action above. AI summaries use the chat's metadata + content snippet.</div>
        </div>
      </div>
    </td>
  `;
  return tr;
}

function render() {
  if (!CHATS.length) {
    document.getElementById("tbody").innerHTML = `
      <tr><td colspan="8">
        <div class="empty">
          <div class="icon">📥</div>
          <h3>No data loaded</h3>
          <p>Triage data should load automatically from disk via Desktop Commander.</p>
          <button class="ctrl-btn primary" onclick="(async()=>{ if(await loadFromDisk()){ preprocess(); render(); } })()">↻ Retry load</button>
        </div>
      </td></tr>`;
    return;
  }
  document.querySelectorAll(".chip[data-lane]").forEach(el => el.classList.toggle("active", el.dataset.lane === UI.lane));
  document.querySelectorAll(".chip[data-mode]").forEach(el => el.classList.toggle("active", el.dataset.mode === UI.mode));
  document.getElementById("filterUnfinished").classList.toggle("active", UI.unfinished);
  document.getElementById("filterRep").classList.toggle("active", UI.repsOnly);
  document.getElementById("filterHidePkg").classList.toggle("active", UI.hidePkg);

  const visible = sortChats(filterChats(CHATS));
  renderStats(visible);
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  const slice = visible.slice(0, 500);
  for (const c of slice) {
    tbody.appendChild(renderRow(c));
    if (EXPANDED.has(c.uuid)) tbody.appendChild(renderExpand(c));
  }
  if (visible.length > 500) {
    const note = document.createElement("tr");
    note.innerHTML = `<td colspan="8" class="empty">Showing first 500 of ${visible.length}. Narrow filters to see more.</td>`;
    tbody.appendChild(note);
  } else if (!visible.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty"><div class="icon">🪙</div><h3>No matches</h3><p>Try widening filters — lower the min score, change lane, or clear search.</p></div></td></tr>`;
  }
}

function buildPrompt(key, c, sel) {
  const t = PROMPT_TEMPLATES[key]; if (!t) return "";
  if (t.scope === "row") return t.builder(c);
  if (t.scope === "global") return t.builder();
  if (t.scope === "selection") return t.builder(sel || []);
  return "";
}

function getSelection() {
  return CHATS.filter(c => rowState(c.uuid).decision === "extract");
}

function openPromptModal(promptText, title) {
  openModal(title || "Generated prompt", `
    <p style="margin:0 0 8px;color:var(--text-mute);font-size:12px">Preview — copy or send to chat.</p>
    <pre style="white-space:pre-wrap;background:var(--surface);padding:10px 12px;border-radius:6px;font-size:11px;font-family:ui-monospace,Menlo,monospace;max-height:340px;overflow:auto;border:1px solid var(--border)">${escapeHtml(promptText)}</pre>
  `, `
    <button class="ctrl-btn" onclick="closeModal()">Cancel</button>
    <button class="ctrl-btn" id="copyPrompt">⎘ Copy</button>
    <button class="ctrl-btn primary" id="sendPrompt">Send → chat</button>
  `);
  document.getElementById("copyPrompt").onclick = () => {
    navigator.clipboard?.writeText(promptText).then(
      () => { closeModal(); toast("Prompt copied to clipboard", "ok"); },
      () => toast("Clipboard write failed", "err"),
    );
  };
  document.getElementById("sendPrompt").onclick = () => {
    if (!window.cowork?.sendPrompt) { toast("sendPrompt unavailable", "err"); return; }
    window.cowork.sendPrompt(promptText);
    closeModal();
    toast("Prompt sent to chat", "ok");
  };
}

function openPromptMenu(scope, c, group) {
  // scope: "row" | "global" | "distribute-row" | "distribute-global"
  // group filter is optional — if set, only templates in that group show
  const items = Object.entries(PROMPT_TEMPLATES).filter(([_, t]) => {
    if (group && t.group !== group) return false;
    if (!group && t.group === "distribute") return false; // organize menu hides distribute templates
    if (scope === "row" || scope === "distribute-row") return t.scope === "row";
    return t.scope === "global" || t.scope === "selection";
  });
  const html = items.map(([key, t]) => {
    let extra = "";
    if (t.scope === "selection") {
      const n = getSelection().length;
      extra = ` <span style="color:var(--magic);font-weight:500">(${n} marked Extract)</span>`;
    }
    return `<button class="ctrl-btn" data-act="prompt-template" data-key="${key}" style="text-align:left;display:block;width:100%;margin-bottom:6px;padding:10px 12px;background:var(--bg)">
      <strong style="display:block;color:var(--text);font-size:13px">${escapeHtml(t.label)}${extra}</strong>
      <span style="display:block;color:var(--text-mute);font-size:11px;margin-top:2px;font-weight:400">${escapeHtml(t.desc)}</span>
    </button>`;
  }).join("");
  const title = (scope === "row" || scope === "distribute-row")
    ? (group === "distribute" ? `Distribute "${escapeHtml(c?.title || '')}"` : `Generate prompt for "${escapeHtml(c?.title || '')}"`)
    : (group === "distribute" ? "Generate distribution prompt" : "Generate organization prompt");
  openModal(title, items.length ? html : `<div style="color:var(--text-mute);font-style:italic;padding:8px">No templates available for this scope.</div>`,
    `<button class="ctrl-btn" onclick="closeModal()">Cancel</button>`);
  // wire up template clicks
  document.querySelector(".modal-body").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act='prompt-template']");
    if (!btn) return;
    const key = btn.dataset.key;
    const prompt = buildPrompt(key, c, getSelection());
    const title = PROMPT_TEMPLATES[key].label;
    closeModal();
    setTimeout(() => openPromptModal(prompt, title), 60);
  });
}

// ─── AI helpers ────────────────────────────────────────────────────────────
async function readChatHead(c, lines = 200) {
  if (!window.cowork?.callMcpTool) return null;
  const r = await window.cowork.callMcpTool("mcp__Desktop_Commander__read_file", {
    path: CHAT_ROOT + (c.path || "").replace(/\//g, "\\"),
    length: lines,
  });
  let txt = r?.content ?? r?.text ?? r?.result?.content ?? r;
  if (typeof txt === "object" && txt?.content) txt = txt.content;
  return typeof txt === "string" ? txt : String(txt);
}

async function callAI(prompt, data, target) {
  if (!window.cowork?.askClaude) {
    target.innerHTML = `<span style="color:var(--bad)">AI unavailable — askClaude API not present in this Cowork build.</span>`;
    return;
  }
  target.className = "ai-output busy";
  target.textContent = "thinking…";
  try {
    const result = await window.cowork.askClaude(prompt, data || []);
    target.className = "ai-output";
    const text = typeof result === "string" ? result : (result?.text || JSON.stringify(result, null, 2));
    // Light markdown: **bold** + paragraph breaks
    const safe = escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n\n+/g, "</p><p>")
      .replace(/\n/g, "<br>");
    target.innerHTML = `<p>${safe}</p>`;
  } catch (e) {
    target.className = "ai-output err";
    target.textContent = "AI call failed: " + String(e).slice(0, 200);
  }
}

async function aiSummarize(c, target) {
  const head = await readChatHead(c, 300).catch(() => null);
  const prompt = `You are summarizing a Claude conversation that was triaged for potential extraction into a deliverable package.

Title: ${c.title}
Mode suggested: ${c.mode}
Score: ${c.score}/100
Message count: ${c.msg_count}
Flags: ${(c.flags||[]).join(", ") || "none"}

Below are the first ~300 lines of the chat. In 4-6 sentences, answer:
1. What is the user trying to build or solve?
2. Did the chat reach a shippable artifact, or did it stall?
3. What kind of deliverable package would be the right next step (PRD, code module, prompt pack, docs)?

Be concrete. Avoid generic phrases. If you can't tell, say so.

CHAT CONTENT:
${(head || "").slice(0, 8000)}`;
  await callAI(prompt, [], target);
}

async function aiShape(c, target) {
  const prompt = `Given this triaged chat, recommend a package shape. Be specific to the actual content/title — no generic templates.

Title: ${c.title}
Mode suggested by triage: ${c.mode}
Score: ${c.score}/100, ${c.msg_count} messages
Flags: ${(c.flags||[]).join(", ") || "none"}
Lane: ${c._lane}

Score components: ${JSON.stringify(c.components || {})}

Output in 3 sections:
**Package type:** (ZIP_SPEC | CODEKIT | DOCS_ONLY | PROMPTS_ONLY) — with one-line reason
**Key sections:** bullet list of 4-7 sections the package should contain
**Risks:** 1-3 things that might make this hard to extract cleanly`;
  await callAI(prompt, [], target);
}

async function aiVerifyLane(c, target) {
  const head = await readChatHead(c, 100).catch(() => null);
  const prompt = `Classify this chat into one of: personal, intinc, freelance, kinsley, skip, unknown.

Definitions (from Kyle's working lane rules):
- intinc: AI enablement at INT Technology Services, internal tooling, SOC 2 work, MSM/Kixie/FreshService/Kaseya/Bitdefender, "The Prompt" newsletter
- personal: FlashFusion, ChaosClubCo, Kyle's own sellable kits, anything Cowork/Claude Code skills
- freelance: per-client work, Customization Service
- kinsley: kids/family app
- skip: low-value (career chats, ideation only, abandoned)
- unknown: can't tell

Title: ${c.title}
Current title-only guess: ${c._lane}

First 100 lines:
${(head || "").slice(0, 4000)}

Output ONLY one of: personal, intinc, freelance, kinsley, skip, unknown — followed by a single sentence reason.`;
  if (!window.cowork?.askClaude) { target.innerHTML = `<span style="color:var(--bad)">AI unavailable</span>`; return; }
  target.className = "ai-output busy"; target.textContent = "verifying lane…";
  try {
    const r = await window.cowork.askClaude(prompt, []);
    const txt = (typeof r === "string" ? r : r?.text || "").trim();
    const m = txt.match(/\b(personal|intinc|freelance|kinsley|skip|unknown)\b/i);
    target.className = "ai-output";
    if (m) {
      const lane = m[1].toLowerCase();
      c._lane = lane; c._laneSource = "content";
      const st = rowState(c.uuid); st.lane = lane; saveState();
      target.innerHTML = `<strong>Lane:</strong> <span class="lane-chip lane-${lane}">${lane}</span><p style="margin-top:6px">${escapeHtml(txt.replace(m[0], "").replace(/^[\s:—\-]+/, "").trim())}</p>`;
      render();
      toast(`Lane verified: ${lane}`, "ok");
    } else {
      target.innerHTML = escapeHtml(txt);
    }
  } catch (e) {
    target.className = "ai-output err";
    target.textContent = "verify failed: " + String(e).slice(0, 200);
  }
}

async function aiTopPicks() {
  if (!window.cowork?.askClaude) { toast("askClaude unavailable in this Cowork build", "err"); return; }
  const visible = sortChats(filterChats(CHATS)).slice(0, 30);
  if (!visible.length) { toast("No visible chats to pick from", "warn"); return; }
  const data = visible.map(c => ({
    uuid: c.uuid, title: c.title, score: c.score, msgs: c.msg_count,
    mode: c.mode, flags: c.flags, lane: c._lane, packaged: c._packaged,
  }));
  const prompt = `You are advising Kyle on which Claude chats to productize into extraction packages NEXT.

I'll give you the top 30 chats from his current filtered view. Pick the 5 he should extract this week. Apply this judgment:

- Strongly prefer chats flagged "unfinished-build" or "asks-to-continue" — thinking is done, artifact never shipped.
- Strongly avoid chats marked packaged:true — those are already done.
- Prefer chats with thematically novel content (don't recommend 3 similar topics).
- Personal lane is preferred for this kit; INTINC chats go in a different lane.

Output a JSON array of 5 picks. Each: { "uuid": "...", "rank": 1-5, "why": "one sentence on why this one" }
Just the JSON, no preamble.`;
  const picksDiv = document.getElementById("aiPicks");
  picksDiv.innerHTML = `<div class="ai-picks"><h4>✨ AI picks (thinking…)</h4><div class="picks-list" id="picksList"></div></div>`;
  try {
    const r = await window.cowork.askClaude(prompt, data);
    const txt = typeof r === "string" ? r : r?.text || JSON.stringify(r);
    const jsonMatch = txt.match(/\[[\s\S]*\]/);
    if (!jsonMatch) throw new Error("No JSON array in response");
    const picks = JSON.parse(jsonMatch[0]);
    const html = picks.map(p => {
      const c = findChat(p.uuid);
      if (!c) return "";
      return `<div class="pick" data-uuid="${escapeHtml(c.uuid)}" data-act="jump-pick">
        <span class="num">#${p.rank}</span>
        <div class="title">${escapeHtml(c.title)}<span class="why"> — ${escapeHtml(p.why)}</span></div>
        <span class="lane-chip lane-${c._lane}">${c._lane}</span>
        <span class="score-cell">${c.score?.toFixed?.(1) ?? c.score}</span>
      </div>`;
    }).join("");
    picksDiv.innerHTML = `<div class="ai-picks">
      <h4>✨ AI picks <span style="color:var(--text-mute);font-weight:400;text-transform:none;font-size:11px;margin-left:6px">from current filtered view</span></h4>
      <div class="picks-list">${html}</div>
      <div class="actions">
        <button class="ctrl-btn" id="dismissPicks">Dismiss</button>
        <button class="ctrl-btn primary" id="markAllExtract">Mark all as Extract</button>
      </div>
    </div>`;
    document.getElementById("dismissPicks").onclick = () => picksDiv.innerHTML = "";
    document.getElementById("markAllExtract").onclick = () => {
      for (const p of picks) { const st = rowState(p.uuid); st.decision = "extract"; }
      saveState(); render();
      toast(`${picks.length} marked as Extract`, "ok");
    };
    toast(`AI picked ${picks.length} chats`, "ok");
  } catch (e) {
    picksDiv.innerHTML = `<div class="ai-picks"><h4>✨ AI picks</h4><div style="color:var(--bad)">Failed: ${escapeHtml(String(e).slice(0,200))}</div><div class="actions"><button class="ctrl-btn" onclick="document.getElementById('aiPicks').innerHTML=''">Dismiss</button></div></div>`;
  }
}

// ─── Actions ───────────────────────────────────────────────────────────────
async function previewChat(c, target) {
  target.classList.remove("empty");
  target.textContent = "loading…";
  try {
    const txt = await readChatHead(c, 200);
    target.textContent = (txt || "").slice(0, 8000);
  } catch (e) {
    target.textContent = "preview failed: " + String(e).slice(0, 200);
  }
}

async function recheckLane(c) {
  const target = document.getElementById("ai-" + c.uuid);
  if (target) await aiVerifyLane(c, target);
}

function setDecision(c, val) {
  const st = rowState(c.uuid);
  st.decision = (st.decision === val) ? null : val;
  saveState(); render();
}

function cycleLane(c) {
  const order = ["personal","intinc","freelance","kinsley","skip","unknown"];
  const i = order.indexOf(c._lane);
  const next = order[(i + 1) % order.length];
  const st = rowState(c.uuid);
  st.lane = next; c._lane = next; c._laneSource = "user";
  saveState(); render();
  toast(`Lane → ${next}`, "info", 1500);
}

async function sendOne(c) {
  if (!window.cowork?.sendPrompt) {
    openModal("Send not available", `Cowork sendPrompt API isn't present. Copy this manually:<pre style="white-space:pre-wrap;background:var(--surface);padding:10px;border-radius:6px;font-size:11px;margin-top:8px">${escapeHtml(buildExtractPrompt(c))}</pre>`,
      `<button class="ctrl-btn" onclick="closeModal()">Close</button>`);
    return;
  }
  // Lane firewall — block sends for non-personal lanes by default
  const firewall = LANE_DIST[c._lane] || LANE_DIST.unknown;
  const blocked = !firewall.external && c._lane !== "personal";
  const firewallWarning = blocked
    ? `<div style="background:var(--bad-soft);border:1px solid #fca5a5;border-radius:6px;padding:10px;margin:8px 0">
         <strong style="color:var(--bad)">🛑 Lane firewall: ${c._lane}</strong>
         <p style="margin:6px 0 0;color:var(--text);font-size:12px">${escapeHtml(firewall.reason)}</p>
         <p style="margin:6px 0 0;color:var(--text-mute);font-size:11px">Override only if you're confident this is the right lane. Use the lane chip to change it first if it isn't.</p>
       </div>` : '';
  const pkgWarning = c._packaged
    ? '<p style="color:var(--bad);font-size:12px"><strong>⚠ This chat appears already packaged.</strong> Sending will likely produce a duplicate package.</p>' : '';
  openModal("Send extraction prompt?", `
    <p>One single extraction prompt for:</p>
    <p><strong>${escapeHtml(c.title)}</strong></p>
    <p style="color:var(--text-mute);font-size:12px">Score ${c.score} · ${c.msg_count} msgs · mode ${c.mode} · lane ${c._lane}</p>
    ${firewallWarning}
    ${pkgWarning}
  `, `
    <button class="ctrl-btn" onclick="closeModal()">Cancel</button>
    <button class="ctrl-btn ${blocked ? 'warn' : 'primary'}" id="confirmSend">${blocked ? '⚠ Override + Send' : 'Send →'}</button>
  `);
  document.getElementById("confirmSend").onclick = () => {
    closeModal();
    window.cowork.sendPrompt(buildExtractPrompt(c));
    const st = rowState(c.uuid);
    st.sentAt = Date.now();
    if (!st.decision) st.decision = "extract";
    saveState(); render();
    toast(`Sent: ${c.title.slice(0,60)}`, "ok");
  };
}

// ─── Event delegation ──────────────────────────────────────────────────────
document.addEventListener("click", async (e) => {
  // Toolbar chips
  const chip = e.target.closest(".chip[data-lane], .chip[data-mode], .chip[data-toggle]");
  if (chip) {
    if (chip.dataset.lane !== undefined) UI.lane = chip.dataset.lane;
    else if (chip.dataset.mode !== undefined) UI.mode = chip.dataset.mode;
    else if (chip.dataset.toggle) {
      const k = { unfinished:"unfinished", rep:"repsOnly", hidepkg:"hidePkg" }[chip.dataset.toggle];
      UI[k] = !UI[k];
    }
    render(); return;
  }
  // Sort headers
  const th = e.target.closest("thead th[data-sort]");
  if (th) {
    const col = th.dataset.sort;
    if (SORT.col === col) SORT.dir = SORT.dir === "asc" ? "desc" : "asc";
    else { SORT.col = col; SORT.dir = "desc"; }
    render(); return;
  }
  // Pick row click → expand
  const pick = e.target.closest("[data-act='jump-pick']");
  if (pick) {
    const u = pick.dataset.uuid;
    EXPANDED.add(u); SELECTED = u;
    render();
    const el = document.querySelector(`tr[data-uuid='${u}']`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  // Row buttons
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const tr = btn.closest("tr");
  const uuid = tr?.dataset.uuid || tr?.dataset.expandFor;
  const c = uuid && findChat(uuid);
  const act = btn.dataset.act;
  if (act === "dec" && c) { setDecision(c, btn.dataset.val); }
  else if (act === "expand" && c) { EXPANDED.has(c.uuid) ? EXPANDED.delete(c.uuid) : EXPANDED.add(c.uuid); SELECTED = c.uuid; render(); }
  else if (act === "send" && c) { await sendOne(c); }
  else if (act === "prompts-menu" && c) { openPromptMenu("row", c); }
  else if (act === "ai" && c) { EXPANDED.add(c.uuid); SELECTED = c.uuid; render(); setTimeout(() => { const t = document.getElementById("ai-" + c.uuid); if (t) aiSummarize(c, t); }, 50); }
  else if (act === "preview" && c) { const t = document.getElementById("prev-" + c.uuid); if (t) previewChat(c, t); }
  else if (act === "recheck" && c) { await recheckLane(c); }
  else if (act === "ai-summary" && c) { const t = document.getElementById("ai-" + c.uuid); if (t) aiSummarize(c, t); }
  else if (act === "ai-shape" && c) { const t = document.getElementById("ai-" + c.uuid); if (t) aiShape(c, t); }
  else if (act === "ai-lane" && c) { const t = document.getElementById("ai-" + c.uuid); if (t) aiVerifyLane(c, t); }
  else if (act === "cycleLane" && c) { cycleLane(c); }
});

// span[data-act='cycleLane'] is not a button; listen on click for spans too
document.addEventListener("click", (e) => {
  const span = e.target.closest("span[data-act='cycleLane']");
  if (!span) return;
  const tr = span.closest("tr"); const c = tr && findChat(tr.dataset.uuid);
  if (c) cycleLane(c);
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "filterScore" || t.id === "filterDecision") { render(); return; }
  if (t.dataset.act === "note") {
    const ex = t.closest("tr.expand"); const c = ex && findChat(ex.dataset.expandFor);
    if (c) { rowState(c.uuid).note = t.value; saveState(); }
  }
});

document.getElementById("filterSearch").addEventListener("input", () => render());
document.getElementById("refreshBtn").onclick = async () => { if (await loadFromDisk()) { preprocess(); render(); } };
document.getElementById("aiPicksBtn").onclick = () => aiTopPicks();
document.getElementById("organizeBtn").onclick = () => openPromptMenu("global", null);
document.getElementById("distributeBtn").onclick = () => openPromptMenu("global", null, "distribute");
document.getElementById("exportBtn").onclick = () => {
  const visible = sortChats(filterChats(CHATS));
  const out = visible.map(c => ({
    score: c.score, title: c.title, mode: c.mode, msgs: c.msg_count,
    lane: c._lane, packaged: c._packaged, decision: rowState(c.uuid).decision || null,
    path: c.path, uuid: c.uuid, flags: c.flags,
  }));
  navigator.clipboard?.writeText(JSON.stringify(out, null, 2)).then(
    () => toast(`Copied ${out.length} rows`, "ok"),
    () => toast("Clipboard write failed", "err"),
  );
};
document.getElementById("resetBtn").onclick = () => {
  openModal("Reset all tags + decisions?", "This clears every Extract/Skip/Defer/Done flag and lane override across all 3,540 chats. <strong>Can't be undone.</strong>", `
    <button class="ctrl-btn" onclick="closeModal()">Cancel</button>
    <button class="ctrl-btn warn" id="confirmReset">Reset everything</button>
  `);
  document.getElementById("confirmReset").onclick = () => {
    STATE = {}; localStorage.removeItem(STATE_KEY);
    for (const c of CHATS) applyLane(c);
    closeModal(); render(); toast("State cleared", "warn");
  };
};
document.getElementById("helpBtn").onclick = () => {
  openModal("⌨ Keyboard shortcuts", `
    <div class="kbd-grid">
      <kbd>/</kbd><span>Focus search</span>
      <kbd>J</kbd><span>Next row</span>
      <kbd>K</kbd><span>Previous row</span>
      <kbd>Enter</kbd><span>Expand selected row</span>
      <kbd>X</kbd><span>Mark Extract</span>
      <kbd>S</kbd><span>Mark Skip</span>
      <kbd>D</kbd><span>Mark Defer</span>
      <kbd>?</kbd><span>Show this help</span>
      <kbd>Esc</kbd><span>Close modal / clear selection</span>
    </div>
    <p style="margin-top:14px;color:var(--text-mute);font-size:12px">Lane chips on each row cycle through lanes when clicked. ✨ buttons invoke AI.</p>
  `, `<button class="ctrl-btn" onclick="closeModal()">Got it</button>`);
};

// Keyboard navigation
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea,select")) {
    if (e.key === "Escape") { e.target.blur(); }
    return;
  }
  if (e.key === "/") { e.preventDefault(); document.getElementById("filterSearch").focus(); return; }
  if (e.key === "?") { e.preventDefault(); document.getElementById("helpBtn").click(); return; }
  if (e.key === "Escape") { closeModal(); SELECTED = null; render(); return; }
  const rows = Array.from(document.querySelectorAll("tr.data"));
  const idx = rows.findIndex(r => r.dataset.uuid === SELECTED);
  const sel = (i) => { const r = rows[Math.max(0, Math.min(rows.length-1, i))]; if (r) { SELECTED = r.dataset.uuid; r.scrollIntoView({block:"nearest"}); render(); } };
  if (e.key === "j") { e.preventDefault(); sel(idx + 1); }
  else if (e.key === "k") { e.preventDefault(); sel(idx - 1); }
  else if (e.key === "Enter" && SELECTED) {
    e.preventDefault();
    const c = findChat(SELECTED);
    if (c) { EXPANDED.has(c.uuid) ? EXPANDED.delete(c.uuid) : EXPANDED.add(c.uuid); render(); }
  } else if ((e.key === "x" || e.key === "X") && SELECTED) {
    e.preventDefault(); const c = findChat(SELECTED); if (c) setDecision(c, "extract");
  } else if ((e.key === "s" || e.key === "S") && SELECTED) {
    e.preventDefault(); const c = findChat(SELECTED); if (c) setDecision(c, "skip");
  } else if ((e.key === "d" || e.key === "D") && SELECTED) {
    e.preventDefault(); const c = findChat(SELECTED); if (c) setDecision(c, "defer");
  }
});

// ─── Boot ──────────────────────────────────────────────────────────────────
(async () => {
  renderOnboard();
  setStatus("waiting for MCP bridge…", "busy");
  // Brief retry loop in case MCP bridge isn't ready at first paint
  let loaded = false;
  for (let i = 0; i < 5 && !loaded; i++) {
    if (window.cowork?.callMcpTool) { loaded = await loadFromDisk(); break; }
    await new Promise(r => setTimeout(r, 400));
  }
  if (loaded) {
    preprocess();
    // Try to merge shared state from disk (silent if missing)
    await mergeStateFromDisk();
    render();
  }
  else { setStatus("MCP unavailable", "err"); render(); }
})();
</script>
