<!-- 
  AI Workflow Consulting — Lead Capture Form
  Embed this in your WordPress contact/services page.
  Replace YOUR_N8N_WEBHOOK_URL with your actual webhook URL from Workflow 4.
  
  Option A: Embed directly in WordPress (Custom HTML block)
  Option B: Use Tally.so and point its webhook to the same URL
-->

<div id="consulting-form" style="max-width: 600px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <style>
    #consulting-form label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 14px;
      color: #1a1a1a;
    }
    #consulting-form input,
    #consulting-form select,
    #consulting-form textarea {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    #consulting-form input:focus,
    #consulting-form select:focus,
    #consulting-form textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    #consulting-form button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    #consulting-form button:hover {
      background: #4f46e5;
    }
    #consulting-form button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    #consulting-form .form-success {
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      color: #065f46;
      display: none;
    }
    #consulting-form .form-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 12px;
      color: #991b1b;
      margin-bottom: 16px;
      display: none;
    }
  </style>

  <div class="form-error" id="form-error"></div>
  
  <div id="form-fields">
    <label for="cf-name">Name *</label>
    <input type="text" id="cf-name" name="name" required placeholder="Your name">

    <label for="cf-email">Email *</label>
    <input type="email" id="cf-email" name="email" required placeholder="you@company.com">

    <label for="cf-company">Company</label>
    <input type="text" id="cf-company" name="company" placeholder="Company name">

    <label for="cf-need">What do you need help with? *</label>
    <textarea id="cf-need" name="need" rows="4" required placeholder="Describe your AI workflow challenge or project..."></textarea>

    <label for="cf-budget">Budget Range</label>
    <select id="cf-budget" name="budget_range">
      <option value="Not specified">Select a range</option>
      <option value="Under $2K">Under $2,000</option>
      <option value="$2K-$5K">$2,000 — $5,000</option>
      <option value="$5K-$10K">$5,000 — $10,000</option>
      <option value="$10K+">$10,000+</option>
    </select>

    <label for="cf-source">How did you find me?</label>
    <select id="cf-source" name="how_found">
      <option value="Unknown">Select</option>
      <option value="Newsletter">The Prompt Newsletter</option>
      <option value="LinkedIn">LinkedIn</option>
      <option value="Referral">Referral</option>
      <option value="Search">Google Search</option>
      <option value="Other">Other</option>
    </select>

    <button type="button" id="cf-submit" onclick="submitForm()">Send Inquiry</button>
  </div>

  <div class="form-success" id="form-success">
    <strong>Thanks for reaching out!</strong><br>
    I'll get back to you within 48 hours.
  </div>

  <script>
    // ===========================================
    // REPLACE THIS URL WITH YOUR n8n WEBHOOK URL
    // ===========================================
    const WEBHOOK_URL = 'YOUR_N8N_WEBHOOK_URL/webhook/lead-intake';

    async function submitForm() {
      const btn = document.getElementById('cf-submit');
      const errorDiv = document.getElementById('form-error');
      errorDiv.style.display = 'none';

      const name = document.getElementById('cf-name').value.trim();
      const email = document.getElementById('cf-email').value.trim();
      const company = document.getElementById('cf-company').value.trim();
      const need = document.getElementById('cf-need').value.trim();
      const budget_range = document.getElementById('cf-budget').value;
      const how_found = document.getElementById('cf-source').value;

      // Client-side validation
      if (!name || !email || !need) {
        errorDiv.textContent = 'Please fill in all required fields.';
        errorDiv.style.display = 'block';
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorDiv.textContent = 'Please enter a valid email address.';
        errorDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, company, need, budget_range, how_found })
        });

        if (response.ok) {
          document.getElementById('form-fields').style.display = 'none';
          document.getElementById('form-success').style.display = 'block';
        } else {
          throw new Error('Server error');
        }
      } catch (e) {
        errorDiv.textContent = 'Something went wrong. Please try again or email me directly.';
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send Inquiry';
      }
    }
  </script>
</div>
