<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyle's Brilliant Moments</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0A0A0A;
    --surface:#111111;
    --surface2:#171717;
    --border:#252525;
    --border2:#2E2E2E;
    --text:#E8E4DC;
    --text2:#8C8884;
    --text3:#5A5754;
    --accent:#C8892A;
    --accent2:#E8A84A;
    --accent-dim:rgba(200,137,42,.12);
    --framework:#6B5EAD;
    --framework-bg:rgba(107,94,173,.12);
    --technical:#2E9E6B;
    --technical-bg:rgba(46,158,107,.12);
    --strategic:#B87333;
    --strategic-bg:rgba(184,115,51,.12);
    --content:#3B7EC2;
    --content-bg:rgba(59,126,194,.12);
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

  .app{display:grid;grid-template-columns:380px 1fr;height:100vh}

  /* ---- LEFT PANEL ---- */
  .left{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
  .left-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
  .left-header h1{font-family:Georgia,serif;font-size:17px;font-weight:normal;color:var(--text);letter-spacing:.3px}
  .left-header p{font-size:11px;color:var(--text3);margin-top:4px;letter-spacing:.5px;text-transform:uppercase}

  .filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
  .fp{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;letter-spacing:.2px}
  .fp:hover{border-color:var(--accent);color:var(--accent)}
  .fp.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent2)}

  .moments-list{flex:1;overflow-y:auto;padding:10px}
  .moments-list::-webkit-scrollbar{width:4px}
  .moments-list::-webkit-scrollbar-track{background:transparent}
  .moments-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

  .moment-card{padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s;position:relative}
  .moment-card:hover{border-color:var(--border2);background:var(--surface)}
  .moment-card.selected{border-color:var(--accent);background:var(--accent-dim)}
  .moment-card.selected::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:2px;height:60%;background:var(--accent);border-radius:1px}

  .mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .cat-label{font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-left:6px}
  .cat-row{display:flex;align-items:center}
  .stars{font-size:10px;color:var(--accent)}
  .mc-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:4px}
  .mc-desc{font-size:11.5px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mc-source{font-size:10px;color:var(--text3);margin-top:6px;letter-spacing:.3px}

  /* ---- RIGHT PANEL ---- */
  .right{display:flex;flex-direction:column;overflow:hidden}
  .chat-header{padding:18px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:12px}
  .selected-indicator{flex:1}
  .selected-indicator .sel-cat{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3)}
  .selected-indicator .sel-title{font-family:Georgia,serif;font-size:15px;color:var(--text);margin-top:2px}
  .hint-text{font-size:12px;color:var(--text3);font-style:italic}

  .chat-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
  .chat-messages::-webkit-scrollbar{width:4px}
  .chat-messages::-webkit-scrollbar-track{background:transparent}
  .chat-messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

  .msg{display:flex;flex-direction:column;max-width:92%}
  .msg.user{align-self:flex-end;align-items:flex-end}
  .msg.assistant{align-self:flex-start;align-items:flex-start}
  .msg-role{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
  .msg-bubble{padding:11px 15px;border-radius:10px;font-size:13.5px;line-height:1.65;border:1px solid transparent}
  .msg.user .msg-bubble{background:var(--accent-dim);border-color:rgba(200,137,42,.25);color:var(--text)}
  .msg.assistant .msg-bubble{background:var(--surface);border-color:var(--border);color:var(--text)}
  .msg.assistant .msg-bubble pre{font-family:'Courier New',monospace;font-size:12px;white-space:pre-wrap;color:var(--text2)}

  .typing-indicator{display:flex;gap:4px;padding:14px 15px;background:var(--surface);border:1px solid var(--border);border-radius:10px;width:fit-content}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:bounce .8s infinite}
  .dot:nth-child(2){animation-delay:.15s}
  .dot:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  .suggested-chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px 0;flex-shrink:0}
  .chip{font-size:12px;padding:6px 12px;border:1px solid var(--border2);border-radius:20px;background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;letter-spacing:.2px}
  .chip:hover{border-color:var(--accent);color:var(--accent2);background:var(--accent-dim)}

  .input-row{display:flex;gap:10px;padding:14px 24px 20px;flex-shrink:0;border-top:1px solid var(--border);margin-top:8px}
  .chat-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--text);font-family:inherit;resize:none;outline:none;transition:border-color .15s;line-height:1.5;min-height:42px;max-height:120px}
  .chat-input:focus{border-color:var(--accent)}
  .chat-input::placeholder{color:var(--text3)}
  .send-btn{background:var(--accent);border:none;border-radius:8px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;align-self:flex-end}
  .send-btn:hover{background:var(--accent2)}
  .send-btn:disabled{background:var(--border2);cursor:not-allowed}
  .send-btn svg{width:16px;height:16px;fill:var(--bg)}

  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text3)}
  .empty-state h2{font-family:Georgia,serif;font-size:20px;font-weight:normal;color:var(--text2)}
  .empty-state p{font-size:13px;text-align:center;max-width:300px;line-height:1.6}

  .no-results{padding:32px 16px;text-align:center;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div class="app">

  <div class="left">
    <div class="left-header">
      <h1>Brilliant Moments</h1>
      <p>Kyle Rosebrook · 12 documented</p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="moments-list" id="momentsList"></div>
  </div>

  <div class="right" id="rightPanel">
    <div class="empty-state" id="emptyState">
      <h2>Select a moment</h2>
      <p>Choose any card from the left to start a conversation about it — or ask about patterns across all of them.</p>
    </div>
  </div>

</div>

<script>
const MOMENTS = [
  {id:0,cat:"framework",title:"Clarity of thought is the only meta-skill",desc:"Reframed bad AI output as a personal skill issue — not a model failure. Messy prompts mirror messy thinking. The AI can only be as clear as you are.",detail:"Every prompting technique (persona, context, chain-of-thought) forces you to sharpen your own thinking before the model ever sees it. This is the unifying insight behind all prompt engineering.",source:"Strategic AI Prompting Guide · Drive",impact:"★★★★★"},
  {id:1,cat:"framework",title:"Permission to fail stops hallucinations",desc:"Instructing the AI to say 'I don't know' when context doesn't support an answer overrides its default behavior of inventing plausible-sounding fiction.",detail:"The model hallucinates because it has no acceptable alternative. Giving it one — explicit permission to fail — collapses the hallucination rate without any model tuning.",source:"Strategic AI Prompting Guide · Drive",impact:"★★★★★"},
  {id:2,cat:"framework",title:"The playoff method: adversarial validation",desc:"Pitting multiple AI personas against each other — draft, brutal critique, forced synthesis — weaponizes the model's editing superpower rather than its generative one.",detail:"Round 1: personas each draft. Round 2: an adversarial persona roasts both. Round 3: they collaborate on one final output. Single-pass generation can't compete.",source:"Strategic AI Prompting Guide · Drive",impact:"★★★★☆"},
  {id:3,cat:"framework",title:"Agentic silos: naming the real problem",desc:"Coined the term for what happens when teams adopt plugins ad-hoc — fragmented tooling creates context drift, token waste, and unreliable outcomes at scale.",detail:"The fix is a coherent orchestration model with a centralized kernel (orchestrator) rather than isolated utilities. Naming the antipattern is the first step to eliminating it.",source:"Enterprise Multi-Agent Orchestration · Drive",impact:"★★★★☆"},
  {id:4,cat:"framework",title:"Spec-driven dev with adversarial councils",desc:"Before writing a single line of code, a council of agents debates the spec. Multi-model adversarial review finds flaws a single pass misses.",detail:"The Manus-style planning workflow: Requirements → Design → Task extraction. The adversarial spec step (running a debate before implementation) is the enterprise guardrail.",source:"Enterprise Multi-Agent Orchestration · Drive",impact:"★★★★☆"},
  {id:5,cat:"technical",title:"RLS security audit at Intinc",desc:"Found and patched Row Level Security violations on invite_codes and api_keys tables in Supabase before they became live breaches.",detail:"This was a proactive security audit — not reactive incident response. Fixing access control at the data layer before it reached production is a Staff Engineer-tier catch.",source:"Intinc AppSec · memory",impact:"★★★★★"},
  {id:6,cat:"technical",title:"529+ unit tests before shelving Flash-n-Frame",desc:"Shipped production-grade React 19 / Express 5 / Cloudflare Workers with full CI/CD and Playwright E2E. Didn't cut corners even before making the hard call to shelve it.",detail:"Multi-provider AI routing via AI Gateway, Supabase RLS, full test coverage. The decision to shelve was strategic — the code quality proved the capability.",source:"Flash-n-Frame sprint log · memory",impact:"★★★★☆"},
  {id:7,cat:"technical",title:"INT Institutional Hub v1.0 shipped",desc:"Positioned Intinc as a Claude-native AI platform provider. Built the hub as a living system, not a one-off project — Option B architecture, live.",detail:"AIaaS / Managed Intelligence Provider model. The platform-as-product framing separates INT from commodity IT services.",source:"Intinc AI strategy · memory",impact:"★★★★☆"},
  {id:8,cat:"strategic",title:"'Ecosystem Shift: Agents Want Tools'",desc:"Authored a cross-platform intelligence brief covering Anthropic, Google, OpenAI, and Microsoft simultaneously — generating three branded outputs in one session.",detail:"Simultaneous outputs: INT-branded docx, Flash-n-Frame strategy extract, and newsletter research brief. One source brief, three target audiences, zero duplication of work.",source:"Ecosystem intelligence brief · memory",impact:"★★★★★"},
  {id:9,cat:"strategic",title:"Mapping 2,919 Claude Code marketplaces into four pillars",desc:"Turned a chaotic ecosystem of nearly 3,000 plugin entries into a navigable taxonomy — Spec-driven, Orchestration, Memory, and Security layers.",detail:"The taxonomy is the product. Raw directory → structured framework lets engineers make intentional architectural choices instead of random plugin selection.",source:"Claude Code Marketplace Analysis · Drive",impact:"★★★★☆"},
  {id:10,cat:"content",title:"The Prompt: three-tier audience architecture",desc:"Designed a weekly newsletter with three distinct editorial lenses on the same intelligence — Non-Tech, Tech Dept, and AI Team.",detail:"The tier structure is the innovation. Most newsletters write for one audience and lose the rest. This architecture serves 50–200 engineers at INT without condescending or overwhelming anyone.",source:"The Prompt newsletter · memory",impact:"★★★★★"},
  {id:11,cat:"content",title:"AI prompting as organizational competency",desc:"Wrote the argument that prompt engineering isn't a tech trick — it's a clarity-of-thought discipline that belongs in every knowledge worker's toolkit.",detail:"The framing that makes this land with non-technical audiences: prompting is about precision of thought, not machine manipulation. That's what makes it teachable.",source:"Strategic AI Prompting Guide · Drive",impact:"★★★★☆"}
];

const CATS = {
  all:{label:"All",color:"#888"},
  framework:{label:"Framework",color:"#6B5EAD"},
  technical:{label:"Technical",color:"#2E9E6B"},
  strategic:{label:"Strategic",color:"#B87333"},
  content:{label:"Content",color:"#3B7EC2"}
};

const SUGGESTED = [
  "What's the pattern across all of these?",
  "Which moment is most underrated?",
  "How does this connect to the memoir?",
  "What would this look like as a chapter?",
  "Where's the biggest gap here?"
];

let selectedMoment = null;
let activeFilter = "all";
let chatHistory = [];
let isLoading = false;

const SYSTEM_PROMPT = `You are Kyle Rosebrook's thinking partner, embedded in a personal intelligence dashboard built to explore his most significant conceptual moments. Kyle is approaching 40, a self-taught Staff Engineer, founder of FlashFusion and Chaos Club Co., and writing a literary memoir about reconstructing a self after traumatic brain injury and addiction.

Here are all 12 documented brilliant moments, with full context:

${MOMENTS.map(m => `[${m.id}] "${m.title}" (${m.cat})
Description: ${m.desc}
Deep context: ${m.detail}
Source: ${m.source}
Impact: ${m.impact}`).join('\n\n')}

Key context about Kyle:
- His defining skill is diagnosing: reading rooms (bartending), reading processes (QC), reading systems (engineering). This diagnostic instinct is his authentic differentiator.
- He has built 240+ MCP tool configurations as externalized cognition — external scaffolding for a brain that can't always be trusted after TBI.
- He is building Chaos Club Co.: a mental health peer support platform. Its philosophy — "no masks required, no perfection expected" — is an artifact of his own experience.
- His memoir working thesis: how does someone rebuild agency not through recovering what was lost, but constructing what never existed?
- He writes with direct, technical, metaphor-heavy prose. Strategic profanity. No performance of vulnerability or toughness.
- He has a daughter, Kinsley. The memoir is ultimately a letter to her.

When a specific moment is selected, you have context about it. Be sharp, direct, and genuinely useful. Don't smooth rough edges. Ask good questions. Find the connection to the memoir when it's real — don't force it. Kyle doesn't need validation, he needs thinking partnership.`;

function catColor(cat){ return CATS[cat]?.color || "#888" }
function catLabel(cat){ return CATS[cat]?.label || cat }

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = Object.entries(CATS).map(([k,v])=>`
    <button class="fp ${k===activeFilter?'active':''}" onclick="setFilter('${k}')">${v.label}</button>
  `).join('');
}

function renderList(){
  const el = document.getElementById('momentsList');
  const list = activeFilter==='all' ? MOMENTS : MOMENTS.filter(m=>m.cat===activeFilter);
  if(!list.length){ el.innerHTML='<div class="no-results">No moments in this category</div>'; return; }
  el.innerHTML = list.map(m=>`
    <div class="moment-card ${selectedMoment?.id===m.id?'selected':''}" onclick="selectMoment(${m.id})">
      <div class="mc-top">
        <div class="cat-row">
          <div class="cat-dot" style="background:${catColor(m.cat)}"></div>
          <span class="cat-label" style="color:${catColor(m.cat)}">${catLabel(m.cat)}</span>
        </div>
        <span class="stars">${m.impact}</span>
      </div>
      <div class="mc-title">${m.title}</div>
      <div class="mc-desc">${m.desc}</div>
      <div class="mc-source">${m.source}</div>
    </div>
  `).join('');
}

function setFilter(cat){
  activeFilter = cat;
  renderFilters();
  renderList();
}

function selectMoment(id){
  selectedMoment = MOMENTS[id];
  chatHistory = [];
  renderList();
  buildChatUI();
  const initialPrompt = `I've selected the moment: "${selectedMoment.title}". Give me a sharp one-paragraph take on why this matters — especially in the context of the memoir. Then ask me one good question about it.`;
  sendMessage(null, initialPrompt);
}

function buildChatUI(){
  const right = document.getElementById('rightPanel');
  right.innerHTML = `
    <div class="chat-header">
      <div class="selected-indicator">
        <div class="sel-cat" style="color:${catColor(selectedMoment.cat)}">${catLabel(selectedMoment.cat)}</div>
        <div class="sel-title">${selectedMoment.title}</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="suggested-chips" id="chips">
      ${SUGGESTED.map(s=>`<button class="chip" onclick="useChip('${s.replace(/'/g,"\\'")}')"><span style="font-size:11px;opacity:.5">↗</span> ${s}</button>`).join('')}
    </div>
    <div class="input-row">
      <textarea class="chat-input" id="chatInput" placeholder="Ask anything about this moment..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendFromInput()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  `;
}

function autoResize(el){
  el.style.height='42px';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendFromInput(); }
}

function useChip(text){
  sendMessage(text);
}

function sendFromInput(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || isLoading) return;
  input.value='';
  input.style.height='42px';
  sendMessage(text);
}

function addMessage(role, content){
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-role">${role==='user'?'You':'Claude'}</div>
    <div class="msg-bubble">${content.replace(/\n/g,'<br>')}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function showTyping(){
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className='msg assistant';
  div.id='typing';
  div.innerHTML=`<div class="msg-role">Claude</div><div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping(){
  const t = document.getElementById('typing');
  if(t) t.remove();
}

async function sendMessage(displayText, apiText){
  if(isLoading) return;
  isLoading = true;
  const btn = document.getElementById('sendBtn');
  if(btn) btn.disabled = true;

  const userText = apiText || displayText;
  if(displayText) addMessage('user', displayText);

  chatHistory.push({role:'user', content: selectedMoment
    ? `[Context: currently viewing moment "${selectedMoment.title}" — ${selectedMoment.desc}\nDeep context: ${selectedMoment.detail}]\n\n${userText}`
    : userText
  });

  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: SYSTEM_PROMPT,
        messages: chatHistory
      })
    });
    const data = await res.json();
    const reply = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') || 'No response received.';
    removeTyping();
    addMessage('assistant', reply);
    chatHistory.push({role:'assistant', content: reply});
  } catch(e){
    removeTyping();
    addMessage('assistant', `Something went wrong: ${e.message}`);
  }

  isLoading = false;
  if(btn) btn.disabled = false;
  const inp = document.getElementById('chatInput');
  if(inp) inp.focus();
}

renderFilters();
renderList();
</script>
</body>
</html>
