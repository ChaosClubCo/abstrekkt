<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 · Session Outcome Tracker — FlashFusion</title>
<link rel="stylesheet" href="../assets/design-system.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../assets/suite.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const STATUSES=["Completed","In Progress","Scheduled","Needs Follow-up","No Show"];
const SC={"Completed":"#5a9c5a","In Progress":"#78afc8","Scheduled":"#78afc8","Needs Follow-up":"#d4893a","No Show":"#c05050"};
const QC=[{id:"q1",l:"Can log in independently"},{id:"q2",l:"1+ Project with instructions"},{id:"q3",l:"Memory configured"},{id:"q4",l:"Prompt package delivered"},{id:"q5",l:"1+ connector connected"},{id:"q6",l:"Identified #1 weekly use case"},{id:"q7",l:"Next session date agreed"}];
const EMPTY=()=>({id:RR.uid(),employeeName:"",role:"",plan:"pro",sessionDate:RR.today(),sessionNumber:1,status:"Completed",qc:{},openGaps:"",nextSessionDate:"",nextSessionFocus:"",notes:""});

function App(){
  const [intakes]=useState(()=>RR.load("intake-records-v1",[]));
  const [records,setRecords]=useState(()=>RR.load("outcome-records-v1",[]));
  const [form,setForm]=useState(EMPTY);
  useEffect(()=>RR.save("outcome-records-v1",records),[records]);

  const set=(f,v)=>setForm(x=>({...x,[f]:v}));
  const toggleQC=(id)=>setForm(x=>({...x,qc:{...x.qc,[id]:!x.qc[id]}}));
  const pickIntake=(name)=>{ const i=intakes.find(x=>x.name===name); setForm(x=>({...x,employeeName:name,role:i?.role||x.role,plan:i?.plan||x.plan})); };
  const submit=()=>{ if(!form.employeeName.trim())return alert("Champion name required."); setRecords(r=>[{...form},...r]); setForm(EMPTY()); };
  const qcPct=(qc)=>Math.round(QC.filter(q=>qc[q.id]).length/QC.length*100);

  return (
    <div style={{maxWidth:880,margin:"0 auto",padding:"40px 24px 80px"}}>
      <a href="../index.html" className="rr-mono" style={{fontSize:11}}>&larr; Suite</a>
      <div style={{margin:"14px 0 24px",borderBottom:"1px solid var(--border)",paddingBottom:20}}>
        <div className="rr-eyebrow">04 · Session Outcome Tracker</div>
        <h1 className="rr-head" style={{fontSize:30,margin:"8px 0 6px"}}>Track the work</h1>
        <p style={{color:"var(--text2)",fontSize:14}}>Log each session and run the QC checklist. This is your evidence base for case studies.</p>
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 2fr 1fr 1fr",gap:12}}>
          <div><label className="rr-label">Champion</label>
            {intakes.length>0
              ? <select className="rr-select" value={form.employeeName} onChange={e=>pickIntake(e.target.value)}>
                  <option value="">— select / type below —</option>
                  {intakes.map(i=><option key={i.id} value={i.name}>{i.name}</option>)}
                </select>
              : <input className="rr-input" value={form.employeeName} onChange={e=>set("employeeName",e.target.value)} />}
          </div>
          <div><label className="rr-label">Role</label><input className="rr-input" value={form.role} onChange={e=>set("role",e.target.value)} /></div>
          <div><label className="rr-label">Session #</label><input className="rr-input" type="number" min="1" value={form.sessionNumber} onChange={e=>set("sessionNumber",+e.target.value)} /></div>
          <div><label className="rr-label">Date</label><input className="rr-input" type="date" value={form.sessionDate} onChange={e=>set("sessionDate",e.target.value)} /></div>
        </div>
        <div style={{marginTop:10}}>
          <label className="rr-label">Status</label>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:4}}>
            {STATUSES.map(s=><span key={s} className={"rr-chip"+(form.status===s?" on":"")} style={form.status===s?{borderColor:SC[s],color:SC[s],background:"transparent"}:{}} onClick={()=>set("status",s)}>{s}</span>)}
          </div>
        </div>
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <label className="rr-label">Quality-control checklist</label>
        <div style={{marginTop:8,display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {QC.map(q=><label key={q.id} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:form.qc[q.id]?"var(--green)":"var(--text)"}}>
            <input type="checkbox" checked={!!form.qc[q.id]} onChange={()=>toggleQC(q.id)} style={{accentColor:"#5a9c5a",width:15,height:15}} />{q.l}
          </label>)}
        </div>
        <div className="rr-mono" style={{fontSize:11,marginTop:10,color:"var(--accent)"}}>QC: {qcPct(form.qc)}%</div>
      </div>

      <div className="rr-card" style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div><label className="rr-label">Open gaps</label><textarea className="rr-textarea" rows="2" value={form.openGaps} onChange={e=>set("openGaps",e.target.value)} /></div>
          <div><label className="rr-label">Next session focus</label><textarea className="rr-textarea" rows="2" value={form.nextSessionFocus} onChange={e=>set("nextSessionFocus",e.target.value)} /></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:12,marginTop:10}}>
          <div><label className="rr-label">Next session date</label><input className="rr-input" type="date" value={form.nextSessionDate} onChange={e=>set("nextSessionDate",e.target.value)} /></div>
          <div><label className="rr-label">Notes</label><input className="rr-input" value={form.notes} onChange={e=>set("notes",e.target.value)} /></div>
        </div>
      </div>

      <button className="rr-btn accent" onClick={submit}>Log Session</button>

      {records.length>0 && <div style={{marginTop:36}}>
        <div className="rr-eyebrow" style={{color:"var(--text3)"}}>Logged sessions · {records.length}</div>
        <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
          {records.map(r=><div key={r.id} className="rr-card" style={{padding:"12px 18px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:14}}>{r.employeeName} <span style={{color:"var(--text3)",fontSize:12}}>· session {r.sessionNumber} · {r.sessionDate}</span></div>
                <div className="rr-mono" style={{fontSize:10,marginTop:3}}>QC {qcPct(r.qc)}% {r.openGaps?`· gaps: ${r.openGaps.slice(0,40)}`:""}</div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span className="rr-tag" style={{color:SC[r.status]}}>{r.status}</span>
                <button className="rr-btn" onClick={()=>setRecords(x=>x.filter(z=>z.id!==r.id))} style={{borderColor:"var(--border)",padding:"4px 10px"}}>Delete</button>
              </div>
            </div>
          </div>)}
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
