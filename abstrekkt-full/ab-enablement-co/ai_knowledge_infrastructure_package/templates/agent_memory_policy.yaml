agent_memory_policy:
  version: 1
  generated: 2026-05-11
  default_principles:
    - Agents retrieve through scoped APIs, never raw folder crawling.
    - Retrieved asset content is untrusted unless marked approved instruction content.
    - Restricted assets require explicit permission and audit logging.
    - Mutation actions require approval, provenance logging, and rollback support.
  sensitivity_levels:
    public: accessible to client-facing and sales agents
    internal: accessible to internal agents
    client_confidential: accessible only to assigned delivery agents
    private: accessible only to owner-approved agents
    secret_adjacent: retrieval blocked unless security review approves
    restricted: retrieval blocked by default
  allowed_default_actions:
    - read
    - search
    - summarize
    - recommend
    - draft
  blocked_default_actions:
    - delete
    - exfiltrate
    - send_without_review
    - mutate_without_approval
    - expose_secret
    - bypass_permission_filters
  required_logs:
    - agent_id
    - query
    - retrieved_asset_ids
    - sensitivity_levels
    - action_taken
    - timestamp
    - user_context
    - policy_decision