# FlashFusion / Claude Managed Agents — deploy batch
# Schema: managed-agents-2026-04-01 (verified live 2026-07-18 against
#   https://platform.claude.com/docs/en/managed-agents/{quickstart,agent-setup,tools,mcp-connector,permission-policies})
#
# HOW TO READ THIS FILE
# Each agent below is COMPLETE and correct against the real, fetched schema —
# no placeholder fields. Where I could not verify a real MCP endpoint, the
# agent ships with its built-in toolset only and a comment explaining the gap,
# rather than a guessed URL. Kyle's own note in kyle_todo_v8.html is the reason:
# "mcp_servers name must exactly match mcp_toolset reference — binds silently
# wrong if they differ." A wrong URL fails the same way a wrong name does —
# silently — so an unverified endpoint is omitted, not guessed.
#
# IMPORTANT DISTINCTION: "assumed-ready" below means the MCP has a real,
# official hosted endpoint (verified via web search + doc fetch), NOT that
# Kyle has already authorized it on platform.claude.com. OAuth authorization
# for each MCP server happens per-agent on the Managed Agents platform itself
# and is separate from — and NOT the same as — which connectors are live in
# any given Claude.ai/Cowork chat session. Deploying each agent below will
# prompt an OAuth flow the first time its MCP server is used.
#
# DEPLOY: paste each agent block into `ant beta:agents create` (CLI) or the
# platform.claude.com agent builder. Validate ONE end-to-end (Weekly Status
# Report Builder, since it has no external MCP dependency) before batch-
# deploying the rest, per kyle_todo_v8.html's own instruction.

# ============================================================
# BATCH 1 — source: kyle_todo_v8.html, "agents-ready" task,
# priority order as written there. [SOURCED]
# ============================================================

# --- 1. Weekly Status Report Builder -------------------------------------
# No single external system named in the source doc — built as a synthesis
# agent over whatever the operator (Kyle) feeds it each week, using its own
# read/write/web tools. This is the one to validate end-to-end first.
name: "Weekly Status Report Builder"
model:
  id: "claude-sonnet-4-6"
system: |
  You are FlashFusion's Weekly Status Report Builder. Given raw status notes,
  task lists, and workflow health summaries pasted into the session, produce
  a single structured weekly status report: what shipped, what's blocked,
  what's at risk, and next week's top 3 priorities. Never invent a status —
  if a system's state wasn't provided this week, list it as "not reported"
  rather than guessing. Cite the source note for every claim you make.
description: "Synthesizes weekly status across FlashFusion/INT workstreams into one structured report. No external MCP required — operates on input provided in-session."
tools:
  - type: "agent_toolset_20260401"
    default_config:
      permission_policy:
        type: "always_allow"
    configs:
      - name: "write"
        permission_policy:
          type: "always_ask"
      - name: "edit"
        permission_policy:
          type: "always_ask"
      - name: "bash"
        permission_policy:
          type: "always_ask"
mcp_servers: []
skills: []
metadata:
  domain: "Ops"
  batch: "1"
  source: "kyle_todo_v8.html#agents-ready"

